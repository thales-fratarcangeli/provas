5.3 Renda fixa digital", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma plataforma oferece um “título de renda fixa digital”: uma dívida de empresa representada por tokens em blockchain, com taxa prefixada. O cliente pergunta se a tokenização deixa o investimento sem risco. A resposta correta é:", "alternativas": ["Não. A tokenização muda a forma de registro e negociação, mas o investidor continua exposto ao risco de crédito do emissor, ao risco de liquidez e a riscos tecnológicos e da plataforma", "Não, mas o único risco é o de oscilação do bitcoin, que serve de lastro para todos os títulos digitais", "Sim. Títulos tokenizados são garantidos pelo Tesouro Nacional", "Sim. Por estar em blockchain, o título fica automaticamente garantido pelo FGC"], "correta": 0, "explicacao": "Renda fixa digital é a emissão ou representação de títulos de dívida em formato tokenizado, o que pode reduzir custos e prazos e permitir investimentos menores. A essência do ativo, porém, não muda: há risco de crédito do emissor e risco de liquidez, aos quais se somam riscos operacionais e tecnológicos. A tokenização não cria cobertura do FGC nem garantia do Tesouro."}, {"id": "M4-057", "modulo": 4, "topico": "4.4.5.4 ETF de bitcoin", "dificuldade": "facil", "tipo": "mc", "enunciado": "Um cliente quer ter exposição ao bitcoin, mas não quer abrir conta em corretora de criptoativos nem guardar chaves de carteira digital. Uma alternativa compatível com esse desejo é:", "alternativas": ["aplicar em um CDB indexado ao preço do bitcoin com garantia do FGC sobre a variação do criptoativo", "comprar títulos do Tesouro Direto atrelados ao bitcoin", "comprar cotas de um ETF de bitcoin negociado na B3, por meio de sua corretora de valores, entendendo que o produto acompanha a alta volatilidade do bitcoin", "depositar em poupança digital lastreada em bitcoin"], "correta": 2, "explicacao": "O ETF de bitcoin é um fundo de índice cujas cotas são negociadas na bolsa como ações, permitindo exposição ao criptoativo sem que o investidor precise lidar com carteiras e chaves; a custódia do ativo é feita pelos prestadores do fundo. O investimento continua muito volátil, sem garantia do FGC. Não existem títulos públicos ou poupança atrelados ao bitcoin."}, {"id": "M4-058", "modulo": 4, "topico": "4.4.5.5 ETF de novas moedas digitais", "dificuldade": "medio", "tipo": "mc", "enunciado": "A B3 lista ETFs que dão exposição a criptoativos além do bitcoin, como ethereum, solana e XRP, e também ETFs que replicam índices com uma cesta de criptoativos. Para um cliente moderado que pergunta sobre esses produtos, a orientação adequada é:", "alternativas": ["são garantidos pela B3, que recompra as cotas em caso de queda", "são equivalentes a fundos de renda fixa, pois a cota é negociada em bolsa", "são produtos de baixo risco, pois a diversificação entre criptoativos elimina a volatilidade", "são produtos de risco elevado, em geral ainda mais voláteis que o bitcoin, e só devem ser oferecidos se forem compatíveis com o perfil de suitability e em parcela adequada da carteira"], "correta": 3, "explicacao": "ETFs de outras moedas digitais permitem acesso, via bolsa, a criptoativos como ethereum e solana ou a cestas desses ativos. Esses ativos costumam ter volatilidade ainda maior e menor histórico que o bitcoin; a cesta reduz o risco específico de um só ativo, mas não elimina a alta volatilidade do mercado cripto. A oferta deve respeitar o suitability, e a B3 não garante as cotas."}, {"id": "M4-059", "modulo": 4, "topico": "4.4.5.6 Moeda Digital do Banco Central (CBDC) – Drex", "dificuldade": "facil", "tipo": "mc", "enunciado": "Um cliente acredita que o Drex é “a criptomoeda do governo, como o bitcoin”. A correção adequada é que o Drex:", "alternativas": ["é uma criptomoeda descentralizada cujo valor flutua conforme a oferta e a procura", "é o projeto de moeda digital e plataforma de infraestrutura do Banco Central (CBDC), que representa o real em formato digital e não é um criptoativo de preço livre como o bitcoin", "é uma stablecoin privada emitida por bancos e lastreada em dólar", "é um novo nome para o Pix, sem nenhuma diferença em relação a ele"], "correta": 1, "explicacao": "CBDC é a moeda digital emitida pelo banco central, e o Drex é o projeto brasileiro nessa linha, ligado à infraestrutura do Banco Central. Ele representa a moeda soberana (o real), com valor equivalente, e não um ativo de preço livre como o bitcoin, que é descentralizado e sem emissor. Também não se confunde com o Pix, que é um arranjo de pagamentos instantâneos."}, {"id": "M4-060", "modulo": 4, "topico": "4.4.5.6 Moeda Digital do Banco Central (CBDC) – Drex: estratégia atual", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Em 2025, o Banco Central anunciou mudança de estratégia no projeto Drex. Qual alternativa descreve corretamente essa mudança?", "alternativas": ["A primeira entrega passou a priorizar uma solução sem uso de blockchain/DLT, voltada a facilitar o uso e a verificação de ativos como garantia em operações de crédito (reconciliação de gravames), deixando a tokenização em DLT para uma etapa posterior", "O Banco Central decidiu emitir o Drex em uma blockchain pública, aberta a qualquer participante", "O Drex passou a ser distribuído diretamente às pessoas físicas em carteiras digitais do BC, substituindo o papel-moeda", "O projeto foi encerrado definitivamente, e o Banco Central passou a recomendar o uso de stablecoins privadas"], "correta": 0, "explicacao": "Depois das fases piloto, que testaram a tokenização em rede DLT e encontraram desafios, sobretudo de privacidade, o BC reorganizou o projeto: a primeira etapa passou a focar em uma solução centralizada, sem DLT, para reconciliação de gravames, isto é, verificar de forma integrada se ativos dados em garantia já estão comprometidos, facilitando o crédito. O uso de blockchain e a tokenização ficaram para fase futura; o projeto não foi encerrado nem substitui o dinheiro físico."}, {"id": "M4-061", "modulo": 4, "topico": "4.5.1.1 Open Finance – conceitos e aplicabilidade", "dificuldade": "facil", "tipo": "mc", "enunciado": "Uma cliente recebe, no aplicativo do banco B, um convite para trazer os dados da conta que tem no banco A via Open Finance. Ela pergunta como isso funciona. A resposta correta é:", "alternativas": ["O banco B pode acessar os dados dela no banco A automaticamente, sem autorização, por ser participante do sistema", "O compartilhamento é obrigatório para todos os correntistas a partir do momento em que abrem a conta", "Para compartilhar os dados, ela precisa informar ao banco B a senha que usa no banco A", "O compartilhamento só ocorre com o consentimento dela, para finalidades e dados que ela escolher, de forma padronizada e segura, e ela pode revogar o consentimento a qualquer momento"], "correta": 3, "explicacao": "No Open Finance, o cliente é o dono dos dados: o compartilhamento de dados e serviços entre instituições autorizadas depende de consentimento prévio, com finalidade definida, e é feito por interfaces padronizadas e seguras, sem compartilhar senhas. O consentimento pode ser revogado a qualquer momento, e a participação do cliente é voluntária."}, {"id": "M4-062", "modulo": 4, "topico": "4.5.1.1.1 Credit score", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um jovem trabalhador autônomo tem pouco histórico de crédito e recebe propostas de empréstimo com juros altos. Ele recebe seus pagamentos e paga suas contas em dia em uma conta digital. Como o Open Finance pode ajudá-lo?", "alternativas": ["O Open Finance obriga os bancos a conceder crédito com a taxa mínima de mercado a quem compartilha dados", "O Open Finance apaga registros negativos do cliente nos birôs de crédito", "Ao compartilhar seus dados de movimentação, outras instituições podem avaliar melhor sua capacidade de pagamento, o que pode melhorar seu credit score e as condições de crédito oferecidas", "O Open Finance substitui a análise de crédito pela aprovação automática de qualquer pedido"], "correta": 2, "explicacao": "O credit score é uma pontuação que estima a probabilidade de o cliente pagar em dia. Com mais dados, como fluxo de recebimentos e pagamentos, as instituições conseguem avaliar melhor quem tem pouco histórico formal, o que pode resultar em crédito mais adequado e mais barato. Não há obrigação de conceder crédito, aprovação automática nem exclusão de registros negativos."}, {"id": "M4-063", "modulo": 4, "topico": "4.5.1.1.2 Vantagens sob a ótica de adimplência financeira", "dificuldade": "medio", "tipo": "mc", "enunciado": "Sob a ótica da adimplência, qual efeito positivo se espera do Open Finance no mercado de crédito?", "alternativas": ["Aumento automático dos limites de crédito de todos os clientes, independentemente da renda", "Análises de crédito mais precisas, com ofertas mais compatíveis com a capacidade de pagamento de cada cliente, o que tende a reduzir a inadimplência e beneficiar bons pagadores com melhores condições", "Eliminação completa da inadimplência, pois o Banco Central passa a garantir os empréstimos", "Fim das garantias em operações de crédito, que se tornam desnecessárias"], "correta": 1, "explicacao": "Com mais informações sobre renda, gastos e compromissos do cliente, as instituições reduzem a assimetria de informação, conseguem oferecer valores e parcelas mais adequados e precificar melhor o risco. Isso tende a reduzir a inadimplência e a premiar bons pagadores, mas não elimina o risco de crédito nem cria garantia pública."}, {"id": "M4-064", "modulo": 4, "topico": "4.5.1.1.3 Marco regulatório – Resolução Conjunta nº 1/2020 (BCB e CMN)", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Sobre a Resolução Conjunta nº 1/2020, editada pelo CMN e pelo Banco Central, que instituiu o sistema hoje chamado Open Finance, é correto afirmar que:", "alternativas": ["estabeleceu o compartilhamento padronizado de dados e serviços mediante consentimento do cliente, com participação obrigatória das instituições dos segmentos S1 e S2 e participação voluntária das demais instituições autorizadas", "tornou obrigatória a participação de todos os clientes pessoa física, que passaram a ter seus dados compartilhados automaticamente", "autorizou a cobrança de tarifa do cliente a cada compartilhamento de dados", "transferiu à CVM a supervisão de todos os dados bancários compartilhados"], "correta": 0, "explicacao": "A Resolução Conjunta nº 1/2020 criou o Open Banking, depois ampliado para Open Finance, com compartilhamento padronizado de dados e serviços por meio de interfaces, sempre com consentimento do cliente e sem custo para ele. A participação é obrigatória para os conglomerados dos segmentos S1 e S2 e voluntária para as demais instituições, e a regulação cabe ao CMN e ao Banco Central."}, {"id": "M4-065", "modulo": 4, "topico": "4.5.1.1 Open Finance – fases e serviços", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Uma fintech quer permitir que seus usuários paguem contas via Pix sem sair do aplicativo dela, debitando diretamente a conta que mantêm em outro banco, mediante autorização. No Open Finance, essa funcionalidade corresponde ao serviço de:", "alternativas": ["portabilidade de salário", "iniciação de transação de pagamento, realizada por um iniciador de pagamento autorizado", "compartilhamento de dados de produtos e serviços padronizados das instituições", "credenciamento de lojistas para aceitar cartões"], "correta": 1, "explicacao": "O Open Finance não envolve só dados: inclui serviços como a iniciação de transação de pagamento, em que um iniciador autorizado comanda, com consentimento do cliente, um pagamento a partir da conta mantida em outra instituição, sem que o iniciador detenha os recursos. As fases incluíram dados abertos das instituições, dados de clientes, serviços (iniciação de pagamento e encaminhamento de propostas de crédito) e dados de investimentos, câmbio, seguros e previdência."}, {"id": "M4-066", "modulo": 4, "topico": "4.5.2 Consequências do Open Finance no mercado financeiro brasileiro", "dificuldade": "medio", "tipo": "mc", "enunciado": "Qual das alternativas descreve uma consequência esperada do Open Finance para o mercado financeiro brasileiro?", "alternativas": ["Concentração de todos os clientes nos maiores bancos, que passam a ter acesso exclusivo aos dados", "Fim da necessidade de regulação, pois o próprio mercado passa a definir as regras de segurança", "Proibição de fintechs atuarem em crédito e pagamentos", "Aumento da concorrência, com redução da dependência do cliente em relação a uma única instituição, estímulo a novos modelos de negócio e pressão por melhores preços e serviços"], "correta": 3, "explicacao": "Ao permitir que o cliente leve seus dados e comande serviços entre instituições, o Open Finance reduz a assimetria de informação que favorecia instituições grandes e incumbentes, estimulando concorrência, inovação, ofertas personalizadas e mobilidade dos clientes. Ele exige regulação e padrões de segurança, e favorece, em vez de impedir, a entrada de fintechs."}, {"id": "M4-067", "modulo": 4, "topico": "4.5.3.1 Open Investment – vantagens e desvantagens", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente tem aplicações em três instituições e autoriza o compartilhamento dos dados de investimentos com o seu assessor por meio do ecossistema aberto. Qual alternativa apresenta corretamente uma vantagem e uma desvantagem do Open Investment?", "alternativas": ["Vantagem: rentabilidade garantida das aplicações; desvantagem: perda da cobertura do FGC", "Vantagem: isenção de imposto de renda; desvantagem: impossibilidade de resgatar antes do vencimento", "Vantagem: visão consolidada da carteira, permitindo recomendações mais adequadas; desvantagem: maior exposição a riscos de segurança e privacidade dos dados e a possível assédio comercial", "Vantagem: dispensa do suitability; desvantagem: obrigação de concentrar tudo em uma instituição"], "correta": 2, "explicacao": "O Open Investment amplia ao mercado de investimentos a lógica do Open Finance: com dados consolidados, o profissional enxerga a carteira completa, compara custos e recomenda melhor, e o investidor ganha poder de negociação. Os pontos de atenção incluem segurança cibernética, privacidade, uso adequado do consentimento e possível excesso de ofertas. Não há garantia de rentabilidade, e o suitability continua obrigatório."}, {"id": "M4-068", "modulo": 4, "topico": "4.5.3.2 Resoluções CVM 209, 210 e 229 – Portabilidade de valores mobiliários", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma investidora quer transferir suas ações e cotas de ETF de uma corretora para outra, porque a nova oferece melhor atendimento. Com base nas regras de portabilidade de valores mobiliários da CVM (Resoluções 209 e 210, ajustadas pela 229), em vigor desde janeiro de 2026, é correto afirmar que:", "alternativas": ["o pedido só pode ser feito presencialmente na corretora de origem, que pode recusá-lo por razões comerciais", "ela precisa vender os ativos na corretora atual e recomprá-los na nova, pagando imposto sobre eventual ganho", "a portabilidade só é permitida para títulos públicos federais", "ela pode pedir a portabilidade, inclusive na instituição de destino, e os ativos são transferidos sem precisar vendê-los, evitando resgate, novo investimento e custos desnecessários"], "correta": 3, "explicacao": "As regras de portabilidade da CVM tratam a transferência de valores mobiliários entre intermediários e custodiantes como direito do investidor, com procedimentos e prazos padronizados e interfaces digitais. O pedido pode ser feito na origem, no destino ou no depositário central, e a transferência de custódia não exige vender os ativos, o que evita resgates, custos e tributação que ocorreriam numa venda seguida de recompra."}, {"id": "M4-069", "modulo": 4, "topico": "4.5.3.2 Resolução CVM 229 – ajustes na portabilidade", "dificuldade": "dificil", "tipo": "mc", "enunciado": "A Resolução CVM 229, de maio de 2025, fez ajustes nas regras de portabilidade de valores mobiliários. Entre essas mudanças está:", "alternativas": ["a revogação da portabilidade, que passou a depender de negociação livre entre as instituições", "a transferência da competência sobre portabilidade de valores mobiliários para o Banco Central", "o adiamento da entrada em vigor das regras para 2 de janeiro de 2026 e a dispensa, para intermediários e custodiantes com menos de 200 clientes pessoas físicas, de oferecer interface digital automatizada para os pedidos", "a obrigação de o investidor vender os ativos antes de transferi-los, para simplificar a operação"], "correta": 2, "explicacao": "A Resolução CVM 229 fez ajustes pontuais nas Resoluções 209 e 210: adiou o início da vigência para 2 de janeiro de 2026, dispensou instituições com menos de 200 clientes pessoas físicas de oferecer interface digital automatizada (com possibilidade de outras dispensas caso a caso) e esclareceu regras de portabilidade parcial. A portabilidade continua sendo direito do investidor e regulada pela CVM."}, {"id": "M4-070", "modulo": 4, "topico": "4.5.4.1 Open Insurance – conceitos", "dificuldade": "facil", "tipo": "mc", "enunciado": "Um cliente pergunta o que é o Open Insurance. A resposta correta é que se trata do:", "alternativas": ["sistema de compartilhamento padronizado de dados e serviços de seguros, previdência complementar aberta e capitalização, mediante consentimento do cliente, regulado no âmbito da Susep", "seguro obrigatório que todos os correntistas devem contratar ao aderir ao Open Finance", "seguro garantido pelo FGC para investimentos feitos por meio de fintechs", "sistema de pagamentos instantâneos das seguradoras, administrado pela B3"], "correta": 0, "explicacao": "O Open Insurance (Sistema de Seguros Aberto) aplica ao mercado supervisionado pela Susep a lógica do Open Finance: com consentimento, o cliente compartilha dados de apólices, planos de previdência aberta e capitalização entre sociedades participantes, podendo comparar ofertas e receber produtos mais adequados. Não é seguro obrigatório nem tem relação com o FGC."}, {"id": "M4-071", "modulo": 4, "topico": "4.5.4.2 Open Insurance – vantagens e desvantagens", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma motorista com bom histórico, sem sinistros há anos, autoriza o compartilhamento dos dados de seu seguro auto com outras seguradoras. Qual alternativa descreve corretamente uma vantagem e um ponto de atenção desse compartilhamento?", "alternativas": ["Vantagem: deixar de pagar prêmio por estar no sistema aberto; ponto de atenção: perda automática da cobertura atual", "Vantagem: receber ofertas personalizadas e possivelmente mais baratas, por ter perfil de risco comprovado; ponto de atenção: proteção dos dados pessoais e risco de uso indevido ou vazamento", "Vantagem: cobertura garantida pelo Banco Central; ponto de atenção: impossibilidade de revogar o consentimento", "Vantagem: receber indenização sem ocorrência de sinistro; ponto de atenção: obrigação de trocar de seguradora todo ano"], "correta": 1, "explicacao": "Com dados compartilhados, as seguradoras podem precificar melhor o risco, oferecer produtos sob medida e competir por bons clientes, o que favorece quem tem bom histórico. Entre as desvantagens e riscos estão a segurança e a privacidade das informações, que exigem cuidado com consentimentos e com a LGPD. O consentimento pode ser revogado e não há garantia do Banco Central."}, {"id": "M4-072", "modulo": 4, "topico": "4.6.1.1 IA Generativa – conceitos gerais", "dificuldade": "facil", "tipo": "mc", "enunciado": "Uma corretora passou a usar uma ferramenta que redige rascunhos de relatórios de mercado e resume documentos longos a partir de comandos em linguagem natural. Essa ferramenta é um exemplo de:", "alternativas": ["planilha eletrônica com fórmulas fixas programadas pelo usuário", "robô de atendimento com respostas exclusivamente pré-gravadas", "sistema de registro distribuído (blockchain)", "inteligência artificial generativa, capaz de criar novos conteúdos (textos, imagens, códigos) a partir de padrões aprendidos em grandes volumes de dados"], "correta": 3, "explicacao": "A IA generativa usa modelos treinados com grandes volumes de dados, como os grandes modelos de linguagem, para gerar conteúdo novo, como textos, resumos, imagens e códigos, em resposta a comandos. Diferencia-se de sistemas com regras fixas, que só executam respostas ou cálculos previamente programados."}, {"id": "M4-073", "modulo": 4, "topico": "4.6.1.2 IA Generativa – aplicabilidade", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma pessoa profissional de investimentos usa uma IA generativa para preparar um texto comparando fundos para um cliente. Qual é a conduta adequada?", "alternativas": ["Usar a recomendação da IA em substituição ao perfil de suitability do cliente", "Enviar o texto ao cliente sem revisão, pois a IA generativa não comete erros factuais", "Revisar e conferir as informações geradas, pois a IA pode produzir dados incorretos ou inventados, preservar dados sigilosos do cliente e manter a análise de suitability sob sua responsabilidade", "Inserir na ferramenta todos os dados pessoais e financeiros do cliente, sem verificar a política de privacidade, para obter respostas melhores"], "correta": 2, "explicacao": "A IA generativa aumenta a produtividade em textos, resumos e análises, mas pode gerar respostas incorretas com aparência convincente (as chamadas alucinações), além de envolver riscos de privacidade e de confidencialidade. A responsabilidade pela informação e pela adequação ao perfil do cliente continua sendo da instituição e da pessoa profissional, conforme as regras de suitability e de proteção de dados."}, {"id": "M4-074", "modulo": 4, "topico": "4.6.1.3 Modelos preditivos", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um banco usa um modelo de IA treinado com o histórico de milhares de clientes para estimar a probabilidade de cada novo solicitante atrasar o pagamento de um empréstimo. Esse tipo de aplicação é um:", "alternativas": ["modelo preditivo, que usa dados históricos para estimar a probabilidade de eventos futuros", "modelo generativo de imagens", "contrato inteligente autoexecutável", "sistema de liquidação de pagamentos em tempo real"], "correta": 0, "explicacao": "Modelos preditivos identificam padrões em dados históricos para estimar resultados futuros, como risco de inadimplência, risco de cancelamento de clientes, fraudes ou demanda. São muito usados em crédito e risco, e exigem cuidados com qualidade dos dados, vieses discriminatórios e monitoramento constante do desempenho."}, {"id": "M4-075", "modulo": 4, "topico": "4.6.2.1 IA Regenerativa – conceitos gerais", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Em um debate sobre tecnologia, fala-se em “IA regenerativa” como um passo além da IA generativa. Nesse sentido, a característica que costuma distinguir a IA regenerativa é:", "alternativas": ["a capacidade de apenas reproduzir respostas fixas previamente cadastradas, sem aprender com novos dados", "a capacidade de se aperfeiçoar continuamente, usando ciclos de retroalimentação para corrigir erros e ajustar os próprios modelos e resultados ao longo do tempo", "a dispensa de qualquer dado para funcionar, pois cria conhecimento do zero", "a obrigação de funcionar exclusivamente em blockchain pública"], "correta": 1, "explicacao": "Enquanto a IA generativa cria conteúdo novo a partir de padrões aprendidos, a chamada IA regenerativa enfatiza o refinamento contínuo: o sistema incorpora retroalimentação e novos dados para corrigir falhas, recalibrar modelos e melhorar seus próprios resultados, num ciclo de aprendizado permanente. Isso aumenta a adaptabilidade, mas exige governança e supervisão humana sobre as mudanças do modelo."}, {"id": "M4-076", "modulo": 4, "topico": "4.6.2.2 IA Regenerativa – aplicabilidade e modelos preditivos", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma instituição de pagamento usa um sistema antifraude que, a cada nova fraude confirmada, incorpora o caso ao aprendizado e recalibra automaticamente seus critérios para identificar golpes com padrões novos. O principal benefício e o principal cuidado dessa abordagem são:", "alternativas": ["benefício: dispensa de dados históricos; cuidado: necessidade de aprovação da CVM a cada ajuste", "benefício: eliminação total das fraudes; cuidado: nenhum, pois o modelo se corrige sozinho", "benefício: substituição das regras de prevenção à lavagem de dinheiro; cuidado: custo de energia elétrica", "benefício: adaptação rápida a novos padrões de fraude; cuidado: supervisão e validação contínuas para evitar desvios do modelo, vieses e bloqueios indevidos de clientes legítimos"], "correta": 3, "explicacao": "Sistemas que aprendem continuamente com retroalimentação, ideia associada à IA regenerativa, se adaptam bem a ambientes que mudam rápido, como fraudes e golpes. Como o modelo muda ao longo do tempo, é necessário governança: validar as recalibrações, monitorar desempenho, vieses e falsos positivos. Nenhum modelo elimina totalmente as fraudes nem substitui as obrigações regulatórias."}, {"id": "M4-077", "modulo": 4, "topico": "4.6.3.1 Atendimento com IA – chatbots", "dificuldade": "facil", "tipo": "mc", "enunciado": "Um banco implantou um chatbot para responder dúvidas frequentes de clientes 24 horas por dia. Qual prática é adequada nesse tipo de atendimento?", "alternativas": ["Impedir qualquer contato humano, para reduzir custos", "Usar o chatbot para recomendar investimentos de alto risco a todos os clientes, sem verificar o perfil", "Oferecer a possibilidade de encaminhar o cliente a um atendente humano quando o chatbot não resolver a demanda ou o assunto for complexo", "Coletar dados pessoais do cliente sem informar a finalidade do uso"], "correta": 2, "explicacao": "Chatbots são programas que conversam com clientes por texto ou voz, resolvendo demandas simples com rapidez e disponibilidade integral. Boas práticas incluem transparência sobre o uso do robô, encaminhamento para atendimento humano quando necessário, proteção de dados conforme a LGPD e respeito às regras de suitability em qualquer recomendação."}, {"id": "M4-078", "modulo": 4, "topico": "4.6.3.2 Atendimento com IA – assistentes virtuais", "dificuldade": "medio", "tipo": "mc", "enunciado": "Qual alternativa diferencia corretamente um assistente virtual inteligente de um chatbot simples baseado em regras?", "alternativas": ["O assistente virtual é sempre um atendente humano trabalhando remotamente", "O assistente virtual usa IA para entender a intenção do cliente, considerar o contexto e o histórico e executar tarefas personalizadas, enquanto o chatbot simples segue roteiros e respostas predefinidas", "O chatbot simples aprende sozinho com cada conversa, enquanto o assistente virtual só responde perguntas cadastradas", "Ambos são idênticos; a diferença é apenas o nome comercial"], "correta": 1, "explicacao": "Chatbots baseados em regras funcionam com fluxos e respostas pré-definidas e têm dificuldade com perguntas fora do roteiro. Assistentes virtuais com IA interpretam linguagem natural, mantêm contexto, acessam dados do cliente com autorização e executam tarefas, como agendar transferências ou mostrar a posição de investimentos, de forma personalizada."}, {"id": "M4-079", "modulo": 4, "topico": "4.6.3 Atendimento e suporte à clientela com IA – responsabilidade", "dificuldade": "medio", "tipo": "mc", "enunciado": "O assistente virtual de uma corretora sugeriu a um cliente de perfil conservador um fundo de ações alavancado. Sobre a responsabilidade nesse caso, é correto afirmar que:", "alternativas": ["a instituição continua responsável por garantir que as recomendações, inclusive as feitas por ferramentas automatizadas, sejam adequadas ao perfil do cliente", "a responsabilidade é exclusivamente do fornecedor do software de IA", "não há responsabilidade, pois recomendações automatizadas não estão sujeitas às regras de suitability", "o cliente é o único responsável, pois aceitou conversar com um robô"], "correta": 0, "explicacao": "O uso de chatbots e assistentes virtuais não afasta as obrigações regulatórias: a instituição responde pela adequação dos produtos recomendados ao perfil do cliente (suitability), pela clareza das informações e pela proteção de dados. Recomendar um produto alavancado a um conservador é inadequado, seja a recomendação feita por pessoa ou por sistema."}, {"id": "M4-080", "modulo": 4, "topico": "4.7.1 O que são as fintechs de hoje", "dificuldade": "facil", "tipo": "mc", "enunciado": "Um cliente pergunta o que é uma fintech. A melhor definição é:", "alternativas": ["qualquer banco que tenha site na internet", "empresa de tecnologia que, por ser inovadora, está dispensada de autorização do Banco Central", "empresa que usa tecnologia de forma intensiva para oferecer serviços financeiros, como pagamentos, crédito e investimentos, com modelos digitais e normalmente com menores custos", "fundo de investimento que aplica apenas em ações de empresas de tecnologia"], "correta": 2, "explicacao": "Fintechs são empresas que combinam finanças e tecnologia para oferecer serviços financeiros de forma digital, ágil e geralmente mais barata, atuando em pagamentos, crédito, investimentos, seguros e outros segmentos. Quando exercem atividade regulada, precisam de autorização do órgão competente, como o Banco Central ou a CVM."}, {"id": "M4-081", "modulo": 4, "topico": "4.7.2 Sandbox regulatório (BCB)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma startup desenvolveu um modelo inovador de serviço de pagamento que não se encaixa bem nas regras atuais e quer testá-lo com clientes reais de forma controlada. O instrumento do Banco Central adequado a esse objetivo é o:", "alternativas": ["Sistema de Informações de Crédito, que registra as operações de crédito do sistema financeiro", "Comitê de Política Monetária, que define a meta da taxa Selic", "Fundo Garantidor de Créditos, que cobre perdas de clientes de projetos experimentais", "sandbox regulatório, ambiente em que entidades selecionadas são autorizadas a testar projetos inovadores por prazo determinado, com regras específicas e acompanhamento do regulador"], "correta": 3, "explicacao": "O sandbox regulatório do Banco Central, regulamentado por normas do CMN e do BC desde 2020, permite que projetos inovadores na área financeira ou de pagamentos sejam testados por período limitado, em ambiente controlado, com requisitos regulatórios adaptados e supervisão. Isso ajuda o regulador a entender a inovação e as empresas a validar seus modelos."}, {"id": "M4-082", "modulo": 4, "topico": "4.7.2 Sandbox regulatório (CVM)", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Uma plataforma quer testar um modelo inovador de negociação de valores mobiliários tokenizados que esbarra em exigências da regulação atual. Sobre o sandbox regulatório da CVM, é correto afirmar que:", "alternativas": ["a CVM pode conceder autorização temporária, com dispensa de alguns requisitos regulatórios e condições e limites definidos, para que o modelo seja testado sob seu monitoramento", "participar do sandbox garante que a empresa receberá registro definitivo ao final do teste", "o sandbox da CVM dispensa a empresa de qualquer regra e fiscalização por tempo indeterminado", "o sandbox é administrado pelo Banco Central e serve apenas para instituições de pagamento"], "correta": 0, "explicacao": "O sandbox regulatório da CVM, hoje disciplinado pela Resolução CVM 29/2021, permite que participantes selecionados testem modelos de negócio inovadores no mercado de valores mobiliários com autorização temporária, dispensa de requisitos específicos e limites de atuação, sob acompanhamento da autarquia. A participação não garante registro definitivo e não elimina a fiscalização."}, {"id": "M4-083", "modulo": 4, "topico": "4.7.3 Fintechs – relação com o Open Finance", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma fintech de gestão financeira pessoal quer mostrar, em um único aplicativo, os saldos e gastos que seus usuários têm em vários bancos. Qual é a relação entre esse modelo de negócio e o Open Finance?", "alternativas": ["O Open Finance proíbe que fintechs recebam dados de clientes de bancos", "O Open Finance permite, com consentimento do usuário, que a fintech receba esses dados de forma padronizada e segura, viabilizando a consolidação das informações e a oferta de novos serviços", "A fintech precisa pedir aos clientes as senhas bancárias para acessar os dados pelo Open Finance", "A fintech pode acessar os dados sem consentimento, desde que não cobre pelo serviço"], "correta": 1, "explicacao": "O Open Finance reduz barreiras de entrada para fintechs, pois permite que, com consentimento do cliente, instituições participantes recebam dados e iniciem serviços por interfaces padronizadas. Isso viabiliza agregadores financeiros, ofertas de crédito mais precisas e iniciação de pagamentos, sem compartilhamento de senhas."}, {"id": "M4-084", "modulo": 4, "topico": "4.7.4 Regulação das fintechs – SCD e SEP", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Dois empreendedores querem criar fintechs de crédito. O primeiro quer emprestar apenas com capital próprio por meio de plataforma eletrônica; o segundo quer conectar, por plataforma eletrônica, pessoas que desejam emprestar a pessoas que desejam tomar crédito. Segundo a regulação do CMN, os modelos correspondem, respectivamente, a:", "alternativas": ["Sociedade de Empréstimo entre Pessoas (SEP) e Sociedade de Crédito Direto (SCD)", "banco múltiplo e cooperativa de crédito", "instituição de pagamento emissora de moeda eletrônica e subcredenciador", "Sociedade de Crédito Direto (SCD) e Sociedade de Empréstimo entre Pessoas (SEP)"], "correta": 3, "explicacao": "A SCD realiza operações de crédito exclusivamente com recursos próprios por meio de plataforma eletrônica, sem captar depósitos do público. A SEP faz a intermediação de empréstimos entre pessoas (peer-to-peer), conectando credores e devedores pela plataforma. Ambas são fintechs de crédito que dependem de autorização do Banco Central."}, {"id": "M4-085", "modulo": 4, "topico": "4.7.4 Regulação das fintechs – denominação", "dificuldade": "medio", "tipo": "mc", "enunciado": "Em 2025, CMN e Banco Central editaram norma sobre o nome usado por instituições autorizadas. Uma fintech autorizada apenas como instituição de pagamento, sem banco em seu grupo, quer usar a palavra “Bank” na marca. Segundo essa regra, ela:", "alternativas": ["precisa apenas de autorização da CVM para usar o termo", "não pode usar termos como “banco” ou “bank” em nome, marca ou canais, pois eles ficam reservados a instituições com licença bancária ou a grupos que tenham banco autorizado", "pode usar, desde que inclua no aplicativo um aviso de que não tem cobertura do FGC", "pode usar livremente, pois marcas não são reguladas pelo Banco Central"], "correta": 1, "explicacao": "A Resolução Conjunta nº 17/2025 vedou o uso de termos como “banco” e “bank” por instituições sem licença bancária, inclusive em marcas, domínios e redes sociais, para que o público não confunda fintechs, instituições de pagamento e financeiras com bancos. Instituições de grupos que tenham banco autorizado podem manter a denominação, e houve prazo para adaptação."}, {"id": "M4-086", "modulo": 4, "topico": "4.7.5 Desintermediação financeira", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma pequena empresa capta recursos diretamente com investidores pessoas físicas por meio de uma plataforma de investimento participativo (crowdfunding) regulada pela CVM, sem tomar empréstimo bancário. Esse movimento é um exemplo de:", "alternativas": ["desintermediação financeira, em que a tecnologia aproxima diretamente quem tem recursos de quem precisa deles, reduzindo o papel do banco como intermediário", "intermediação bancária tradicional, pois a plataforma atua como banco captando depósitos", "operação compromissada com lastro em títulos públicos", "política monetária expansionista conduzida pelo Banco Central"], "correta": 0, "explicacao": "Desintermediação ocorre quando poupadores e tomadores se conectam diretamente, sem que um banco capte os recursos e os empreste. Fintechs, plataformas de crowdfunding, empréstimos entre pessoas e o próprio mercado de capitais tornam isso mais acessível, podendo reduzir custos. O investidor, porém, assume diretamente o risco da empresa e não conta com o FGC."}, {"id": "M4-087", "modulo": 4, "topico": "4.7.6.1 Meios de pagamento – conceitos", "dificuldade": "facil", "tipo": "mc", "enunciado": "Um lojista quer entender as formas pelas quais pode receber de seus clientes. Qual alternativa lista apenas instrumentos de pagamento?", "alternativas": ["Ações, opções e contratos futuros", "CDB, LCI, debênture e Tesouro Selic", "Cartão de crédito, cartão de débito, cartão pré-pago, Pix e boleto", "Previdência privada, consórcio e título de capitalização"], "correta": 2, "explicacao": "Meios de pagamento são os instrumentos usados para transferir recursos e quitar obrigações, como dinheiro, cartões de crédito, débito e pré-pagos, Pix, boleto e transferências. Os demais itens são produtos de investimento, derivativos ou produtos de previdência e capitalização."}, {"id": "M4-088", "modulo": 4, "topico": "4.7.6.2 Arranjo de pagamento e instituidor", "dificuldade": "medio", "tipo": "mc", "enunciado": "Sobre arranjo de pagamento e instituidor de arranjo, conforme a Lei 12.865/2013, é correto afirmar que:", "alternativas": ["arranjo é a maquininha de cartão instalada no lojista, e o instituidor é o lojista que a utiliza", "arranjo é o conjunto de tarifas bancárias, e o instituidor é a Febraban", "arranjo é o contrato de conta corrente, e o instituidor é o correntista", "arranjo é o conjunto de regras e procedimentos que disciplina determinado serviço de pagamento ao público, e o instituidor é a pessoa jurídica responsável pelo arranjo, como as bandeiras de cartão ou o Banco Central no caso do Pix"], "correta": 3, "explicacao": "Arranjo de pagamento é o conjunto de regras e procedimentos que disciplina a prestação de um serviço de pagamento, como cartões de uma bandeira ou o Pix. O instituidor é a pessoa jurídica responsável por esse conjunto de regras e, quando for o caso, pela marca associada; as bandeiras de cartão são instituidoras de seus arranjos, e o Banco Central é o instituidor do Pix."}, {"id": "M4-089", "modulo": 4, "topico": "4.7.6.3 Adquirente (credenciador)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Em uma compra com cartão de crédito em uma loja física, qual participante habilita o lojista a aceitar o cartão, fornece a infraestrutura de captura da transação e repassa ao lojista os valores das vendas?", "alternativas": ["O instituidor do arranjo (bandeira)", "O portador do cartão", "O adquirente (credenciador)", "O emissor do cartão"], "correta": 2, "explicacao": "O adquirente, chamado na regulação de credenciador, credencia o estabelecimento para aceitar cartões, captura e processa as transações e participa da liquidação, repassando os valores ao lojista, já descontada a taxa (MDR). O emissor é a instituição que emite o cartão e se relaciona com o comprador; a bandeira define as regras do arranjo."}, {"id": "M4-090", "modulo": 4, "topico": "4.7.6.4 Subadquirente (subcredenciador)", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Uma pequena loja virtual recebe pagamentos com cartão por meio de uma empresa que agrega muitos vendedores pequenos, usa a infraestrutura de um adquirente e repassa os valores aos lojistas, sem participar diretamente da liquidação como credora perante o emissor. Essa empresa é um:", "alternativas": ["subadquirente (subcredenciador), também chamado de facilitador de pagamentos", "instituidor de arranjo de pagamento", "banco liquidante do Sistema de Pagamentos Brasileiro", "emissor de instrumento de pagamento pós-pago"], "correta": 0, "explicacao": "O subadquirente habilita recebedores, geralmente pequenos lojistas e vendedores de comércio eletrônico, a aceitar cartões, mas depende da infraestrutura de um adquirente e não participa da liquidação como credor perante o emissor. Ele simplifica o credenciamento de pequenos negócios, mas fica entre o adquirente e o lojista, o que exige atenção ao repasse dos valores."}, {"id": "M4-091", "modulo": 4, "topico": "4.7.6 Meios de pagamento – emissor e bandeira", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma cliente tem um cartão de crédito emitido pelo Banco X, com a marca de uma bandeira internacional. Ela quer contestar uma cobrança e aumentar seu limite. A quem ela deve se dirigir e por quê?", "alternativas": ["Ao adquirente da loja, que é responsável pela fatura do portador", "Ao emissor (Banco X), que é quem mantém o relacionamento com o portador, concede o limite de crédito e emite a fatura", "Ao Banco Central, que concede diretamente o limite dos cartões", "À bandeira, que define o limite de cada cliente individualmente"], "correta": 1, "explicacao": "No arranjo de cartões, o emissor é a instituição que emite o instrumento de pagamento, se relaciona com o portador, concede o limite, cobra a fatura e assume o risco de crédito. A bandeira é a instituidora do arranjo e define regras gerais de funcionamento e aceitação; o adquirente se relaciona com o lojista."}, {"id": "M4-092", "modulo": 4, "topico": "4.7.6 Meios de pagamento – fluxo da transação com cartão", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Em uma venda de R$ 1.000 no cartão de crédito, o lojista paga taxa de desconto (MDR) de 3% ao adquirente. Desse valor, parte é repassada ao emissor (tarifa de intercâmbio) e parte à bandeira. Considerando que não há subadquirente, quanto o lojista recebe e quem define a taxa de desconto cobrada dele?", "alternativas": ["R$ 997; a taxa de desconto é definida pelo emissor do cartão", "R$ 970; a taxa de desconto é fixada por lei para todos os lojistas", "R$ 1.000; a taxa é paga pelo portador do cartão na fatura", "R$ 970; a taxa de desconto é negociada entre o lojista e o adquirente"], "correta": 3, "explicacao": "O lojista recebe R$ 1.000 − 3% × R$ 1.000 = R$ 1.000 − R$ 30 = R$ 970. A taxa de desconto (MDR) é cobrada pelo adquirente do lojista e negociada entre eles; do valor retido, o adquirente repassa a tarifa de intercâmbio ao emissor e paga tarifas à bandeira, ficando com o restante como remuneração."}];
const KEY = "cpa_anbima_simulado_v1";
const LETRAS = ["A", "B", "C", "D", "E"];
const MOD_NOME = {1: "Sistema financeiro nacional", 2: "Produtos do mercado financeiro", 3: "Relacionamento com o cliente", 4: "Inovação e desenvolvimento de mercado"};
const DIF_NOME = {facil: "Fácil", medio: "Médio", dificil: "Difícil"};
const POR_PAGINA = 20;

let estado = {};
try { estado = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { estado = {}; }
function salvar() { try { localStorage.setItem(KEY, JSON.stringify(estado)); } catch (e) {} }

// Cada item respondível tem uma chave: id da questão, ou "AD-01#2" para a etapa 2 de uma árvore.
function itensDe(q) {
  if (q.tipo !== "arvore") return [q.id];
  return q.etapas.map((_, i) => q.id + "#" + i).concat((q.questoes_finais || []).map(f => f.id));
}
const TOTAL_ITENS = BANCO.reduce((n, q) => n + itensDe(q).length, 0);

function statusDe(q) {
  const ks = itensDe(q), r = ks.map(k => estado[k]).filter(Boolean);
  if (!r.length) return "new";
  return r.some(x => !x.ok) ? "wrong" : (r.length === ks.length ? "right" : "new");
}

function renderStats() {
  const vals = Object.values(estado), ok = vals.filter(v => v.ok).length;
  document.getElementById("stats").innerHTML =
    `<span><b>${BANCO.filter(q => q.tipo === "mc").length}</b> questões + <b>${BANCO.filter(q => q.tipo === "arvore").length}</b> árvores de decisão (${TOTAL_ITENS} itens)</span>` +
    `<span>Respondidos: <b>${vals.length}</b>/${TOTAL_ITENS}</span>` +
    `<span>Acertos: <b>${vals.length ? Math.round(100 * ok / vals.length) : 0}%</b> (meta da prova: 70%)</span>`;
  const bars = [1, 2, 3, 4].map(m => {
    const ks = BANCO.filter(q => q.modulo === m).flatMap(itensDe);
    const feitos = ks.filter(k => estado[k]), acertos = feitos.filter(k => estado[k].ok).length;
    const pct = ks.length ? Math.round(100 * feitos.length / ks.length) : 0;
    return `<div>Módulo ${m}: ${feitos.length}/${ks.length} · ${feitos.length ? Math.round(100 * acertos / feitos.length) : 0}% certo<div class="bar"><span style="width:${pct}%"></span></div></div>`;
  });
  document.getElementById("bars").innerHTML = bars.join("");
}

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c])); }

// Bloco de alternativas reutilizado por questões e etapas de árvore.
function blocoOpcoes(chave, alternativas, correta, explicacao, onAnswer) {
  const div = document.createElement("div");
  const opts = document.createElement("div"); opts.className = "opts";
  const fb = document.createElement("div");
  alternativas.forEach((t, i) => {
    const b = document.createElement("button"); b.className = "opt";
    b.innerHTML = `<span class="l">${LETRAS[i]}</span><span>${esc(t)}</span>`;
    b.onclick = () => { estado[chave] = {e: i, ok: i === correta, t: Date.now()}; salvar(); pintar(); renderStats(); if (onAnswer) onAnswer(); };
    opts.appendChild(b);
  });
  const redo = document.createElement("button"); redo.className = "btn redo"; redo.textContent = "Refazer esta";
  redo.onclick = () => { delete estado[chave]; salvar(); pintar(); renderStats(); };
  function pintar() {
    const r = estado[chave];
    [...opts.children].forEach((b, i) => {
      b.disabled = !!r; b.classList.remove("correct", "wrong");
      if (r && i === correta) b.classList.add("correct");
      if (r && i === r.e && !r.ok) b.classList.add("wrong");
    });
    fb.className = r ? "fb " + (r.ok ? "ok" : "err") : "";
    fb.innerHTML = r ? `<b>${r.ok ? "Você acertou!" : "Você errou. Correta: " + LETRAS[correta]}</b>${esc(explicacao)}` : "";
    redo.style.display = r ? "" : "none";
  }
  div.append(opts, fb, redo); pintar();
  div.respondido = () => !!estado[chave];
  return div;
}

function cardMC(q, num) {
  const c = document.createElement("div"); c.className = "card";
  const st = estado[q.id];
  c.innerHTML = `<div class="meta"><span>#${num} · ${esc(q.id)}</span><span>Módulo ${q.modulo}</span><span>${esc(q.topico)}</span><span class="tag">${DIF_NOME[q.dificuldade] || q.dificuldade}</span>${st ? `<span class="tag ${st.ok ? "ok" : "err"}">${st.ok ? "acertou" : "errou"}</span>` : ""}</div><p class="enun">${esc(q.enunciado)}</p>`;
  c.appendChild(blocoOpcoes(q.id, q.alternativas, q.correta, q.explicacao));
  return c;
}

function cardArvore(q, num) {
  const c = document.createElement("div"); c.className = "card";
  c.innerHTML = `<div class="meta"><span>#${num} · ${esc(q.id)}</span><span>Árvore de decisão</span><span>${esc(q.topico)}</span><span class="tag">${DIF_NOME[q.dificuldade] || q.dificuldade}</span></div><h3 style="margin:0 0 8px">${esc(q.titulo)}</h3><div class="ctx"><b>Contexto: </b>${esc(q.contexto)}</div>`;
  const corpo = document.createElement("div"); c.appendChild(corpo);
  function montar() {
    corpo.innerHTML = "";
    for (let i = 0; i < q.etapas.length; i++) {
      const et = q.etapas[i], s = document.createElement("div"); s.className = "step";
      s.innerHTML = `<div class="who">Etapa ${i + 1} de ${q.etapas.length}</div>${et.fala_cliente ? `<div class="client">${esc(et.fala_cliente)}</div>` : ""}<div class="who">O que a pessoa profissional deve responder?</div>`;
      s.appendChild(blocoOpcoes(q.id + "#" + i, et.alternativas, et.correta, et.explicacao, montar));
      corpo.appendChild(s);
      if (!estado[q.id + "#" + i]) return; // só mostra a próxima etapa depois de responder esta
    }
    (q.questoes_finais || []).forEach((f, j) => {
      const s = document.createElement("div"); s.className = "step";
      s.innerHTML = `<div class="who">Questão sobre o caso ${j + 1}</div><p class="enun">${esc(f.enunciado)}</p>`;
      s.appendChild(blocoOpcoes(f.id, f.alternativas, f.correta, f.explicacao));
      corpo.appendChild(s);
    });
  }
  montar();
  return c;
}

let pagina = 0, modoProva = null;

function filtrados() { return BANCO; }

function render() {
  const lista = document.getElementById("lista"); lista.innerHTML = "";
  if (modoProva) return renderProva();
  const fs = filtrados(), paginas = Math.max(1, Math.ceil(fs.length / POR_PAGINA));
  if (pagina >= paginas) pagina = paginas - 1;
  if (!fs.length) { lista.innerHTML = `<div class="empty">Nenhuma questão.</div>`; return; }
  fs.slice(pagina * POR_PAGINA, (pagina + 1) * POR_PAGINA).forEach((q, i) => {
    const n = pagina * POR_PAGINA + i + 1;
    lista.appendChild(q.tipo === "arvore" ? cardArvore(q, n) : cardMC(q, n));
  });
  const pg = document.createElement("div"); pg.className = "pager";
  pg.innerHTML = `<button class="btn" ${pagina === 0 ? "disabled" : ""} id="pPrev">← Anterior</button><span>Página ${pagina + 1} de ${paginas} · ${fs.length} itens</span><button class="btn" ${pagina >= paginas - 1 ? "disabled" : ""} id="pNext">Próxima →</button>`;
  lista.appendChild(pg);
  pg.querySelector("#pPrev").onclick = () => { pagina--; render(); scrollTo(0, 0); };
  pg.querySelector("#pNext").onclick = () => { pagina++; render(); scrollTo(0, 0); };
}

// ---------- Simulado de prova: 40 múltipla escolha (8/16/12/4 por módulo) + 10 itens de árvore ----------
function embaralhar(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function prioriza(qs) { // prefere as não respondidas, depois as erradas
  const peso = q => (estado[q.id] ? (estado[q.id].ok ? 2 : 1) : 0) + Math.random();
  return qs.slice().sort((a, b) => peso(a) - peso(b));
}
function novaProva() {
  const cota = {1: 8, 2: 16, 3: 12, 4: 4};
  let qs = [];
  for (const m in cota) qs = qs.concat(prioriza(BANCO.filter(q => q.tipo === "mc" && q.modulo == m)).slice(0, cota[m]));
  qs = embaralhar(qs);
  const arv = [], arvores = embaralhar(BANCO.filter(q => q.tipo === "arvore"));
  for (const a of arvores) { // pega etapas de árvores até somar 10 itens
    const falta = 10 - arv.length; if (falta <= 0) break;
    a.etapas.slice(0, falta).forEach((et, i) => arv.push({caso: a, i, et}));
  }
  modoProva = {qs, arv, resp: {}, inicio: Date.now(), fim: null};
  render(); scrollTo(0, 0);
}
function renderProva() {
  const P = modoProva, lista = document.getElementById("lista");
  const topo = document.createElement("div"); topo.className = "card";
  const total = P.qs.length + P.arv.length, feitas = Object.keys(P.resp).length;
  if (P.fim) {
    const acertos = Object.values(P.resp).filter(r => r.ok).length, pct = Math.round(100 * acertos / total);
    topo.innerHTML = `<div class="result"><b>${acertos}/${total} acertos (${pct}%)</b> — ${acertos >= 35 ? "APROVADO (mínimo 35)" : "reprovado (mínimo 35)"}</div><p>As respostas desta prova também foram salvas no seu progresso. Role para ver a correção.</p>`;
  } else {
    topo.innerHTML = `<b>Simulado de prova</b> · ${feitas}/${total} respondidas · tempo restante <span class="timer" id="timer"></span><br><span style="font-size:13px;color:var(--muted)">Como na prova: 40 de múltipla escolha + 10 etapas de árvore de decisão, 2h30, aprovação com 35 acertos. A correção aparece só quando você entregar.</span>`;
  }
  const bts = document.createElement("div"); bts.style.marginTop = "8px";
  bts.innerHTML = (P.fim ? "" : `<button class="btn primary" id="bEntregar">Entregar prova</button> `) + `<button class="btn" id="bSair">Voltar ao banco de questões</button>`;
  topo.appendChild(bts); lista.appendChild(topo);
  if (!P.fim) bts.querySelector("#bEntregar").onclick = entregar;
  bts.querySelector("#bSair").onclick = () => { modoProva = null; clearInterval(window._tm); render(); };

  const itens = P.qs.map(q => ({chave: q.id, enun: q.enunciado, alt: q.alternativas, cor: q.correta, exp: q.explicacao, meta: `Módulo ${q.modulo} · ${q.topico}`}))
    .concat(P.arv.map(a => ({chave: a.caso.id + "#" + a.i, enun: (a.i === 0 ? "CONTEXTO: " + a.caso.contexto + "\n\n" : "") + (a.et.fala_cliente ? "Cliente: " + a.et.fala_cliente : "") + "\n\nO que a pessoa profissional deve responder?", alt: a.et.alternativas, cor: a.et.correta, exp: a.et.explicacao, meta: `Árvore de decisão · ${a.caso.titulo} · etapa ${a.i + 1}`})));
  itens.forEach((it, n) => {
    const c = document.createElement("div"); c.className = "card";
    c.innerHTML = `<div class="meta"><span>Questão ${n + 1}</span><span>${esc(it.meta)}</span></div><p class="enun">${esc(it.enun)}</p>`;
    const opts = document.createElement("div"); opts.className = "opts";
    it.alt.forEach((t, i) => {
      const b = document.createElement("button"); b.className = "opt";
      b.innerHTML = `<span class="l">${LETRAS[i]}</span><span>${esc(t)}</span>`;
      const r = P.resp[it.chave];
      if (P.fim) { b.disabled = true; if (i === it.cor) b.classList.add("correct"); if (r && r.e === i && !r.ok) b.classList.add("wrong"); }
      else if (r && r.e === i) b.style.background = "var(--sel)";
      b.onclick = () => { P.resp[it.chave] = {e: i, ok: i === it.cor}; render(); };
      opts.appendChild(b);
    });
    c.appendChild(opts);
    if (P.fim) {
      const r = P.resp[it.chave], fb = document.createElement("div");
      fb.className = "fb " + (r && r.ok ? "ok" : "err");
      fb.innerHTML = `<b>${!r ? "Não respondida. Correta: " + LETRAS[it.cor] : r.ok ? "Você acertou!" : "Você errou. Correta: " + LETRAS[it.cor]}</b>${esc(it.exp)}`;
      c.appendChild(fb);
    }
    lista.appendChild(c);
  });
  if (!P.fim) {
    const tick = () => {
      const rest = Math.max(0, 150 * 60 * 1000 - (Date.now() - P.inicio)), el = document.getElementById("timer");
      if (el) el.textContent = new Date(rest).toISOString().substr(11, 8);
      if (rest === 0) entregar();
    };
    clearInterval(window._tm); window._tm = setInterval(tick, 1000); tick();
  }
}
function entregar() {
  const P = modoProva; P.fim = Date.now(); clearInterval(window._tm);
  for (const k in P.resp) estado[k] = {e: P.resp[k].e, ok: P.resp[k].ok, t: P.fim};
  salvar(); renderStats(); render(); scrollTo(0, 0);
}

document.getElementById("btnProva").onclick = novaProva;
document.getElementById("btnReset").onclick = () => {
  if (confirm("Apagar todo o seu progresso (acertos e erros salvos)?")) { estado = {}; salvar(); renderStats(); render(); }
};
renderStats(); render();
</script>
