a física, são isentos de IR: poupança, LCI, LCA, LCD, CRI, CRA e debêntures incentivadas (Lei 12.431/2011). CDB e títulos públicos, inclusive o Tesouro IPCA+, são tributados pela tabela regressiva. Essas isenções continuam em 2026 com a perda de validade da MP 1.303/2025."}, {"id": "M2A-088", "modulo": 2, "topico": "2.1.1.1.11 Tributação de aplicações de renda fixa", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Um cliente fez dois aportes em um mesmo CDB pós-fixado: R$ 10.000,00 há 800 dias e R$ 10.000,00 há 100 dias. Ele resgata tudo hoje. Como é aplicada a tabela regressiva?", "alternativas": ["cada aporte é tributado pela alíquota do seu próprio prazo: 15% sobre o rendimento do primeiro e 22,5% sobre o do segundo", "todo o rendimento é tributado a 15%, pelo prazo do primeiro aporte", "todo o rendimento é tributado a 22,5%, pelo prazo do aporte mais recente", "aplica-se uma alíquota média ponderada de 18,75% sobre todo o rendimento"], "correta": 0, "explicacao": "O prazo para definir a alíquota é contado a partir da data de cada aplicação. Assim, o rendimento do aporte de 800 dias é tributado a 15% (acima de 720 dias) e o do aporte de 100 dias a 22,5% (até 180 dias). Não há média nem unificação pelo aporte mais antigo."}, {"id": "M2A-089", "modulo": 2, "topico": "2.1.1.1.11 Tributação de aplicações de renda fixa", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente comenta que, em 2026, todas as aplicações de renda fixa passaram a pagar 17,5% de IR e que LCI e LCA passaram a ser tributadas. A correção adequada da pessoa profissional é:", "alternativas": ["a alíquota única está correta, mas LCI e LCA continuam isentas", "a alíquota passou a ser de 15% fixa para todos os prazos", "essas mudanças constavam da MP 1.303/2025, que perdeu a validade sem ser votada; continua a tabela regressiva e as isenções de LCI e LCA para pessoa física", "a informação está correta, pois a MP 1.303/2025 virou lei em 2025"], "correta": 2, "explicacao": "A MP 1.303/2025 propunha alíquota única de 17,5% e tributação de 5% para títulos isentos, mas perdeu a validade em outubro de 2025 sem ser votada pelo Congresso. Por isso, em 2026 seguem a tabela regressiva (22,5% a 15%) e as isenções para pessoa física de LCI, LCA, CRI, CRA e debêntures incentivadas."}, {"id": "M2A-090", "modulo": 2, "topico": "2.1.1.1.11 Tributação de aplicações de renda fixa", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Uma cliente quer comparar um CDB prefixado de 2 anos (730 dias), que paga 13% a.a., com uma LCI de mesmo prazo isenta de IR. Qual taxa anual da LCI tornaria as duas aplicações aproximadamente equivalentes em termos líquidos? (Considere a conversão aproximada sobre a taxa anual.)", "alternativas": ["cerca de 10,73% a.a.", "cerca de 11,05% a.a.", "cerca de 10,40% a.a.", "cerca de 13,00% a.a."], "correta": 1, "explicacao": "Com 730 dias (acima de 720), a alíquota do CDB é de 15%. Pela aproximação sobre a taxa anual, 13% x 0,85 = 11,05% a.a. líquido, que é a taxa isenta equivalente. 10,73% usaria 17,5% e 10,40% usaria 20%, alíquotas de prazos menores. Em rigor, a conta exata seria feita sobre o rendimento acumulado, mas a ordem de grandeza é a mesma."}, {"id": "M2A-091", "modulo": 2, "topico": "2.1.1.1.11 Tributação de aplicações de renda fixa", "dificuldade": "facil", "tipo": "mc", "enunciado": "Sobre a base de cálculo do IR em aplicações de renda fixa, é correto afirmar que:", "alternativas": ["o IR é calculado antes do IOF e sobre o rendimento bruto", "o IR incide sobre o valor total resgatado", "o IR incide sobre o valor aplicado inicialmente", "o IR incide apenas sobre o rendimento, depois de descontado o IOF devido, quando houver"], "correta": 3, "explicacao": "O IR incide somente sobre o ganho (rendimento). Quando há IOF, em resgates com menos de 30 dias, o IOF é calculado primeiro, e o IR incide sobre o rendimento já líquido do IOF. O principal aplicado não é tributado."}, {"id": "M2A-092", "modulo": 2, "topico": "2.1.1.1.12 IOF", "dificuldade": "facil", "tipo": "mc", "enunciado": "O IOF sobre aplicações de renda fixa, como CDB e títulos públicos, incide quando:", "alternativas": ["o resgate ocorre antes de 1 ano, com alíquota fixa de 1%", "a aplicação supera R$ 250 mil", "o resgate ocorre antes de 30 dias da aplicação, com alíquota regressiva sobre o rendimento", "o investidor resgata após o vencimento"], "correta": 2, "explicacao": "O IOF sobre aplicações de renda fixa incide sobre o rendimento em resgates feitos antes de 30 dias, com alíquota regressiva que começa em 96% no primeiro dia e chega a zero a partir do 30º dia. Não depende do valor aplicado."}, {"id": "M2A-093", "modulo": 2, "topico": "2.1.1.1.12 IOF", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Um cliente aplicou R$ 20.000,00 em um CDB de liquidez diária e resgatou no 10º dia, com rendimento bruto de R$ 100,00. Considerando IOF de 66% para 10 dias e IR de 22,5%, o rendimento líquido foi de:", "alternativas": ["R$ 26,35", "R$ 11,50", "R$ 34,00", "R$ 77,50"], "correta": 0, "explicacao": "Primeiro calcula-se o IOF: 66% x 100 = R$ 66,00. O IR incide sobre o rendimento após o IOF: 22,5% x 34 = R$ 7,65. Rendimento líquido = 100 - 66 - 7,65 = R$ 26,35. Calcular o IR sobre o rendimento bruto (R$ 22,50) levaria ao valor errado de R$ 11,50."}, {"id": "M2A-094", "modulo": 2, "topico": "2.1.1.1.12 IOF", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma pessoa investidora aplicou em Tesouro Selic e quer resgatar no 29º dia. O gerente sugere esperar mais um dia. A justificativa correta é:", "alternativas": ["no 30º dia o IR cai de 22,5% para 15%", "no 29º dia ainda incide IOF de 3% sobre o rendimento; a partir do 30º dia o IOF é zero", "não há diferença, pois o IOF não incide sobre títulos públicos", "no 30º dia a taxa de custódia é zerada"], "correta": 1, "explicacao": "A tabela regressiva do IOF vai de 96% (1º dia) a 3% (29º dia) do rendimento e zera a partir do 30º dia. Títulos públicos também estão sujeitos ao IOF em resgates com menos de 30 dias. A alíquota de IR continua 22,5% até 180 dias."}, {"id": "M2A-095", "modulo": 2, "topico": "2.1.1.1.12 IOF", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente aplica R$ 50.000,00 em CDB de liquidez diária e resgata no 15º dia, com rendimento de R$ 200,00. Sabendo que a alíquota de IOF para 15 dias é de 50%, o IOF devido é de:", "alternativas": ["R$ 100,00", "R$ 25.000,00", "R$ 750,00", "R$ 45,00"], "correta": 0, "explicacao": "O IOF regressivo incide sobre o rendimento, não sobre o valor aplicado: 50% x 200 = R$ 100,00. Aplicar a alíquota sobre o principal (R$ 25.000) é um erro grave. Depois, o IR de 22,5% incidiria sobre os R$ 100,00 restantes de rendimento."}, {"id": "M2A-096", "modulo": 2, "topico": "2.1.1.1.12 IOF", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Sobre a incidência do IOF regressivo em resgates com menos de 30 dias, assinale a afirmativa correta:", "alternativas": ["o IOF regressivo deixa de incidir a partir do 180º dia", "o IOF regressivo incide sobre o valor resgatado, e não sobre o rendimento", "na poupança, o efeito prático é nulo, porque o rendimento só é creditado na data de aniversário, após um ciclo mensal completo", "na poupança, o IOF incide sobre o saque feito antes de 30 dias, à alíquota de 96%"], "correta": 2, "explicacao": "Como a poupança só remunera na data de aniversário, saques antes de completar o ciclo mensal simplesmente não recebem rendimento; não há rendimento sobre o qual cobrar IOF. Nas demais aplicações de renda fixa, o IOF incide sobre o rendimento e zera a partir do 30º dia."}, {"id": "M2B-001", "modulo": 2, "topico": "2.1.1.2.1 Renda variável (definição)", "dificuldade": "facil", "tipo": "mc", "enunciado": "Uma pessoa investidora que só aplicou em CDB pergunta à gerente o que caracteriza um investimento de renda variável. Qual resposta está correta?", "alternativas": ["É um investimento que paga juros periódicos fixos, mas cujo principal pode ser corrigido pela inflação.", "É um investimento cujo retorno não é conhecido no momento da aplicação, pois depende de fatores como o desempenho da empresa e as condições de mercado.", "É um investimento com rentabilidade mínima garantida pela bolsa de valores, que varia apenas para cima.", "É um investimento cujo retorno é definido na contratação, mas pago apenas no vencimento."], "correta": 1, "explicacao": "Na renda variável não há promessa de rentabilidade: o retorno depende da variação de preços e dos proventos, que oscilam conforme a empresa e o mercado. Um título corrigido por inflação continua sendo renda fixa, pois a regra de remuneração é conhecida na aplicação."}, {"id": "M2B-002", "modulo": 2, "topico": "2.1.1.2.1 Renda variável (definição)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Carla tem R$ 50 mil em um CDB e quer aplicar outros R$ 50 mil em ações de uma empresa listada na B3. Ao comparar os dois investimentos, qual afirmação está correta?", "alternativas": ["Nos dois casos Carla é credora, mas a ação paga juros maiores por ter mais risco.", "A ação, assim como o CDB, conta com a garantia do FGC até R$ 250 mil por CPF.", "A ação tem data de vencimento, na qual a empresa devolve o valor investido corrigido.", "No CDB Carla é credora do banco; na ação ela passa a ser sócia da empresa, sem prazo de vencimento e sem promessa de rentabilidade."], "correta": 3, "explicacao": "O CDB é um título de dívida: o investidor empresta recursos ao banco e tem direito ao principal mais juros. Quem compra ações se torna sócio, participa dos resultados e assume o risco do negócio, sem vencimento nem garantia do FGC."}, {"id": "M2B-003", "modulo": 2, "topico": "2.1.1.2.2.1.1 Empresa limitada e empresa S/A", "dificuldade": "facil", "tipo": "mc", "enunciado": "Os sócios de uma empresa limitada (Ltda) querem, no futuro, captar recursos de milhares de investidores vendendo participações na bolsa de valores. O que precisarão fazer?", "alternativas": ["Registrar as quotas da Ltda na B3, mantendo o tipo societário atual.", "Nada, pois qualquer empresa pode vender quotas diretamente ao público na bolsa.", "Transformar a empresa em sociedade anônima e obter registro de companhia aberta, pois somente ações de S/A aberta são negociadas em bolsa.", "Emitir bônus de subscrição das quotas, que podem ser vendidos em bolsa."], "correta": 2, "explicacao": "Na Ltda o capital é dividido em quotas, cuja transferência depende do contrato social e que não são negociadas em bolsa. Para captar recursos com ações no mercado, a empresa precisa ser uma S/A com registro de companhia aberta na CVM."}, {"id": "M2B-004", "modulo": 2, "topico": "2.1.1.2.2.1.1 Empresa limitada e empresa S/A", "dificuldade": "medio", "tipo": "mc", "enunciado": "Sobre as diferenças entre a sociedade limitada (Ltda) e a sociedade anônima (S/A), qual afirmação está correta?", "alternativas": ["A Ltda pode ter suas quotas listadas no Novo Mercado se adotar boas práticas de governança.", "Na Ltda o capital é dividido em quotas; na S/A, em ações, e a responsabilidade do acionista é limitada ao preço de emissão das ações que subscreveu ou adquiriu.", "A S/A, por ter capital dividido em ações, fica dispensada de elaborar demonstrações financeiras.", "Na S/A o acionista responde com seu patrimônio pessoal por todas as dívidas da companhia."], "correta": 1, "explicacao": "A Lei das S/A estabelece que o capital da companhia é dividido em ações e que a responsabilidade dos acionistas se limita ao preço de emissão das ações subscritas ou adquiridas. Quotas de Ltda não são admitidas em segmentos de listagem da bolsa."}, {"id": "M2B-005", "modulo": 2, "topico": "2.1.1.2.2.1.2 S/A aberta versus S/A fechada", "dificuldade": "facil", "tipo": "mc", "enunciado": "Qual característica diferencia uma S/A aberta de uma S/A fechada?", "alternativas": ["A S/A aberta tem registro na CVM e seus valores mobiliários podem ser negociados em bolsa ou mercado de balcão organizado; a fechada não.", "A S/A fechada só pode emitir ações preferenciais.", "A S/A aberta é obrigatoriamente uma empresa estatal.", "A S/A aberta não tem acionista controlador; a fechada tem."], "correta": 0, "explicacao": "Companhia aberta é aquela cujos valores mobiliários são admitidos à negociação em mercado de valores mobiliários, o que exige registro na CVM. A fechada capta recursos de forma privada, sem negociação pública de seus papéis. Ter ou não controlador independe de a companhia ser aberta."}, {"id": "M2B-006", "modulo": 2, "topico": "2.1.1.2.2.1.2 S/A aberta versus S/A fechada", "dificuldade": "medio", "tipo": "mc", "enunciado": "A família controladora de uma S/A fechada decidiu abrir o capital da empresa. Que consequência essa decisão traz?", "alternativas": ["A família perde automaticamente o controle, pois o capital passa a ser pulverizado.", "As ações passam a ter valorização garantida pela CVM durante o primeiro ano.", "A empresa fica proibida de captar recursos com debêntures, pois só pode usar ações.", "A empresa passa a ter de divulgar informações periódicas e eventuais ao mercado, com demonstrações financeiras auditadas, sob supervisão da CVM."], "correta": 3, "explicacao": "Ao abrir o capital, a companhia assume obrigações de transparência (demonstrações auditadas, fatos relevantes, formulário de referência) perante a CVM e o mercado. O controle pode continuar com a família, a depender de quantas ações forem ofertadas, e não há garantia de valorização."}, {"id": "M2B-007", "modulo": 2, "topico": "2.1.1.2.2.1.3 Empresa listada e não listada", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente recebeu a proposta de comprar participação acionária em uma empresa não listada em bolsa. O gerente deve alertá-lo principalmente sobre:", "alternativas": ["a garantia de recompra pela B3 caso ele queira vender antes de 5 anos.", "a cobertura do FGC, que é maior para empresas não listadas.", "a isenção automática de qualquer imposto sobre o ganho na venda.", "a menor liquidez e a ausência de cotação pública diária, o que pode dificultar a venda da participação e a avaliação do seu valor."], "correta": 3, "explicacao": "Ações de empresas não listadas não são negociadas em bolsa, então não há preço formado diariamente nem um mercado secundário organizado que facilite a venda. Isso aumenta o risco de liquidez e a dificuldade de avaliar o investimento."}, {"id": "M2B-008", "modulo": 2, "topico": "2.1.1.2.2.1.3 Empresa listada e não listada", "dificuldade": "facil", "tipo": "mc", "enunciado": "No contexto do mercado de capitais, dizer que uma companhia é listada significa que:", "alternativas": ["ela integra obrigatoriamente a carteira teórica do Ibovespa.", "suas ações são admitidas à negociação na bolsa de valores (B3), em um dos segmentos de listagem.", "ela consta de uma lista da CVM de empresas que não podem captar recursos.", "ela tem rentabilidade garantida aos acionistas enquanto permanecer na lista."], "correta": 1, "explicacao": "Empresa listada é aquela cujas ações estão admitidas à negociação em bolsa, vinculada a um segmento de listagem (Básico, Nível 1, Nível 2, Novo Mercado etc.). Fazer parte do Ibovespa depende de critérios próprios do índice; nem toda empresa listada integra a carteira."}, {"id": "M2B-009", "modulo": 2, "topico": "2.1.1.2.2.1.4 Ações ordinárias (ON)", "dificuldade": "facil", "tipo": "mc", "enunciado": "Marcos quer comprar ações para participar das decisões tomadas nas assembleias de uma companhia. Qual tipo de ação atende melhor a esse objetivo?", "alternativas": ["Ação ordinária (ON), que confere direito a voto nas assembleias.", "Ação preferencial (PN), que confere voto em dobro.", "Bônus de subscrição, que dá direito a voto até ser exercido.", "BDR não patrocinado, que dá voto direto na companhia brasileira."], "correta": 0, "explicacao": "A principal característica da ação ordinária é o direito de voto nas assembleias gerais. As preferenciais, em regra, não têm voto ou têm voto restrito, em troca de vantagens patrimoniais."}, {"id": "M2B-010", "modulo": 2, "topico": "2.1.1.2.2.1.4 Ações preferenciais (PN)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma investidora não se interessa em votar nas assembleias, mas valoriza vantagens no recebimento de proventos. A gerente sugere ações preferenciais. Qual característica das PN justifica a sugestão?", "alternativas": ["Elas garantem dividendos fixos todos os anos, mesmo quando a empresa tem prejuízo.", "Elas dão direito a voto em todas as matérias e prioridade nos dividendos.", "Elas conferem prioridade na distribuição de dividendos e/ou no reembolso de capital, em geral sem direito a voto ou com voto restrito.", "Elas são resgatadas pela empresa no vencimento pelo valor investido."], "correta": 2, "explicacao": "As preferenciais trocam o voto (ou parte dele) por vantagens patrimoniais, como prioridade na distribuição de dividendos e no reembolso de capital. Dividendos dependem da existência de lucro; não são garantidos em caso de prejuízo."}, {"id": "M2B-011", "modulo": 2, "topico": "2.1.1.2.2.1.4 Ações preferenciais (PN)", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Segundo a Lei das S/A (Lei nº 6.404/1976), qual afirmação sobre ações preferenciais está correta?", "alternativas": ["O número de ações preferenciais sem direito a voto, ou sujeitas a restrição desse direito, não pode ultrapassar 50% do total das ações emitidas.", "As ações preferenciais podem representar até dois terços do capital, sem qualquer limite adicional.", "As ações preferenciais nunca adquirem direito a voto, em nenhuma hipótese.", "Toda companhia do Novo Mercado deve ter pelo menos metade do capital em ações preferenciais."], "correta": 0, "explicacao": "Desde a reforma de 2001, a lei limita as preferenciais sem voto ou com voto restrito a 50% do total das ações emitidas (o limite de dois terços era a regra antiga). O Novo Mercado, ao contrário, admite apenas ações ordinárias."}, {"id": "M2B-012", "modulo": 2, "topico": "2.1.1.2.2.1.4 Ações preferenciais (PN)", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Uma companhia cujo estatuto prevê dividendo mínimo às ações preferenciais deixou de pagá-lo por vários exercícios. O que a Lei das S/A prevê nesse caso?", "alternativas": ["As preferenciais são automaticamente convertidas em debêntures.", "Os acionistas preferencialistas passam a responder pelas dívidas da companhia.", "As preferenciais adquirem o direito de voto se a companhia deixar de pagar os dividendos fixos ou mínimos pelo prazo previsto no estatuto, não superior a três exercícios consecutivos.", "Nada muda, pois as preferenciais nunca podem votar, mesmo sem receber dividendos."], "correta": 2, "explicacao": "A Lei das S/A prevê que as preferenciais sem voto adquirem esse direito se a companhia, pelo prazo fixado no estatuto (não superior a três exercícios consecutivos), deixar de pagar os dividendos a que fazem jus, conservando-o até o pagamento."}, {"id": "M2B-013", "modulo": 2, "topico": "2.1.1.2.2.1.4 Units", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma pessoa investidora possui 300 units de uma companhia. Cada unit é composta por 1 ação ordinária e 2 ações preferenciais. A quais ações essas units correspondem?", "alternativas": ["900 ações ordinárias.", "600 ações ordinárias e 300 ações preferenciais.", "100 ações ordinárias e 200 ações preferenciais.", "300 ações ordinárias e 600 ações preferenciais."], "correta": 3, "explicacao": "Unit é um certificado de depósito que representa um conjunto de ações, geralmente de classes diferentes, negociado como um único ativo. Com 1 ON + 2 PN por unit, 300 units equivalem a 300 x 1 = 300 ON e 300 x 2 = 600 PN."}, {"id": "M2B-014", "modulo": 2, "topico": "2.1.1.2.2.1.4 BDRs", "dificuldade": "facil", "tipo": "mc", "enunciado": "Uma cliente quer investir em uma empresa de tecnologia norte-americana, mas sem abrir conta em corretora no exterior. Qual instrumento negociado na B3 permite essa exposição?", "alternativas": ["Unit, que reúne ações brasileiras e estrangeiras no mesmo certificado.", "BDR (Brazilian Depositary Receipt), certificado emitido no Brasil que representa valores mobiliários de emissor estrangeiro.", "Ação preferencial de classe especial emitida pela empresa estrangeira.", "Bônus de subscrição, que dá direito a comprar ações estrangeiras."], "correta": 1, "explicacao": "O BDR é emitido por uma instituição depositária no Brasil, lastreado em valores mobiliários de companhia estrangeira, e negociado em reais na B3. Assim, a investidora obtém exposição à empresa sem precisar operar diretamente no exterior."}, {"id": "M2B-015", "modulo": 2, "topico": "2.1.1.2.2.1.4 BDRs", "dificuldade": "medio", "tipo": "mc", "enunciado": "Qual é a diferença entre um BDR patrocinado e um BDR não patrocinado?", "alternativas": ["No patrocinado, a companhia estrangeira contrata a instituição depositária para emitir o BDR; no não patrocinado, a instituição depositária emite sem participação da companhia.", "O patrocinado tem garantia do FGC; o não patrocinado não.", "O patrocinado só pode ser comprado por investidores profissionais; o não patrocinado é exclusivo do varejo.", "O patrocinado representa ações brasileiras negociadas no exterior; o não patrocinado representa ações estrangeiras."], "correta": 0, "explicacao": "No BDR patrocinado há participação ativa da companhia emissora estrangeira, que contrata a depositária e assume obrigações de informação. No não patrocinado, a depositária emite os certificados por conta própria. Nenhum deles tem cobertura do FGC."}, {"id": "M2B-016", "modulo": 2, "topico": "2.1.1.2.2.1.4 BDRs", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Em determinado mês, um investidor pessoa física vendeu BDRs na B3 por R$ 15.000,00, obtendo lucro de R$ 3.000,00 em operações comuns (sem day trade). Não fez outras vendas no mês. Desconsiderando custos e o IR retido na fonte, qual é o imposto devido?", "alternativas": ["Zero, pois as vendas ficaram abaixo de R$ 20 mil no mês.", "R$ 600,00, pois BDRs são tributados como day trade.", "R$ 450,00, pois a isenção para vendas de até R$ 20 mil por mês vale apenas para ações, não para BDRs.", "R$ 675,00, pois BDRs seguem a tabela regressiva da renda fixa no primeiro ano."], "correta": 2, "explicacao": "O ganho com BDRs em operações comuns é tributado a 15%: 15% x R$ 3.000 = R$ 450. A isenção de R$ 20 mil mensais é restrita à alienação de ações no mercado à vista por pessoa física, e não se estende a BDRs."}, {"id": "M2B-017", "modulo": 2, "topico": "2.1.1.2.2.1.4 Bônus de subscrição", "dificuldade": "medio", "tipo": "mc", "enunciado": "Ao analisar a carteira de um cliente, o gerente encontra bônus de subscrição de uma companhia aberta. O que esse título confere ao cliente?", "alternativas": ["O direito de receber novas ações gratuitamente, por incorporação de reservas ao capital.", "O direito de subscrever ações da companhia, dentro do limite do capital autorizado, mediante pagamento do preço de emissão estabelecido.", "O direito a juros periódicos pagos pela companhia até o vencimento.", "O direito de voto em assembleia enquanto o título não for exercido."], "correta": 1, "explicacao": "Bônus de subscrição é um valor mobiliário que dá ao titular o direito de subscrever ações em aumento de capital, pagando o preço de emissão. Receber ações gratuitamente é bonificação, que é outro evento. O bônus pode ser negociado no mercado."}, {"id": "M2B-018", "modulo": 2, "topico": "2.1.1.2.2.1.5 Capital próprio e de terceiros", "dificuldade": "facil", "tipo": "mc", "enunciado": "Entre as formas de financiamento abaixo, qual representa captação de capital de terceiros por uma companhia?", "alternativas": ["Retenção de lucros em reservas.", "Oferta pública inicial de ações (IPO) com distribuição primária.", "Aumento de capital por subscrição de novas ações pelos acionistas.", "Emissão de debêntures."], "correta": 3, "explicacao": "Capital de terceiros corresponde a dívidas, como debêntures e empréstimos, que geram obrigação de pagar juros e devolver o principal. Emissão de ações e retenção de lucros são formas de capital próprio."}, {"id": "M2B-019", "modulo": 2, "topico": "2.1.1.2.2.1.5 Capital próprio e de terceiros", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma companhia aberta precisa de R$ 500 milhões para expansão e avalia emitir debêntures ou fazer uma oferta primária de ações. Qual afirmação compara corretamente as alternativas?", "alternativas": ["As ações obrigam a companhia a pagar dividendos fixos, enquanto as debêntures só são remuneradas se houver lucro.", "Ambas são capital próprio, pois os investidores passam a ser sócios da companhia.", "As debêntures criam obrigação de pagar juros e principal nos prazos acordados; as ações trazem recursos sem obrigação de devolução, mas podem diluir os acionistas que não acompanharem a oferta.", "As debêntures diluem a participação dos acionistas; as ações não."], "correta": 2, "explicacao": "Debêntures são capital de terceiros: o investidor é credor e a companhia assume compromisso de pagamento independentemente do lucro. Ações são capital próprio: o investidor vira sócio, a remuneração depende dos resultados e a emissão de novas ações pode reduzir a participação de quem não subscrever."}, {"id": "M2B-020", "modulo": 2, "topico": "2.1.1.2.2.1.6 IPO", "dificuldade": "facil", "tipo": "mc", "enunciado": "O que significa uma companhia fazer um IPO?", "alternativas": ["Recomprar ações em circulação para fechar o capital.", "Realizar sua primeira oferta pública de ações, passando a ter ações negociadas em bolsa.", "Distribuir lucros aos acionistas na forma de juros sobre capital próprio.", "Fazer uma nova oferta de ações depois de já estar listada há alguns anos."], "correta": 1, "explicacao": "IPO (Initial Public Offering) é a oferta pública inicial, a estreia da companhia no mercado de ações. Uma nova oferta de empresa já listada é chamada de follow on, e a recompra para fechar o capital envolve uma OPA."}, {"id": "M2B-021", "modulo": 2, "topico": "2.1.1.2.2.1.6 IPO", "dificuldade": "medio", "tipo": "mc", "enunciado": "No IPO de uma empresa, a oferta tem duas parcelas: uma primária e uma secundária, em que fundos de private equity vendem parte de suas ações. Para onde vão os recursos captados?", "alternativas": ["Os recursos da parcela primária vão para o caixa da empresa; os da parcela secundária vão para os acionistas vendedores.", "Todos os recursos vão para o caixa da empresa, que repassa parte aos fundos.", "Os recursos ficam retidos na B3 até a data de vencimento das ações.", "Todos os recursos vão para os fundos de private equity, pois a empresa não emite novas ações em IPO."], "correta": 0, "explicacao": "Na distribuição primária, a companhia emite novas ações e recebe o dinheiro. Na secundária, acionistas existentes vendem ações já emitidas, e o dinheiro vai para eles, sem entrar no caixa da empresa."}, {"id": "M2B-022", "modulo": 2, "topico": "2.1.1.2.2.1.6 OPA", "dificuldade": "medio", "tipo": "mc", "enunciado": "O acionista controlador de uma companhia aberta quer cancelar o registro dela na CVM (fechar o capital). Em regra, o que ele precisa fazer?", "alternativas": ["Apenas comunicar a B3, sem nenhuma oferta aos minoritários.", "Aprovar um desdobramento das ações em AGE.", "Fazer um follow on para aumentar o número de acionistas.", "Realizar uma oferta pública de aquisição (OPA) das ações em circulação, por preço justo."], "correta": 3, "explicacao": "O cancelamento de registro de companhia aberta exige, em regra, OPA das ações em circulação a preço justo, para proteger os minoritários que não querem permanecer em uma companhia fechada, sem liquidez em bolsa."}, {"id": "M2B-023", "modulo": 2, "topico": "2.1.1.2.2.1.6 OPA", "dificuldade": "medio", "tipo": "mc", "enunciado": "Em qual das situações abaixo NÃO há, em regra, obrigatoriedade de realização de oferta pública de aquisição de ações (OPA)?", "alternativas": ["Alienação do controle de companhia aberta, em razão do tag along.", "Aumento relevante da participação do controlador que comprometa a liquidez das ações remanescentes.", "Desdobramento de ações aprovado pela companhia.", "Cancelamento do registro de companhia aberta."], "correta": 2, "explicacao": "As OPAs obrigatórias ocorrem, entre outros casos, no cancelamento de registro, na alienação de controle (tag along) e no aumento de participação do controlador. O desdobramento apenas multiplica a quantidade de ações e não envolve compra de ações dos minoritários."}, {"id": "M2B-024", "modulo": 2, "topico": "2.1.1.2.2.1.7 Follow on", "dificuldade": "facil", "tipo": "mc", "enunciado": "Uma empresa listada na B3 há cinco anos anuncia uma nova oferta pública de ações para financiar a construção de fábricas. Como essa operação é chamada?", "alternativas": ["Follow on (oferta subsequente).", "OPA para cancelamento de registro.", "Grupamento de ações.", "IPO (oferta pública inicial)."], "correta": 0, "explicacao": "Follow on é a oferta pública de ações feita por uma companhia que já tem ações negociadas em bolsa. IPO é a primeira oferta, quando a empresa estreia no mercado."}, {"id": "M2B-025", "modulo": 2, "topico": "2.1.1.2.2.1.7 Follow on", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Uma companhia anuncia um follow on exclusivamente secundário, em que o acionista controlador venderá parte de suas ações. Para um acionista minoritário que não participar da oferta, qual afirmação está correta?", "alternativas": ["Sua participação será diluída, pois a companhia emitirá novas ações.", "Não há emissão de novas ações; por isso não ocorre diluição da sua participação, e os recursos vão para o acionista vendedor.", "A companhia receberá os recursos, que serão usados para pagar dividendos extraordinários.", "Ele será obrigado a vender ações na mesma proporção do controlador."], "correta": 1, "explicacao": "Na oferta secundária, ações já existentes mudam de mãos; o número total de ações não se altera, então o percentual do minoritário é mantido e o dinheiro vai para quem vendeu. A diluição ocorre em ofertas primárias, quando novas ações são emitidas."}, {"id": "M2B-026", "modulo": 2, "topico": "2.1.1.2.2.1.8 Mercado primário versus secundário", "dificuldade": "facil", "tipo": "mc", "enunciado": "Paulo comprou, pelo home broker, 200 ações de uma companhia que já é negociada em bolsa há muitos anos. Nessa operação:", "alternativas": ["ele subscreveu novas ações emitidas naquele dia pela companhia.", "ele atuou no mercado primário, e a companhia recebeu os recursos.", "ele participou de uma OPA lançada pela companhia.", "ele atuou no mercado secundário, e o dinheiro foi para outro investidor que vendeu as ações, não para a companhia."], "correta": 3, "explicacao": "No mercado secundário, investidores negociam entre si títulos já emitidos; a companhia não recebe recursos. O mercado primário é aquele em que a empresa emite e vende novos títulos, captando dinheiro."}, {"id": "M2B-027", "modulo": 2, "topico": "2.1.1.2.2.1.8 Mercado primário versus secundário", "dificuldade": "medio", "tipo": "mc", "enunciado": "Por que um mercado secundário ativo é importante para o funcionamento do mercado primário de ações?", "alternativas": ["Porque só no mercado secundário existe registro na CVM.", "Porque oferece liquidez: o investidor aceita comprar ações em uma emissão sabendo que poderá vendê-las depois em bolsa.", "Porque o mercado secundário garante o preço da emissão primária.", "Porque no mercado secundário a companhia capta novos recursos sempre que as ações sobem."], "correta": 1, "explicacao": "O mercado secundário dá liquidez e forma preços, o que torna mais atraente para o investidor participar de emissões primárias. A companhia não capta recursos quando suas ações são negociadas entre investidores."}, {"id": "M2B-028", "modulo": 2, "topico": "2.1.1.2.2.1.8 Mercado primário versus secundário", "dificuldade": "medio", "tipo": "mc", "enunciado": "Fernanda comprou ações em um IPO com distribuição exclusivamente primária e, uma semana depois, vendeu metade delas em bolsa. Como classificar essas operações?", "alternativas": ["As duas operações ocorreram no mercado primário, pois as ações eram recém-emitidas.", "A compra ocorreu no mercado secundário e a venda no primário, pois a companhia recompra as ações.", "As duas operações ocorreram no mercado secundário, pois foram feitas em bolsa.", "A compra no IPO ocorreu no mercado primário, com recursos para a companhia; a venda ocorreu no mercado secundário, com recursos vindos do comprador."], "correta": 3, "explicacao": "Na distribuição primária a companhia emite e vende as ações, recebendo o dinheiro. Depois da estreia, as negociações entre investidores, como a venda de Fernanda, acontecem no mercado secundário."}, {"id": "M2B-029", "modulo": 2, "topico": "2.1.1.2.2.2.2 Assembleia Geral Ordinária (AGO)", "dificuldade": "facil", "tipo": "mc", "enunciado": "Uma companhia aberta encerra seu exercício social em 31 de dezembro. Até quando, pela Lei das S/A, deve realizar a sua Assembleia Geral Ordinária?", "alternativas": ["Até o fim de abril do ano seguinte, ou seja, nos quatro primeiros meses após o término do exercício.", "Até o fim de janeiro do ano seguinte.", "A qualquer momento, pois não há prazo legal para a AGO.", "Até o fim de dezembro do ano seguinte."], "correta": 0, "explicacao": "A Lei das S/A determina que a AGO seja realizada anualmente nos quatro primeiros meses seguintes ao término do exercício social. Com exercício encerrado em 31/12, o prazo vai até 30 de abril."}, {"id": "M2B-030", "modulo": 2, "topico": "2.1.1.2.2.2.2 Assembleia Geral Ordinária (AGO)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um acionista recebeu o edital de convocação de uma assembleia. Qual das matérias abaixo é típica de Assembleia Geral Ordinária (AGO)?", "alternativas": ["Aprovar a incorporação de outra companhia.", "Alterar o objeto social previsto no estatuto.", "Deliberar sobre a destinação do lucro líquido do exercício e a distribuição de dividendos.", "Aprovar um grupamento de ações com reforma do estatuto."], "correta": 2, "explicacao": "Compete à AGO tomar as contas dos administradores, votar as demonstrações financeiras, deliberar sobre a destinação do lucro e a distribuição de dividendos e eleger administradores e conselheiros fiscais, quando for o caso. Incorporação e reformas do estatuto são matérias de AGE."}, {"id": "M2B-031", "modulo": 2, "topico": "2.1.1.2.2.2.1 Assembleia Geral Extraordinária (AGE)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma companhia convocou assembleia para deliberar sobre uma fusão com outra empresa. Que tipo de assembleia é essa e qual sua característica?", "alternativas": ["Reunião do conselho fiscal, que decide sozinho sobre operações societárias.", "Assembleia especial de debenturistas, já que fusões não envolvem acionistas.", "Assembleia Geral Ordinária, que só pode ocorrer uma vez por ano para tratar de fusões.", "Assembleia Geral Extraordinária, que trata de matérias não reservadas à AGO, como reforma do estatuto, fusão, incorporação e cisão, e pode ser convocada a qualquer tempo."], "correta": 3, "explicacao": "A AGE delibera sobre qualquer assunto que não seja de competência exclusiva da AGO, como alterações estatutárias, fusões, incorporações, cisões e dissolução. Diferentemente da AGO, não tem periodicidade fixa."}, {"id": "M2B-032", "modulo": 2, "topico": "2.1.1.2.2.2.1 Assembleia Geral Extraordinária (AGE)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma companhia precisa, no mesmo mês, aprovar as demonstrações financeiras do exercício e uma alteração do seu estatuto social. Segundo a Lei das S/A, como pode proceder?", "alternativas": ["Deve aprovar as duas matérias apenas em AGO, pois a AGE só pode ocorrer no segundo semestre.", "Pode aprovar as duas matérias em reunião da diretoria, dispensando assembleias.", "Pode convocar AGO e AGE para o mesmo local, data e hora, com as deliberações registradas em ata única.", "Precisa realizar as assembleias com intervalo mínimo de 30 dias entre elas."], "correta": 2, "explicacao": "A Lei das S/A permite que a AGO e a AGE sejam convocadas e realizadas cumulativamente, no mesmo local, data e hora, e instrumentadas em ata única. As contas do exercício são matéria de AGO; a reforma do estatuto, de AGE."}, {"id": "M2B-033", "modulo": 2, "topico": "2.1.1.2.2.2.3 Dividendos", "dificuldade": "facil", "tipo": "mc", "enunciado": "Um cliente pergunta o que são dividendos. Qual é a resposta correta?", "alternativas": ["Parcela do lucro da companhia distribuída em dinheiro aos acionistas, proporcionalmente à quantidade de ações que cada um possui.", "Novas ações entregues gratuitamente aos acionistas.", "Devolução do valor investido pelo acionista quando ele vende suas ações.", "Juros pagos pela companhia aos debenturistas."], "correta": 0, "explicacao": "Dividendos são a distribuição de parte dos lucros aos acionistas, na proporção das ações detidas. Ações entregues gratuitamente caracterizam bonificação, e juros a debenturistas são remuneração de dívida."}, {"id": "M2B-034", "modulo": 2, "topico": "2.1.1.2.2.2.3 Dividendos", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma companhia anunciou dividendos com data com em 10/03. Rafael comprou ações da empresa em 11/03, primeiro dia em que as ações passaram a ser negociadas ex-dividendos. O que acontece?", "alternativas": ["Rafael recebe metade dos dividendos, pois comprou um dia após a data com.", "Rafael não recebe esses dividendos, pois só tem direito quem estava posicionado ao fim da data com; e o preço da ação tende a se ajustar para baixo na data ex.", "Rafael recebe os dividendos, mas sem isenção de IR, por ter comprado na data ex.", "Rafael recebe os dividendos, pois a liquidação de sua compra ocorre antes da data de pagamento."], "correta": 1, "explicacao": "Têm direito aos proventos os acionistas posicionados no fim da data com, considerando a data da negociação. A partir da data ex, quem compra não recebe aquele provento, e o preço da ação costuma ser ajustado pelo valor distribuído."}, {"id": "M2B-035", "modulo": 2, "topico": "2.1.1.2.2.2.3 Dividendos", "dificuldade": "dificil", "tipo": "mc", "enunciado": "O estatuto de uma companhia prevê dividendo mínimo obrigatório e a empresa apurou lucro no exercício. Qual afirmação está correta?", "alternativas": ["A companhia deve distribuir ao menos o mínimo previsto no estatuto, calculado sobre o lucro líquido ajustado, e os juros sobre capital próprio pagos podem ser imputados a esse mínimo.", "A companhia fica proibida de distribuir valores acima do dividendo mínimo obrigatório.", "O dividendo mínimo obrigatório deve ser pago mesmo nos exercícios em que a companhia tiver prejuízo.", "O dividendo mínimo obrigatório é devido apenas aos titulares de ações preferenciais."], "correta": 0, "explicacao": "O dividendo mínimo obrigatório é uma proteção aos acionistas que incide sobre o lucro ajustado; sem lucro, não há base para distribuição. A companhia pode distribuir mais que o mínimo, e os JCP podem ser imputados ao dividendo mínimo obrigatório."}, {"id": "M2B-036", "modulo": 2, "topico": "2.1.1.2.2.2.4 Juros sobre Capital Próprio (JCP)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Qual afirmação descreve corretamente os juros sobre capital próprio (JCP)?", "alternativas": ["São juros pagos aos credores da companhia, como debenturistas e bancos.", "São uma forma de remunerar os acionistas que a companhia pode deduzir como despesa no cálculo do IR e da CSLL, com retenção de IR de 15% na fonte para o acionista.", "São isentos de IR para o acionista pessoa física e não reduzem os tributos da companhia.", "São pagos apenas aos titulares de ações ordinárias, como compensação pelo voto."], "correta": 1, "explicacao": "Os JCP remuneram o capital dos sócios, são dedutíveis para a empresa (reduzindo a base de IR e CSLL, dentro dos limites legais calculados com base na TJLP) e sofrem retenção de 15% de IR na fonte para o acionista."}, {"id": "M2B-037", "modulo": 2, "topico": "2.1.1.2.2.2.4 Juros sobre Capital Próprio (JCP)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma investidora pessoa física possui 2.000 ações de uma companhia que declarou JCP de R$ 0,60 bruto por ação. Qual valor líquido ela receberá?", "alternativas": ["R$ 930,00.", "R$ 1.080,00.", "R$ 1.020,00.", "R$ 1.200,00."], "correta": 2, "explicacao": "JCP bruto: 2.000 x R$ 0,60 = R$ 1.200. Retenção de 15% na fonte: R$ 180. Líquido: R$ 1.200 - R$ 180 = R$ 1.020. O valor de R$ 1.200 seria o recebido sem a retenção, que é obrigatória nos JCP."}, {"id": "M2B-038", "modulo": 2, "topico": "2.1.1.2.2.2.4 Juros sobre Capital Próprio (JCP)", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Duas companhias anunciaram proventos. A companhia A pagará R$ 1,00 por ação a título de JCP (valor bruto). A companhia B pagará R$ 0,90 por ação a título de dividendos. Para uma pessoa física com pequena posição em ambas, qual provento é maior em termos líquidos, por ação?", "alternativas": ["O JCP de A, pois os dividendos de B sofrem retenção de 15% e rendem R$ 0,765 líquido.", "O JCP de A, pois R$ 1,00 é maior que R$ 0,90 e o JCP é isento para pessoa física.", "São iguais, pois ambos sofrem retenção de 10% de IR.", "Os dividendos de B, pois o JCP de A rende R$ 0,85 líquido após a retenção de 15%, enquanto os dividendos de B, em regra, não sofrem essa retenção."], "correta": 3, "explicacao": "No JCP há retenção de 15%: R$ 1,00 x 0,85 = R$ 0,85 líquido. Os dividendos, em regra, não têm essa retenção para a pessoa física, então B paga R$ 0,90 líquido. Comparar proventos pelo valor bruto, sem considerar a tributação, leva ao erro."}, {"id": "M2B-039", "modulo": 2, "topico": "2.1.1.2.2.2.4 Juros sobre Capital Próprio (JCP)", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Por que uma companhia pode preferir distribuir parte dos seus resultados como JCP em vez de dividendos, e como fica a tributação para o acionista pessoa física?", "alternativas": ["Porque o JCP aumenta o capital social da companhia; para o acionista, entra no ajuste anual pela tabela progressiva.", "Porque o JCP é dedutível como despesa e reduz o IR e a CSLL da companhia; para a pessoa física, o IR de 15% é retido na fonte de forma definitiva, sem recolhimento adicional via DARF.", "Porque o JCP não precisa ser aprovado pelos órgãos da companhia; para o acionista, deve ser recolhido via DARF até o mês seguinte.", "Porque o JCP é isento para a companhia e para o acionista, enquanto o dividendo é tributado em ambos."], "correta": 1, "explicacao": "A vantagem para a empresa é a dedutibilidade do JCP na apuração do lucro tributável. Para o acionista pessoa física, a retenção de 15% é tributação exclusiva na fonte: não há ajuste nem DARF adicional."}, {"id": "M2B-040", "modulo": 2, "topico": "2.1.1.2.2.2.5 Restituição de capital", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma companhia aprovou em assembleia a redução do seu capital social, considerado excessivo, devolvendo parte dos recursos em dinheiro aos acionistas. Como esse evento deve ser entendido pela pessoa investidora?", "alternativas": ["Como restituição de capital: devolução de parte do capital investido, que não se confunde com distribuição de lucros e, em regra, reduz o custo de aquisição das ações.", "Como juros sobre capital próprio, com retenção de 15%.", "Como bonificação em dinheiro, que aumenta o custo de aquisição das ações.", "Como dividendo extraordinário, sempre tributado a 15% na fonte."], "correta": 0, "explicacao": "Na restituição de capital, a companhia devolve aos acionistas parte do capital aportado, por exemplo quando o considera excessivo. Não é remuneração do lucro como dividendos ou JCP; em regra, o valor recebido é tratado como redução do custo de aquisição das ações."}, {"id": "M2B-041", "modulo": 2, "topico": "2.1.1.2.2.2.6 Grupamentos e desdobramentos", "dificuldade": "facil", "tipo": "mc", "enunciado": "Um cliente tem 300 ações cotadas a R$ 60,00. A companhia aprovou um desdobramento na proporção de 1 para 3 (cada ação passa a ser três). Desconsiderando oscilações de mercado, como fica a posição dele?", "alternativas": ["100 ações cotadas a R$ 180,00, totalizando R$ 18.000,00.", "900 ações cotadas a R$ 60,00, totalizando R$ 54.000,00.", "900 ações cotadas a R$ 20,00, totalizando os mesmos R$ 18.000,00.", "300 ações cotadas a R$ 20,00, totalizando R$ 6.000,00."], "correta": 2, "explicacao": "No desdobramento a quantidade é multiplicada e o preço dividido pelo mesmo fator: 300 x 3 = 900 ações e R$ 60 / 3 = R$ 20. O patrimônio permanece em R$ 18.000 (300 x 60 = 900 x 20)."}, {"id": "M2B-042", "modulo": 2, "topico": "2.1.1.2.2.2.6 Grupamentos e desdobramentos", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma companhia cujas ações estão cotadas a R$ 0,80 aprovou um grupamento na proporção de 10 para 1. Um acionista tem 5.000 ações. Desconsiderando oscilações de mercado, qual será sua posição após o evento?", "alternativas": ["500 ações cotadas a R$ 0,80.", "5.000 ações cotadas a R$ 8,00.", "50.000 ações cotadas a R$ 0,08.", "500 ações cotadas a R$ 8,00."], "correta": 3, "explicacao": "No grupamento (inplit), várias ações viram uma: 5.000 / 10 = 500 ações e o preço é multiplicado pelo fator, R$ 0,80 x 10 = R$ 8,00. O patrimônio continua em R$ 4.000. Esse evento costuma ser usado para elevar a cotação de ações negociadas a centavos."}, {"id": "M2B-043", "modulo": 2, "topico": "2.1.1.2.2.2.6 Grupamentos e desdobramentos", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma companhia com ações cotadas em patamar muito elevado aprovou um desdobramento. Qual é o objetivo mais comum dessa medida e seu efeito sobre o acionista?", "alternativas": ["Aumentar o capital social com incorporação de reservas, entregando ações gratuitas com valor adicional.", "Reduzir o número de acionistas, forçando a saída dos minoritários.", "Tornar o preço unitário mais acessível e aumentar a liquidez, sem alterar o capital social nem o valor da posição do acionista.", "Distribuir lucros sem incidência de imposto, aumentando o patrimônio do acionista."], "correta": 2, "explicacao": "O desdobramento (split) apenas divide cada ação em mais unidades, reduzindo o preço por ação, o que pode facilitar negociações e aumentar a liquidez. Não há criação de valor nem alteração do capital social; a posição do acionista é a mesma."}, {"id": "M2B-044", "modulo": 2, "topico": "2.1.1.2.2.2.6 Grupamentos e desdobramentos", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Uma investidora comprou 300 ações por R$ 45,00 cada (custo total de R$ 13.500,00). Depois, a companhia fez um desdobramento de 1 para 3. Meses mais tarde, ela vendeu todas as ações a R$ 25,00 cada, em operação comum, sem outras vendas no mês. Desconsiderando custos e o IR retido na fonte, qual é o imposto devido?", "alternativas": ["R$ 0,00, pois o desdobramento torna a operação isenta.", "R$ 2.700,00.", "Zero, pois o preço de venda (R$ 25) é inferior ao de compra (R$ 45).", "R$ 1.350,00."], "correta": 3, "explicacao": "Após o desdobramento, ela passa a ter 900 ações com custo médio de R$ 13.500 / 900 = R$ 15,00. A venda soma 900 x R$ 25 = R$ 22.500 (acima de R$ 20 mil, sem isenção). Lucro: R$ 22.500 - R$ 13.500 = R$ 9.000; IR de 15% = R$ 1.350. Comparar o preço de venda com o preço anterior ao desdobramento é o erro clássico."}, {"id": "M2B-045", "modulo": 2, "topico": "2.1.1.2.2.2.6 Grupamentos e desdobramentos", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um investidor tinha 8.000 ações com custo médio de R$ 2,00 por ação. A companhia realizou um grupamento de 4 para 1. Como fica o custo de aquisição para fins de IR?", "alternativas": ["8.000 ações com custo médio de R$ 8,00, elevando o custo total para R$ 64.000,00.", "2.000 ações com custo médio de R$ 8,00, mantendo o custo total de R$ 16.000,00.", "2.000 ações com custo médio de R$ 2,00, reduzindo o custo total para R$ 4.000,00.", "32.000 ações com custo médio de R$ 0,50, mantendo o custo total."], "correta": 1, "explicacao": "O grupamento não altera o custo total investido (8.000 x R$ 2 = R$ 16.000). A quantidade é dividida por 4 (2.000 ações) e o custo médio unitário multiplicado por 4 (R$ 8,00)."}, {"id": "M2B-046", "modulo": 2, "topico": "2.1.1.2.2.2.7 Bonificação", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um acionista tem 500 ações cotadas a R$ 22,00. A companhia aprovou bonificação de 10% em ações. Desconsiderando oscilações de mercado, qual o efeito esperado?", "alternativas": ["Ele passa a ter 550 ações, e o preço teórico de cada ação se ajusta para R$ 20,00, mantendo o valor da posição em R$ 11.000,00.", "Ele passa a ter 550 ações a R$ 22,00, ganhando R$ 1.100,00 instantaneamente.", "Ele passa a ter 500 ações a R$ 24,20.", "Ele recebe R$ 1.100,00 em dinheiro, isentos de IR."], "correta": 0, "explicacao": "Bonificação de 10%: 500 x 10% = 50 novas ações, totalizando 550. Como o valor da empresa não muda com o evento, o preço teórico se ajusta: R$ 11.000 / 550 = R$ 20,00."}, {"id": "M2B-047", "modulo": 2, "topico": "2.1.1.2.2.2.7 Bonificação", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Qual é a principal diferença entre uma bonificação em ações e um desdobramento?", "alternativas": ["A bonificação reduz a quantidade de ações; o desdobramento a aumenta.", "A bonificação decorre da incorporação de lucros ou reservas ao capital social, aumentando o capital; o desdobramento apenas divide as ações existentes, sem alterar o capital social.", "A bonificação é paga em dinheiro; o desdobramento é pago em ações.", "A bonificação exige que o acionista pague pelas novas ações; o desdobramento não."], "correta": 1, "explicacao": "Nos dois eventos o acionista recebe mais ações sem pagar nada, mas a origem é diferente: a bonificação resulta da capitalização de lucros ou reservas, aumentando o capital social; no desdobramento, o capital social não muda, só o número de ações em que ele se divide."}, {"id": "M2B-048", "modulo": 2, "topico": "2.1.1.2.2.2.8 Subscrição", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um acionista tem 1.000 ações de uma companhia que aprovou aumento de capital com direito de preferência na proporção de 1 nova ação para cada 5 possuídas, ao preço de R$ 10,00. Se exercer todo o seu direito, quantas ações subscreverá e quanto desembolsará?", "alternativas": ["200 ações e R$ 2.000,00.", "200 ações, sem desembolso.", "1.000 ações e R$ 10.000,00.", "5.000 ações e R$ 50.000,00."], "correta": 0, "explicacao": "Proporção de 1 para 5: 1.000 / 5 = 200 novas ações. Ao preço de R$ 10,00, o desembolso é 200 x R$ 10 = R$ 2.000. Diferentemente da bonificação, na subscrição o acionista paga pelas novas ações."}, {"id": "M2B-049", "modulo": 2, "topico": "2.1.1.2.2.2.8 Subscrição", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma cliente recebeu direitos de subscrição de uma companhia, mas não tem recursos para exercê-los. Qual orientação está correta?", "alternativas": ["Ela é obrigada a subscrever as ações, sob pena de multa da CVM.", "Ela deve aguardar, pois a companhia devolverá o valor dos direitos em dinheiro após o prazo.", "Os direitos não exercidos são convertidos automaticamente em dividendos.", "Ela pode vender (ceder) os direitos de subscrição em bolsa dentro do prazo, recuperando parte do valor; se não fizer nada, os direitos expiram e ela terá sua participação diluída."], "correta": 3, "explicacao": "O direito de preferência permite manter a participação proporcional em aumentos de capital, mas não é obrigatório. O direito tem valor e pode ser negociado durante o período de subscrição; se não for exercido nem vendido, expira, e a participação do acionista é diluída."}, {"id": "M2B-050", "modulo": 2, "topico": "2.1.1.2.2.2.8 Subscrição", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Uma investidora detém 200 mil ações de uma companhia com 10 milhões de ações (2% do capital). A companhia emite 2,5 milhões de novas ações em um aumento de capital, e ela decide não subscrever nem vender seus direitos. Qual será sua participação após o aumento?", "alternativas": ["2,5%.", "1,5%.", "1,6%.", "2,0%."], "correta": 2, "explicacao": "Após a emissão, o total de ações passa a 10 + 2,5 = 12,5 milhões. A participação dela fica em 200 mil / 12,5 milhões = 1,6%. Essa redução é a diluição sofrida por quem não exerce o direito de preferência."}, {"id": "M2B-051", "modulo": 2, "topico": "2.1.1.2.2.3 Índices de mercado: Ibovespa", "dificuldade": "facil", "tipo": "mc", "enunciado": "Um cliente quer saber como está, de forma geral, o desempenho do mercado brasileiro de ações. Qual indicador é usado como principal referência para isso?", "alternativas": ["O IPCA, que mede a valorização das empresas de capital aberto.", "O CDI, que mede a variação média das ações listadas.", "A taxa Selic, que mede a rentabilidade média das ações do Novo Mercado.", "O Ibovespa, que mede o desempenho médio de uma carteira teórica das ações mais negociadas e representativas da B3."], "correta": 3, "explicacao": "O Ibovespa é o principal indicador de desempenho médio das cotações do mercado de ações brasileiro, composto pelas ações de maior negociabilidade e representatividade. CDI e Selic são referências de juros, e o IPCA mede inflação."}, {"id": "M2B-052", "modulo": 2, "topico": "2.1.1.2.2.3 Índices de mercado: Ibovespa", "dificuldade": "medio", "tipo": "mc", "enunciado": "Sobre a metodologia do Ibovespa, qual afirmação está correta?", "alternativas": ["Sua carteira é fixa desde a criação do índice e nunca é alterada.", "Sua carteira teórica é reavaliada a cada quatro meses, e as ações são ponderadas pelo valor de mercado do free float, observados limites de participação.", "Todas as ações do índice têm exatamente o mesmo peso, independentemente do tamanho da empresa.", "Incluem-se apenas empresas listadas no Novo Mercado."], "correta": 1, "explicacao": "O Ibovespa tem carteira teórica rebalanceada quadrimestralmente, com critérios de negociabilidade e presença em pregões, e ponderação pelo valor de mercado das ações em circulação (free float), com limites para evitar concentração excessiva."}, {"id": "M2B-053", "modulo": 2, "topico": "2.1.1.2.2.3 Índices de mercado: IBrX-100 e IBrX-50", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma pessoa investidora compara fundos de ações cujos benchmarks são o IBrX-100 e o IBrX-50. Qual diferença entre esses índices está correta?", "alternativas": ["O IBrX-50 mede o desempenho de títulos públicos; o IBrX-100, de ações.", "O IBrX-100 reúne empresas de 100 países; o IBrX-50 reúne apenas empresas brasileiras.", "O IBrX-100 reúne as 100 ações de maior negociabilidade e representatividade da B3; o IBrX-50 reúne as 50 principais, segundo critérios semelhantes.", "O IBrX-100 é composto apenas por ações preferenciais; o IBrX-50, apenas por ordinárias."], "correta": 2, "explicacao": "Os índices IBrX-100 e IBrX-50 medem o desempenho de carteiras teóricas com, respectivamente, as 100 e as 50 ações mais negociadas e representativas do mercado brasileiro, ponderadas pelo valor de mercado do free float."}, {"id": "M2B-054", "modulo": 2, "topico": "2.1.1.2.2.3 Índices de mercado: IBrX-100 e IBrX-50", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Duas empresas do IBrX-100 têm o mesmo valor de mercado total. Na empresa X, 80% das ações estão em circulação; na empresa Y, apenas 30%, pois o restante pertence ao controlador. Considerando a metodologia de ponderação dos índices amplos da B3, como Ibovespa e IBrX, o que se espera?", "alternativas": ["A empresa X tende a ter peso maior no índice, pois a ponderação considera o valor de mercado das ações em circulação (free float).", "Nenhuma das duas pode integrar o índice, pois ambas têm controlador.", "A empresa Y terá peso maior, porque o controlador garante estabilidade das ações.", "As duas terão o mesmo peso, pois a ponderação considera o valor de mercado total."], "correta": 0, "explicacao": "Esses índices ponderam as ações pelo valor de mercado do free float, isto é, apenas da parcela efetivamente disponível para negociação. Com mesmo valor de mercado total, a empresa com maior free float terá maior peso."}, {"id": "M2B-055", "modulo": 2, "topico": "2.1.1.2.3.1.1 Segmentos de listagem", "dificuldade": "facil", "tipo": "mc", "enunciado": "Um investidor quer investir apenas em companhias que tenham somente ações com direito a voto e que adotem o mais alto padrão de governança corporativa da B3. Qual segmento de listagem atende a esse critério?", "alternativas": ["Novo Mercado.", "Nível 1.", "Segmento Básico.", "Nível 2."], "correta": 0, "explicacao": "O Novo Mercado é o segmento com as exigências mais rigorosas de governança e admite apenas ações ordinárias (com voto). O Nível 2 tem regras parecidas, mas permite ações preferenciais."}, {"id": "M2B-056", "modulo": 2, "topico": "2.1.1.2.3.1.1 Segmentos de listagem", "dificuldade": "medio", "tipo": "mc", "enunciado": "Qual característica diferencia o Nível 2 do Novo Mercado da B3?", "alternativas": ["O Nível 2 dispensa a divulgação de demonstrações financeiras; o Novo Mercado exige.", "O Nível 2 é obrigatório para todas as companhias abertas; o Novo Mercado é voluntário.", "O Nível 2 não exige conselho de administração; o Novo Mercado exige.", "O Nível 2 permite a existência de ações preferenciais, garantindo tag along de 100% também a elas; o Novo Mercado admite apenas ações ordinárias."], "correta": 3, "explicacao": "Nível 2 e Novo Mercado têm regras de governança semelhantes, mas o Nível 2 aceita ações preferenciais, às quais assegura tag along de 100% e direito de voto em determinadas matérias. O Novo Mercado só admite ações ordinárias."}, {"id": "M2B-057", "modulo": 2, "topico": "2.1.1.2.3.1.1 Segmentos de listagem", "dificuldade": "medio", "tipo": "mc", "enunciado": "Sobre os segmentos especiais de listagem da B3 (Nível 1, Nível 2, Novo Mercado, Bovespa Mais), qual afirmação está correta?", "alternativas": ["O segmento é definido pela CVM de acordo com a rentabilidade da companhia no ano anterior.", "A adesão é obrigatória por lei para todas as companhias abertas, conforme o seu tamanho.", "A adesão é voluntária e, ao aderir, a companhia se compromete com regras de governança e transparência adicionais às exigidas pela legislação.", "Os segmentos garantem rentabilidade mínima aos acionistas das companhias participantes."], "correta": 2, "explicacao": "Os segmentos especiais foram criados pela B3 e a adesão é voluntária, por contrato. As empresas assumem compromissos que vão além da Lei das S/A e das normas da CVM, o que reduz a assimetria de informação para os investidores, sem qualquer garantia de retorno."}, {"id": "M2B-058", "modulo": 2, "topico": "2.1.1.2.3.1.1 Segmentos de listagem", "dificuldade": "medio", "tipo": "mc", "enunciado": "Qual afirmação sobre o Nível 1 de governança corporativa da B3 está correta?", "alternativas": ["É exclusivo para empresas que ainda não fizeram oferta pública de ações.", "Exige práticas adicionais de transparência e um percentual mínimo de ações em circulação, sem impedir a existência de ações preferenciais.", "É o segmento com as regras mais rígidas da B3.", "Admite apenas ações ordinárias e exige tag along de 100%."], "correta": 1, "explicacao": "O Nível 1 exige, principalmente, melhorias na divulgação de informações e a manutenção de um free float mínimo, mas permite ações preferenciais e não amplia o tag along além do previsto em lei. O segmento mais rigoroso é o Novo Mercado."}, {"id": "M2B-059", "modulo": 2, "topico": "2.1.1.2.3.1.2 Conselho de administração", "dificuldade": "medio", "tipo": "mc", "enunciado": "Qual é o papel do conselho de administração em uma sociedade anônima?", "alternativas": ["Órgão de auditoria externa contratado pela CVM para revisar as demonstrações financeiras.", "Órgão colegiado eleito pela assembleia geral, responsável por fixar a orientação geral dos negócios, eleger e destituir os diretores e fiscalizar a gestão.", "Órgão formado exclusivamente pelos acionistas minoritários para fiscalizar o controlador.", "Órgão responsável pela execução das operações diárias da empresa, como vendas e compras."], "correta": 1, "explicacao": "O conselho de administração faz a ponte entre acionistas e diretoria: define a estratégia, elege e destitui diretores e fiscaliza a gestão. A execução do dia a dia cabe à diretoria, e a auditoria independente é contratada pela própria companhia."}, {"id": "M2B-060", "modulo": 2, "topico": "2.1.1.2.3.1.2 Conselho de administração", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Segundo o regulamento do Novo Mercado da B3, qual exigência se aplica ao conselho de administração das companhias listadas no segmento?", "alternativas": ["Ter no mínimo 2 conselheiros independentes ou 20% de independentes, o que for maior, e não permitir que a mesma pessoa acumule os cargos de presidente do conselho e de diretor-presidente.", "Ter mandato vitalício para os conselheiros, garantindo estabilidade.", "Ser composto exclusivamente por membros indicados pelo acionista controlador.", "Ser formado apenas por diretores da própria companhia, para agilizar as decisões."], "correta": 0, "explicacao": "O Novo Mercado exige conselheiros independentes (no mínimo 2 ou 20%, o que for maior) e veda a acumulação dos cargos de presidente do conselho e principal executivo, para separar a supervisão da gestão."}, {"id": "M2B-061", "modulo": 2, "topico": "2.1.1.2.3.1.3 Tag along", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente pergunta o que é tag along. Qual resposta está correta?", "alternativas": ["É o direito do controlador de obrigar os minoritários a vender suas ações junto com ele.", "É o direito de subscrever novas ações em aumento de capital.", "É a parcela das ações da companhia que está em circulação no mercado.", "É o direito dos acionistas minoritários de vender suas ações ao comprador do controle, por um preço mínimo em relação ao pago ao controlador, quando há alienação de controle."], "correta": 3, "explicacao": "Tag along é um mecanismo de proteção ao minoritário: na venda do controle, o comprador deve oferecer-lhe a compra das ações por um percentual mínimo do preço pago ao controlador. O direito de obrigar os minoritários a vender é o drag along."}, {"id": "M2B-062", "modulo": 2, "topico": "2.1.1.2.3.1.3 Tag along", "dificuldade": "dificil", "tipo": "mc", "enunciado": "O controlador de uma companhia listada no segmento Básico da B3 vendeu o controle por R$ 50,00 por ação ordinária. Um cliente tem ações ordinárias dessa companhia, que não prevê no estatuto benefício além do legal. Qual o preço mínimo que o comprador do controle deverá oferecer por ação ao cliente?", "alternativas": ["R$ 25,00, correspondente a 50% do valor pago ao controlador.", "R$ 50,00, pois o tag along é sempre de 100%.", "R$ 40,00, correspondente a 80% do valor pago por ação com direito a voto integrante do bloco de controle.", "Nenhum valor, pois o tag along só existe no Novo Mercado."], "correta": 2, "explicacao": "A Lei das S/A garante tag along mínimo de 80% do preço pago pelas ações com voto do bloco de controle: 80% x R$ 50 = R$ 40. Se a companhia estivesse no Novo Mercado ou no Nível 2, o tag along seria de 100%, ou seja, R$ 50."}, {"id": "M2B-063", "modulo": 2, "topico": "2.1.1.2.3.1.3 Drag along", "dificuldade": "medio", "tipo": "mc", "enunciado": "O acordo de acionistas de uma companhia prevê cláusula de drag along. O que essa cláusula significa?", "alternativas": ["Que a companhia deve manter um percentual mínimo de ações em circulação.", "Que os minoritários têm preferência na compra das ações do controlador.", "Que, se o acionista majoritário vender sua participação, pode obrigar os minoritários a vender suas ações ao mesmo comprador, nas mesmas condições.", "Que os minoritários têm o direito de vender suas ações por 80% do preço pago ao controlador."], "correta": 2, "explicacao": "Drag along é o direito de arrastar: o majoritário pode exigir que os minoritários vendam junto, o que facilita a venda de 100% da empresa a um comprador. O tag along é o inverso: um direito do minoritário de acompanhar a venda do controlador."}, {"id": "M2B-064", "modulo": 2, "topico": "2.1.1.2.3.1.3 Free float", "dificuldade": "facil", "tipo": "mc", "enunciado": "Em governança corporativa e análise de ações, o que significa free float?", "alternativas": ["O valor das ações que pode ser vendido sem pagar IR no mês.", "O direito do minoritário de vender ações junto com o controlador.", "O total de dividendos distribuídos pela companhia no ano.", "A parcela das ações de uma companhia disponível para livre negociação no mercado, excluídas as do controlador, dos administradores e as mantidas em tesouraria."], "correta": 3, "explicacao": "Free float são as ações em circulação, efetivamente disponíveis para negociação. Quanto maior, tende a ser maior a liquidez e a dispersão acionária, por isso os segmentos de listagem exigem percentuais mínimos."}, {"id": "M2B-065", "modulo": 2, "topico": "2.1.1.2.3.1.3 Free float", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um gestor prefere ações de companhias com free float elevado. Qual é a justificativa mais adequada para essa preferência?", "alternativas": ["Maior free float dá direito automático a tag along de 100%.", "Maior free float tende a significar maior liquidez e dispersão do capital, o que facilita a negociação e reduz o risco de distorções de preço.", "Maior free float isenta o investidor de IR sobre o ganho de capital.", "Maior free float garante o pagamento de dividendos mais altos."], "correta": 1, "explicacao": "Com mais ações em circulação, há mais negócios e mais participantes formando o preço, o que melhora a liquidez. O free float não determina dividendos, tag along nem tributação."}, {"id": "M2B-066", "modulo": 2, "topico": "2.1.1.3.1 Alíquotas", "dificuldade": "facil", "tipo": "mc", "enunciado": "Quais são as alíquotas de IR sobre o ganho líquido de pessoa física em operações com ações na bolsa?", "alternativas": ["15% nas operações comuns e 20% nas operações de day trade.", "10% em qualquer operação, retidos na fonte.", "20% nas operações comuns e 15% nas operações de day trade.", "22,5% a 15% conforme o prazo, como na renda fixa."], "correta": 0, "explicacao": "O ganho líquido em ações é tributado a 15% em operações comuns (swing trade) e a 20% em day trade. Não se aplica a tabela regressiva da renda fixa."}, {"id": "M2B-067", "modulo": 2, "topico": "2.1.1.3.1 Alíquotas", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Em março, um investidor pessoa física vendeu ações em operações comuns por R$ 35.000,00, com custo de aquisição de R$ 28.000,00. Houve retenção na fonte de 0,005% sobre o valor da venda. Desconsiderando corretagem e emolumentos, qual valor ele deve recolher via DARF?", "alternativas": ["Zero, pois o lucro foi inferior a R$ 20 mil.", "R$ 1.048,25.", "R$ 1.050,00.", "R$ 1.400,00."], "correta": 1, "explicacao": "As vendas superaram R$ 20 mil, então não há isenção. Lucro: R$ 35.000 - R$ 28.000 = R$ 7.000; IR de 15% = R$ 1.050. O IR retido (0,005% x R$ 35.000 = R$ 1,75) é deduzido: R$ 1.050 - R$ 1,75 = R$ 1.048,25. A isenção considera o total vendido no mês, não o lucro."}, {"id": "M2B-068", "modulo": 2, "topico": "2.1.1.3.1 Alíquotas", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Um investidor fez operações de day trade com ações em um mês e obteve ganho líquido de R$ 2.000,00, com vendas totais de R$ 10.000,00. Sobre o resultado, a corretora reteve 1% na fonte. Qual valor ele deve recolher via DARF?", "alternativas": ["R$ 400,00.", "R$ 280,00.", "R$ 380,00.", "Zero, pois as vendas no mês ficaram abaixo de R$ 20 mil."], "correta": 2, "explicacao": "Day trade é tributado a 20% e não tem a isenção de R$ 20 mil: 20% x R$ 2.000 = R$ 400. A retenção de 1% sobre o resultado (R$ 20) é deduzida, restando R$ 380 a recolher."}, {"id": "M2B-069", "modulo": 2, "topico": "2.1.1.3.1 Alíquotas", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Uma investidora comprou 1.000 ações a R$ 20,00 e, depois, mais 3.000 ações da mesma empresa a R$ 24,00. Em seguida, vendeu 2.000 ações a R$ 30,00, em operação comum. Desconsiderando custos e o IR retido na fonte, qual é o IR devido?", "alternativas": ["R$ 2.100,00.", "R$ 1.800,00.", "R$ 2.400,00.", "R$ 3.000,00."], "correta": 0, "explicacao": "O ganho é apurado pelo custo médio: (1.000 x 20 + 3.000 x 24) / 4.000 = R$ 92.000 / 4.000 = R$ 23,00. Venda: 2.000 x R$ 30 = R$ 60.000 (acima de R$ 20 mil). Lucro: 2.000 x (30 - 23) = R$ 14.000; IR de 15% = R$ 2.100. Usar o primeiro preço de compra (R$ 20) daria R$ 3.000, o que não é permitido."}, {"id": "M2B-070", "modulo": 2, "topico": "2.1.1.3.1 Alíquotas", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente apurou lucro tributável na venda de ações em operações comuns em agosto. Como funciona o recolhimento do IR?", "alternativas": ["O imposto é recolhido semestralmente pelo come-cotas, em maio e novembro.", "A corretora retém todo o imposto devido no momento da venda, sem necessidade de DARF.", "O imposto só é pago na declaração anual de ajuste, pela tabela progressiva.", "O próprio investidor apura o imposto e o recolhe via DARF até o último dia útil do mês seguinte, podendo deduzir o IR retido na fonte (dedo-duro)."], "correta": 3, "explicacao": "Em renda variável, a apuração é mensal e de responsabilidade do investidor, com pagamento via DARF até o último dia útil do mês subsequente. A retenção de 0,005% é apenas uma antecipação para controle da Receita, que pode ser deduzida do imposto devido."}, {"id": "M2B-071", "modulo": 2, "topico": "2.1.1.3.2 Isenções", "dificuldade": "facil", "tipo": "mc", "enunciado": "Em um mês, uma investidora pessoa física vendeu ações no mercado à vista, em operações comuns, no total de R$ 18.000,00, com lucro de R$ 4.000,00. Qual é o IR devido?", "alternativas": ["R$ 2.700,00, correspondentes a 15% do valor vendido.", "R$ 600,00, correspondentes a 15% do lucro.", "Zero, pois o total de vendas de ações no mês não ultrapassou R$ 20 mil.", "R$ 800,00, correspondentes a 20% do lucro."], "correta": 2, "explicacao": "A pessoa física tem isenção de IR sobre o ganho em vendas de ações no mercado à vista quando o total vendido no mês não ultrapassa R$ 20 mil, exceto em day trade. Como as vendas foram de R$ 18 mil, o lucro de R$ 4 mil é isento."}, {"id": "M2B-072", "modulo": 2, "topico": "2.1.1.3.2 Isenções", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Um investidor vendeu ações no mercado à vista, em operações comuns, no total de R$ 25.000,00 em um mês, com lucro de R$ 1.000,00. Ele acredita estar isento porque o lucro foi muito inferior a R$ 20 mil. Desconsiderando o IR retido na fonte, qual é a situação correta?", "alternativas": ["Ele está isento, pois o lucro é inferior a 5% do valor vendido.", "Ele deve R$ 3.750,00, pois o IR incide sobre o valor total vendido.", "Ele está isento, pois o limite de R$ 20 mil se refere ao lucro mensal.", "Ele deve R$ 150,00 de IR, pois o limite de isenção se refere ao valor total das vendas no mês, e não ao lucro."], "correta": 3, "explicacao": "A isenção vale quando o total das alienações de ações no mês é de até R$ 20 mil. Como ele vendeu R$ 25 mil, o lucro de R$ 1.000 é tributado a 15%: R$ 150. Confundir limite de vendas com limite de lucro é um erro comum."}, {"id": "M2B-073", "modulo": 2, "topico": "2.1.1.3.2 Isenções", "dificuldade": "medio", "tipo": "mc", "enunciado": "Qual das operações abaixo, feita por pessoa física em um mês com total de vendas de R$ 12.000,00, pode se beneficiar da isenção de IR de R$ 20 mil mensais?", "alternativas": ["Venda de cotas de ETF de ações.", "Venda de ações no mercado à vista em operação comum.", "Day trade com ações.", "Venda de BDRs no mercado à vista."], "correta": 1, "explicacao": "A isenção de R$ 20 mil mensais é restrita à alienação de ações no mercado à vista em operações comuns por pessoa física. Day trade, BDRs e cotas de ETF não contam com esse benefício e são tributados mesmo com vendas abaixo desse valor."}, {"id": "M2B-074", "modulo": 2, "topico": "2.1.1.3.3 Compensação de perdas", "dificuldade": "medio", "tipo": "mc", "enunciado": "Em janeiro, um investidor teve prejuízo de R$ 3.000,00 em operações comuns com ações. Em fevereiro, vendeu R$ 50.000,00 em ações, também em operações comuns, com lucro de R$ 8.000,00. Desconsiderando custos e o IR retido na fonte, qual é o IR devido em fevereiro?", "alternativas": ["R$ 750,00.", "Zero, pois o prejuízo de janeiro zera o imposto de fevereiro.", "R$ 1.200,00.", "R$ 1.000,00."], "correta": 0, "explicacao": "O prejuízo em operações comuns pode ser compensado com lucros futuros da mesma modalidade. Base de cálculo: R$ 8.000 - R$ 3.000 = R$ 5.000; IR de 15% = R$ 750. Sem a compensação, o imposto seria R$ 1.200."}, {"id": "M2B-075", "modulo": 2, "topico": "2.1.1.3.3 Compensação de perdas", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Em um mês, uma investidora teve prejuízo de R$ 2.000,00 em day trade e lucro de R$ 6.000,00 em operações comuns com ações, com vendas totais acima de R$ 20 mil. Não havia prejuízos anteriores. Desconsiderando custos e IR retido, qual o IR devido no mês?", "alternativas": ["R$ 800,00, aplicando 20% sobre o resultado líquido das duas modalidades.", "R$ 600,00, compensando o prejuízo de day trade com o lucro das operações comuns.", "Zero, pois o resultado do day trade anula o imposto das operações comuns.", "R$ 900,00, e o prejuízo de day trade fica acumulado para compensar lucros futuros de day trade."], "correta": 3, "explicacao": "Prejuízos só se compensam com lucros da mesma modalidade. O lucro comum é tributado integralmente: 15% x R$ 6.000 = R$ 900. O prejuízo de R$ 2.000 em day trade fica registrado para abater futuros ganhos em day trade."}, {"id": "M2B-076", "modulo": 2, "topico": "2.1.1.3.3 Compensação de perdas", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente acumulou prejuízo em operações comuns com ações em 2024 e ainda não teve lucros para compensá-lo. Em 2026 ele voltou a ter lucro tributável na mesma modalidade. O que ele pode fazer?", "alternativas": ["Compensar apenas 30% do lucro com prejuízos de anos anteriores.", "Compensar o prejuízo acumulado com o lucro de 2026, pois não há prazo limite para essa compensação, desde que os prejuízos estejam devidamente controlados e declarados.", "Nada, pois prejuízos só podem ser compensados no mesmo ano-calendário.", "Pedir à Receita a restituição em dinheiro do prejuízo de 2024."], "correta": 1, "explicacao": "Os prejuízos em renda variável da pessoa física podem ser compensados com lucros futuros da mesma modalidade sem limite de prazo e sem trava percentual. O investidor deve manter o controle e informá-los na declaração anual."}, {"id": "M2B-077", "modulo": 2, "topico": "2.1.1.3.4 IOF em renda variável", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma investidora comprou ações e as vendeu, com lucro, 10 dias depois, em operação comum. Ela pergunta se haverá cobrança de IOF, como ocorre em resgates de renda fixa antes de 30 dias. Qual a resposta correta?", "alternativas": ["Sim, incide IOF regressivo de 67% sobre o lucro, por ter sido vendida em 10 dias.", "Sim, pois todo investimento resgatado antes de 30 dias paga IOF, inclusive ações.", "Não há cobrança de IOF nas operações com ações no mercado à vista (alíquota zero); o IOF regressivo dos primeiros 29 dias é típico de renda fixa e fundos.", "Sim, incide IOF de 0,38% sobre o valor total vendido."], "correta": 2, "explicacao": "As operações com ações no mercado à vista não sofrem cobrança de IOF. A tabela regressiva de IOF sobre rendimentos nos primeiros 29 dias se aplica a aplicações de renda fixa e fundos, não à venda de ações."}, {"id": "M2B-078", "modulo": 2, "topico": "2.1.1.4.1 COE: principais regras e estrutura via derivativos", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um gerente apresenta a uma cliente um Certificado de Operações Estruturadas (COE). Qual descrição desse produto está correta?", "alternativas": ["É um instrumento emitido por banco que combina elementos de renda fixa e derivativos, com remuneração vinculada a um ativo de referência e cenários de retorno definidos na emissão.", "É um título público federal atrelado a índices de ações.", "É uma ação preferencial de banco com dividendo garantido.", "É uma cota de fundo de investimento que aplica em derivativos, com gestão ativa."], "correta": 0, "explicacao": "O COE é emitido por instituição financeira e une, em um só produto, uma parcela de renda fixa e derivativos (geralmente opções), atrelando o retorno a ativos de referência como índices, ações ou moedas. Os cenários de ganho e perda são conhecidos na contratação."}, {"id": "M2B-079", "modulo": 2, "topico": "2.1.1.4.1 COE: principais regras e estrutura via derivativos", "dificuldade": "facil", "tipo": "mc", "enunciado": "Uma cliente pergunta se o COE que pretende contratar está coberto pelo Fundo Garantidor de Créditos (FGC). Qual a resposta correta?", "alternativas": ["Sim, mas apenas para COEs com capital protegido.", "Não; o COE não tem cobertura do FGC, e a pessoa investidora fica exposta ao risco de crédito do banco emissor.", "Sim, até R$ 1 milhão, pois o COE é um produto estruturado.", "Sim, até R$ 250 mil por CPF, como os CDBs do mesmo banco."], "correta": 1, "explicacao": "O COE não está entre os produtos cobertos pelo FGC. Mesmo um COE com capital protegido depende da capacidade de pagamento do emissor: se o banco quebrar, a proteção não se realiza."}, {"id": "M2B-080", "modulo": 2, "topico": "2.1.1.4.1 COE: principais regras e estrutura via derivativos", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Um banco estrutura um COE de capital protegido com prazo de 2 anos e aplicação de R$ 10.000,00. Para garantir a devolução do valor nominal no vencimento, aplica em renda fixa uma taxa que rende 25% no período. Quanto sobra, aproximadamente, para comprar os derivativos que darão a participação na alta do ativo de referência?", "alternativas": ["R$ 2.000,00.", "R$ 2.500,00.", "R$ 7.500,00.", "R$ 8.000,00."], "correta": 0, "explicacao": "Para ter R$ 10.000 no vencimento com rendimento de 25%, é preciso aplicar R$ 10.000 / 1,25 = R$ 8.000 na parcela de renda fixa. O restante, R$ 2.000, é usado na compra de opções. Subtrair 25% de R$ 10.000 (resultando em R$ 7.500 aplicados) não garantiria a devolução integral."}, {"id": "M2B-081", "modulo": 2, "topico": "2.1.1.4.1 COE: principais regras e estrutura via derivativos", "dificuldade": "medio", "tipo": "mc", "enunciado": "Antes de oferecer um COE a uma cliente de varejo, quais cuidados a pessoa profissional deve tomar?", "alternativas": ["Garantir verbalmente que o capital está protegido em qualquer cenário, inclusive no resgate antecipado.", "Apenas informar a rentabilidade máxima possível, pois o COE é isento de regras de suitability.", "Dispensar a análise de perfil caso a cliente já tenha CDB no mesmo banco.", "Verificar a adequação do produto ao perfil da cliente (suitability) e entregar o Documento de Informações Essenciais (DIE), explicando cenários de ganho e perda, prazo, liquidez e risco do emissor."], "correta": 3, "explicacao": "O COE é um produto complexo, sujeito às regras de suitability. A cliente deve receber o DIE, documento que resume o funcionamento, os cenários de retorno e os riscos. Prometer proteção em qualquer situação é inadequado, pois ela vale no vencimento e depende do emissor."}, {"id": "M2B-082", "modulo": 2, "topico": "2.1.1.4.2 COE: capital protegido x capital em risco", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma cliente aplicou R$ 10.000,00 em um COE com valor nominal protegido, com participação de 80% na alta de um índice de ações no prazo do produto, sem teto. No vencimento, o índice subiu 15%. Qual o valor bruto de resgate?",
