ão", "Ocorre somente quando há prejuízo comprovado a investidores profissionais", "Gera lucro para qualquer das partes em uma negociação", "Envolve apenas valores acima de determinado montante"], "correta": 0, "explicacao": "A prática não equitativa é definida pelo desequilíbrio indevido entre participantes, efetivo ou potencial. O uso de informação privilegiada e o front running são exemplos, pois quem os pratica opera em vantagem indevida sobre os demais."}, {"id": "M3A-160", "modulo": 3, "topico": "3.4.7.2.2.4.2 Insider trading (prática não equitativa)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Sob a ótica da regulamentação da CVM sobre ilícitos de mercado, o uso de informação privilegiada para negociar é considerado prática não equitativa porque:", "alternativas": ["Envolve necessariamente o giro excessivo da carteira", "Coloca quem possui a informação não divulgada em posição de vantagem indevida sobre os demais participantes, que negociam sem ter acesso a ela", "É permitido apenas a administradores da companhia", "Sempre gera alteração artificial no volume negociado"], "correta": 1, "explicacao": "A essência da prática não equitativa é a desigualdade indevida entre participantes. No insider trading, uma das partes negocia com informação relevante que o mercado ainda desconhece. Além de ilícito administrativo, a conduta pode configurar crime pelo art. 27-D da Lei 6.385/76."}, {"id": "M3A-161", "modulo": 3, "topico": "3.4.7.2.2.4.3 Front running", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um operador de uma corretora recebe a ordem de um grande fundo para comprar um volume expressivo de ações e, antes de executá-la, compra as mesmas ações para sua conta pessoal, vendendo-as logo depois com lucro, beneficiado pela alta provocada pela ordem do fundo. Essa prática é chamada de:", "alternativas": ["Money pass", "Churning", "Layering", "Front running"], "correta": 3, "explicacao": "Front running é negociar antecipadamente, em benefício próprio ou de terceiros, com base no conhecimento de ordens de clientes ainda não executadas que tendem a impactar o preço. É prática não equitativa e viola o dever de lealdade com o cliente."}, {"id": "M3A-162", "modulo": 3, "topico": "3.4.7 Dos crimes e dos ilícitos contra o mercado de capitais", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Um assessor tem acesso a ordens de clientes e informações de mercado. Assinale a conduta que NÃO configura ilícito de mercado nem crime contra o mercado de capitais:", "alternativas": ["Inserir ordens que não pretende executar para mover o preço de um ativo", "Repassar a um amigo a informação, obtida em reunião com a diretoria de uma companhia, de que ela será vendida antes do anúncio", "Comprar, para si, ações que um cliente vai adquirir em grande volume, antes de executar a ordem do cliente", "Executar as ordens dos clientes pela ordem de chegada, nas melhores condições disponíveis, e registrar adequadamente as operações"], "correta": 3, "explicacao": "Executar ordens com tempestividade, equidade e melhores condições é dever do intermediário. As demais condutas configuram, respectivamente, front running (prática não equitativa), spoofing (manipulação de preços) e repasse de informação privilegiada (crime do art. 27-D da Lei 6.385/76)."}, {"id": "AD-01", "modulo": 3, "tipo": "arvore", "topico": "3.1.3.4 Reserva de emergência / 3.4.2.4 Adequação dos produtos ao perfil da clientela", "dificuldade": "medio", "titulo": "Conservador sem reserva quer comprar ações", "contexto": "Rogério, 41 anos, trabalha com carteira assinada, tem perfil conservador (questionário de suitability respondido há seis meses) e possui R$ 18 mil na poupança, que é todo o seu patrimônio financeiro. Depois de assistir a um vídeo de um influenciador, ele liga para Fernanda, sua gerente de relacionamento, querendo colocar todo esse valor em ações de uma única empresa.", "etapas": [{"fala_cliente": "Fernanda, vi um vídeo dizendo que a ação da empresa X vai dobrar até o fim do ano. Quero colocar meus R$ 18 mil nela hoje.", "alternativas": ["Perfeito, consigo executar agora mesmo; ações costumam render muito mais que a poupança no longo prazo.", "Entendo seu interesse, Rogério. Antes de qualquer operação, posso fazer algumas perguntas sobre seus objetivos e sobre o papel desse dinheiro no seu orçamento? Assim avaliamos juntos se faz sentido.", "Ótima escolha! Essa empresa está bem falada no mercado; aproveite antes que a ação suba mais.", "Rogério, isso não é para você; seu perfil é conservador e eu não posso conversar sobre ações."], "correta": 1, "explicacao": "A conduta adequada começa pela escuta ativa: entender objetivos, situação financeira e função do recurso antes de qualquer recomendação ou execução. Executar de imediato ignora o perfil, endossar a ação cria expectativa indevida e fechar a conversa de forma ríspida desperdiça a chance de orientar o cliente."}, {"fala_cliente": "Esse dinheiro é tudo o que eu tenho guardado. Deixo na poupança porque vai que acontece alguma coisa, né? Mas ela rende pouco.", "alternativas": ["Então esse valor hoje cumpre a função de reserva de emergência, para imprevistos como desemprego ou problemas de saúde. Para essa finalidade, o mais importante é liquidez e baixo risco, e não buscar a maior rentabilidade.", "Não se preocupe com imprevistos; se algo acontecer, o banco oferece cheque especial e empréstimo pessoal.", "No longo prazo, poupança e ações têm praticamente o mesmo risco, então tanto faz onde o dinheiro fica.", "A poupança rende pouco mesmo; o ideal é tirar tudo de lá e diversificar em renda variável."], "correta": 0, "explicacao": "Identificar a finalidade do recurso é parte do planejamento financeiro. Uma reserva de emergência deve estar em ativos de alta liquidez e baixo risco. Contar com crédito para imprevistos é inadequado, pois cheque especial e empréstimo pessoal têm custo elevado."}, {"fala_cliente": "Quanto eu deveria ter de reserva, então?", "alternativas": ["Basta deixar uns R$ 1 mil disponíveis; o resto deve ficar investido para render mais.", "A regra é fixa: exatamente seis salários brutos, independentemente dos seus gastos.", "Uma referência comum é manter o equivalente a alguns meses das suas despesas, por exemplo de 3 a 12 meses, conforme a estabilidade da sua renda. Quanto você gasta por mês, em média?", "Reserva de emergência é desnecessária para quem trabalha com carteira assinada."], "correta": 2, "explicacao": "O montante da reserva é calculado a partir das despesas mensais (custo de vida), e não do salário, e varia conforme a estabilidade da renda e as responsabilidades da pessoa. Perguntar o gasto mensal personaliza a orientação. Ter emprego formal não elimina riscos como demissão ou doença."}, {"fala_cliente": "Gasto uns R$ 5 mil por mês. Então meus R$ 18 mil nem dariam quatro meses...", "alternativas": ["Sugiro um CDB prefixado de cinco anos, sem liquidez, que paga mais e ainda evita a tentação de gastar.", "Então vale arriscar nas ações: se elas dobrarem, você completa a reserva mais rápido.", "Você pode deixar a reserva em um fundo de ações; se precisar, é só pedir o resgate.", "Exato. Por isso, minha sugestão é primeiro completar essa reserva em aplicações de alta liquidez e baixo risco, como Tesouro Selic ou CDB com liquidez diária de instituição sólida, e só depois pensar em renda variável com o que sobrar."], "correta": 3, "explicacao": "Reserva de emergência exige liquidez imediata e baixa oscilação; Tesouro Selic e CDB com liquidez diária atendem a esses requisitos. Um título sem liquidez impede o uso no imprevisto, e ativos de renda variável podem estar em queda justamente quando o dinheiro for necessário."}, {"fala_cliente": "Mas eu queria ao menos começar na bolsa. Não posso colocar nada?", "alternativas": ["Pode, no futuro, mas hoje seu perfil é conservador e renda variável não é adequada a ele. Se seus objetivos e sua tolerância a risco mudaram, podemos refazer o questionário de suitability; se o resultado permitir, começamos com valor pequeno e diversificado, depois de formada a reserva.", "Coloco uma parte em ações agora e depois a gente ajusta seu perfil para ficar compatível.", "Não pode: perfil conservador é definitivo e só pode ser revisto depois de cinco anos.", "Posso mudar seu perfil para arrojado agora mesmo, é só eu marcar outras respostas no sistema."], "correta": 0, "explicacao": "O perfil pode ser reavaliado a qualquer momento, desde que reflita com fidelidade a situação, os objetivos e a tolerância a risco do cliente. Recomendar antes de ajustar o perfil ou manipular respostas do questionário viola as regras de suitability e o dever de diligência."}, {"fala_cliente": "E aquela ação do vídeo? O rapaz garantiu que vai dobrar.", "alternativas": ["Não posso comentar sobre isso; procure o próprio influenciador para tirar suas dúvidas.", "Ações sempre se recuperam no longo prazo, então o risco de perder é praticamente nulo.", "Ninguém pode garantir a valorização de uma ação; o preço oscila e pode cair. Dicas de redes sociais não consideram a sua situação. Se um dia investir em ações, o ideal é diversificar, por exemplo por meio de um fundo de ações ou ETF, em vez de concentrar tudo em um papel.", "Se ele é um influenciador conhecido, deve ter boas informações; vale a pena acompanhar."], "correta": 2, "explicacao": "Renda variável não tem rentabilidade garantida e está sujeita a risco de mercado. Concentrar em um único ativo eleva o risco específico, que a diversificação reduz. A comunicação clara inclui corrigir expectativas irreais, em vez de se omitir ou reforçá-las."}, {"fala_cliente": "Tá bom, Fernanda. Vou pensar em como juntar mais um pouco por mês.", "alternativas": ["Tudo bem, mas se mudar de ideia sobre as ações me avise logo, antes que elas subam.", "Ótimo. Se quiser, montamos juntos um orçamento simples para ver quanto dá para poupar por mês e programamos uma aplicação automática para a reserva. Vou registrar nossa conversa e combinamos de revisar em alguns meses.", "Certo. Qualquer coisa, você me procura quando tiver juntado o valor.", "Vou deixar agendada a compra das ações para o mês que vem, assim você não precisa se preocupar."], "correta": 1, "explicacao": "A solução proativa e o acompanhamento fazem parte de um bom atendimento: orçamento, aportes programados, registro da conversa e revisão periódica. Agendar operação sem ordem do cliente é irregular, e criar urgência é uma forma de pressão."}], "questoes_finais": [{"id": "AD-01-Q1", "modulo": 3, "topico": "3.4.2.4 Adequação dos produtos ao perfil da clientela", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Suponha que, mesmo após as orientações, Rogério mantivesse o perfil conservador e insistisse, por iniciativa própria, em comprar a ação. Segundo as regras de suitability, a conduta correta da instituição seria:", "alternativas": ["Alertá-lo de que a operação é inadequada ao seu perfil, indicando as causas da divergência, e obter sua declaração expressa de ciência antes de executar a ordem.", "Executar a ordem sem nenhum alerta ou registro, já que a iniciativa partiu do cliente.", "Recusar a ordem em qualquer circunstância, pois cliente conservador é proibido de comprar ações.", "Alterar o perfil do cliente para arrojado no sistema para que a operação fique adequada."], "correta": 0, "explicacao": "A regra de suitability veda a recomendação de produto inadequado, mas não impede que o cliente opere por conta própria. Nesse caso, antes da primeira operação na categoria, a instituição deve alertar o cliente sobre a inadequação, indicando as causas, e obter declaração expressa de que ele está ciente. Alterar o perfil artificialmente seria fraude ao processo."}, {"id": "AD-01-Q2", "modulo": 3, "topico": "3.1.3.4.2 Ativos de alta liquidez", "dificuldade": "facil", "tipo": "mc", "enunciado": "A principal razão para orientar Rogério a formar a reserva de emergência antes de investir em ações é:", "alternativas": ["Ações só podem ser vendidas depois de um ano da data da compra.", "A regulamentação proíbe a compra de ações por quem não possui reserva de emergência.", "A reserva de emergência sempre rende mais do que as ações no longo prazo.", "Garantir recursos disponíveis rapidamente para imprevistos, sem precisar vender ativos voláteis em momento de queda nem recorrer a crédito caro."], "correta": 3, "explicacao": "A reserva serve para cobrir imprevistos com liquidez e segurança. Sem ela, a pessoa pode ser forçada a vender ações com prejuízo ou a usar cheque especial e outras linhas caras. Não há proibição legal nem prazo mínimo para vender ações."}]}, {"id": "AD-02", "modulo": 3, "tipo": "arvore", "topico": "3.1.2.4 Distribuição de renda / 3.4.2.5 Adequação dos produtos ao objetivo da clientela", "dificuldade": "medio", "titulo": "Aposentada quer renda mensal", "contexto": "Marta, 67 anos, aposentada pelo INSS, vendeu um apartamento de praia e tem R$ 300 mil para investir. Seu perfil é moderado e está atualizado. Ela procura Paulo, seu gerente, querendo que o dinheiro complemente sua renda todos os meses.", "etapas": [{"fala_cliente": "Paulo, vendi o apartamento da praia e quero que esse dinheiro me pague um 'salário' todo mês. Qual o produto que rende mais?", "alternativas": ["O que mais rende hoje é um fundo de ações de dividendos; posso aplicar tudo nele.", "Que bom que me procurou, dona Marta. Para indicar algo adequado, preciso entender melhor: quanto a senhora precisa por mês, quais são seus gastos fixos e se há alguma despesa grande prevista, como saúde.", "Rentabilidade alta exige risco alto; na sua idade, o certo é deixar tudo na poupança.", "Temos um produto excelente que paga 1,5% ao mês garantido; é só assinar."], "correta": 1, "explicacao": "Antes de recomendar, a pessoa profissional precisa conhecer necessidades, despesas e objetivos da cliente (escuta ativa e suitability). Indicar o produto que 'mais rende' ignora risco e liquidez, e prometer rentabilidade garantida é conduta vedada. Idade, sozinha, não define a carteira."}, {"fala_cliente": "Preciso de uns R$ 2 mil por mês a mais. E tenho medo de ficar sem dinheiro se tiver algum problema de saúde.", "alternativas": ["Saúde a senhora resolve com plano de saúde; pode investir tudo em prazos longos para render mais.", "Vamos investir tudo em um único produto, que fica mais simples de acompanhar.", "Então podemos separar o dinheiro em partes: uma reserva com liquidez imediata para emergências e saúde, e outra parte voltada a gerar renda periódica, respeitando o seu perfil moderado.", "Melhor deixar tudo na conta corrente; assim a senhora saca quando quiser."], "correta": 2, "explicacao": "Na fase de distribuição de renda, é importante combinar liquidez para imprevistos com ativos que gerem fluxo de caixa. Deixar tudo em conta corrente sacrifica rendimento, e concentrar em um produto aumenta o risco."}, {"fala_cliente": "Que produtos pagam renda todo mês ou de tempos em tempos?", "alternativas": ["Fundos imobiliários pagam um aluguel fixo garantido todo mês, igual a um imóvel alugado.", "O Tesouro IPCA+ com juros semestrais paga exatamente a mesma quantia a cada semestre.", "Há opções com características diferentes: títulos que pagam juros periódicos, como o Tesouro IPCA+ com juros semestrais e algumas debêntures; fundos imobiliários, que costumam distribuir rendimentos mensais, mas que variam e têm risco de mercado; e resgates programados de aplicações de renda fixa.", "Só a poupança paga renda mensal; os demais investimentos pagam apenas no vencimento."], "correta": 2, "explicacao": "Explicar alternativas com seus riscos é comunicação clara e transparente. Os rendimentos de FII dependem dos resultados dos imóveis e não são garantidos. Os cupons do Tesouro IPCA+ com juros semestrais incidem sobre o valor nominal atualizado pela inflação, portanto variam."}, {"fala_cliente": "Esses fundos imobiliários parecem ótimos. Posso colocar tudo neles?", "alternativas": ["Eles podem compor parte da carteira, mas concentrar tudo seria arriscado: as cotas são negociadas em bolsa, o preço oscila, os rendimentos podem cair e não há cobertura do FGC. Diversificar entre renda fixa e uma parcela em FII tende a equilibrar renda e segurança.", "Pode, e ainda há garantia do FGC de até R$ 250 mil por fundo.", "Pode, sim; como são imóveis, o valor das cotas nunca cai.", "Não pode; fundos imobiliários são proibidos para pessoas aposentadas."], "correta": 0, "explicacao": "FII é produto de renda variável: cotas oscilam, há risco de vacância e inadimplência dos inquilinos e não existe garantia do FGC. A diversificação é o princípio que reduz o risco da carteira sem abrir mão de gerar renda."}, {"fala_cliente": "E o imposto? Vou pagar muito?", "alternativas": ["Aposentados com mais de 65 anos são isentos de IR em todos os investimentos.", "Depende do produto. Em CDB e Tesouro, o IR segue a tabela regressiva, de 22,5% a 15% conforme o prazo. Os rendimentos distribuídos por FII à pessoa física podem ser isentos se o fundo e a cotista cumprirem os requisitos legais; LCI, LCA e debêntures incentivadas também são isentas para pessoa física.", "Imposto não é importante; o que importa é a rentabilidade bruta.", "Todos os investimentos pagam 15% de IR, independentemente do prazo."], "correta": 1, "explicacao": "A tributação afeta a renda líquida e deve ser explicada com precisão. A parcela isenta para maiores de 65 anos refere-se a rendimentos de aposentadoria, não a investimentos. Comparar produtos pela rentabilidade bruta pode levar a escolhas piores."}, {"fala_cliente": "Meu sobrinho entende de investimentos. Posso passar minha senha para ele movimentar a conta por mim?", "alternativas": ["Melhor passar a senha para mim; eu mesmo cuido dos seus investimentos.", "Pode, mas peça para ele trocar a senha depois de usar.", "Pode passar, sim; parente de confiança não tem problema.", "A senha é pessoal e intransferível, e compartilhá-la expõe a senhora a riscos. Se quiser que ele ajude, o caminho seguro é formalizar uma procuração conforme as regras do banco, e as decisões continuam considerando o seu perfil e os seus objetivos."], "correta": 3, "explicacao": "Proteger a cliente, especialmente pessoas idosas, mais expostas a abusos e fraudes, faz parte do dever de cuidado. A representação deve ser formal (procuração), garantindo rastreabilidade. O profissional jamais deve receber senhas de clientes."}, {"fala_cliente": "Gostei. Pode me mandar a proposta por escrito?", "alternativas": ["Claro. Vou enviar um resumo com a divisão sugerida e os riscos, custos, liquidez e tributação de cada produto, junto com os documentos oficiais. Também combinamos revisões periódicas para ver se a renda está atendendo à senhora.", "Não precisa de proposta escrita; é melhor fecharmos agora por telefone.", "Envio só a rentabilidade esperada de cada produto, que é o que interessa.", "Mando a proposta, mas ela só vale até hoje à noite."], "correta": 0, "explicacao": "Documentar a recomendação com riscos, custos e tributação dá transparência e permite à cliente decidir com calma. Prazos artificiais e informações parciais são formas de pressão e de comunicação incompleta."}], "questoes_finais": [{"id": "AD-02-Q1", "modulo": 3, "topico": "3.1.2 Ciclo de vida da pessoa investidora", "dificuldade": "medio", "tipo": "mc", "enunciado": "Considerando o momento de vida de Marta, em qual fase do ciclo de vida da pessoa investidora ela se encontra e qual é a prioridade típica dessa fase?", "alternativas": ["Acumulação de capital: priorizar aportes regulares e maior exposição a risco.", "Distribuição de renda: transformar o patrimônio acumulado em fluxo de renda, preservando liquidez e reduzindo a exposição a grandes oscilações.", "Preservação de capital: evitar qualquer resgate para não reduzir o patrimônio.", "Crescimento patrimonial: priorizar ativos mais voláteis para multiplicar o patrimônio."], "correta": 1, "explicacao": "Na aposentadoria, a pessoa investidora costuma usar o patrimônio acumulado para complementar sua renda, o que caracteriza a fase de distribuição. A prioridade é gerar fluxo de caixa estável com liquidez para imprevistos, e não maximizar o crescimento com alto risco."}, {"id": "AD-02-Q2", "modulo": 3, "topico": "2 Produtos — Fundos imobiliários (aplicado ao atendimento)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Sobre os fundos imobiliários (FII) apresentados a Marta, é correto afirmar que:", "alternativas": ["Pagam rendimento mensal fixo, definido no momento da compra das cotas.", "Contam com a garantia do FGC de até R$ 250 mil por CPF.", "Sofrem come-cotas em maio e novembro, como os fundos de renda fixa.", "Os rendimentos distribuídos à pessoa física podem ser isentos de IR quando atendidos os requisitos legais, mas o ganho de capital na venda das cotas é tributado."], "correta": 3, "explicacao": "A isenção dos rendimentos de FII para pessoa física depende de requisitos (como número mínimo de cotistas e negociação em bolsa), e o ganho na venda das cotas é tributado. FII não têm cobertura do FGC, os rendimentos variam com os resultados dos imóveis e não há come-cotas."}]}, {"id": "AD-03", "modulo": 3, "tipo": "arvore", "topico": "3.1.2.1 Acumulação de capital / 3.1.3.1 Educação financeira básica", "dificuldade": "facil", "titulo": "Jovem de 25 anos começando a investir", "contexto": "Bianca, 25 anos, está no primeiro emprego com carteira assinada, ganha R$ 4 mil por mês, não tem dívidas e consegue guardar cerca de R$ 600 mensais. Nunca investiu e procura Thiago, gerente do banco digital em que tem conta, para começar.", "etapas": [{"fala_cliente": "Oi, Thiago! Quero começar a investir, mas não entendo nada. Por onde eu começo?", "alternativas": ["Você precisa juntar pelo menos R$ 10 mil para poder começar a investir.", "Comece pelas criptomoedas; quem é jovem tem tempo para recuperar as perdas.", "Que bom, Bianca! Vamos começar entendendo sua situação: quanto você ganha, quanto gasta, se tem dívidas e quais são seus objetivos. Também vamos preencher seu perfil de investidora, que nos ajuda a indicar produtos adequados.", "O melhor é investir em CDB, que é o que todo mundo faz."], "correta": 2, "explicacao": "O ponto de partida é conhecer a cliente: orçamento, dívidas, objetivos e perfil (suitability). Recomendações genéricas ou baseadas apenas na idade não são personalizadas, e não existe valor mínimo legal para começar a investir."}, {"fala_cliente": "Sobram uns R$ 600 por mês. Não tenho dívida, mas também não tenho nada guardado.", "alternativas": ["Coloque os R$ 600 todo mês em ações de uma única empresa, para acelerar.", "Melhor aproveitar agora e começar a investir quando estiver ganhando mais.", "Com R$ 600 não vale a pena investir; espere juntar mais dinheiro.", "Ótimo ponto de partida. A primeira meta costuma ser formar uma reserva de emergência com esses aportes mensais, em aplicações de liquidez diária e baixo risco. Depois, parte dos aportes pode ir para objetivos de médio e longo prazo."], "correta": 3, "explicacao": "Na fase de acumulação, a regularidade dos aportes é decisiva, e a reserva de emergência vem antes dos objetivos de maior risco. Desestimular valores pequenos contraria a educação financeira; concentrar em uma ação é arriscado."}, {"fala_cliente": "Ouvi falar de Tesouro Selic e CDB. Qual a diferença?", "alternativas": ["São iguais: os dois são garantidos pelo FGC.", "O Tesouro Selic é um título público federal, com risco de crédito do governo, que acompanha a taxa Selic e tem liquidez diária. O CDB é emitido por bancos, normalmente atrelado ao CDI, e tem cobertura do FGC até R$ 250 mil por CPF por instituição. Nos dois há IR regressivo sobre o rendimento.", "O Tesouro Selic é isento de IR, e o CDB não é.", "O CDB é sempre melhor que o Tesouro porque rende 100% do CDI."], "correta": 1, "explicacao": "Explicar com clareza as diferenças de emissor, risco, garantia e tributação ajuda a cliente a decidir. Títulos públicos não têm FGC (o risco é do Tesouro Nacional), ambos seguem a tabela regressiva de IR, e a remuneração do CDB varia conforme a oferta."}, {"fala_cliente": "E se eu precisar do dinheiro em poucos dias, eu perco alguma coisa?", "alternativas": ["Em resgates com menos de 30 dias incide IOF sobre o rendimento, de forma regressiva, e o IR fica em 22,5% até 180 dias. Para a reserva, o importante é a liquidez; para objetivos mais longos, manter o dinheiro aplicado reduz a alíquota.", "Sim, você perde todo o rendimento se resgatar antes de um ano.", "No Tesouro Selic, se vender antes do vencimento, você sempre tem prejuízo.", "Não, desde o primeiro dia você resgata sem nenhum imposto."], "correta": 0, "explicacao": "IOF regressivo incide sobre os rendimentos nos primeiros 29 dias e o IR segue a tabela regressiva, de 22,5% a 15%. Resgatar cedo não faz perder todo o rendimento, e o Tesouro Selic tem baixíssima oscilação de preço."}, {"fala_cliente": "Meus amigos dizem que eu devia ir direto para a bolsa porque sou jovem.", "alternativas": ["Eles estão certos: quem é jovem deve ter 100% em ações.", "Como você é jovem, seu perfil já é automaticamente agressivo.", "Ter um horizonte longo permite assumir mais risco, mas isso depende também da sua tolerância a oscilações e do seu perfil. Com a reserva formada e se seu perfil permitir, uma parcela em renda variável diversificada pode fazer sentido para objetivos de longo prazo.", "Bolsa é um cassino; você nunca deve investir nisso."], "correta": 2, "explicacao": "Idade e horizonte influenciam a capacidade de assumir risco, mas o perfil considera também tolerância, objetivos e situação financeira. Generalizações, para mais ou para menos risco, não substituem a avaliação de suitability."}, {"fala_cliente": "E aposentadoria? Ainda é cedo pra pensar nisso?", "alternativas": ["Não é cedo: quanto antes começar, mais tempo os juros compostos trabalham a seu favor. No futuro, podemos avaliar previdência privada ou uma carteira própria de longo prazo, considerando custos, tributação e o seu modelo de declaração do IR.", "Contrate hoje um PGBL com a maior contribuição possível; é sempre a melhor opção.", "Aposentadoria só se planeja depois dos 40 anos.", "É cedo; o INSS vai cobrir tudo o que você precisar."], "correta": 0, "explicacao": "O planejamento para a aposentadoria se beneficia do tempo de acumulação. A escolha entre PGBL, VGBL ou outras alternativas depende de custos, objetivos e do modelo de declaração; recomendar PGBL a qualquer pessoa ignora que a dedução só vale no modelo completo."}, {"fala_cliente": "Beleza! E como eu acompanho tudo isso?", "alternativas": ["Eu te ligo sempre que houver um produto novo para você comprar.", "Não precisa acompanhar; investimento é para aplicar e esquecer.", "Você acompanha pelo app e pelos extratos. Sugiro revisar seu orçamento todo mês e conversarmos a cada seis meses, ou sempre que sua vida mudar, como uma troca de emprego, para atualizar objetivos e perfil.", "Olhe o saldo todo dia e resgate sempre que alguma aplicação cair."], "correta": 2, "explicacao": "O monitoramento contínuo garante que a carteira siga adequada ao perfil e aos objetivos. Acompanhar não significa reagir a cada oscilação, nem transformar o relacionamento em oferta constante de produtos."}], "questoes_finais": [{"id": "AD-03-Q1", "modulo": 3, "topico": "3.1.2.1 Acumulação de capital", "dificuldade": "facil", "tipo": "mc", "enunciado": "Bianca está na fase de acumulação de capital. A característica mais típica dessa fase é:", "alternativas": ["Planejamento da sucessão e da transferência do patrimônio aos herdeiros.", "Uso do patrimônio acumulado para gerar renda mensal de complemento.", "Prioridade em preservar o patrimônio já construído, evitando qualquer risco.", "Renda ainda em formação, foco em aportes regulares e horizonte longo, que permite construir patrimônio ao longo do tempo."], "correta": 3, "explicacao": "Na acumulação, a pessoa começa a vida profissional, forma reserva e faz aportes regulares, aproveitando o longo horizonte. Gerar renda a partir do patrimônio caracteriza a distribuição, e a sucessão e a preservação são preocupações de fases posteriores."}, {"id": "AD-03-Q2", "modulo": 3, "topico": "2 Produtos — Tesouro Selic e CDB (aplicado ao atendimento)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Bianca vai aplicar sua reserva em partes iguais em Tesouro Selic e em CDB de liquidez diária de um banco médio. Sobre essa escolha, é correto afirmar:", "alternativas": ["O Tesouro Selic é isento de IR, por isso rende mais que o CDB.", "O CDB tem cobertura do FGC até R$ 250 mil por CPF por instituição, enquanto o Tesouro Selic não tem FGC, pois seu risco de crédito é o do Tesouro Nacional.", "O CDB de banco médio não tem risco de crédito, por ter liquidez diária.", "Os dois produtos têm cobertura do FGC até R$ 250 mil cada um."], "correta": 1, "explicacao": "O FGC protege depósitos e títulos bancários como CDB, dentro dos limites; títulos públicos têm o risco soberano do Tesouro Nacional e não são cobertos pelo FGC. Ambos seguem a tabela regressiva de IR. Liquidez diária não elimina o risco de crédito do emissor."}]}, {"id": "AD-04", "modulo": 3, "tipo": "arvore", "topico": "3.4.2.6 Monitoramento contínuo da suitability / 3.4.2.7 Comunicação clara e transparente", "dificuldade": "dificil", "titulo": "Suitability vencido e pedido de COE", "contexto": "Henrique, 52 anos, médico, tem R$ 400 mil aplicados no banco. Seu questionário de suitability (perfil moderado) foi respondido há 30 meses. Um colega comprou um COE atrelado a um índice de ações americano e ele procura Ana Paula, sua assessora, querendo o mesmo produto.", "etapas": [{"fala_cliente": "Ana Paula, meu colega comprou um COE atrelado à bolsa americana com capital protegido. Quero aplicar R$ 200 mil no mesmo, hoje.", "alternativas": ["Sem problema; se o seu colega comprou, deve servir para você também.", "Claro, faço a aplicação agora e depois atualizamos seu cadastro com calma.", "COE só é vendido para investidor profissional; não posso fazer nada.", "Posso te explicar o produto, Henrique. Antes, verifiquei que seu perfil de investidor está desatualizado há mais de dois anos; precisamos atualizá-lo para que eu possa recomendar algo adequado a você."], "correta": 3, "explicacao": "As informações de perfil devem ser atualizadas em intervalos não superiores a 24 meses, e é vedado recomendar produtos com perfil desatualizado. O que serve para outro cliente não necessariamente é adequado a este, e COE não é exclusivo de investidor profissional."}, {"fala_cliente": "Isso é burocracia. Eu já sei meu perfil, sou moderado.", "alternativas": ["Se não quiser atualizar, não posso mais atender você em nada.", "Entendo a pressa. A atualização é rápida e protege você: sua situação financeira, seus objetivos e seu prazo podem ter mudado desde a última avaliação, e é com base nela que verifico se o produto é adequado.", "Então eu mesma respondo o questionário por você, já sei suas respostas.", "Tem razão, vou só marcar no sistema que você continua moderado."], "correta": 1, "explicacao": "Explicar o propósito do suitability com empatia ajuda o cliente a colaborar. O questionário deve ser respondido pelo próprio cliente; preencher por ele ou simular a atualização compromete a integridade do processo. Recusar todo atendimento é desproporcional."}, {"fala_cliente": "Pronto, atualizei e continuo moderado, com horizonte de cinco anos. Agora me explica: esse COE é garantido?", "alternativas": ["Na modalidade de capital protegido, o valor nominal investido é devolvido no vencimento, mas essa proteção depende da capacidade de pagamento do banco emissor, pois o COE não tem cobertura do FGC. O retorno depende do índice e pode ser zero.", "Capital protegido significa que você pode resgatar a qualquer momento sem perda.", "Sim, é garantido pelo FGC até R$ 250 mil, então seu valor está totalmente seguro.", "É garantido e ainda rende, no mínimo, o CDI do período."], "correta": 0, "explicacao": "Comunicação clara exige explicar o que 'capital protegido' significa: preservação do valor nominal no vencimento, sujeita ao risco de crédito do emissor. COE não tem FGC, não garante rentabilidade mínima e a proteção não vale para saídas antecipadas."}, {"fala_cliente": "E se eu precisar do dinheiro antes do vencimento?", "alternativas": ["Não tem problema; basta transferir o COE para outro banco sem custo.", "Antes do vencimento, o FGC cobre a diferença se houver perda.", "O COE normalmente não tem liquidez diária. Uma eventual recompra antecipada, se o emissor oferecer, ocorre a preço de mercado e pode resultar em valor inferior ao aplicado, mesmo no capital protegido. Por isso, o prazo precisa casar com o seu horizonte.", "Você resgata quando quiser, pelo valor investido mais o rendimento proporcional."], "correta": 2, "explicacao": "Liquidez é um dos riscos que precisam ser informados. A proteção do capital só vale no vencimento; antes dele, o valor de recompra reflete as condições de mercado. Adequar o prazo do produto ao horizonte do cliente faz parte da análise de suitability."}, {"fala_cliente": "Quanto custa? Meu colega disse que não tem taxa nenhuma.", "alternativas": ["O custo é irrelevante, porque o capital é protegido.", "Não sei os custos, mas posso descobrir depois que você aplicar.", "Não há taxa de administração como em fundos, mas os custos e a remuneração da distribuição estão embutidos na estrutura do produto. Isso consta no Documento de Informações Essenciais, o DIE, que vou te enviar com os cenários de retorno, riscos e custos.", "Realmente não tem custo nenhum, por isso é tão vantajoso."], "correta": 2, "explicacao": "Transparência sobre custos, inclusive os embutidos, é obrigação da pessoa profissional. O DIE do COE apresenta de forma padronizada riscos, cenários e custos. Conhecer o produto que distribui é dever profissional; descobrir os custos depois da aplicação é inaceitável."}, {"fala_cliente": "Quero colocar os R$ 200 mil mesmo, que é metade das minhas aplicações.", "alternativas": ["Ótimo, quanto mais aplicar, mais você aproveita a alta do índice.", "Coloque metade aqui e metade em outro COE do mesmo banco, assim diversifica.", "Pode colocar tudo, já que o capital é protegido.", "Considerando seu perfil moderado e a falta de liquidez, concentrar metade do patrimônio em um único COE, com risco de um só emissor, aumentaria muito sua exposição. Sugiro um valor menor e diversificação entre emissores e produtos."], "correta": 3, "explicacao": "A adequação considera não só o produto, mas a concentração na carteira. Um único emissor concentra risco de crédito, e a baixa liquidez limita a reação a imprevistos. Dois COEs do mesmo emissor não diversificam o risco de crédito."}, {"fala_cliente": "Ok, vamos com R$ 80 mil. Mas se o índice subir muito, eu ganho tudo?", "alternativas": ["Depende da estrutura. Muitos COEs têm participação limitada na alta, com teto de ganho ou barreiras. Vou te mostrar no DIE os cenários de alta, baixa e estabilidade para que sua expectativa fique alinhada.", "Sim, você ganha toda a valorização do índice, sem limites.", "Não se preocupe com detalhes; o importante é que o capital está protegido.", "Se subir muito, você ganha o dobro da alta, garantido."], "correta": 0, "explicacao": "Gerenciar expectativas significa mostrar como o retorno é calculado em diferentes cenários. Omitir tetos e barreiras ou prometer ganhos cria expectativas irreais e pode gerar reclamações futuras."}, {"fala_cliente": "Perfeito. Pode fazer.", "alternativas": ["Feito. Não precisa ler documento nenhum, eu já expliquei tudo.", "Vou formalizar a operação com a sua autorização, registrar as informações e os documentos entregues e agendar uma revisão. Se tiver dúvidas ao ler o DIE, me chame antes da liquidação.", "Feito. E já te incluo em outra emissão que ainda nem saiu, para garantir.", "Vou aplicar os R$ 200 mil, porque o resultado será melhor para você."], "correta": 1, "explicacao": "A formalização, o registro e o acompanhamento protegem o cliente e a instituição. Executar valor diferente do autorizado ou incluir o cliente em operações sem ordem expressa são condutas irregulares."}], "questoes_finais": [{"id": "AD-04-Q1", "modulo": 3, "topico": "3.4.2.6 Monitoramento contínuo da suitability", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Se Henrique tivesse se recusado a atualizar o perfil e insistido em aplicar no COE por conta própria, a conduta correta, segundo a regulamentação de suitability (Resolução CVM 30), seria:", "alternativas": ["Encerrar a conta do cliente, já que ele se recusou a atualizar o cadastro.", "Recomendar o COE mesmo assim, pois produtos de capital protegido dispensam suitability.", "Executar a ordem normalmente, pois o perfil vencido continua válido por mais 12 meses.", "Executar a ordem somente após alertá-lo sobre a desatualização do perfil, com indicação das causas, e obter sua declaração expressa de ciência."], "correta": 3, "explicacao": "Com perfil desatualizado, a instituição não pode recomendar produtos. Se o cliente der a ordem por iniciativa própria, deve ser alertado sobre a desatualização, com as causas, e assinar declaração de ciência antes da primeira operação na categoria. Não existe prorrogação automática do perfil nem dispensa para COE."}, {"id": "AD-04-Q2", "modulo": 3, "topico": "2 Produtos — COE (aplicado ao atendimento)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Sobre o COE de capital protegido oferecido a Henrique, é correto afirmar:", "alternativas": ["Tem garantia do FGC até R$ 250 mil por CPF, como o CDB.", "Não conta com garantia do FGC, e a devolução do valor nominal no vencimento depende da capacidade de pagamento do emissor.", "Assegura rentabilidade mínima igual à variação do CDI do período.", "Garante a devolução do capital mesmo em caso de recompra antecipada."], "correta": 1, "explicacao": "O COE não é coberto pelo FGC. Na modalidade de capital protegido, o valor nominal é preservado apenas no vencimento e está sujeito ao risco de crédito do emissor. Antes do vencimento, eventual recompra ocorre a preço de mercado, e não há rentabilidade mínima garantida."}]}, {"id": "AD-05", "modulo": 3, "tipo": "arvore", "topico": "3.1.3.3.7 Cartão de crédito e gerenciamento de dívidas / 3.2.2.2 Utilização de crédito e gestão de dívidas", "dificuldade": "medio", "titulo": "Cliente no rotativo quer investir", "contexto": "Juliana, 34 anos, vendedora com renda variável (comissões), recebeu um bônus de R$ 8 mil. Ela tem cerca de R$ 5 mil de dívida no rotativo do cartão de crédito há dois meses e não possui reserva de emergência. Procura Rodrigo, seu gerente, querendo investir o bônus em um fundo.", "etapas": [{"fala_cliente": "Rodrigo, recebi um bônus de R$ 8 mil e quero investir num fundo que renda bem. O que você indica?", "alternativas": ["Parabéns pelo bônus, Juliana! Antes de indicar algo, posso entender sua situação financeira atual, como orçamento, dívidas e objetivos? Isso muda bastante qual seria o melhor uso desse dinheiro.", "Aplique em um fundo de ações, que historicamente rende mais que a renda fixa.", "Deixe na poupança, que é mais segura e não tem imposto.", "Temos um fundo multimercado que rendeu muito no último ano; é o ideal para você."], "correta": 0, "explicacao": "Conhecer a situação financeira completa da cliente, incluindo dívidas, é pré-requisito para qualquer orientação. Indicar produto pelo desempenho passado ou por regra genérica ignora o contexto e o perfil."}, {"fala_cliente": "Bom, tenho uns R$ 5 mil no rotativo do cartão, mas vou pagando aos poucos.", "alternativas": ["Isso é irresponsável; você não deveria ter deixado chegar a esse ponto.", "Tudo bem, a dívida é separada; vamos focar só no investimento.", "Obrigado por compartilhar. O rotativo do cartão está entre as dívidas mais caras do mercado, com juros muito superiores ao que um investimento conservador renderia. Na maioria dos casos, quitar essa dívida é o uso de melhor retorno para o dinheiro.", "Mantenha a dívida e invista, porque o rendimento do fundo compensa os juros."], "correta": 2, "explicacao": "Quitar uma dívida cara equivale a obter um 'retorno' igual ao juro evitado, normalmente muito maior que o de qualquer aplicação conservadora. A orientação deve ser técnica e respeitosa, sem julgamentos que afastem a cliente."}, {"fala_cliente": "Mas se eu quitar, fico sem nada guardado.", "alternativas": ["É uma preocupação válida. Uma alternativa é quitar o rotativo com parte do bônus e destinar o restante para começar sua reserva de emergência, em aplicação com liquidez diária. Assim você elimina o custo mais alto e não fica descoberta.", "Então mantenha o rotativo; reserva é sempre prioridade sobre dívidas.", "Use o cheque especial como sua reserva; é para isso que ele existe.", "Pegue um empréstimo pessoal para quitar o cartão e invista todo o bônus."], "correta": 0, "explicacao": "A solução combina eliminação da dívida mais cara com início da reserva de emergência. Trocar dívida por outra para investir raramente compensa, e o cheque especial é crédito caro, não reserva."}, {"fala_cliente": "Fiz as contas: pagando os R$ 5 mil, sobram R$ 3 mil. Mas meu salário varia, às vezes falta no fim do mês.", "alternativas": ["Quando faltar, use o rotativo de novo; agora você já sabe como funciona.", "Posso aumentar o limite do seu cartão para dar mais folga no fim do mês.", "Então vale montarmos um orçamento com suas receitas e despesas, usando uma renda média conservadora, e definir um valor mensal fixo para a reserva. Isso ajuda a não voltar ao rotativo nos meses mais fracos.", "Peça adiantamentos ao seu empregador sempre que o dinheiro faltar."], "correta": 2, "explicacao": "Orçamento e controle de gastos atacam a causa do endividamento. Para renda variável, planejar com base em uma renda média conservadora reduz o risco de falta de caixa. Ampliar limite de crédito tende a agravar o problema."}, {"fala_cliente": "E se um dia eu tiver que escolher entre pagar o mínimo da fatura ou parcelar?", "alternativas": ["O ideal é pagar a fatura com outro cartão de crédito e ganhar mais prazo.", "Se não for possível quitar, o parcelamento da fatura costuma ter juros menores que o rotativo, mas ainda é caro. Vale comparar o Custo Efetivo Total, o CET, de cada opção, incluindo alternativas como crédito pessoal ou consignado, se você tiver acesso.", "Tanto faz: todas as modalidades de crédito têm o mesmo custo.", "Pagar o mínimo é sempre a melhor opção, porque preserva o seu caixa."], "correta": 1, "explicacao": "A avaliação da melhor dívida considera o custo total de cada alternativa, medido pelo CET. Pagar só o mínimo mantém o saldo no rotativo, e rolar a dívida entre cartões apenas acumula encargos."}, {"fala_cliente": "Ouvi dizer que agora existe um limite para os juros do cartão. É verdade?", "alternativas": ["É verdade: os juros do cartão agora são limitados a 1% ao mês.", "Com o limite, a dívida do cartão deixou de cobrar juros.", "Não existe limite nenhum; a dívida pode crescer sem teto.", "Sim. Pela Lei 14.690/2023, juros e encargos do rotativo e do parcelamento da fatura não podem ultrapassar 100% do valor original da dívida. Isso limita o crescimento, mas a dívida ainda pode dobrar, então quitar continua sendo prioridade."], "correta": 3, "explicacao": "A lei limita o total de juros e encargos do rotativo e do parcelamento da fatura a 100% do valor original. Informar a regra corretamente, sem minimizar o custo, é comunicação clara: mesmo com o teto, a dívida pode dobrar."}, {"fala_cliente": "Então vou quitar. Depois você me ajuda a investir?", "alternativas": ["Ajudo, mas só se você contratar também o seguro do cartão.", "Com certeza. Depois da quitação e com a reserva em formação, atualizamos seu perfil de investidora e avaliamos produtos para seus objetivos. Vou registrar nossa conversa e combinar um retorno no próximo mês.", "Ajudo, mas aproveite e contrate o fundo agora com o que sobrar.", "Claro, mas só quando você tiver pelo menos R$ 50 mil para aplicar."], "correta": 1, "explicacao": "O acompanhamento e a atualização do perfil fecham o atendimento de forma proativa. Condicionar o atendimento à compra de outro produto é venda casada, e exigir valor mínimo arbitrário afasta a cliente."}], "questoes_finais": [{"id": "AD-05-Q1", "modulo": 3, "topico": "3.1.3.3.1 Avaliação da melhor dívida em função da necessidade atual", "dificuldade": "medio", "tipo": "mc", "enunciado": "Ao orientar uma pessoa com dívidas em várias modalidades e recursos limitados para quitá-las, como Juliana, o critério mais adequado para priorizar o pagamento é:", "alternativas": ["Quitar primeiro a dívida mais antiga, por ordem de contratação.", "Quitar primeiro o financiamento imobiliário, por ser a dívida de maior valor.", "Quitar primeiro a dívida de menor saldo, independentemente da taxa.", "Quitar primeiro as dívidas de maior custo efetivo total, como rotativo do cartão e cheque especial."], "correta": 3, "explicacao": "Priorizar as dívidas mais caras reduz o custo total do endividamento. Rotativo e cheque especial costumam ter as maiores taxas, enquanto dívidas com garantia, como o financiamento imobiliário, têm custo bem menor."}, {"id": "AD-05-Q2", "modulo": 3, "topico": "3.4.3.2 Ética e responsabilidade no atendimento", "dificuldade": "medio", "tipo": "mc", "enunciado": "Se o gerente condicionasse a ajuda nos investimentos de Juliana à contratação do seguro do cartão, ele estaria:", "alternativas": ["Praticando venda casada, conduta vedada que desrespeita a liberdade de escolha e o interesse da cliente.", "Cumprindo a política de suitability, que exige a contratação de seguro.", "Praticando conduta permitida, desde que o seguro seja barato.", "Agindo de forma legítima, pois seguros reduzem o risco da cliente."], "correta": 0, "explicacao": "Condicionar a oferta de um produto ou serviço à aquisição de outro é venda casada, prática vedada. Seguros podem ser oferecidos, mas a contratação deve ser livre e adequada à necessidade da cliente."}]}, {"id": "AD-06", "modulo": 3, "tipo": "arvore", "topico": "3.1.3.3.3 Modalidades de operações de crédito / 3.4.3.1.3 Solução proativa de problemas", "dificuldade": "medio", "titulo": "Padaria precisa de capital de giro", "contexto": "Wagner é sócio de uma padaria (microempresa) cliente do banco. Para o fim de ano, precisa de R$ 60 mil para estoque. A empresa tem R$ 40 mil em vendas no cartão a receber nos próximos 60 dias e R$ 30 mil em uma aplicação. Ele liga para Camila, gerente de pessoa jurídica.", "etapas": [{"fala_cliente": "Camila, preciso de R$ 60 mil para comprar estoque para o Natal. Me libera aquele empréstimo de sempre?", "alternativas": ["Libero agora o cheque especial empresarial; é o mais rápido.", "Melhor o senhor usar o cartão de crédito pessoal para comprar o estoque.", "Claro, vamos encontrar a melhor solução. Me conta: em quanto tempo esse estoque vira dinheiro, quanto a padaria tem a receber nos próximos meses e se há caixa disponível? Isso define a modalidade e o prazo ideais.", "Libero, mas o banco exige que o senhor contrate um título de capitalização junto."], "correta": 2, "explicacao": "Entender o ciclo de caixa da empresa permite indicar a linha com prazo e custo adequados. Cheque especial é caro para uso prolongado, exigir outro produto é venda casada e misturar finanças pessoais e da empresa é má prática."}, {"fala_cliente": "As vendas de dezembro pagam tudo em janeiro e fevereiro. Tenho uns R$ 40 mil de vendas no cartão para receber e R$ 30 mil numa aplicação da empresa.", "alternativas": ["Use toda a aplicação e o cheque especial para o restante; é mais simples.", "Nesse caso, o ideal é o senhor entrar em um consórcio.", "Sugiro um financiamento de 60 meses, assim a parcela fica bem pequena.", "Então é uma necessidade de capital de giro de curto prazo. Há algumas opções: antecipação dos recebíveis de cartão, um empréstimo de capital de giro com prazo casado com suas vendas ou o uso de parte da aplicação. Vou comparar o custo efetivo de cada uma."], "correta": 3, "explicacao": "O prazo do crédito deve casar com o prazo da necessidade: estoque que gira em poucos meses pede capital de giro de curto prazo. Um financiamento longo encarece a operação, e o consórcio não atende a uma necessidade imediata."}, {"fala_cliente": "Usar a aplicação não é ruim? Ela está rendendo.", "alternativas": ["Depende da comparação: se o custo do crédito for maior que o rendimento líquido da aplicação, usar recursos próprios tende a sair mais barato. Mas é importante manter um colchão de caixa para imprevistos da empresa. Podemos combinar as alternativas.", "Sempre use a aplicação, porque crédito é sempre mais caro e deve ser evitado.", "Nunca se deve mexer em aplicação; crédito é sempre a melhor escolha.", "A aplicação rende mais que qualquer empréstimo, então mantenha-a intacta."], "correta": 0, "explicacao": "A decisão compara o custo do crédito com o rendimento líquido do recurso próprio, sem esquecer a necessidade de liquidez. Respostas absolutas ignoram os números do caso."}, {"fala_cliente": "E essa antecipação de recebíveis, como funciona?", "alternativas": ["É de graça: o banco adianta e o senhor recebe o valor integral das vendas.", "É um investimento que rende sobre as vendas futuras do cartão.", "O banco adianta o valor das vendas no cartão que o senhor tem a receber, descontando uma taxa proporcional ao prazo antecipado. O senhor recebe menos do que o valor das vendas; por isso, vamos comparar essa taxa com a do capital de giro.", "É igual a um financiamento imobiliário, com o imóvel da padaria como garantia."], "correta": 2, "explicacao": "Explicar o mecanismo e o custo da antecipação é comunicação clara. Os próprios recebíveis servem de lastro e o desconto é proporcional ao prazo antecipado. Não é gratuita nem é investimento."}, {"fala_cliente": "Outro banco me ofereceu uma taxa mensal menor. Vale trocar?", "alternativas": ["Se a taxa é menor, é sempre mais barato; pode fechar lá.", "Pode valer. Para comparar corretamente, peça o Custo Efetivo Total das duas propostas, que inclui juros, tarifas, IOF e seguros. Uma taxa de juros menor pode esconder custos maiores.", "Se o senhor for para outro banco, vou ter que cancelar seu limite aqui.", "Não vale a pena; aqui o senhor já é cliente, e isso é o mais importante."], "correta": 1, "explicacao": "O CET permite comparar propostas de crédito de forma completa. Agir no interesse do cliente inclui reconhecer quando a concorrência pode ser melhor; ameaças ou apelos à fidelidade são condutas antiéticas."}, {"fala_cliente": "E o dinheiro que sobrar no caixa da empresa, onde deixo? Está tudo coberto pelo FGC, né?", "alternativas": ["Sim, qualquer aplicação no banco tem garantia ilimitada do FGC.", "O FGC só cobre pessoas físicas; a empresa não tem nenhuma proteção.", "Deixe tudo na conta corrente, que rende CDI automaticamente.", "Para caixa de curto prazo, aplicações com liquidez diária fazem sentido. O FGC cobre depósitos e títulos como CDB até R$ 250 mil por CNPJ por instituição ou conglomerado, mas não cobre, por exemplo, fundos de investimento ou títulos públicos, que têm outros riscos."], "correta": 3, "explicacao": "O FGC protege também pessoas jurídicas, com o mesmo limite de R$ 250 mil por CNPJ por instituição ou conglomerado. Fundos e títulos públicos não são cobertos, e saldo em conta corrente comum não rende."}, {"fala_cliente": "Vou decidir com meu sócio e te retorno.", "alternativas": ["Perfeito. Vou enviar um comparativo por escrito com as alternativas, prazos, CET e riscos de cada uma. Combino de falar com vocês na quinta-feira, ou antes, se preferirem.", "Seu sócio não precisa participar; o senhor pode assinar sozinho agora.", "Tudo bem, quando quiser me procure.", "Decida hoje, porque a taxa pode subir amanhã."], "correta": 0, "explicacao": "Respeitar o tempo de decisão e a governança da empresa, documentando as alternativas, é conduta adequada. Criar urgência é pressão indevida, e a passividade abandona o acompanhamento."}], "questoes_finais": [{"id": "AD-06-Q1", "modulo": 3, "topico": "3.1.3.3.3 Modalidades de operações de crédito", "dificuldade": "medio", "tipo": "mc", "enunciado": "Para a necessidade temporária de caixa da padaria, ligada ao ciclo de compra de estoque e recebimento das vendas, as modalidades mais adequadas são:", "alternativas": ["Crédito rural com recursos de programas oficiais.", "Capital de giro com prazo compatível com o ciclo operacional ou antecipação de recebíveis.", "Consórcio de bens com contemplação por sorteio.", "Financiamento de longo prazo para aquisição de máquinas e equipamentos."], "correta": 1, "explicacao": "Capital de giro e antecipação de recebíveis financiam necessidades de curto prazo do ciclo operacional. Financiamento de equipamentos é para investimento fixo, crédito rural é para atividade agropecuária e consórcio não garante recurso imediato."}, {"id": "AD-06-Q2", "modulo": 3, "topico": "3.1.3.3.2 Empréstimo e financiamento", "dificuldade": "facil", "tipo": "mc", "enunciado": "Camila orientou Wagner a comparar as propostas pelo CET porque esse indicador:", "alternativas": ["Considera apenas a taxa de juros nominal, que é o principal custo.", "É igual em todas as instituições, por ser fixado pelo Banco Central.", "Reúne em uma única taxa todos os custos da operação, como juros, tributos, tarifas e seguros.", "Indica a rentabilidade que o banco obterá com a operação."], "correta": 2, "explicacao": "O Custo Efetivo Total expressa o custo completo do crédito, incluindo encargos além dos juros, o que permite comparar propostas diferentes. Ele varia entre instituições e operações."}]}, {"id": "AD-07", "modulo": 3, "tipo": "arvore", "topico": "3.4.6.4 Confidencialidade de dados no mundo digital e internet / 3.4.3.1.3 Solução proativa de problemas", "dificuldade": "facil", "titulo": "Cliente com medo do golpe do falso gerente", "contexto": "Antônio, 70 anos, recebeu uma ligação de alguém que se apresentou como da 'central de segurança' do banco, dizendo que sua conta tinha movimentações suspeitas e que ele precisava transferir o dinheiro para uma 'conta segura'. Desconfiado, ele liga para Patrícia, sua gerente.", "etapas": [{"fala_cliente": "Patrícia, me ligaram dizendo que são do banco e que preciso transferir meu dinheiro para uma conta segura, senão vou perder tudo. Tenho que fazer agora?", "alternativas": ["Seu Antônio, não faça nenhuma transferência. O banco nunca pede para transferir dinheiro para 'conta segura' nem solicita senhas ou códigos por telefone. Isso tem as características de golpe, e o senhor fez muito bem em me procurar.", "Pode ser verdade; me passe o número que ligou que eu confirmo amanhã.", "Se disseram que é urgente, melhor transferir e depois a gente verifica.", "Transfira só uma parte, para garantir, e o resto a gente vê depois."], "correta": 0, "explicacao": "Diante de risco iminente, a orientação deve ser imediata e clara. Pedido de transferência para 'conta segura' é marca do golpe do falso funcionário. Adiar a orientação ou sugerir transferência parcial expõe o cliente a perdas."}, {"fala_cliente": "Mas eles sabiam meu nome, meu CPF e até o final do meu cartão!", "alternativas": ["Então provavelmente era alguém do banco mesmo; vou verificar internamente.", "Isso é impossível; deve ter sido alguém da sua família.", "Infelizmente, golpistas podem obter dados pessoais por vazamentos ou engenharia social e usam isso para parecer confiáveis. Saber seus dados não prova que a ligação é do banco. Na dúvida, desligue e ligue o senhor mesmo para os canais oficiais.", "Se sabiam seus dados, o banco vazou suas informações e o senhor deve processar."], "correta": 2, "explicacao": "Engenharia social usa dados verdadeiros para ganhar confiança. A orientação correta é retomar o contato por canal oficial, iniciado pelo próprio cliente. Conclusões precipitadas não ajudam."}, {"fala_cliente": "Eles pediram também o código que chegou por SMS. Eu passei...", "alternativas": ["O senhor errou em passar o código; a responsabilidade agora é só sua.", "Não tem problema, esse código só serve uma vez.", "Então o senhor já foi vítima; não há mais nada a fazer.", "Vamos agir agora: vou bloquear preventivamente seu acesso digital e seus cartões, e vamos trocar suas senhas e cadastrar de novo seu dispositivo. Depois verificamos juntos se houve alguma movimentação que o senhor não reconhece."], "correta": 3, "explicacao": "Solução proativa: conter o dano com bloqueios e troca de credenciais e, em seguida, verificar as transações. Códigos de autenticação permitem acesso indevido; minimizar o fato ou culpar o cliente não resolve o problema."}, {"fala_cliente": "Olhando aqui... saiu um Pix de R$ 3 mil que eu não fiz!", "alternativas": ["Faça um Pix para o golpista pedindo a devolução do valor.", "Vamos registrar agora a contestação pelo Mecanismo Especial de Devolução, o MED, que permite bloquear e tentar recuperar valores na conta de destino em caso de fraude. Recomendo também registrar boletim de ocorrência. A devolução depende de haver saldo na conta recebedora.", "O banco devolve automaticamente qualquer Pix contestado, sem análise.", "Pix é irreversível; não existe nenhum mecanismo de devolução."], "correta": 1, "explicacao": "O MED permite que a instituição do pagador solicite o bloqueio e a devolução de valores em casos de fraude. Gerenciar expectativas é informar que a recuperação depende de saldo disponível e de análise, sem prometer resultado."}, {"fala_cliente": "Estou com medo de usar o Pix agora. Devo cancelar?", "alternativas": ["Aumente o limite do Pix para não ter problemas em emergências.", "Não precisa abrir mão do Pix. O senhor pode ajustar limites menores, especialmente no período noturno, ativar notificações e cadastrar contatos de confiança. E lembre: o banco nunca pede senha, código ou transferência por telefone, mensagem ou e-mail.", "Deixe seus dados de acesso comigo, que eu monitoro sua conta.", "Sim, cancele tudo e passe a usar apenas dinheiro em espécie."], "correta": 1, "explicacao": "A educação do cliente sobre segurança digital é a melhor proteção: limites ajustáveis, notificações e regras claras sobre o que o banco nunca pede. O profissional nunca deve ter acesso a senhas do cliente."}, {"fala_cliente": "Meu neto disse que posso receber outra ligação. Como vou saber se é golpe?", "alternativas": ["Se o número que aparece for igual ao do banco, pode confiar.", "Se a pessoa souber seu nome completo, é do banco.", "Peça para a pessoa confirmar seu saldo; se ela acertar, é do banco.", "Desconfie de pedidos urgentes, ameaças de perder dinheiro e solicitações de senha, código, transferência ou instalação de aplicativos. Em qualquer dúvida, desligue e ligue o senhor mesmo para o número oficial do banco ou procure a agência."], "correta": 3, "explicacao": "Golpistas podem falsificar o número exibido e obter dados pessoais. A regra prática segura é não fornecer nada e retomar o contato por canal oficial. Testes como pedir o saldo dão falsa segurança."}, {"fala_cliente": "Obrigado, Patrícia. Você vai me avisar de tudo?", "alternativas": ["Vou acompanhar a contestação e retorno ao senhor assim que houver resposta. Também registro a ocorrência no sistema e envio por escrito as orientações de segurança que conversamos.", "Agora é com o setor de fraudes; eu não acompanho mais.", "Vou, mas para agilizar me passe a sua nova senha.", "Vou avisar, e aproveito para oferecer um título de capitalização ao senhor."], "correta": 0, "explicacao": "Acompanhar o caso até o fim e registrar a ocorrência demonstra responsabilidade no atendimento. Pedir senha é inaceitável, e aproveitar a fragilidade do cliente para vender produto é antiético."}], "questoes_finais": [{"id": "AD-07-Q1", "modulo": 3, "topico": "3.4.6.4 Confidencialidade de dados no mundo digital e internet", "dificuldade": "facil", "tipo": "mc", "enunciado": "Qual característica é típica do golpe do falso funcionário de banco, como o sofrido por Antônio?", "alternativas": ["Recomendar que o cliente nunca compartilhe sua senha com terceiros.", "Solicitar que o cliente compareça pessoalmente à agência para atualizar o cadastro.", "Criar senso de urgência e pedir transferência para uma suposta conta segura ou o envio de códigos de autenticação.", "Enviar pelo aplicativo oficial um aviso de vencimento de fatura."], "correta": 2, "explicacao": "O golpe explora urgência e medo para obter transferências, senhas ou códigos. Instituições legítimas não pedem transferência para 'conta segura' nem códigos por telefone, e orientar a não compartilhar senha é justamente a conduta correta."}, {"id": "AD-07-Q2", "modulo": 3, "topico": "1 SFN — Pix e Mecanismo Especial de Devolução (aplicado ao atendimento)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Sobre o Mecanismo Especial de Devolução (MED) do Pix, acionado no caso de Antônio, é correto afirmar:", "alternativas": ["Garante a devolução integral do valor em qualquer situação de contestação.", "Permite que a instituição do pagador solicite o bloqueio e a devolução de valores em casos de fundada suspeita de fraude, dependendo de haver saldo na conta recebedora.", "Só pode ser acionado pela pessoa que recebeu o Pix.", "Serve para devolver valores em caso de simples arrependimento de compra."], "correta": 1, "explicacao": "O MED é voltado a casos de fraude ou falha operacional e depende da análise e da existência de recursos na conta de destino. Não cobre arrependimento comercial nem garante a devolução integral."}]}, {"id": "AD-08", "modulo": 3, "tipo": "arvore", "topico": "3.4.5.4 Princípio “conheça seu cliente” (KYC) / 3.4.6.7 Operações suspeitas", "dificuldade": "dificil", "titulo": "Depósito alto em espécie", "contexto": "Gilberto é aposentado e declarou renda mensal de R$ 4 mil em seu cadastro. Nas últimas semanas, fez vários depósitos em espécie de valores semelhantes, seguidos de transferências a terceiros. Hoje, chega à agência com R$ 48 mil em dinheiro vivo para aplicar em CDB. Ele é atendido por Renata.", "etapas": [{"fala_cliente": "Renata, trouxe R$ 48 mil em dinheiro vivo para aplicar num CDB. Pode fazer rápido?", "alternativas": ["Não aceitamos dinheiro em espécie em hipótese nenhuma.", "Pode dividir em depósitos menores ao longo da semana para não chamar a atenção do sistema.", "Posso ajudar, seu Gilberto. Como é um valor alto em espécie, preciso registrar a origem dos recursos. O senhor pode me contar de onde vem esse dinheiro e, se tiver, apresentar algum documento?", "Claro, quanto mais rápido melhor; não preciso de nenhuma informação."], "correta": 2, "explicacao": "Operações relevantes em espécie exigem identificação e registro da origem dos recursos, conforme as regras de prevenção à lavagem de dinheiro. Orientar o fracionamento para evitar controles é conduta gravíssima; recusar sem análise também não é o procedimento correto."}, {"fala_cliente": "É da venda de um carro. Mas por que essa pergunta? Vocês desconfiam de mim?", "alternativas": ["Se o senhor se ofendeu, deixo isso de lado e faço o depósito sem registro.", "Na verdade, sim: o senhor está sendo investigado pela polícia.", "É só formalidade; pode dizer qualquer coisa que serve.", "Não é desconfiança pessoal; é um procedimento obrigatório para todas as pessoas clientes. A legislação de prevenção à lavagem de dinheiro exige que a instituição conheça seus clientes e a origem dos recursos, o que também protege o senhor."], "correta": 3, "explicacao": "Explicar com cortesia que o KYC é obrigação legal aplicada a todos preserva o relacionamento sem comprometer os controles. Afirmar suspeitas ao cliente, banalizar a informação ou dispensar o registro violam as regras de PLD."}, {"fala_cliente": "Não tenho o documento da venda aqui; vendi para um conhecido.", "alternativas": ["Tudo bem; vou registrar a informação que o senhor prestou e peço que traga depois o comprovante da transferência do veículo. Também preciso atualizar seu cadastro, como renda e patrimônio, para que fique compatível com suas movimentações.", "Não precisa de comprovante; ninguém confere isso depois.", "Sem documento não posso registrar nada; o senhor terá que levar o dinheiro embora.", "Então coloco no sistema que veio de herança, que é mais fácil de justificar."], "correta": 0, "explicacao": "O cadastro atualizado e fiel é a base do KYC: permite comparar movimentações com a capacidade financeira declarada. Registrar informação falsa é ilícito, e a documentação comprobatória deve ser solicitada."}, {"fala_cliente": "Semana passada também depositei uns valores menores, todos em dinheiro. Algum problema?", "alternativas": ["Nenhum problema; depósitos pequenos nunca são analisados.", "Se for depositar mais, faça em agências diferentes para não acumular.", "Sim, tem problema: esses depósitos parecem lavagem e o banco vai comunicar ao Coaf.", "Vou registrar todas as informações no sistema, conforme os procedimentos do banco. A área responsável analisa as movimentações em conjunto com o cadastro, e eu sigo as orientações dela."], "correta": 3, "explicacao": "A lei proíbe dar ciência ao cliente de eventual comunicação ao Coaf. A pessoa profissional deve seguir os procedimentos internos, sem antecipar juízos ao cliente e sem orientar formas de burlar os controles."}, {"fala_cliente": "Então faz o CDB, por favor. Ah, e depois quero transferir parte para a conta de um amigo.", "alternativas": ["Então nem aplique; mande tudo direto para o seu amigo, que é mais simples.", "Posso dar andamento à aplicação seguindo os procedimentos. Sobre a transferência, preciso registrar a finalidade e o destinatário, como em qualquer operação, e ela será processada conforme as regras do banco.", "Transfiro, e o senhor não precisa me dizer para quem; é assunto seu.", "Não posso transferir para terceiros; o dinheiro é só seu."], "correta": 1, "explicacao": "Transferências a terceiros também são objeto de registro e monitoramento. A conduta correta é tratar a operação com os controles normais, sem facilitar nem proibir arbitrariamente."}, {"fala_cliente": "Obrigado, Renata. Isso tudo fica só entre nós, né?", "alternativas": ["Seus dados e suas operações são protegidos pelo sigilo bancário, seu Gilberto. Ao mesmo tempo, o banco cumpre as obrigações legais de registro e controle que se aplicam a todas as pessoas clientes.", "Não; vou contar ao gerente geral e aos colegas que o senhor está sob suspeita.", "Claro, nem vou registrar nada no sistema, fique tranquilo.", "Fica entre nós, mas se quiser evitar perguntas, use outro banco da próxima vez."], "correta": 0, "explicacao": "A resposta concilia sigilo bancário e deveres de PLD, sem mentir e sem alertar o cliente. Omitir registros é infração, divulgar suspeitas a colegas sem necessidade viola o sigilo, e sugerir outro banco é orientar a evasão de controles."}], "questoes_finais": [{"id": "AD-08-Q1", "modulo": 3, "topico": "3.4.6.9 Obrigatoriedade de comunicação e controle", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Após o atendimento, Renata conclui que o conjunto de fatos (depósitos em espécie repetidos e incompatíveis com a renda, seguidos de transferências a terceiros) é atípico. A conduta correta é:", "alternativas": ["Comunicar diretamente à Polícia Federal e avisar o cliente para que ele se explique.", "Não fazer nada, já que o cliente informou que o dinheiro veio da venda de um carro.", "Reportar a situação à área de PLD/compliance, conforme os procedimentos internos, sem informar o cliente, cabendo à instituição analisar e, se for o caso, comunicar ao Coaf.", "Encerrar a conta imediatamente e informar ao cliente que ele é suspeito de lavagem de dinheiro."], "correta": 2, "explicacao": "A pessoa profissional deve levar o caso à área responsável, que analisa e decide sobre a comunicação ao Coaf. É vedado dar ciência ao cliente, e a explicação verbal sem comprovação não elimina o dever de reportar."}, {"id": "AD-08-Q2", "modulo": 3, "topico": "3.4.5 Prevenção e combate à lavagem de dinheiro", "dificuldade": "medio", "tipo": "mc", "enunciado": "O fracionamento de depósitos em espécie em vários valores menores, como no histórico de Gilberto, é um indício relevante de lavagem de dinheiro principalmente porque:", "alternativas": ["Só é relevante quando os depósitos são feitos em agências diferentes.", "Representa a etapa de integração, quando o dinheiro volta à economia formal.", "Caracteriza, por si só, crime de lavagem de dinheiro já comprovado.", "Pode indicar tentativa de evitar os controles de identificação e registro, típica da etapa de colocação dos recursos no sistema financeiro."], "correta": 3, "explicacao": "Dividir depósitos para ficar abaixo de limites de controle é sinal de alerta, associado à colocação, quando o dinheiro em espécie entra no sistema. Indício não é prova, mas deve ser analisado e, se for o caso, comunicado."}]}, {"id": "AD-09", "modulo": 3, "tipo": "arvore", "topico": "3.4.6.5 Sigilo bancário / 3.4.6 Lei Geral de Proteção de Dados (LGPD)", "dificuldade": "medio", "titulo": "Pedido de dados do ex-marido", "contexto": "Mariana está se separando de Sérgio. Os dois são clientes do mesmo banco: têm uma conta conjunta e cada um possui investimentos individuais. Ela procura Eduardo, gerente de ambos, em busca de informações para a partilha de bens.", "etapas": [{"fala_cliente": "Eduardo, estou me separando do Sérgio, que também é cliente daqui. Preciso saber quanto ele tem investido para a partilha. Você me passa?", "alternativas": ["Entendo que é um momento difícil, Mariana. Porém, as informações do Sérgio são protegidas pelo sigilo bancário e eu não posso compartilhá-las com você. Na partilha, esses dados podem ser obtidos por ordem judicial, por meio do seu advogado.", "Como vocês eram casados, posso te passar só o saldo total, sem detalhes.", "Não posso passar o saldo, mas posso te dizer se ele resgatou algo recentemente.", "Te passo informalmente, mas não conte a ninguém que fui eu."], "correta": 0, "explicacao": "O sigilo bancário protege as operações e os dados de cada cliente, mesmo diante de cônjuges. Qualquer informação parcial, como saldo ou resgates, também é violação. A via adequada é a requisição judicial."}, {"fala_cliente": "Mas a conta conjunta era nossa. Também não posso ver?", "alternativas": ["Só posso mostrar a conta conjunta se o Sérgio autorizar por escrito.", "Conta conjunta também é sigilosa; nenhum dos titulares pode ver o extrato.", "Da conta conjunta você é titular, então tem acesso às informações e movimentações dela normalmente. O que não posso compartilhar são as contas e investimentos em que só o Sérgio é titular.", "Sendo conta conjunta, você pode ver também todas as outras contas dele."], "correta": 2, "explicacao": "Cada titular tem direito às informações da conta da qual é titular. A cotitularidade não dá acesso a contas individuais do outro titular. Distinguir com precisão o que pode e o que não pode ser informado é comunicação clara."}, {"fala_cliente": "E se ele te ligar pedindo informações sobre mim?", "alternativas": ["Como ele ainda é seu marido no papel, ele pode saber tudo.", "O mesmo vale para ele: seus dados individuais não serão compartilhados sem sua autorização ou sem uma hipótese legal, como ordem judicial. Isso é garantido pelo sigilo bancário e pela LGPD.", "Aí depende; se ele for educado, posso adiantar alguma coisa.", "Não se preocupe: eu te conto tudo o que ele perguntar."], "correta": 1, "explicacao": "O dever de sigilo é igual para todos os clientes e não depende de afinidade ou de estado civil. Repassar a um cliente o que o outro perguntou também viola a confidencialidade."}, {"fala_cliente": "Pode me mandar meus extratos no meu WhatsApp pessoal, então? É mais rápido.", "alternativas": ["Mando para o e-mail do seu trabalho, que é mais fácil de achar.", "Claro, mando agora uma foto da tela do sistema para o seu WhatsApp.", "Envio para o WhatsApp do seu advogado, que já resolve tudo.", "Por segurança, prefiro que você acesse os extratos pelo aplicativo ou pelo internet banking, ou eu envio pelos canais oficiais do banco. Assim evitamos expor seus dados financeiros em canais não seguros."], "correta": 3, "explicacao": "A confidencialidade no ambiente digital exige uso de canais oficiais e seguros. Fotografar telas do sistema, usar e-mail corporativo de terceiros ou enviar dados a outra pessoa sem autorização formal expõe informações da cliente."}, {"fala_cliente": "E vocês podem usar meus dados para me oferecer outros produtos? Recebo muitas ligações.", "alternativas": ["Como é cliente, o banco pode usar seus dados para qualquer finalidade, sem limite.", "Você tem direitos como titular dos dados pela LGPD, como acessar, corrigir e obter informações sobre o uso deles. Se não quiser receber ofertas, posso registrar sua preferência de contato e indicar o canal do encarregado de dados do banco.", "Não existe forma de pedir para parar as ligações.", "Os dados são compartilhados com parceiros, mas isso é padrão do mercado."], "correta": 1, "explicacao": "A LGPD garante direitos ao titular, como acesso, correção e informação sobre o tratamento, e exige finalidade definida para o uso de dados. O encarregado (DPO) é o canal entre titular e instituição."}, {"fala_cliente": "Ok. E sobre meus investimentos, mudando de estado civil eu preciso mudar algo?", "alternativas": ["Sim, é um bom momento para atualizar seu cadastro e seu perfil de investidora, porque renda, patrimônio e objetivos podem mudar. Podemos agendar essa revisão quando você se sentir pronta.", "Só precisa mudar o estado civil; perfil de investidor não tem relação com isso.", "Vou resgatar todos os seus investimentos para facilitar a partilha.", "Não precisa mudar nada; o cadastro é feito uma única vez."], "correta": 0, "explicacao": "Mudanças relevantes de vida afetam a situação financeira e os objetivos, exigindo atualização do cadastro e do suitability. Resgatar sem ordem da cliente seria irregular."}], "questoes_finais": [{"id": "AD-09-Q1", "modulo": 3, "topico": "3.4.6.5 Sigilo bancário (Lei Complementar 105/2001)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Sobre o sigilo bancário aplicado ao caso de Mariana e Sérgio, é correto afirmar:", "alternativas": ["O sigilo bancário deixou de existir com a entrada em vigor da LGPD.", "O sigilo bancário protege apenas a conta corrente, e não os investimentos.", "As instituições devem manter sigilo sobre operações e serviços, admitindo-se a quebra em hipóteses legais, como ordem judicial, e a revelação com consentimento expresso do interessado.", "O gerente pode revelar dados de um cônjuge ao outro durante o processo de separação."], "correta": 2, "explicacao": "A Lei Complementar 105/2001 impõe sigilo sobre operações ativas, passivas e serviços, com exceções legais, como determinação judicial, comunicação de ilícitos às autoridades e consentimento expresso do interessado. A LGPD convive com o sigilo bancário, não o substitui."}, {"id": "AD-09-Q2", "modulo": 3, "topico": "3.4.6.2 Conceito (LGPD)", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Em relação à LGPD e aos dados de Mariana tratados pelo banco, é correto afirmar:", "alternativas": ["A LGPD não se aplica a instituições financeiras, que seguem apenas a lei do sigilo bancário.", "O consentimento é a única base legal que permite ao banco tratar dados de clientes.", "Dados financeiros, como saldo e investimentos, são classificados pela LGPD como dados pessoais sensíveis.", "Ela pode solicitar à instituição a confirmação da existência de tratamento e o acesso aos seus dados pessoais."], "correta": 3, "explicacao": "Confirmação e acesso estão entre os direitos do titular previstos na LGPD. Dados sensíveis são, por exemplo, origem racial, convicção religiosa, saúde e biometria, e não dados financeiros. A lei se aplica a bancos e prevê várias bases legais além do consentimento, como cumprimento de obrigação legal e execução de contrato."}]}, {"id": "AD-10", "modulo": 3, "tipo": "arvore", "topico": "3.1.6.3 Modelo completo x desconto simplificado / 3.1.5.6 Planejamento para aposentadoria", "dificuldade": "dificil", "titulo": "PGBL para quem faz declaração simplificada", "contexto": "Fábio, 38 anos, é analista com carteira assinada, ganha cerca de R$ 9 mil por mês, contribui para o INSS e declara o IR pelo modelo simplificado, pois tem poucas despesas dedutíveis. Um colega disse que o PGBL 'reduz o imposto', e ele procura Larissa, sua gerente.", "etapas": [{"fala_cliente": "Larissa, quero abrir um PGBL. Meu colega disse que dá para pagar menos imposto.", "alternativas": ["Seu colega está certo; o PGBL reduz o imposto de qualquer pessoa.", "Vamos abrir agora; o benefício fiscal vale para todos os planos de previdência.", "Posso te ajudar, Fábio. Para saber se o PGBL faz sentido, preciso entender algumas coisas: qual modelo de declaração de IR você usa, se contribui para o INSS e qual é o seu objetivo e o prazo para esse dinheiro.", "Previdência privada só faz sentido para quem tem mais de 50 anos."], "correta": 2, "explicacao": "O benefício fiscal do PGBL depende do modelo de declaração e da contribuição para a previdência oficial. Investigar essas condições antes de recomendar é aplicação direta do suitability."}, {"fala_cliente": "Faço a declaração simplificada, porque não tenho muitos gastos dedutíveis. E contribuo para o INSS, sim.", "alternativas": ["Então o benefício do PGBL não se aplica a você hoje: a dedução das contribuições, de até 12% da renda bruta tributável, só é aproveitada no modelo completo. No simplificado, o desconto padrão substitui as deduções.", "Não tem problema; o PGBL desconta o imposto direto do seu salário todo mês.", "Ótimo, então você pode deduzir até 12% da renda na declaração simplificada.", "No simplificado você deduz o valor total aportado, sem limite."], "correta": 0, "explicacao": "A dedução do PGBL, limitada a 12% da renda bruta tributável, só existe no modelo completo. Quem usa o simplificado não aproveita o benefício e, ainda assim, pagaria IR sobre o valor total no resgate."}, {"fala_cliente": "E qual é a diferença então entre PGBL e VGBL?", "alternativas": ["O VGBL é isento de IR, e por isso é o mais vendido.", "No PGBL, as contribuições podem ser deduzidas no modelo completo, mas o IR no resgate incide sobre o valor total. No VGBL não há dedução, e o IR incide apenas sobre os rendimentos. Para quem faz a declaração simplificada, o VGBL costuma ser mais indicado.", "São iguais; a diferença é só o nome comercial que cada banco usa.", "No PGBL o IR incide só sobre os rendimentos, e no VGBL sobre o total resgatado."], "correta": 1, "explicacao": "A base de cálculo do IR no resgate é a principal diferença: valor total no PGBL e só rendimentos no VGBL. Para quem não deduz, o VGBL evita tributar o principal."}, {"fala_cliente": "Entendi. E a tabela de imposto? Me pediram para escolher entre progressiva e regressiva.", "alternativas": ["A regressiva começa em 22,5% e cai para 15% depois de 2 anos, como no CDB.", "Tanto faz; as duas tabelas sempre resultam no mesmo imposto.", "Na progressiva, o imposto é sempre de 27,5%, sem nenhum ajuste.", "Na regressiva, a alíquota cai com o tempo de cada aporte: começa em 35% até 2 anos e chega a 10% acima de 10 anos. Na progressiva, há retenção de 15% na fonte e ajuste na declaração conforme a tabela do IR. Para um objetivo de longo prazo, a regressiva costuma ser vantajosa."], "correta": 3, "explicacao": "A tabela regressiva da previdência vai de 35% a 10%, reduzindo 5 pontos a cada 2 anos de permanência de cada aporte. A progressiva retém 15% e ajusta na declaração anual. Confundir com a tabela da renda fixa é erro comum."}, {"fala_cliente": "Meu objetivo é a aposentadoria, daqui a uns 25 anos. Mas e se eu precisar antes?", "alternativas": ["Os planos permitem resgate e portabilidade, respeitadas as carências previstas no plano. Mas, na tabela regressiva, resgates antecipados pagam al
