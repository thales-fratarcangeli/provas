3, "explicacao": "O perfil deve ser atualizado em intervalos não superiores a 24 meses. Com perfil desatualizado ou produto inadequado, a instituição não deve recomendar o produto; se o cliente insistir, deve alertá-lo e obter declaração expressa de que está ciente da ausência ou desatualização do perfil ou da inadequação. Alterar o perfil sem nova análise é irregular."}, {"id": "M1B-046", "modulo": 1, "topico": "1.4.12.1.3.3 Publicidade", "dificuldade": "facil", "tipo": "mc", "enunciado": "Ao preparar um material publicitário sobre um fundo de investimento que exibe sua rentabilidade, a área de marketing deve:", "alternativas": ["destacar que a rentabilidade passada é garantia de ganhos futuros", "omitir os riscos, pois eles já constam no regulamento", "usar linguagem clara e equilibrada, sem prometer resultados, e incluir avisos como o de que rentabilidade passada não garante rentabilidade futura e de que fundos não contam com garantia do FGC", "comparar o fundo com qualquer índice, mesmo de períodos diferentes, para valorizar o produto"], "correta": 2, "explicacao": "As regras de publicidade exigem materiais claros, objetivos e não enganosos, que não assegurem rentabilidade e tragam os avisos obrigatórios, como o de que a rentabilidade obtida no passado não representa garantia de rentabilidade futura e a ausência de garantia do FGC. Comparações devem ser adequadas e feitas em períodos equivalentes."}, {"id": "M1B-047", "modulo": 1, "topico": "1.4.12.1.3.4 Transparência na remuneração do canal de distribuição", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um investidor pergunta como a corretora é remunerada pela distribuição de um fundo e de um CDB oferecidos sem cobrança direta a ele. Pela regra de transparência na remuneração, a instituição deve:", "alternativas": ["informar de forma clara as formas de remuneração recebidas (como parte da taxa de administração ou spread na renda fixa) e os potenciais conflitos de interesse", "manter a remuneração em sigilo, por se tratar de informação comercial estratégica", "informar apenas se o investidor for profissional", "dizer que a distribuição é gratuita, já que o investidor não paga taxa diretamente"], "correta": 0, "explicacao": "O Código exige que o distribuidor seja transparente sobre como é remunerado: parcela das taxas dos fundos (rebate), comissões, diferença entre a taxa de compra e a de venda em produtos de renda fixa, entre outras. Isso permite ao investidor avaliar possíveis conflitos de interesse. Ausência de cobrança direta não significa que o distribuidor não seja remunerado."}, {"id": "M1B-048", "modulo": 1, "topico": "1.4.12.1.3.5 Serviços de intermediação no exterior", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma instituição brasileira oferece a seus clientes acesso a uma corretora estrangeira do mesmo grupo para investir diretamente no exterior. De acordo com o Código ANBIMA, ela deve informar ao cliente, entre outros pontos:", "alternativas": ["que os investimentos no exterior têm a mesma proteção do FGC dos produtos nacionais", "que a relação e a custódia ficarão com a instituição estrangeira, sujeita à legislação e à regulação de outro país, sem cobertura do FGC, com riscos como o cambial e obrigações tributárias próprias", "que a regulação brasileira da CVM se aplica integralmente à corretora estrangeira", "que não há riscos cambiais, pois a corretora é do mesmo grupo"], "correta": 1, "explicacao": "Ao intermediar o acesso a serviços no exterior, a instituição deve dar transparência sobre quem presta o serviço, a jurisdição e a regulação aplicáveis, os riscos (inclusive cambial) e a ausência de mecanismos de proteção locais como o FGC. Também deve deixar claro que o investidor tem obrigações tributárias e declaratórias no Brasil."}, {"id": "M1B-049", "modulo": 1, "topico": "1.4.12.1.3.6 Transferência de produtos de investimento", "dificuldade": "facil", "tipo": "mc", "enunciado": "Uma cliente decide levar seus produtos de investimento para outra instituição e solicita a transferência. Segundo o Código ANBIMA, a instituição de origem deve:", "alternativas": ["adotar procedimentos para viabilizar a transferência quando possível, informando à cliente os passos e eventuais custos, sem criar obstáculos indevidos", "condicionar a transferência a um período mínimo de permanência não previsto no produto", "exigir que a cliente resgate todos os produtos antes de transferir", "recusar a transferência de qualquer produto distribuído por ela"], "correta": 0, "explicacao": "O Código trata da transferência de produtos de investimento entre instituições, exigindo que o processo seja conduzido de forma diligente e transparente, com informação ao investidor sobre procedimentos e custos. Dificultar a transferência para reter o cliente contraria a relação fiduciária."}, {"id": "M1B-050", "modulo": 1, "topico": "1.4.12.1.3.8 Distribuição para o private", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma instituição quer distribuir produtos de investimento no segmento private, conforme o Código ANBIMA. Uma característica desse segmento é:", "alternativas": ["a garantia de rentabilidade mínima para os clientes atendidos", "o atendimento personalizado por profissionais dedicados, com visão global do patrimônio do cliente, sem dispensar as regras de conheça sua clientela e suitability", "a dispensa da análise de perfil, por se tratar de clientes de alta renda", "a proibição de distribuir produtos de outras instituições"], "correta": 1, "explicacao": "O private é voltado a clientes de patrimônio elevado, com atendimento customizado e abordagem que considera o patrimônio de forma ampla (inclusive aspectos sucessórios e tributários). O patrimônio elevado não afasta, por si, as obrigações de conhecer o cliente e verificar a adequação dos produtos, nem permite promessas de rentabilidade."}, {"id": "M2A-001", "modulo": 2, "topico": "2.1.1.1.1.1 NTN-B e NTN-B Principal", "dificuldade": "facil", "tipo": "mc", "enunciado": "Uma pessoa investidora quer proteger o poder de compra de um patrimônio que só será usado daqui a 15 anos e prefere não receber fluxos intermediários, para não ter de reinvestir. Entre os títulos públicos federais, o mais aderente a esse objetivo é a:", "alternativas": ["NTN-B, que paga IPCA mais uma taxa prefixada com cupons semestrais de juros", "LTN, que paga um valor nominal prefixado de R$ 1.000 no vencimento", "LFT, que acompanha a taxa Selic diária e paga tudo no vencimento", "NTN-B Principal, que paga IPCA mais uma taxa prefixada em um único fluxo no vencimento"], "correta": 3, "explicacao": "A NTN-B Principal (Tesouro IPCA+) protege contra a inflação, pois corrige o valor pelo IPCA e soma uma taxa real contratada, e não paga cupons: tudo é recebido no vencimento. A NTN-B também é indexada ao IPCA, mas paga juros semestrais, o que gera necessidade de reinvestimento e antecipação de IR. LFT e LTN não garantem ganho real acima da inflação."}, {"id": "M2A-002", "modulo": 2, "topico": "2.1.1.1.1.1 NTN-B e NTN-B Principal", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente comprou NTN-B (Tesouro IPCA+ com Juros Semestrais) há 200 dias e recebeu hoje um cupom de juros de R$ 500,00. Considerando a tributação vigente, o valor do IR retido sobre esse cupom é de:", "alternativas": ["R$ 112,50, pois todo cupom semestral é tributado à alíquota de 22,5%", "Zero, pois o IR só é cobrado no vencimento ou na venda do título", "R$ 100,00, pois o cupom é tributado pela alíquota correspondente ao prazo desde a aplicação (20%)", "R$ 75,00, pois cupons de títulos públicos sempre pagam a alíquota mínima de 15%"], "correta": 2, "explicacao": "Os cupons de juros são tributados no pagamento, com alíquota definida pela tabela regressiva conforme o prazo decorrido desde a data da aplicação. Com 200 dias (entre 181 e 360 dias), a alíquota é de 20%: 20% x R$ 500 = R$ 100. Não há isenção nem alíquota fixa para cupons; por isso a NTN-B antecipa o recolhimento de IR em relação à NTN-B Principal."}, {"id": "M2A-003", "modulo": 2, "topico": "2.1.1.1.1.1 NTN-B e NTN-B Principal", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma pessoa investidora possui NTN-B Principal com vencimento em 2045 comprada a IPCA + 6% a.a. Meses depois, as taxas de mercado desse título sobem para IPCA + 7% a.a. e ela precisa vender o título. É correto afirmar que:", "alternativas": ["o preço de venda não se altera, pois títulos indexados ao IPCA não sofrem efeito de marcação a mercado", "o preço de venda tende a ser maior, pois a alta das taxas valoriza títulos já emitidos", "o preço de venda tende a ser menor que o da curva contratada, podendo gerar perda em relação ao esperado, porque o título é marcado a mercado", "ela receberá exatamente IPCA + 6% a.a. no período, já que o Tesouro garante a taxa contratada em qualquer data de venda"], "correta": 2, "explicacao": "Preço e taxa de um título de renda fixa têm relação inversa: quando a taxa exigida pelo mercado sobe, o valor presente dos fluxos cai. A taxa contratada só é garantida para quem leva o título até o vencimento; na venda antecipada vale o preço de mercado. Títulos longos indexados ao IPCA são bastante sensíveis à parte prefixada da taxa (o juro real)."}, {"id": "M2A-004", "modulo": 2, "topico": "2.1.1.1.1.1 NTN-B e NTN-B Principal", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Duas clientes aplicam o mesmo valor, na mesma data e à mesma taxa real, em títulos com mesmo vencimento: Ana na NTN-B e Bia na NTN-B Principal. Ambas levam os títulos até o vencimento. Sobre a comparação, é correto afirmar que:", "alternativas": ["as duas terão exatamente o mesmo valor líquido no vencimento, pois a taxa real contratada é igual", "Ana não paga IR sobre os cupons, pois a tributação da NTN-B ocorre apenas sobre o principal", "Bia pagará mais IR, pois a NTN-B Principal é tributada pela alíquota de 22,5% no vencimento", "Ana terá IR recolhido a cada cupom e precisará reinvestir os juros recebidos, de modo que seu resultado final depende das taxas de reinvestimento, enquanto Bia só paga IR no vencimento"], "correta": 3, "explicacao": "Na NTN-B, os cupons semestrais sofrem retenção de IR em cada pagamento e o valor recebido precisa ser reinvestido, o que expõe a investidora ao risco de reinvestimento. Na NTN-B Principal, todo o rendimento é capitalizado e tributado de uma vez no vencimento, à alíquota de 15% para prazos acima de 720 dias. Por isso os resultados finais não são necessariamente iguais, mesmo com a mesma taxa contratada."}, {"id": "M2A-005", "modulo": 2, "topico": "2.1.1.1.1.2 LFT", "dificuldade": "facil", "tipo": "mc", "enunciado": "Um cliente pede ao gerente um título público para compor sua reserva de emergência, com baixa oscilação de preço e rentabilidade que acompanhe a taxa básica de juros. O título indicado é a:", "alternativas": ["LFT (Tesouro Selic)", "NTN-B (Tesouro IPCA+ com Juros Semestrais)", "LTN (Tesouro Prefixado)", "NTN-B Principal (Tesouro IPCA+)"], "correta": 0, "explicacao": "A LFT é pós-fixada e tem seu valor corrigido diariamente pela taxa Selic, por isso apresenta a menor volatilidade entre os títulos públicos e é a mais indicada para reserva de emergência. Títulos prefixados e indexados ao IPCA (com parte prefixada) sofrem oscilações maiores com a marcação a mercado."}, {"id": "M2A-006", "modulo": 2, "topico": "2.1.1.1.1.2 LFT", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente que comprou Tesouro Selic (LFT) estranhou ao ver, em um dia específico, uma pequena desvalorização do título no extrato. A explicação mais adequada da pessoa profissional é:", "alternativas": ["houve cobrança de IOF, que incide sempre no primeiro ano sobre o Tesouro Selic", "a LFT pode ser negociada com pequeno ágio ou deságio sobre seu valor corrigido pela Selic, o que gera oscilações pequenas na marcação a mercado", "o título sofreu calote parcial do Tesouro Nacional, que deve ser comunicado à CVM", "a LFT é corrigida pelo IPCA e, em meses de deflação, o valor do título cai"], "correta": 1, "explicacao": "Embora seja pós-fixada e acompanhe a Selic, a LFT é negociada com uma taxa (ágio ou deságio) sobre o valor nominal atualizado. Variações nessa taxa geram oscilações pequenas e geralmente temporárias no preço. A LFT não é corrigida pelo IPCA e o IOF só incide em resgates com menos de 30 dias."}, {"id": "M2A-007", "modulo": 2, "topico": "2.1.1.1.1.2 LFT", "dificuldade": "medio", "tipo": "mc", "enunciado": "Em um cenário em que o Copom passa a elevar a meta da taxa Selic, qual título público tende a se beneficiar mais diretamente dessa alta, sem sofrer perda relevante de marcação a mercado?", "alternativas": ["NTN-B Principal, pois paga IPCA mais taxa real", "LFT, pois sua rentabilidade acompanha a Selic", "NTN-B, pois paga cupons semestrais", "LTN, pois paga taxa prefixada definida na compra"], "correta": 1, "explicacao": "A LFT é pós-fixada à Selic: com a alta dos juros, a rentabilidade diária aumenta automaticamente. Já os títulos com componente prefixado (LTN, NTN-B e NTN-B Principal) tendem a perder valor de mercado quando as taxas sobem, pois o preço tem relação inversa com a taxa."}, {"id": "M2A-008", "modulo": 2, "topico": "2.1.1.1.1.3 LTN", "dificuldade": "facil", "tipo": "mc", "enunciado": "Sobre a LTN (Tesouro Prefixado), é correto afirmar que:", "alternativas": ["é negociada com deságio e paga valor de face de R$ 1.000,00 no vencimento, sem cupons intermediários", "paga cupons semestrais de juros e o principal corrigido pelo IPCA", "tem o valor corrigido diariamente pela taxa Selic", "garante a rentabilidade contratada mesmo se for vendida antes do vencimento"], "correta": 0, "explicacao": "A LTN é um título prefixado sem cupom: é comprada com desconto (deságio) e paga R$ 1.000,00 no vencimento; a diferença é o rendimento. A rentabilidade contratada só é garantida no vencimento; antes disso o preço varia conforme as taxas de mercado. O título prefixado com cupons semestrais é a NTN-F."}, {"id": "M2A-009", "modulo": 2, "topico": "2.1.1.1.1.3 LTN", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Uma LTN com exatamente 504 dias úteis até o vencimento (2 anos de 252 dias úteis) é negociada à taxa de 10% a.a. (base 252). Qual é, aproximadamente, o preço unitário do título?", "alternativas": ["R$ 800,00", "R$ 833,33", "R$ 826,45", "R$ 909,09"], "correta": 2, "explicacao": "O preço da LTN é o valor de face trazido a valor presente: PU = 1.000 / (1,10)^(504/252) = 1.000 / 1,21 = R$ 826,45. O valor R$ 800,00 resultaria de desconto simples de 20%, e R$ 833,33 de juros simples (1.000/1,20); R$ 909,09 corresponde a apenas um ano."}, {"id": "M2A-010", "modulo": 2, "topico": "2.1.1.1.1.3 LTN", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente comprou uma LTN por R$ 800,00 e a manteve até o vencimento, recebendo R$ 1.000,00 após mais de 720 dias. Desconsiderando taxas de custódia, o valor líquido recebido, após o IR, foi de:", "alternativas": ["R$ 850,00", "R$ 1.000,00", "R$ 955,00", "R$ 970,00"], "correta": 3, "explicacao": "O rendimento bruto foi de R$ 200,00 (1.000 - 800). Acima de 720 dias, a alíquota é 15%: IR = R$ 30,00. Valor líquido = 1.000 - 30 = R$ 970,00. O IR incide apenas sobre o rendimento, e não sobre o valor total resgatado; R$ 955,00 seria o resultado com alíquota de 22,5%."}, {"id": "M2A-011", "modulo": 2, "topico": "2.1.1.1.1.3 LTN", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma pessoa investidora acredita que as taxas de juros vão cair de forma relevante nos próximos meses e quer se beneficiar disso com títulos públicos, aceitando oscilações. A estratégia coerente com essa expectativa é comprar:", "alternativas": ["LFT (Selic), pois ela é o título de maior volatilidade da curva", "nenhum título público, pois apenas CDBs se valorizam com a queda dos juros", "LTN (prefixado), pois a queda das taxas valoriza o preço de mercado do título", "LFT (Selic), pois sua rentabilidade aumenta quando a Selic cai"], "correta": 2, "explicacao": "Títulos prefixados travam a taxa na compra; se as taxas de mercado caem, o preço do título sobe, permitindo ganho na venda antecipada (ou rentabilidade acima do mercado no vencimento). A LFT, ao contrário, passaria a render menos com a queda da Selic e quase não tem ganho de marcação a mercado."}, {"id": "M2A-012", "modulo": 2, "topico": "2.1.1.1.1.4 Plataforma do Tesouro Direto", "dificuldade": "facil", "tipo": "mc", "enunciado": "Um cliente pergunta como funciona o acesso ao Tesouro Direto. A resposta correta é que:", "alternativas": ["o investimento é feito por meio de uma instituição financeira habilitada (agente de custódia), e os títulos ficam custodiados na B3", "os títulos são custodiados no próprio banco do cliente, sem registro centralizado", "é preciso ser investidor qualificado para comprar títulos públicos pela plataforma", "o cliente compra os títulos diretamente na CVM, que mantém a custódia"], "correta": 0, "explicacao": "O Tesouro Direto é um programa do Tesouro Nacional, em parceria com a B3, que permite a pessoas físicas comprar títulos públicos federais. O acesso é feito por instituições financeiras habilitadas, e a custódia é realizada na B3, que cobra taxa de custódia. Não há exigência de ser investidor qualificado."}, {"id": "M2A-013", "modulo": 2, "topico": "2.1.1.1.1.4 Plataforma do Tesouro Direto", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma cliente mantém, durante um ano inteiro, R$ 30.000,00 aplicados em Tesouro Selic, sem outros títulos no Tesouro Direto. Considerando a taxa de custódia da B3 de 0,20% a.a. e a isenção vigente para o Tesouro Selic, o custo anual aproximado de custódia é de:", "alternativas": ["R$ 20,00, pois a taxa é de 0,10% a.a. no Tesouro Selic", "zero, pois o Tesouro Selic é totalmente isento de custódia", "R$ 60,00, pois a taxa incide sobre todo o saldo", "R$ 40,00, pois a taxa incide apenas sobre o que excede R$ 10.000,00"], "correta": 3, "explicacao": "No Tesouro Selic, há isenção da taxa de custódia da B3 para saldos de até R$ 10.000,00; acima disso, os 0,20% a.a. incidem apenas sobre o excedente. Assim: 0,20% x (30.000 - 10.000) = R$ 40,00 por ano. Cobrar sobre o saldo total seria ignorar a isenção."}, {"id": "M2A-014", "modulo": 2, "topico": "2.1.1.1.1.4 Plataforma do Tesouro Direto", "dificuldade": "medio", "tipo": "mc", "enunciado": "Sobre a liquidez dos títulos no Tesouro Direto, é correto afirmar que:", "alternativas": ["o investidor só pode resgatar no vencimento, salvo o Tesouro Selic", "o Tesouro Nacional recompra os títulos diariamente, mas pelo preço de mercado do dia, que pode ser menor que o valor da curva contratada", "a venda antecipada sempre garante a rentabilidade contratada na compra", "o investidor precisa encontrar outro comprador no mercado secundário para vender antes do vencimento"], "correta": 1, "explicacao": "O Tesouro Direto oferece liquidez diária: o próprio Tesouro Nacional recompra os títulos. Porém, a recompra é feita a preço de mercado, refletindo as taxas vigentes. Assim, há liquidez, mas não garantia de rentabilidade na venda antecipada, especialmente em títulos prefixados e indexados ao IPCA."}, {"id": "M2A-015", "modulo": 2, "topico": "2.1.1.1.1.4 Plataforma do Tesouro Direto", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Um cliente deseja comparar o risco de crédito de um título do Tesouro Direto com o de um CDB coberto pelo FGC. A explicação tecnicamente correta é:", "alternativas": ["o CDB tem risco de crédito menor que o título público, pois conta com o FGC sem limite", "o título público não tem nenhum risco, nem de mercado nem de crédito", "o título público é garantido pelo FGC até R$ 250 mil, assim como o CDB", "o título público tem risco de crédito do Tesouro Nacional, considerado o menor risco da economia em moeda local, e não conta com o FGC, que garante apenas obrigações de instituições associadas"], "correta": 3, "explicacao": "Títulos públicos federais são obrigações do Tesouro Nacional e são considerados o ativo de menor risco de crédito em reais; não há cobertura do FGC, que garante depósitos e títulos emitidos por instituições associadas. Isso não elimina o risco de mercado na venda antecipada. O FGC tem limite de R$ 250 mil por CPF por instituição ou conglomerado."}, {"id": "M2A-016", "modulo": 2, "topico": "2.1.1.1.2 Tesouro Prefixado, Tesouro Selic, Tesouro IPCA+, Tesouro Educa+, Tesouro Renda+", "dificuldade": "facil", "tipo": "mc", "enunciado": "No Tesouro Direto, os títulos têm nomes comerciais. Assinale a correspondência correta:", "alternativas": ["Tesouro Selic = LTN; Tesouro Prefixado = LFT; Tesouro IPCA+ = NTN-B", "Tesouro Selic = LFT; Tesouro Prefixado = LTN; Tesouro IPCA+ = NTN-B Principal", "Tesouro Selic = NTN-B; Tesouro Prefixado = LTN; Tesouro IPCA+ = LFT", "Tesouro Selic = LFT; Tesouro Prefixado = NTN-B Principal; Tesouro IPCA+ = LTN"], "correta": 1, "explicacao": "Tesouro Selic é a LFT (pós-fixada à Selic), Tesouro Prefixado é a LTN (prefixada sem cupom) e Tesouro IPCA+ é a NTN-B Principal (IPCA + taxa, sem cupom). As versões com juros semestrais são a NTN-F (Tesouro Prefixado com Juros Semestrais) e a NTN-B (Tesouro IPCA+ com Juros Semestrais)."}, {"id": "M2A-017", "modulo": 2, "topico": "2.1.1.1.2 Tesouro Educa+", "dificuldade": "facil", "tipo": "mc", "enunciado": "Uma mãe quer planejar o pagamento da faculdade do filho, que começará daqui a alguns anos, recebendo valores mensais corrigidos pela inflação durante o curso. O título do Tesouro Direto desenhado para esse objetivo é o:", "alternativas": ["Tesouro Educa+, que após a fase de acumulação paga 60 parcelas mensais (5 anos) corrigidas pelo IPCA", "Tesouro Renda+, que paga 60 parcelas mensais prefixadas", "Tesouro Selic, que paga cupons mensais durante 5 anos", "Tesouro Prefixado com Juros Semestrais, que paga cupons a cada seis meses durante a graduação"], "correta": 0, "explicacao": "O Tesouro Educa+ tem uma fase de acumulação e, a partir da data de conversão, paga 60 parcelas mensais (5 anos), atualizadas pelo IPCA, prazo compatível com uma graduação. O Tesouro Renda+ é voltado à aposentadoria e paga 240 parcelas mensais (20 anos)."}, {"id": "M2A-018", "modulo": 2, "topico": "2.1.1.1.2 Tesouro Renda+", "dificuldade": "facil", "tipo": "mc", "enunciado": "Um cliente de 40 anos quer complementar a aposentadoria com uma renda mensal protegida da inflação por 20 anos, usando títulos públicos. O produto mais adequado é o:", "alternativas": ["Tesouro Educa+, que paga 240 parcelas mensais prefixadas", "Tesouro IPCA+, que paga renda mensal desde a compra", "Tesouro Renda+ (Aposentadoria Extra), que paga 240 parcelas mensais corrigidas pelo IPCA", "Tesouro Selic, que garante renda vitalícia corrigida pela Selic"], "correta": 2, "explicacao": "O Tesouro Renda+ foi criado para complementar a aposentadoria: o investidor acumula até a data de conversão escolhida e, depois, recebe 240 parcelas mensais (20 anos) atualizadas pelo IPCA. Não é uma renda vitalícia, e o Educa+ paga 60 parcelas, voltado a educação."}, {"id": "M2A-019", "modulo": 2, "topico": "2.1.1.1.2 Tesouro Educa+ e Tesouro Renda+", "dificuldade": "medio", "tipo": "mc", "enunciado": "Sobre a tributação das parcelas mensais recebidas no Tesouro Educa+ e no Tesouro Renda+, é correto afirmar que:", "alternativas": ["incide IR pela tabela progressiva mensal, como em planos de previdência", "o IR é cobrado sobre o valor bruto de cada parcela, incluindo o principal investido", "incide IR pela tabela regressiva apenas sobre a parcela de rendimento de cada pagamento, conforme o prazo desde a aplicação", "as parcelas são isentas de IR por terem finalidade educacional ou previdenciária"], "correta": 2, "explicacao": "Esses títulos seguem a tributação dos demais títulos públicos: IR retido na fonte pela tabela regressiva de renda fixa, incidindo somente sobre o rendimento contido em cada pagamento. Como as parcelas costumam ocorrer anos após a compra, a alíquota tende a ser de 15%. Não há isenção nem uso da tabela progressiva típica de previdência."}, {"id": "M2A-020", "modulo": 2, "topico": "2.1.1.1.2 Tesouro Prefixado, Selic e IPCA+", "dificuldade": "medio", "tipo": "mc", "enunciado": "Três clientes têm objetivos distintos: (I) reserva de emergência; (II) garantir hoje uma taxa nominal para um pagamento de valor fixo daqui a 3 anos; (III) preservar o poder de compra para a aposentadoria em 25 anos. A associação mais adequada é:", "alternativas": ["I - Tesouro Prefixado; II - Tesouro Selic; III - Tesouro IPCA+", "I - Tesouro IPCA+; II - Tesouro Prefixado; III - Tesouro Selic", "I - Tesouro Selic; II - Tesouro IPCA+; III - Tesouro Prefixado", "I - Tesouro Selic; II - Tesouro Prefixado; III - Tesouro IPCA+"], "correta": 3, "explicacao": "Reserva de emergência pede baixa volatilidade e liquidez: Tesouro Selic. Para um valor nominal fixo em data definida, o Tesouro Prefixado garante a taxa no vencimento. Para preservar poder de compra no longo prazo, o Tesouro IPCA+ paga inflação mais juro real."}, {"id": "M2A-021", "modulo": 2, "topico": "2.1.1.1.2 Tesouro Prefixado, Selic e IPCA+", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Um cliente comprou Tesouro Prefixado a 12% a.a. Um ano depois, a inflação acumulada foi muito acima do esperado e as taxas de mercado do mesmo título subiram para 14% a.a. Se ele mantiver o título até o vencimento, é correto afirmar que:", "alternativas": ["receberá a taxa nominal de 12% a.a. contratada, mas o ganho real pode ser menor que o planejado devido à inflação mais alta", "terá perda nominal no vencimento, porque o título se desvalorizou com a alta das taxas", "terá o valor de face corrigido pela inflação do período", "receberá 14% a.a., pois a taxa do título acompanha o mercado"], "correta": 0, "explicacao": "No prefixado, a taxa nominal contratada é garantida no vencimento, independentemente da variação das taxas no caminho; a perda de marcação a mercado só se realiza se houver venda antecipada. O risco que permanece é o inflacionário: com inflação maior, o ganho real cai. O valor de face da LTN é fixo, não corrigido pela inflação."}, {"id": "M2A-022", "modulo": 2, "topico": "2.1.1.1.2 Tesouro IPCA+", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma pessoa investidora vê no extrato que seu Tesouro IPCA+ 2045 está valendo menos do que investiu, embora o IPCA tenha sido positivo no período. A causa mais provável é:", "alternativas": ["a deflação de preços, já que o IPCA positivo reduz o valor do título", "a alta da taxa real de mercado do título, que reduziu seu preço de marcação a mercado", "a cobrança de IOF, que incide sobre títulos com mais de 30 dias", "o Tesouro Nacional ter reduzido unilateralmente a taxa contratada"], "correta": 1, "explicacao": "O preço de mercado do Tesouro IPCA+ depende da taxa real negociada; em títulos longos, uma alta dessa taxa pode mais que compensar a correção pelo IPCA e reduzir o preço. Isso é marcação a mercado e só vira perda efetiva se houver venda antes do vencimento. IOF não incide após 30 dias e a taxa contratada não é alterada pelo Tesouro."}, {"id": "M2A-023", "modulo": 2, "topico": "2.1.1.1.2 Tesouro Educa+ e Tesouro Renda+", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Um cliente diz ao gerente: Vou comprar Tesouro Renda+ porque é um título sem risco nenhum, posso vender quando quiser pelo valor aplicado mais juros. A orientação correta é:", "alternativas": ["o Renda+ é garantido pelo FGC, o que elimina o risco de mercado", "o cliente está certo, pois títulos públicos não sofrem marcação a mercado", "o título tem baixo risco de crédito, mas, por ser longo e atrelado a IPCA + taxa real, pode ter forte oscilação de preço; vendas antes da conversão ocorrem a preço de mercado", "o Renda+ não permite venda antes da data de conversão em nenhuma hipótese"], "correta": 2, "explicacao": "O Renda+ é um título do Tesouro Nacional (baixo risco de crédito), mas tem duration elevada, o que o torna sensível a variações da taxa real de mercado. Quem vende antes da conversão recebe o preço de mercado do dia, que pode ser inferior ao valor aplicado corrigido. Títulos públicos não contam com o FGC."}, {"id": "M2A-024", "modulo": 2, "topico": "2.1.1.1.3.1 CDB", "dificuldade": "facil", "tipo": "mc", "enunciado": "Sobre o Certificado de Depósito Bancário (CDB), é correto afirmar que:", "alternativas": ["é um título de captação emitido por bancos, coberto pelo FGC dentro dos limites e tributado pela tabela regressiva de IR", "é emitido por companhias securitizadoras e lastreado em recebíveis", "não tem cobertura do FGC, pois é um título negociável", "é isento de IR para pessoas físicas, como a LCI"], "correta": 0, "explicacao": "O CDB é um título de renda fixa emitido por bancos para captar recursos, com cobertura do FGC até R$ 250 mil por CPF por instituição ou conglomerado (limite global de R$ 1 milhão a cada 4 anos). Seus rendimentos são tributados pela tabela regressiva de IR, e pode ser transferido/negociado."}, {"id": "M2A-025", "modulo": 2, "topico": "2.1.1.1.3.1 CDB", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente aplicou R$ 10.000,00 em um CDB e resgatou R$ 11.200,00 após 400 dias corridos. Qual o valor líquido recebido, após o IR?", "alternativas": ["R$ 11.020,00", "R$ 10.990,00", "R$ 10.930,00", "R$ 9.240,00"], "correta": 1, "explicacao": "Rendimento bruto = R$ 1.200,00. Com 400 dias (entre 361 e 720), a alíquota é 17,5%: IR = R$ 210,00. Líquido = 11.200 - 210 = R$ 10.990,00. R$ 11.020,00 usaria 15% e R$ 10.930,00 usaria 22,5%; aplicar a alíquota sobre o total resgatado é erro conceitual."}, {"id": "M2A-026", "modulo": 2, "topico": "2.1.1.1.3.1 CDB", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente tem em um mesmo conglomerado financeiro R$ 180.000,00 em CDB e R$ 120.000,00 em LCA (valores já com rendimentos). O conglomerado sofre intervenção. Qual o valor máximo garantido pelo FGC a esse cliente?", "alternativas": ["R$ 180.000,00, pois LCA não é coberta pelo FGC", "R$ 300.000,00, pois cada produto tem garantia própria de até R$ 250 mil", "R$ 500.000,00, pois CDB e LCA têm limites independentes", "R$ 250.000,00, pois o limite é por CPF por instituição ou conglomerado, somando os produtos cobertos"], "correta": 3, "explicacao": "O FGC garante até R$ 250 mil por CPF por instituição ou conglomerado financeiro, somando todos os produtos cobertos (CDB, LCA, LCI, poupança, depósitos etc.), incluindo rendimentos. CDB e LCA são cobertos, mas não têm limites separados. Assim, dos R$ 300 mil, R$ 250 mil são garantidos."}, {"id": "M2A-027", "modulo": 2, "topico": "2.1.1.1.3.1 CDB", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma pessoa investidora quer usar um CDB para reserva de emergência. O atributo essencial a verificar na oferta é:", "alternativas": ["se o CDB é isento de IR, para não perder rendimento no resgate", "se o CDB tem prazo mínimo de 6 meses, igual à LCI", "se o CDB tem liquidez diária, permitindo resgate antecipado com rentabilidade proporcional", "se o CDB é prefixado, já que pós-fixados não permitem resgate"], "correta": 2, "explicacao": "CDBs podem ou não ter liquidez diária; muitos têm carência ou só permitem resgate no vencimento. Para reserva de emergência, a liquidez diária é essencial, de preferência em CDB pós-fixado ao CDI. O CDB não é isento de IR e não há prazo mínimo legal como o da LCI/LCA."}, {"id": "M2A-028", "modulo": 2, "topico": "2.1.1.1.3.1 CDB", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Um cliente com R$ 600.000,00 quer manter tudo em CDBs com cobertura integral do FGC e pergunta qual estratégia atende esse objetivo. A orientação correta é:", "alternativas": ["distribuir os recursos em, no mínimo, três instituições de conglomerados diferentes, com até R$ 250 mil (incluindo rendimentos) em cada, respeitando o teto global de R$ 1 milhão a cada 4 anos", "dividir em vários CDBs no mesmo banco, cada um com R$ 200 mil", "aplicar tudo em um só banco, pois o FGC cobre R$ 250 mil por produto contratado", "aplicar em duas instituições do mesmo conglomerado, com R$ 300 mil em cada"], "correta": 0, "explicacao": "O limite do FGC é de R$ 250 mil por CPF por instituição ou conglomerado, somando todos os produtos; dividir em vários CDBs no mesmo banco ou em bancos do mesmo conglomerado não multiplica a cobertura. Há ainda um teto global de R$ 1 milhão por CPF a cada período de 4 anos. Como o limite inclui rendimentos, convém deixar margem abaixo de R$ 250 mil por conglomerado."}, {"id": "M2A-029", "modulo": 2, "topico": "2.1.1.1.3.1 CDB", "dificuldade": "facil", "tipo": "mc", "enunciado": "Um CDB pós-fixado que paga 100% do CDI tem sua rentabilidade atrelada a:", "alternativas": ["variação do IPCA, mais uma taxa real", "taxa definida no momento da aplicação, sem variação", "variação da TR, mais 0,5% ao mês", "taxa média dos depósitos interfinanceiros de um dia, que acompanha de perto a Selic"], "correta": 3, "explicacao": "O CDI (taxa DI) é a taxa média das operações de um dia entre instituições financeiras e costuma ficar muito próxima da Selic. Um CDB a 100% do CDI acompanha essa taxa ao longo do tempo. IPCA + taxa caracteriza títulos híbridos; TR + 0,5% a.m. é a regra da poupança com Selic acima de 8,5%."}, {"id": "M2A-030", "modulo": 2, "topico": "2.1.1.1.3.1 CDB", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Um cliente aplicou em um CDB prefixado de 3 anos sem liquidez diária, e um ano depois precisa do dinheiro. O banco aceita recomprar o título antes do vencimento. É correto esperar que:", "alternativas": ["o banco seja obrigado a pagar o valor da curva contratada, sem deságio", "a recompra ocorra a preço de mercado, podendo resultar em valor inferior ao da curva contratada, além de IR pela alíquota do prazo efetivo", "o FGC cubra eventual perda decorrente da venda antecipada", "o resgate seja isento de IR, já que o vencimento não foi atingido"], "correta": 1, "explicacao": "Sem liquidez diária contratual, o resgate antecipado depende da disposição do emissor em recomprar e normalmente ocorre a preço de mercado, que pode ficar abaixo da curva. O IR segue a tabela regressiva pelo prazo efetivo da aplicação. O FGC cobre o risco de crédito do emissor, não perdas de mercado ou de liquidez."}, {"id": "M2A-031", "modulo": 2, "topico": "2.1.1.1.3.2 RDB e RDC", "dificuldade": "facil", "tipo": "mc", "enunciado": "A principal diferença entre o RDB e o CDB é que o RDB:", "alternativas": ["é emitido apenas por cooperativas de crédito", "não tem cobertura do FGC", "é intransferível e não pode ser negociado no mercado secundário", "é isento de IR para pessoa física"], "correta": 2, "explicacao": "O Recibo de Depósito Bancário é um título de captação a prazo intransferível, ou seja, não pode ser negociado com terceiros, e em geral não admite resgate antes do vencimento. Assim como o CDB, tem cobertura do FGC e é tributado pela tabela regressiva de IR."}, {"id": "M2A-032", "modulo": 2, "topico": "2.1.1.1.3.2 RDB e RDC", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um associado de uma cooperativa de crédito aplica em RDC (Recibo de Depósito Cooperativo). Quanto à garantia dessa aplicação, é correto afirmar que:", "alternativas": ["é garantida pelo FGC, o mesmo dos bancos, sem limite de valor", "não tem nenhuma garantia, por ser emitido por cooperativa", "é garantida pelo Tesouro Nacional, como os títulos públicos", "é garantida pelo FGCoop, fundo garantidor do sistema cooperativo, até R$ 250 mil por CPF por instituição"], "correta": 3, "explicacao": "O RDC é o título de captação emitido por cooperativas de crédito, equivalente ao RDB/CDB dos bancos. Sua garantia é dada pelo FGCoop (Fundo Garantidor do Cooperativismo de Crédito), com limite de R$ 250 mil por CPF por instituição. O FGC cobre instituições associadas a ele, como bancos."}, {"id": "M2A-033", "modulo": 2, "topico": "2.1.1.1.3.2 RDB e RDC", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente aplicou R$ 20.000,00 em um RDB de 2 anos e, no meio do prazo, quer vendê-lo a um amigo que ofereceu um bom preço. A pessoa profissional deve informar que:", "alternativas": ["a venda é permitida, desde que registrada na B3, como no CDB", "o RDB é intransferível, portanto não pode ser vendido a terceiros", "a venda é permitida, mas o comprador perde a cobertura do FGC", "a venda é permitida apenas após 6 meses da aplicação"], "correta": 1, "explicacao": "A característica que distingue o RDB do CDB é ser intransferível: não pode ser cedido ou negociado com terceiros. Por isso, oferece menos flexibilidade de liquidez que um CDB. O RDB continua coberto pelo FGC e tributado pela tabela regressiva."}, {"id": "M2A-034", "modulo": 2, "topico": "2.1.1.1.3.3 LCI", "dificuldade": "facil", "tipo": "mc", "enunciado": "Sobre a Letra de Crédito Imobiliário (LCI) adquirida por pessoa física, é correto afirmar que:", "alternativas": ["é isenta de IR, coberta pelo FGC e lastreada em créditos imobiliários", "é tributada pela tabela regressiva, mas isenta de IOF", "é emitida por securitizadoras e lastreada em recebíveis do agronegócio", "não tem cobertura do FGC por ser lastreada em imóveis"], "correta": 0, "explicacao": "A LCI é emitida por instituições financeiras e lastreada em créditos imobiliários. Para pessoas físicas, os rendimentos são isentos de IR, e o título tem cobertura do FGC até R$ 250 mil por CPF por instituição ou conglomerado. A isenção foi mantida em 2026, já que a MP 1.303/2025, que previa tributá-la, perdeu a validade."}, {"id": "M2A-035", "modulo": 2, "topico": "2.1.1.1.3.3 LCI", "dificuldade": "medio", "tipo": "mc", "enunciado": "Pelas regras do CMN vigentes em 2026, uma LCI sem atualização por índice de preços (por exemplo, atrelada ao CDI) deve ter prazo mínimo de vencimento de:", "alternativas": ["9 meses", "90 dias", "36 meses", "6 meses"], "correta": 3, "explicacao": "A Resolução CMN 5.215/2025 reduziu de 9 para 6 meses o prazo mínimo de LCI e LCA sem atualização por índice de preços. Para LCI atualizada mensalmente por índice de preços (como o IPCA), o prazo mínimo é de 36 meses. Os 90 dias eram a regra antiga, anterior às resoluções de 2024."}, {"id": "M2A-036", "modulo": 2, "topico": "2.1.1.1.3.3 LCI", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Uma cliente compara, para 1 ano (365 dias), uma LCI que paga 92% do CDI e um CDB que paga 110% do CDI, ambos do mesmo banco, com cobertura do FGC. Considerando apenas o IR, a escolha mais rentável é:", "alternativas": ["são equivalentes, pois a isenção compensa exatamente a diferença de taxa", "o CDB, pois rende líquido 93,5% do CDI (110% x 0,85)", "a LCI, pois o CDB rende líquido cerca de 90,75% do CDI (110% x 0,825)", "o CDB, pois 110% é maior que 92% em qualquer cenário"], "correta": 2, "explicacao": "Com 365 dias, o CDB cai na faixa de 17,5% de IR: 110% x (1 - 0,175) = 90,75% do CDI líquido, abaixo dos 92% da LCI isenta. Usar 15% seria um erro, pois essa alíquota só vale acima de 720 dias. A comparação entre produtos com e sem IR deve sempre ser feita em termos líquidos."}, {"id": "M2A-037", "modulo": 2, "topico": "2.1.1.1.3.3 LCI", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente aplicou em uma LCI pós-fixada com vencimento de 1 ano e, após 3 meses, pede o resgate. A resposta adequada é:", "alternativas": ["o resgate é permitido, mas com IR de 22,5% sobre o rendimento", "o resgate antes do prazo mínimo de vencimento regulamentar não é permitido, por isso a LCI não serve para reserva de emergência", "o resgate é permitido a qualquer momento, pois a LCI tem liquidez diária obrigatória", "o resgate é permitido, mas o FGC deixa de cobrir o valor resgatado"], "correta": 1, "explicacao": "As LCIs têm prazo mínimo de vencimento definido pelo CMN (6 meses sem atualização por índice de preços), período em que não há resgate antecipado. Por isso não são indicadas para reserva de emergência. Mesmo em resgates permitidos, a LCI segue isenta de IR para pessoa física."}, {"id": "M2A-038", "modulo": 2, "topico": "2.1.1.1.3.3 LCI", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Uma LCI isenta paga 85% do CDI para um prazo de 200 dias. Para que um CDB do mesmo prazo ofereça o mesmo retorno líquido para pessoa física, ele deveria pagar, aproximadamente:", "alternativas": ["106,25% do CDI", "100,00% do CDI", "102,00% do CDI", "109,68% do CDI"], "correta": 0, "explicacao": "Com 200 dias, a alíquota do CDB é de 20% (faixa de 181 a 360 dias). A taxa bruta equivalente é 85% / (1 - 0,20) = 106,25% do CDI. O valor 109,68% resultaria de usar 22,5%, alíquota que só vale até 180 dias; somar a alíquota ao percentual (102%) também é incorreto."}, {"id": "M2A-039", "modulo": 2, "topico": "2.1.1.1.3.3 LCI", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma empresa (pessoa jurídica tributada pelo lucro real) quer aplicar o caixa em LCI pensando na isenção de IR. A pessoa profissional deve esclarecer que:", "alternativas": ["a LCI é isenta para pessoa jurídica, mas tributada para pessoa física", "pessoas jurídicas não podem investir em LCI", "a isenção de IR da LCI é para pessoas físicas; para pessoa jurídica os rendimentos são tributados", "a isenção vale para qualquer investidor, pessoa física ou jurídica"], "correta": 2, "explicacao": "O benefício de isenção de IR em LCI, LCA, CRI, CRA e debêntures incentivadas é voltado à pessoa física. Para pessoa jurídica, os rendimentos são tributáveis. A empresa pode investir, mas deve comparar o retorno considerando a tributação."}, {"id": "M2A-040", "modulo": 2, "topico": "2.1.1.1.3.4 LCA", "dificuldade": "facil", "tipo": "mc", "enunciado": "Um produtor rural pergunta qual é o lastro da LCA que o banco oferece. A resposta correta é:", "alternativas": ["títulos públicos federais indexados ao IPCA", "direitos creditórios originados de negócios entre produtores rurais, cooperativas e agentes da cadeia do agronegócio, financiados pelo emissor", "contratos de financiamento imobiliário com alienação fiduciária", "ações de empresas do agronegócio listadas na B3"], "correta": 1, "explicacao": "A LCA é emitida por instituições financeiras e lastreada em direitos creditórios do agronegócio (financiamentos e créditos ligados à cadeia agropecuária). O lastro em créditos imobiliários é característica da LCI. A LCA é isenta de IR para pessoa física e coberta pelo FGC."}, {"id": "M2A-041", "modulo": 2, "topico": "2.1.1.1.3.4 LCA", "dificuldade": "medio", "tipo": "mc", "enunciado": "Em 2026, um banco oferece uma LCA atrelada ao IPCA (atualizada por índice de preços). Pela regulamentação do CMN, o prazo mínimo de vencimento desse título é de:", "alternativas": ["36 meses", "90 dias", "6 meses", "12 meses"], "correta": 3, "explicacao": "Pelas regras do CMN, LCA com atualização por índice de preços tem prazo mínimo de 12 meses; LCI atualizada mensalmente por índice de preços tem 36 meses. Para LCI e LCA sem atualização por índice de preços, o mínimo passou a ser de 6 meses com a Resolução CMN 5.215/2025."}, {"id": "M2A-042", "modulo": 2, "topico": "2.1.1.1.3.4 LCA", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Um cliente pretende manter recursos por 2 anos e 1 mês (mais de 720 dias). As opções são uma LCA a 90% do CDI e um CDB a 108% do CDI, de bancos com risco semelhante e com FGC. Considerando apenas o IR, a melhor opção é:", "alternativas": ["o CDB, pois rende líquido 91,8% do CDI (108% x 0,85)", "a LCA, pois o CDB rende líquido 83,7% do CDI", "são equivalentes no prazo de 2 anos", "a LCA, pois a isenção sempre supera um CDB abaixo de 110% do CDI"], "correta": 0, "explicacao": "Acima de 720 dias, a alíquota de IR do CDB é 15%: 108% x 0,85 = 91,8% do CDI líquido, superior aos 90% da LCA isenta. 83,7% resultaria de aplicar 22,5%, alíquota de prazos curtos. A vantagem da isenção diminui quanto maior o prazo, porque a alíquota do CDB cai."}, {"id": "M2A-043", "modulo": 2, "topico": "2.1.1.1.3.4 LCA", "dificuldade": "medio", "tipo": "mc", "enunciado": "Após as Resoluções do CMN de 2024 e 2025 sobre LCI e LCA, é correto afirmar que:", "alternativas": ["os títulos já emitidos antes das mudanças mantiveram suas condições originais; as novas regras de prazo e lastro valem para as novas emissões", "todos os títulos em carteira passaram a ser tributados pelo IR", "LCI e LCA passaram a ter liquidez diária obrigatória", "a cobertura do FGC para LCI e LCA foi extinta"], "correta": 0, "explicacao": "As mudanças do CMN (aumento e depois ajuste dos prazos mínimos, restrição de lastros elegíveis) aplicam-se às novas emissões; aplicações anteriores seguem nas condições contratadas. A isenção de IR para pessoa física e a cobertura do FGC foram mantidas."}, {"id": "M2A-044", "modulo": 2, "topico": "2.1.1.1.3.5 LCD", "dificuldade": "medio", "tipo": "mc", "enunciado": "A Letra de Crédito do Desenvolvimento (LCD), criada pela Lei 14.937/2024, tem como característica:", "alternativas": ["ser emitida pelo Tesouro Nacional e negociada no Tesouro Direto", "ser emitida por bancos de desenvolvimento, como o BNDES, para financiar projetos como infraestrutura, indústria e inovação, com isenção de IR para pessoa física residente", "ser emitida por securitizadoras e lastreada em recebíveis imobiliários", "ser tributada pela tabela regressiva de IR, como o CDB"], "correta": 1, "explicacao": "A LCD é um título de crédito emitido exclusivamente por bancos de desenvolvimento (como BNDES, BDMG, Bandes e BRDE) para financiar projetos de infraestrutura, indústria, inovação e empresas. A lei fixou alíquota zero de IR para rendimentos de pessoas físicas residentes no país."}, {"id": "M2A-045", "modulo": 2, "topico": "2.1.1.1.3.5 LCD", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Uma cliente com R$ 200.000,00 em LCI de um banco múltiplo pergunta se uma LCD do BNDES teria proteção equivalente. É correto informar que:", "alternativas": ["a LCD só é coberta pelo FGC se for adquirida por pessoa jurídica", "a LCD não tem cobertura do FGC, pois é emitida por banco público", "a LCD é garantida diretamente pelo Tesouro Nacional, sem limite", "o CMN incluiu a LCD na cobertura do FGC, com o mesmo limite de R$ 250 mil por CPF por instituição"], "correta": 3, "explicacao": "A Resolução CMN 5.169/2024 incluiu as LCDs entre os instrumentos garantidos pelo FGC, nas mesmas condições de LCI e LCA: até R$ 250 mil por CPF por instituição ou conglomerado. Como emissores diferentes, o limite da LCI no banco múltiplo e o da LCD no BNDES são contados separadamente, respeitado o teto global."}, {"id": "M2A-046", "modulo": 2, "topico": "2.1.1.1.3.5 LCD", "dificuldade": "facil", "tipo": "mc", "enunciado": "Entre os títulos bancários abaixo, qual é isento de IR para pessoa física residente no Brasil?", "alternativas": ["RDC", "CDB", "LCD", "RDB"], "correta": 2, "explicacao": "A LCD, assim como LCI e LCA, tem isenção (alíquota zero) de IR para pessoa física residente. CDB, RDB e RDC são tributados pela tabela regressiva de IR, de 22,5% a 15% conforme o prazo."}, {"id": "M2A-047", "modulo": 2, "topico": "2.1.1.1.4 Debêntures", "dificuldade": "facil", "tipo": "mc", "enunciado": "Um cliente pergunta o que está comprando ao adquirir uma debênture. A explicação correta é:", "alternativas": ["um depósito bancário coberto pelo FGC", "uma participação no capital da empresa, com direito a dividendos", "um título de dívida emitido por uma sociedade por ações, que confere ao investidor direito de crédito contra a empresa", "um título público emitido para financiar obras de infraestrutura"], "correta": 2, "explicacao": "Debêntures são valores mobiliários de renda fixa que representam dívida da companhia emissora: o investidor é credor, não sócio. Não têm cobertura do FGC, e o principal risco é o de crédito do emissor. Direito a dividendos é característica de ações."}, {"id": "M2A-048", "modulo": 2, "topico": "2.1.1.1.4 Debêntures", "dificuldade": "medio", "tipo": "mc", "enunciado": "Na emissão pública de debêntures, a função do agente fiduciário é:", "alternativas": ["representar a comunhão dos debenturistas e fiscalizar o cumprimento das obrigações da emissora previstas na escritura", "definir a nota de risco de crédito da emissão", "comprar as debêntures que não forem vendidas aos investidores", "garantir o pagamento das debêntures em caso de inadimplência da emissora"], "correta": 0, "explicacao": "O agente fiduciário representa os interesses dos debenturistas, acompanhando o cumprimento das obrigações e cláusulas da escritura de emissão e tomando providências em caso de inadimplemento. Ele não garante o pagamento; a nota de risco é atribuída por agências de rating."}, {"id": "M2A-049", "modulo": 2, "topico": "2.1.1.1.4 Debêntures", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma cliente com perfil moderado quer aplicar em debêntures comuns (não incentivadas) de uma empresa de varejo. A pessoa profissional deve destacar que:", "alternativas": ["não há marcação a mercado, pois debêntures não são negociadas", "não há cobertura do FGC, o rendimento é tributado pela tabela regressiva e a liquidez no mercado secundário pode ser baixa", "o risco de crédito é o mesmo de um título público federal", "a debênture é isenta de IR e coberta pelo FGC"], "correta": 1, "explicacao": "Debêntures comuns são tributadas pela tabela regressiva de IR, não contam com o FGC e expõem o investidor ao risco de crédito da emissora e ao risco de liquidez, já que o mercado secundário pode ser pouco ativo. Elas são negociadas e, portanto, sujeitas a marcação a mercado."}, {"id": "M2A-050", "modulo": 2, "topico": "2.1.1.1.4.1 Debênture de infraestrutura", "dificuldade": "facil", "tipo": "mc", "enunciado": "Uma pessoa física aplica em uma debênture incentivada (Lei 12.431/2011) emitida para financiar um projeto prioritário de infraestrutura. Em 2026, a tributação dos rendimentos para ela é:", "alternativas": ["5% de IR, conforme a nova regra de investimentos", "tabela regressiva de 22,5% a 15%", "15% de IR fixo, independentemente do prazo", "isenta de IR"], "correta": 3, "explicacao": "As debêntures incentivadas da Lei 12.431/2011 têm alíquota zero de IR para pessoas físicas residentes. A MP 1.303/2025 propunha tributar esses papéis em 5%, mas perdeu a validade em outubro de 2025 sem ser votada, e a isenção continua em 2026."}, {"id": "M2A-051", "modulo": 2, "topico": "2.1.1.1.4.1 Debênture de infraestrutura", "dificuldade": "dificil", "tipo": "mc", "enunciado": "A Lei 14.801/2024 criou as chamadas debêntures de infraestrutura, que convivem com as debêntures incentivadas da Lei 12.431/2011. A principal diferença para a pessoa física investidora é:", "alternativas": ["as duas são isentas de IR para pessoa física", "as debêntures de infraestrutura são cobertas pelo FGC, e as incentivadas não", "nas debêntures de infraestrutura o benefício fiscal é da empresa emissora, e o investidor pessoa física é tributado pela tabela regressiva; nas incentivadas, o investidor pessoa física é isento", "nas incentivadas o benefício é apenas da emissora, e o investidor paga 15% fixo"], "correta": 2, "explicacao": "Na debênture de infraestrutura da Lei 14.801/2024, o incentivo é voltado à emissora, que pode deduzir os juros pagos e excluir parte deles da base do IRPJ/CSLL; o investidor pessoa física é tributado normalmente pela tabela regressiva. Na debênture incentivada da Lei 12.431/2011, o benefício é do investidor pessoa física, isento de IR. Nenhuma das duas tem FGC."}, {"id": "M2A-052", "modulo": 2, "topico": "2.1.1.1.4.1 Debênture de infraestrutura", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente ouviu que debêntures incentivadas são seguras porque financiam obras de infraestrutura apoiadas pelo governo. A explicação adequada é:", "alternativas": ["a isenção fiscal não reduz o risco de crédito: o pagamento depende da capacidade financeira da emissora, e não há cobertura do FGC", "as debêntures incentivadas têm cobertura do FGC até R$ 250 mil", "o governo garante o pagamento das debêntures incentivadas", "o risco é nulo, pois os projetos são prioritários"], "correta": 0, "explicacao": "O enquadramento como projeto prioritário garante o benefício fiscal, mas não transfere o risco ao governo. O investidor continua exposto ao risco de crédito da emissora, ao risco de mercado (geralmente são papéis longos, muitas vezes atrelados ao IPCA) e ao risco de liquidez. Debêntures não têm FGC."}, {"id": "M2A-053", "modulo": 2, "topico": "2.1.1.1.4.2 Debêntures conversíveis e permutáveis", "dificuldade": "facil", "tipo": "mc", "enunciado": "Uma debênture que dá ao investidor a opção de, em condições predefinidas, transformar seu crédito em ações da própria companhia emissora é chamada de:", "alternativas": ["debênture subordinada", "debênture conversível", "debênture permutável", "debênture incentivada"], "correta": 1, "explicacao": "A debênture conversível pode ser transformada em ações da própria emissora, nas condições previstas na escritura. A permutável pode ser trocada por ações de outra companhia (geralmente detidas pela emissora). Incentivada refere-se ao benefício fiscal; subordinada, à espécie de garantia."}, {"id": "M2A-054", "modulo": 2, "topico": "2.1.1.1.4.2 Debêntures conversíveis e permutáveis", "dificuldade": "medio", "tipo": "mc", "enunciado": "A Holding X emite debêntures que, na data de conversão, podem ser trocadas por ações da Companhia Y, da qual a Holding X é acionista. Essas debêntures são classificadas como:", "alternativas": ["conversíveis", "perpétuas", "simples", "permutáveis"], "correta": 3, "explicacao": "Quando a troca é por ações de outra empresa que não a emissora, a debênture é permutável. Se a troca fosse por ações da própria Holding X, seria conversível. Debêntures simples não preveem nenhuma troca por ações."}, {"id": "M2A-055", "modulo": 2, "topico": "2.1.1.1.4.2 Debêntures conversíveis e permutáveis", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Ao comparar uma debênture conversível com uma debênture simples do mesmo emissor e prazo, uma pessoa investidora observa que a conversível paga taxa de juros menor. A explicação mais adequada é que:", "alternativas": ["a conversível é isenta de IR, o que compensa a taxa menor", "a conversível não tem risco de crédito, pois pode virar ação a qualquer momento", "a conversível tem cobertura do FGC, o que reduz seu risco", "a opção de conversão em ações tem valor para o investidor, que aceita juros menores em troca da possibilidade de ganho com a valorização das ações"], "correta": 3, "explicacao": "A debênture conversível combina um título de dívida com uma opção de conversão em ações. Essa opção tem valor: se as ações se valorizarem, o investidor pode converter e capturar o ganho. Por isso, costuma pagar juros menores. Ela não tem FGC, não é isenta por ser conversível, e a conversão segue as condições e datas da escritura."}, {"id": "M2A-056", "modulo": 2, "topico": "2.1.1.1.5 CRI", "dificuldade": "facil", "tipo": "mc", "enunciado": "Sobre o Certificado de Recebíveis Imobiliários (CRI), é correto afirmar que:", "alternativas": ["é emitido por companhias securitizadoras, lastreado em recebíveis imobiliários, isento de IR para pessoa física e sem cobertura do FGC", "é emitido pelo Tesouro Nacional para financiar habitação popular", "é tributado pela tabela regressiva para pessoa física e coberto pelo FGC", "é emitido por bancos, lastreado em créditos imobiliários e coberto pelo FGC"], "correta": 0, "explicacao": "O CRI é um título de securitização emitido por companhias securitizadoras, que transformam recebíveis imobiliários (como aluguéis e financiamentos) em títulos. É isento de IR para pessoa física, mas não tem FGC, pois a securitizadora não é instituição associada. O título bancário lastreado em crédito imobiliário e coberto pelo FGC é a LCI."}, {"id": "M2A-057", "modulo": 2, "topico": "2.1.1.1.5 CRI", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente quer escolher entre uma LCI e um CRI que pagam taxas parecidas, ambos isentos de IR para pessoa física. A diferença mais relevante quanto ao risco é que:", "alternativas": ["ambos têm cobertura do FGC até R$ 250 mil", "o CRI tem cobertura do FGC, e a LCI não", "a LCI tem cobertura do FGC e risco do banco emissor, enquanto o CRI não tem FGC e depende do pagamento dos recebíveis que o lastreiam", "o CRI tem risco menor, pois é garantido pelo imóvel do comprador"], "correta": 2, "explicacao": "A LCI é obrigação de uma instituição financeira e está coberta pelo FGC. No CRI, o investidor assume o risco de crédito dos devedores dos recebíveis (e da estrutura de securitização), sem FGC. Por isso, CRIs costumam pagar prêmios maiores para compensar o risco adicional."}, {"id": "M2A-058", "modulo": 2, "topico": "2.1.1.1.5 CRI", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Em uma emissão de CRI com regime fiduciário, a principal proteção para o investidor é que:", "alternativas": ["o FGC garante o pagamento caso a securitizadora quebre", "os créditos que lastreiam a emissão formam patrimônio separado, que não se confunde com o patrimônio da securitizadora e responde apenas pelos CRIs daquela emissão", "os investidores passam a ser sócios da securitizadora", "a CVM garante o pagamento do principal aos investidores"], "correta": 1, "explicacao": "No regime fiduciário, os recebíveis vinculados ao CRI ficam segregados em patrimônio separado, protegidos de credores da securitizadora; servem exclusivamente ao pagamento daquela emissão. Isso protege contra o risco da securitizadora, mas não elimina o risco de crédito dos devedores do lastro. Não há FGC nem garantia da CVM."}, {"id": "M2A-059", "modulo": 2, "topico": "2.1.1.1.6 CRA", "dificuldade": "facil", "tipo": "mc", "enunciado": "Um investidor pessoa física compra um Certificado de Recebíveis do Agronegócio (CRA). Quanto à tributação e à garantia, é correto afirmar que:", "alternativas": ["os rendimentos são isentos de IR e não há cobertura do FGC", "os rendimentos são tributados pela tabela regressiva e não há cobertura do FGC", "os rendimentos são tributados pela tabela regressiva e há cobertura do FGC", "os rendimentos são isentos de IR e há cobertura do FGC"], "correta": 0, "explicacao": "O CRA, assim como o CRI, é isento de IR para pessoa física, mas não conta com o FGC por ser emitido por securitizadora, e não por instituição financeira associada ao fundo. Isenção e FGC juntos caracterizam a LCA, que é título bancário."}, {"id": "M2A-060", "modulo": 2, "topico": "2.1.1.1.6 CRA", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma cliente comprou um CRA lastreado em recebíveis de uma grande trading de grãos. Meses depois, a trading entra em recuperação judicial. O impacto mais provável para a investidora é:", "alternativas": ["conversão automática do CRA em LCA do banco coordenador", "risco de atraso ou perda no recebimento, já que o pagamento do CRA depende dos recebíveis do lastro e não há FGC", "nenhum impacto, pois a securitizadora é obrigada a pagar com recursos próprios", "nenhum impacto, pois o FGC cobre até R$ 250 mil"], "correta": 1, "explicacao": "O CRA tem o risco de crédito dos devedores dos recebíveis que o lastreiam. Se o devedor entra em dificuldade, o fluxo de pagamentos pode ser afetado, a menos que existam garantias adicionais na estrutura. Não há FGC, e em regra a securitizadora não responde com patrimônio próprio quando há regime fiduciário."}, {"id": "M2A-061", "modulo": 2, "topico": "2.1.1.1.6 CRA", "dificuldade": "medio", "tipo": "mc", "enunciado": "Comparando a LCA e o CRA, assinale a afirmativa correta:", "alternativas": ["o CRA é tributado pela tabela regressiva, e a LCA é isenta", "ambos são emitidos por bancos e têm FGC", "a LCA é emitida por instituição financeira e tem FGC; o CRA é emitido por securitizadora e não tem FGC; ambos são isentos de IR para pessoa física", "a LCA é emitida por securitizadora e o CRA por banco"], "correta": 2, "explicacao": "Os dois são instrumentos ligados ao agronegócio e isentos de IR para pessoa física, mas com naturezas distintas: a LCA é título de captação bancária coberto pelo FGC; o CRA é título de securitização, sem FGC, cujo risco está nos recebíveis do lastro."}, {"id": "M2A-062", "modulo": 2, "topico": "2.1.1.1.7 Rating", "dificuldade": "facil", "tipo": "mc", "enunciado": "O rating atribuído por uma agência classificadora a uma emissão de debêntures expressa:", "alternativas": ["uma recomendação de compra do papel", "a expectativa de valorização das ações da emissora", "uma garantia de que a debênture será paga no vencimento", "uma opinião sobre a capacidade e a disposição do emissor de pagar a dívida em dia, ou seja, o risco de crédito"], "correta": 3, "explicacao": "O rating é uma opinião independente sobre o risco de crédito, isto é, a probabilidade de o emissor honrar suas obrigações. Não é garantia de pagamento nem recomendação de investimento, e não avalia a atratividade das ações da empresa."}, {"id": "M2A-063", "modulo": 2, "topico": "2.1.1.1.7 Rating", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma empresa tem uma debênture com rating rebaixado de AA para BB pelas agências de classificação. O efeito esperado no mercado secundário é:", "alternativas": ["alta do preço, pois o rating BB indica grau de investimento", "aumento da taxa exigida pelos investidores e queda do preço da debênture", "queda da taxa exigida e alta do preço da debênture", "nenhum efeito, pois a taxa da debênture é fixada na emissão"], "correta": 1, "explicacao": "O rebaixamento indica maior risco de crédito; os investidores passam a exigir maior prêmio (taxa), o que reduz o preço de mercado do título. BB está abaixo de BBB-, ou seja, em grau especulativo, o que pode ainda restringir sua compra por certos investidores."}, {"id": "M2A-064", "modulo": 2, "topico": "2.1.1.1.7 Rating", "dificuldade": "medio", "tipo": "mc", "enunciado": "Na escala de longo prazo usada por agências como S&P e Fitch, o grau de investimento corresponde às notas:", "alternativas": ["de AAA até BBB-", "de BBB+ até CCC", "de AAA até BB-", "de AAA até A-"], "correta": 0, "explicacao": "Na escala usual de longo prazo, as notas de AAA a BBB- formam o grau de investimento; de BB+ para baixo, grau especulativo. Quanto mais baixa a nota, maior o risco de crédito percebido e, em geral, maior a taxa exigida."}, {"id": "M2A-065", "modulo": 2, "topico": "2.1.1.1.7 Rating", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Um gerente apresenta a um cliente conservador um CRI com rating AAA dizendo: Com essa nota, o investimento é tão seguro quanto o Tesouro e ainda tem garantia do FGC. A avaliação correta da fala é:", "alternativas": ["inadequada apenas porque o rating AAA é o grau especulativo máximo", "adequada, pois o rating AAA garante o pagamento integral", "inadequada, pois rating alto indica baixo risco de crédito na opinião da agência, mas não elimina riscos, não equivale a garantia soberana e o CRI não tem FGC", "adequada quanto ao FGC, mas o rating não se aplica a CRI"], "correta": 2, "explicacao": "O rating é uma opinião sujeita a revisão e não garante pagamento. O CRI tem risco de crédito do lastro e não conta com o FGC; compará-lo ao Tesouro com garantia do FGC é informação enganosa. A pessoa profissional deve apresentar os riscos de forma clara e adequada ao perfil do cliente."}, {"id": "M2A-066", "modulo": 2, "topico": "2.1.1.1.8.1 Importância da poupança no SFH e garantias", "dificuldade": "facil", "tipo": "mc", "enunciado": "Qual é a principal importância da caderneta de poupança para o Sistema Financeiro da Habitação (SFH)?", "alternativas": ["a poupança é a única fonte de recursos do mercado de ações", "os recursos da poupança financiam exclusivamente o Tesouro Nacional", "a poupança financia o crédito rural obrigatório", "parte relevante dos recursos captados pela poupança deve ser direcionada ao financiamento imobiliário habitacional"], "correta": 3, "explicacao": "A regulamentação exige que as instituições direcionem parcela relevante dos depósitos de poupança para o crédito imobiliário, o que faz da poupança uma das principais fontes de funding do SFH. É por isso que ela tem regras próprias de remuneração e tributação."}, {"id": "M2A-067", "modulo": 2, "topico": "2.1.1.1.8.1 Importância da poupança no SFH e garantias", "dificuldade": "facil", "tipo": "mc", "enunciado": "Uma aposentada tem R$ 180.000,00 em poupança em um único banco e pergunta se o dinheiro está protegido caso o banco quebre. A resposta correta é:", "alternativas": ["sim, a poupança é garantida integralmente pelo Tesouro Nacional, sem limite", "sim, mas só até R$ 100 mil por CPF", "não, a poupança não tem nenhuma garantia", "sim, a poupança é coberta pelo FGC até R$ 250 mil por CPF por instituição ou conglomerado, incluindo rendimentos"], "correta": 3, "explicacao": "Os depósitos de poupança estão entre os créditos garantidos pelo FGC, até R$ 250 mil por CPF por instituição ou conglomerado, somando-se aos demais produtos cobertos que a cliente tenha no mesmo conglomerado. Não há garantia do Tesouro Nacional."}, {"id": "M2A-068", "modulo": 2, "topico": "2.1.1.1.8.1 Importância da poupança no SFH e garantias", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Um cliente tem, no mesmo banco, R$ 90.000,00 em poupança e R$ 200.000,00 em CDB. Em outro banco, de conglomerado diferente, tem R$ 150.000,00 em LCI. Em caso de quebra simultânea das duas instituições, o total garantido pelo FGC seria de:", "alternativas": ["R$ 340.000,00", "R$ 400.000,00", "R$ 500.000,00", "R$ 440.000,00"], "correta": 1, "explicacao": "No primeiro banco, poupança e CDB somam R$ 290 mil, mas o limite é R$ 250 mil por CPF por conglomerado. No segundo, os R$ 150 mil em LCI estão dentro do limite. Total: 250.000 + 150.000 = R$ 400.000, abaixo do teto global de R$ 1 milhão a cada 4 anos."}, {"id": "M2A-069", "modulo": 2, "topico": "2.1.1.1.8.2 Custos e tributação da poupança", "dificuldade": "facil", "tipo": "mc", "enunciado": "Sobre os custos e a tributação da caderneta de poupança para pessoa física, é correto afirmar que:", "alternativas": ["os rendimentos são tributados pela tabela regressiva de 22,5% a 15%", "os rendimentos sofrem IR de 15% retido na fonte", "os rendimentos são isentos de IR e não há taxa de administração", "há cobrança de taxa de administração de 0,5% ao mês"], "correta": 2, "explicacao": "Para pessoas físicas, os rendimentos da poupança são isentos de IR, e não há cobrança de taxa de administração ou de custódia. Os 0,5% ao mês são parte da remuneração (quando a Selic está acima de 8,5% a.a.), e não custo."}, {"id": "M2A-070", "modulo": 2, "topico": "2.1.1.1.8.2 Custos e tributação da poupança", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma empresa com fins lucrativos mantém recursos em conta poupança. Sobre os rendimentos, é correto afirmar que:", "alternativas": ["para pessoa jurídica com fins lucrativos, os rendimentos da poupança são tributados pelo IR", "são isentos de IR, como para pessoa física", "são isentos de IR e garantidos pelo Tesouro Nacional", "empresas não podem ter conta poupança"], "correta": 0, "explicacao": "A isenção de IR da poupança é benefício da pessoa física. Para pessoas jurídicas com fins lucrativos, os rendimentos da poupança são tributáveis. Empresas podem manter poupança, mas a comparação com outras aplicações deve considerar a tributação."}, {"id": "M2A-071", "modulo": 2, "topico": "2.1.1.1.8.2 Custos e tributação da poupança", "dificuldade": "medio", "tipo": "mc", "enunciado": "Com a Selic em 12% a.a., um cliente compara a poupança com um CDB de liquidez diária a 100% do CDI, por 1 ano. Supondo CDI de 12% a.a. e TR igual a zero, é correto afirmar que:", "alternativas": ["a poupança rende 12% a.a. isento, superando o CDB", "o CDB rende líquido cerca de 9,3% (12% x 0,775 por cerca de 1 ano e 1 mês, ou 9,9% com 17,5%), acima dos cerca de 6,17% a.a. da poupança", "os dois rendem igual, pois a poupança acompanha a Selic", "a poupança rende mais, pois é isenta e paga 70% da Selic"], "correta": 1, "explicacao": "Com Selic acima de 8,5% a.a., a poupança paga 0,5% ao mês + TR, cerca de 6,17% a.a. com TR zero. O CDB a 100% do CDI, com IR de 17,5% para 1 ano (361 a 720 dias), rende cerca de 12% x 0,825 = 9,9% líquido, bem acima da poupança. A regra de 70% da Selic só vale quando a meta Selic é igual ou inferior a 8,5%."}, {"id": "M2A-072", "modulo": 2, "topico": "2.1.1.1.8.3 Rentabilidade e riscos da poupança", "dificuldade": "facil", "tipo": "mc", "enunciado": "Para depósitos feitos a partir de 4 de maio de 2012, a remuneração da poupança, quando a meta da taxa Selic está acima de 8,5% a.a., é de:", "alternativas": ["70% da Selic + TR", "IPCA + 0,5% ao mês", "0,5% ao mês + TR", "100% do CDI"], "correta": 2, "explicacao": "Pela Lei 12.703/2012, se a meta Selic for superior a 8,5% a.a., a poupança rende 0,5% ao mês mais TR; se for igual ou inferior a 8,5% a.a., rende 70% da meta Selic, mensalizada, mais TR. A poupança não é indexada ao CDI nem ao IPCA."}, {"id": "M2A-073", "modulo": 2, "topico": "2.1.1.1.8.3 Rentabilidade e riscos da poupança", "dificuldade": "medio", "tipo": "mc", "enunciado": "Suponha que o Copom fixe a meta Selic em exatamente 8,5% a.a. Para depósitos de poupança feitos após maio de 2012, o rendimento anual (sem TR) passa a ser de:", "alternativas": ["8,5% a.a. (100% da Selic)", "6,17% a.a. (0,5% ao mês)", "4,25% a.a. (50% da Selic)", "5,95% a.a. (70% de 8,5%)"], "correta": 3, "explicacao": "A regra dos 70% da Selic vale quando a meta é igual ou inferior a 8,5% a.a. Assim, com Selic de 8,5%: 0,70 x 8,5% = 5,95% a.a., mais TR. A regra de 0,5% ao mês + TR só se aplica com Selic estritamente acima de 8,5%."}, {"id": "M2A-074", "modulo": 2, "topico": "2.1.1.1.8.3 Rentabilidade e riscos da poupança", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Um cliente tem dois depósitos de poupança: um feito em 2010 (poupança antiga) e outro em 2024. Num período em que a meta Selic está em 7% a.a., é correto afirmar que:", "alternativas": ["o depósito de 2010 rende 0,5% ao mês + TR, e o de 2024 rende 70% da Selic (4,9% a.a.) + TR", "o depósito de 2010 rende 70% da Selic, e o de 2024 rende 0,5% ao mês", "ambos rendem 0,5% ao mês + TR", "ambos rendem 70% da Selic + TR"], "correta": 0, "explicacao": "Depósitos feitos até 3 de maio de 2012 mantêm a regra antiga: 0,5% ao mês + TR, independentemente da Selic. Para depósitos a partir de 4 de maio de 2012, com Selic igual ou inferior a 8,5%, a remuneração é 70% da Selic + TR: 0,70 x 7% = 4,9% a.a. + TR."}, {"id": "M2A-075", "modulo": 2, "topico": "2.1.1.1.8.3 Rentabilidade e riscos da poupança", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente considera a poupança um investimento sem nenhum risco. A observação tecnicamente correta da pessoa profissional é:", "alternativas": ["a poupança pode ter rendimento negativo quando a TR é zero", "o risco de crédito é baixo e há FGC, mas existe risco de a remuneração ficar abaixo da inflação, reduzindo o poder de compra", "a poupança não tem cobertura do FGC, por isso tem risco de crédito elevado", "a poupança tem alto risco de mercado, pois é marcada a mercado diariamente"], "correta": 1, "explicacao": "A poupança tem baixo risco de crédito, cobertura do FGC e alta liquidez, mas sua remuneração pode ficar abaixo da inflação em alguns períodos, causando perda real. Não há marcação a mercado e o rendimento nominal não fica negativo com TR zero."}, {"id": "M2A-076", "modulo": 2, "topico": "2.1.1.1.8.4 Data de aniversário", "dificuldade": "facil", "tipo": "mc", "enunciado": "Uma cliente depositou R$ 5.000,00 na poupança no dia 10 de março. Quando o rendimento desse depósito será creditado pela primeira vez?", "alternativas": ["diariamente, a partir de 11 de março", "no último dia útil de março", "em 1º de abril, data padrão para todos os depósitos", "em 10 de abril, data de aniversário do depósito"], "correta": 3, "explicacao": "Na poupança, o rendimento é creditado mensalmente na data de aniversário, que é o mesmo dia do mês em que o depósito foi feito. Depósito em 10 de março rende pela primeira vez em 10 de abril. Não há crédito diário de rendimento."}, {"id": "M2A-077", "modulo": 2, "topico": "2.1.1.1.8.4 Data de aniversário", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente fez um depósito na poupança em 30 de janeiro. Qual será a data de aniversário desse depósito?", "alternativas": ["último dia útil de cada mês", "dia 30 de cada mês, e em fevereiro dia 28", "dia 1º de cada mês", "dia 28 de cada mês"], "correta": 2, "explicacao": "Depósitos feitos nos dias 29, 30 e 31 têm a data de aniversário fixada no dia 1º do mês seguinte, para evitar problemas em meses que não têm esses dias. Assim, o depósito de 30 de janeiro passa a aniversariar no dia 1º de cada mês."}, {"id": "M2A-078", "modulo": 2, "topico": "2.1.1.1.8.4 Data de aniversário", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente tem um depósito de poupança com aniversário no dia 15. No dia 14 de agosto, ele saca todo o valor. É correto afirmar que:", "alternativas": ["ele perde o rendimento do ciclo mensal que se completaria no dia 15, pois o valor sacado antes do aniversário não recebe remuneração proporcional", "ele recebe o rendimento normalmente, pois faltava apenas um dia", "ele recebe rendimento proporcional aos 30 dias corridos", "ele paga IOF sobre o rendimento do período"], "correta": 0, "explicacao": "Na poupança, o rendimento só é creditado na data de aniversário, sobre o saldo que permaneceu durante todo o período mensal. Saques antes do aniversário fazem o investidor perder o rendimento do ciclo em curso sobre o valor sacado. Por isso, é recomendável resgatar após a data de aniversário."}, {"id": "M2A-079", "modulo": 2, "topico": "2.1.1.1.9 TR", "dificuldade": "facil", "tipo": "mc", "enunciado": "A Taxa Referencial (TR) é utilizada principalmente para:", "alternativas": ["definir a meta de juros da política monetária", "compor a remuneração da poupança e corrigir saldos do FGTS e de alguns financiamentos imobiliários", "remunerar os títulos públicos LFT", "medir a inflação oficial do país"], "correta": 1, "explicacao": "A TR, calculada pelo Banco Central, compõe a remuneração da poupança (parcela básica), corrige o FGTS e é usada em contratos do SFH. A LFT é corrigida pela Selic, a inflação oficial é medida pelo IPCA e a meta de juros é a Selic definida pelo Copom."}, {"id": "M2A-080", "modulo": 2, "topico": "2.1.1.1.9 TR", "dificuldade": "medio", "tipo": "mc", "enunciado": "Em períodos de juros mais baixos, a TR frequentemente fica em zero. Para um depósito de poupança feito em 2023, com Selic de 7% a.a. e TR zero, o rendimento anual aproximado seria de:", "alternativas": ["4,9% a.a.", "7,0% a.a.", "zero, pois a TR é zero", "6,17% a.a."], "correta": 0, "explicacao": "Com Selic igual ou inferior a 8,5%, o depósito rende 70% da Selic mais TR: 0,70 x 7% = 4,9% a.a. + 0. TR zero não zera o rendimento, apenas elimina a parcela da TR. 6,17% a.a. corresponde a 0,5% ao mês, regra para Selic acima de 8,5%."}, {"id": "M2A-081", "modulo": 2, "topico": "2.1.1.1.9 TR", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Um mutuário com financiamento habitacional pelo SFH corrigido pela TR pergunta por que sua dívida quase não teve correção monetária em certos anos. A explicação correta é:", "alternativas": ["a TR acompanha o IPCA, que foi negativo nesses anos", "a TR é fixada pelo Copom em 0,5% ao mês", "a TR, calculada pelo Banco Central a partir de taxas de juros de mercado com aplicação de um redutor, ficou próxima de zero nesses períodos", "a correção pela TR só ocorre após a quitação de metade do contrato"], "correta": 2, "explicacao": "A TR é calculada pelo Banco Central com base em taxas de juros de mercado e um redutor; em cenários de juros mais baixos, o redutor faz a TR ficar próxima ou igual a zero. Ela não é um índice de inflação e não é fixada pelo Copom."}, {"id": "M2A-082", "modulo": 2, "topico": "2.1.1.1.10 TLP", "dificuldade": "medio", "tipo": "mc", "enunciado": "A Taxa de Longo Prazo (TLP), usada nos financiamentos do BNDES, é composta por:", "alternativas": ["taxa Selic mais spread fixo definido pelo Copom", "variação do IGP-M mais 0,5% ao mês", "TR mais 6% ao ano", "variação do IPCA mais uma parcela de juro real prefixada com base nas taxas de mercado da NTN-B de 5 anos"], "correta": 3, "explicacao": "A TLP, que substituiu a TJLP em 2018 nos novos contratos do BNDES, é formada pelo IPCA mais uma taxa real fixa, definida a partir das taxas de mercado da NTN-B (Tesouro IPCA+) de 5 anos. Assim, aproxima o custo dos empréstimos subsidiados do custo de financiamento do Tesouro."}, {"id": "M2A-083", "modulo": 2, "topico": "2.1.1.1.10 TLP", "dificuldade": "facil", "tipo": "mc", "enunciado": "A TLP foi criada para substituir qual taxa nos novos financiamentos concedidos pelo BNDES?", "alternativas": ["Selic (taxa básica de juros)", "TJLP (Taxa de Juros de Longo Prazo)", "CDI (taxa de depósitos interfinanceiros)", "TR (Taxa Referencial)"], "correta": 1, "explicacao": "A TLP passou a valer em 2018, substituindo a TJLP nos novos contratos do BNDES. Diferentemente da TJLP, definida administrativamente, a TLP segue taxas de mercado (IPCA mais juro real da NTN-B de 5 anos), reduzindo subsídios implícitos."}, {"id": "M2A-084", "modulo": 2, "topico": "2.1.1.1.10 TLP", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Uma empresa contrata financiamento do BNDES em TLP. Se, após a contratação, as taxas reais de mercado da NTN-B de 5 anos subirem bastante, o efeito sobre esse contrato já firmado é que:", "alternativas": ["a parcela de juro real fixada na contratação permanece a mesma; o saldo continua sendo corrigido pelo IPCA", "o contrato deixa de ter correção monetária", "a parcela de juro real é recalculada mensalmente pela nova taxa da NTN-B", "o contrato passa a ser corrigido pela Selic"], "correta": 0, "explicacao": "Na TLP, a parcela de juro real é definida no momento da contratação e fica fixa durante o contrato, enquanto o saldo é atualizado pela inflação (IPCA). Variações posteriores da NTN-B afetam apenas novos contratos."}, {"id": "M2A-085", "modulo": 2, "topico": "2.1.1.1.11 Tributação de aplicações de renda fixa", "dificuldade": "facil", "tipo": "mc", "enunciado": "Pela tabela regressiva de IR vigente em 2026 para aplicações de renda fixa, a alíquota para resgate com 500 dias de aplicação é de:", "alternativas": ["22,5%", "15%", "17,5%", "20%"], "correta": 2, "explicacao": "A tabela regressiva é: até 180 dias, 22,5%; de 181 a 360 dias, 20%; de 361 a 720 dias, 17,5%; acima de 720 dias, 15%. Com 500 dias, aplica-se 17,5%. A MP 1.303/2025, que criaria alíquota única de 17,5%, perdeu a validade, e a tabela regressiva segue vigente."}, {"id": "M2A-086", "modulo": 2, "topico": "2.1.1.1.11 Tributação de aplicações de renda fixa", "dificuldade": "medio", "tipo": "mc", "enunciado": "Quem é o responsável por reter e recolher o IR sobre o rendimento de um CDB resgatado por pessoa física?", "alternativas": ["o próprio investidor, por meio de DARF mensal", "a B3, no último dia útil do ano", "a Receita Federal, na declaração anual de ajuste, sem retenção prévia", "a instituição financeira (fonte pagadora), no momento do resgate ou vencimento"], "correta": 3, "explicacao": "Na renda fixa, o IR é retido na fonte pela instituição pagadora no resgate, vencimento ou pagamento de juros, e a tributação é exclusiva e definitiva. O investidor apenas informa os valores na declaração anual, sem novo cálculo de imposto."}, {"id": "M2A-087", "modulo": 2, "topico": "2.1.1.1.11 Tributação de aplicações de renda fixa", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma pessoa física tem os seguintes investimentos: CDB, LCA, Tesouro IPCA+, CRI, poupança e debênture incentivada. Quais são isentos de IR?", "alternativas": ["LCA, poupança e Tesouro IPCA+", "apenas poupança e LCA", "CDB, LCA e CRI", "LCA, CRI, poupança e debênture incentivada"], "correta": 3, "explicacao": "Para pesso
