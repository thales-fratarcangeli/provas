íquotas maiores e o recurso deixa de cumprir o objetivo. Por isso é importante ter uma reserva de emergência separada.", "Pode resgatar quando quiser, sem nenhum impacto tributário.", "Não é possível resgatar nada antes da aposentadoria.", "Se resgatar antes, você perde todo o valor aportado."], "correta": 0, "explicacao": "Gerenciar expectativas inclui explicar que a previdência permite resgates, mas com custo tributário maior no curto prazo na tabela regressiva. Separar a reserva de emergência evita resgates prematuros."}, {"fala_cliente": "Vi que esse plano cobra taxa de carregamento e de administração. Isso importa?", "alternativas": ["Ao fazer portabilidade, você paga IR sobre todo o saldo transferido.", "Importa muito no longo prazo: taxas mais altas reduzem o valor acumulado ao longo dos anos. Vale comparar planos e verificar o fundo em que o plano investe. E você pode fazer portabilidade para outro plano do mesmo tipo sem incidência de IR.", "Não importa; o benefício fiscal compensa qualquer taxa.", "Taxas de previdência são definidas por lei e iguais em todos os bancos."], "correta": 1, "explicacao": "Custos se acumulam ao longo de décadas e afetam fortemente o resultado. A portabilidade entre planos do mesmo tipo não gera tributação e é ferramenta para buscar melhores condições."}, {"fala_cliente": "E se um dia eu passar a fazer a declaração completa?", "alternativas": ["Mesmo no modelo completo, o PGBL só deduz 6% da renda.", "Aí o VGBL vira PGBL automaticamente, sem nenhuma regra.", "Aí o PGBL pode passar a fazer sentido, para deduzir até 12% da renda bruta tributável, desde que você continue contribuindo para a previdência oficial. Podemos revisar isso sempre que sua situação fiscal mudar.", "No modelo completo, o PGBL deduz 12% mesmo de quem não contribui para o INSS."], "correta": 2, "explicacao": "O monitoramento contínuo inclui revisar a estratégia quando a situação tributária muda. A dedução de até 12% exige modelo completo e contribuição ao regime oficial de previdência."}, {"fala_cliente": "Fechado, vamos de VGBL na tabela regressiva.", "alternativas": ["Feito. Coloquei também um PGBL extra, para garantir o benefício fiscal.", "Perfeito, a rentabilidade está garantida até a sua aposentadoria.", "Ótimo, não precisa acompanhar; previdência se resolve sozinha.", "Combinado. Antes, vou confirmar que o plano está adequado ao seu perfil de investidor e te enviar o regulamento e as informações sobre taxas e riscos do fundo. Também registro nossa conversa para revisarmos o plano periodicamente."], "correta": 3, "explicacao": "A formalização inclui verificação de adequação, entrega de documentos e registro. Prometer rentabilidade e contratar produto não solicitado são condutas vedadas."}], "questoes_finais": [{"id": "AD-10-Q1", "modulo": 3, "topico": "3.1.6.3 Modelo completo x desconto simplificado", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Se Fábio passasse a declarar pelo modelo completo, com renda bruta tributável anual de R$ 120.000 e contribuição ao INSS, o valor máximo de contribuições ao PGBL dedutível no ano seria:", "alternativas": ["R$ 14.400", "R$ 18.000", "R$ 120.000", "R$ 12.000"], "correta": 0, "explicacao": "A dedução do PGBL é limitada a 12% da renda bruta tributável no modelo completo: 12% x R$ 120.000 = R$ 14.400. Aportes acima desse valor são permitidos, mas não reduzem a base de cálculo do imposto."}, {"id": "AD-10-Q2", "modulo": 3, "topico": "2 Produtos — Previdência complementar: tributação (aplicado ao atendimento)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente com PGBL na tabela regressiva resgata recursos aportados há três anos. A tributação será:", "alternativas": ["35% sobre o valor total resgatado.", "15% apenas sobre os rendimentos.", "30% sobre o valor total resgatado.", "30% apenas sobre os rendimentos."], "correta": 2, "explicacao": "Na regressiva, a alíquota é de 35% até 2 anos e de 30% de 2 a 4 anos, chegando a 10% acima de 10 anos. No PGBL, a base é o valor total resgatado; tributar só os rendimentos é regra do VGBL."}]}, {"id": "AD-11", "modulo": 3, "tipo": "arvore", "topico": "3.4.3.1.5 Gerenciamento de expectativas / 3.4.3.1.1 Escuta ativa", "dificuldade": "medio", "titulo": "Reclamação de perda em multimercado", "contexto": "Cristina, 55 anos, perfil moderado, aplicou R$ 100 mil em um fundo multimercado há oito meses, por recomendação do gerente anterior, com o objetivo de reformar a casa no ano seguinte. O fundo acumula queda de 6% e ela procura Rafael, seu novo gerente, muito irritada.", "etapas": [{"fala_cliente": "Rafael, estou indignada! Meu fundo multimercado está negativo em 6%. O gerente anterior disse que era seguro!", "alternativas": ["Isso foi com o gerente anterior; não tenho responsabilidade sobre essa recomendação.", "Sinto muito pela preocupação, dona Cristina. Quero entender bem o que aconteceu. A senhora pode me contar o que foi explicado na época sobre o fundo e qual era seu objetivo com essa aplicação?", "Calma, isso é normal; o mercado oscila e a senhora precisa ter paciência.", "A senhora assinou os documentos, então concordou com os riscos."], "correta": 1, "explicacao": "Diante de uma reclamação, a escuta ativa e o acolhimento vêm primeiro. Minimizar a queixa, transferir a responsabilidade ou se apoiar só na assinatura de documentos aumenta o conflito e não resolve o problema."}, {"fala_cliente": "Ele disse que era um fundo com rentabilidade acima do CDI e quase sem risco. Meu objetivo era ter o dinheiro para reformar a casa no ano que vem.", "alternativas": ["Obrigado por explicar. Fundos multimercados podem investir em várias classes de ativos e usar derivativos, por isso estão sujeitos a oscilações e não garantem rentabilidade. Vou verificar seu perfil, a documentação e se o fundo era adequado ao seu objetivo de curto prazo.", "Ele exagerou, mas todo gerente fala isso para vender.", "Ele não estava errado; multimercado é praticamente renda fixa.", "Então a senhora deveria ter lido o regulamento antes de aplicar."], "correta": 0, "explicacao": "A comunicação deve ser verdadeira sobre o produto e o compromisso de analisar o caso deve ser concreto. Reforçar a informação errada, generalizar a conduta dos colegas ou culpar a cliente são posturas inadequadas."}, {"fala_cliente": "E agora, eu resgato tudo e assumo o prejuízo?", "alternativas": ["Não resgate de jeito nenhum; o fundo com certeza vai se recuperar em poucos meses.", "Antes de decidir, vamos olhar os fatos: a estratégia do fundo, o histórico, o prazo de resgate e quando a senhora vai precisar do dinheiro. Como a reforma é no ano que vem, pode fazer sentido migrar parte para algo de menor volatilidade. A decisão final é sua.", "Resgate tudo hoje, porque o fundo vai continuar caindo.", "Resgate tudo e coloque em ações, que podem recuperar a perda mais rápido."], "correta": 1, "explicacao": "A orientação deve se basear em fatos e no horizonte da cliente, sem prever o comportamento do mercado. Afirmar recuperação ou queda futura é especulação, e trocar por ativo mais arriscado agrava a inadequação."}, {"fala_cliente": "Mas o fundo rendeu 18% no ano anterior! Por isso aplicamos.", "alternativas": ["Então é questão de tempo; se rendeu 18%, vai voltar a render isso.", "Os 18% eram líquidos de impostos e garantidos pelo fundo.", "Rentabilidade passada não é garantia de rentabilidade futura. É uma informação útil, mas precisa ser analisada junto com a volatilidade, a estratégia, os riscos e o seu prazo.", "O fundo provavelmente mudou de gestor; vou pedir que devolvam a diferença."], "correta": 2, "explicacao": "Rentabilidade passada não assegura resultados futuros, alerta obrigatório na divulgação de fundos. Gerenciar expectativas é mostrar que a decisão deve considerar risco e horizonte, não apenas o retorno histórico."}, {"fala_cliente": "Quero registrar uma reclamação formal.", "alternativas": ["Pode registrar, mas isso vai prejudicar seu relacionamento com o banco.", "Reclamação só pode ser feita diretamente na CVM, não aqui no banco.", "Não precisa; reclamação formal só atrasa a solução.", "É um direito seu, e vou ajudar. Registro sua reclamação no nosso canal de atendimento e informo o protocolo. Se a resposta não for satisfatória, a senhora pode recorrer à Ouvidoria do banco e também aos órgãos reguladores."], "correta": 3, "explicacao": "Facilitar o registro da reclamação é dever de transparência e boa-fé. A Ouvidoria é instância de segundo nível, após o atendimento primário. Desencorajar ou intimidar a cliente é conduta antiética."}, {"fala_cliente": "E ainda tem imposto sobre esse fundo, mesmo no prejuízo?", "alternativas": ["Se a senhora resgatar com prejuízo, não há IR sobre ganho, e o prejuízo pode ser compensado em ganhos futuros, conforme as regras. Já o come-cotas, em maio e novembro, só incide quando há rendimento no período.", "Não há IR em multimercado; esses fundos são isentos.", "Sim, o IR é cobrado sobre o valor aplicado, mesmo com prejuízo.", "O come-cotas cobra imposto mesmo quando o fundo dá prejuízo."], "correta": 0, "explicacao": "O IR em fundos incide sobre rendimentos positivos; não há imposto sobre perdas. Multimercados não são isentos, e o come-cotas incide semestralmente sobre os rendimentos apurados."}, {"fala_cliente": "Tá. Quero entender melhor antes de decidir o que fazer.", "alternativas": ["Para compensar, ofereço um CDB com taxa especial se a senhora ficar no banco.", "Vou deixar como está e, se cair mais, eu te aviso.", "Decida até amanhã, porque o mercado não espera.", "Vou preparar uma comparação por escrito com as opções, incluindo riscos, liquidez, custos e tributação, e marcamos uma reunião nesta semana. A partir de agora, faremos revisões periódicas para que a carteira acompanhe seus objetivos."], "correta": 3, "explicacao": "Documentar alternativas, respeitar o tempo da cliente e estabelecer monitoramento contínuo reconstroem a confiança. Usar benefício para evitar a saída da cliente não resolve a inadequação."}], "questoes_finais": [{"id": "AD-11-Q1", "modulo": 3, "topico": "3.4.2.5 Adequação dos produtos ao objetivo da clientela", "dificuldade": "medio", "tipo": "mc", "enunciado": "Analisando a recomendação feita a Cristina pelo gerente anterior, o principal problema foi:", "alternativas": ["Recomendar um fundo em vez de ações, que teriam rendido mais no período.", "Não alinhar o produto ao horizonte de curto prazo da cliente e criar expectativa de baixo risco incompatível com a natureza do fundo multimercado.", "Não ter garantido à cliente uma rentabilidade mínima por contrato.", "Ter recomendado um produto da própria instituição, o que é proibido."], "correta": 1, "explicacao": "A adequação considera perfil e objetivo, incluindo o prazo. Um multimercado pode oscilar no curto prazo e não deveria ser apresentado como 'quase sem risco'. Garantir rentabilidade seria vedado, e oferecer produtos da casa não é proibido, desde que adequados."}, {"id": "AD-11-Q2", "modulo": 3, "topico": "2 Produtos — Fundos multimercados (aplicado ao atendimento)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Sobre os fundos multimercados, como o de Cristina, é correto afirmar:", "alternativas": ["Têm rentabilidade mínima igual ao CDI, por serem classificados como renda fixa.", "São cobertos pelo FGC até R$ 250 mil por CPF.", "Podem combinar diferentes fatores de risco, como juros, câmbio e ações, e usar derivativos, sem garantia de rentabilidade nem cobertura do FGC.", "Não podem utilizar derivativos, para limitar o risco das pessoas cotistas."], "correta": 2, "explicacao": "Multimercados têm política de investimento flexível, com vários fatores de risco e possibilidade de derivativos. Fundos não têm garantia do FGC e nenhum fundo garante rentabilidade."}]}, {"id": "AD-12", "modulo": 3, "tipo": "arvore", "topico": "3.4.3.1.5 Gerenciamento de expectativas / 3.4.2.7 Comunicação clara e transparente", "dificuldade": "medio", "titulo": "Cliente exige rentabilidade garantida", "contexto": "Osvaldo, 60 anos, empresário, perfil moderado, tem R$ 500 mil para aplicar. Um conhecido lhe contou que recebe '1% ao mês garantido' de uma empresa que investe em criptomoedas. Ele procura Beatriz, sua gerente, querendo algo semelhante.", "etapas": [{"fala_cliente": "Beatriz, quero aplicar R$ 500 mil num produto que me garanta 1% ao mês. Um conhecido conseguiu isso em outro lugar.", "alternativas": ["Entendo, seu Osvaldo. Vamos conversar sobre o que é possível. Antes, posso entender seu objetivo, o prazo e quanto de oscilação o senhor tolera? Também quero entender melhor essa oferta que seu conhecido recebeu.", "Garanto 1% ao mês se o senhor aplicar tudo hoje.", "Se outro lugar oferece, pode ir para lá; não consigo competir.", "Consigo, sim; temos um fundo que vem entregando isso todo mês."], "correta": 0, "explicacao": "A escuta ativa permite entender objetivos e também avaliar a oferta citada. Prometer rentabilidade, inclusive com base em histórico, é vedado, e desistir do cliente deixa de protegê-lo de um possível golpe."}, {"fala_cliente": "Ele disse que é uma empresa que paga 1% fixo, garantido, sem risco nenhum, investindo em criptomoedas.", "alternativas": ["Se ele está recebendo todo mês, então é seguro.", "Não posso opinar sobre outras instituições.", "Promessas de retorno alto, fixo e sem risco são sinal de alerta de possíveis fraudes, como pirâmides financeiras. Vale verificar se a empresa tem autorização da CVM ou do Banco Central. Nenhum investimento legítimo combina retorno elevado com risco zero.", "Pode ser uma boa; cripto rende muito mesmo."], "correta": 2, "explicacao": "Retorno e risco andam juntos; retorno alto 'garantido' é característica de esquemas fraudulentos, que pagam os antigos com recursos dos novos. Alertar o cliente é dever de cuidado, e receber pagamentos por um tempo não comprova a solidez do esquema."}, {"fala_cliente": "Então, o que vocês têm que é garantido?", "alternativas": ["Nenhum produto tem taxa definida; tudo depende do mercado.", "Alguns produtos têm rentabilidade definida na aplicação, como CDB prefixado ou título público prefixado, se mantidos até o vencimento. Ainda assim há riscos: no CDB, o de crédito do banco, com FGC até R$ 250 mil; nos títulos, a oscilação de preço se vender antes.", "Nossos fundos de renda fixa têm rentabilidade garantida pelo banco.", "Tudo o que é renda fixa é garantido e sem risco."], "correta": 1, "explicacao": "Taxa contratada não é sinônimo de ausência de risco: há risco de crédito e de mercado. Renda fixa não significa retorno garantido, e fundos não podem garantir rentabilidade."}, {"fala_cliente": "Se eu comprar um Tesouro Prefixado e precisar vender antes, eu perco?", "alternativas": ["Sempre perde, porque título público não pode ser vendido antes.", "Não, o Tesouro sempre recompra pelo valor aplicado mais os juros.", "Se os juros subirem, o preço do título também sobe.", "Pode perder ou ganhar. Se as taxas de juros de mercado subirem, o preço do título cai, e a venda antecipada pode gerar perda; se caírem, pode haver ganho. Isso é a marcação a mercado. Mantido até o vencimento, ele paga a taxa contratada."], "correta": 3, "explicacao": "O preço de títulos prefixados varia inversamente às taxas de juros. A venda antecipada ocorre a preço de mercado, com possibilidade de ganho ou perda. Só no vencimento a taxa contratada é assegurada (risco de crédito soberano)."}, {"fala_cliente": "E se eu dividir os R$ 500 mil em CDBs de dois bancos diferentes?", "alternativas": ["Não precisa; o FGC cobre até R$ 1 milhão por instituição.", "Divida em vários CDBs do mesmo banco; cada aplicação tem garantia própria de R$ 250 mil.", "O FGC não cobre CDB, só a poupança.", "É uma boa forma de usar a garantia do FGC, que é de até R$ 250 mil por CPF por instituição ou conglomerado, com teto global de R$ 1 milhão a cada quatro anos. Mas confira se os bancos não pertencem ao mesmo conglomerado e lembre que o limite inclui os rendimentos."], "correta": 3, "explicacao": "O limite do FGC é por CPF e por conglomerado financeiro, e não por aplicação. Com R$ 500 mil, dividir entre conglomerados distintos permite proteção integral do principal, desde que os rendimentos não ultrapassem o limite em cada um."}, {"fala_cliente": "Tá, mas 1% ao mês você não consegue para mim?", "alternativas": ["Não posso prometer rentabilidade, seu Osvaldo. O que posso fazer é montar uma proposta compatível com seu perfil e objetivo, com cenários realistas, riscos e o retorno líquido de impostos de cada alternativa.", "Consigo 1% se o senhor assinar um termo abrindo mão da garantia.", "Para o senhor, que é cliente antigo, eu garanto pessoalmente.", "Consigo, se o senhor concentrar tudo em ações de alto risco."], "correta": 0, "explicacao": "Os princípios éticos vedam prometer resultados. Gerenciar expectativas é substituir a promessa por cenários e informações reais. Elevar o risco para alcançar uma meta arbitrária desrespeita o perfil do cliente."}, {"fala_cliente": "Fechado. Me mande a proposta.", "alternativas": ["Mando, mas já vou aplicando para o senhor não perder a taxa.", "Envio hoje, com as características de cada produto, riscos, liquidez, custos e tributação, além dos documentos oficiais. Depois agendamos uma conversa para tirar dúvidas antes de qualquer aplicação.", "Mando só a tabela de taxas; o resto é detalhe.", "Mando, destacando que a rentabilidade passada vai se repetir."], "correta": 1, "explicacao": "A proposta completa e a decisão sem pressa garantem uma escolha consciente. Aplicar sem autorização, omitir riscos ou sugerir repetição da rentabilidade passada ferem a transparência."}], "questoes_finais": [{"id": "AD-12-Q1", "modulo": 3, "topico": "3.3.3 Avaliação de risco e retorno", "dificuldade": "medio", "tipo": "mc", "enunciado": "Osvaldo aplicou R$ 200 mil em um CDB prefixado de um banco e pretende mantê-lo até o vencimento. O principal risco que permanece nessa aplicação é:", "alternativas": ["O risco de mercado, pois o valor recebido no vencimento varia com a taxa Selic.", "Nenhum risco, já que a taxa foi definida no momento da aplicação.", "O risco de crédito do banco emissor, mitigado pela cobertura do FGC até R$ 250 mil por CPF por instituição ou conglomerado.", "O risco cambial, pois CDB prefixado é atrelado ao dólar."], "correta": 2, "explicacao": "Mantido até o vencimento, o CDB prefixado paga a taxa contratada, sem efeito da variação de juros. O risco remanescente é o de crédito do emissor, que, nesse valor, está coberto pelo FGC. Taxa definida não significa risco zero."}, {"id": "AD-12-Q2", "modulo": 3, "topico": "3.4.3.2 Ética e responsabilidade no atendimento", "dificuldade": "facil", "tipo": "mc", "enunciado": "Na oferta recebida pelo conhecido de Osvaldo, o principal indício de possível fraude financeira é:", "alternativas": ["O pagamento mensal de rendimentos, que nenhum investimento legítimo oferece.", "Retorno elevado prometido como fixo e sem risco, por empresa cuja autorização perante os reguladores não foi verificada.", "A aplicação em criptoativos, que são proibidos no Brasil.", "O fato de a empresa não ser um banco, o que impede qualquer investimento."], "correta": 1, "explicacao": "Esquemas de pirâmide costumam prometer altos retornos fixos e sem risco e não têm autorização dos reguladores. Criptoativos não são proibidos, há investimentos legítimos que pagam rendimentos periódicos e outras instituições autorizadas podem distribuir investimentos."}]}, {"id": "M4-001", "modulo": 4, "topico": "4.1.1 Conceitos de ESG (Environment, Social e Governance)", "dificuldade": "facil", "tipo": "mc", "enunciado": "Uma cliente lê no material de uma gestora que ela adota “critérios ESG” na seleção de ativos e pergunta à pessoa profissional o que isso significa. A explicação mais adequada é que a gestora:", "alternativas": ["investe apenas em empresas que doam parte do lucro a organizações sociais e ambientais", "aplica exclusivamente em títulos públicos, que por definição têm baixo impacto ambiental", "considera, além dos dados financeiros tradicionais, fatores ambientais, sociais e de governança que podem afetar o risco e o retorno das empresas investidas", "garante ao investidor rentabilidade superior à de fundos que não adotam esses critérios"], "correta": 2, "explicacao": "ESG é a sigla em inglês para Environmental, Social and Governance (ASG em português) e designa a consideração de fatores ambientais, sociais e de governança na análise de investimentos, ao lado dos indicadores financeiros. Não se confunde com filantropia nem garante desempenho superior: trata-se de identificar riscos e oportunidades que podem afetar o valor das empresas no longo prazo."}, {"id": "M4-002", "modulo": 4, "topico": "4.1.2 Aspectos ambientais", "dificuldade": "facil", "tipo": "mc", "enunciado": "Um analista está avaliando uma mineradora sob a ótica ESG. Qual dos itens abaixo corresponde ao pilar ambiental (E) da análise?", "alternativas": ["A segurança das barragens de rejeitos e o controle de emissões e de consumo de água", "A política de remuneração variável da diretoria executiva", "A proporção de membros independentes no conselho de administração", "Os programas de saúde e segurança dos trabalhadores das minas"], "correta": 0, "explicacao": "O pilar ambiental trata da relação da empresa com o meio ambiente: emissões de gases de efeito estufa, uso de recursos naturais como água, gestão de resíduos e rejeitos, biodiversidade e riscos de acidentes ambientais. Conselho independente e remuneração de executivos são temas de governança; saúde e segurança dos trabalhadores é tema social."}, {"id": "M4-003", "modulo": 4, "topico": "4.1.3 Aspectos sociais", "dificuldade": "facil", "tipo": "mc", "enunciado": "Uma rede varejista de vestuário foi citada em reportagem por comprar de oficinas terceirizadas que mantinham trabalhadores em condições degradantes. Para uma gestora que analisa a empresa sob critérios ESG, esse fato representa principalmente um risco:", "alternativas": ["ambiental, ligado ao consumo de recursos naturais na produção de tecidos", "de mercado, ligado apenas à oscilação do preço das ações na bolsa", "de governança, ligado exclusivamente à composição do comitê de auditoria", "social, ligado às condições de trabalho e aos direitos humanos na cadeia de fornecedores"], "correta": 3, "explicacao": "O pilar social abrange a relação da empresa com pessoas: empregados, fornecedores, clientes e comunidades, incluindo condições de trabalho, direitos humanos e diversidade. Problemas na cadeia de fornecedores podem gerar multas, boicotes e perda de reputação, afetando o valor da empresa, por isso são relevantes para o investidor."}, {"id": "M4-004", "modulo": 4, "topico": "4.1.4 Aspectos de governança corporativa", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um investidor minoritário avalia comprar ações de uma companhia controlada por uma família. Ele descobre que a empresa realiza frequentes contratos com outras empresas do controlador sem aprovação de membros independentes e que o conselho é formado só por pessoas ligadas à família. Sob a ótica ESG, essas informações indicam fragilidade em qual pilar?", "alternativas": ["Governança, pois envolvem conflitos de interesse, transações com partes relacionadas e falta de independência do conselho", "Ambiental, pois envolvem o uso de recursos da empresa em projetos externos", "Social, pois envolvem o relacionamento da empresa com a comunidade em que atua", "Nenhum pilar ESG, pois tratam apenas de assuntos societários internos"], "correta": 0, "explicacao": "O pilar de governança corporativa trata da forma como a empresa é dirigida e controlada: independência do conselho, tratamento dos acionistas minoritários, transparência, gestão de conflitos de interesse e transações com partes relacionadas, remuneração e controles anticorrupção. Assuntos societários internos são justamente o núcleo da governança, e falhas nesses pontos podem destruir valor para os minoritários."}, {"id": "M4-005", "modulo": 4, "topico": "4.1.1 Conceitos de ESG – materialidade", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Ao montar sua metodologia ESG, uma gestora decide atribuir pesos diferentes aos temas conforme o setor: em empresas de petróleo, dá mais peso às emissões e à transição energética; em bancos, à segurança de dados e à política de concessão de crédito. Esse procedimento se baseia no conceito de:", "alternativas": ["exclusão setorial, segundo o qual empresas de setores poluentes devem ser retiradas da carteira", "neutralidade de carbono, segundo o qual todas as empresas devem compensar as próprias emissões", "materialidade, segundo o qual os temas ESG relevantes são aqueles que podem afetar de forma significativa o desempenho e o valor da empresa, o que varia de setor para setor", "diversificação, segundo o qual a carteira deve ter o mesmo peso em todos os setores da economia"], "correta": 2, "explicacao": "Materialidade é o critério que identifica quais temas ESG têm potencial de impactar significativamente os resultados e o valor de uma empresa; por isso, a matriz de temas relevantes muda conforme o setor. Não se trata de excluir setores (isso seria triagem negativa), e sim de focar a análise nos riscos e oportunidades que realmente importam para cada negócio."}, {"id": "M4-006", "modulo": 4, "topico": "4.2.1 A relação entre ESG e finanças – riscos climáticos", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Uma gestora identifica dois riscos em uma empresa do agronegócio: (I) secas mais frequentes reduzindo a produtividade das lavouras; (II) a possível criação de tributação sobre emissões de carbono, elevando custos. Esses riscos são classificados, respectivamente, como:", "alternativas": ["risco climático de transição e risco climático físico", "risco climático físico e risco climático de transição", "risco de liquidez e risco de crédito", "risco de governança e risco social"], "correta": 1, "explicacao": "Riscos físicos decorrem de efeitos concretos das mudanças climáticas, como secas, enchentes e eventos extremos que afetam ativos e produção. Riscos de transição decorrem da mudança para uma economia de baixo carbono, como novas regras, tributos sobre emissões, mudanças tecnológicas e de preferência dos consumidores. Ambos podem afetar fluxo de caixa e valor da empresa, por isso entram na análise financeira."}, {"id": "M4-007", "modulo": 4, "topico": "4.2.1 A relação entre ESG e finanças", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente comenta: “Se a empresa é ESG, então a ação dela vai render mais, certo?”. A resposta tecnicamente correta da pessoa profissional é:", "alternativas": ["Sim, empresas ESG têm retorno garantido superior porque contam com incentivos do governo", "Não, empresas ESG sempre rendem menos porque gastam mais com projetos socioambientais", "Sim, desde que a empresa esteja listada em um índice de sustentabilidade da bolsa", "Boas práticas ESG podem reduzir riscos e facilitar o acesso a capital, mas não garantem rentabilidade maior; a ação continua sujeita aos riscos de mercado"], "correta": 3, "explicacao": "A relação entre ESG e finanças está na gestão de riscos e oportunidades: empresas com boas práticas tendem a ter menor exposição a multas, acidentes e crises de reputação e podem obter financiamento em melhores condições. Isso não significa retorno garantido, nem menor retorno obrigatório; a ação segue exposta ao risco de mercado, e prometer desempenho seria conduta inadequada."}, {"id": "M4-008", "modulo": 4, "topico": "4.2.2 Impactos de ESG na indústria de investimentos", "dificuldade": "facil", "tipo": "mc", "enunciado": "Qual das situações abaixo exemplifica um impacto do tema ESG na indústria de investimentos brasileira nos últimos anos?", "alternativas": ["A análise financeira tradicional deixou de ser utilizada e foi substituída pelos ratings ESG", "Os bancos foram proibidos de financiar empresas dos setores de energia e mineração", "Gestoras passaram a adotar políticas formais de integração ESG e a divulgar metodologias, enquanto regulador e autorregulador criaram regras contra o greenwashing", "Os fundos de investimento passaram a ser obrigados a investir pelo menos metade da carteira em ativos verdes"], "correta": 2, "explicacao": "A demanda dos investidores levou gestoras a criarem políticas, estruturas e metodologias ESG e a lançarem produtos sustentáveis; com isso, a CVM (Resolução CVM 175) e a ANBIMA (regras de identificação de fundos IS) passaram a exigir transparência para evitar greenwashing. Não houve proibição de setores nem percentual mínimo obrigatório de ativos verdes, e a análise ESG complementa, não substitui, a análise financeira."}, {"id": "M4-009", "modulo": 4, "topico": "4.2.3 Conceitos de investimentos ESG – investimento de impacto", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Uma investidora quer que seu dinheiro gere benefício social concreto, como ampliar o acesso a saneamento em comunidades de baixa renda, e deseja acompanhar os resultados por indicadores. Ela não abre mão de retorno financeiro. O conceito que melhor descreve o que ela busca é:", "alternativas": ["triagem negativa, que apenas exclui da carteira setores considerados nocivos", "investimento de impacto, que combina a intenção de gerar impacto socioambiental positivo e mensurável com a busca de retorno financeiro", "filantropia, que busca impacto social sem expectativa de retorno financeiro", "integração ESG, que apenas considera fatores ESG na análise de risco, sem objetivo de gerar impacto"], "correta": 1, "explicacao": "O investimento de impacto se caracteriza pela intencionalidade de gerar impacto socioambiental positivo, pela mensuração desse impacto e pela expectativa de retorno financeiro. A filantropia não espera retorno; a integração ESG usa os fatores para avaliar risco e retorno sem necessariamente buscar impacto; a triagem negativa apenas exclui setores."}, {"id": "M4-010", "modulo": 4, "topico": "4.2.4 Produtos ESG – títulos verdes (green bonds)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma empresa de energia emitiu uma debênture rotulada como “título verde” (green bond). Um cliente quer saber o que caracteriza esse tipo de título. A resposta correta é:", "alternativas": ["Os recursos captados devem ser destinados a projetos com benefício ambiental definidos na emissão, geralmente com avaliação externa e relatórios de alocação", "O título tem garantia do governo federal por financiar projetos ambientais", "A remuneração do título é obrigatoriamente atrelada ao preço de créditos de carbono", "O título não tem risco de crédito, pois a destinação ambiental dos recursos reduz a inadimplência a zero"], "correta": 0, "explicacao": "Títulos verdes são títulos de dívida cujo diferencial é o uso dos recursos: eles financiam projetos com benefícios ambientais, como energia renovável ou eficiência energética, normalmente com parecer de segunda opinião e relatórios periódicos sobre a aplicação dos recursos. O rótulo não elimina o risco de crédito do emissor nem cria garantia pública."}, {"id": "M4-011", "modulo": 4, "topico": "4.2.4 Produtos ESG – títulos vinculados a metas (sustainability-linked)", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Uma companhia emitiu um título cuja taxa de juros aumenta 0,25 ponto percentual ao ano caso ela não reduza suas emissões de carbono em 30% até determinada data. Os recursos podem ser usados livremente pela empresa. Esse instrumento é um:", "alternativas": ["título verde (green bond), cujos recursos são obrigatoriamente destinados a projetos ambientais específicos", "crédito de descarbonização, negociado apenas por distribuidoras de combustíveis", "título social, cujos recursos devem financiar projetos com benefícios sociais", "título vinculado à sustentabilidade (sustainability-linked), cuja remuneração depende do cumprimento de metas de desempenho ESG"], "correta": 3, "explicacao": "No título vinculado à sustentabilidade, o foco não é o uso dos recursos, que é livre, mas o compromisso com metas (indicadores-chave de desempenho) ESG: se a meta não for cumprida, a remuneração muda, em geral com aumento da taxa (step-up). Já nos títulos verdes e sociais, o elemento central é a destinação dos recursos a projetos elegíveis."}, {"id": "M4-012", "modulo": 4, "topico": "4.2.4 Produtos ESG", "dificuldade": "facil", "tipo": "mc", "enunciado": "Um cliente pede exemplos de produtos de investimento relacionados ao tema ESG disponíveis no mercado brasileiro. Qual lista contém apenas exemplos adequados?", "alternativas": ["Fundos identificados como IS, títulos verdes ou sociais e ETFs que replicam índices de sustentabilidade", "CDBs de qualquer banco, pois todos os bancos seguem políticas socioambientais", "Contratos futuros de dólar, opções de ações e swaps cambiais", "Poupança, títulos de capitalização e consórcios"], "correta": 0, "explicacao": "Produtos ESG incluem fundos com objetivo de investimento sustentável (sufixo IS na autorregulação ANBIMA), títulos de dívida rotulados (verdes, sociais, sustentáveis e vinculados a metas) e fundos de índice que replicam índices de sustentabilidade. Produtos comuns não se tornam ESG apenas porque a instituição tem uma política socioambiental."}, {"id": "M4-013", "modulo": 4, "topico": "4.2.5 Estratégias de investimento ESG – exclusão (triagem negativa)", "dificuldade": "facil", "tipo": "mc", "enunciado": "O regulamento de um fundo determina que ele não pode investir em empresas que obtenham receita relevante com tabaco, armamentos ou jogos de azar. Essa estratégia ESG é chamada de:", "alternativas": ["engajamento acionário", "triagem negativa ou exclusão (negative screening)", "best-in-class (melhor da categoria)", "investimento temático"], "correta": 1, "explicacao": "A triagem negativa consiste em excluir da carteira empresas ou setores com base em critérios éticos ou de risco ESG, como tabaco, armas e jogos de azar. É uma das estratégias mais antigas e simples. O best-in-class, ao contrário, seleciona as melhores empresas de cada setor sem excluir setores inteiros."}, {"id": "M4-014", "modulo": 4, "topico": "4.2.5 Estratégias de investimento ESG – best-in-class", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente estranha que um fundo com estratégia ESG tenha ações de uma petroleira. O gestor explica que o fundo investe em todos os setores, mas escolhe, em cada setor, as empresas com as melhores notas ESG em relação aos concorrentes. Essa estratégia é a:", "alternativas": ["exclusão baseada em normas, que retira empresas que violam tratados internacionais", "triagem negativa, que exclui setores inteiros considerados poluentes", "investimento de impacto, que busca apenas empresas com impacto socioambiental positivo mensurável", "best-in-class, que seleciona as empresas com melhor desempenho ESG dentro de cada setor"], "correta": 3, "explicacao": "No best-in-class, a comparação é feita entre pares do mesmo setor, e as empresas mais bem avaliadas são escolhidas, o que permite manter a diversificação setorial. Por isso, o fundo pode ter uma petroleira, desde que ela esteja entre as melhores do seu setor em critérios ESG; se a estratégia fosse de exclusão do setor, isso não seria possível."}, {"id": "M4-015", "modulo": 4, "topico": "4.2.5 Estratégias de investimento ESG – integração", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um analista de ações passou a incluir, no modelo de fluxo de caixa descontado, os custos esperados com adaptação a novas exigências ambientais e o risco de multas trabalhistas de cada empresa, sem excluir nenhum setor do universo de investimento. Essa prática é chamada de:", "alternativas": ["triagem negativa, na qual setores controversos são retirados da carteira", "investimento temático, no qual o fundo investe somente em setores ligados à sustentabilidade", "integração ESG, na qual fatores ambientais, sociais e de governança são incorporados de forma sistemática à análise financeira", "engajamento, no qual o investidor dialoga com a empresa para mudar suas práticas"], "correta": 2, "explicacao": "Integração ESG é a inclusão explícita e sistemática de fatores ESG na análise de investimentos, por exemplo ajustando projeções de receitas e custos, a taxa de desconto ou o valuation. Ela não exige excluir setores nem ter objetivo de impacto; o foco é avaliar melhor risco e retorno."}, {"id": "M4-016", "modulo": 4, "topico": "4.2.5 Estratégias de investimento ESG – engajamento", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma gestora com participação relevante em uma companhia de energia, em vez de vender as ações, passou a se reunir com a diretoria para cobrar metas de redução de emissões e a votar nas assembleias a favor de propostas nesse sentido. Essa estratégia é conhecida como:", "alternativas": ["compensação de carbono", "engajamento (ou ativismo acionário/stewardship)", "desinvestimento (divestment)", "triagem positiva"], "correta": 1, "explicacao": "No engajamento, o investidor usa sua posição de acionista para influenciar as práticas da empresa, por meio de diálogo com a administração e do exercício do direito de voto em assembleias. É o oposto do desinvestimento, em que o investidor simplesmente vende a participação."}, {"id": "M4-017", "modulo": 4, "topico": "4.2.5 Estratégias de investimento ESG – comparação", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Três fundos descrevem suas estratégias: Fundo 1 – investe apenas em empresas de energia solar, eólica e saneamento; Fundo 2 – exclui empresas envolvidas em casos comprovados de trabalho infantil, conforme convenções internacionais; Fundo 3 – escolhe, em cada setor, as 20% empresas mais bem avaliadas em ESG. As estratégias são, respectivamente:", "alternativas": ["impacto; engajamento; integração ESG", "temática; best-in-class; triagem negativa setorial", "best-in-class; triagem baseada em normas; temática", "temática; triagem baseada em normas; best-in-class"], "correta": 3, "explicacao": "O investimento temático concentra a carteira em setores ou temas ligados à sustentabilidade, como energias renováveis e saneamento. A triagem baseada em normas exclui empresas que violam padrões internacionais, como convenções sobre direitos humanos e trabalho. O best-in-class seleciona as melhores de cada setor, mantendo a diversificação setorial."}, {"id": "M4-018", "modulo": 4, "topico": "4.2.6 Avaliação de investimentos ESG – ratings ESG", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma cliente percebe que a mesma empresa recebeu nota ESG alta de uma agência de rating e nota mediana de outra. A explicação mais adequada para essa diferença é:", "alternativas": ["As agências usam metodologias, pesos, fontes de dados e definições de materialidade diferentes, o que gera divergência entre os ratings ESG", "Uma das agências necessariamente cometeu um erro, pois os ratings ESG seguem uma metodologia única definida pela CVM", "Ratings ESG são sempre idênticos entre agências; a diferença indica fraude da empresa", "A diferença ocorre apenas porque uma das notas considera o preço da ação na bolsa"], "correta": 0, "explicacao": "Não existe metodologia única e obrigatória para ratings ESG: cada provedor escolhe temas, indicadores, pesos e fontes de informação, e muitas vezes depende de dados autodeclarados pelas empresas. Por isso, a divergência entre ratings é comum e é um dos desafios da avaliação ESG; o investidor deve entender a metodologia usada, e não tratar a nota como verdade absoluta."}, {"id": "M4-019", "modulo": 4, "topico": "4.2.6 Avaliação de investimentos ESG – verificação externa", "dificuldade": "medio", "tipo": "mc", "enunciado": "Antes de lançar um título verde, uma empresa contratou uma consultoria independente para avaliar se o projeto financiado e o arcabouço da emissão estão alinhados a padrões de mercado de finanças sustentáveis. Esse documento é conhecido como:", "alternativas": ["laudo de avaliação patrimonial", "prospecto definitivo da oferta", "parecer de segunda opinião (second party opinion)", "rating de crédito do emissor"], "correta": 2, "explicacao": "O parecer de segunda opinião é uma avaliação externa e independente que verifica se o título e seu arcabouço (uso dos recursos, seleção de projetos, gestão e relato) estão alinhados aos princípios de mercado para títulos verdes, sociais ou sustentáveis. Ele não substitui o rating de crédito, que mede a capacidade de pagamento do emissor."}, {"id": "M4-020", "modulo": 4, "topico": "4.2.6.1 Desafios para a evolução dos investimentos ESG", "dificuldade": "facil", "tipo": "mc", "enunciado": "Qual das alternativas apresenta um desafio reconhecido para a evolução dos investimentos ESG?", "alternativas": ["A proibição legal de fundos de investimento adquirirem ações de empresas sustentáveis", "A impossibilidade de pessoas físicas investirem em produtos ESG", "A falta de padronização e de comparabilidade dos dados ESG divulgados pelas empresas", "A obrigatoriedade de todos os fundos brasileiros terem o sufixo IS no nome"], "correta": 2, "explicacao": "Entre os principais desafios estão a falta de padronização e a qualidade dos dados ESG, a dificuldade de mensurar impacto, a divergência entre ratings e o risco de greenwashing. Não há proibição de investir em empresas sustentáveis, as pessoas físicas podem acessar produtos ESG e o sufixo IS é usado apenas por fundos que cumprem os requisitos para isso."}, {"id": "M4-021", "modulo": 4, "topico": "4.2.6.1 Desafios – greenwashing", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma gestora lança o “Fundo Planeta Verde”, divulgando-o como sustentável, mas não possui metodologia ESG, não monitora indicadores e mantém na carteira empresas com graves passivos ambientais. Essa prática caracteriza:", "alternativas": ["best-in-class, pois o fundo pode ter empresas de qualquer setor", "greenwashing, isto é, apresentar um produto como sustentável sem que suas práticas correspondam ao que é divulgado", "integração ESG, pois basta que o fundo mencione o tema em sua comunicação", "investimento de impacto, pois o nome do fundo demonstra a intenção de proteger o meio ambiente"], "correta": 1, "explicacao": "Greenwashing é a divulgação enganosa de atributos sustentáveis que o produto ou a empresa não tem, ou tem em proporção muito menor que a anunciada. A Resolução CVM 175 e as regras da ANBIMA exigem que fundos que usam termos ligados à sustentabilidade tenham objetivo, metodologia e transparência compatíveis, justamente para evitar que o investidor seja induzido a erro."}, {"id": "M4-022", "modulo": 4, "topico": "4.2.6.2.1.1 A autorregulação da ANBIMA – identificação IS", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Um cliente diz: “Se o fundo tem o sufixo IS, é porque a ANBIMA certificou e concedeu um selo verde a ele, certo?”. A resposta correta é:", "alternativas": ["Não. A identificação IS é feita pela própria instituição que cumpre os requisitos das regras da ANBIMA, e o cumprimento é verificado ao longo do tempo pela supervisão da ANBIMA, podendo o fundo perder a identificação", "Sim. O sufixo IS é um selo de qualidade concedido pela ANBIMA após auditoria prévia, que garante o desempenho ambiental do fundo", "Sim. O sufixo IS é atribuído pela CVM aos fundos que obtiveram rating ESG máximo", "Não. O sufixo IS é apenas uma estratégia de marketing, sem qualquer regra ou fiscalização"], "correta": 0, "explicacao": "Pelas regras da ANBIMA, o sufixo IS não é selo nem nova classificação: é uma identificação adotada pelo fundo que atende aos requisitos aplicáveis ao gestor e ao fundo, e a supervisão da ANBIMA acompanha o cumprimento continuamente. Se não houver comprovação dos requisitos, o fundo pode perder a identificação; portanto, também não é um mero recurso de marketing sem regras."}, {"id": "M4-023", "modulo": 4, "topico": "4.2.6.2.1.1 A autorregulação da ANBIMA – requisitos para o gestor", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Uma gestora quer lançar seu primeiro fundo com identificação IS. Segundo a autorregulação da ANBIMA, além dos requisitos do próprio fundo, a gestora precisa:", "alternativas": ["ser signatária obrigatória dos Princípios para o Investimento Responsável (PRI)", "obter um rating ESG mínimo de uma agência internacional para a própria gestora", "investir pelo menos 90% de todos os fundos que administra em ativos verdes", "ter política de sustentabilidade/ASG formalizada e aprovada pela alta administração, estrutura de governança para o tema e dar transparência a essas informações"], "correta": 3, "explicacao": "As regras da ANBIMA entendem a incorporação de fatores ASG como um processo e, por isso, impõem requisitos também ao gestor: política documentada e aprovada pela alta administração, estrutura de governança responsável pelo tema e divulgação dessas informações. As regras são menos prescritivas e não exigem rating externo, adesão ao PRI ou percentuais fixos para toda a gestora."}, {"id": "M4-024", "modulo": 4, "topico": "4.2.6.2.1.2 A regulação CVM 175 (artigo 49)", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Uma gestora quer incluir a palavra “Sustentável” na denominação de uma nova classe de fundo. Segundo o artigo 49 da Resolução CVM 175, o regulamento e o anexo da classe deverão estabelecer, entre outros pontos:", "alternativas": ["a rentabilidade mínima garantida aos cotistas em razão do caráter sustentável da classe", "os benefícios ambientais, sociais ou de governança esperados e como a política de investimento busca gerá-los, a metodologia de qualificação, a entidade certificadora ou de segunda opinião, se houver, e a forma e periodicidade do relatório de resultados", "a lista de setores proibidos definida pela CVM para todos os fundos sustentáveis", "a autorização prévia da ANBIMA para uso do termo, sem a qual a CVM não registra a classe"], "correta": 1, "explicacao": "O artigo 49 da Resolução CVM 175 exige que o fundo ou classe cuja denominação faça referência a fatores ASG ou a termos ligados às finanças sustentáveis informe os benefícios esperados e como a política de investimento busca gerá-los, as metodologias ou diretrizes de qualificação, a entidade que certifica ou emite parecer de segunda opinião, se houver, e como será divulgado o relatório sobre os resultados alcançados. Não há rentabilidade garantida nem lista única de setores proibidos."}, {"id": "M4-025", "modulo": 4, "topico": "4.2.6.2.1.2 A regulação CVM 175 (artigo 49) – fundos que apenas integram ESG", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um fundo de ações integra fatores ESG na análise de risco das empresas, mas não tem como objetivo gerar benefícios socioambientais. Segundo a Resolução CVM 175, esse fundo:", "alternativas": ["não pode usar termos ligados às finanças sustentáveis em sua denominação, mas o regulamento deve informar como os fatores ESG são integrados à política de investimento", "pode usar qualquer termo sustentável no nome, desde que o material de divulgação seja aprovado pela CVM", "deve obrigatoriamente usar a palavra “ESG” no nome, para não omitir informação do investidor", "fica proibido de mencionar fatores ESG em qualquer documento, inclusive no regulamento"], "correta": 0, "explicacao": "A Resolução CVM 175 diferencia quem busca originar benefícios socioambientais de quem apenas integra fatores ESG à gestão. No segundo caso, é vedado usar termos ligados às finanças sustentáveis na denominação, mas o regulamento deve dispor sobre a integração desses fatores à política de investimento, com transparência ao investidor."}, {"id": "M4-026", "modulo": 4, "topico": "4.2.6.2.2 CVM – material de divulgação com menção a ESG", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Um distribuidor prepara um material de divulgação de um fundo que menciona fatores ESG. Segundo a Resolução CVM 175, esse material deve informar de modo objetivo:", "alternativas": ["a nota ESG atribuída à classe pela própria CVM", "o percentual da taxa de administração destinado a projetos socioambientais", "se o fundo ou classe tem política de investimento que busca originar benefício socioambiental ou se apenas integra fatores ESG à sua política, sem buscar esse benefício", "a projeção de rentabilidade dos próximos doze meses decorrente da estratégia ESG"], "correta": 2, "explicacao": "Para combater o greenwashing, a Resolução CVM 175 exige que o material de divulgação que mencione fatores ESG deixe claro qual é o caso do fundo: se busca originar benefícios socioambientais ou se apenas integra esses fatores à gestão. A CVM não atribui notas ESG, e projeções de rentabilidade não são o objetivo dessa exigência."}, {"id": "M4-027", "modulo": 4, "topico": "4.2.6.2.2 CVM – papel no tema ESG", "dificuldade": "medio", "tipo": "mc", "enunciado": "Sobre o papel da CVM em relação aos investimentos ESG no Brasil, é correto afirmar que a autarquia:", "alternativas": ["concede o sufixo IS aos fundos sustentáveis após aprovação em colegiado", "define quais empresas são sustentáveis e publica a lista oficial de ações ESG", "garante a rentabilidade dos fundos sustentáveis registrados em sua base", "atua principalmente na regulação da transparência, exigindo informações claras de fundos e de companhias abertas sobre aspectos ESG, para proteger o investidor e coibir o greenwashing"], "correta": 3, "explicacao": "A CVM regula o mercado de valores mobiliários e, no tema ESG, foca na divulgação de informações: regras de denominação e de material de divulgação de fundos na Resolução CVM 175 e exigências de informações socioambientais das companhias abertas. O sufixo IS é da autorregulação da ANBIMA, e a CVM não garante rentabilidade nem publica lista oficial de empresas sustentáveis."}, {"id": "M4-028", "modulo": 4, "topico": "4.2.6.2.3 Princípios para Investimentos Responsáveis (PRI)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma gestora informa em seu site que é signatária do PRI (Principles for Responsible Investment). Isso significa que ela:", "alternativas": ["aderiu voluntariamente a uma iniciativa apoiada pela ONU, comprometendo-se a incorporar questões ESG à análise e às práticas de propriedade dos ativos e a reportar seu progresso", "passou a ter seus fundos garantidos pela ONU em caso de perdas ambientais", "recebeu autorização da CVM para distribuir fundos sustentáveis no Brasil", "está obrigada por lei a investir apenas em empresas sem emissões de carbono"], "correta": 0, "explicacao": "O PRI é uma iniciativa de adesão voluntária, lançada em 2006 com apoio da ONU (iniciativa financeira do Programa das Nações Unidas para o Meio Ambiente e Pacto Global), que reúne seis princípios. Entre eles estão incorporar questões ESG às análises e decisões de investimento, ser acionista ativo e reportar as atividades e o progresso. Não é autorização regulatória, não impõe exclusões fixas e não garante resultados."}, {"id": "M4-029", "modulo": 4, "topico": "4.2.6.2.3 Princípios para Investimentos Responsáveis (PRI)", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Qual das alternativas a seguir é um dos seis Princípios para o Investimento Responsável (PRI)?", "alternativas": ["Excluir obrigatoriamente os setores de petróleo, gás e mineração", "Investir no mínimo metade da carteira em títulos verdes", "Divulgar ao público a rentabilidade comparada entre fundos ESG e convencionais", "Ser proprietários ativos e incorporar questões ESG às políticas e práticas de propriedade de ativos"], "correta": 3, "explicacao": "Os seis princípios do PRI tratam de: incorporar ESG à análise e decisão de investimento; ser proprietário ativo; buscar divulgação adequada de ESG pelas investidas; promover a aceitação dos princípios no setor; trabalhar em conjunto para aumentar a eficácia; e reportar atividades e progresso. Eles não impõem percentuais mínimos nem exclusões setoriais obrigatórias."}, {"id": "M4-030", "modulo": 4, "topico": "4.3 Identificação dos fundos de investimento sustentável (IS)", "dificuldade": "facil", "tipo": "mc", "enunciado": "Ao consultar uma plataforma, um cliente encontra o “Fundo Alfa Renda Fixa Crédito IS”. O sufixo IS, segundo a autorregulação da ANBIMA, indica que o fundo:", "alternativas": ["é isento de imposto de renda por investir em ativos sustentáveis", "tem como objetivo o investimento sustentável e cumpre os requisitos da ANBIMA para essa identificação", "é destinado apenas a investidores institucionais", "investe exclusivamente no exterior, em índices de sustentabilidade"], "correta": 1, "explicacao": "IS significa Investimento Sustentável: o sufixo identifica fundos cujo objetivo é o investimento sustentável, com requisitos para o fundo (objetivo no regulamento, metodologia, monitoramento, transparência) e para o gestor. O sufixo não altera a tributação nem restringe o público-alvo."}, {"id": "M4-031", "modulo": 4, "topico": "4.3 Identificação dos fundos que integram questões ESG", "dificuldade": "medio", "tipo": "mc", "enunciado": "No material publicitário de um fundo multimercado aparece a frase: “Esse fundo integra questões ASG em sua gestão, conforme as regras da ANBIMA”. O nome do fundo não tem o sufixo IS. O cliente deve entender que o fundo:", "alternativas": ["tem objetivo de investimento sustentável, mas ainda aguarda a aprovação do sufixo IS pela CVM", "é obrigado a investir somente em títulos verdes", "considera fatores ambientais, sociais e de governança em sua gestão, mas não tem o investimento sustentável como objetivo principal", "não pode ter nenhuma relação com o tema ESG, pois não usa o sufixo IS"], "correta": 2, "explicacao": "A autorregulação da ANBIMA prevê duas situações: fundos IS, cujo objetivo é o investimento sustentável e que levam o sufixo no nome; e fundos que integram questões ASG em sua gestão, sem objetivo sustentável, que não usam o sufixo nem termos sustentáveis no nome, mas podem se diferenciar com uma frase padrão nos materiais. A identificação não depende de aprovação da CVM."}, {"id": "M4-032", "modulo": 4, "topico": "4.3 Identificação dos fundos IS e fundos que integram questões ESG", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Uma gestora tem um fundo que hoje é identificado como “fundo que integra questões ASG” e quer, no futuro, aprimorar sua estratégia. Segundo as regras da ANBIMA, é correto afirmar que:", "alternativas": ["o fundo pode usar simultaneamente o sufixo IS e a frase de integração ASG, para reforçar seu compromisso", "para virar IS, basta mudar o nome do fundo, sem nenhum outro requisito", "uma vez identificado como fundo que integra questões ASG, o fundo nunca poderá se tornar IS", "o fundo não pode usar ao mesmo tempo o sufixo IS e a frase de integração ASG, mas pode passar a ser IS no futuro se cumprir todos os requisitos aplicáveis"], "correta": 3, "explicacao": "As identificações são excludentes: o fundo deve optar entre ser IS ou ser um fundo que integra questões ASG. Nada impede a evolução para IS, desde que o fundo e o gestor passem a cumprir todos os requisitos, como objetivo sustentável no regulamento, metodologia, limitações, monitoramento e transparência."}, {"id": "M4-033", "modulo": 4, "topico": "4.3 Identificação dos fundos IS – requisitos do fundo", "dificuldade": "medio", "tipo": "mc", "enunciado": "Ao analisar a documentação de um fundo IS, o que a pessoa investidora deve esperar encontrar, conforme as regras da ANBIMA?", "alternativas": ["O objetivo de investimento sustentável no regulamento, a metodologia usada para buscá-lo, as limitações dessa metodologia e as ações de monitoramento", "A dispensa de lâmina e de regulamento, substituídos por um relatório de impacto", "Um certificado da ANBIMA atestando que todas as empresas da carteira são neutras em carbono", "Uma garantia de que a carteira terá rentabilidade acima do CDI"], "correta": 0, "explicacao": "Os fundos IS devem explicitar o objetivo sustentável no regulamento, adotar e divulgar a estratégia e a metodologia usadas, identificar limitações das metodologias e dos dados e manter ações de diligência e monitoramento, com transparência nos materiais. Não há garantia de rentabilidade nem certificado de neutralidade emitido pela ANBIMA."}, {"id": "M4-034", "modulo": 4, "topico": "4.4.1 Finanças tradicionais versus finanças descentralizadas", "dificuldade": "facil", "tipo": "mc", "enunciado": "Um cliente pergunta qual é a principal diferença entre emprestar dinheiro por meio de um protocolo de finanças descentralizadas (DeFi) e aplicar em um CDB de um banco. A resposta correta é:", "alternativas": ["O DeFi funciona somente em horário bancário e depende de aprovação de um gerente", "No DeFi, as operações são executadas por contratos inteligentes em blockchain, sem um intermediário financeiro central, e não contam com a proteção do FGC", "No DeFi, o Banco Central atua como contraparte central e garante as operações", "No CDB não há intermediário, enquanto no DeFi o banco é obrigatório"], "correta": 1, "explicacao": "As finanças tradicionais dependem de intermediários (bancos, corretoras, câmaras) regulados e, no caso do CDB, há cobertura do FGC dentro dos limites. No DeFi, os serviços são prestados por contratos inteligentes em blockchain, sem intermediário central, funcionando 24 horas; em contrapartida, não há FGC nem a mesma proteção regulatória, e surgem riscos tecnológicos."}, {"id": "M4-035", "modulo": 4, "topico": "4.4.2 Vantagens do DEFI", "dificuldade": "medio", "tipo": "mc", "enunciado": "Qual das alternativas apresenta vantagens normalmente atribuídas às finanças descentralizadas (DeFi)?", "alternativas": ["Ausência total de riscos, pois o código dos contratos inteligentes não pode conter falhas", "Garantia de capital pelo FGC e supervisão direta do Banco Central sobre cada protocolo", "Funcionamento ininterrupto, acesso sem intermediários, transparência das transações registradas em blockchain e possibilidade de combinar serviços entre protocolos", "Possibilidade de reverter qualquer transação a pedido do usuário, como ocorre no estorno de cartão"], "correta": 2, "explicacao": "Entre as vantagens do DeFi estão o funcionamento 24 horas, o acesso direto sem intermediários, a transparência dos registros em blockchain, a programabilidade e a possibilidade de integrar protocolos. Mas há riscos relevantes: falhas no código, ataques, volatilidade, ausência de FGC e transações em geral irreversíveis."}, {"id": "M4-036", "modulo": 4, "topico": "4.4.2.1 Conceito de blockchain", "dificuldade": "facil", "tipo": "mc", "enunciado": "Em uma palestra sobre inovação, um participante pede uma definição simples de blockchain. A resposta mais adequada é:", "alternativas": ["Um banco de dados centralizado mantido exclusivamente pelo Banco Central para registrar transferências via Pix", "Um registro digital distribuído entre vários participantes, em que as transações são agrupadas em blocos encadeados e validadas por consenso, o que dificulta alterações posteriores", "Um aplicativo de corretora usado para negociar ações na bolsa", "Uma criptomoeda emitida por bancos comerciais e garantida pelo FGC"], "correta": 1, "explicacao": "Blockchain é uma tecnologia de registro distribuído (DLT): várias cópias do registro são mantidas por diferentes participantes, os blocos são ligados por criptografia e a validação ocorre por mecanismos de consenso. Isso torna o histórico praticamente imutável e transparente. Criptomoedas usam blockchain, mas a tecnologia não se confunde com elas."}, {"id": "M4-037", "modulo": 4, "topico": "4.4.2.1 Conceito de blockchain – redes públicas e permissionadas", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um consórcio de instituições financeiras quer usar blockchain para registrar operações entre si, mas só permitirá que participantes previamente autorizados validem as transações. Esse modelo é chamado de:", "alternativas": ["exchange descentralizada", "banco de dados centralizado tradicional", "blockchain pública e sem permissão, como a do bitcoin", "blockchain permissionada (privada ou de consórcio)"], "correta": 3, "explicacao": "Em uma blockchain permissionada, apenas participantes autorizados podem validar e, muitas vezes, acessar os registros, o que facilita o atendimento a exigências regulatórias e de privacidade, sendo comum em projetos do sistema financeiro. Em redes públicas, como a do bitcoin, qualquer pessoa pode participar da validação."}, {"id": "M4-038", "modulo": 4, "topico": "4.4.3.1 Conceito de smart contracts", "dificuldade": "facil", "tipo": "mc", "enunciado": "Uma startup diz que vai usar smart contracts (contratos inteligentes) para automatizar pagamentos a fornecedores. Um smart contract é:", "alternativas": ["um aplicativo de inteligência artificial que negocia preços com os fornecedores", "um contrato de seguro garantido pelo Banco Central", "um programa registrado em blockchain que executa automaticamente as condições acordadas quando os eventos previstos ocorrem", "um contrato em papel assinado digitalmente e arquivado em cartório"], "correta": 2, "explicacao": "Contratos inteligentes são códigos de programação armazenados em blockchain que seguem a lógica “se ocorrer tal condição, execute tal ação”. Quando as condições são verificadas, a execução ocorre automaticamente, sem depender de um intermediário. Não se confundem com assinatura digital de documentos nem com sistemas de IA."}, {"id": "M4-039", "modulo": 4, "topico": "4.4.3.2 Componentes e funcionamento dos smart contracts – oráculos", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Um contrato inteligente de seguro agrícola deve pagar a indenização se a chuva acumulada em determinada região ficar abaixo de um nível em um mês. Como a blockchain não tem acesso direto a dados do mundo externo, o componente necessário para levar a informação de chuva ao contrato é:", "alternativas": ["o oráculo, serviço que fornece ao contrato dados externos confiáveis", "a chave privada do segurado", "o minerador que validou o primeiro bloco da rede", "o token não fungível (NFT) da apólice"], "correta": 0, "explicacao": "Os oráculos são componentes que conectam o contrato inteligente a dados de fora da blockchain, como clima, preços ou atrasos de voos. Junto com as partes, as condições codificadas, os ativos digitais e os eventos de disparo, formam o funcionamento do contrato. A qualidade do oráculo é crítica: dados errados levam a execuções erradas."}, {"id": "M4-040", "modulo": 4, "topico": "4.4.3.3 Conceito de contratos autoexecutáveis", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um investidor pergunta qual é o principal risco associado ao fato de um contrato inteligente ser autoexecutável. A resposta mais adequada é:", "alternativas": ["Se houver erro no código ou dado incorreto, o contrato pode executar a operação de forma indesejada e, em geral, a transação é difícil ou impossível de reverter", "A execução depende de autorização prévia da CVM para cada operação", "O contrato pode ser alterado unilateralmente pela parte mais forte a qualquer momento", "O contrato precisa ser executado manualmente por um tabelião, o que atrasa a liquidação"], "correta": 0, "explicacao": "Contratos autoexecutáveis cumprem automaticamente o que está programado, reduzindo custos e a dependência de intermediários. O outro lado é que falhas de programação, ataques ou informações erradas também são executados automaticamente, e as transações registradas em blockchain costumam ser irreversíveis, por isso auditoria do código é fundamental."}, {"id": "M4-041", "modulo": 4, "topico": "4.4.3.4 Plataformas de smart contracts", "dificuldade": "medio", "tipo": "mc", "enunciado": "Ao estudar plataformas de contratos inteligentes, um profissional precisa identificar a rede pública que popularizou o uso de smart contracts e que é amplamente utilizada por aplicações DeFi e NFTs. Essa plataforma é:", "alternativas": ["Pix", "Ethereum", "SWIFT", "Selic"], "correta": 1, "explicacao": "A Ethereum foi a rede que popularizou os contratos inteligentes programáveis e concentra grande parte das aplicações DeFi, tokens e NFTs; outras plataformas incluem Solana, Cardano e redes permissionadas voltadas a empresas. Pix, SWIFT e Selic são sistemas do mercado financeiro tradicional, não plataformas de contratos inteligentes."}, {"id": "M4-042", "modulo": 4, "topico": "4.4.3.5 Aplicações práticas de smart contracts", "dificuldade": "facil", "tipo": "mc", "enunciado": "Qual das situações abaixo é um exemplo de aplicação prática de contratos inteligentes?", "alternativas": ["Atendimento telefônico de um gerente para resgatar um CDB", "Envio de um extrato mensal impresso pelo correio", "Abertura de conta corrente presencial com assinatura em papel", "Liberação automática do pagamento ao vendedor assim que a entrega da mercadoria é confirmada por um sistema de rastreamento"], "correta": 3, "explicacao": "Contratos inteligentes são úteis quando há condições objetivas e verificáveis que disparam uma ação, como liberar um pagamento após a confirmação de entrega. Outras aplicações incluem empréstimos com garantia, trocas descentralizadas, seguros paramétricos, imóveis e governança de organizações descentralizadas."}, {"id": "M4-043", "modulo": 4, "topico": "4.4.3.6 Aplicação de smart contracts em contratos de empréstimos", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Em um protocolo DeFi de empréstimo, um usuário depositou como garantia criptoativos que valiam R$ 150.000 e tomou R$ 100.000 emprestados. Pelas regras do contrato inteligente, a garantia é liquidada automaticamente se seu valor ficar abaixo de 120% da dívida. Se os criptoativos se desvalorizarem 25%, o que acontece?", "alternativas": ["O contrato envia notificação ao usuário e aguarda decisão de um gerente antes de agir", "A garantia passa a valer R$ 125.000, acima do mínimo de R$ 120.000, e nada acontece", "A garantia passa a valer R$ 112.500, abaixo do mínimo de R$ 120.000, e o contrato liquida a garantia automaticamente", "A garantia passa a valer R$ 112.500, acima do mínimo de R$ 100.000, e nada acontece"], "correta": 2, "explicacao": "Com queda de 25%, a garantia passa a valer R$ 150.000 × 0,75 = R$ 112.500. O mínimo exigido é 120% de R$ 100.000 = R$ 120.000. Como R$ 112.500 é menor que R$ 120.000, o contrato inteligente executa a liquidação automaticamente, sem depender de intervenção humana. Por isso, os empréstimos DeFi costumam exigir garantia acima do valor emprestado (sobrecolateralização)."}, {"id": "M4-044", "modulo": 4, "topico": "4.4.3.7 Exchanges Descentralizadas (DEXs)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma cliente quer entender como funciona uma exchange descentralizada (DEX). É correto afirmar que, em geral, em uma DEX:", "alternativas": ["as negociações dependem da aprovação de um operador humano para cada ordem", "as trocas de tokens ocorrem diretamente entre carteiras dos usuários por meio de contratos inteligentes, muitas vezes usando pools de liquidez, sem que uma empresa custodie os ativos", "todas as ordens são registradas e liquidadas pela B3", "a empresa que administra a plataforma mantém a custódia dos ativos e garante os saldos com seguro obrigatório"], "correta": 1, "explicacao": "Nas DEXs, os contratos inteligentes intermediam as trocas, e os usuários mantêm o controle das próprias carteiras; muitas usam formadores de mercado automatizados, em que a liquidez vem de pools abastecidos por outros usuários. Isso difere das corretoras centralizadas, que custodiam os ativos dos clientes. Em contrapartida, há riscos de falhas no código e menor proteção ao usuário."}, {"id": "M4-045", "modulo": 4, "topico": "4.4.3.8.1 Seguros – apólices automatizadas", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma seguradora oferece um seguro contra atraso de voo em que, se o atraso registrado na base oficial de voos superar duas horas, a indenização é paga automaticamente, sem necessidade de o cliente abrir sinistro. Esse produto é exemplo de:", "alternativas": ["seguro de vida tradicional com análise manual de sinistro", "plano de previdência com cobertura de risco", "título de capitalização com sorteio mensal", "apólice automatizada (seguro paramétrico) executada por contrato inteligente com base em dados externos"], "correta": 3, "explicacao": "Nas apólices automatizadas, o pagamento depende de um parâmetro objetivo e verificável, como o atraso de voo ou o volume de chuva, informado ao contrato inteligente por um oráculo. Isso reduz custos de regulação de sinistros, prazos e disputas, pois a indenização é liberada automaticamente quando a condição ocorre."}, {"id": "M4-046", "modulo": 4, "topico": "4.4.3.9.1 Imobiliário – compra e venda de propriedades", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Uma plataforma oferece a compra de um apartamento por meio de contrato inteligente: o valor fica retido em blockchain e é liberado ao vendedor quando as condições são cumpridas. Sobre essa aplicação no Brasil, é correto afirmar que:", "alternativas": ["contratos inteligentes são proibidos em qualquer operação imobiliária no Brasil", "o uso de blockchain elimina a necessidade de verificar dívidas e ônus do imóvel", "o contrato inteligente pode automatizar etapas como pagamento e custódia condicionada (escrow), mas a transferência da propriedade do imóvel continua dependendo do registro no Cartório de Registro de Imóveis", "o registro em blockchain substitui integralmente a escritura e o registro em cartório, transferindo a propriedade de imediato"], "correta": 2, "explicacao": "No setor imobiliário, contratos inteligentes podem reduzir prazos e custos ao automatizar pagamentos, retenções condicionadas e verificações. No Brasil, porém, a propriedade de imóveis se transfere com o registro no Cartório de Registro de Imóveis, de modo que a tecnologia complementa, mas não dispensa, as formalidades legais e a análise de ônus do imóvel."}, {"id": "M4-047", "modulo": 4, "topico": "4.4.3.10.1 Organizações Autônomas Descentralizadas (DAOs)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um grupo de investidores cria uma organização em que as regras de funcionamento estão programadas em contratos inteligentes e as decisões, como uso do caixa comum, são tomadas por votação de quem detém tokens de governança. Essa estrutura é uma:", "alternativas": ["Organização Autônoma Descentralizada (DAO)", "sociedade anônima de capital aberto registrada na CVM", "cooperativa de crédito autorizada pelo Banco Central", "exchange centralizada de criptoativos"], "correta": 0, "explicacao": "As DAOs são organizações cuja governança é descentralizada: as regras ficam codificadas em contratos inteligentes e as decisões são tomadas por votação dos detentores de tokens, sem uma diretoria central tradicional. Entre os riscos estão falhas no código, concentração de tokens em poucos participantes e incerteza jurídica sobre responsabilidades."}, {"id": "M4-048", "modulo": 4, "topico": "4.4.4.1 Tokenização – conceito básico", "dificuldade": "facil", "tipo": "mc", "enunciado": "Uma empresa anuncia que vai “tokenizar” seus recebíveis. Tokenizar um ativo significa:", "alternativas": ["converter o ativo em dinheiro em espécie para depósito em banco", "eliminar o risco de crédito do ativo por meio de criptografia", "representar digitalmente, por meio de tokens registrados em blockchain, direitos sobre um ativo, que podem ser divididos e transferidos", "transformar o ativo em criptomoeda com valor garantido pelo Banco Central"], "correta": 2, "explicacao": "Tokenização é a representação digital de um ativo ou de direitos sobre ele em tokens registrados em blockchain ou outra tecnologia de registro distribuído. Isso permite fracionar, transferir e rastrear a titularidade com mais facilidade, mas não muda o risco do ativo subjacente: um recebível tokenizado continua sujeito ao risco de crédito do devedor."}, {"id": "M4-049", "modulo": 4, "topico": "4.4.4.2 Tipos de tokens", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Uma startup emite tokens que dão aos compradores direito a participação nos lucros de um projeto, oferecidos publicamente a investidores. Um consultor alerta que esse tipo de token tende a ser enquadrado como valor mobiliário. Nesse caso:", "alternativas": ["trata-se de um NFT, que, por ser único, não pode ser considerado valor mobiliário em nenhuma hipótese", "trata-se de um token de pagamento, regulado exclusivamente pelo Banco Central como meio de troca", "trata-se de um token de utilidade, que dá apenas direito de uso de um serviço e não tem regulação", "trata-se de um token de investimento (security token), sujeito à regulação e à supervisão da CVM"], "correta": 3, "explicacao": "Costuma-se classificar os tokens em de pagamento (meio de troca), de utilidade (acesso a produtos ou serviços) e de investimento ou valor mobiliário, que dão direitos econômicos como participação em lucros. Quando o token se enquadra como valor mobiliário, como num contrato de investimento coletivo ofertado publicamente, aplica-se a regulação da CVM, conforme orientação da própria autarquia."}, {"id": "M4-050", "modulo": 4, "topico": "4.4.4.3 Benefícios da tokenização", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma gestora estuda tokenizar cotas de um empreendimento imobiliário comercial de alto valor. Qual benefício a tokenização pode trazer nesse caso?", "alternativas": ["Isenção automática de tributos sobre os rendimentos", "Fracionamento do ativo, permitindo investimentos de menor valor, além de potencial redução de custos operacionais e liquidação mais ágil", "Garantia de liquidez diária com preço fixo para todos os detentores", "Eliminação do risco de vacância e de inadimplência dos inquilinos"], "correta": 1, "explicacao": "A tokenização permite dividir ativos de alto valor em pequenas frações, ampliando o acesso, e pode reduzir intermediários, custos e prazos de liquidação, com registro rastreável. Ela não garante liquidez nem preço, não elimina os riscos do ativo subjacente (vacância, inadimplência) e não cria benefícios tributários."}, {"id": "M4-051", "modulo": 4, "topico": "4.4.4.4 Riscos e desafios da tokenização (segurança, regulação e tecnologia)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente comprou tokens que representam frações de um galpão logístico em uma plataforma. Qual dos riscos abaixo é típico desse tipo de investimento?", "alternativas": ["Perda de acesso por extravio de chaves ou ataque cibernético, incerteza regulatória e dúvida sobre a efetiva vinculação jurídica do token ao ativo real", "Risco nulo, pois o registro em blockchain garante o valor do imóvel", "Somente o risco de mudança da taxa Selic, já que tokens não têm risco operacional", "Apenas o risco de inflação, pois o token é corrigido automaticamente pelo IPCA"], "correta": 0, "explicacao": "Os desafios da tokenização incluem segurança (invasões, golpes, perda de chaves), regulação (enquadramento jurídico, proteção ao investidor e garantia de que o token realmente dá direito sobre o ativo) e tecnologia (falhas em contratos inteligentes, interoperabilidade entre redes). Além disso, permanecem os riscos do próprio ativo e a possível falta de liquidez no mercado secundário."}, {"id": "M4-052", "modulo": 4, "topico": "4.4.4.5 Tokenização de ativos financeiros, imóveis e artes", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma plataforma oferece frações tokenizadas de uma obra de arte famosa, a partir de valores baixos. Um cliente interessado deve ser informado de que:", "alternativas": ["a obra fica garantida pelo FGC, por estar registrada em blockchain", "o valor do token acompanha o CDI, independentemente do mercado de arte", "a tokenização democratiza o acesso a um ativo antes restrito, mas a liquidez das frações, a avaliação da obra e a segurança da custódia física e digital são riscos relevantes", "o detentor de uma fração pode retirar a obra para exposição particular quando quiser"], "correta": 2, "explicacao": "A tokenização de arte, imóveis e ativos financeiros permite que mais pessoas invistam em frações de ativos de alto valor. No caso da arte, há riscos específicos: avaliação subjetiva, baixa liquidez das frações, custódia da obra física e dependência da plataforma. Não há cobertura do FGC nem rentabilidade atrelada ao CDI, e a fração dá direitos econômicos, não de posse individual da obra."}, {"id": "M4-053", "modulo": 4, "topico": "4.4.5.1 NFT (Non-Fungible Token)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um colecionador comprou um NFT associado a uma ilustração digital. Sobre o que ele adquiriu, é correto afirmar que:", "alternativas": ["o NFT é um token único e não intercambiável que comprova a titularidade daquele registro digital, mas, salvo previsão expressa, não transfere automaticamente os direitos autorais da obra", "o NFT é idêntico e intercambiável com qualquer outro NFT da mesma coleção, como ocorre com o bitcoin", "o NFT tem valor garantido pelo artista e pode ser resgatado pelo preço de compra", "o NFT dá automaticamente ao comprador os direitos autorais e de reprodução comercial da obra"], "correta": 0, "explicacao": "NFT significa token não fungível: cada um é único e não pode ser trocado por outro equivalente, diferentemente de criptomoedas fungíveis. Ele registra a titularidade e a procedência de um item digital, mas os direitos autorais dependem do que foi contratado. Os preços de NFTs são muito voláteis e não há garantia de recompra."}, {"id": "M4-054", "modulo": 4, "topico": "4.4.5.2 Stablecoins", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma cliente que atua com importações pergunta o que são stablecoins. A resposta correta é que são criptoativos que:", "alternativas": ["são emitidos exclusivamente por bancos centrais, como o Drex", "têm valor livremente determinado pela oferta e procura, sem nenhuma referência", "têm valor garantido pelo Banco Central do Brasil e cobertura do FGC", "buscam manter valor estável atrelado a uma referência, geralmente uma moeda fiduciária como o dólar, por meio de reservas ou outros mecanismos, mas podem perder a paridade"], "correta": 3, "explicacao": "Stablecoins procuram manter paridade com um ativo de referência, normalmente o dólar, por meio de reservas em moeda e títulos, garantia em outros criptoativos ou algoritmos. A estabilidade não é garantida: há risco de perda de paridade, de qualidade das reservas e do emissor. São emitidas por entidades privadas, ao contrário de uma moeda digital de banco central."}, {"id": "M4-055", "modulo": 4, "topico": "4.4.5.2 Stablecoins – regulação de ativos virtuais no Brasil", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Com base no marco legal dos ativos virtuais (Lei 14.478/2022) e nas resoluções do Banco Central publicadas em novembro de 2025, é correto afirmar que:", "alternativas": ["as stablecoins foram proibidas no Brasil, e sua negociação passou a ser crime", "o Banco Central regula e autoriza as prestadoras de serviços de ativos virtuais, e operações como pagamentos e transferências internacionais com ativos virtuais, a exemplo das stablecoins, passam a ser enquadradas nas regras do mercado de câmbio", "as prestadoras de serviços de ativos virtuais continuam dispensadas de autorização, bastando registro em junta comercial", "a CVM passou a ser a única autoridade responsável por todas as corretoras de criptoativos, inclusive em operações de pagamento"], "correta": 1, "explicacao": "A Lei 14.478/2022 criou o marco legal dos prestadores de serviços de ativos virtuais, e o Banco Central foi designado como regulador. Em novembro de 2025, o BC publicou resoluções sobre autorização e funcionamento dessas sociedades e integrou ao mercado de câmbio operações com ativos virtuais como pagamentos e transferências internacionais. A CVM continua competente quando o ativo for valor mobiliário, e não houve proibição das stablecoins."}, {"id": "M4-056", "modulo": 4, "topico": "4.4.
