"alternativas": ["R$ 11.500,00.", "R$ 10.000,00.", "R$ 11.200,00.", "R$ 10.800,00."], "correta": 2, "explicacao": "A participação de 80% sobre a alta de 15% gera retorno de 0,80 x 15% = 12%. Valor bruto: R$ 10.000 x 1,12 = R$ 11.200. Usar os 15% integralmente ignora o percentual de participação do produto."}, {"id": "M2B-083", "modulo": 2, "topico": "2.1.1.4.2 COE: capital protegido x capital em risco", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um COE com valor nominal protegido paga 100% da alta de um índice, limitada a 20% no prazo (teto). Caso o índice caia, o investidor recebe o valor aplicado. Um investidor aplicou R$ 10.000,00 e o índice subiu 35% até o vencimento. Quanto ele recebe, em valor bruto?", "alternativas": ["R$ 13.500,00.", "R$ 10.000,00.", "R$ 12.700,00.", "R$ 12.000,00."], "correta": 3, "explicacao": "Como o retorno é limitado a 20%, a alta de 35% do índice não é repassada integralmente: o investidor recebe R$ 10.000 x 1,20 = R$ 12.000. O teto é a contrapartida, comum em estruturas protegidas, do custo das opções."}, {"id": "M2B-084", "modulo": 2, "topico": "2.1.1.4.2 COE: capital protegido x capital em risco", "dificuldade": "medio", "tipo": "mc", "enunciado": "Qual é a diferença entre um COE de Valor Nominal Protegido (VNP) e um COE de Valor Nominal em Risco (VNR)?", "alternativas": ["No VNP, o valor nominal investido é devolvido no vencimento mesmo em cenário desfavorável (salvo risco do emissor); no VNR, o investidor pode perder parte ou a totalidade do valor aplicado.", "O VNR protege o valor investido corrigido pela inflação; o VNP protege apenas metade do valor.", "O VNP é garantido pelo FGC e o VNR não.", "O VNP tem rentabilidade prefixada; o VNR tem rentabilidade pós-fixada ao CDI."], "correta": 0, "explicacao": "Na modalidade de capital protegido, o valor nominal é preservado no vencimento, sujeito apenas à solvência do emissor. Na modalidade de capital em risco, o investidor pode sofrer perdas sobre o valor aplicado, normalmente em troca de um potencial de ganho maior."}, {"id": "M2B-085", "modulo": 2, "topico": "2.1.1.4.2 COE: capital protegido x capital em risco", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Um cliente aplicou em um COE com capital protegido de 3 anos e, depois de um ano, precisou do dinheiro. Qual orientação está correta?", "alternativas": ["Ele pode vender o COE na bolsa, com liquidez diária garantida pela B3.", "A proteção vale apenas no vencimento; um eventual resgate antecipado depende de recompra pelo emissor e pode ocorrer a valor de mercado, inclusive inferior ao valor aplicado.", "O FGC paga o valor aplicado caso ele precise resgatar antes do vencimento.", "Ele pode resgatar a qualquer momento recebendo, no mínimo, o valor aplicado, pois o capital é protegido."], "correta": 1, "explicacao": "O COE tem, em geral, baixa liquidez antes do vencimento. A proteção do capital é garantida somente na data de vencimento; antes disso, a saída depende do emissor e é feita a valor de mercado, que pode ser menor que o investido. Por isso o prazo deve ser compatível com o horizonte do cliente."}, {"id": "M2B-086", "modulo": 2, "topico": "2.1.1.4.2 COE: capital protegido x capital em risco", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um investidor aplicou R$ 20.000,00 em um COE de capital protegido de 3 anos. No vencimento, o ativo de referência estava abaixo do nível inicial e ele recebeu exatamente R$ 20.000,00. Qual afirmação está correta?", "alternativas": ["Ele deve pagar IR de 15% sobre o valor recebido.", "Ele pode pedir ao FGC a diferença entre o valor recebido e o CDI do período.", "Não há IR a pagar, pois não houve rendimento, mas a proteção é nominal e o investidor perdeu poder de compra com a inflação do período.", "Ele recebe automaticamente a correção pela inflação do período, por se tratar de capital protegido."], "correta": 2, "explicacao": "Sem ganho, não há base para IR. Porém a proteção cobre o valor nominal aplicado, sem correção, então o investidor sofre perda real e deixa de ganhar o que obteria em uma aplicação de renda fixa no mesmo período (custo de oportunidade)."}, {"id": "M2B-087", "modulo": 2, "topico": "2.1.1.4.3 COE: tributação", "dificuldade": "medio", "tipo": "mc", "enunciado": "Como é tributado, para pessoa física, o rendimento de um COE?", "alternativas": ["Pelo come-cotas semestral, em maio e novembro.", "É isento de IR, por se tratar de produto estruturado com derivativos.", "Pela alíquota de 15% sobre o ganho, com isenção para vendas de até R$ 20 mil por mês.", "Pela tabela regressiva de IR da renda fixa (de 22,5% a 15%, conforme o prazo), retido na fonte no vencimento ou na liquidação, com IOF se a liquidação ocorrer antes de 30 dias."], "correta": 3, "explicacao": "O COE segue a tabela regressiva aplicável à renda fixa, conforme o prazo da aplicação, com IR retido na fonte sobre o rendimento. Não tem come-cotas nem a isenção de R$ 20 mil, que é exclusiva da venda de ações à vista."}, {"id": "M2B-088", "modulo": 2, "topico": "2.1.1.4.3 COE: tributação", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Uma cliente aplicou R$ 20.000,00 em um COE e recebeu R$ 23.000,00 brutos no vencimento, 400 dias depois. Qual foi o IR retido?", "alternativas": ["R$ 525,00.", "R$ 450,00.", "R$ 600,00.", "R$ 675,00."], "correta": 0, "explicacao": "Com prazo de 400 dias (entre 361 e 720 dias), a alíquota da tabela regressiva é de 17,5%. Rendimento: R$ 23.000 - R$ 20.000 = R$ 3.000; IR: 17,5% x R$ 3.000 = R$ 525. A alíquota de 15% só vale para prazos acima de 720 dias."}, {"id": "M2B-089", "modulo": 2, "topico": "2.1.1.4.3 COE: tributação", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Uma cliente aplicou R$ 10.000,00 em um COE de capital protegido com participação de 80% na alta de um índice, sem teto. No vencimento, 2 anos e meio depois, o índice havia subido 15%. Qual o valor líquido de IR recebido no vencimento?", "alternativas": ["R$ 10.976,00.", "R$ 11.020,00.", "R$ 11.200,00.", "R$ 11.275,00."], "correta": 1, "explicacao": "Rendimento bruto: 80% x 15% = 12%, ou R$ 1.200. Com prazo superior a 720 dias, a alíquota é 15%: IR = R$ 180. Valor líquido: R$ 11.200 - R$ 180 = R$ 11.020. O valor de R$ 10.976 resultaria de aplicar 20% sobre o rendimento, alíquota de prazos entre 181 e 360 dias."}, {"id": "M2B-090", "modulo": 2, "topico": "2.1.1.2.2.1.6 OPA", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Um grupo comprou o controle de uma companhia listada no Novo Mercado, pagando R$ 30,00 por ação ao antigo controlador. Um cliente minoritário pergunta o que acontece com suas ações ordinárias. Qual resposta está correta?", "alternativas": ["O cliente é obrigado a vender suas ações por R$ 24,00, correspondentes a 80% do preço pago.", "O cliente não tem nenhum direito, pois a venda do controle é negócio privado entre controladores.", "O comprador deve realizar uma OPA dirigida aos minoritários, oferecendo pelo menos R$ 30,00 por ação, já que o Novo Mercado exige tag along de 100%; o cliente pode aceitar ou permanecer acionista.", "A companhia deve recomprar as ações do cliente pelo valor patrimonial, sem relação com o preço pago ao controlador."], "correta": 2, "explicacao": "Na alienação de controle, a OPA por tag along dá ao minoritário o direito, e não a obrigação, de vender suas ações ao comprador. No Novo Mercado, o preço mínimo equivale a 100% do pago ao controlador; o mínimo legal de 80% vale para ações com voto de companhias fora dos segmentos que ampliam essa proteção."}, {"id": "M2B-091", "modulo": 2, "topico": "2.1.1.2.2.2.3 Dividendos", "dificuldade": "facil", "tipo": "mc", "enunciado": "Uma pessoa investidora pessoa física possui 1.000 ações e recebeu R$ 500,00 de dividendos. Qual é o tratamento tributário típico desse valor?", "alternativas": ["Seguem a tabela regressiva da renda fixa.", "Devem ser tributados a 15% via DARF no mês seguinte.", "Sofrem retenção de 15% na fonte, como os JCP.", "Em regra, os dividendos são isentos de IR para a pessoa física e não sofrem a retenção de 15% que incide sobre os JCP."], "correta": 3, "explicacao": "Os dividendos, em regra, são isentos de IR para o acionista pessoa física, pois o lucro já foi tributado na empresa. Os JCP, ao contrário, sofrem retenção de 15% na fonte."}, {"id": "M2B-092", "modulo": 2, "topico": "2.1.1.2.2.1.4 Units", "dificuldade": "medio", "tipo": "mc", "enunciado": "Por que algumas companhias negociam suas ações também na forma de units?", "alternativas": ["Para converter ações em títulos de dívida da companhia.", "Para garantir ao investidor rentabilidade mínima sobre as ações.", "Para reunir, em um único ativo, ações de classes diferentes (como ON e PN), o que pode facilitar a negociação e dar mais liquidez ao papel.", "Para permitir que investidores estrangeiros comprem ações no exterior."], "correta": 2, "explicacao": "A unit é um certificado de depósito que agrupa ações de uma ou mais classes, negociado como se fosse uma só ação. Pode ser usada, por exemplo, para dar ao investidor uma combinação de ações com voto e preferenciais, concentrando a liquidez em um único código."}, {"id": "M2B-093", "modulo": 2, "topico": "2.1.1.2.2.2.8 Subscrição", "dificuldade": "facil", "tipo": "mc", "enunciado": "Qual é a diferença entre bonificação e subscrição de ações para o acionista?", "alternativas": ["Na subscrição o acionista recebe dinheiro; na bonificação recebe debêntures.", "Na bonificação o acionista recebe novas ações sem pagar; na subscrição ele tem o direito de comprar novas ações, pagando o preço de emissão.", "Na bonificação o acionista paga pelas novas ações; na subscrição as recebe gratuitamente.", "As duas são idênticas, mudando apenas o nome conforme o segmento de listagem."], "correta": 1, "explicacao": "A bonificação distribui ações gratuitamente, a partir da capitalização de lucros ou reservas. A subscrição é um aumento de capital em que o acionista, com direito de preferência, pode comprar novas ações mediante pagamento."}, {"id": "M2C-001", "modulo": 2, "topico": "2.1.2.1 Características, estratégias, composição de carteiras, público-alvo e riscos dos fundos", "dificuldade": "facil", "tipo": "mc", "enunciado": "Uma cliente com R$ 20 mil para investir pergunta ao gerente por que aplicar em um fundo de investimento em vez de comprar sozinha títulos e ações. O argumento tecnicamente correto é que o fundo oferece:", "alternativas": ["gestão profissional e diversificação da carteira, permitindo acesso a ativos que exigiriam valores maiores, em troca do pagamento de taxas", "garantia do Fundo Garantidor de Créditos sobre o valor aplicado, o que elimina o risco de perda do capital", "isenção de imposto de renda sobre os rendimentos, por se tratar de investimento coletivo regulado pela CVM", "rentabilidade mínima assegurada pelo gestor, desde que a cliente permaneça aplicada por pelo menos um ano"], "correta": 0, "explicacao": "As principais vantagens dos fundos são a gestão profissional, a diversificação e o acesso a ativos e estratégias que individualmente exigiriam mais recursos ou conhecimento, com o custo das taxas. Fundos não contam com cobertura do FGC, não têm rentabilidade garantida e, em regra, são tributados pelo IR."}, {"id": "M2C-002", "modulo": 2, "topico": "2.1.2.1 Características, estratégias, composição de carteiras, público-alvo e riscos dos fundos", "dificuldade": "medio", "tipo": "mc", "enunciado": "A classe de um fundo de renda fixa concentra a carteira em debêntures de empresas de médio porte, pouco negociadas no mercado secundário, e permite resgate com pagamento em D+1. Os riscos que merecem maior destaque ao apresentar esse produto a um cliente são:", "alternativas": ["risco de inflação e risco de reinvestimento de cupons de títulos públicos", "risco de crédito dos emissores e risco de liquidez, pela dificuldade de vender os papéis rapidamente sem desconto", "risco cambial e risco de variação do preço das commodities", "risco de mercado acionário e risco de alavancagem com opções"], "correta": 1, "explicacao": "Debêntures de empresas médias expõem a classe à possibilidade de inadimplência (risco de crédito). Por serem pouco negociadas, também há risco de liquidez, agravado pelo descasamento entre o prazo de resgate curto (D+1) e a dificuldade de vender os ativos sem deságio."}, {"id": "M2C-003", "modulo": 2, "topico": "2.1.2.2.2 Definição de fundos de investimento", "dificuldade": "facil", "tipo": "mc", "enunciado": "De acordo com a Resolução CVM 175, o fundo de investimento é definido como:", "alternativas": ["uma conta de custódia individual em que cada investidor é dono de ativos específicos", "um contrato de depósito a prazo entre o investidor e a instituição administradora", "uma comunhão de recursos, constituída sob a forma de condomínio de natureza especial, destinada à aplicação em ativos financeiros, bens e direitos", "uma sociedade anônima de capital fechado cujas ações são distribuídas ao público pelo administrador"], "correta": 2, "explicacao": "A Resolução CVM 175, em linha com o Código Civil (alterado pela Lei de Liberdade Econômica), define o fundo como comunhão de recursos sob a forma de condomínio de natureza especial. Não é sociedade nem depósito bancário, e o cotista não é dono de ativos específicos, mas de cotas."}, {"id": "M2C-004", "modulo": 2, "topico": "2.1.2.2.3 Conceito de condomínio, constituição e registro na CVM", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma cotista de um fundo de ações percebe que a carteira tem grande posição em ações de uma companhia e pergunta se pode comparecer e votar, em nome próprio, na assembleia de acionistas dessa empresa. A resposta correta é:", "alternativas": ["não, pois ela é titular de cotas, que representam fração ideal do patrimônio da classe; os direitos políticos das ações são exercidos pelo gestor, conforme sua política de voto", "não, pois ações mantidas por fundos não dão direito a voto em assembleias de companhias abertas", "sim, desde que ela possua mais de 5% das cotas da classe", "sim, pois cada cotista é proprietário direto de uma quantidade de ações proporcional às suas cotas"], "correta": 0, "explicacao": "No condomínio de natureza especial, os ativos pertencem à classe do fundo e o investidor detém cotas, frações ideais desse patrimônio. Quem exerce os direitos relativos aos ativos da carteira, como o voto em assembleias das companhias, é o gestor, seguindo a política de exercício de direito de voto. As ações continuam tendo direito a voto; quem vota é que muda."}, {"id": "M2C-005", "modulo": 2, "topico": "2.1.2.2.4 Estrutura dos fundos: divisão em classes e subclasses", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Um gestor quer criar duas subclasses dentro de uma mesma classe de cotas. Entre as características abaixo, qual NÃO pode diferir entre as subclasses?", "alternativas": ["O público-alvo, como varejo e alta renda", "Os prazos e condições de aplicação e resgate", "As taxas de administração, de gestão e máxima de distribuição", "A política de investimento, pois as subclasses compartilham a mesma carteira da classe"], "correta": 3, "explicacao": "As subclasses não têm patrimônio segregado: todas participam da mesma carteira da classe. Por isso podem se diferenciar por público-alvo, prazos e condições de aplicação, amortização e resgate e taxas, mas não pela política de investimento. Política diferente exige outra classe."}, {"id": "M2C-006", "modulo": 2, "topico": "2.1.2.2.5 Segregação patrimonial", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um fundo tem duas classes. A Classe X sofreu perdas severas com derivativos e não consegue honrar obrigações com contrapartes. Os cotistas da Classe Y, do mesmo fundo, perguntam se seu patrimônio pode ser usado para cobrir essas obrigações. A resposta correta é:", "alternativas": ["não, mas somente se a Classe Y tiver o mesmo gestor que a Classe X", "não, pois o patrimônio de cada classe é segregado e responde apenas pelas obrigações da própria classe", "sim, mas apenas até 50% do patrimônio da Classe Y", "sim, pois todas as classes de um mesmo fundo respondem solidariamente pelas dívidas do fundo"], "correta": 1, "explicacao": "A segregação patrimonial entre classes é um dos pilares da Resolução CVM 175: cada classe tem patrimônio próprio, que responde somente por suas obrigações. Assim, perdas e dívidas da Classe X não atingem o patrimônio da Classe Y."}, {"id": "M2C-007", "modulo": 2, "topico": "2.1.2.2.6 Cotas", "dificuldade": "medio", "tipo": "mc", "enunciado": "No fechamento de determinado dia, a classe de um fundo tem patrimônio líquido de R$ 12.000.000,00 e 1.000.000 de cotas emitidas. Uma investidora cuja aplicação de R$ 6.000,00 é convertida nesse dia receberá:", "alternativas": ["600 cotas, pois o valor da cota é R$ 10,00", "6.000 cotas, pois cada cota vale R$ 1,00 na data da aplicação", "500 cotas, pois o valor da cota é R$ 12,00", "50 cotas, pois o valor da cota é R$ 120,00"], "correta": 2, "explicacao": "Valor da cota = PL ÷ número de cotas = 12.000.000 ÷ 1.000.000 = R$ 12,00. Quantidade de cotas = 6.000 ÷ 12 = 500 cotas."}, {"id": "M2C-008", "modulo": 2, "topico": "2.1.2.2.7 Classes abertas e fechadas", "dificuldade": "facil", "tipo": "mc", "enunciado": "Um cliente quer um fundo em que possa pedir o resgate quando precisar, conforme os prazos do regulamento, sem depender de vender as cotas a outro investidor. Ele deve procurar uma classe:", "alternativas": ["restrita, que é a única modalidade que permite resgates", "fechada, em que as cotas só são resgatadas ao fim do prazo de duração ou na liquidação", "fechada com cotas negociadas em bolsa, que garante resgate diário pelo administrador", "aberta, em que os cotistas podem solicitar o resgate das cotas conforme as regras do regulamento"], "correta": 3, "explicacao": "Na classe aberta, o cotista pode pedir resgate conforme os prazos do regulamento. Na classe fechada, não há resgate a pedido (só ao término do prazo ou na liquidação, além de eventuais amortizações), e a saída antecipada depende de vender as cotas no mercado secundário."}, {"id": "M2C-009", "modulo": 2, "topico": "2.1.2.2.7 Classes abertas e fechadas", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cotista de uma classe aberta de renda fixa quer vender suas cotas diretamente a um amigo, que pagaria a ele um valor combinado entre os dois. Pela Resolução CVM 175, isso:", "alternativas": ["não é permitido, pois cotas de classe aberta não podem ser cedidas ou transferidas, salvo exceções como decisão judicial, sucessão ou dissolução de sociedade conjugal; o caminho é o resgate", "é permitido, desde que a transação seja registrada em bolsa de valores", "é permitido, desde que o amigo também seja cliente do mesmo distribuidor", "é obrigatório, pois classes abertas não admitem resgate antes de um ano"], "correta": 0, "explicacao": "Cotas de classes abertas, em regra, não podem ser cedidas ou transferidas. As exceções previstas incluem decisão judicial ou arbitral, execução de garantia, sucessão universal e dissolução de sociedade conjugal ou união estável, entre outras. A saída normal é o resgate. Negociação em mercado secundário é característica de classes fechadas."}, {"id": "M2C-010", "modulo": 2, "topico": "2.1.2.2.8 Emissão", "dificuldade": "medio", "tipo": "mc", "enunciado": "O regulamento de uma classe aberta prevê conversão da aplicação em cotas em D+1. Uma investidora transfere os recursos e confirma a aplicação na segunda-feira, dentro do horário limite. A quantidade de cotas que ela receberá será definida:", "alternativas": ["pela média das cotas da semana, para evitar oscilações", "pelo valor da cota apurado no dia útil seguinte (terça-feira)", "pelo valor da cota da própria segunda-feira, pois o dinheiro já foi entregue", "pelo valor da cota da sexta-feira anterior, último valor conhecido"], "correta": 1, "explicacao": "A emissão de cotas ocorre pelo valor da cota na data de conversão definida no regulamento. Com conversão em D+1, a aplicação de segunda-feira é convertida pela cota de terça-feira, o que impede que o investidor escolha um preço já conhecido e preserva a equidade entre cotistas."}, {"id": "M2C-011", "modulo": 2, "topico": "2.1.2.2.9 Subscrição e integralização", "dificuldade": "facil", "tipo": "mc", "enunciado": "Em uma classe fechada com compromisso de investimento, um investidor assinou boletim comprometendo-se a aportar R$ 1.000.000,00. Até agora, o gestor fez uma chamada de capital de R$ 300.000,00, que foi paga. Nessa situação, o investidor:", "alternativas": ["resgatou R$ 700.000,00, que correspondem à parte ainda não paga", "integralizou R$ 1.000.000,00 e subscreveu R$ 300.000,00", "subscreveu e integralizou R$ 300.000,00, pois o compromisso não tem efeito até o pagamento", "subscreveu R$ 1.000.000,00 e integralizou R$ 300.000,00"], "correta": 3, "explicacao": "Subscrição é o ato de aderir à emissão e assumir o compromisso de adquirir as cotas. Integralização é o pagamento efetivo dos recursos. Com chamadas de capital, o investidor integraliza aos poucos o valor que subscreveu."}, {"id": "M2C-012", "modulo": 2, "topico": "2.1.2.2.10 Resgate e amortização", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma classe de ações tem resgate com conversão em D+30 e pagamento em D+32 (dias corridos e úteis conforme o regulamento). Um cliente pede o resgate hoje, com a bolsa em alta, e quer \"travar\" o valor. O gerente deve explicar que:", "alternativas": ["o valor a receber será calculado pela cota da data de conversão, daqui a 30 dias, e o pagamento ocorrerá depois; até lá o valor continua sujeito às oscilações da carteira", "o cliente pode escolher entre a cota de hoje e a da data de conversão, a que for maior", "o prazo de conversão só se aplica a quem resgata menos de 30 dias após aplicar", "o valor fica travado pela cota de hoje, e apenas o pagamento é postergado"], "correta": 0, "explicacao": "Cotização (conversão) é a data em que o pedido de resgate é transformado em dinheiro pelo valor da cota daquele dia; liquidação é o pagamento. Entre o pedido e a conversão, o investidor continua exposto à variação da carteira. Prazos longos de cotização são comuns em classes com ativos menos líquidos ou estratégias de longo prazo."}, {"id": "M2C-013", "modulo": 2, "topico": "2.1.2.2.10 Resgate e amortização", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma classe fechada distribuiu aos cotistas parte do valor das cotas, de forma proporcional e para todos eles, após vender um ativo da carteira. A quantidade de cotas de cada investidor não se alterou. Esse evento é chamado de:", "alternativas": ["come-cotas", "resgate parcial", "amortização", "integralização reversa"], "correta": 2, "explicacao": "Amortização é o pagamento uniforme a todos os cotistas de parcela do valor de suas cotas, sem redução do número de cotas (o valor de cada cota é que diminui). No resgate, as cotas são canceladas. O come-cotas é a antecipação semestral do IR."}, {"id": "M2C-014", "modulo": 2, "topico": "2.1.2.2.10 Resgate e amortização", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Uma classe aberta de crédito privado enfrenta, por um evento de mercado, iliquidez excepcional dos ativos da carteira e uma onda de pedidos de resgate. Atender a todos imediatamente exigiria vender os ativos a preços muito descontados, prejudicando quem fica. Pela regulamentação, o procedimento admitido é:", "alternativas": ["declarar o fechamento temporário da classe para resgates, com divulgação de fato relevante e, se a situação persistir, convocação de assembleia para deliberar alternativas como cisão, liquidação ou resgate em ativos", "acionar o FGC para cobrir os resgates de até R$ 250 mil por cotista", "pagar os resgates em ordem de chegada, vendendo os ativos a qualquer preço até zerar a carteira", "pagar os resgates com recursos próprios do administrador, que depois é reembolsado pela classe"], "correta": 0, "explicacao": "Em situações excepcionais de iliquidez, a norma permite o fechamento da classe para resgates para proteger a igualdade entre cotistas, exigindo divulgação de fato relevante e, se o fechamento se prolongar, assembleia para decidir a solução. Prestadores não pagam resgates com recursos próprios, e fundos não têm cobertura do FGC."}, {"id": "M2C-015", "modulo": 2, "topico": "2.1.2.2.11 Distribuição", "dificuldade": "medio", "tipo": "mc", "enunciado": "Pela divisão de funções da Resolução CVM 175, a contratação, em nome do fundo, dos distribuidores das cotas é atribuição:", "alternativas": ["do auditor independente, que avalia a capacidade de venda do distribuidor", "da assembleia de cotistas, que deve aprovar cada distribuidor previamente", "do custodiante, responsável pela guarda dos ativos", "do gestor, que também contrata intermediação de operações, consultoria e classificação de risco, entre outros"], "correta": 3, "explicacao": "Na Resolução CVM 175, o gestor contrata em nome do fundo os serviços ligados à gestão e à comercialização: intermediação, distribuição de cotas, consultoria de investimentos, classificação de risco, formador de mercado e cogestão. O administrador contrata serviços como custódia, escrituração, tesouraria e auditoria."}, {"id": "M2C-016", "modulo": 2, "topico": "2.1.2.2.12 Investimento por conta e ordem", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente aplicou em um fundo por meio de uma plataforma de investimentos que atua por conta e ordem. Ao consultar o administrador, ele descobre que no registro de cotistas aparece o nome da plataforma, e não o dele. Isso ocorre porque:", "alternativas": ["a plataforma comprou as cotas para si e o cliente tem apenas um crédito contra ela", "na distribuição por conta e ordem, o distribuidor subscreve as cotas em nome próprio, por conta e ordem do cliente, e mantém um registro complementar que identifica cada investidor final", "houve erro no cadastro, pois o administrador sempre deve registrar o nome do investidor final", "o cliente cedeu suas cotas à plataforma ao aceitar os termos de uso"], "correta": 1, "explicacao": "No modelo de conta e ordem, o distribuidor aparece no registro do administrador, mas em nome dos clientes, e mantém registro complementar de cotistas por classe, identificando o investidor final. As cotas pertencem ao cliente, não ao distribuidor."}, {"id": "M2C-017", "modulo": 2, "topico": "2.1.2.2.14 Divulgação de informações", "dificuldade": "medio", "tipo": "mc", "enunciado": "O gestor de uma classe de crédito privado descobre que o principal emissor da carteira, com peso relevante no patrimônio, entrou em recuperação judicial. A conduta correta quanto à divulgação dessa informação é:", "alternativas": ["manter a informação em sigilo para não provocar resgates e perdas adicionais", "aguardar o fechamento do semestre para incluir o evento nas demonstrações contábeis", "divulgar imediatamente fato relevante de forma ampla e simultânea a todos os cotistas, pelos canais previstos na regulamentação", "avisar primeiro os maiores cotistas, para que decidam com antecedência sobre o resgate"], "correta": 2, "explicacao": "Ato ou fato que possa influenciar o valor das cotas ou a decisão de investir, permanecer ou resgatar deve ser divulgado imediatamente como fato relevante, de forma ampla e simultânea. Informar só um grupo de cotistas fere a equidade, e omitir ou adiar a divulgação viola o dever de transparência."}, {"id": "M2C-018", "modulo": 2, "topico": "2.1.2.2.17 Divulgação de cota e rentabilidade", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um profissional de uma agência prepara uma publicação para redes sociais: \"Nosso fundo multimercado rendeu 15% nos últimos 12 meses — rendimento garantido, aplique já!\". Para estar em conformidade com as regras de divulgação de rentabilidade, o material deveria:", "alternativas": ["manter o texto, desde que a rentabilidade divulgada seja a bruta de taxas", "manter a palavra \"garantido\" caso o fundo tenha superado o CDI nos últimos 12 meses", "divulgar apenas o melhor mês do período, por ser mais atrativo ao cliente", "retirar a ideia de garantia, comparar a rentabilidade com o indicador de referência no mesmo período e informar que rentabilidade passada não é garantia de rentabilidade futura e que fundos não contam com FGC"], "correta": 3, "explicacao": "Fundos não oferecem rendimento garantido. A divulgação de rentabilidade deve trazer avisos obrigatórios, como o de que rentabilidade passada não representa garantia de rentabilidade futura e de que fundos não têm garantia do administrador, do gestor ou do FGC, além de comparar com o benchmark no mesmo período. Escolher só o melhor mês é seletivo e enganoso."}, {"id": "M2C-019", "modulo": 2, "topico": "2.1.2.2.17 Divulgação de cota e rentabilidade", "dificuldade": "medio", "tipo": "mc", "enunciado": "A cota de uma classe aberta passou de R$ 10,00 para R$ 10,80 em um ano, período em que não houve come-cotas. A rentabilidade de 8% calculada pela variação da cota é:", "alternativas": ["bruta de todas as taxas e de imposto de renda", "líquida de imposto de renda, mas bruta das taxas de administração", "líquida das taxas de administração, gestão e performance, mas ainda bruta de imposto de renda", "líquida de taxas e impostos, representando exatamente o ganho no bolso do investidor"], "correta": 2, "explicacao": "As taxas de administração, gestão e performance são encargos provisionados diariamente na classe, já descontados no valor da cota. O IR é calculado por investidor (no come-cotas ou no resgate), por isso a variação da cota mostra rentabilidade líquida de taxas e bruta de IR."}, {"id": "M2C-020", "modulo": 2, "topico": "2.1.2.2.18.1 Assembleias gerais de cotistas", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um fundo tem três classes. Os prestadores de serviço querem substituir o administrador do fundo, que presta serviço a todas as classes. Essa matéria deve ser deliberada em:", "alternativas": ["reunião do conselho de administração do administrador", "assembleia geral de cotistas, por tratar de matéria comum ao fundo, com a participação dos cotistas de todas as classes", "assembleia especial de cada classe, separadamente, sem necessidade de assembleia geral", "decisão unilateral do gestor, que comunica a mudança aos cotistas"], "correta": 1, "explicacao": "A assembleia geral reúne os cotistas de todas as classes e delibera matérias comuns ao fundo, como substituição de prestador de serviço essencial, demonstrações contábeis do fundo, fusão, incorporação, cisão, transformação, liquidação e alterações da parte geral do regulamento."}, {"id": "M2C-021", "modulo": 2, "topico": "2.1.2.2.18 Assembleia de cotistas", "dificuldade": "dificil", "tipo": "mc", "enunciado": "O gestor de uma classe aberta decide reduzir a taxa de gestão de 1,5% para 1,0% ao ano. Pela Resolução CVM 175, essa alteração do regulamento:", "alternativas": ["pode ser feita independentemente de assembleia, por representar redução de taxa, devendo ser comunicada aos cotistas", "exige assembleia geral, assim como qualquer alteração de taxa", "só pode valer após aprovação expressa da CVM", "exige assembleia especial com unanimidade dos cotistas"], "correta": 0, "explicacao": "A norma permite alterar o regulamento sem assembleia em casos como redução de taxas, adequação a exigências legais ou regulatórias e atualização de dados cadastrais de prestadores de serviço, comunicando-se os cotistas. Já o aumento de taxa depende de aprovação em assembleia, pois prejudica o cotista."}, {"id": "M2C-022", "modulo": 2, "topico": "2.1.2.2.19.1 Serviços essenciais", "dificuldade": "facil", "tipo": "mc", "enunciado": "Pela Resolução CVM 175, os serviços considerados essenciais para o funcionamento de um fundo de investimento são:", "alternativas": ["administração fiduciária e gestão de recursos", "distribuição de cotas e custódia", "auditoria independente e escrituração de cotas", "consultoria de investimentos e classificação de risco"], "correta": 0, "explicacao": "Os prestadores de serviços essenciais são o administrador fiduciário e o gestor de recursos, que constituem o fundo e respondem por ele. Os demais (custódia, distribuição, auditoria, escrituração, consultoria, classificação de risco etc.) são contratados por um deles."}, {"id": "M2C-023", "modulo": 2, "topico": "2.1.2.2.20.1 Taxa de administração", "dificuldade": "facil", "tipo": "mc", "enunciado": "Uma investidora mantém, ao longo de um ano, saldo médio de R$ 200.000,00 em uma classe cuja soma das taxas de administração e de gestão é de 1,5% ao ano. O custo aproximado dessas taxas no período é de:", "alternativas": ["R$ 300,00, cobrados apenas no resgate", "R$ 30.000,00, cobrados na data de aplicação", "R$ 3.000,00, cobrados por boleto ao final do ano", "R$ 3.000,00, descontados diariamente no valor da cota"], "correta": 3, "explicacao": "As taxas de administração e de gestão são percentuais anuais sobre o patrimônio, provisionados diariamente e já refletidos no valor da cota. Custo aproximado: 1,5% × R$ 200.000 = R$ 3.000 no ano. Não há cobrança separada por boleto."}, {"id": "M2C-024", "modulo": 2, "topico": "2.1.2.2.20.4 Taxa máxima de distribuição", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente quer saber quanto do que paga ao fundo remunera a instituição que o atendeu. Na Resolução CVM 175, a informação relacionada a isso que deve constar no regulamento e nos documentos da classe é a:", "alternativas": ["taxa de performance, que remunera o distribuidor quando o fundo supera o benchmark", "taxa de custódia, que remunera o distribuidor pela guarda das cotas", "taxa máxima de distribuição, que indica o limite da remuneração destinada aos distribuidores", "taxa de ingresso, que é sempre integralmente repassada ao distribuidor"], "correta": 2, "explicacao": "A Resolução CVM 175 exige a divulgação da taxa máxima de distribuição, que dá transparência ao custo da distribuição embutido nas taxas da classe e limita a remuneração paga aos distribuidores. Performance remunera o gestor; custódia remunera o custodiante."}, {"id": "M2C-025", "modulo": 2, "topico": "2.1.2.2.20 Remuneração", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Uma classe multimercado cobra taxa de performance de 20% sobre o que exceder 100% do CDI, apurada após a dedução das demais despesas e respeitando a linha d'água. No período de apuração, o patrimônio de um cotista partiu de R$ 100.000,00 e rendeu R$ 14.000,00 (líquido das demais taxas), enquanto o CDI no período renderia R$ 10.000,00. A taxa de performance devida sobre a posição desse cotista é de:", "alternativas": ["R$ 400,00", "R$ 800,00", "R$ 2.000,00", "R$ 2.800,00"], "correta": 1, "explicacao": "A performance incide apenas sobre o que excede o benchmark: 14.000 − 10.000 = R$ 4.000; 20% × 4.000 = R$ 800. Aplicar 20% sobre todo o rendimento (R$ 2.800) ignoraria o benchmark. A linha d'água impede nova cobrança enquanto a cota não superar o valor da última cobrança."}, {"id": "M2C-026", "modulo": 2, "topico": "2.1.2.2.21 Vedações", "dificuldade": "medio", "tipo": "mc", "enunciado": "Para convencer um cliente conservador, um gerente afirma: \"Pode ficar tranquilo, o administrador deste fundo garante que você vai receber pelo menos 100% do CDI\". Essa afirmação está:", "alternativas": ["correta, pois o FGC cobre a diferença caso o fundo renda menos que o CDI", "incorreta, pois é vedado aos prestadores de serviços essenciais prometer ou garantir rendimento predeterminado aos cotistas", "correta, desde que a garantia conste em contrato à parte entre o administrador e o cliente", "correta para fundos de renda fixa, que são obrigados a render ao menos o CDI"], "correta": 1, "explicacao": "Entre as vedações aos prestadores de serviços essenciais estão garantir rendimento predeterminado aos cotistas, prestar fiança, aval ou coobrigação e receber depósito em conta corrente. Fundos de renda fixa podem render abaixo do CDI, e fundos não têm cobertura do FGC."}, {"id": "M2C-027", "modulo": 2, "topico": "2.1.2.2.24 Encargos", "dificuldade": "medio", "tipo": "mc", "enunciado": "Ao analisar as despesas debitadas de uma classe de fundo, qual das abaixo NÃO pode ser considerada encargo da classe?", "alternativas": ["Salários e aluguel do escritório da gestora", "Honorários do auditor independente", "Taxas de corretagem e emolumentos das operações da carteira", "Taxa de fiscalização devida à CVM"], "correta": 0, "explicacao": "Encargos são despesas que podem ser debitadas diretamente da classe, como taxas e impostos, honorários do auditor, corretagem, emolumentos e custódia, além das próprias taxas de administração e gestão. Despesas operacionais próprias da gestora, como salários e aluguel, são cobertas pela remuneração que ela recebe."}, {"id": "M2C-028", "modulo": 2, "topico": "2.1.2.2.25.1 Responsabilidade limitada de cotistas", "dificuldade": "medio", "tipo": "mc", "enunciado": "Ao ver a expressão \"Responsabilidade Limitada\" na denominação de uma classe, um cliente pergunta o que isso significa para ele. A explicação correta é:", "alternativas": ["o administrador garante que o cotista não terá prejuízo superior a 10% do valor aplicado", "a classe só pode investir em ativos de renda fixa de baixo risco", "o regulamento limita a responsabilidade do cotista ao valor por ele subscrito, de modo que ele não precisará aportar recursos adicionais caso o patrimônio da classe fique negativo", "o cotista pode perder no máximo o rendimento, sendo o principal garantido"], "correta": 2, "explicacao": "A Resolução CVM 175 permite que o regulamento limite a responsabilidade do cotista ao valor de suas cotas subscritas, e nesse caso a denominação deve conter a expressão \"Responsabilidade Limitada\". O cotista pode perder todo o valor investido, mas não é chamado a cobrir patrimônio negativo."}, {"id": "M2C-029", "modulo": 2, "topico": "2.1.2.2.25.3 Patrimônio líquido negativo", "dificuldade": "dificil", "tipo": "mc", "enunciado": "O administrador verifica que o patrimônio líquido de uma classe com responsabilidade limitada ficou negativo após perdas com derivativos. Entre as providências que devem ser tomadas imediatamente, está:", "alternativas": ["cobrar dos cotistas aportes adicionais proporcionais às cotas, já que a limitação de responsabilidade deixa de valer", "continuar aceitando aplicações para recompor o patrimônio com o dinheiro dos novos cotistas", "pagar primeiro os resgates pendentes dos maiores cotistas, para reduzir o passivo", "fechar a classe para resgates, não realizar amortizações, suspender novas subscrições, comunicar o gestor e divulgar fato relevante, preparando com o gestor um plano de resolução do patrimônio negativo"], "correta": 3, "explicacao": "Constatado patrimônio negativo, a classe deve ser fechada para resgates e amortizações e deixar de aceitar subscrições, com comunicação ao gestor e divulgação de fato relevante. Em seguida elabora-se, com o gestor, um plano de resolução a ser submetido à assembleia de cotistas. Captar novos recursos para cobrir o rombo prejudicaria os novos cotistas, e a limitação de responsabilidade continua valendo."}, {"id": "M2C-030", "modulo": 2, "topico": "2.1.2.2.25.4 Insolvência da classe de cotas", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Uma classe com responsabilidade limitada permanece com patrimônio líquido negativo, e os cotistas não aprovam aporte de recursos nem outra solução. Sobre a insolvência dessa classe, é correto afirmar que:", "alternativas": ["a insolvência pode ser requerida judicialmente pelos credores, por deliberação dos próprios cotistas ou pela CVM, aplicando-se as regras de insolvência civil", "a classe não pode ser declarada insolvente, pois a responsabilidade dos cotistas é limitada", "a insolvência é declarada automaticamente pelo administrador, sem participação do Poder Judiciário", "a insolvência da classe implica a falência do administrador e do gestor"], "correta": 0, "explicacao": "O Código Civil, com a redação da Lei de Liberdade Econômica, e a Resolução CVM 175 permitem que a classe com responsabilidade limitada e patrimônio negativo tenha a insolvência declarada judicialmente, a pedido dos credores, dos cotistas ou da CVM. A insolvência é da classe e não se estende aos prestadores de serviço."}, {"id": "M2C-031", "modulo": 2, "topico": "2.1.2.3.4 FIF – Distribuição e subscrição", "dificuldade": "medio", "tipo": "mc", "enunciado": "No ingresso de um cliente em uma classe de FIF destinada ao público em geral, o distribuidor apresenta um documento a ser assinado. Por meio do termo de adesão e ciência de risco, o investidor atesta que:", "alternativas": ["renuncia ao direito de resgate durante o primeiro ano", "teve acesso ao regulamento e à lâmina, conhece os fatores de risco da classe e sabe que não há garantia contra perdas", "recebe garantia do administrador de que não perderá o capital investido", "autoriza o gestor a investir em qualquer ativo, mesmo fora da política de investimento"], "correta": 1, "explicacao": "O termo de adesão e ciência de risco é exigido no ingresso: o investidor declara ter acesso ao regulamento e à lâmina (quando houver), ter ciência dos riscos e da ausência de garantia contra perdas e, se for o caso, da possibilidade de patrimônio líquido negativo e de aportes adicionais."}, {"id": "M2C-032", "modulo": 2, "topico": "2.1.2.3.5.3 FIF – Limites para cada emissor", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Uma classe de FIF destinada ao público em geral tem patrimônio de R$ 50 milhões. Considerando os limites por emissor da regulamentação, qual composição respeita os limites?", "alternativas": ["R$ 8 milhões em ações de uma única companhia aberta e R$ 42 milhões em títulos públicos federais", "R$ 20 milhões em CDB de um único banco e R$ 30 milhões em títulos públicos federais", "R$ 5 milhões em notas comerciais de uma empresa fechada e R$ 45 milhões em títulos públicos federais", "R$ 30 milhões em títulos públicos federais, R$ 10 milhões em CDB de um único banco e R$ 5 milhões em ações de uma companhia aberta"], "correta": 3, "explicacao": "Os limites por emissor são, em regra: até 20% para instituição financeira, até 10% para companhia aberta, até 5% para pessoa física ou jurídica de direito privado que não seja companhia aberta nem instituição financeira, sem limite para a União. Com PL de R$ 50 milhões: banco até R$ 10 milhões, companhia aberta até R$ 5 milhões, empresa fechada até R$ 2,5 milhões. Só a primeira composição respeita todos."}, {"id": "M2C-033", "modulo": 2, "topico": "2.1.2.3.6.1 Fundos de renda fixa", "dificuldade": "facil", "tipo": "mc", "enunciado": "Uma classe de FIF classificada como \"Renda Fixa\" deve ter como principal fator de risco a variação da taxa de juros, de índice de preços ou de ambos, mantendo nesses ativos no mínimo:", "alternativas": ["50% do patrimônio", "67% do patrimônio", "80% do patrimônio", "95% do patrimônio"], "correta": 2, "explicacao": "As classes de renda fixa devem ter no mínimo 80% da carteira em ativos relacionados à variação da taxa de juros, de índice de preços ou de ambos. O percentual de 67% é o mínimo das classes de ações; 95% aparece em classes referenciadas e em classes de investimento em cotas."}, {"id": "M2C-034", "modulo": 2, "topico": "2.1.2.3.6.2 Fundo de ações", "dificuldade": "facil", "tipo": "mc", "enunciado": "Para ser classificada como \"Ações\", uma classe de FIF deve manter, no mínimo, que percentual do patrimônio em ações e ativos relacionados (como bônus de subscrição, recibos, cotas de fundos de ações e BDR de ações)?", "alternativas": ["67%", "95%", "51%", "80%"], "correta": 0, "explicacao": "As classes de ações devem manter no mínimo 67% do patrimônio em ações negociadas em mercado organizado e ativos relacionados. Esse mesmo patamar é relevante para a tributação de fundos de ações (15% no resgate, sem come-cotas)."}, {"id": "M2C-035", "modulo": 2, "topico": "2.1.2.3.6.3 Fundos cambiais", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma empresa importadora terá de pagar fornecedores em dólares daqui a seis meses e quer, com parte do caixa, se proteger da alta da moeda americana por meio de um fundo. A classe mais aderente é a:", "alternativas": ["de ações, que mantém no mínimo 67% em ações de exportadoras", "de renda fixa referenciada DI, que acompanha a taxa de juros doméstica", "cambial, que mantém no mínimo 80% da carteira em ativos relacionados à variação da moeda estrangeira ou do cupom cambial", "multimercado de retorno absoluto, que precisa ficar comprada em dólar o tempo todo"], "correta": 2, "explicacao": "A classe cambial tem como principal fator de risco a variação de moeda estrangeira (ou do cupom cambial), com no mínimo 80% da carteira em ativos relacionados. Por isso serve como proteção (hedge) para quem tem compromissos em moeda estrangeira. Um multimercado não tem obrigação de manter exposição permanente ao dólar."}, {"id": "M2C-036", "modulo": 2, "topico": "2.1.2.3.6.5 Fundos Incentivados em Infraestrutura (FI-Infra)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente pessoa física de alta renda quer aplicar em projetos de infraestrutura com benefício fiscal e liquidez em bolsa. O gerente apresenta um FI-Infra. Sobre esse produto, é correto afirmar que:", "alternativas": ["é tributado pela tabela regressiva com come-cotas em maio e novembro", "aplica majoritariamente em debêntures incentivadas de projetos de infraestrutura (Lei 12.431), e os rendimentos são isentos de IR para a pessoa física", "aplica em ações de concessionárias, com IR de 15% no resgate e come-cotas semestral", "tem garantia do FGC por investir em projetos prioritários do governo"], "correta": 1, "explicacao": "O FI-Infra aplica a maior parte do patrimônio (mínimo de 85%, após o período inicial) em debêntures incentivadas emitidas para financiar projetos de infraestrutura considerados prioritários, nos termos da Lei 12.431. Para a pessoa física, os rendimentos têm alíquota zero de IR. Não há cobertura do FGC."}, {"id": "M2C-037", "modulo": 2, "topico": "2.1.2.3.6.7 Concentração em crédito privado", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma classe de renda fixa pretende manter mais de 50% do patrimônio em debêntures, CDB e outros títulos de emissores privados. Por essa característica, ela deve:", "alternativas": ["ser obrigatoriamente reclassificada como multimercado", "ser destinada exclusivamente a investidores profissionais", "contratar seguro de crédito para todos os ativos da carteira", "incluir a expressão \"Crédito Privado\" na denominação e alertar os investidores sobre o risco de perdas por inadimplência dos emissores"], "correta": 3, "explicacao": "Classes que podem aplicar mais de 50% do patrimônio em ativos de crédito privado devem trazer o sufixo \"Crédito Privado\" no nome e destacar o risco de crédito nos documentos e materiais. A regra não muda o tipo da classe nem impõe público-alvo específico."}, {"id": "M2C-038", "modulo": 2, "topico": "2.1.2.3.7 Investimento em cotas de outros fundos de investimento financeiro", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma classe estruturada como \"investimento em cotas\" (FIC) seleciona fundos de diversos gestores. Para manter essa característica, ela deve aplicar em cotas de outras classes de fundos no mínimo:", "alternativas": ["100% do patrimônio, sendo vedado manter qualquer valor em caixa", "67% do patrimônio, como nas classes de ações", "50% do patrimônio, com o restante livre para qualquer ativo", "95% do patrimônio, podendo manter o restante em ativos de liquidez, como títulos públicos federais e operações compromissadas"], "correta": 3, "explicacao": "As classes de investimento em cotas devem manter no mínimo 95% do patrimônio em cotas de outras classes. A parcela restante pode ficar em ativos de liquidez, como títulos públicos federais, títulos de renda fixa de instituições financeiras e compromissadas, para atender a resgates e despesas."}, {"id": "M2C-039", "modulo": 2, "topico": "2.1.3.1 Aplicação das normas tributárias", "dificuldade": "medio", "tipo": "mc", "enunciado": "Para definir se a classe de um fundo de renda fixa é tributada como \"longo prazo\" ou \"curto prazo\" no imposto de renda, o critério utilizado é:", "alternativas": ["o nome da classe no regulamento, independentemente da carteira", "o prazo médio da carteira: acima de 365 dias, longo prazo; igual ou inferior a 365 dias, curto prazo", "o valor do patrimônio da classe: acima de R$ 100 milhões, longo prazo", "o tempo que cada cotista permanece aplicado: acima de 2 anos, longo prazo"], "correta": 1, "explicacao": "A classificação tributária depende da composição da carteira: classes com prazo médio superior a 365 dias são de longo prazo (come-cotas de 15% e tabela até 15%); com prazo médio igual ou inferior a 365 dias, curto prazo (come-cotas de 20%; 22,5% até 180 dias e 20% depois). O prazo de permanência do cotista define a alíquota da tabela regressiva, não a classificação."}, {"id": "M2C-040", "modulo": 2, "topico": "2.1.3.2.1 Imposto sobre Operações Financeiras (IOF)", "dificuldade": "facil", "tipo": "mc", "enunciado": "Sobre a incidência do IOF em resgates de fundos de investimento, é correto afirmar que:", "alternativas": ["incide sobre o valor aplicado, no momento da aplicação", "incide à alíquota fixa de 0,38% sobre o valor total resgatado, qualquer que seja o prazo", "incide de forma regressiva sobre o rendimento nos resgates feitos nos primeiros 29 dias, zerando a partir do 30º dia, e não incide em classes de ações", "incide apenas sobre resgates feitos após 30 dias, para desestimular a permanência"], "correta": 2, "explicacao": "O IOF sobre aplicações financeiras é regressivo: começa em 96% do rendimento no 1º dia e chega a zero no 30º dia. Fundos de ações não sofrem esse IOF. A alíquota de 0,38% é a do IOF sobre operações de câmbio/crédito, não sobre resgate de fundos."}, {"id": "M2C-041", "modulo": 2, "topico": "2.1.3.2.1 Imposto sobre Operações Financeiras (IOF)", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Um cliente resgatou uma aplicação em classe de renda fixa no 15º dia, com rendimento bruto de R$ 1.000,00. Considere IOF de 50% do rendimento para esse prazo e IR de 22,5%, calculado sobre o rendimento já deduzido do IOF. O rendimento líquido do cliente é de:", "alternativas": ["R$ 387,50", "R$ 500,00", "R$ 275,00", "R$ 775,00"], "correta": 0, "explicacao": "IOF = 50% × 1.000 = R$ 500. Base do IR = 1.000 − 500 = R$ 500; IR = 22,5% × 500 = R$ 112,50. Líquido = 1.000 − 500 − 112,50 = R$ 387,50. Calcular o IR sobre o rendimento bruto (R$ 225) e somá-lo ao IOF resultaria em R$ 275, o que está errado porque o IOF é deduzido da base do IR."}, {"id": "M2C-042", "modulo": 2, "topico": "2.1.3.2.2 Imposto de Renda (IR) – come-cotas", "dificuldade": "facil", "tipo": "mc", "enunciado": "Uma investidora aplicou R$ 50.000,00 em janeiro em uma classe de renda fixa de longo prazo. No último dia útil de maio, sua posição valia R$ 52.000,00. O valor retido a título de come-cotas é de:", "alternativas": ["R$ 7.800,00, equivalente a 15% sobre o saldo de R$ 52.000,00", "R$ 400,00, equivalente a 20% sobre o rendimento de R$ 2.000,00", "R$ 450,00, equivalente a 22,5% sobre o rendimento de R$ 2.000,00", "R$ 300,00, equivalente a 15% sobre o rendimento de R$ 2.000,00"], "correta": 3, "explicacao": "Em classes de longo prazo, o come-cotas usa a alíquota de 15% sobre o rendimento do período: 52.000 − 50.000 = 2.000; 15% × 2.000 = R$ 300. A diferença para a alíquota da tabela regressiva (22,5% ou 20%, conforme o prazo) é cobrada no resgate."}, {"id": "M2C-043", "modulo": 2, "topico": "2.1.3.2.2 Imposto de Renda (IR) – resgate", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Um investidor aplicou R$ 100.000,00 em uma classe de renda fixa de longo prazo. No come-cotas de maio, o rendimento acumulado era de R$ 4.000,00 e foram retidos R$ 600,00. Ele resgatou tudo cerca de 270 dias após a aplicação, com rendimento total no período de R$ 9.000,00. O IR complementar retido no resgate é de:", "alternativas": ["R$ 1.425,00", "R$ 1.800,00", "R$ 1.200,00", "R$ 750,00"], "correta": 2, "explicacao": "Com 270 dias de aplicação, a alíquota da tabela regressiva é 20% (181 a 360 dias). IR total = 20% × 9.000 = R$ 1.800. Já foram antecipados R$ 600 no come-cotas, logo o complemento é 1.800 − 600 = R$ 1.200. Cobrar R$ 1.800 no resgate ignoraria a antecipação."}, {"id": "M2C-044", "modulo": 2, "topico": "2.1.3.2.2 Imposto de Renda (IR) – resgate", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Uma investidora resgatou uma classe de renda fixa de longo prazo após 800 dias de aplicação. O rendimento total do período foi de R$ 20.000,00, e os come-cotas já haviam retido, ao todo, R$ 2.400,00 (15% sobre R$ 16.000,00). O IR complementar no resgate é de:", "alternativas": ["R$ 1.100,00", "R$ 600,00", "zero, pois após 720 dias o IR é integralmente pago no come-cotas", "R$ 3.000,00"], "correta": 1, "explicacao": "Acima de 720 dias, a alíquota é de 15%. IR total = 15% × 20.000 = R$ 3.000; já foram retidos R$ 2.400; complemento = R$ 600, que corresponde a 15% sobre o rendimento ainda não tributado (R$ 4.000). Mesmo na alíquota mínima, o rendimento gerado após o último come-cotas é tributado no resgate."}, {"id": "M2C-045", "modulo": 2, "topico": "2.1.3.2.2 Imposto de Renda (IR) – resgate", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente aplicou em uma classe de renda fixa de curto prazo e resgatou após 200 dias. O rendimento total foi de R$ 5.000,00, dos quais R$ 3.000,00 já haviam sofrido come-cotas de 20% (R$ 600,00). O IR complementar no resgate é de:", "alternativas": ["R$ 400,00", "R$ 525,00", "R$ 1.000,00", "R$ 1.125,00"], "correta": 0, "explicacao": "Em classe de curto prazo, a alíquota é de 22,5% até 180 dias e 20% acima de 180 dias. Com 200 dias: IR total = 20% × 5.000 = R$ 1.000; menos R$ 600 já retidos = R$ 400. Usar 22,5% (total de R$ 1.125 e complemento de R$ 525) seria o correto apenas para resgate em até 180 dias."}, {"id": "M2C-046", "modulo": 2, "topico": "2.1.3.2.2 Imposto de Renda (IR) – resgate", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Um investidor aplicou em julho em uma classe de renda fixa de longo prazo. No come-cotas de novembro, retiveram-se R$ 150,00 (15% sobre R$ 1.000,00 de rendimento). Ele resgatou tudo em dezembro, com 160 dias de aplicação e rendimento total de R$ 1.200,00. O IR complementar no resgate é de:", "alternativas": ["R$ 90,00", "R$ 120,00", "R$ 30,00", "R$ 270,00"], "correta": 1, "explicacao": "Com 160 dias, a alíquota é de 22,5%. IR total = 22,5% × 1.200 = R$ 270; já foram antecipados R$ 150; complemento = R$ 120. O come-cotas de longo prazo usa 15%, mas o investidor que resgata antes de 720 dias paga a diferença até a alíquota correspondente ao seu prazo."}, {"id": "M2C-047", "modulo": 2, "topico": "2.1.3.2.2 Imposto de Renda (IR) – fundos de ações", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente resgatou R$ 18.000,00 de uma classe de ações, com lucro de R$ 6.000,00, após 8 meses de aplicação. Ele argumenta que, como vendeu menos de R$ 20 mil no mês, não deveria pagar IR. O correto é que:", "alternativas": ["incide IR de 15% sobre o lucro (R$ 900,00), retido no resgate, pois a isenção de R$ 20 mil mensais vale para venda direta de ações no mercado à vista, não para fundos", "incide IR de 15% sobre o valor resgatado (R$ 2.700,00)", "não há IR, pois a isenção de R$ 20 mil se aplica a qualquer investimento em renda variável", "incide IR de 20% sobre o lucro (R$ 1.200,00), pois o resgate ocorreu antes de 1 ano"], "correta": 0, "explicacao": "Classes de ações são tributadas em 15% sobre o ganho no resgate, independentemente do prazo, sem come-cotas: 15% × 6.000 = R$ 900. A isenção para vendas de até R$ 20 mil por mês vale apenas para alienação direta de ações no mercado à vista pela pessoa física."}, {"id": "M2C-048", "modulo": 2, "topico": "2.1.4.1 FII – Ambiente de negociação e regime de cotas", "dificuldade": "facil", "tipo": "mc", "enunciado": "Um cliente que tem cotas de um fundo imobiliário listado precisa do dinheiro e pede ao gerente o resgate das cotas. O gerente deve explicar que:", "alternativas": ["as cotas de FII não podem ser vendidas antes do fim do prazo do fundo", "o resgate só pode ser feito no aniversário da aplicação", "o resgate é feito pelo administrador em D+1, pela cota patrimonial", "os FII são constituídos como condomínio fechado, sem resgate a pedido; para sair, o cliente deve vender as cotas no mercado secundário (bolsa)"], "correta": 3, "explicacao": "FII são fundos fechados: não há resgate a pedido do cotista. A liquidez vem da venda das cotas na bolsa (ou balcão organizado), a preço de mercado, que pode ser diferente do valor patrimonial."}, {"id": "M2C-049", "modulo": 2, "topico": "2.1.4.2 FII – Risco de liquidez, crédito, vacância e composição de ativos", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um FII de lajes corporativas perde o inquilino que ocupava 40% da área locável dos imóveis. O efeito mais direto desse evento é:", "alternativas": ["nenhum efeito, pois o administrador garante o aluguel dos espaços vagos", "aumento do risco de crédito dos CRI da carteira", "aumento da vacância, com queda das receitas de aluguel e, consequentemente, dos rendimentos distribuídos aos cotistas", "aumento automático dos rendimentos, porque o fundo deixa de pagar despesas de manutenção"], "correta": 2, "explicacao": "Vacância é a parcela da área (física) ou da receita potencial (financeira) não ocupada ou não recebida. A saída de um inquilino relevante reduz as receitas e, portanto, os rendimentos. O fundo ainda costuma arcar com condomínio e IPTU das áreas vagas."}, {"id": "M2C-050", "modulo": 2, "topico": "2.1.4.3 FII – Dinâmica de dividendos e suas regras", "dificuldade": "medio", "tipo": "mc", "enunciado": "Sobre a distribuição de resultados dos fundos imobiliários, é correto afirmar que:", "alternativas": ["o FII deve distribuir no mínimo 95% dos lucros auferidos, apurados segundo o regime de caixa, com base em balanço semestral, sendo comum a distribuição mensal antecipada", "o FII distribui apenas o que o gestor decidir, sem percentual mínimo", "os rendimentos dos FII são garantidos pelo administrador em valor fixo mensal", "o FII deve distribuir 100% do lucro contábil apurado por competência, uma vez por ano"], "correta": 0, "explicacao": "Pela Lei 8.668/1993, o FII deve distribuir no mínimo 95% dos lucros apurados pelo regime de caixa, com base em balanço semestral (30 de junho e 31 de dezembro). Na prática, muitos fundos antecipam a distribuição mensalmente. Os rendimentos variam conforme as receitas e não são garantidos."}, {"id": "M2C-051", "modulo": 2, "topico": "2.1.4.5 FII – Fundos de tijolo, fundos de papel e híbridos", "dificuldade": "facil", "tipo": "mc", "enunciado": "Um cliente quer um FII cuja renda venha principalmente de aluguéis de galpões logísticos e shoppings. Ele está procurando um fundo de:", "alternativas": ["papel, que investe em títulos como CRI e LCI", "renda fixa, que investe em títulos públicos atrelados ao IPCA", "fundos (FoF), que investe exclusivamente em cotas de outros FII", "tijolo, que investe diretamente em imóveis físicos e obtém renda de locação"], "correta": 3, "explicacao": "FII de tijolo investem em imóveis físicos (lajes, galpões, shoppings, agências) e têm receita de aluguéis, com riscos de vacância e inadimplência dos inquilinos. FII de papel investem em títulos imobiliários, como CRI, LCI e LH, com receita de juros e correção."}, {"id": "M2C-052", "modulo": 2, "topico": "2.1.4.6 FII – Tributação e custos", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um investidor pessoa física detém 12% das cotas de um FII listado em bolsa e com muitos cotistas. Ele pergunta se os rendimentos mensais que recebe são isentos de IR. A resposta correta é:", "alternativas": ["sim; rendimentos de FII são isentos para qualquer pessoa física, independentemente da participação", "não; a isenção para a pessoa física exige, entre outros requisitos, que ela detenha menos de 10% das cotas do fundo, e nesse caso os rendimentos sofrem retenção de IR de 20%", "sim, desde que ele não venda as cotas por pelo menos 5 anos", "não; rendimentos de FII seguem a tabela regressiva de renda fixa"], "correta": 1, "explicacao": "A isenção dos rendimentos de FII para pessoas físicas depende de requisitos legais: cotas negociadas exclusivamente em bolsa ou balcão organizado, número mínimo de cotistas e participação do cotista inferior a 10% das cotas e dos rendimentos, entre outros. Quem não cumpre os requisitos sofre retenção de 20% sobre os rendimentos."}, {"id": "M2C-053", "modulo": 2, "topico": "2.1.4.6 FII – Tributação e custos", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um investidor comprou 1.000 cotas de um FII a R$ 100,00 e, meses depois, vendeu todas a R$ 110,00, em operação comum. No período, recebeu R$ 800,00 de rendimentos, cumprindo os requisitos de isenção. Desconsiderando custos de corretagem, o IR devido é de:", "alternativas": ["zero, pois o valor vendido no mês é inferior a R$ 20 mil por cota", "R$ 2.160,00, pois ganho e rendimentos são tributados juntos a 20%", "R$ 2.000,00 sobre o ganho de capital, recolhido pelo próprio investidor via DARF; os rendimentos são isentos", "R$ 1.500,00 sobre o ganho de capital (15%) e R$ 160,00 sobre os rendimentos"], "correta": 2, "explicacao": "O ganho na venda de cotas de FII é tributado a 20%: (110 − 100) × 1.000 = R$ 10.000; 20% × 10.000 = R$ 2.000, recolhido via DARF até o último dia útil do mês seguinte. Os rendimentos, cumpridos os requisitos, são isentos. Não existe isenção de R$ 20 mil para venda de cotas de FII."}, {"id": "M2C-054", "modulo": 2, "topico": "2.1.4.6 FII – Tributação e custos", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Em março, um investidor teve prejuízo de R$ 3.000,00 na venda de cotas de um FII. Em maio, teve lucro de R$ 8.000,00 na venda de cotas de outro FII e, no mesmo mês, lucro de R$ 5.000,00 em ações (operações comuns, vendas acima de R$ 20 mil). Considerando a compensação permitida, o IR devido sobre as operações com FII em maio é de:", "alternativas": ["R$ 1.600,00, pois prejuízos de FII não podem ser compensados", "R$ 750,00, pois após a compensação aplica-se a alíquota de 15%", "zero, pois o prejuízo de FII pode ser compensado com o lucro em ações", "R$ 1.000,00, pois o prejuízo com FII é compensado apenas com ganhos em FII: 20% × (8.000 − 3.000)"], "correta": 3, "explicacao": "Perdas em FII só podem ser compensadas com ganhos em operações com cotas de FII. Base em maio: 8.000 − 3.000 = R$ 5.000; IR = 20% × 5.000 = R$ 1.000. O lucro em ações é apurado separadamente, com alíquota de 15%, e não absorve o prejuízo dos FII."}, {"id": "M2D-001", "modulo": 2, "topico": "2.2.1.1 PGBL (definição, público-alvo, características e utilizações)", "dificuldade": "facil", "tipo": "mc", "enunciado": "Um cliente assalariado, que contribui para o INSS e faz a declaração completa do Imposto de Renda, quer começar a poupar para a aposentadoria e aproveitar algum benefício fiscal já na declaração anual. O plano de previdência mais adequado ao perfil dele é o:", "alternativas": ["VGBL, porque permite deduzir as contribuições e, no resgate, o IR incide apenas sobre os rendimentos", "PGBL, porque as contribuições podem ser deduzidas da base de cálculo do IR até o limite de 12% da renda bruta tributável", "VGBL, porque as contribuições podem ser deduzidas da base de cálculo do IR até o limite de 12% da renda bruta tributável", "PGBL, porque o valor acumulado fica isento de Imposto de Renda no momento do resgate ou do recebimento da renda"], "correta": 1, "explicacao": "O PGBL é indicado para quem faz a declaração completa e contribui para a previdência oficial, pois permite deduzir as contribuições até 12% da renda bruta tributável. Não há isenção: o benefício é um diferimento, já que no resgate o IR incide sobre o valor total (contribuições + rendimentos). O VGBL não permite dedução."}, {"id": "M2D-002", "modulo": 2, "topico": "2.2.1.1 PGBL (definição, público-alvo, características e utilizações)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma médica tem renda bruta tributável anual de R$ 200.000,00, contribui para o INSS e utiliza o modelo completo da declaração de IR. O valor máximo de contribuições a PGBL que ela poderá deduzir da base de cálculo no ano é de:", "alternativas": ["R$ 20.000,00", "R$ 12.000,00", "R$ 24.000,00", "R$ 30.000,00"], "correta": 2, "explicacao": "O limite de dedução das contribuições ao PGBL é de 12% da renda bruta tributável: 12% × R$ 200.000,00 = R$ 24.000,00. Valores aportados acima desse limite não geram dedução e, mesmo assim, serão tributados sobre o total no resgate do PGBL."}, {"id": "M2D-003", "modulo": 2, "topico": "2.2.1.1 PGBL (definição, público-alvo, características e utilizações)", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Um cliente com renda bruta tributável de R$ 100.000,00 no ano, sujeito à alíquota marginal de 27,5%, faz a declaração completa, contribui para o INSS e aportou R$ 12.000,00 em PGBL. Qual é o efeito aproximado desse aporte na declaração e qual é a natureza desse benefício?", "alternativas": ["Redução de cerca de R$ 3.300,00 no IR devido no ano, que é um diferimento: o valor total será tributado no resgate ou no recebimento da renda", "Redução de cerca de R$ 3.300,00 no IR devido no ano, que é uma isenção definitiva, pois o PGBL não sofre IR no resgate", "Redução de R$ 12.000,00 no IR devido, já que toda a contribuição é abatida diretamente do imposto a pagar", "Redução de cerca de R$ 1.800,00 no IR devido, pois a dedução do PGBL é calculada sempre pela alíquota de 15%"], "correta": 0, "explicacao": "A dedução reduz a base de cálculo em R$ 12.000,00 (exatamente 12% da renda). Como a alíquota marginal é 27,5%, o imposto cai cerca de 27,5% × 12.000 = R$ 3.300,00. Trata-se de diferimento: o IR que deixou de ser pago agora será cobrado no resgate, sobre o total acumulado. A contribuição abate a base, não o imposto."}, {"id": "M2D-004", "modulo": 2, "topico": "2.2.1.1 PGBL (definição, público-alvo, características e utilizações)", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Um profissional autônomo faz a declaração completa do IR, mas não contribui para o INSS nem para regime próprio de previdência. Ele pergunta se pode deduzir as contribuições feitas a um PGBL. A resposta correta é:", "alternativas": ["Sim, mas o limite de dedução é reduzido para 6% da renda bruta tributável para quem não contribui ao INSS", "Sim, pois basta utilizar o modelo completo da declaração para deduzir até 12% da renda bruta tributável", "Não, pois autônomos só podem contratar VGBL, já que o PGBL é exclusivo para trabalhadores com carteira assinada", "Não, pois a dedução das contribuições ao PGBL está condicionada a que ele também contribua para o regime geral ou para regime próprio de previdência"], "correta": 3, "explicacao": "Para deduzir as contribuições ao PGBL, a pessoa precisa usar a declaração completa e também contribuir para a previdência oficial (regime geral ou próprio). Sem essa contribuição, o benefício fiscal não se aplica. Nada impede autônomos de contratarem PGBL, e não existe limite reduzido de 6%."}, {"id": "M2D-005", "modulo": 2, "topico": "2.2.1.2 VGBL (definição, público-alvo, principais características e utilizações)", "dificuldade": "facil", "tipo": "mc", "enunciado": "Uma cliente aposentada faz a declaração simplificada do Imposto de Renda e quer complementar sua reserva para o futuro com um plano de previdência. Qual plano tende a ser mais adequado e por quê?", "alternativas": ["VGBL, pois ela não aproveitaria a dedução do PGBL e, no VGBL, o IR do resgate incide apenas sobre os rendimentos", "PGBL, pois na declaração simplificada a dedução de 12% é aplicada automaticamente sobre as contribuições", "VGBL, pois o resgate é isento de IR para quem faz a declaração simplificada", "PGBL, pois o IR do resgate incide apenas sobre os rendimentos, e não sobre o valor total"], "correta": 0, "explicacao": "Quem faz a declaração simplificada (ou é isento) não aproveita a dedução das contribuições ao PGBL. Nesse caso, o VGBL é mais eficiente, porque no resgate o IR incide apenas sobre os rendimentos. No PGBL, o IR incidiria sobre todo o valor resgatado sem que tenha havido dedução anterior."}, {"id": "M2D-006", "modulo": 2, "topico": "2.2.1.2 VGBL (definição, público-alvo, principais características e utilizações)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente que faz a declaração completa e contribui para o INSS já aportou em PGBL o equivalente a 12% da sua renda bruta tributável neste ano. Ele quer aplicar mais R$ 30.000,00 em previdência. A recomendação mais adequada é:", "alternativas": ["Aplicar o excedente em PGBL de outra seguradora, pois o limite de dedução de 12% é calculado por instituição", "Aplicar o excedente no mesmo PGBL, pois o limite de 12% vale apenas para o primeiro plano contratado", "Aplicar o excedente em VGBL, pois aportes acima do limite de dedução não gerariam benefício fiscal no PGBL e seriam tributados integralmente no resgate", "Aguardar o próximo ano, pois é vedado aportar em previdência valores acima de 12% da renda bruta"], "correta": 2, "explicacao": "O limite de 12% é global (soma de todos os PGBLs e contribuições dedutíveis), não por instituição. Aportes além do limite são permitidos, mas no PGBL não seriam deduzidos e ainda seriam tributados sobre o valor total no resgate. Por isso, o excedente costuma ir para VGBL, onde o IR incide só sobre os rendimentos."}, {"id": "M2D-007", "modulo": 2, "topico": "2.2.1 Modalidades de planos (PGBL e VGBL)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Dois clientes aplicaram, cada um, R$ 100.000,00 em previdência no regime regressivo há mais de 10 anos: um em PGBL e outro em VGBL. Hoje, cada plano tem saldo de R$ 160.000,00 e ambos vão resgatar tudo. O IR devido no PGBL e no VGBL será, respectivamente:", "alternativas": ["R$ 6.000,00 e R$ 16.000,00", "R$ 16.000,00 e R$ 6.000,00", "R$ 16.000,00 e R$ 16.000,00", "R$ 6.000,00 e R$ 6.000,00"], "correta": 1, "explicacao": "Acima de 10 anos, a alíquota do regime regressivo é de 10%. No PGBL, a base é o valor total resgatado: 10% × 160.000 = R$ 16.000,00. No VGBL, a base é apenas o rendimento: 10% × (160.000 − 100.000) = R$ 6.000,00. A diferença compensa, em parte, o fato de o PGBL ter permitido a dedução das contribuições."}, {"id": "M2D-008", "modulo": 2, "topico": "2.2.1 Modalidades de planos (PGBL e VGBL)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Sobre os planos PGBL e VGBL, assinale a afirmação correta:", "alternativas": ["É possível fazer portabilidade de um PGBL para um VGBL sem incidência de IR", "Durante a fase de acumulação, nenhum dos dois sofre a cobrança semestral de come-cotas", "Os dois produtos são registrados e fiscalizados pela CVM, por investirem em fundos", "O VGBL é garantido pelo FGC até R$ 250 mil por CPF, por ser um seguro de vida"], "correta": 1, "explicacao": "Os recursos de previdência são aplicados em fundos especialmente constituídos (FIE) e não sofrem come-cotas; o IR só incide no resgate ou no recebimento da renda. Previdência não tem cobertura do FGC, a portabilidade só é admitida entre planos da mesma natureza (PGBL para PGBL, VGBL para VGBL) e os planos são regulados e fiscalizados pela SUSEP."}, {"id": "M2D-009", "modulo": 2, "topico": "2.2.1 Modalidades de planos (PGBL e VGBL)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma cliente quer deixar recursos para os filhos de forma que eles tenham liquidez rápida caso ela venha a falecer. Ela pergunta como funciona o pagamento de um VGBL em caso de morte do participante. A explicação correta é:", "alternativas": ["Os recursos só podem ser pagos ao cônjuge, sendo vedada a indicação dos filhos como beneficiários", "Os recursos obrigatoriamente integram o inventário e só são liberados após a partilha determinada pelo juiz", "Em regra, os recursos são pagos diretamente aos beneficiários indicados no plano, sem necessidade de aguardar a conclusão do inventário", "Os recursos são perdidos e revertidos à seguradora caso o participante faleça antes de começar a receber a renda"], "correta": 2, "explicacao": "Uma das utilizações dos planos de previdência é o planejamento sucessório: em caso de falecimento, a reserva é paga aos beneficiários indicados pelo participante, em regra sem passar pelo inventário, o que dá agilidade e liquidez à família. O participante pode indicar livremente os beneficiários e alterá-los a qualquer tempo."}, {"id": "M2D-010", "modulo": 2, "topico": "2.2.1 Modalidades de planos (PGBL e VGBL)", "dificuldade": "facil", "tipo": "mc", "enunciado": "Um cliente pergunta se os recursos aplicados em um plano PGBL contam com a garantia do Fundo Garantidor de Créditos (FGC). A resposta correta é:", "alternativas": ["Sim, mas apenas para os planos cujo fundo investe exclusivamente em títulos públicos", "Não, pois a garantia do FGC para previdência só vale após o início do recebimento da renda", "Sim, até R$ 250 mil por CPF, somando PGBL e VGBL na mesma seguradora", "Não, os planos de previdência complementar aberta não são cobertos pelo FGC"], "correta": 3, "explicacao": "O FGC cobre depósitos e alguns títulos emitidos por instituições financeiras (conta corrente, poupança, CDB, LCI, LCA etc.). Planos de previdência (PGBL e VGBL) não estão entre os produtos garantidos; os recursos ficam em fundos especialmente constituídos, segregados do patrimônio da seguradora ou entidade."}, {"id": "M2D-011", "modulo": 2, "topico": "2.2.2.1 Regime progressivo, tributável ou compensável", "dificuldade": "facil", "tipo": "mc", "enunciado": "Uma cliente com PGBL no regime progressivo solicitou um resgate parcial. Como ocorre a tributação desse resgate?", "alternativas": ["Há retenção na fonte de 15% e o valor é ajustado na declaração anual, conforme a tabela progressiva do IR", "Há retenção na fonte de 35%, alíquota que diminui conforme o tempo de permanência dos recursos", "Não há retenção na fonte; todo o imposto é recolhido apenas na declaração de ajuste anual", "Há retenção definitiva de 27,5%, sem possibilidade de ajuste na declaração anual"], "correta": 0, "explicacao": "No regime progressivo (compensável), os resgates sofrem antecipação de 15% de IR na fonte, e o valor resgatado é somado aos demais rendimentos tributáveis na declaração anual, onde se aplica a tabela progressiva. Assim, a pessoa pode ter imposto a pagar ou a restituir. A alíquota de 35% decrescente é característica do regime regressivo."}, {"id": "M2D-012", "modulo": 2, "topico": "2.2.2.1 Regime progressivo, tributável ou compensável", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente com PGBL no regime progressivo resgata R$ 40.000,00. Qual valor será retido de IR na fonte no momento do resgate?", "alternativas": ["R$ 11.000,00", "R$ 6.000,00", "R$ 14.000,00", "R$ 4.000,00"], "correta": 1, "explicacao": "Nos resgates do regime progressivo, a retenção na fonte é de 15% sobre a base de cálculo. No PGBL, a base é o valor total resgatado: 15% × 40.000 = R$ 6.000,00. Esse valor é uma antecipação: na declaração anual, o resgate entra como rendimento tributável e o imposto é recalculado pela tabela progressiva. Os R$ 14.000,00 corresponderiam à alíquota de 35% do regime regressivo."}, {"id": "M2D-013", "modulo": 2, "topico": "2.2.2.1 Regime progressivo, tributável ou compensável", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um casal tem pouca renda tributável além da previdência e planeja receber benefícios mensais pequenos, que devem ficar na faixa de isenção ou nas alíquotas iniciais da tabela do IR. Para esse perfil, qual regime de tributação tende a ser mais vantajoso?", "alternativas": ["Progressivo, pois nele a alíquota cai 5 pontos percentuais a cada dois anos de aplicação", "Regressivo, pois permite ajustar o imposto na declaração e receber restituição", "Progressivo, pois a tributação final segue a tabela do IR e benefícios baixos podem ter alíquota efetiva pequena ou nula", "Regressivo, pois garante alíquota de 10% desde o primeiro aporte, independentemente do prazo"], "correta": 2, "explicacao": "O regime progressivo é indicado para quem terá rendas baixas na fase de benefício, pois o imposto final é calculado pela tabela progressiva e pode resultar em alíquota efetiva baixa ou até isenção. O regime regressivo é definitivo (sem ajuste) e só chega a 10% após mais de 10 anos de acumulação de cada aporte."}, {"id": "M2D-014", "modulo": 2, "topico": "2.2.2.1 Regime progressivo, tributável ou compensável", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Sobre o regime progressivo de tributação em planos de previdência, assinale a afirmação correta:", "alternativas": ["Tanto resgates quanto rendas sofrem retenção definitiva de 15%, sem ajuste na declaração anual", "A alíquota é definida pelo prazo de cada contribuição, começando em 35% e chegando a 10%", "É obrigatório para quem tem PGBL, pois o regime regressivo só pode ser escolhido no VGBL", "Os benefícios pagos sob a forma de renda sofrem retenção conforme a tabela progressiva mensal, enquanto os resgates sofrem retenção de 15%, ambos sujeitos a ajuste anual"], "correta": 3, "explicacao": "No regime progressivo, a retenção depende da forma de saída: rendas mensais seguem a tabela progressiva mensal; resgates têm retenção de 15%. Em ambos os casos, o valor é levado à declaração anual para ajuste. A tabela por prazo (35% a 10%) é do regime regressivo, que pode ser escolhido tanto no PGBL quanto no VGBL."}, {"id": "M2D-015", "modulo": 2, "topico": "2.2.2.2 Regime regressivo, definitivo ou exclusivo", "dificuldade": "facil", "tipo": "mc", "enunciado": "No regime regressivo de tributação da previdência complementar, qual é a alíquota de IR aplicada a recursos que permaneceram no plano por mais de 10 anos?", "alternativas": ["10%", "20%", "15%", "0%"], "correta": 0, "explicacao": "A tabela regressiva começa em 35% (até 2 anos) e cai 5 pontos percentuais a cada 2 anos: 30%, 25%, 20%, 15%, até chegar a 10% para recursos acumulados há mais de 10 anos. Não existe isenção total por prazo."}, {"id": "M2D-016", "modulo": 2, "topico": "2.2.2.2 Regime regressivo, definitivo ou exclusivo", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente optou pelo regime regressivo e vai resgatar um aporte feito há 5 anos em seu VGBL. Qual alíquota de IR incidirá sobre a base de cálculo desse resgate?", "alternativas": ["25%", "20%", "30%", "15%"], "correta": 0, "explicacao": "Na tabela regressiva: até 2 anos, 35%; de 2 a 4 anos, 30%; de 4 a 6 anos, 25%; de 6 a 8 anos, 20%; de 8 a 10 anos, 15%; acima de 10 anos, 10%. Um aporte com 5 anos está na faixa de 4 a 6 anos, logo 25%. No VGBL, a base é só o rendimento desse aporte."}, {"id": "M2D-017", "modulo": 2, "topico": "2.2.2.2 Regime regressivo, definitivo ou exclusivo", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Um cliente tem VGBL no regime regressivo com dois aportes: R$ 50.000,00 feitos há 9 anos, que hoje valem R$ 80.000,00, e R$ 30.000,00 feitos há 3 anos, que hoje valem R$ 36.000,00. Se ele resgatar todo o saldo, o IR total será de:", "alternativas": ["R$ 5.400,00", "R$ 6.300,00", "R$ 22.800,00", "R$ 10.800,00"], "correta": 1, "explicacao": "No regressivo, cada aporte tem seu próprio prazo. Aporte de 9 anos (faixa de 8 a 10 anos = 15%): rendimento de 30.000 × 15% = R$ 4.500,00. Aporte de 3 anos (faixa de 2 a 4 anos = 30%): rendimento de 6.000 × 30% = R$ 1.800,00. Total: R$ 6.300,00. Como é VGBL, a base é apenas o rendimento; tributar o valor total (R$ 22.800,00) seria o tratamento de um PGBL."}, {"id": "M2D-018", "modulo": 2, "topico": "2.2.2.2 Regime regressivo, definitivo ou exclusivo", "dificuldade": "medio", "tipo": "mc", "enu
