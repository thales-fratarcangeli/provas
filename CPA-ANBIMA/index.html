variável “100 menos a idade” é uma exigência normativa e limita a exposição dela a 30%", "Por ter mais de 65 anos, a regulamentação a enquadra obrigatoriamente no perfil conservador", "A idade avançada não impede, por si só, alguma exposição a renda variável, pois a renda está coberta, há experiência e parte dos recursos tem horizonte longo; o suitability é que definirá o perfil", "O gerente deve recomendar a venda de todas as ações, já que pessoas idosas estão na fase de distribuição e não podem manter ativos voláteis"], "correta": 2, "explicacao": "A faixa etária é uma referência importante, mas a exposição ao risco depende também de capacidade financeira, objetivos, horizonte de cada parcela do patrimônio e experiência. Não existe norma que enquadre automaticamente idosos como conservadores; regras como “100 menos a idade” são apenas aproximações didáticas."}, {"id": "M3A-003", "modulo": 3, "topico": "3.1.2.1 Ciclo de vida – Acumulação de capital", "dificuldade": "facil", "tipo": "mc", "enunciado": "Juliana, 24 anos, acaba de ser efetivada em seu primeiro emprego, mora de aluguel, ainda paga parcelas de um curso e tem pouco patrimônio. Em relação ao ciclo de vida financeiro, ela está na fase de:", "alternativas": ["Acumulação de capital, em que o foco é organizar o orçamento, formar a reserva de emergência e criar o hábito de poupar com horizonte longo", "Distribuição de renda, pois depende do salário para pagar as despesas", "Crescimento patrimonial, pois já possui renda fixa mensal", "Preservação de capital, pois ainda tem pouco patrimônio a proteger"], "correta": 0, "explicacao": "A fase de acumulação é típica do início da vida profissional: renda menor, patrimônio pequeno, possíveis dívidas e horizonte longo. As prioridades são equilibrar o orçamento, construir a reserva de emergência e começar a investir regularmente."}, {"id": "M3A-004", "modulo": 3, "topico": "3.1.2.2 Ciclo de vida – Crescimento patrimonial", "dificuldade": "medio", "tipo": "mc", "enunciado": "Carlos, 45 anos, executivo, está no auge da renda, já quitou boa parte do financiamento do imóvel, tem dois filhos adolescentes e vem aumentando os aportes mensais em uma carteira diversificada. Essa situação caracteriza a fase de:", "alternativas": ["Preservação de capital, pois quem tem filhos deve eliminar ativos de risco da carteira", "Acumulação de capital, porque ele ainda tem dívidas de financiamento", "Distribuição de renda, pois ele já pensa em sucessão para os filhos", "Crescimento (consolidação) patrimonial, em que a renda elevada permite aportes maiores e diversificação, com objetivos como educação dos filhos e aposentadoria"], "correta": 3, "explicacao": "Na fase de crescimento patrimonial a pessoa costuma ter renda mais alta e estável, reduz dívidas e amplia investimentos, diversificando para atender metas de médio e longo prazo (educação dos filhos, aposentadoria). Ter dependentes não obriga a zerar o risco, apenas reforça a necessidade de planejamento e proteção."}, {"id": "M3A-005", "modulo": 3, "topico": "3.1.2.3 Ciclo de vida – Preservação de capital", "dificuldade": "medio", "tipo": "mc", "enunciado": "Paulo, 58 anos, pretende se aposentar em cerca de cinco anos. Ao longo da carreira acumulou um patrimônio expressivo, hoje com 60% em ações. Na fase de preservação de capital em que se encontra, a recomendação mais coerente é:", "alternativas": ["Aumentar a exposição a ações para recuperar o tempo perdido antes da aposentadoria", "Reduzir gradualmente a exposição a ativos voláteis e privilegiar ativos que protejam o poder de compra e ofereçam previsibilidade, preservando o que foi acumulado", "Manter a carteira inalterada, pois a fase do ciclo de vida não influencia a alocação", "Resgatar todo o patrimônio e mantê-lo em conta corrente, para eliminar qualquer risco"], "correta": 1, "explicacao": "Na preservação, a prioridade passa a ser proteger o capital acumulado, pois resta pouco tempo para recuperar perdas relevantes antes de usar os recursos. A redução de risco deve ser gradual e manter proteção contra a inflação; deixar o dinheiro parado em conta corrente expõe o patrimônio à perda do poder de compra."}, {"id": "M3A-006", "modulo": 3, "topico": "3.1.2.4 Ciclo de vida – Distribuição de renda", "dificuldade": "facil", "tipo": "mc", "enunciado": "Sr. Antônio, 72 anos, aposentado, vive principalmente dos rendimentos e de resgates programados de seus investimentos e começou a planejar doações aos filhos. Sobre a fase do ciclo de vida em que ele está, é correto afirmar que:", "alternativas": ["Trata-se da fase de distribuição, em que o patrimônio é usado para gerar renda, exige liquidez programada e envolve questões sucessórias", "Nessa fase não há necessidade de planejamento, pois os objetivos já foram alcançados", "Trata-se da fase de crescimento patrimonial, porque o patrimônio continua aumentando com os juros", "Trata-se da fase de acumulação, pois ele ainda tem investimentos rendendo"], "correta": 0, "explicacao": "Na distribuição, a pessoa passa a consumir a renda e parte do patrimônio acumulado, o que exige planejar fluxos de resgate, liquidez e a transmissão do patrimônio (sucessão, doações). O planejamento continua necessário, por exemplo para que os recursos durem por toda a vida."}, {"id": "M3A-007", "modulo": 3, "topico": "3.1.2 Ciclo de vida da pessoa investidora", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Um gerente atende três clientes: (I) Ana, 30 anos, começando a investir; (II) Bruno, 50 anos, renda alta e patrimônio crescente; (III) Célia, 75 anos, vivendo dos investimentos. Assinale a afirmação correta sobre a gestão desses clientes ao longo do ciclo de vida:", "alternativas": ["Célia deve ter a carteira com maior horizonte médio, já que os recursos dela precisam durar mais", "Em geral, a tolerância a perdas e o horizonte diminuem de Ana para Célia, enquanto cresce a importância de liquidez programada e de preservação; mas o perfil de cada um deve ser confirmado individualmente", "A necessidade de liquidez é maior para Ana, pois clientes mais jovens sacam com mais frequência", "Bruno deve ser tratado como Célia, pois ambos já possuem patrimônio relevante"], "correta": 1, "explicacao": "Ao longo do ciclo de vida o horizonte de investimento tende a encurtar e a necessidade de renda e liquidez programada tende a crescer, o que costuma reduzir a exposição a risco. Essas são tendências gerais: o perfil efetivo de cada cliente depende do suitability, dos objetivos e da situação financeira individual."}, {"id": "M3A-008", "modulo": 3, "topico": "3.1.3.1 Educação financeira básica", "dificuldade": "facil", "tipo": "mc", "enunciado": "Mariana diz ao gerente que “sempre tenta guardar o que sobra no fim do mês”, mas raramente sobra algo. A orientação de educação financeira mais adequada é:", "alternativas": ["Concentrar a poupança no 13º salário e não se preocupar com o orçamento mensal", "Usar o limite do cheque especial durante o mês para que o salário fique intacto", "Esperar um aumento de salário, pois só é possível poupar com renda mais alta", "Pagar-se primeiro: separar um valor para poupança assim que receber o salário, de preferência com aplicação automática, e ajustar os gastos ao que restar"], "correta": 3, "explicacao": "Poupar apenas o que sobra costuma falhar, porque os gastos tendem a ocupar toda a renda disponível. Separar a poupança logo no recebimento (pagar-se primeiro), de forma automática, transforma a poupança em compromisso fixo do orçamento."}, {"id": "M3A-009", "modulo": 3, "topico": "3.1.3.2 Receitas e despesas pessoais ou familiares (capacidade de poupança)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma família tem renda líquida mensal de R$ 14.000,00. Suas despesas fixas somam R$ 8.400,00 e as despesas variáveis, R$ 3.500,00 por mês. A capacidade de poupança mensal dessa família é de:", "alternativas": ["R$ 10.500,00, equivalente a 75% da renda líquida", "R$ 2.100,00, equivalente a 25% da renda líquida", "R$ 2.100,00, equivalente a 15% da renda líquida", "R$ 5.600,00, equivalente a 40% da renda líquida"], "correta": 2, "explicacao": "Capacidade de poupança = receitas − despesas = 14.000 − (8.400 + 3.500) = 14.000 − 11.900 = R$ 2.100,00. Em proporção da renda: 2.100 ÷ 14.000 = 15%. Considerar só as despesas fixas (resultando em R$ 5.600) superestima a sobra."}, {"id": "M3A-010", "modulo": 3, "topico": "3.1.3.2 Receitas e despesas pessoais ou familiares (capacidade de poupança)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Roberto calcula que sobram R$ 3.000,00 por mês no seu orçamento, mas todo início de ano entra no cheque especial para pagar IPVA, IPTU, matrículas e material escolar. O diagnóstico mais provável é que:", "alternativas": ["O problema é apenas de liquidez, resolvido mantendo um limite maior de cheque especial", "O orçamento não considera as despesas sazonais (eventuais/anuais), que deveriam ser provisionadas mensalmente, reduzindo a real capacidade de poupança", "A renda dele é insuficiente e a única saída é aumentar a receita", "Despesas anuais não fazem parte do orçamento familiar, pois não ocorrem todos os meses"], "correta": 1, "explicacao": "Despesas sazonais (impostos anuais, matrículas, seguros) fazem parte do orçamento: o ideal é dividir o valor anual por 12 e provisioná-lo mensalmente. Ao ignorá-las, Roberto superestima a sobra mensal e acaba financiando essas despesas com uma das linhas de crédito mais caras."}, {"id": "M3A-011", "modulo": 3, "topico": "3.1.3.3.1 Avaliação da melhor dívida em função da necessidade atual do cliente", "dificuldade": "medio", "tipo": "mc", "enunciado": "Lúcia, servidora pública, tem R$ 15.000,00 de saldo devedor no cheque especial e no rotativo do cartão há vários meses. O banco oferece crédito consignado com custo efetivo bem menor. A orientação mais adequada é:", "alternativas": ["Manter as dívidas atuais, pois trocar de dívida sempre gera mais custos", "Pagar apenas o mínimo do cartão e usar o consignado para novas compras", "Contratar crédito pessoal sem garantia, porque não compromete o salário", "Avaliar a troca das dívidas caras pelo consignado, cuja parcela cabe no orçamento, e reorganizar os gastos para não voltar a usar o cheque especial e o rotativo"], "correta": 3, "explicacao": "A melhor dívida é a de menor custo efetivo total compatível com a capacidade de pagamento. Substituir dívidas caras (cheque especial e rotativo) por uma mais barata, como o consignado, reduz os juros; mas a troca só funciona se vier acompanhada de ajuste no orçamento, para que as linhas caras não voltem a ser usadas."}, {"id": "M3A-012", "modulo": 3, "topico": "3.1.3.3.1 Avaliação da melhor dívida em função da necessidade atual do cliente", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Um cliente compara duas propostas de empréstimo de mesmo valor e prazo. Proposta X: taxa de juros de 1,9% a.m., com tarifa de cadastro e seguro prestamista embutidos, resultando em CET de 2,6% a.m. Proposta Y: taxa de juros de 2,1% a.m., sem tarifas, com CET de 2,2% a.m. A orientação correta é:", "alternativas": ["Escolher X, porque o seguro prestamista sempre reduz o custo total da operação", "As propostas são equivalentes, já que a diferença de taxa de juros é pequena", "Escolher Y, pois o Custo Efetivo Total, que reúne juros, tarifas, tributos e seguros, é menor", "Escolher X, pois a taxa de juros nominal é menor"], "correta": 2, "explicacao": "O CET é o indicador adequado para comparar operações de crédito, pois inclui todos os encargos e despesas (juros, tarifas, tributos como o IOF e seguros), e não apenas a taxa de juros. A taxa nominal menor de X é enganosa, porque os custos adicionais tornam a operação mais cara."}, {"id": "M3A-013", "modulo": 3, "topico": "3.1.3.3.2 Empréstimo e financiamento", "dificuldade": "facil", "tipo": "mc", "enunciado": "Um cliente pergunta qual a diferença entre um empréstimo e um financiamento. A explicação correta é:", "alternativas": ["No financiamento os recursos têm destinação específica (como a compra de um imóvel ou veículo), que costuma servir de garantia; no empréstimo não há obrigação de informar ou comprovar o uso dos recursos", "Não há diferença: os termos são sinônimos e as taxas são sempre iguais", "No empréstimo os recursos têm destinação específica; no financiamento o cliente usa o dinheiro como quiser", "Financiamentos são sempre concedidos pelo governo e empréstimos, pelos bancos privados"], "correta": 0, "explicacao": "No financiamento o crédito é vinculado à aquisição de um bem ou serviço específico, que frequentemente fica como garantia (por exemplo, alienação fiduciária), o que tende a reduzir as taxas. No empréstimo, o tomador recebe o dinheiro sem destinação vinculada."}, {"id": "M3A-014", "modulo": 3, "topico": "3.1.3.3.3 Modalidades de operações de crédito – CDC, crédito pessoal e consignado", "dificuldade": "facil", "tipo": "mc", "enunciado": "Ao comprar uma geladeira em uma loja, Fernanda opta por pagar em 12 parcelas fixas por meio de uma financeira parceira do varejista, que vincula o crédito à compra do bem. Essa modalidade é o:", "alternativas": ["Cheque especial", "Crédito consignado", "Crédito rotativo", "Crédito Direto ao Consumidor (CDC)"], "correta": 3, "explicacao": "O CDC financia a aquisição de bens e serviços pelo consumidor, normalmente com parcelas fixas e o próprio bem podendo servir de garantia. O consignado tem as parcelas descontadas em folha ou benefício; cheque especial e cartão são formas de crédito rotativo."}, {"id": "M3A-015", "modulo": 3, "topico": "3.1.3.3.3 Modalidades de operações de crédito – CDC, crédito pessoal e consignado", "dificuldade": "medio", "tipo": "mc", "enunciado": "Sobre o crédito consignado, em comparação com o crédito pessoal sem garantia, é correto afirmar que:", "alternativas": ["Pode ser contratado em qualquer valor, sem limite de comprometimento da renda", "Tem taxas maiores, porque o banco depende da boa vontade do empregador", "Tende a ter taxas menores, pois as parcelas são descontadas diretamente da folha de pagamento ou do benefício, reduzindo o risco de inadimplência; o valor da parcela é limitado à margem consignável", "Exige sempre a alienação de um imóvel como garantia"], "correta": 2, "explicacao": "No consignado, o desconto automático na folha ou no benefício reduz o risco do credor, o que se traduz em juros menores que os do crédito pessoal sem garantia. Em contrapartida, a parcela é limitada a um percentual da renda (margem consignável), o que também protege o tomador do superendividamento."}, {"id": "M3A-016", "modulo": 3, "topico": "3.1.3.3.4 Garantias", "dificuldade": "medio", "tipo": "mc", "enunciado": "Ao financiar um automóvel, o banco exige que o veículo fique vinculado à operação: o cliente usa o carro normalmente, mas a propriedade só se consolida em seu nome após a quitação. Essa garantia é a:", "alternativas": ["Fiança", "Alienação fiduciária", "Hipoteca", "Penhor"], "correta": 1, "explicacao": "Na alienação fiduciária, a propriedade do bem é transferida ao credor em caráter fiduciário até a quitação, enquanto o devedor mantém a posse e o uso. É a garantia típica de financiamentos de veículos e, hoje, também da maioria dos financiamentos imobiliários. Fiança é garantia pessoal e penhor envolve, em regra, a entrega de bem móvel ao credor."}, {"id": "M3A-017", "modulo": 3, "topico": "3.1.3.3.4 Garantias", "dificuldade": "medio", "tipo": "mc", "enunciado": "Seu Joaquim precisa de R$ 8.000,00 por três meses e leva joias de ouro à instituição, que as mantém em custódia como garantia do empréstimo. Sobre essa operação, assinale a alternativa correta:", "alternativas": ["É uma operação de penhor: a garantia real sobre bem móvel reduz o risco do credor e, por isso, costuma ter custo menor que o crédito pessoal sem garantia", "É um aval, pois a garantia é dada pelo próprio devedor", "Garantias não influenciam a taxa de juros; apenas o prazo determina o custo do crédito", "É uma hipoteca, garantia típica de bens móveis de valor"], "correta": 0, "explicacao": "No penhor, um bem móvel (como joias) é entregue ao credor como garantia. Garantias reais reduzem a perda esperada do credor em caso de inadimplência e, por isso, permitem taxas menores. Hipoteca recai, em regra, sobre imóveis; aval é garantia pessoal dada por terceiro em títulos de crédito."}, {"id": "M3A-018", "modulo": 3, "topico": "3.1.3.3.5 Controle de gastos e orçamento", "dificuldade": "facil", "tipo": "mc", "enunciado": "Um casal quer controlar melhor o orçamento doméstico. A prática mais efetiva para isso é:", "alternativas": ["Anotar apenas as despesas acima de R$ 500,00, que são as que realmente pesam", "Registrar todas as receitas e despesas, classificá-las por categoria (fixas, variáveis, eventuais) e comparar periodicamente o orçado com o realizado, ajustando o que estiver fora do planejado", "Concentrar todos os gastos no cartão de crédito e olhar apenas o valor total da fatura", "Revisar o orçamento somente uma vez por ano, na declaração de imposto de renda"], "correta": 1, "explicacao": "Controle de gastos exige registro completo, categorização e acompanhamento contínuo do orçado versus realizado. Pequenas despesas recorrentes, quando somadas, costumam ser relevantes e passam despercebidas se não forem registradas."}, {"id": "M3A-019", "modulo": 3, "topico": "3.1.3.3.6 Financiamento imobiliário e de veículos", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma cliente vai financiar um imóvel e pede para entender a diferença entre os sistemas SAC e Price. A explicação correta é:", "alternativas": ["Os dois sistemas resultam no mesmo total de juros pagos, mudando apenas a data de vencimento", "Na Price a primeira parcela é sempre maior que no SAC, para o mesmo valor, prazo e taxa", "No SAC as parcelas são fixas durante todo o contrato; na Price as parcelas são decrescentes", "No SAC a amortização é constante e as parcelas começam maiores e vão diminuindo; na Price as parcelas são constantes, com amortização menor no início, o que tende a gerar maior total de juros"], "correta": 3, "explicacao": "No SAC o saldo devedor cai mais rapidamente porque a amortização é igual em todas as parcelas; como os juros incidem sobre um saldo menor, as parcelas decrescem e o total de juros é menor. Na tabela Price as prestações são iguais, mas no início a maior parte é juros, o que mantém o saldo mais alto por mais tempo."}, {"id": "M3A-020", "modulo": 3, "topico": "3.1.3.3.6 Financiamento imobiliário e de veículos", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Um financiamento imobiliário de R$ 240.000,00 será pago em 240 meses pelo SAC, com juros de 1% a.m. (desconsidere seguros e tarifas). Os valores da 1ª e da 2ª prestação são, respectivamente:", "alternativas": ["R$ 3.400,00 e R$ 3.390,00", "R$ 3.400,00 e R$ 3.380,00", "R$ 2.400,00 e R$ 2.390,00", "R$ 3.400,00 e R$ 3.400,00"], "correta": 0, "explicacao": "Amortização constante = 240.000 ÷ 240 = R$ 1.000,00. 1ª prestação: juros de 1% × 240.000 = 2.400 + 1.000 = R$ 3.400,00. Saldo após a 1ª: 239.000; 2ª prestação: 1% × 239.000 = 2.390 + 1.000 = R$ 3.390,00. Parcelas fixas seriam características da tabela Price, não do SAC."}, {"id": "M3A-021", "modulo": 3, "topico": "3.1.3.3.6 Financiamento imobiliário e de veículos", "dificuldade": "facil", "tipo": "mc", "enunciado": "Bruno vai financiar um carro e pergunta como reduzir o custo total da operação. A orientação mais adequada é:", "alternativas": ["Considerar apenas a taxa de juros anunciada pela concessionária", "Dar a menor entrada possível, para preservar todo o dinheiro aplicado, sem comparar o rendimento da aplicação com o custo do financiamento", "Avaliar uma entrada maior e um prazo menor, comparando o CET entre instituições, pois o total de juros cresce com o valor financiado e com o prazo", "Escolher o maior prazo possível, pois parcelas menores sempre significam menor custo total"], "correta": 2, "explicacao": "Quanto maior o valor financiado e o prazo, maior o total de juros pago. Uma entrada maior e um prazo menor reduzem o custo total, e o CET é o indicador correto para comparar propostas. Parcela menor por prazo maior não significa custo menor."}, {"id": "M3A-022", "modulo": 3, "topico": "3.1.3.3.7 Cartão de crédito e gerenciamento de dívidas", "dificuldade": "medio", "tipo": "mc", "enunciado": "Há seis meses, Tiago paga apenas o valor mínimo da fatura do cartão de crédito. A orientação mais adequada do gerente é:", "alternativas": ["Solicitar aumento do limite do cartão para ganhar fôlego financeiro", "Explicar que o rotativo está entre as linhas de crédito mais caras e buscar quitar o saldo, se necessário trocando-o por uma modalidade mais barata e com parcelas que caibam no orçamento, além de rever os gastos no cartão", "Abrir um novo cartão em outra instituição para pagar a fatura do atual", "Continuar pagando o mínimo, pois isso mantém o nome limpo e não gera custos relevantes"], "correta": 1, "explicacao": "O saldo não pago da fatura entra no rotativo ou no parcelamento da fatura, com encargos elevados. A saída é interromper o uso do crédito caro, substituí-lo por uma linha de menor CET (como consignado ou crédito pessoal mais barato) e ajustar os gastos. Aumentar limite ou abrir outro cartão apenas amplia o endividamento."}, {"id": "M3A-023", "modulo": 3, "topico": "3.1.3.3.7 Cartão de crédito e gerenciamento de dívidas", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Uma cliente deixou de pagar R$ 2.000,00 da fatura do cartão de crédito, valor que entrou no rotativo e depois foi parcelado. Considerando a regra de limitação de encargos introduzida pela Lei 14.690/2023, é correto afirmar que:", "alternativas": ["A dívida total pode chegar a no máximo R$ 2.200,00, pois o limite é de 10% do valor original", "Não há limite para juros do cartão, pois as taxas são livremente pactuadas", "Os juros podem chegar a no máximo 8% ao mês, como no cheque especial", "Os juros e encargos financeiros cobrados sobre essa dívida não podem ultrapassar R$ 2.000,00, ou seja, 100% do valor original da dívida"], "correta": 3, "explicacao": "A Lei 14.690/2023 limitou os juros e encargos do rotativo e do parcelamento da fatura do cartão a 100% do valor original da dívida. Assim, sobre R$ 2.000,00 os encargos não podem superar R$ 2.000,00. O teto de 8% ao mês é regra do cheque especial, não do cartão."}, {"id": "M3A-024", "modulo": 3, "topico": "3.1.3.3.8 Empréstimo com garantia e crédito rotativo", "dificuldade": "medio", "tipo": "mc", "enunciado": "Sobre crédito rotativo, como o cheque especial e o limite do cartão de crédito, é correto afirmar que:", "alternativas": ["É sempre vinculado à compra de um bem que fica como garantia", "É uma linha de longo prazo com parcelas fixas, ideal para financiar a casa própria", "É um limite pré-aprovado que pode ser usado e recomposto à medida que os valores são pagos, sem destinação específica, e costuma ter custo elevado por não ter garantia", "Tem as parcelas descontadas em folha de pagamento, por isso tem as menores taxas do mercado"], "correta": 2, "explicacao": "O crédito rotativo funciona como um limite disponível que o cliente usa quando quiser e que se recompõe com os pagamentos. A conveniência e a ausência de garantia fazem dele uma das linhas mais caras, devendo ser usado apenas por prazos muito curtos."}, {"id": "M3A-025", "modulo": 3, "topico": "3.1.3.3.8 Empréstimo com garantia e crédito rotativo", "dificuldade": "medio", "tipo": "mc", "enunciado": "Marcelo é proprietário de um imóvel quitado e precisa de recursos para reorganizar dívidas caras. O gerente apresenta um empréstimo com garantia de imóvel (home equity). A informação correta a ser passada ao cliente é:", "alternativas": ["A garantia real permite taxas menores e prazos maiores, mas em caso de inadimplência o cliente pode perder o imóvel, por isso o valor e as parcelas devem caber com folga no orçamento", "Essa modalidade só pode ser usada para comprar outro imóvel", "A taxa costuma ser a mesma do cheque especial, mudando apenas o prazo", "Como a garantia é o imóvel, não há risco algum para o cliente em caso de inadimplência"], "correta": 0, "explicacao": "O crédito com garantia de imóvel tem custo menor e prazo maior porque reduz o risco do credor. Em contrapartida, se as parcelas não forem pagas o bem pode ser executado. A comunicação clara desse risco é essencial; não há destinação obrigatória dos recursos."}, {"id": "M3A-026", "modulo": 3, "topico": "3.1.3.3.9 Cheque especial e financiamento estudantil", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente usa o cheque especial há quatro meses seguidos para cobrir despesas do dia a dia. Considerando a regulamentação e as boas práticas, assinale a orientação correta:", "alternativas": ["O cheque especial não cobra juros quando o saldo é coberto no mesmo ano", "Os juros do cheque especial são limitados a 8% ao mês, mas ainda assim é uma linha cara, adequada apenas a necessidades de curtíssimo prazo; o uso prolongado deve ser substituído por uma modalidade mais barata e acompanhado de ajuste no orçamento", "A melhor alternativa é aumentar o limite do cheque especial para evitar a inadimplência", "Como a taxa do cheque especial é limitada por norma, ele é uma linha barata e pode ser usado por tempo indeterminado"], "correta": 1, "explicacao": "A regulamentação do CMN limita os juros do cheque especial a 8% ao mês, o que continua sendo um custo muito alto (mais de 150% ao ano no regime composto). Ele serve para cobrir descasamentos de poucos dias; quando o uso se torna recorrente, deve-se migrar para uma linha mais barata e corrigir o orçamento."}, {"id": "M3A-027", "modulo": 3, "topico": "3.1.3.3.9 Cheque especial e financiamento estudantil", "dificuldade": "facil", "tipo": "mc", "enunciado": "Pedro quer cursar graduação em uma instituição privada, mas não tem recursos para as mensalidades. Sobre o financiamento estudantil, é correto afirmar que:", "alternativas": ["É uma linha destinada a financiar o custo do curso, com condições próprias (como o FIES, programa do governo federal), em que a maior parte do pagamento costuma ocorrer após a conclusão do curso", "É uma modalidade de crédito rotativo, com juros iguais aos do cartão de crédito", "Só pode ser contratado por quem já possui imóvel para dar em garantia", "Não gera dívida para o estudante, pois é uma bolsa de estudos integral"], "correta": 0, "explicacao": "O financiamento estudantil, como o FIES, é crédito vinculado ao pagamento do curso, com regras próprias e pagamento concentrado após a formatura. Diferentemente de uma bolsa, é uma dívida que precisará ser paga e deve entrar no planejamento financeiro do estudante."}, {"id": "M3A-028", "modulo": 3, "topico": "3.1.3.3.10 Microcrédito e crédito rural", "dificuldade": "medio", "tipo": "mc", "enunciado": "Dona Rosa vende salgados e quer comprar um forno industrial para ampliar seu pequeno negócio, que ainda é informal. A modalidade mais aderente à necessidade dela é:", "alternativas": ["Crédito consignado, que só exige vínculo com o próprio negócio", "Financiamento imobiliário pelo SFH", "Crédito rural de custeio, destinado à produção agropecuária", "Microcrédito, voltado a pequenos empreendedores, formais ou informais, de baixa renda, com valores reduzidos e, muitas vezes, acompanhamento de um agente de crédito"], "correta": 3, "explicacao": "O microcrédito (especialmente o produtivo orientado) atende pequenos empreendedores de baixa renda, inclusive informais, com valores menores e metodologia de relacionamento próximo. Crédito rural é destinado a atividades agropecuárias e o consignado depende de desconto em folha ou benefício."}, {"id": "M3A-029", "modulo": 3, "topico": "3.1.3.3.10 Microcrédito e crédito rural", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um produtor de café precisa de recursos para comprar fertilizantes e pagar despesas da próxima safra. A linha de crédito rural adequada a essa finalidade é o crédito de:", "alternativas": ["Microcrédito urbano, por se tratar de valores do dia a dia", "Comercialização, destinado exclusivamente à exportação da produção", "Custeio, destinado a cobrir as despesas normais do ciclo produtivo", "Investimento, destinado a bens duráveis, como tratores e benfeitorias"], "correta": 2, "explicacao": "O crédito rural se divide em finalidades como custeio (despesas do ciclo produtivo, como insumos), investimento (bens e serviços duráveis, como máquinas), comercialização e industrialização. Insumos da safra se enquadram em custeio."}, {"id": "M3A-030", "modulo": 3, "topico": "3.1.3.3.11 Crédito para reforma e construção", "dificuldade": "medio", "tipo": "mc", "enunciado": "Cláudia quer reformar a cozinha e pretende pagar o material de construção no cartão de crédito parcelado e, se faltar dinheiro, usar o rotativo. Uma orientação mais adequada seria:", "alternativas": ["Contratar um CDC de veículo, pois as taxas são menores", "Não fazer a reforma, já que obras nunca devem ser financiadas", "Avaliar linhas específicas para reforma e construção ou crédito com garantia de imóvel, que costumam ter prazos maiores e custo menor que o rotativo, comparando o CET e a capacidade de pagamento", "Usar o cheque especial, pois tem juros limitados e é mais barato que qualquer outra linha"], "correta": 2, "explicacao": "Existem linhas específicas para reforma e construção (por exemplo, financiamento de material de construção ou crédito com garantia do imóvel), com prazos e custos mais adequados. O rotativo do cartão e o cheque especial são caros para financiar despesas de valor elevado."}, {"id": "M3A-031", "modulo": 3, "topico": "3.1.3.3.12 Crédito para energia sustentável", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Um cliente avalia financiar painéis solares para sua residência. A parcela do financiamento seria de R$ 650,00 por 60 meses e a economia estimada na conta de luz é de R$ 600,00 por mês. A análise mais adequada é:", "alternativas": ["Considerar o CET, o fato de a parcela superar a economia em R$ 50,00 por mês durante o financiamento, a vida útil do equipamento e a economia após a quitação, verificando se o desembolso adicional cabe no orçamento", "Contratar imediatamente, pois toda operação para energia sustentável se paga sozinha", "Recusar a operação, pois créditos para energia sustentável sempre têm custo maior que outras linhas", "Avaliar apenas a taxa de juros, pois a economia de energia não deve entrar no cálculo"], "correta": 0, "explicacao": "Linhas para energia sustentável costumam ser analisadas comparando o custo do financiamento com a economia gerada. Aqui o cliente desembolsa R$ 50,00 a mais por mês durante 60 meses, mas depois passa a economizar integralmente R$ 600,00 por mês durante a vida útil do sistema. A decisão depende do CET, dessa relação custo-benefício e da folga no orçamento."}, {"id": "M3A-032", "modulo": 3, "topico": "3.1.3.4.1 Reserva de emergência – Montante necessário", "dificuldade": "facil", "tipo": "mc", "enunciado": "Luana tem renda líquida de R$ 9.000,00 e despesas mensais de R$ 6.000,00. Seguindo a referência usual de seis meses de despesas, sua reserva de emergência deveria ser de aproximadamente:", "alternativas": ["R$ 18.000,00", "R$ 36.000,00", "R$ 6.000,00", "R$ 54.000,00"], "correta": 1, "explicacao": "A reserva de emergência é dimensionada pelas despesas mensais, e não pela renda: 6 × R$ 6.000,00 = R$ 36.000,00. Usar a renda (6 × 9.000 = 54.000) superdimensiona a reserva sem necessidade."}, {"id": "M3A-033", "modulo": 3, "topico": "3.1.3.4.1 Reserva de emergência – Montante necessário", "dificuldade": "medio", "tipo": "mc", "enunciado": "Dois clientes têm as mesmas despesas mensais. Henrique é servidor público com estabilidade; Gabriela é profissional autônoma, com renda que varia muito de um mês para o outro. Sobre a reserva de emergência deles, é correto afirmar que:", "alternativas": ["Henrique deve ter reserva maior, pois ganha mais estabilidade e pode poupar mais", "Autônomos não precisam de reserva, pois podem aumentar a carga de trabalho quando necessário", "Ambos devem ter exatamente o mesmo valor, pois a reserva depende só das despesas", "Gabriela tende a precisar de uma reserva maior (mais meses de despesas), pela instabilidade da renda, enquanto Henrique pode trabalhar com um número menor de meses"], "correta": 3, "explicacao": "O tamanho da reserva depende das despesas, mas também da estabilidade da renda e da quantidade de dependentes. Quem tem renda variável ou menor segurança no emprego deve manter mais meses de despesas cobertos; quem tem estabilidade pode trabalhar com uma reserva proporcionalmente menor."}, {"id": "M3A-034", "modulo": 3, "topico": "3.1.3.4.2 Reserva de emergência – Ativos de alta liquidez", "dificuldade": "facil", "tipo": "mc", "enunciado": "Para aplicar a reserva de emergência de um cliente, o gerente deve priorizar:", "alternativas": ["CDB prefixado de cinco anos sem liquidez antecipada, por ter taxa maior", "Ativos de baixo risco e liquidez imediata, como Tesouro Selic ou CDB com liquidez diária de instituição sólida", "Ações de empresas sólidas que pagam bons dividendos", "LCA com carência de 12 meses, por ser isenta de IR"], "correta": 1, "explicacao": "A reserva precisa estar disponível rapidamente e sem risco relevante de perda de valor no momento do saque. Por isso, ativos pós-fixados com liquidez diária e baixo risco de crédito são os mais indicados. Ações oscilam; LCA com carência e CDB sem liquidez prendem o dinheiro."}, {"id": "M3A-035", "modulo": 3, "topico": "3.1.3.4.2 Reserva de emergência – Ativos de alta liquidez", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente mantém toda a sua reserva de emergência em um fundo multimercado com cotização de resgate em D+30 e volatilidade relevante, porque “rende mais que o CDI”. A avaliação correta é:", "alternativas": ["A escolha é adequada, pois fundos multimercado sempre rendem mais que o CDI", "A escolha é inadequada apenas porque fundos multimercado não podem ser oferecidos a pessoas físicas", "A escolha é inadequada para reserva de emergência: o prazo de conversão das cotas e a possibilidade de perdas no curto prazo podem impedir o uso dos recursos quando a emergência ocorrer", "A escolha é adequada desde que o fundo tenha come-cotas semestral"], "correta": 2, "explicacao": "Reserva de emergência exige liquidez imediata e baixa volatilidade. Um fundo com resgate em D+30 e oscilação relevante pode obrigar o cliente a esperar semanas ou a resgatar com perda. Rentabilidade maior não compensa a perda da função principal da reserva."}, {"id": "M3A-036", "modulo": 3, "topico": "3.1.4.3 Patrimônio líquido pessoal", "dificuldade": "medio", "tipo": "mc", "enunciado": "O balanço patrimonial de Ricardo apresenta: apartamento onde mora, R$ 500.000; carro, R$ 70.000; CDB com liquidez diária, R$ 40.000; fundo DI, R$ 20.000; ações, R$ 30.000. Dívidas: saldo do financiamento imobiliário, R$ 200.000; empréstimo pessoal, R$ 10.000. O patrimônio líquido de Ricardo é de:", "alternativas": ["R$ 660.000,00", "R$ 90.000,00", "R$ 250.000,00", "R$ 450.000,00"], "correta": 3, "explicacao": "PL = ativos − passivos. Ativos = 500.000 + 70.000 + 40.000 + 20.000 + 30.000 = 660.000. Passivos = 200.000 + 10.000 = 210.000. PL = 660.000 − 210.000 = R$ 450.000,00. O valor de R$ 660.000 é o ativo total, não o patrimônio líquido."}, {"id": "M3A-037", "modulo": 3, "topico": "3.1.4.1 Indicadores – liquidez, cobertura de despesas mensais e endividamento", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma cliente tem R$ 60.000,00 em aplicações de liquidez imediata (CDB com liquidez diária e fundo DI) e despesas mensais de R$ 10.000,00. O indicador de cobertura de despesas mensais mostra que:", "alternativas": ["Ela consegue cobrir 6 meses de despesas apenas com os ativos de liquidez imediata", "Ela tem endividamento de 16,7%", "Ela consegue cobrir 60 meses de despesas", "Ela tem liquidez insuficiente para qualquer emergência"], "correta": 0, "explicacao": "Cobertura de despesas mensais = ativos líquidos ÷ despesas mensais = 60.000 ÷ 10.000 = 6 meses. O indicador mostra por quanto tempo a pessoa se manteria sem renda usando recursos de fácil acesso, e conversa diretamente com o dimensionamento da reserva de emergência."}, {"id": "M3A-038", "modulo": 3, "topico": "3.1.4.1 Indicadores – liquidez, cobertura de despesas mensais e endividamento", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Um cliente possui ativos totais de R$ 800.000,00 e dívidas totais de R$ 320.000,00. Dessas dívidas, R$ 40.000,00 vencem nos próximos 12 meses; seus ativos de liquidez imediata somam R$ 50.000,00. Sobre os indicadores desse cliente, é correto afirmar que:", "alternativas": ["O índice de endividamento é de 40% e o índice de liquidez (ativos líquidos ÷ dívidas de curto prazo) é de 1,25, indicando que os recursos líquidos cobrem as dívidas de curto prazo", "O índice de endividamento é de 66,7% e o índice de liquidez é de 0,8", "O índice de endividamento é de 40% e o índice de liquidez é de 0,16, indicando risco de inadimplência imediata", "O patrimônio líquido é de R$ 320.000,00 e o endividamento é de 60%"], "correta": 0, "explicacao": "Endividamento = passivos ÷ ativos = 320.000 ÷ 800.000 = 40%. Liquidez = ativos líquidos ÷ dívidas de curto prazo = 50.000 ÷ 40.000 = 1,25, ou seja, maior que 1. O índice de 0,16 resultaria de dividir os ativos líquidos pela dívida total, que não é o conceito de liquidez de curto prazo. O PL é 800.000 − 320.000 = R$ 480.000."}, {"id": "M3A-039", "modulo": 3, "topico": "3.1.4.2 Ativos de uso e não uso", "dificuldade": "facil", "tipo": "mc", "enunciado": "No balanço patrimonial pessoal de Sandra constam: a casa onde ela mora, o carro da família, um apartamento alugado a terceiros e aplicações em fundos. São ativos de não uso (ativos de investimento):", "alternativas": ["Somente as aplicações em fundos, pois imóveis são sempre ativos de uso", "A casa onde mora e o carro da família", "O apartamento alugado e as aplicações em fundos, pois geram renda ou valorização e não são usados no dia a dia", "O carro da família e as aplicações em fundos"], "correta": 2, "explicacao": "Ativos de uso servem ao consumo e ao bem-estar da família (residência, carro particular) e, em geral, não geram renda, podendo até gerar despesas e depreciar. Ativos de não uso são mantidos para gerar renda ou valorização, como imóveis alugados e aplicações financeiras."}, {"id": "M3A-040", "modulo": 3, "topico": "3.1.4.3 Patrimônio líquido pessoal", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Laura resgata R$ 80.000,00 de um CDB e compra à vista um carro de mesmo valor para uso próprio. Imediatamente após a compra, e nos meses seguintes, o efeito sobre o balanço patrimonial dela é:", "alternativas": ["O patrimônio líquido aumenta, pois um carro vale mais que uma aplicação financeira", "No momento da compra o patrimônio líquido não muda (troca de um ativo por outro), mas um ativo de não uso, que rendia juros, vira um ativo de uso que tende a depreciar e gerar despesas, reduzindo o PL ao longo do tempo", "O balanço não se altera, pois carros não entram no balanço patrimonial pessoal", "O patrimônio líquido diminui imediatamente em R$ 80.000,00, pois houve saída de recursos"], "correta": 1, "explicacao": "Trocar um ativo por outro de mesmo valor não altera o PL no momento da operação. Porém o CDB (ativo de não uso) gerava rendimentos, enquanto o carro (ativo de uso) se desvaloriza e traz despesas como seguro, IPVA e manutenção, o que tende a reduzir o patrimônio líquido com o tempo."}, {"id": "M3A-041", "modulo": 3, "topico": "3.1.5.1 Etapas do processo do planejamento financeiro pessoal", "dificuldade": "medio", "tipo": "mc", "enunciado": "No primeiro encontro com um novo cliente, um gerente apresenta imediatamente três fundos que estão em campanha comercial, antes de entender a situação do cliente. Do ponto de vista do processo de planejamento financeiro pessoal, o gerente:", "alternativas": ["Apenas antecipou a etapa de monitoramento, o que é recomendável", "Seguiu corretamente o processo, pois a implementação deve vir em primeiro lugar", "Agiu corretamente, pois o planejamento financeiro só começa após a primeira aplicação", "Pulou as etapas de definição dos objetivos e de avaliação da situação financeira atual, que devem anteceder o desenvolvimento e a implementação do plano"], "correta": 3, "explicacao": "As etapas do planejamento financeiro são: definir os objetivos, avaliar a situação financeira atual, desenvolver o plano de ação, implementá-lo e monitorá-lo e revisá-lo regularmente. Recomendar produtos antes de conhecer objetivos e situação inverte o processo e ainda gera risco de inadequação ao perfil."}, {"id": "M3A-042", "modulo": 3, "topico": "3.1.5.1 Etapas do processo do planejamento financeiro pessoal", "dificuldade": "facil", "tipo": "mc", "enunciado": "Um ano após montar o plano financeiro de Felipe, o gerente fica sabendo que ele se casou e terá um filho. A etapa do planejamento que deve ser acionada nesse momento é:", "alternativas": ["Nenhuma: o plano já foi feito e não deve ser alterado", "Monitoramento e revisão regular, ajustando objetivos, reserva, proteção e investimentos à nova realidade", "Implementação, pois basta aplicar mais recursos nos mesmos produtos", "Encerramento do plano, já que mudanças de vida invalidam o planejamento"], "correta": 1, "explicacao": "O planejamento é um processo contínuo. Mudanças relevantes (casamento, filhos, mudança de emprego, herança) exigem revisar objetivos, prazos, reserva de emergência, seguros e alocação dos investimentos."}, {"id": "M3A-043", "modulo": 3, "topico": "3.1.5.2 Definição do momento de vida e financeiro da clientela", "dificuldade": "medio", "tipo": "mc", "enunciado": "Ao iniciar o atendimento de um casal de 35 anos, com dois filhos pequenos, financiamento imobiliário em andamento e renda crescente, o gerente quer definir o momento de vida e financeiro dos clientes. A abordagem mais adequada é:", "alternativas": ["Usar o mesmo plano padrão aplicado a todos os clientes da mesma faixa de renda", "Perguntar somente quanto eles têm disponível para aplicar hoje", "Considerar apenas a idade dos clientes, que define sozinha o momento financeiro", "Levantar renda, despesas, dívidas, patrimônio, dependentes, objetivos e prazos, para situar o casal no ciclo de vida e identificar prioridades como reserva, proteção da família e educação dos filhos"], "correta": 3, "explicacao": "O momento de vida e financeiro resulta da combinação de idade, composição familiar, renda, patrimônio, dívidas e objetivos. Só com essa visão completa é possível priorizar corretamente; idade ou valor disponível, isolados, são insuficientes."}, {"id": "M3A-044", "modulo": 3, "topico": "3.1.5.3 Estabelecimento de metas financeiras", "dificuldade": "facil", "tipo": "mc", "enunciado": "Entre as metas abaixo, a que está mais bem formulada para um planejamento financeiro é:", "alternativas": ["“Quero acumular R$ 80.000,00 em quatro anos para dar entrada em um apartamento, poupando cerca de R$ 1.500,00 por mês.”", "“Quero investir melhor do que meus amigos.”", "“Quero ter mais dinheiro no futuro.”", "“Quero ficar rico o mais rápido possível.”"], "correta": 0, "explicacao": "Boas metas financeiras são específicas, mensuráveis, atingíveis, relevantes e com prazo definido (metas SMART). A meta correta informa valor, prazo, finalidade e o esforço mensal necessário, permitindo escolher produtos e acompanhar o progresso."}, {"id": "M3A-045", "modulo": 3, "topico": "3.1.5.4 Planejamento de investimentos", "dificuldade": "medio", "tipo": "mc", "enunciado": "Marina tem três objetivos: viagem em 8 meses, troca de carro em 3 anos e aposentadoria em 25 anos. Seu perfil é moderado. A estratégia de investimentos mais coerente é:", "alternativas": ["Aplicar tudo em produtos de liquidez diária, pois todos os objetivos podem mudar", "Priorizar a aposentadoria e só pensar nos outros objetivos depois que ela estiver garantida", "Separar os recursos por objetivo: para a viagem, renda fixa de baixo risco e boa liquidez; para o carro, renda fixa com prazo compatível; para a aposentadoria, carteira diversificada que pode incluir ativos de maior risco", "Aplicar tudo em um único produto de alto risco, para maximizar o retorno dos três objetivos"], "correta": 2, "explicacao": "Cada objetivo tem horizonte e necessidade de liquidez próprios. Metas de curto prazo pedem ativos de baixo risco e liquidez; metas de longo prazo admitem mais risco em busca de retorno, sempre dentro do perfil de suitability."}, {"id": "M3A-046", "modulo": 3, "topico": "3.1.5.5 Planejamento de fundo educacional para descendentes", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um casal quer garantir recursos para a faculdade da filha, que hoje tem 3 anos. Preocupa-se com a perda do poder de compra e gostaria de receber os recursos em parcelas mensais durante os anos do curso. Um produto desenhado especificamente para esse objetivo é:", "alternativas": ["O Tesouro Educa+, título público indexado ao IPCA que, a partir do ano escolhido, paga a quantia acumulada em 60 parcelas mensais (cinco anos)", "O Tesouro Selic, que paga parcelas mensais a partir da data escolhida", "O CDB de liquidez diária, que garante rendimento acima da inflação por todo o período", "A LTN, título prefixado que paga cupons mensais corrigidos pela inflação"], "correta": 0, "explicacao": "O Tesouro Educa+ foi criado para planejamento educacional: acumula recursos corrigidos pelo IPCA mais uma taxa e, a partir do ano de conversão escolhido, paga 60 parcelas mensais. LTN não é corrigida pela inflação e não paga cupons; Tesouro Selic e CDB não têm fluxo de pagamentos programado para esse fim."}, {"id": "M3A-047", "modulo": 3, "topico": "3.1.5.5 Planejamento de fundo educacional para descendentes", "dificuldade": "medio", "tipo": "mc", "enunciado": "Dois irmãos querem acumular o mesmo valor para a faculdade dos filhos. Um começou a poupar quando o filho nasceu; o outro, quando o filho fez 10 anos. Considerando a mesma taxa de retorno, é correto afirmar que:", "alternativas": ["A diferença entre eles depende apenas da inflação, e não do tempo de acumulação", "Os dois precisarão aportar o mesmo valor mensal, pois o objetivo é igual", "O irmão que começou antes precisará de aportes mensais menores, pois terá mais tempo de contribuição e mais tempo de juros compostos sobre os recursos", "O irmão que começou mais tarde precisará aportar menos, pois a faculdade estará mais próxima"], "correta": 2, "explicacao": "Com mais tempo, o mesmo objetivo é atingido com aportes menores, porque há mais meses de contribuição e os juros compostos trabalham por mais tempo. Começar cedo é uma das principais recomendações do planejamento educacional."}, {"id": "M3A-048", "modulo": 3, "topico": "3.1.5.6 Planejamento para aposentadoria (cálculo para independência financeira)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente deseja, na aposentadoria, uma renda de R$ 6.000,00 por mês, em valores de hoje, vivendo apenas dos rendimentos e sem consumir o principal. Supondo uma taxa de juros real de 0,5% ao mês, o patrimônio necessário para a independência financeira é de:", "alternativas": ["R$ 600.000,00", "R$ 720.000,00", "R$ 3.000.000,00", "R$ 1.200.000,00"], "correta": 3, "explicacao": "Para viver só dos rendimentos, o patrimônio deve gerar a renda desejada: P = renda ÷ taxa = 6.000 ÷ 0,005 = R$ 1.200.000,00. Usa-se a taxa real (descontada a inflação) para que a renda mantenha o poder de compra; R$ 720.000 seria apenas 10 anos de renda sem rendimento algum."}, {"id": "M3A-049", "modulo": 3, "topico": "3.1.5.6 Planejamento para aposentadoria (cálculo para independência financeira)", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Sílvia quer se aposentar com renda total de R$ 12.000,00 mensais, em valores de hoje. Estima que receberá R$ 4.000,00 por mês da previdência oficial. Para complementar a renda apenas com os rendimentos de seus investimentos, a uma taxa real de 0,5% ao mês, o patrimônio que ela precisa acumular é de:", "alternativas": ["R$ 800.000,00", "R$ 1.600.000,00", "R$ 960.000,00", "R$ 2.400.000,00"], "correta": 1, "explicacao": "A carteira precisa cobrir apenas a diferença entre a renda desejada e o benefício oficial: 12.000 − 4.000 = R$ 8.000,00. Patrimônio = 8.000 ÷ 0,005 = R$ 1.600.000,00. Ignorar o benefício oficial levaria a R$ 2.400.000, superestimando a necessidade."}, {"id": "M3A-050", "modulo": 3, "topico": "3.1.5.6 Planejamento para aposentadoria (cálculo para independência financeira)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Ao projetar o patrimônio necessário para a aposentadoria de um cliente daqui a 25 anos, o gerente usa uma taxa de 10% ao ano, igual à taxa nominal atual de renda fixa, e uma renda desejada expressa em valores de hoje. O problema dessa simulação é:", "alternativas": ["Usar valores de hoje, pois o correto seria projetar a renda em dólares", "O prazo de 25 anos, pois simulações de aposentadoria não podem passar de 10 anos", "Nenhum, pois a taxa nominal é a mais conservadora", "Misturar renda em valores reais (de hoje) com taxa nominal, ignorando a inflação; o correto é usar taxa real ou corrigir a renda pela inflação esperada"], "correta": 3, "explicacao": "Se a renda desejada está em valores de hoje, a taxa usada deve ser real (já descontada a inflação). Usar a taxa nominal superestima o crescimento do patrimônio em termos de poder de compra e leva o cliente a poupar menos do que precisaria."}, {"id": "M3A-051", "modulo": 3, "topico": "3.1.6.1 Declaração de imposto de renda da pessoa física (o que deve ser declarado)", "dificuldade": "facil", "tipo": "mc", "enunciado": "Um cliente afirma que não precisa informar na declaração de IR a sua LCI e a sua caderneta de poupança, “porque são isentas”. A orientação correta é:", "alternativas": ["As aplicações devem constar em Bens e Direitos, com o saldo em 31 de dezembro, e os rendimentos devem ser informados como isentos e não tributáveis", "Ele está certo: aplicações isentas não precisam constar da declaração", "Basta informar os rendimentos, sem o saldo das aplicações", "Apenas a poupança deve ser declarada, porque é garantida pelo FGC"], "correta": 0, "explicacao": "A isenção se refere ao imposto, não à obrigação de informar. Os saldos das aplicações são declarados em Bens e Direitos e os rendimentos isentos, na ficha de rendimentos isentos e não tributáveis, o que também ajuda a justificar a evolução patrimonial."}, {"id": "M3A-052", "modulo": 3, "topico": "3.1.6.1 Declaração de imposto de renda da pessoa física (o que deve ser declarado)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma cliente comprou um apartamento há dez anos por R$ 300.000,00; hoje ele vale R$ 700.000,00 no mercado. Na ficha de Bens e Direitos da declaração de IR, o imóvel deve ser informado:", "alternativas": ["Pelo valor de mercado atual, de R$ 700.000,00", "Pelo custo de aquisição, de R$ 300.000,00, acrescido apenas de eventuais benfeitorias comprovadas, sem atualização a valor de mercado", "Pela média entre o valor de compra e o valor de mercado", "Pelo valor venal usado no cálculo do IPTU"], "correta": 1, "explicacao": "Na declaração da pessoa física, os bens são informados pelo custo de aquisição, podendo ser acrescidos de benfeitorias e reformas comprovadas. A valorização de mercado não é declarada anualmente; ela só aparece como ganho de capital quando o bem é vendido."}, {"id": "M3A-053", "modulo": 3, "topico": "3.1.6.2 Classificação de rendimentos", "dificuldade": "medio", "tipo": "mc", "enunciado": "Na declaração de IR, os rendimentos de um CDB resgatado no ano, que já sofreram retenção de imposto na fonte, devem ser classificados como rendimentos:", "alternativas": ["Tributáveis, somados ao salário para cálculo do imposto pela tabela progressiva", "Isentos e não tributáveis, como os da poupança", "Sujeitos à tributação exclusiva/definitiva, pois o IR retido na fonte encerra a tributação e eles não entram no cálculo do ajuste anual", "Não precisam ser informados, pois o banco já recolheu o imposto"], "correta": 2, "explicacao": "Os rendimentos de renda fixa como o CDB têm tributação exclusiva na fonte: o IR retido é definitivo e não se soma aos rendimentos tributáveis no ajuste. Ainda assim, devem ser informados na ficha própria, e o saldo da aplicação vai para Bens e Direitos."}, {"id": "M3A-054", "modulo": 3, "topico": "3.1.6.2 Classificação de rendimentos", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente recebe aluguel de um imóvel alugado a outra pessoa física. Na visão da declaração de IR, esse rendimento é:", "alternativas": ["Não tributável, desde que o valor seja reinvestido em renda fixa", "Tributável, sujeito ao recolhimento mensal pelo carnê-leão e ao ajuste anual pela tabela progressiva", "Sujeito à tributação exclusiva na fonte, retida pelo inquilino", "Isento, por se tratar de renda de imóvel próprio"], "correta": 1, "explicacao": "Aluguéis recebidos de pessoa física são rendimentos tributáveis: o próprio beneficiário recolhe mensalmente o IR pelo carnê-leão e os valores entram no ajuste anual, somados aos demais rendimentos tributáveis pela tabela progressiva."}, {"id": "M3A-055", "modulo": 3, "topico": "3.1.6.2 Classificação de rendimentos", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Uma cliente teve no ano: salário, rendimentos de poupança, rendimentos de LCA, rendimentos de um fundo de renda fixa e 13º salário. Sobre a classificação desses rendimentos na declaração, é correto afirmar que:", "alternativas": ["Salário e 13º são tributáveis; poupança, LCA e fundo de renda fixa são isentos", "Salário é tributável; poupança é isenta; LCA e fundo são de tributação exclusiva; 13º é isento", "Salário é tributável; poupança e LCA são isentos e não tributáveis; os rendimentos do fundo e o 13º salário são de tributação exclusiva/definitiva", "Todos são tributáveis e devem ser somados para aplicação da tabela progressiva"], "correta": 2, "explicacao": "O salário compõe os rendimentos tributáveis do ajuste anual. Poupança e LCA são isentas para pessoa física. Fundos de renda fixa têm IR retido na fonte (come-cotas e resgate) de forma definitiva, assim como o 13º salário, que é tributado exclusivamente na fonte, separado dos demais rendimentos."}, {"id": "M3A-056", "modulo": 3, "topico": "3.1.6.2 Classificação de rendimentos", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Um investidor vendeu, no mesmo mês, R$ 35.000,00 em ações no mercado à vista (operações comuns), com lucro de R$ 4.000,00. Sobre o tratamento desse ganho, é correto afirmar que:", "alternativas": ["Como o total de vendas no mês superou R$ 20.000,00, o lucro é tributável a 15%, apurado pelo próprio investidor e recolhido por DARF, com compensação de eventuais prejuízos anteriores na mesma modalidade", "É isento, pois o lucro foi inferior a R$ 20.000,00", "Deve ser somado ao salário no ajuste anual e tributado pela tabela progressiva", "É tributado exclusivamente na fonte pela corretora, sem nenhuma providência do investidor"], "correta": 0, "explicacao": "A isenção para ações no mercado à vista considera o total de vendas no mês (até R$ 20.000,00), e não o lucro. Como as vendas somaram R$ 35.000,00, o ganho de R$ 4.000,00 é tributado a 15% (R$ 600,00, descontado o IR retido na fonte), com apuração mensal pelo investidor e pagamento via DARF. O IR de 0,005% retido pela corretora é apenas uma antecipação."}, {"id": "M3A-057", "modulo": 3, "topico": "3.1.6.3 Modelo completo x desconto simplificado", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma cliente teve no ano despesas médicas elevadas, paga escola para dois filhos dependentes e contribuiu para um PGBL e para o INSS. Ao escolher o modelo da declaração, ela deve saber que:", "alternativas": ["O modelo simplificado sempre gera o menor imposto, pois aplica um desconto fixo", "O PGBL pode ser deduzido em qualquer modelo, sem limite", "As despesas médicas só podem ser deduzidas no modelo simplificado", "O modelo completo permite deduzir despesas legais (saúde, educação com limite, dependentes, previdência oficial, PGBL até 12% da renda bruta tributável), e tende a ser vantajoso quando essas deduções superam o desconto padrão do simplificado"], "correta": 3, "explicacao": "No completo, deduzem-se as despesas permitidas pela legislação; no simplificado, todas as deduções são substituídas por um desconto padrão de 20% dos rendimentos tributáveis, limitado a um teto. Com deduções elevadas, como as da cliente, o completo tende a ser melhor. A dedução do PGBL só existe no modelo completo."}, {"id": "M3A-058", "modulo": 3, "topico": "3.1.6.3 Modelo completo x desconto simplificado", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente jovem, solteiro, sem dependentes, sem despesas médicas ou de educação relevantes e sem previdência privada, pergunta qual modelo de declaração tende a ser mais vantajoso. A resposta mais adequada é:", "alternativas": ["O simplificado tende a ser mais vantajoso, pois o desconto padrão provavelmente supera as poucas deduções que ele teria no completo; o programa da Receita permite comparar os dois", "Não há diferença entre os modelos; a escolha é apenas formal", "O completo é obrigatório para quem tem investimentos", "O completo é sempre mais vantajoso para quem não tem dependentes"], "correta": 0, "explicacao": "Quem tem poucas deduções legais costuma se beneficiar do desconto simplificado, que substitui as deduções por um percentual dos rendimentos tributáveis (limitado a um teto). Ter investimentos não obriga ao modelo completo, e o próprio programa da declaração indica qual opção resulta em menos imposto."}, {"id": "M3A-059", "modulo": 3, "topico": "3.1.6.3 Modelo completo x desconto simplificado", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Um gerente sugere a um cliente aplicar em PGBL para “reduzir o imposto de renda”. O cliente declara pelo modelo simplificado e não contribui para o INSS nem para regime próprio. A orientação correta é:", "alternativas": ["O cliente pode deduzir até 12% no simplificado, desde que faça a contribuição em dezembro", "O PGBL é isento de IR no resgate, o que compensa a falta da dedução", "Nessa situação o benefício da dedução de até 12% da renda bruta tributável não se aplica, pois exige declaração no modelo completo e contribuição ao regime oficial de previdência; o VGBL pode ser mais adequado", "O PGBL trará o benefício fiscal de qualquer forma, pois a dedução vale para todos os contribuintes"], "correta": 2, "explicacao": "A dedução das contribuições ao PGBL, limitada a 12% da renda bruta tributável, só pode ser usada por quem declara no modelo completo e contribui para a previdência oficial. Sem isso, o cliente pagaria IR sobre o valor total resgatado no PGBL sem ter tido benefício na entrada; o VGBL, tributado apenas sobre os rendimentos, tende a ser mais adequado."}, {"id": "M3A-060", "modulo": 3, "topico": "3.2.1 Tipos de investimento versus tolerância a risco e horizonte de investimento", "dificuldade": "facil", "tipo": "mc", "enunciado": "Uma cliente de perfil moderado quer aplicar R$ 20.000,00 que serão usados em uma viagem daqui a seis meses. A recomendação mais adequada é:", "alternativas": ["Ações de empresas de crescimento, pois o perfil moderado permite renda variável", "Aplicação de renda fixa de baixo risco, com liquidez ou vencimento compatível com a data da viagem", "Título prefixado de longo prazo, para aproveitar uma taxa mais alta", "Fundo multimercado com cotização de resgate em D+60"], "correta": 1, "explicacao": "O horizonte curto e a data definida de uso pedem baixo risco e liquidez compatível. Mesmo que o perfil admita renda variável, o objetivo específico dessa parcela não suporta oscilações; títulos longos podem ter perda por marcação a mercado se vendidos antes do vencimento."}, {"id": "M3A-061", "modulo": 3, "topico": "3.2.1 Tipos de investimento versus tolerância a risco e horizonte de investimento", "dificuldade": "medio", "tipo": "mc", "enunciado": "Seu Jorge tem horizonte de investimento de 20 anos para parte do patrimônio, mas declara que perderia o sono com qualquer queda de valor e que resgataria tudo ao primeiro sinal de perda. Sobre a recomendação para esse cliente, é correto afirmar que:", "alternativas": ["Basta não informar ao cliente as oscilações da carteira para que ele aceite mais risco", "Tolerância a risco não faz parte da análise de perfil, apenas o prazo", "O horizonte longo obriga o gerente a recomendar ações, independentemente da tolerância declarada", "A tolerância a risco baixa deve prevalecer na escolha dos produtos; o gerente pode explicar a relação entre prazo, risco e retorno, mas não deve impor ativos que ele não suporta emocionalmente"], "correta": 3, "explicacao": "Horizonte e tolerância a risco são dimensões diferentes. Um horizonte longo permite, em tese, mais risco, mas se a tolerância é baixa o cliente tende a resgatar no pior momento e realizar perdas. A recomendação deve respeitar o perfil apurado, com educação financeira transparente e sem omitir informações."}, {"id": "M3A-062", "modulo": 3, "topico": "3.2.2.1 Financiamento de emergências (estratégias e produtos)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Carla, aposentada pelo INSS, precisa de R$ 10.000,00 para uma cirurgia urgente e não tem reserva de emergência. As opções são: rotativo do cartão, cheque especial ou crédito consignado. A orientação mais adequada é:", "alternativas": ["Usar o cheque especial por vários meses, pois tem juros limitados por norma", "Usar o rotativo do cartão, pois não exige análise de crédito", "Dividir o valor entre cartão e cheque especial para não comprometer o benefício", "Optar pelo consignado, que tende a ter o menor custo entre as opções, verificando a margem disponível e o impacto da parcela no orçamento, e depois planejar a formação da reserva"], "correta": 3, "explicacao": "Sem reserva, a emergência deve ser financiada pela linha de menor custo compatível com a capacidade de pagamento. O consignado costuma ser mais barato que cheque especial e rotativo. Depois, o plano deve incluir a construção da reserva, para que a próxima emergência não dependa de crédito."}, {"id": "M3A-063", "modulo": 3, "topico": "3.2.2.1 Financiamento de emergências (estratégias e produtos)", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Um cliente precisa de R$ 30.000,00 para uma emergência. Ele tem R$ 50.000,00 em um CDB com liquidez diária rendendo o equivalente a 0,9% ao mês, e o banco oferece crédito pessoal a 3,5% ao mês. A orientação mais adequada, em regra, é:", "alternativas": ["Resgatar o necessário do CDB, pois manter uma aplicação que rende 0,9% a.m. enquanto se paga 3,5% a.m. em uma dívida destrói valor; depois, recompor a reserva", "Resgatar todo o CDB, inclusive o que não é necessário, para quitar outras despesas futuras", "Tomar o crédito pessoal, para não mexer nos investimentos", "Tomar o crédito e aplicar o valor também no CDB"], "correta": 0, "explicacao": "Quando o custo da dívida supera o rendimento líquido da aplicação, usar os próprios recursos é financeiramente melhor. O cliente pagaria 3,5% a.m. para preservar algo que rende 0,9% a.m. Por ter liquidez diária, o CDB cumpre aqui o papel de reserva; depois, ela deve ser recomposta."}, {"id": "M3A-064", "modulo": 3, "topico": "3.2.2.2 Utilização de crédito e gestão de dívidas", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente possui três dívidas: rotativo do cartão (cerca de 14% a.m.), cheque especial (8% a.m.) e financiamento de veículo (1,6% a.m.). Ele conseguiu R$ 5.000,00 extras e quer amortizar dívidas. A prioridade financeiramente mais eficiente é:", "alternativas": ["Amortizar o financiamento do veículo, por ter o maior saldo devedor", "Dividir o valor igualmente entre as três dívidas", "Quitar primeiro a dívida com maior custo, o rotativo do cartão, depois o cheque especial, mantendo em dia as parcelas do financiamento", "Aplicar o valor em um CDB e continuar pagando o mínimo das dívidas"], "correta": 2, "explicacao": "Para reduzir o custo total do endividamento, prioriza-se a quitação das dívidas com maior custo efetivo, mantendo as demais em dia. O rotativo do cartão costuma ser a linha mais cara; nenhuma aplicação conservadora rende o suficiente para compensar esses juros."}, {"id": "M3A-065", "modulo": 3, "topico": "3.2.3 Gestão de investimentos", "dificuldade": "medio", "tipo": "mc", "enunciado": "A alocação estratégica definida para um cliente foi 70% em renda fixa e 30% em renda variável. Após um ano de forte alta da bolsa, a carteira passou a 55% em renda fixa e 45% em renda variável, sem mudança no perfil ou nos objetivos. A ação de gestão mais adequada é:", "alternativas": ["Mudar o perfil do cliente para arrojado, para justificar a nova alocação", "Rebalancear a carteira de volta à alocação-alvo, vendendo parte da renda variável ou direcionando novos aportes para a renda fixa", "Manter a carteira como está, pois o rebalanceamento só deve ocorrer após perdas", "Aumentar ainda mais a renda variável, pois está rendendo bem"], "correta": 1, "explicacao": "O rebalanceamento mantém o risco da carteira dentro do que foi planejado e compatível com o perfil. Deixar a alocação derivar aumenta a exposição a risco sem decisão consciente; alterar o perfil para acomodar a carteira inverte a lógica do suitability."}, {"id": "M3A-066", "modulo": 3, "topico": "3.2.3 Gestão de investimentos", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente compara dois fundos de renda fixa com a mesma estratégia e o mesmo risco: o fundo A cobra taxa de administração de 0,3% ao ano e o fundo B, de 1,5% ao ano. Na gestão dos investimentos dele, o gerente deve ressaltar que:", "alternativas": ["O fundo com taxa maior sempre entrega retorno maior, pois tem gestão melhor", "A taxa de administração só é cobrada quando o fundo tem rentabilidade positiva", "Em estratégias semelhantes, a diferença de custos reduz diretamente o retorno líquido e, ao longo de muitos anos, o efeito composto pode ser expressivo", "Taxas não importam, pois a rentabilidade divulgada já é bruta"], "correta": 2, "explicacao": "Custos como a taxa de administração são descontados do patrimônio do fundo e afetam diretamente o retorno líquido da pessoa investidora. Em fundos de mesma estratégia e risco, custos maiores tendem a significar retorno menor, e o efeito se acumula com os juros compostos."}, {"id": "M3A-067", "modulo": 3, "topico": "3.2.4 Gestão de risco e seguros", "dificuldade": "medio", "tipo": "mc", "enunciado": "Rogério, 38 anos, é o único provedor de uma família com dois filhos pequenos e tem financiamento imobiliário. Tem uma pequena reserva de emergência e investe para a aposentadoria. Na gestão de riscos do planejamento dele, o gerente deve destacar que:", "alternativas": ["Um seguro de vida (e eventualmente de invalidez) pode proteger a família contra a perda de renda em eventos de baixa probabilidade e alto impacto, que a reserva de emergência não cobriria", "Seguros só são necessários após a aposentadoria", "Seguros são produtos de investimento e devem ser avaliados apenas pela rentabilidade", "A reserva de emergência substitui a necessidade de qualquer seguro"], "correta": 0, "explicacao": "Seguros transferem à seguradora o risco financeiro de eventos pouco prováveis mas de grande impacto, como morte ou invalidez do provedor. A reserva cobre imprevistos menores; para quem tem dependentes e dívidas de longo prazo, a proteção da renda é parte essencial do planejamento."}, {"id": "M3A-068", "modulo": 3, "topico": "3.2.4 Gestão de risco e seguros", "dificuldade": "facil", "tipo": "mc", "enunciado": "Sobre a relação entre reserva de emergência e seguros no planejamento financeiro, é correto afirmar que:", "alternativas": ["O seguro deve ser usado para cobrir pequenas despesas imprevistas do dia a dia", "A reserva deve ser aplicada em um seguro de vida para render mais", "São equivalentes: quem tem seguro não precisa de reserva", "São complementares: a reserva cobre imprevistos frequentes e de menor valor, enquanto o seguro protege contra perdas grandes e improváveis que o patrimônio não suportaria"], "correta": 3, "explicacao": "Reserva e seguros são ferramentas complementares de gestão de riscos. Pequenos imprevistos são cobertos com recursos próprios e líquidos; eventos catastróficos (incêndio, morte, invalidez) são transferidos à seguradora mediante o pagamento do prêmio."}, {"id": "M3A-069", "modulo": 3, "topico": "3.3.1 Perfis da pessoa investidora", "dificuldade": "facil", "tipo": "mc", "enunciado": "Uma pessoa investidora prioriza a segurança e a liquidez, aceita retornos menores para evitar perdas e não tem experiência com ativos de risco. Esse perfil é tipicamente classificado como:", "alternativas": ["Arrojado", "Conservador", "Moderado", "Profissional"], "correta": 1, "explicacao": "O perfil conservador prioriza preservação do capital e liquidez, com baixa tolerância a perdas. O moderado aceita alguma oscilação em busca de retorno maior; o arrojado (ou agressivo) aceita oscilações relevantes. Profissional é uma classificação regulatória ligada ao patrimônio e à qualificação, não um perfil de risco."}, {"id": "M3A-070", "modulo": 3, "topico": "3.3.1 Perfis da pessoa investidora", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma cliente responde ao questionário de suitability: horizonte de 10 anos, renda estável, já investiu em fundos multimercado e ações, aceita perdas temporárias moderadas, mas quer manter a maior parte do patrimônio em renda fixa. O perfil mais provável e a carteira compatível são:", "alternativas": ["Profissional, pois já investiu em ações", "Arrojado, com 100% em renda variável e derivativos", "Conservador, com 100% em poupança", "Moderado, com predominância de renda fixa e parcela minoritária em ativos de maior risco"], "correta": 3, "explicacao": "A combinação de experiência, horizonte médio-longo, aceitação de perdas moderadas e preferência pela renda fixa caracteriza o perfil moderado. Ter investido em ações não torna ninguém profissional, classificação que depende de critérios regulatórios específicos."}, {"id": "M3A-071", "modulo": 3, "topico": "3.3.2 Adequação de produtos financeiros", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente classificado como conservador pede ao gerente um COE com capital em risco que viu em uma propaganda. O gerente deve:", "alternativas": ["Recusar-se a registrar a ordem, pois clientes conservadores são proibidos de comprar produtos de risco", "Executar a ordem sem comentários, pois a iniciativa foi do cliente", "Esclarecer que o produto não é adequado ao perfil, explicar os riscos e, se o cliente insistir por iniciativa própria, alertá-lo formalmente e obter sua declaração expressa de ciência da inadequação antes de executar a ordem", "Alterar o perfil do cliente no sistema para arrojado e realizar a operação"], "correta": 2, "explicacao": "A regra de suitability veda a recomendação de produtos inadequados, mas não impede o cliente de investir por iniciativa própria. Nesse caso, a instituição deve alertá-lo sobre a inadequação, com os motivos, e obter declaração expressa de que está ciente. Alterar o perfil para viabilizar a venda é conduta grave."}, {"id": "M3A-072", "modulo": 3, "topico": "3.3.2 Adequação de produtos financeiros", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Na análise de adequação de um produto a um cliente, além do perfil de risco, devem ser considerados:", "alternativas": ["O objetivo do investimento, o horizonte, a situação financeira (incluindo liquidez necessária) e o conhecimento e experiência do cliente com aquele tipo de produto, bem como a complexidade, os custos e os riscos do produto", "Somente o fato de o produto estar coberto ou não pelo FGC", "Somente o valor disponível para aplicação", "Apenas a rentabilidade histórica do produto e a meta comercial da agência"], "correta": 0, "explicacao": "A adequação considera três eixos: se o produto atende aos objetivos do cliente, se a situação financeira é compatível e se ele tem conhecimento para entender os riscos. Do lado do produto, consideram-se riscos, complexidade, liquidez e custos. Rentabilidade passada e metas comerciais não são critérios de adequação."}, {"id": "M3A-073", "modulo": 3, "topico": "3.3.3 Avaliação de risco e retorno", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Dois fundos tiveram no último ano: Fundo A, retorno de 14% com volatilidade (desvio padrão) de 10%; Fundo B, retorno de 16% com volatilidade de 20%. A taxa livre de risco no período foi de 10%. Pelo índice de Sharpe, é correto afirmar que:", "alternativas": ["Os dois fundos têm o mesmo desempenho ajustado ao risco", "O Fundo A é melhor, com Sharpe de 0,4 contra 0,3 do Fundo B, pois entregou mais retorno excedente por unidade de risco", "O Fundo B é melhor, pois teve o maior retorno absoluto", "O Fundo B é melhor, com índice de Sharpe de 0,8"], "correta": 1, "explicacao": "Sharpe = (retorno − taxa livre de risco) ÷ desvio padrão. A: (14 − 10) ÷ 10 = 0,4. B: (16 − 10) ÷ 20 = 0,3. O Fundo A gerou mais retorno acima da taxa livre de risco por unidade de volatilidade. Olhar só o retorno absoluto ignora o risco assumido."}, {"id": "M3A-074", "modulo": 3, "topico": "3.3.3 Avaliação de risco e retorno", "dificuldade": "facil", "tipo": "mc", "enunciado": "Um cliente pergunta por que um título de uma empresa com classificação de risco mais baixa paga taxa maior que um título público de mesmo prazo. A explicação correta é:", "alternativas": ["Porque taxas maiores significam menor risco de crédito", "Porque títulos públicos são isentos de IR", "Porque o investidor exige um prêmio para assumir risco maior; maior retorno esperado está associado a maior risco", "Porque títulos privados têm garantia do Tesouro Nacional"], "correta": 2, "explicacao": "A relação risco-retorno é central em investimentos: para aceitar mais risco (de crédito, de mercado ou de liquidez), o investidor exige um prêmio. O título público federal é a referência de menor risco de crédito na economia doméstica, por isso paga menos que emissores com risco maior."}, {"id": "M3A-075", "modulo": 3, "topico": "3.3.4 Diversificação de carteira", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma cliente concentra 80% do patrimônio em ações de uma única empresa, onde trabalha. Sobre a diversificação dessa carteira, é correto afirmar que:", "alternativas": ["Diversificar significa comprar ações de mais empresas do mesmo grupo econômico", "Diversificar elimina todo o risco da carteira, inclusive o risco de mercado", "Concentração não é um problema, pois ela conhece bem a empresa", "Diversificar em ativos com baixa correlação reduziria o risco específico (não sistemático) dessa empresa, que hoje afeta tanto o emprego quanto o patrimônio dela"], "correta": 3, "explicacao": "A diversificação reduz o risco específico de um emissor ou setor, mas não elimina o risco sistemático (de mercado). No caso, a concentração é ainda mais grave porque emprego e patrimônio dependem da mesma empresa. Ativos do mesmo grupo econômico tendem a ter alta correlação e pouco diversificam."}, {"id": "M3A-076", "modulo": 3, "topico": "3.3.4 Diversificação de carteira", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Um gerente quer reduzir a volatilidade da carteira de um cliente sem necessariamente reduzir o retorno esperado. O princípio que fundamenta essa possibilidade é:", "alternativas": ["Aumentar o número de ativos de um mesmo setor, independentemente da correlação", "Combinar ativos com baixa ou negativa correlação, pois as oscilações de uns tendem a ser compensadas pelas de outros, reduzindo o risco total da carteira", "Concentrar a carteira no ativo de maior retorno histórico", "Combinar ativos com alta correlação positiva, que sobem e caem juntos"], "correta": 1, "explicacao": "O benefício da diversificação depende da correlação entre os ativos: quanto menor, maior a redução do risco total para um dado retorno esperado. Ativos muito correlacionados oscilam juntos, e somar mais ativos do mesmo setor pouco reduz o risco."}, {"id": "M3A-077", "modulo": 3, "topico": "3.3.5 Pessoa investidora profissional e qualificada", "dificuldade": "facil", "tipo": "mc", "enunciado": "Segundo a Resolução CVM 30, uma pessoa física que possui R$ 1.500.000,00 em aplicações financeiras e atesta essa condição por escrito é classificada como:", "alternativas": ["Investidora qualificada", "Investidora profissional", "Investidora conservadora", "Investidora de varejo, pois só pessoas jurídicas podem ser qualificadas"], "correta": 0, "explicacao": "A Resolução CVM 30 classifica como qualificada a pessoa natural ou jurídica com investimentos financeiros superiores a R$ 1 milhão que ateste essa condição por escrito. Para ser profissional por critério de patrimônio, são necessários mais de R$ 10 milhões. Perfil conservador é resultado de suitability, não classificação regulatória."}, {"id": "M3A-078", "modulo": 3, "topico": "3.3.5 Pessoa investidora profissional e qualificada", "dificuldade": "medio", "tipo": "mc", "enunciado": "Sobre as categorias de investidor qualificado e profissional, é correto afirmar que:", "alternativas": ["O investidor qualificado tem mais proteção regulatória que o investidor de varejo", "Qualquer pessoa com mais de 10 anos de experiência no mercado é automaticamente profissional", "São critérios definidos pelo próprio gerente com base na experiência do cliente", "O investidor profissional (por patrimônio, mais de R$ 10 milhões em aplicações) também é considerado qualificado, e essas classificações dão acesso a produtos e ofertas com menor nível de proteção regulatória, restritos a esses públicos"], "correta": 3, "explicacao": "Investidores profissionais são também qualificados. Essas categorias existem porque presume-se maior capacidade de avaliar riscos, o que permite o acesso a produtos e ofertas com exigências regulatórias menores. A classificação segue critérios da CVM (patrimônio, certificações, tipo de instituição), não a percepção do gerente."}, {"id": "M3A-079", "modulo": 3, "topico": "3.3.5 Pessoa investidora profissional e qualificada", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente com R$ 600.000,00 em aplicações quer investir em um produto destinado exclusivamente a investidores qualificados, alegando ser “experiente”. A conduta correta do gerente é:", "alternativas": ["Informar que, pelo critério de patrimônio, ele não se enquadra como qualificado e, portanto, não pode acessar esse produto apenas por se declarar experiente", "Fracionar a aplicação em duas partes, para que nenhuma delas ultrapasse o limite", "Somar ao patrimônio do cliente o valor de seu imóvel residencial para atingir R$ 1 milhão", "Aceitar a aplicação mediante declaração do cliente de que é experiente"], "correta": 0, "explicacao": "O critério patrimonial de investidor qualificado considera investimentos financeiros superiores a R$ 1 milhão; imóvel residencial não entra nesse cômputo, e a experiência alegada não substitui os critérios da regulamentação. Tentar contornar a regra seria conduta irregular."}, {"id": "M3A-080", "modulo": 3, "topico": "3.4.1.1 Os princípios éticos", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um profissional certificado pela ANBIMA percebe que poderia aumentar a própria remuneração recomendando a um cliente um produto mais caro e menos adequado. Considerando os princípios éticos que orientam a atuação dos profissionais certificados, a conduta esperada é:", "alternativas": ["Recomendar o produto mais caro e compensar o cliente com um desconto pessoal", "Recomendar o produto mais adequado ao cliente, agindo
