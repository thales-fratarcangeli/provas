<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulado CPA ANBIMA</title>
<style>
  :root {
    --bg: #f3f6ff; --card: #ffffff; --text: #1e1b4b; --muted: #6366a0; --line: #dfe3fb;
    --accent: #4f46e5; --accent2: #db2777; --ok: #059669; --ok-bg: #d1fae5; --err: #e11d48; --err-bg: #ffe4e6; --sel: #eef2ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 "Segoe UI", system-ui, sans-serif; }
  header { background: linear-gradient(120deg, #4f46e5, #9333ea 55%, #db2777); color: #fff; box-shadow: 0 2px 10px rgba(79,70,229,.25); padding: 14px 16px; position: sticky; top: 0; z-index: 5; }
  .wrap { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  .stats { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: #e0e7ff; }
  .stats b { color: #fff; }
  .bars { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 6px 14px; margin-top: 8px; font-size: 12px; color: #e0e7ff; }
  .bar { height: 6px; background: rgba(255,255,255,.3); border-radius: 3px; overflow: hidden; margin-top: 2px; }
  .bar span { display: block; height: 100%; background: #fde047; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  select, button, input { font: inherit; }
  select, input[type=search] { padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--text); }
  .btn { padding: 6px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--text); cursor: pointer; }
  .btn.primary { background: #fde047; border-color: #fde047; color: #3b0764; font-weight: 600; }
  header .btn:not(.primary) { background: rgba(255,255,255,.15); border-color: rgba(255,255,255,.5); color: #fff; }
  main { padding: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-top: 4px solid var(--accent); box-shadow: 0 2px 8px rgba(79,70,229,.08); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  .meta { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; margin-bottom: 8px; }
  .tag { padding: 1px 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--sel); color: var(--accent); font-weight: 600; }
  .tag.ok { color: var(--ok); border-color: var(--ok); }
  .tag.err { color: var(--err); border-color: var(--err); }
  .enun { white-space: pre-line; margin: 0 0 10px; }
  .opts { display: grid; gap: 8px; }
  .opt { text-align: left; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--text); cursor: pointer; display: flex; gap: 10px; }
  .opt:hover:not([disabled]) { background: var(--sel); border-color: var(--accent); }
  .opt[disabled] { cursor: default; }
  .opt .l { font-weight: 700; min-width: 18px; color: var(--accent2); }
  .opt.correct { background: var(--ok-bg); border-color: var(--ok); }
  .opt.wrong { background: var(--err-bg); border-color: var(--err); }
  .fb { margin-top: 10px; padding: 10px 12px; border-radius: 8px; font-size: 14px; }
  .fb.ok { background: var(--ok-bg); }
  .fb.err { background: var(--err-bg); }
  .fb b { display: block; margin-bottom: 2px; }
  .redo { margin-top: 8px; font-size: 12px; }
  .ctx { background: #fdf4ff; border-left: 4px solid #c026d3; border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; white-space: pre-line; }
  .step { border-left: 3px solid #c4b5fd; padding-left: 12px; margin: 12px 0; }
  .client { font-style: italic; margin-bottom: 8px; }
  .client::before { content: "Cliente: "; font-style: normal; font-weight: 700; }
  .who { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .pager { display: flex; justify-content: center; align-items: center; gap: 10px; margin: 10px 0 30px; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  .result { font-size: 18px; }
  .timer { font-variant-numeric: tabular-nums; font-weight: 700; }
  @media (max-width: 600px) { body { font-size: 14px; } .opt { padding: 9px 10px; } }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Simulado CPA ANBIMA <span style="font-weight:400;font-size:13px;color:#e0e7ff">· programa vigente desde 01/2026</span></h1>
    <div class="stats" id="stats"></div>
    <div class="bars" id="bars"></div>
    <div class="controls" id="controls">
      <button class="btn primary" id="btnProva">Simulado de prova (50 questões)</button>
      <button class="btn" id="btnReset">Zerar progresso</button>
    </div>
  </div>
</header>
<main><div class="wrap" id="lista"></div></main>

<script>
const BANCO = [{"id": "M1A-001", "modulo": 1, "topico": "1.1.1.1.1 Conselho Monetário Nacional (CMN)", "dificuldade": "facil", "tipo": "mc", "enunciado": "Ao ler uma notícia, uma cliente descobre que foi confirmada a meta para a inflação que o Banco Central deve perseguir. Ela pergunta à pessoa profissional qual órgão do Sistema Financeiro Nacional é responsável por fixar essa meta. A resposta correta é:", "alternativas": ["O Comitê de Política Monetária (Copom)", "A Comissão de Valores Mobiliários (CVM)", "O Conselho Monetário Nacional (CMN)", "A Diretoria Colegiada do Banco Central"], "correta": 2, "explicacao": "A fixação da meta para a inflação é atribuição do CMN, órgão normativo máximo do SFN. Ao Banco Central, por meio do Copom, cabe executar a política monetária (definindo a meta Selic) para atingir a meta fixada. A confusão comum é atribuir ao Copom a definição da meta de inflação, quando ele define a meta da taxa Selic."}, {"id": "M1A-002", "modulo": 1, "topico": "1.1.1.1.1 Conselho Monetário Nacional (CMN)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Em um treinamento interno, um novo assistente afirma que o CMN é formado pelos presidentes do Banco Central e da CVM. A composição correta do Conselho Monetário Nacional é:", "alternativas": ["Presidente da República (que o preside), Ministro da Fazenda e Presidente do Banco Central", "Presidente do Banco Central (que o preside), Presidente da CVM e Ministro da Fazenda", "Ministro da Fazenda (que o preside), Presidente da CVM e Superintendente da SUSEP", "Ministro da Fazenda (que o preside), Ministro do Planejamento e Orçamento e Presidente do Banco Central"], "correta": 3, "explicacao": "O CMN é composto por três membros: o Ministro da Fazenda, que o preside, o Ministro do Planejamento e Orçamento e o Presidente do Banco Central. O presidente da CVM não integra o Conselho, embora a CVM esteja sujeita às diretrizes gerais do CMN."}, {"id": "M1A-003", "modulo": 1, "topico": "1.1.1.1.1 Conselho Monetário Nacional (CMN)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente insatisfeito com seu banco diz que vai 'denunciar a instituição ao Conselho Monetário Nacional, que fiscaliza os bancos'. Qual orientação está tecnicamente correta?", "alternativas": ["O CMN é o órgão supervisor dos bancos e pode aplicar diretamente multas às instituições que descumprirem suas normas", "O CMN é órgão normativo: define diretrizes e regras gerais do sistema, mas a supervisão e a fiscalização das instituições financeiras cabem ao Banco Central", "O CMN fiscaliza os bancos por meio do Copom, que é o seu braço operacional", "O CMN fiscaliza somente bancos públicos; os bancos privados são fiscalizados pela CVM"], "correta": 1, "explicacao": "No SFN há uma separação entre órgãos normativos (CMN, CNSP e CNPC), que estabelecem diretrizes e regras, e órgãos supervisores (BC, CVM, SUSEP e PREVIC), que fiscalizam e fazem cumprir as normas. A reclamação contra um banco deve ser dirigida ao Banco Central (além dos canais da própria instituição), e não ao CMN."}, {"id": "M1A-004", "modulo": 1, "topico": "1.1.1.1.2 Conselho Nacional de Seguros Privados (CNSP)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma pessoa investidora pergunta qual órgão define as regras gerais aplicáveis aos planos PGBL e VGBL que ela contratou em uma seguradora, bem como às operações de seguros e de títulos de capitalização. Esse órgão normativo é o:", "alternativas": ["Conselho Nacional de Seguros Privados (CNSP)", "Conselho Monetário Nacional (CMN)", "Superintendência de Seguros Privados (SUSEP)", "Conselho Nacional de Previdência Complementar (CNPC)"], "correta": 0, "explicacao": "O CNSP é o órgão normativo dos mercados de seguros privados, resseguros, capitalização e previdência complementar aberta (PGBL e VGBL). A SUSEP é o órgão supervisor desses mercados, ou seja, fiscaliza o cumprimento das regras, mas não é o órgão normativo. O CNPC cuida da previdência fechada (fundos de pensão)."}, {"id": "M1A-005", "modulo": 1, "topico": "1.1.1.1.3 Conselho Nacional de Previdência Complementar (CNPC)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Funcionária de uma grande empresa estatal, Renata participa do fundo de pensão patrocinado por sua empregadora. O órgão que estabelece as normas gerais para o funcionamento das entidades fechadas de previdência complementar, como esse fundo de pensão, é o:", "alternativas": ["Conselho Nacional de Previdência Complementar (CNPC)", "Superintendência Nacional de Previdência Complementar (PREVIC)", "Conselho Nacional de Seguros Privados (CNSP)", "Conselho Monetário Nacional (CMN)"], "correta": 0, "explicacao": "O CNPC é o órgão normativo do regime de previdência complementar operado pelas entidades fechadas (fundos de pensão). A PREVIC é o órgão supervisor dessas entidades. O CNSP regula a previdência aberta (EAPC e seguradoras), e não os fundos de pensão."}, {"id": "M1A-006", "modulo": 1, "topico": "1.1.2.1.1 Banco Central (BC)", "dificuldade": "facil", "tipo": "mc", "enunciado": "Entre as atribuições abaixo, qual é típica do Banco Central do Brasil?", "alternativas": ["Fiscalizar seguradoras e entidades abertas de previdência complementar", "Registrar ofertas públicas de ações de companhias abertas", "Fixar a meta para a inflação a ser perseguida pela política monetária", "Recolher os depósitos compulsórios e realizar operações de redesconto com as instituições financeiras"], "correta": 3, "explicacao": "O BC é o executor da política monetária e atua como 'banco dos bancos', recolhendo compulsórios e concedendo assistência de liquidez (redesconto). A fixação da meta de inflação é do CMN, o registro de ofertas públicas é da CVM e a fiscalização de seguradoras e EAPC é da SUSEP."}, {"id": "M1A-007", "modulo": 1, "topico": "1.1.2.1.1 Banco Central (BC)", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Sobre a autonomia do Banco Central, estabelecida pela Lei Complementar nº 179/2021, é correto afirmar que:", "alternativas": ["O BC passou a ser subordinado hierarquicamente ao Ministério da Fazenda, que aprova previamente as decisões do Copom", "O presidente do BC tem mandato coincidente com o do Presidente da República, para alinhar as políticas monetária e fiscal", "O BC tem como objetivo fundamental assegurar a estabilidade de preços e seus dirigentes têm mandatos fixos de quatro anos, não coincidentes com o do Presidente da República", "O BC passou a ter como objetivo fundamental o pleno emprego, sendo a estabilidade de preços um objetivo secundário"], "correta": 2, "explicacao": "A LC 179/2021 definiu como objetivo fundamental do BC assegurar a estabilidade de preços; sem prejuízo disso, o BC também deve zelar pela estabilidade e eficiência do sistema financeiro, suavizar as flutuações da atividade econômica e fomentar o pleno emprego. Presidente e diretores têm mandatos de quatro anos, não coincidentes com o do Presidente da República, e o BC não tem vinculação nem subordinação a ministério."}, {"id": "M1A-008", "modulo": 1, "topico": "1.1.2.1.1 Banco Central (BC)", "dificuldade": "facil", "tipo": "mc", "enunciado": "Um cliente recebeu oferta de crédito pessoal de uma 'financeira' (sociedade de crédito, financiamento e investimento) e quer saber se ela está regularmente autorizada a funcionar. O órgão responsável por autorizar o funcionamento e supervisionar esse tipo de instituição é:", "alternativas": ["O Conselho Monetário Nacional", "O Banco Central do Brasil", "A ANBIMA", "A Comissão de Valores Mobiliários"], "correta": 1, "explicacao": "Cabe ao Banco Central autorizar o funcionamento e supervisionar as instituições financeiras, como bancos, financeiras, cooperativas de crédito e administradoras de consórcio. O CMN edita as normas gerais, mas não concede autorizações individuais nem fiscaliza; a ANBIMA é entidade autorreguladora privada."}, {"id": "M1A-009", "modulo": 1, "topico": "1.1.2.1.2 Comissão de Valores Mobiliários (CVM)", "dificuldade": "facil", "tipo": "mc", "enunciado": "Uma companhia aberta divulgou ao mercado um fato relevante incompleto, o que prejudicou acionistas minoritários. O órgão responsável por fiscalizar e, se for o caso, punir a companhia é:", "alternativas": ["A Comissão de Valores Mobiliários (CVM)", "O Fundo Garantidor de Créditos (FGC)", "O Banco Central do Brasil", "A Superintendência de Seguros Privados (SUSEP)"], "correta": 0, "explicacao": "A CVM disciplina e fiscaliza o mercado de valores mobiliários, incluindo as companhias abertas e as informações que elas divulgam, com o objetivo de proteger as pessoas investidoras e assegurar a transparência do mercado. O BC supervisiona instituições financeiras, e não a divulgação de informações por companhias abertas."}, {"id": "M1A-010", "modulo": 1, "topico": "1.1.2.1.2 Comissão de Valores Mobiliários (CVM)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Lucas, economista, pretende prestar serviços remunerados de gestão de carteiras de valores mobiliários para terceiros. Para exercer essa atividade de forma regular, ele precisa de autorização de qual órgão?", "alternativas": ["Conselho Monetário Nacional", "Comissão de Valores Mobiliários (CVM)", "Banco Central do Brasil", "B3 S.A. – Brasil, Bolsa, Balcão"], "correta": 1, "explicacao": "A administração de carteiras de valores mobiliários (incluindo a gestão) depende de autorização da CVM, que também registra e fiscaliza consultores, analistas, fundos de investimento e auditores independentes que atuam nesse mercado. A B3 administra mercados, mas não concede autorização para essa atividade profissional."}, {"id": "M1A-011", "modulo": 1, "topico": "1.1.2.1.2 Comissão de Valores Mobiliários (CVM)", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Assinale a afirmação correta sobre a Comissão de Valores Mobiliários:", "alternativas": ["Garante o ressarcimento das perdas das pessoas investidoras em ações quando a companhia emissora vai à falência", "Define a taxa básica de juros que remunera os títulos negociados em bolsa", "É uma autarquia vinculada ao Ministério da Fazenda que regula e fiscaliza o mercado de valores mobiliários, podendo aplicar penalidades como multa e inabilitação temporária", "É um departamento do Banco Central encarregado de fiscalizar as operações de bolsa"], "correta": 2, "explicacao": "A CVM foi criada pela Lei 6.385/1976 como autarquia em regime especial, vinculada ao Ministério da Fazenda, com poderes para normatizar, fiscalizar e punir participantes do mercado de valores mobiliários. Ela não é parte do BC, não garante perdas de investimentos em ações (que são risco da pessoa investidora) e não define juros, atribuição do Copom."}, {"id": "M1A-012", "modulo": 1, "topico": "1.1.2.1.3 Superintendência de Seguros Privados (SUSEP)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente reclama que a seguradora está demorando a pagar a indenização de um sinistro e que o corretor de seguros não lhe deu informações adequadas. O órgão público ao qual ele pode recorrer, por ser o supervisor desses participantes, é:", "alternativas": ["A PREVIC", "A CVM", "O Banco Central", "A SUSEP"], "correta": 3, "explicacao": "A SUSEP fiscaliza seguradoras, resseguradoras, sociedades de capitalização, entidades abertas de previdência complementar e também os corretores de seguros. A PREVIC supervisiona apenas os fundos de pensão (entidades fechadas)."}, {"id": "M1A-013", "modulo": 1, "topico": "1.1.2.1.4 Superintendência Nacional de Previdência Complementar (PREVIC)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Participantes do fundo de pensão de uma empresa de energia suspeitam de má gestão dos investimentos do plano. O órgão responsável por fiscalizar e supervisionar essa entidade é:", "alternativas": ["A SUSEP", "A CVM", "O CNPC", "A PREVIC"], "correta": 3, "explicacao": "Fundos de pensão são entidades fechadas de previdência complementar (EFPC), supervisionadas pela PREVIC. A SUSEP supervisiona a previdência aberta (PGBL/VGBL), e o CNPC é o órgão normativo, não o fiscalizador."}, {"id": "M1A-014", "modulo": 1, "topico": "1.1.2.1.4 Superintendência Nacional de Previdência Complementar (PREVIC)", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Ana possui um PGBL contratado em uma seguradora. João participa do plano de previdência fechado oferecido pela empresa em que trabalha. Os órgãos normativo e supervisor de cada plano são, respectivamente:", "alternativas": ["Ana: CNPC e PREVIC; João: CNSP e SUSEP", "Ana: CMN e Banco Central; João: CNPC e SUSEP", "Ana: CNSP e SUSEP; João: CNPC e PREVIC", "Ana e João: CNSP e SUSEP, pois ambos são planos de previdência complementar"], "correta": 2, "explicacao": "A previdência complementar aberta (PGBL e VGBL, oferecidos por seguradoras e EAPC) é regulada pelo CNSP e supervisionada pela SUSEP. A previdência complementar fechada (fundos de pensão) é regulada pelo CNPC e supervisionada pela PREVIC. Ser 'previdência complementar' não coloca os dois planos sob os mesmos órgãos."}, {"id": "M1A-015", "modulo": 1, "topico": "1.1.3.1.1 Bancos e caixas econômicas", "dificuldade": "facil", "tipo": "mc", "enunciado": "Uma pequena indústria precisa de uma conta para movimentar pagamentos e recebimentos do dia a dia e de crédito de curto prazo para capital de giro. O tipo de instituição cuja atividade típica é captar depósitos à vista e conceder esse tipo de crédito é:", "alternativas": ["Banco comercial", "Agência de fomento", "Sociedade de crédito, financiamento e investimento", "Administradora de consórcio"], "correta": 0, "explicacao": "Os bancos comerciais têm como atividade típica a captação de depósitos à vista (conta corrente) e a concessão de crédito de curto e médio prazo, como capital de giro. Financeiras não captam depósitos à vista, agências de fomento não captam recursos do público e administradoras de consórcio apenas administram grupos de autofinanciamento."}, {"id": "M1A-016", "modulo": 1, "topico": "1.1.3.1.1 Bancos e caixas econômicas", "dificuldade": "medio", "tipo": "mc", "enunciado": "Qual característica é típica da Caixa Econômica Federal, diferenciando-a dos bancos comerciais privados?", "alternativas": ["É uma cooperativa de crédito de abrangência nacional, cujos donos são os correntistas", "É empresa pública federal que atua como agente operador do FGTS e tem papel central no crédito habitacional e em programas sociais do governo", "É proibida de captar depósitos à vista e de poupança, atuando somente com repasses do governo", "É supervisionada pela CVM, e não pelo Banco Central, por ser instituição pública"], "correta": 1, "explicacao": "A Caixa é uma empresa pública federal que, além de atuar como banco (capta depósitos à vista e de poupança), opera o FGTS, tem forte presença no financiamento habitacional e executa programas sociais e loterias. Como as demais instituições financeiras, é supervisionada pelo Banco Central."}, {"id": "M1A-017", "modulo": 1, "topico": "1.1.3.1.1 Bancos e caixas econômicas", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um grande conglomerado opera, sob uma única pessoa jurídica, carteira comercial, carteira de investimento e carteira de crédito imobiliário. Esse tipo de instituição é denominado:", "alternativas": ["Sociedade de crédito direto, por operar diferentes linhas de crédito", "Companhia hipotecária, por possuir carteira de crédito imobiliário", "Banco múltiplo, que deve ter ao menos duas carteiras, sendo uma delas comercial ou de investimento", "Banco cooperativo, que reúne carteiras de diversas cooperativas de crédito"], "correta": 2, "explicacao": "O banco múltiplo reúne, em uma mesma pessoa jurídica, diferentes carteiras (comercial, de investimento, de crédito imobiliário, de crédito e financiamento, de arrendamento mercantil etc.), sendo obrigatório possuir ao menos duas, uma delas comercial ou de investimento. É o formato da maioria dos grandes bancos brasileiros."}, {"id": "M1A-018", "modulo": 1, "topico": "1.1.3.1.2 Cooperativas de crédito e banco cooperativo", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um produtor rural decide se associar a uma cooperativa de crédito da sua região. Qual afirmação sobre essa instituição está correta?", "alternativas": ["Os depósitos em cooperativas de crédito não contam com nenhum fundo garantidor", "A cooperativa de crédito é supervisionada pela CVM, pois os associados detêm cotas de capital", "A cooperativa pode atender qualquer pessoa, associada ou não, nas mesmas condições de um banco comercial", "Os associados são, ao mesmo tempo, donos e usuários da cooperativa, que é autorizada e supervisionada pelo Banco Central e pode distribuir sobras ao final do exercício"], "correta": 3, "explicacao": "Na cooperativa de crédito, o associado é dono (detém quotas-partes) e usuário dos serviços; os resultados positivos (sobras) podem ser distribuídos aos associados. As cooperativas são instituições financeiras autorizadas e supervisionadas pelo BC, e seus depósitos são protegidos pelo FGCoop."}, {"id": "M1A-019", "modulo": 1, "topico": "1.1.3.1.2 Cooperativas de crédito e banco cooperativo", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Sobre o banco cooperativo, é correto afirmar que:", "alternativas": ["É uma entidade regulada pela SUSEP que oferece seguros às cooperativas de crédito", "É um banco comercial ou múltiplo controlado por cooperativas centrais de crédito, que presta serviços às cooperativas do seu sistema, como acesso a produtos e à compensação", "É uma cooperativa singular que, ao atingir determinado porte, passa a atender o público em geral sem necessidade de associação", "É um banco estatal que fiscaliza as cooperativas de crédito em nome do Banco Central"], "correta": 1, "explicacao": "Bancos cooperativos são bancos comerciais ou múltiplos cujo controle pertence a cooperativas centrais de crédito. Eles permitem que as cooperativas acessem serviços bancários, produtos financeiros e o sistema de compensação. A fiscalização das cooperativas é do Banco Central, e não do banco cooperativo."}, {"id": "M1A-020", "modulo": 1, "topico": "1.1.3.1.3 Instituições de pagamento", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Juliana mantém R$ 8 mil de saldo em uma conta de pagamento pré-paga em um aplicativo operado por uma instituição de pagamento (emissora de moeda eletrônica). Sobre esse saldo, é correto afirmar que:", "alternativas": ["Constitui patrimônio separado do da instituição de pagamento, que não pode usá-lo para conceder empréstimos; esse saldo não conta com a garantia do FGC", "Pode ser emprestado pela instituição de pagamento a outros clientes, desde que ela informe a Juliana", "É fiscalizado pela CVM, pois a moeda eletrônica é considerada valor mobiliário", "Está coberto pelo FGC até R$ 250 mil, como um depósito à vista em banco comercial"], "correta": 0, "explicacao": "Instituições de pagamento são reguladas pelo Banco Central e não podem realizar atividades privativas de instituições financeiras, como conceder empréstimos com os recursos dos clientes. Os saldos em conta de pagamento formam patrimônio separado e devem ser mantidos em ativos seguros definidos pela regulação, mas não são cobertos pelo FGC, ao contrário do depósito à vista em banco."}, {"id": "M1A-021", "modulo": 1, "topico": "1.1.3.1.3 Instituições de pagamento", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma empresa que habilita lojistas a aceitar pagamentos com cartão, fornecendo as 'maquininhas' e repassando os valores das vendas, atua como:", "alternativas": ["Distribuidora de títulos e valores mobiliários", "Administradora de consórcio", "Instituição de pagamento na modalidade credenciadora", "Sociedade de crédito direto"], "correta": 2, "explicacao": "Os credenciadores são instituições de pagamento que habilitam estabelecimentos comerciais a aceitar instrumentos de pagamento (como cartões) e participam da liquidação das transações. Outras modalidades de IP são o emissor de moeda eletrônica e o emissor de instrumento de pagamento pós-pago."}, {"id": "M1A-022", "modulo": 1, "topico": "1.1.3.1.4 Administradoras de consórcios", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente quer comprar um carro por meio de consórcio. Qual informação a pessoa profissional deve passar corretamente?", "alternativas": ["As administradoras de consórcio são supervisionadas pela SUSEP, pois o consórcio é uma modalidade de seguro", "O consórcio é uma forma de autofinanciamento em grupo, sem cobrança de juros, mas com taxa de administração; a contemplação ocorre por sorteio ou lance, e as administradoras são supervisionadas pelo Banco Central", "No consórcio, a contemplação é garantida no primeiro mês para quem paga a taxa de administração antecipadamente", "O consórcio é um financiamento bancário com juros prefixados e liberação imediata do crédito na assinatura do contrato"], "correta": 1, "explicacao": "No consórcio, um grupo de pessoas contribui mensalmente para formar um fundo comum, e as contemplações ocorrem por sorteio ou lance. Não há juros, mas há taxa de administração (e, em geral, fundo de reserva). As administradoras de consórcio são autorizadas e supervisionadas pelo Banco Central."}, {"id": "M1A-023", "modulo": 1, "topico": "1.1.3.1.5 Corretoras e distribuidoras", "dificuldade": "medio", "tipo": "mc", "enunciado": "Sobre as sociedades corretoras (CTVM) e distribuidoras (DTVM) de títulos e valores mobiliários, é correto afirmar que:", "alternativas": ["Atualmente, tanto corretoras quanto distribuidoras podem atuar diretamente nos ambientes de bolsa, intermediando a compra e venda de títulos e valores mobiliários para a clientela", "Corretoras e distribuidoras captam depósitos à vista para financiar as operações da clientela", "Somente as corretoras podem distribuir cotas de fundos; as distribuidoras se limitam a operar câmbio", "Corretoras e distribuidoras são supervisionadas exclusivamente pela SUSEP"], "correta": 0, "explicacao": "Desde 2009, as distribuidoras também podem operar diretamente em bolsa, o que aproximou bastante as atividades de CTVM e DTVM. Ambas intermedeiam títulos e valores mobiliários, distribuem cotas de fundos e podem operar câmbio, sendo supervisionadas pelo Banco Central e pela CVM. Nenhuma delas capta depósitos à vista."}, {"id": "M1A-024", "modulo": 1, "topico": "1.1.3.1.5 Corretoras e distribuidoras", "dificuldade": "facil", "tipo": "mc", "enunciado": "Uma pessoa física quer começar a comprar ações listadas na B3. Para isso, ela deve:", "alternativas": ["Comprar as ações diretamente da companhia emissora, sem intermediação", "Solicitar autorização prévia ao Banco Central para cada operação", "Cadastrar-se diretamente no site da CVM, que executa as ordens de compra e venda", "Abrir conta em uma corretora ou distribuidora participante da B3, que a representará nos ambientes de negociação"], "correta": 3, "explicacao": "Pessoas investidoras acessam a bolsa por meio de intermediários autorizados (corretoras e distribuidoras), que enviam as ordens aos ambientes de negociação da B3. A CVM regula e fiscaliza, mas não executa ordens; o BC não autoriza operações individuais."}, {"id": "M1A-025", "modulo": 1, "topico": "1.1.3.1.6 Fintechs", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Uma startup quer criar uma plataforma eletrônica em que pessoas investidoras emprestam diretamente para pessoas e empresas tomadoras de crédito, com a plataforma fazendo apenas a intermediação. Pela regulação do CMN, o tipo de fintech de crédito adequado para essa atividade é a:", "alternativas": ["Sociedade de crédito, financiamento e investimento", "Sociedade de Crédito Direto (SCD)", "Instituição de pagamento emissora de moeda eletrônica", "Sociedade de Empréstimo entre Pessoas (SEP)"], "correta": 3, "explicacao": "A SEP realiza operações de empréstimo entre pessoas (peer-to-peer) por meio de plataforma eletrônica, conectando credores e devedores. A SCD, por outro lado, empresta exclusivamente com recursos próprios e não pode captar recursos do público. Ambas são fintechs de crédito autorizadas e supervisionadas pelo Banco Central."}, {"id": "M1A-026", "modulo": 1, "topico": "1.1.3.1.6 Fintechs", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente afirma que prefere fintechs 'porque elas não são reguladas e por isso cobram menos'. A pessoa profissional deve esclarecer que:", "alternativas": ["Fintechs são supervisionadas apenas pela ANBIMA, por meio de códigos de autorregulação", "Fintech é uma empresa que usa tecnologia intensivamente para oferecer serviços financeiros; conforme a atividade, ela precisa de autorização e é supervisionada pelo Banco Central ou pela CVM, como as demais instituições", "Fintechs podem captar depósitos do público livremente, sem autorização, desde que operem somente pela internet", "Fintechs são isentas de regulação até atingirem um porte mínimo definido pelo FGC"], "correta": 1, "explicacao": "O termo 'fintech' descreve o modelo de negócio, não um tipo jurídico. Uma fintech pode ser instituição de pagamento, SCD, SEP, banco digital ou plataforma de investimentos, e cada atividade exige a autorização correspondente (BC ou CVM). Ser digital não dispensa autorização para captar recursos do público."}, {"id": "M1A-027", "modulo": 1, "topico": "1.1.3.1.7 Sociedades de crédito, financiamento e investimento", "dificuldade": "medio", "tipo": "mc", "enunciado": "Ao comprar uma geladeira parcelada, um cliente assinou um contrato de crédito direto ao consumidor (CDC) com uma financeira (SCFI). O instrumento típico de captação de recursos dessas instituições junto às pessoas investidoras é:", "alternativas": ["A Letra de Câmbio (LC)", "O depósito de poupança", "A Letra Financeira do Tesouro (LFT)", "O depósito à vista em conta corrente"], "correta": 0, "explicacao": "As sociedades de crédito, financiamento e investimento (financeiras) concedem crédito pessoal e financiamento de bens (CDC) e captam recursos principalmente por meio de Letras de Câmbio, que contam com a garantia do FGC. Elas não captam depósitos à vista nem poupança; a LFT é título público federal."}, {"id": "M1A-028", "modulo": 1, "topico": "1.1.3.1.8 Companhias hipotecárias", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Uma instituição não bancária tem por objeto conceder financiamentos para produção, reforma ou comercialização de imóveis e administrar créditos hipotecários de terceiros. Ela não capta depósitos à vista nem depósitos de poupança e se financia, entre outras formas, com letras hipotecárias. Trata-se de uma:", "alternativas": ["Sociedade de crédito imobiliário", "Agência de fomento", "Companhia hipotecária", "Caixa econômica"], "correta": 2, "explicacao": "A companhia hipotecária é especializada em crédito imobiliário e na administração de créditos hipotecários de terceiros, sem captar depósitos à vista ou de poupança. A sociedade de crédito imobiliário, embora também financie imóveis, pode captar depósitos de poupança, e a caixa econômica capta depósitos à vista."}, {"id": "M1A-029", "modulo": 1, "topico": "1.1.3.1.11 Sociedade de Crédito Imobiliário (SCI)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Entre as instituições abaixo, qual é especializada em financiamento imobiliário e pode captar recursos por meio de depósitos de poupança?", "alternativas": ["Sociedade de crédito imobiliário (SCI)", "Sociedade de crédito ao microempreendedor e à empresa de pequeno porte", "Companhia hipotecária", "Sociedade de crédito, financiamento e investimento"], "correta": 0, "explicacao": "A SCI integra o Sistema Brasileiro de Poupança e Empréstimo (SBPE) e financia a construção e a aquisição de imóveis, podendo captar depósitos de poupança e emitir letras imobiliárias e de crédito imobiliário. A companhia hipotecária não capta poupança."}, {"id": "M1A-030", "modulo": 1, "topico": "1.1.3.1.9 Agências de fomento", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma empresa do interior de um estado busca financiamento para um projeto de expansão, dentro de um programa de desenvolvimento regional mantido pelo governo estadual por meio de sua agência de fomento. Sobre essa instituição, é correto afirmar que:", "alternativas": ["É supervisionada pela CVM, pois financia empresas", "Pode emitir CDB com garantia do FGC para financiar os projetos", "É um banco comercial estadual que capta depósitos à vista para financiar seus programas", "É controlada pelo estado, financia projetos de desenvolvimento em sua região e não pode captar recursos do público, como depósitos"], "correta": 3, "explicacao": "Agências de fomento são instituições controladas por estados (ou pelo Distrito Federal) que financiam projetos voltados ao desenvolvimento da sua unidade federativa. Elas são vedadas de captar recursos do público, funcionando com recursos próprios e repasses, e são supervisionadas pelo Banco Central."}, {"id": "M1A-031", "modulo": 1, "topico": "1.1.3.1.10 Sociedades de crédito à pessoa microempreendedora e à empresa de pequeno porte", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma artesã que atua como microempreendedora individual precisa de um pequeno empréstimo para comprar matéria-prima e procura uma instituição especializada em microcrédito para esse público. O tipo de instituição do SFN voltado especificamente a esse atendimento é a:", "alternativas": ["Companhia hipotecária", "Sociedade de crédito ao microempreendedor e à empresa de pequeno porte", "Entidade aberta de previdência complementar", "Sociedade de crédito imobiliário"], "correta": 1, "explicacao": "As sociedades de crédito ao microempreendedor e à empresa de pequeno porte concedem financiamentos a pessoas físicas microempreendedoras e a microempresas e empresas de pequeno porte, ampliando o acesso ao crédito. Elas são supervisionadas pelo BC e não podem captar recursos do público."}, {"id": "M1A-032", "modulo": 1, "topico": "1.1.3.1.12 B3 S/A – Brasil, bolsa e balcão", "dificuldade": "facil", "tipo": "mc", "enunciado": "Uma pessoa investidora comprou ações e debêntures por meio de sua corretora e quer entender quem faz a compensação, a liquidação e a guarda centralizada desses ativos. A afirmação correta é:", "alternativas": ["A CVM realiza a liquidação das operações e guarda os ativos em seu nome", "O Banco Central liquida as operações com ações e mantém a custódia das debêntures", "A B3 administra ambientes de negociação de bolsa e de balcão e atua como câmara de compensação e liquidação e como depositária central dos ativos", "A corretora é a única responsável pela liquidação, sem participação de qualquer infraestrutura de mercado"], "correta": 2, "explicacao": "A B3 é a infraestrutura de mercado que reúne bolsa, balcão organizado, câmaras de compensação e liquidação (atuando como contraparte central em muitos mercados) e depositária central. A CVM regula e fiscaliza, mas não liquida operações nem custodia ativos."}, {"id": "M1A-033", "modulo": 1, "topico": "1.1.3.1.13 Seguradoras e resseguradoras", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma seguradora fechou o seguro patrimonial de uma grande refinaria e, para não concentrar um risco tão elevado em seu balanço, transferiu parte dele para outra empresa. Essa operação e a empresa que recebe o risco são, respectivamente:", "alternativas": ["Previdência aberta e EAPC", "Resseguro e resseguradora", "Cosseguro e corretora de seguros", "Capitalização e sociedade de capitalização"], "correta": 1, "explicacao": "O resseguro é o 'seguro da seguradora': a seguradora transfere parte dos riscos que assumiu para uma resseguradora, diluindo exposições elevadas. As resseguradoras são reguladas pelo CNSP e supervisionadas pela SUSEP. Corretoras de seguros apenas intermedeiam e não assumem riscos."}, {"id": "M1A-034", "modulo": 1, "topico": "1.1.3.1.14 Entidades Abertas de Previdência Complementar (EAPC)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Carlos é profissional autônomo, sem vínculo empregatício, e quer contratar um plano de previdência complementar. Qual alternativa é correta?", "alternativas": ["Ele pode contratar um plano em uma entidade aberta de previdência complementar ou seguradora autorizada, pois esses planos são acessíveis a qualquer pessoa", "Ele só pode participar de um fundo de pensão, pois a previdência aberta é restrita a empregados de empresas patrocinadoras", "Planos abertos só podem ser contratados por quem já se aposentou pelo INSS", "Ele precisa de autorização da PREVIC para contratar um PGBL"], "correta": 0, "explicacao": "As EAPC (e as seguradoras autorizadas) oferecem planos como PGBL e VGBL a qualquer pessoa física, independentemente de vínculo empregatício; são reguladas pelo CNSP e supervisionadas pela SUSEP. As entidades fechadas (fundos de pensão) é que exigem vínculo com patrocinador ou instituidor."}, {"id": "M1A-035", "modulo": 1, "topico": "1.1.3.1.15 Sociedades de capitalização", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma cliente comprou um título de capitalização acreditando ser um investimento semelhante à poupança. A orientação correta sobre esse produto é:", "alternativas": ["O título é um valor mobiliário regulado pela CVM e negociado em bolsa", "O título rende obrigatoriamente mais do que a poupança e é coberto pelo FGC", "O título dá direito a concorrer a sorteios e permite resgatar, ao final do prazo, valor conforme as condições do plano; o resgate antecipado pode devolver menos do que foi pago", "O título garante sempre a devolução integral do valor pago, corrigido pela inflação, a qualquer momento"], "correta": 2, "explicacao": "Títulos de capitalização combinam formação de reserva com sorteios; não são produtos de investimento propriamente ditos e, em caso de resgate antecipado, o valor devolvido pode ser inferior ao pago. As sociedades de capitalização seguem as normas do CNSP e são supervisionadas pela SUSEP; o produto não tem cobertura do FGC."}, {"id": "M1A-036", "modulo": 1, "topico": "1.1.3.1.16 Entidades Fechadas de Previdência Complementar (EFPC) (Fundos de pensão)", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Comparando entidades fechadas (EFPC) e entidades abertas (EAPC) de previdência complementar, é correto afirmar que:", "alternativas": ["Não há diferença de acesso: ambas oferecem planos ao público em geral pela internet", "As EFPC têm fins lucrativos e são supervisionadas pela SUSEP, enquanto as EAPC são supervisionadas pela PREVIC", "As EFPC só podem ser criadas por empresas estatais, enquanto as EAPC só podem ser criadas por bancos", "As EFPC não têm fins lucrativos e são acessíveis apenas a empregados de patrocinadores ou associados de instituidores, enquanto as EAPC têm fins lucrativos e oferecem planos a qualquer pessoa"], "correta": 3, "explicacao": "Fundos de pensão (EFPC) são entidades sem fins lucrativos, acessíveis a empregados de uma empresa patrocinadora ou a associados de uma pessoa jurídica de caráter profissional, classista ou setorial (instituidor); são reguladas pelo CNPC e supervisionadas pela PREVIC. As EAPC são constituídas com fins lucrativos, atendem qualquer pessoa e ficam sob CNSP e SUSEP."}, {"id": "M1A-037", "modulo": 1, "topico": "1.1.3.1.17 Corretoras de seguros", "dificuldade": "facil", "tipo": "mc", "enunciado": "Sobre a atuação de um corretor de seguros, é correto afirmar que ele:", "alternativas": ["É fiscalizado pela CVM, pois apólices de seguro são valores mobiliários", "Atua como resseguradora das apólices que vende", "Assume o risco do segurado e paga a indenização em caso de sinistro", "Intermedeia a contratação do seguro entre o cliente e a seguradora, sem assumir o risco segurado, e é fiscalizado pela SUSEP"], "correta": 3, "explicacao": "O corretor de seguros é o intermediário legalmente habilitado para angariar e promover contratos de seguro, sendo remunerado por comissão. Quem assume o risco e paga a indenização é a seguradora. Os corretores são fiscalizados pela SUSEP."}, {"id": "M1A-038", "modulo": 1, "topico": "1.1.4.1 Anbima", "dificuldade": "facil", "tipo": "mc", "enunciado": "Ao exigir que instituições participantes certifiquem seus profissionais e ao fiscalizar o cumprimento de códigos de conduta por essas instituições, a ANBIMA exerce o papel de:", "alternativas": ["Fundo garantidor de investimentos", "Entidade autorreguladora do mercado", "Autarquia federal supervisora do mercado de capitais", "Órgão normativo do Sistema Financeiro Nacional"], "correta": 1, "explicacao": "A ANBIMA é uma associação privada que, entre outras atividades (representação, informação, educação), atua como autorreguladora: cria códigos de melhores práticas, certifica profissionais e supervisiona as instituições associadas ou aderentes. Ela não é órgão público nem integra a estrutura normativa estatal do SFN."}, {"id": "M1A-039", "modulo": 1, "topico": "1.1.4.1 Anbima", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma gestora aderiu voluntariamente a um código de autorregulação da ANBIMA. Qual afirmação é correta?", "alternativas": ["A gestora passa a ter de cumprir as regras do código, podendo ser penalizada pela ANBIMA em caso de descumprimento, sem prejuízo das normas da CVM e do BC", "Os códigos da ANBIMA valem para todas as instituições do mercado, mesmo as que não são associadas nem aderentes", "A adesão ao código dispensa a gestora de cumprir as normas da CVM sobre o mesmo assunto", "A ANBIMA pode cassar a autorização de funcionamento concedida à gestora pela CVM"], "correta": 0, "explicacao": "Os códigos de autorregulação vinculam as instituições associadas ou aderentes, que se comprometem a segui-los e se sujeitam às penalidades previstas (como advertência e multa). A autorregulação complementa a regulação estatal, sem substituí-la; a autorização para funcionar é concedida e cassada pelos órgãos públicos."}, {"id": "M1A-040", "modulo": 1, "topico": "1.1.4.1 Anbima", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um gestor quer comparar o desempenho de um fundo que investe em títulos públicos federais com um índice de referência que represente a carteira de títulos públicos do mercado. O índice adequado, calculado pela ANBIMA, é o:", "alternativas": ["IGP-M", "Ibovespa", "IMA (Índice de Mercado ANBIMA)", "IPCA"], "correta": 2, "explicacao": "Entre as atividades da ANBIMA está a produção de informações e índices de referência, como a família IMA, que reflete o desempenho de carteiras de títulos públicos federais. O Ibovespa é calculado pela B3, o IGP-M pela FGV e o IPCA pelo IBGE."}, {"id": "M1A-041", "modulo": 1, "topico": "1.1.4.2 Apimec, Planejar e Ancord", "dificuldade": "medio", "tipo": "mc", "enunciado": "Assinale a associação correta entre a entidade e o público ao qual está ligada:", "alternativas": ["Apimec – assessores de investimento; Planejar – analistas de valores mobiliários; Ancord – planejadores financeiros", "Apimec – planejadores financeiros; Planejar – corretoras; Ancord – analistas de valores mobiliários", "Apimec – corretoras de seguros; Planejar – gestores de fundos; Ancord – auditores independentes", "Apimec – analistas de valores mobiliários; Planejar – planejadores financeiros; Ancord – corretoras, distribuidoras e assessores de investimento"], "correta": 3, "explicacao": "A Apimec reúne e certifica analistas de valores mobiliários (certificação CNPI); a Planejar certifica planejadores financeiros (CFP); a Ancord representa corretoras, distribuidoras e assessores de investimento, sendo responsável pela certificação desses assessores."}, {"id": "M1A-042", "modulo": 1, "topico": "1.1.4.2 Apimec, Planejar e Ancord", "dificuldade": "facil", "tipo": "mc", "enunciado": "Um cliente quer contratar um profissional para montar seu planejamento financeiro pessoal completo (orçamento, investimentos, aposentadoria, sucessão) e pergunta qual entidade certifica planejadores financeiros no Brasil com a certificação CFP. A resposta é:", "alternativas": ["Planejar", "Apimec", "Ancord", "SUSEP"], "correta": 0, "explicacao": "A Planejar (Associação Brasileira de Planejamento Financeiro) é a entidade responsável pela certificação CFP de planejadores financeiros no Brasil. A Apimec está ligada aos analistas de valores mobiliários e a Ancord, a corretoras, distribuidoras e assessores de investimento."}, {"id": "M1A-043", "modulo": 1, "topico": "1.1.4.3 Fundo Garantidor de Créditos (FGC) e Fundo Garantidor do Cooperativismo de Crédito (FGCCoop)", "dificuldade": "facil", "tipo": "mc", "enunciado": "Mariana tem R$ 300 mil aplicados em um CDB de um único banco, que sofreu liquidação extrajudicial. Considerando que ela não recebeu outras garantias do FGC recentemente, quanto ela tem direito a receber do FGC?", "alternativas": ["R$ 300 mil", "R$ 250 mil", "Nada, pois CDB não tem cobertura do FGC", "R$ 1 milhão"], "correta": 1, "explicacao": "O FGC garante até R$ 250 mil por CPF ou CNPJ, por instituição ou conglomerado financeiro. Como o CDB é coberto, Mariana recebe R$ 250 mil do FGC; os R$ 50 mil restantes passam a ser cobrados na massa da liquidação, sem garantia de recebimento."}, {"id": "M1A-044", "modulo": 1, "topico": "1.1.4.3 Fundo Garantidor de Créditos (FGC) e Fundo Garantidor do Cooperativismo de Crédito (FGCCoop)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Pedro tem R$ 200 mil em CDB e R$ 150 mil em LCI, ambos emitidos pelo Banco Alfa, além de R$ 100 mil em poupança no Banco Beta, de outro conglomerado. Se o Banco Alfa sofrer intervenção e o FGC for acionado, o valor máximo que Pedro receberá do FGC referente ao Banco Alfa é:", "alternativas": ["R$ 450 mil", "R$ 200 mil", "R$ 250 mil", "R$ 350 mil"], "correta": 2, "explicacao": "O limite de R$ 250 mil é por CPF e por instituição ou conglomerado, somando todos os produtos cobertos naquela instituição. CDB e LCI no Banco Alfa totalizam R$ 350 mil, mas a garantia fica limitada a R$ 250 mil. A poupança no Banco Beta não entra na conta, por ser de outro conglomerado, que não sofreu intervenção."}, {"id": "M1A-045", "modulo": 1, "topico": "1.1.4.3 Fundo Garantidor de Créditos (FGC) e Fundo Garantidor do Cooperativismo de Crédito (FGCCoop)", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Um cliente mantém, todos ligados a um mesmo conglomerado financeiro: uma LCA emitida pelo banco, um CRI distribuído pelo banco, debêntures de uma empresa do grupo e cotas de um fundo DI administrado pelo banco. Se o banco quebrar, qual desses investimentos conta com a garantia do FGC?", "alternativas": ["O CRI", "As debêntures da empresa do grupo", "As cotas do fundo DI administrado pelo banco", "A LCA"], "correta": 3, "explicacao": "O FGC cobre depósitos e títulos emitidos por instituições associadas, como poupança, CDB, RDB, LC, LCI, LCA e LCD. CRI e debêntures são emitidos por securitizadoras e empresas, e não pelo banco, e fundos de investimento também não têm cobertura; o patrimônio do fundo, porém, é segregado do patrimônio do administrador."}, {"id": "M1A-046", "modulo": 1, "topico": "1.1.4.3 Fundo Garantidor de Créditos (FGC) e Fundo Garantidor do Cooperativismo de Crédito (FGCCoop)", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Uma cliente conservadora pulverizou R$ 1,5 milhão em CDBs de seis bancos médios de conglomerados diferentes, com R$ 250 mil em cada um, acreditando estar 100% protegida pelo FGC em qualquer cenário. A pessoa profissional deve alertá-la de que:", "alternativas": ["O FGC garante no máximo R$ 500 mil por CPF, somando todas as instituições", "Além do limite de R$ 250 mil por instituição, existe um teto global de R$ 1 milhão por CPF para garantias pagas em um período de quatro anos", "O FGC cobre apenas um banco por CPF durante toda a vida da pessoa investidora", "Como cada aplicação não excede R$ 250 mil, ela estará integralmente protegida em qualquer número de quebras"], "correta": 1, "explicacao": "Além do limite de R$ 250 mil por CPF por instituição ou conglomerado, o FGC adota um teto de R$ 1 milhão por CPF para pagamentos de garantia realizados em um período de quatro anos. Se várias instituições em que ela aplicou quebrassem nesse intervalo, a cobertura total ficaria limitada a R$ 1 milhão."}, {"id": "M1A-047", "modulo": 1, "topico": "1.1.4.3 Fundo Garantidor de Créditos (FGC) e Fundo Garantidor do Cooperativismo de Crédito (FGCCoop)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um associado tem R$ 180 mil em depósitos em uma cooperativa singular de crédito que entrou em liquidação extrajudicial. A proteção desses recursos ocorre por meio:", "alternativas": ["Do FGCoop, que garante depósitos em cooperativas de crédito até R$ 250 mil por associado", "Do FGC, que cobre bancos e cooperativas indistintamente", "De nenhum fundo, já que associados de cooperativas assumem todo o risco como sócios", "Do Tesouro Nacional, que garante integralmente os depósitos em cooperativas"], "correta": 0, "explicacao": "Os depósitos e as aplicações em cooperativas de crédito são protegidos pelo Fundo Garantidor do Cooperativismo de Crédito (FGCoop), com limite equivalente ao do FGC (R$ 250 mil). O FGC protege as instituições financeiras bancárias associadas a ele, e não as cooperativas."}, {"id": "M1A-048", "modulo": 1, "topico": "1.1.4.3 Fundo Garantidor de Créditos (FGC) e Fundo Garantidor do Cooperativismo de Crédito (FGCCoop)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Sobre a natureza do Fundo Garantidor de Créditos (FGC), é correto afirmar que:", "alternativas": ["É um fundo de investimento regulado pela CVM, cujas cotas são negociadas em bolsa", "É uma autarquia vinculada ao Ministério da Fazenda que garante qualquer aplicação financeira", "É uma associação civil privada, sem fins lucrativos, mantida por contribuições das instituições financeiras associadas", "É um fundo público mantido pelo Tesouro Nacional e administrado pelo Banco Central"], "correta": 2, "explicacao": "O FGC é uma entidade privada, sem fins lucrativos, cujos recursos vêm de contribuições mensais das instituições associadas. Ele contribui para a estabilidade do sistema e para a proteção de depositantes e pessoas investidoras, dentro de limites e produtos definidos; não é um órgão público nem é garantido pelo Tesouro."}, {"id": "M1A-049", "modulo": 1, "topico": "1.1.5 Sistema Brasileiro de Pagamentos (SBP)", "dificuldade": "facil", "tipo": "mc", "enunciado": "Um cliente pergunta se pode transferir dinheiro a um fornecedor num domingo à noite com o crédito caindo na hora. A pessoa profissional explica que o Pix permite isso porque:", "alternativas": ["É um arranjo de pagamentos instantâneos instituído e gerido pelo Banco Central, disponível 24 horas por dia, todos os dias, com liquidação em poucos segundos", "É um serviço exclusivo dos bancos públicos, garantido pelo FGC", "É um tipo de TED que só liquida no fim do dia, pelo valor líquido", "É um sistema operado pela B3 que funciona apenas em dias úteis, com liquidação no dia seguinte"], "correta": 0, "explicacao": "O Pix é o arranjo de pagamentos instantâneos do Banco Central, que funciona em tempo integral, todos os dias do ano, e liquida as transações em segundos entre contas de diferentes instituições participantes. Ele integra o Sistema Brasileiro de Pagamentos, regulado e supervisionado pelo BC."}, {"id": "M1A-050", "modulo": 1, "topico": "1.1.5 Sistema Brasileiro de Pagamentos (SBP)", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Sobre o Sistema de Transferência de Reservas (STR), núcleo do Sistema Brasileiro de Pagamentos, é correto afirmar que:", "alternativas": ["É operado pela B3 e liquida as operações apenas pelo saldo líquido ao fim do dia", "É regulado pela CVM e utilizado somente para negociação de ações", "Liquida as operações com defasagem de dois dias úteis, permitindo cancelamento após a liquidação", "É operado pelo Banco Central e liquida as operações em tempo real e de forma bruta (uma a uma), o que reduz o risco sistêmico"], "correta": 3, "explicacao": "O STR, operado pelo Banco Central, adota a liquidação bruta em tempo real (LBTR): cada transferência é liquidada individualmente e de forma definitiva, desde que haja saldo na conta de reservas. Esse modelo, adotado na reestruturação do sistema de pagamentos em 2002, reduz o risco de que a falha de um participante contamine os demais (risco sistêmico)."}, {"id": "M1A-051", "modulo": 1, "topico": "1.1.5 Sistema Brasileiro de Pagamentos (SBP)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Qual afirmação descreve corretamente o papel do Banco Central no Sistema Brasileiro de Pagamentos?", "alternativas": ["Apenas emite papel-moeda, deixando a regulação dos pagamentos eletrônicos a cargo da CVM", "Regula e supervisiona arranjos de pagamento, instituições de pagamento e infraestruturas do mercado financeiro, além de operar sistemas como o STR e o Pix", "Atua somente como usuário do sistema, que é regulado pelas bandeiras de cartão", "Regula apenas os pagamentos feitos em espécie, já que transferências eletrônicas são reguladas pela ANBIMA"], "correta": 1, "explicacao": "O Banco Central é o regulador e supervisor do SBP, que abrange arranjos e instituições de pagamento e as infraestruturas do mercado financeiro (sistemas de compensação, liquidação e depósito). Além disso, opera diretamente sistemas centrais como o STR e o sistema de liquidação do Pix."}, {"id": "M1A-052", "modulo": 1, "topico": "1.2.1.1 Componentes do fluxo circular da renda", "dificuldade": "facil", "tipo": "mc", "enunciado": "No modelo do fluxo circular da renda, qual é a relação entre famílias e empresas?", "alternativas": ["As empresas fornecem trabalho às famílias e recebem salários, que usam para comprar fatores de produção", "Famílias e empresas não se relacionam diretamente; toda a renda passa necessariamente pelo governo", "As famílias fornecem fatores de produção (trabalho e capital) às empresas e recebem renda na forma de salários, aluguéis, juros e lucros, que usam para consumir bens e serviços produzidos pelas empresas", "As famílias produzem os bens e serviços e as empresas apenas os consomem"], "correta": 2, "explicacao": "No fluxo circular, há um fluxo real (fatores de produção das famílias para as empresas; bens e serviços das empresas para as famílias) e um fluxo monetário em sentido oposto (renda paga às famílias; gastos de consumo pagos às empresas). Governo e mercado financeiro complementam o modelo, mas não são o único canal da renda."}, {"id": "M1A-053", "modulo": 1, "topico": "1.2.1.1 Componentes do fluxo circular da renda", "dificuldade": "medio", "tipo": "mc", "enunciado": "O governo eleva fortemente a tributação sobre a renda das famílias, sem aumentar seus gastos. Segundo o fluxo circular da renda, o efeito inicial mais provável é:", "alternativas": ["Aumento imediato do consumo das famílias, que antecipam compras", "Aumento da produção das empresas, pois o governo passa a ter mais recursos", "Nenhum efeito sobre a atividade, pois tributos não fazem parte do fluxo circular", "Redução da renda disponível das famílias, menor consumo e, consequentemente, menor demanda pelos produtos das empresas"], "correta": 3, "explicacao": "Tributos são um 'vazamento' do fluxo circular: reduzem a renda disponível das famílias e, portanto, o consumo. Com menor demanda, as empresas tendem a reduzir a produção e as contratações. Se o governo não devolve esses recursos via gastos, o efeito inicial sobre a atividade é contracionista."}, {"id": "M1A-054", "modulo": 1, "topico": "1.2.1.1 Componentes do fluxo circular da renda", "dificuldade": "medio", "tipo": "mc", "enunciado": "No fluxo circular da renda ampliado, qual é o papel do mercado financeiro?", "alternativas": ["Substituir o governo na arrecadação de tributos", "Produzir bens e serviços finais para as famílias", "Canalizar a poupança das famílias (agentes superavitários) para financiar o investimento das empresas e o déficit do governo (agentes deficitários)", "Fixar os salários pagos pelas empresas às famílias"], "correta": 2, "explicacao": "A parte da renda que as famílias não consomem é poupada e, por meio do mercado financeiro, chega aos agentes deficitários, que precisam de recursos para investir ou cobrir gastos. Essa intermediação transforma poupança em investimento, sustentando o crescimento da economia."}, {"id": "M1A-055", "modulo": 1, "topico": "1.2.2.1 Mercado monetário", "dificuldade": "medio", "tipo": "mc", "enunciado": "Ao final do dia, o Banco A tem sobra de reservas e o Banco B precisa de recursos para fechar seu caixa. O Banco A empresta ao Banco B por um dia. Essa operação ocorre no mercado:", "alternativas": ["Cambial, que negocia moeda estrangeira", "Monetário, que concentra operações de curtíssimo prazo para controle de liquidez", "De capitais, que financia investimentos de longo prazo", "De crédito, que atende pessoas físicas e empresas"], "correta": 1, "explicacao": "O mercado monetário reúne operações de curtíssimo e curto prazo, como empréstimos interbancários de um dia (que formam a taxa DI) e operações compromissadas com títulos públicos (que formam a taxa Selic). É nesse mercado que o Banco Central atua para manter a taxa Selic próxima da meta."}, {"id": "M1A-056", "modulo": 1, "topico": "1.2.2.2 Mercado cambial", "dificuldade": "facil", "tipo": "mc", "enunciado": "Uma empresa importadora precisa comprar dólares para pagar um fornecedor no exterior. Essa operação é realizada no mercado:", "alternativas": ["Cambial, por meio de instituição autorizada pelo Banco Central a operar câmbio", "De capitais, por meio de emissão de debêntures", "De crédito, por meio de financiamento imobiliário", "Monetário, por meio de operação compromissada com o Banco Central"], "correta": 0, "explicacao": "O mercado cambial é onde se compram e vendem moedas estrangeiras, para comércio exterior, viagens, investimentos e transferências. As operações devem ser feitas com instituições autorizadas pelo Banco Central a operar câmbio."}, {"id": "M1A-057", "modulo": 1, "topico": "1.2.2.3 Mercado de crédito", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um banco capta recursos de pessoas investidoras via CDB e empresta esses recursos a uma empresa por meio de uma operação de capital de giro. Sobre essa operação no mercado de crédito, é correto afirmar que:", "alternativas": ["Quem aplicou no CDB passa a ser credor direto da empresa e assume o risco de ela não pagar", "O banco não obtém remuneração, pois repassa a mesma taxa paga no CDB", "A operação é regulada e fiscalizada pela CVM, por envolver uma empresa", "O banco atua como intermediário financeiro e assume o risco de crédito da empresa; quem aplicou no CDB tem como devedor o banco, e não a empresa"], "correta": 3, "explicacao": "No mercado de crédito, a instituição financeira capta de agentes superavitários e empresta a deficitários, assumindo o risco de inadimplência do tomador. O ganho da instituição é o spread, a diferença entre a taxa cobrada no empréstimo e a paga na captação. A pessoa investidora no CDB tem risco do banco, e não da empresa tomadora."}, {"id": "M1A-058", "modulo": 1, "topico": "1.2.2.4 Mercado de capitais", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma companhia emite debêntures, distribuídas a pessoas investidoras, para financiar a construção de uma nova fábrica com retorno em dez anos. Qual característica do mercado de capitais essa operação ilustra?", "alternativas": ["A troca de moeda nacional por estrangeira para pagamento de importações", "A intermediação financeira em que o banco assume o risco da companhia perante as pessoas investidoras", "O financiamento de médio e longo prazo com relação direta entre emissor e pessoa investidora, que assume o risco da companhia", "O controle diário de liquidez do sistema bancário pelo Banco Central"], "correta": 2, "explicacao": "No mercado de capitais, empresas captam recursos diretamente das pessoas investidoras, por meio de ações, debêntures e outros valores mobiliários, geralmente para financiar projetos de médio e longo prazo. As instituições atuam como estruturadoras e distribuidoras, mas o risco de crédito ou de negócio é assumido diretamente por quem investe. O mercado é regulado pela CVM."}, {"id": "M1A-059", "modulo": 1, "topico": "1.2.2.4 Mercado de capitais", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma empresa faz sua oferta pública inicial de ações (IPO) e, nos meses seguintes, as ações passam a ser negociadas intensamente na B3. Sobre essas negociações, é correto afirmar que:", "alternativas": ["O mercado secundário serve apenas para a empresa emitir novas ações", "Os recursos da oferta inicial de novas ações vão para a empresa (mercado primário); nas negociações posteriores entre pessoas investidoras (mercado secundário) a empresa não recebe novos recursos", "No mercado primário, as ações são negociadas entre pessoas investidoras sem participação da empresa", "A empresa recebe parte do valor de cada negócio realizado no mercado secundário"], "correta": 1, "explicacao": "No mercado primário, a empresa emite e vende novos títulos, captando recursos. No mercado secundário, os títulos já emitidos trocam de mãos entre investidores, o que dá liquidez e forma preços, mas não gera recursos novos para a empresa emissora."}, {"id": "M1A-060", "modulo": 1, "topico": "1.2.3.1 Conceito e objetivos da política fiscal", "dificuldade": "facil", "tipo": "mc", "enunciado": "Para estimular as vendas de automóveis em um período de crise, o governo reduz a alíquota de um imposto sobre veículos e amplia gastos em obras públicas. Essas medidas caracterizam uma política:", "alternativas": ["Fiscal expansionista", "Cambial de câmbio fixo", "Fiscal contracionista", "Monetária contracionista"], "correta": 0, "explicacao": "Política fiscal é a gestão das receitas (tributos) e das despesas do governo. Reduzir tributos e aumentar gastos estimula a demanda agregada, o que caracteriza uma política fiscal expansionista. Medidas de juros e de liquidez seriam política monetária."}, {"id": "M1A-061", "modulo": 1, "topico": "1.2.3.2 Modelos e funções da política fiscal", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um programa de transferência de renda para famílias de baixa renda, financiado por tributação progressiva, está associado principalmente a qual função da política fiscal?", "alternativas": ["Função distributiva", "Função monetária", "Função alocativa", "Função estabilizadora"], "correta": 0, "explicacao": "A política fiscal tem três funções clássicas: alocativa (prover bens e serviços públicos que o mercado não oferece adequadamente), distributiva (ajustar a distribuição de renda, como em transferências e tributação progressiva) e estabilizadora (atuar sobre emprego, preços e crescimento). Transferências de renda são o exemplo típico da função distributiva."}, {"id": "M1A-062", "modulo": 1, "topico": "1.2.3.2 Modelos e funções da política fiscal", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Em determinado ano, o governo registrou receitas de R$ 1.000 bilhões, despesas não financeiras (pessoal, custeio, investimentos e benefícios) de R$ 950 bilhões e despesas com juros da dívida de R$ 150 bilhões. Os resultados primário e nominal foram, respectivamente:", "alternativas": ["Déficit primário de R$ 100 bilhões e déficit nominal de R$ 100 bilhões", "Superávit primário de R$ 50 bilhões e déficit nominal de R$ 100 bilhões", "Superávit primário de R$ 50 bilhões e superávit nominal de R$ 50 bilhões", "Déficit primário de R$ 150 bilhões e déficit nominal de R$ 100 bilhões"], "correta": 1, "explicacao": "O resultado primário exclui os juros: 1.000 − 950 = superávit de R$ 50 bilhões. O resultado nominal inclui os juros: 1.000 − 950 − 150 = déficit de R$ 100 bilhões. O superávit primário indica que o governo cobre suas despesas correntes, mas não o suficiente para pagar todos os juros da dívida."}, {"id": "M1A-063", "modulo": 1, "topico": "1.2.3.3 Relações entre política fiscal, dívida pública, inflação, taxa de juros e investimentos", "dificuldade": "dificil", "tipo": "mc", "enunciado": "O governo passa a registrar déficits recorrentes, e a dívida pública cresce em relação ao PIB sem sinal de estabilização. A consequência mais provável para os mercados financeiros é:", "alternativas": ["Queda dos juros futuros de longo prazo, pois o governo precisa de mais recursos e oferece mais títulos", "Valorização dos títulos prefixados longos, já que a dívida maior aumenta a liquidez do mercado", "Aumento do prêmio de risco exigido pelas pessoas investidoras, com alta dos juros futuros mais longos e desvalorização dos títulos prefixados de longo prazo", "Redução das expectativas de inflação, pois o maior gasto público eleva a oferta de bens"], "correta": 2, "explicacao": "Uma trajetória fiscal percebida como insustentável eleva o risco de crédito soberano e as expectativas de inflação. As pessoas investidoras exigem juros maiores para financiar o governo, sobretudo nos prazos longos, o que derruba os preços dos prefixados longos. Juros mais altos também encarecem o crédito e desestimulam o investimento privado."}, {"id": "M1A-064", "modulo": 1, "topico": "1.2.3.3 Relações entre política fiscal, dívida pública, inflação, taxa de juros e investimentos", "dificuldade": "medio", "tipo": "mc", "enunciado": "Em um cenário de economia aquecida e inflação acima da meta, o governo amplia fortemente os gastos públicos. Qual efeito tende a ocorrer sobre a política monetária?", "alternativas": ["O Banco Central pode reduzir os juros, pois o gasto público aumenta a oferta de bens e reduz preços", "O Banco Central passa a financiar diretamente os gastos do Tesouro, sem efeito sobre os juros", "Não há relação entre política fiscal e política monetária", "O Banco Central tende a precisar manter juros mais altos por mais tempo, pois a política fiscal expansionista pressiona a demanda e a inflação"], "correta": 3, "explicacao": "Quando a política fiscal estimula a demanda num momento em que a economia já está aquecida, ela pressiona a inflação e obriga a política monetária a ser mais restritiva para compensar. Essa combinação tende a manter os juros elevados e a encarecer o custo da dívida pública."}, {"id": "M1A-065", "modulo": 1, "topico": "1.2.3.4 Financiamento do Governo (Lei de Responsabilidade Fiscal)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Sobre a Lei de Responsabilidade Fiscal (LC nº 101/2000), é correto afirmar que ela:", "alternativas": ["Estabelece normas de gestão fiscal responsável, com metas, limites para despesas com pessoal e endividamento e exigência de indicar a fonte de recursos para criar despesas obrigatórias de caráter continuado", "Autoriza o Banco Central a conceder empréstimos ao Tesouro Nacional para cobrir déficits", "Proíbe qualquer déficit orçamentário em todos os entes da federação, em qualquer circunstância", "Aplica-se somente à União, não alcançando estados e municípios"], "correta": 0, "explicacao": "A LRF estabelece normas de finanças públicas voltadas à responsabilidade na gestão fiscal, baseadas em planejamento, transparência, controle e responsabilização. Ela vale para União, estados, Distrito Federal e municípios, fixa limites de despesa com pessoal e de endividamento e exige estimativa de impacto e fonte de custeio para despesas obrigatórias continuadas."}, {"id": "M1A-066", "modulo": 1, "topico": "1.2.3.4 Financiamento do Governo (Lei de Responsabilidade Fiscal)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um governo apresenta déficit nominal e precisa financiá-lo. No Brasil, a forma usual e legalmente admitida de cobrir esse déficit é:", "alternativas": ["Emitir papel-moeda sem lastro para pagar as despesas", "Emitir títulos públicos colocados junto às pessoas investidoras, o que aumenta a dívida pública", "Usar os depósitos compulsórios dos bancos para pagar despesas correntes", "Obter empréstimo direto do Banco Central ao Tesouro Nacional"], "correta": 1, "explicacao": "O governo financia seus déficits principalmente com a emissão de títulos da dívida pública. A Constituição veda que o Banco Central conceda empréstimos ao Tesouro, justamente para evitar o financiamento inflacionário por emissão de moeda. Os compulsórios são instrumento de política monetária, não fonte de financiamento do gasto público."}, {"id": "M1A-067", "modulo": 1, "topico": "1.2.4.1 Política monetária expansionista e contracionista", "dificuldade": "facil", "tipo": "mc", "enunciado": "Qual combinação de medidas caracteriza uma política monetária contracionista?", "alternativas": ["Comprar títulos públicos no mercado aberto e reduzir a taxa de redesconto", "Reduzir tributos e aumentar os gastos públicos", "Elevar a meta da taxa Selic e aumentar a alíquota dos depósitos compulsórios", "Reduzir a meta da taxa Selic e diminuir os depósitos compulsórios"], "correta": 2, "explicacao": "Política monetária contracionista reduz a liquidez e encarece o crédito para conter a demanda e a inflação: alta de juros, aumento do compulsório e venda de títulos no mercado aberto. Reduzir juros e compulsório é expansionista; mexer em tributos e gastos é política fiscal."}, {"id": "M1A-068", "modulo": 1, "topico": "1.2.4.1 Política monetária expansionista e contracionista", "dificuldade": "medio", "tipo": "mc", "enunciado": "A inflação acumulada em 12 meses está acima do teto do intervalo de tolerância e as expectativas para os próximos anos estão subindo. Qual é a reação de política monetária mais coerente com o regime de metas?", "alternativas": ["Manter os juros e deixar a cargo da política fiscal o combate à inflação, por determinação legal", "Reduzir o compulsório para ampliar o crédito e aumentar a produção", "Reduzir a taxa Selic para estimular a oferta de bens e baixar os preços", "Adotar postura contracionista, elevando a taxa Selic para reduzir a demanda e reancorar as expectativas"], "correta": 3, "explicacao": "Com inflação e expectativas acima da meta, o Banco Central tende a elevar juros, encarecendo crédito e reduzindo demanda, além de sinalizar compromisso com a meta. Reduzir juros ou compulsório seria expansionista e tenderia a agravar a inflação."}, {"id": "M1A-069", "modulo": 1, "topico": "1.2.4.2 Instrumentos de política monetária: open market, redesconto e depósito compulsório", "dificuldade": "medio", "tipo": "mc", "enunciado": "O Banco Central vende títulos públicos de sua carteira no mercado aberto, em volume relevante. O efeito imediato dessa operação é:", "alternativas": ["Reduzir a dívida pública do Tesouro Nacional", "Retirar liquidez do sistema bancário, pressionando para cima a taxa de juros de curto prazo", "Injetar liquidez no sistema bancário, reduzindo a taxa de juros de curto prazo", "Aumentar as reservas internacionais do país"], "correta": 1, "explicacao": "Ao vender títulos, o BC recebe reservas dos bancos, 'enxugando' a liquidez; com menos recursos disponíveis, os juros de curto prazo tendem a subir. A compra de títulos tem o efeito inverso. As operações de mercado aberto ajustam a liquidez diária e mantêm a taxa Selic próxima da meta."}, {"id": "M1A-070", "modulo": 1, "topico": "1.2.4.2 Instrumentos de política monetária: open market, redesconto e depósito compulsório", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um banco solvente enfrenta uma falta momentânea de recursos em seu caixa e recorre a uma linha de assistência financeira de liquidez do Banco Central. O instrumento de política monetária utilizado é o:", "alternativas": ["Swap cambial", "Open market com títulos de longo prazo", "Depósito compulsório", "Redesconto"], "correta": 3, "explicacao": "O redesconto é o empréstimo de liquidez do Banco Central às instituições financeiras, função de 'emprestador de última instância'. Ao tornar essa assistência mais cara ou mais restrita, o BC sinaliza aperto; ao facilitar, injeta liquidez. O compulsório, ao contrário, é um recolhimento obrigatório de recursos dos bancos ao BC."}, {"id": "M1A-071", "modulo": 1, "topico": "1.2.4.2 Instrumentos de política monetária: open market, redesconto e depósito compulsório", "dificuldade": "medio", "tipo": "mc", "enunciado": "O Banco Central aumenta a alíquota do depósito compulsório sobre os depósitos à vista. O efeito esperado é:", "alternativas": ["Aumento imediato da rentabilidade dos depósitos à vista para os correntistas", "Aumento dos recursos livres dos bancos e expansão do crédito", "Redução dos recursos que os bancos podem emprestar e do efeito multiplicador da moeda, com menor oferta de crédito", "Desvalorização imediata da moeda nacional frente ao dólar"], "correta": 2, "explicacao": "O compulsório obriga os bancos a manter no BC parte dos depósitos captados. Elevar a alíquota reduz os recursos disponíveis para empréstimo e o multiplicador bancário, contraindo o crédito e a liquidez: é uma medida contracionista."}, {"id": "M1A-072", "modulo": 1, "topico": "1.2.4.2 Instrumentos de política monetária: open market, redesconto e depósito compulsório", "dificuldade": "dificil", "tipo": "mc", "enunciado": "No dia a dia, qual instrumento o Banco Central utiliza para manter a taxa Selic efetiva próxima da meta definida pelo Copom, e com quais títulos?", "alternativas": ["Operações de mercado aberto (principalmente compromissadas), com títulos públicos federais emitidos pelo Tesouro, já que o BC está impedido de emitir títulos próprios", "Redesconto diário a todos os bancos, com títulos emitidos pelo próprio Banco Central", "Alterações diárias do compulsório, com títulos privados de primeira linha", "Swaps cambiais diários, com títulos indexados ao dólar emitidos pelo BC"], "correta": 0, "explicacao": "O open market é o instrumento mais ágil e frequente: o BC compra ou vende títulos (em geral por operações compromissadas) para ajustar as reservas bancárias e manter a Selic na meta. Desde a Lei de Responsabilidade Fiscal, o BC não emite títulos próprios e opera com títulos do Tesouro Nacional em sua carteira. Compulsório e redesconto são instrumentos de ajuste menos frequente."}, {"id": "M1A-073", "modulo": 1, "topico": "1.2.4.3 Principais canais de transmissão", "dificuldade": "medio", "tipo": "mc", "enunciado": "Após uma alta relevante da taxa Selic, o real se valoriza frente ao dólar, barateando produtos importados e reduzindo a pressão sobre os preços internos. Esse mecanismo ilustra o canal de transmissão:", "alternativas": ["Das expectativas", "Da riqueza (preços de ativos)", "Do crédito", "Do câmbio"], "correta": 3, "explicacao": "Pelo canal do câmbio, juros mais altos aumentam o diferencial em relação aos juros externos, atraem capital estrangeiro e valorizam a moeda doméstica. Com isso, importados ficam mais baratos e a competitividade de bens domésticos diminui, reduzindo a inflação."}, {"id": "M1A-074", "modulo": 1, "topico": "1.2.4.3 Principais canais de transmissão", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Qual alternativa descreve corretamente o canal das expectativas na transmissão da política monetária?", "alternativas": ["Juros mais altos encarecem empréstimos e reduzem a oferta de crédito pelos bancos", "Juros mais altos reduzem o preço de ações e imóveis, fazendo as famílias se sentirem mais pobres e consumirem menos", "Um aperto monetário crível reduz as expectativas de inflação, o que influencia reajustes de preços e salários mesmo antes de a demanda desacelerar", "Juros mais altos atraem capital estrangeiro e valorizam a moeda nacional"], "correta": 2, "explicacao": "No canal das expectativas, a credibilidade do Banco Central faz com que agentes ajustem suas projeções de inflação ao anúncio da política, moderando reajustes de preços e salários. As demais descrições correspondem aos canais de riqueza (preços de ativos), de crédito e de câmbio, respectivamente."}, {"id": "M1A-075", "modulo": 1, "topico": "1.2.4.4 Influência da política monetária sobre juros, preços dos ativos, inflação e atividade", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente tem títulos Tesouro Prefixado (LTN) e Tesouro Selic (LFT). O Copom surpreende o mercado e eleva a taxa Selic mais do que o esperado. O efeito mais provável é:", "alternativas": ["Os títulos prefixados perdem valor na marcação a mercado, enquanto o Tesouro Selic passa a render mais e quase não oscila", "Ambos os títulos se valorizam, pois juros maiores aumentam a rentabilidade de qualquer título", "Nenhum dos títulos é afetado até o vencimento", "O Tesouro Selic perde valor e o prefixado se valoriza"], "correta": 0, "explicacao": "Quando os juros de mercado sobem, o valor presente dos fluxos prefixados cai, gerando perda na marcação a mercado para quem tem LTN. O Tesouro Selic acompanha a taxa Selic diária, passando a render mais com a alta e apresentando baixa volatilidade de preço."}, {"id": "M1A-076", "modulo": 1, "topico": "1.2.4.4 Influência da política monetária sobre juros, preços dos ativos, inflação e atividade", "dificuldade": "dificil", "tipo": "mc", "enunciado": "O Banco Central inicia um ciclo de alta da Selic, com elevada credibilidade, e as expectativas de inflação de longo prazo recuam. O comportamento mais provável da curva de juros é:", "alternativas": ["Queda dos juros curtos e alta dos longos, aumentando a inclinação da curva", "Alta dos juros curtos, enquanto os juros longos podem subir menos ou até cair, reduzindo a inclinação da curva", "Alta exatamente igual em todos os vértices da curva, pois os juros longos acompanham a Selic um a um", "Nenhuma alteração na curva, pois a Selic só afeta operações de um dia"], "correta": 1, "explicacao": "A Selic influencia diretamente os juros de curto prazo. Os juros longos dependem das expectativas de juros e de inflação futuras e do prêmio de risco; se o aperto é crível e derruba as expectativas de inflação, os juros longos podem subir pouco ou até cair, achatando a curva."}, {"id": "M1A-077", "modulo": 1, "topico": "1.2.4.4 Influência da política monetária sobre juros, preços dos ativos, inflação e atividade", "dificuldade": "facil", "tipo": "mc", "enunciado": "Uma redução da taxa Selic tende a prov
