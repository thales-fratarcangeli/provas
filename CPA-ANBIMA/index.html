nciado": "Uma cliente tem PGBL no regime regressivo com aportes feitos ao longo de 12 anos e pede um resgate parcial. Quais aportes são considerados resgatados primeiro?", "alternativas": ["Uma parcela proporcional de todos os aportes, com aplicação de uma alíquota média única", "Os mais recentes, pelo critério de que o último recurso a entrar é o primeiro a sair", "Os aportes escolhidos livremente pela cliente no momento do pedido de resgate", "Os mais antigos, pelo critério de que o primeiro recurso a entrar é o primeiro a sair, o que favorece alíquotas menores"], "correta": 3, "explicacao": "No regime regressivo, os resgates consomem primeiro os aportes mais antigos (critério PEPS). Como esses recursos estão há mais tempo no plano, tendem a ter alíquotas menores, o que beneficia o participante."}, {"id": "M2D-019", "modulo": 2, "topico": "2.2.2.2 Regime regressivo, definitivo ou exclusivo", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente com plano no regime regressivo pergunta se o imposto retido no resgate poderá ser recuperado na declaração anual, já que sua renda é baixa. A resposta correta é:", "alternativas": ["Sim, pois todo IR retido sobre previdência é compensado na declaração de ajuste anual", "Não, pois resgates de previdência no regime regressivo são isentos e não há imposto retido", "Não, pois no regime regressivo a tributação é exclusiva na fonte e definitiva, sem ajuste na declaração anual", "Sim, desde que ele mude para o regime progressivo antes de entregar a declaração"], "correta": 2, "explicacao": "O regime regressivo também é chamado de definitivo ou exclusivo: o IR retido no resgate ou no pagamento da renda encerra a tributação, sem compensação na declaração anual. Além disso, a opção pelo regressivo é irretratável, não sendo possível voltar ao progressivo."}, {"id": "M2D-020", "modulo": 2, "topico": "2.2.2 Regimes de tributação (progressivo e regressivo)", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Considere dois clientes que vão contratar previdência: Ana, 30 anos, pretende deixar os recursos aplicados por mais de 15 anos e projeta renda elevada na aposentadoria; Bruno, 58 anos, deve precisar de parte dos recursos em cerca de 2 anos e terá pouca renda tributável nesse período. Os regimes mais indicados para Ana e Bruno são, respectivamente:", "alternativas": ["Progressivo e regressivo", "Regressivo para ambos", "Regressivo e progressivo", "Progressivo para ambos"], "correta": 2, "explicacao": "Ana tem horizonte longo e renda alta no futuro: o regressivo permite chegar a 10% de IR após 10 anos, abaixo da alíquota máxima da tabela progressiva. Bruno tem horizonte curto, quando o regressivo cobraria 35% ou 30%, e terá renda baixa, situação em que a tabela progressiva tende a resultar em imposto menor após o ajuste anual."}, {"id": "M2D-021", "modulo": 2, "topico": "2.2.2 Regimes de tributação (progressivo e regressivo)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Sobre a escolha e a mudança de regime de tributação em planos de previdência, é correto afirmar que:", "alternativas": ["O regime é definido pela seguradora conforme o perfil de risco do participante", "O participante pode alternar livremente entre os regimes uma vez por ano", "A opção pelo regime progressivo é irretratável, não sendo permitido migrar para o regressivo", "A opção pelo regime regressivo é irretratável, não sendo permitido voltar ao regime progressivo"], "correta": 3, "explicacao": "A escolha do regime cabe ao participante. Quem opta pelo regime regressivo não pode retornar ao progressivo; o caminho inverso (do progressivo para o regressivo) é admitido. Por isso, a decisão deve considerar o horizonte de investimento e a renda esperada na fase de benefício."}, {"id": "M2D-022", "modulo": 2, "topico": "2.2.3.1 Fases do produto (contribuição e benefícios)", "dificuldade": "facil", "tipo": "mc", "enunciado": "Em um plano de previdência complementar, a fase em que o participante realiza contribuições e os recursos são investidos para formar a reserva é chamada de:", "alternativas": ["Fase de portabilidade", "Fase de diferimento (acumulação ou contribuição)", "Fase de carência atuarial", "Fase de concessão (benefício)"], "correta": 1, "explicacao": "Os planos têm duas fases: a de diferimento (acumulação), em que o participante faz aportes e a reserva é investida, e a de concessão (benefício), em que a reserva é convertida em renda ou paga de uma só vez. Carência e portabilidade são regras do plano, não fases."}, {"id": "M2D-023", "modulo": 2, "topico": "2.2.3.1 Fases do produto (contribuição e benefícios)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um participante de VGBL chegou à data prevista para o início do benefício. Sobre as possibilidades nesse momento, assinale a afirmação correta:", "alternativas": ["Ele pode receber o saldo em pagamento único ou convertê-lo em uma das formas de renda oferecidas pelo plano", "Ele perde o direito de resgatar a reserva a partir da data prevista, mesmo que ainda não tenha escolhido a renda", "Ele deve transferir a reserva para o INSS, que passa a pagar a renda complementar", "Ele é obrigado a converter toda a reserva em renda mensal vitalícia, sem outra opção"], "correta": 0, "explicacao": "Na passagem da fase de diferimento para a de concessão, o participante escolhe como receber, conforme o plano contratado: pagamento único ou alguma modalidade de renda (vitalícia, temporária, por prazo certo etc.). Os benefícios são pagos pela própria seguradora ou entidade, não pelo INSS."}, {"id": "M2D-024", "modulo": 2, "topico": "2.2.3.2 Taxa de administração e taxa de carregamento", "dificuldade": "facil", "tipo": "mc", "enunciado": "Uma cliente quer entender como a taxa de administração do seu PGBL é cobrada. A explicação correta é:", "alternativas": ["É um percentual anual sobre o patrimônio do fundo, apropriado diariamente e já descontado do valor da cota", "É um valor fixo cobrado mensalmente, debitado da conta corrente da participante", "É um percentual cobrado sobre cada contribuição, no momento do aporte, antes da aplicação no fundo", "É cobrada apenas no resgate, sobre o rendimento obtido no período"], "correta": 0, "explicacao": "A taxa de administração remunera a gestão e a administração dos recursos e é expressa como percentual ao ano sobre o patrimônio, apropriado diariamente na cota. Por isso, a rentabilidade divulgada já é líquida dessa taxa. O percentual cobrado sobre os aportes é a taxa de carregamento."}, {"id": "M2D-025", "modulo": 2, "topico": "2.2.3.2 Taxa de administração e taxa de carregamento", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente fez um aporte de R$ 10.000,00 em um plano de previdência com taxa de carregamento de 3% na entrada (antecipada). Qual valor será efetivamente destinado à formação da reserva?", "alternativas": ["R$ 10.300,00", "R$ 9.970,00", "R$ 10.000,00", "R$ 9.700,00"], "correta": 3, "explicacao": "A taxa de carregamento antecipada é descontada de cada contribuição: 3% × 10.000 = R$ 300,00. Assim, R$ 9.700,00 vão para a reserva. Essa taxa cobre despesas de comercialização e administrativas e é diferente da taxa de administração, que incide sobre o patrimônio."}, {"id": "M2D-026", "modulo": 2, "topico": "2.2.3.2 Taxa de administração e taxa de carregamento", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma cliente pediu a portabilidade de seu plano para outra seguradora e percebeu que o valor transferido foi menor que o saldo que ela acompanhava. Considerando as características do plano, a explicação mais provável é a cobrança de:", "alternativas": ["IR na fonte, que incide sobre toda portabilidade externa", "Taxa de carregamento postecipada, cobrada na saída dos recursos em resgates ou portabilidades", "Come-cotas, cobrado no momento da transferência para outra seguradora", "IOF, que incide sobre a transferência de recursos entre seguradoras"], "correta": 1, "explicacao": "A taxa de carregamento pode ser antecipada (sobre aportes) ou postecipada (na saída, em resgate ou portabilidade), muitas vezes decrescente com o tempo de permanência. A portabilidade não sofre incidência de IR nem de IOF, e previdência não tem come-cotas."}, {"id": "M2D-027", "modulo": 2, "topico": "2.2.3.2 Taxa de administração e taxa de carregamento", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Um cliente vai aplicar R$ 100.000,00 de uma só vez e compara dois planos com a mesma carteira, que deve render 10% bruto em um ano. Plano A: sem carregamento e taxa de administração de 2% a.a. Plano B: carregamento de 1% na entrada e taxa de administração de 1% a.a. Considerando, de forma simplificada, que a taxa de administração reduz a rentabilidade anual em pontos percentuais, ao fim de um ano:", "alternativas": ["O Plano B terá cerca de R$ 108.910,00 e o Plano A, cerca de R$ 108.000,00", "Os dois planos terão exatamente o mesmo saldo, de R$ 108.000,00", "O Plano A terá cerca de R$ 108.000,00 e o Plano B, cerca de R$ 107.910,00", "O Plano B terá cerca de R$ 109.000,00 e o Plano A, cerca de R$ 108.000,00"], "correta": 2, "explicacao": "Plano A: 100.000 × (1 + 0,10 − 0,02) = R$ 108.000,00. Plano B: o carregamento reduz o valor aplicado para R$ 99.000,00, que rende 9% líquido: 99.000 × 1,09 = R$ 107.910,00. A comparação mostra que é preciso considerar as duas taxas em conjunto e o horizonte de aplicação; em prazos mais longos, a menor taxa de administração do B tende a compensar o carregamento."}, {"id": "M2D-028", "modulo": 2, "topico": "2.2.3.3 Portabilidade externa e interna (regras e carências)", "dificuldade": "facil", "tipo": "mc", "enunciado": "Uma cliente está insatisfeita com a rentabilidade do seu VGBL e quer transferir os recursos para um VGBL de outra seguradora. Sobre essa operação, é correto afirmar que:", "alternativas": ["Trata-se de portabilidade interna, pois o tipo de plano é o mesmo", "Ela precisará resgatar os recursos, pagar o IR e aplicar no novo plano", "Trata-se de portabilidade externa, que não tem incidência de IR, desde que os recursos sigam diretamente para outro plano da mesma natureza", "Trata-se de portabilidade externa, com retenção de 15% de IR na saída"], "correta": 2, "explicacao": "A portabilidade é a transferência de recursos entre planos sem passar pela pessoa, sem incidência de IR. Quando ocorre para outra seguradora ou entidade, é externa; quando ocorre entre planos da mesma instituição, é interna. Deve ser feita entre planos da mesma natureza (VGBL para VGBL, PGBL para PGBL)."}, {"id": "M2D-029", "modulo": 2, "topico": "2.2.3.3 Portabilidade externa e interna (regras e carências)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente tem PGBL em uma seguradora e quer mudar para outro fundo de previdência, com perfil mais arrojado, oferecido por essa mesma seguradora, mantendo o PGBL. Essa operação é classificada como:", "alternativas": ["Transformação da reserva em renda, sem incidência de IR", "Portabilidade interna, sem incidência de IR", "Resgate seguido de novo aporte, com incidência de IR", "Portabilidade externa, sem incidência de IR"], "correta": 1, "explicacao": "A portabilidade interna ocorre entre planos ou fundos da mesma seguradora ou entidade; a externa, entre instituições diferentes. Em ambas não há incidência de IR, pois os recursos não passam pelas mãos do participante."}, {"id": "M2D-030", "modulo": 2, "topico": "2.2.3.3 Portabilidade externa e interna (regras e carências)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente que tem PGBL e passou a fazer a declaração simplificada quer transferir seus recursos para um VGBL, para pagar IR apenas sobre os rendimentos no futuro. A orientação correta é:", "alternativas": ["Não é possível a portabilidade de PGBL para VGBL; seria preciso resgatar o PGBL, com IR sobre o valor total, e aplicar no VGBL", "A portabilidade de PGBL para VGBL é automática quando a pessoa muda o modelo da declaração", "Ele pode fazer a portabilidade, mas pagará IR apenas sobre os rendimentos acumulados no PGBL", "Ele pode fazer a portabilidade de PGBL para VGBL sem IR, desde que o regime de tributação seja mantido"], "correta": 0, "explicacao": "A portabilidade só é permitida entre planos da mesma natureza, porque PGBL e VGBL têm tratamentos tributários distintos (no PGBL, as contribuições foram deduzidas e serão tributadas no total). Para migrar, seria necessário resgatar, com IR sobre o valor total, e reaplicar no VGBL. Para novos aportes, porém, ele já pode contratar um VGBL."}, {"id": "M2D-031", "modulo": 2, "topico": "2.2.3.3 Portabilidade externa e interna (regras e carências)", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Uma cliente com PGBL no regime regressivo, com aportes de diferentes datas, quer fazer a portabilidade para outra seguradora. Assinale a afirmação correta:", "alternativas": ["Ela pode transferir para um PGBL no regime progressivo, pois a portabilidade permite trocar de regime", "Haverá retenção de IR pela alíquota correspondente ao prazo de cada aporte no momento da transferência", "A portabilidade reinicia a contagem de prazo dos aportes, voltando à alíquota de 35%", "Ela pode transferir para outro PGBL no regime regressivo, mantendo a contagem de prazo de cada aporte"], "correta": 3, "explicacao": "Na portabilidade entre planos do regime regressivo, o histórico de prazo de cada contribuição é mantido, preservando o benefício das alíquotas menores. Como a opção pelo regressivo é irretratável, a transferência para plano progressivo não é admitida. A portabilidade não gera incidência de IR."}, {"id": "M2D-032", "modulo": 2, "topico": "2.2.3.3 Portabilidade externa e interna (regras e carências)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma cliente contratou um VGBL há dois meses e quer resgatar os recursos, mas foi informada de que o plano ainda está em carência. Sobre a carência em planos de previdência, é correto afirmar que:", "alternativas": ["É o intervalo mínimo exigido entre duas contribuições mensais consecutivas", "É o período em que a taxa de administração não é cobrada, para estimular a permanência", "É o prazo de 10 anos necessário para que o participante tenha direito à alíquota mínima de IR", "É o período, previsto no regulamento e dentro dos limites da regulamentação, em que resgates ou portabilidades não podem ser feitos"], "correta": 3, "explicacao": "A carência é o prazo, definido no regulamento do plano, durante o qual o participante não pode resgatar ou portar a reserva. A regulamentação estabelece limites para esse prazo (de 60 dias a 24 meses) e também pode haver intervalo mínimo entre resgates ou portabilidades. Ela não se confunde com o prazo da tabela regressiva."}, {"id": "M2D-033", "modulo": 2, "topico": "2.2.3.4.1 Renda Mensal Vitalícia (RMV)", "dificuldade": "facil", "tipo": "mc", "enunciado": "Um cliente solteiro e sem dependentes quer receber, a partir da aposentadoria, a maior renda possível enquanto viver, sem se preocupar em deixar recursos para herdeiros. A modalidade mais adequada é:", "alternativas": ["Renda mensal por prazo certo", "Renda mensal vitalícia reversível ao beneficiário indicado", "Renda mensal vitalícia", "Renda mensal vitalícia com prazo mínimo garantido"], "correta": 2, "explicacao": "Na renda mensal vitalícia simples, o participante recebe enquanto viver e o pagamento cessa com seu falecimento, sem reversão. Por não oferecer garantias adicionais, tende a pagar o maior valor mensal entre as rendas vitalícias, o que se ajusta a quem não tem dependentes. As demais opções incluem proteção a terceiros ou limitam o prazo."}, {"id": "M2D-034", "modulo": 2, "topico": "2.2.3.4.1 Renda Mensal Vitalícia (RMV)", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Para um mesmo participante, com a mesma idade e a mesma reserva acumulada, qual das modalidades abaixo tende a oferecer a MAIOR renda mensal inicial?", "alternativas": ["Renda mensal vitalícia", "Renda mensal vitalícia com prazo mínimo garantido de 15 anos", "Renda mensal vitalícia reversível a beneficiário indicado", "Renda mensal vitalícia reversível ao cônjuge com continuidade aos menores"], "correta": 0, "explicacao": "Quanto mais garantias a renda oferece (prazo mínimo, reversão a cônjuge, beneficiário ou filhos), maior o risco assumido pela seguradora e, portanto, menor o valor mensal para a mesma reserva. A renda vitalícia simples termina com o falecimento do participante e, por isso, permite a maior renda inicial."}, {"id": "M2D-035", "modulo": 2, "topico": "2.2.3.4.2 Renda Mensal Vitalícia com prazo mínimo garantido", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um participante escolheu renda mensal vitalícia com prazo mínimo garantido de 10 anos e faleceu após 6 anos recebendo o benefício. O que acontece com a renda?", "alternativas": ["Os beneficiários recebem de uma só vez toda a reserva original acumulada pelo participante", "Os beneficiários indicados recebem a renda pelos 4 anos restantes do prazo garantido, quando então o pagamento cessa", "A renda cessa imediatamente, pois era vitalícia e dependia da sobrevivência do participante", "Os beneficiários passam a receber a renda de forma vitalícia"], "correta": 1, "explicacao": "Nessa modalidade, a renda é vitalícia para o participante; se ele falecer antes de completar o prazo mínimo garantido, os beneficiários recebem a renda até o fim desse prazo. Como o falecimento ocorreu no 6º ano de um prazo de 10, os beneficiários recebem por mais 4 anos."}, {"id": "M2D-036", "modulo": 2, "topico": "2.2.3.4.3 Renda Mensal Vitalícia com reversão a beneficiário indicado", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente quer receber renda por toda a vida e garantir que, após seu falecimento, uma irmã que depende dele continue recebendo um percentual dessa renda pelo resto da vida dela. A modalidade adequada é:", "alternativas": ["Renda mensal vitalícia reversível ao cônjuge com continuidade aos menores", "Renda mensal vitalícia com prazo mínimo garantido", "Renda mensal temporária", "Renda mensal vitalícia reversível ao beneficiário indicado"], "correta": 3, "explicacao": "Na renda vitalícia reversível ao beneficiário indicado, após o falecimento do participante, um percentual da renda (definido na contratação) passa a ser pago de forma vitalícia ao beneficiário escolhido. A reversão ao cônjuge com continuidade aos menores contempla cônjuge e filhos menores, não uma irmã."}, {"id": "M2D-037", "modulo": 2, "topico": "2.2.3.4.4 Renda Mensal Vitalícia reversível ao cônjuge com continuidade aos menores", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Um participante contratou renda mensal vitalícia reversível ao cônjuge com continuidade aos menores. Ele faleceu e, alguns anos depois, faleceu também sua esposa, deixando dois filhos, um de 12 e outro de 23 anos. Considerando a regra usual dessa modalidade, como fica o pagamento?", "alternativas": ["A reserva remanescente é paga de uma só vez aos dois filhos, por meio de inventário", "A renda passa ao filho menor, que a recebe até atingir a maioridade definida no regulamento", "A renda cessa com o falecimento da esposa, pois a reversão é apenas ao cônjuge", "A renda passa aos dois filhos de forma vitalícia, em partes iguais"], "correta": 1, "explicacao": "Nessa modalidade, com o falecimento do participante, a renda reverte ao cônjuge de forma vitalícia; com o falecimento do cônjuge, continua sendo paga aos filhos menores até que atinjam a maioridade prevista no regulamento. O filho de 23 anos já não se enquadra como menor."}, {"id": "M2D-038", "modulo": 2, "topico": "2.2.3.4.5 Renda mensal temporária", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma participante contratou renda mensal temporária por 15 anos e faleceu no 5º ano de recebimento. O que acontece com os pagamentos?", "alternativas": ["São convertidos em pagamento único da reserva original aos herdeiros", "Continuam aos beneficiários indicados até completar os 15 anos contratados", "Cessam com o falecimento, pois a renda temporária é paga apenas enquanto a participante estiver viva, até o prazo contratado", "Passam a ser pagos de forma vitalícia ao cônjuge da participante"], "correta": 2, "explicacao": "A renda temporária é paga por um prazo determinado, desde que o participante esteja vivo; cessa no fim do prazo ou com o falecimento, o que ocorrer primeiro, sem reversão aos beneficiários. Se ela quisesse que os beneficiários recebessem o restante, a modalidade adequada seria a renda por prazo certo."}, {"id": "M2D-039", "modulo": 2, "topico": "2.2.3.4.6 Renda mensal por prazo certo", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um participante quer receber renda mensal durante exatamente 20 anos e deseja que, se falecer antes desse prazo, os beneficiários recebam as parcelas restantes. A modalidade indicada é:", "alternativas": ["Renda mensal por prazo certo", "Renda mensal vitalícia", "Renda mensal temporária", "Pagamento único"], "correta": 0, "explicacao": "Na renda por prazo certo, o pagamento ocorre durante o prazo definido; se o participante falecer antes do fim, os beneficiários recebem as parcelas restantes até o término. Na renda temporária, o pagamento cessa com o falecimento; na vitalícia, não há prazo final nem reversão."}, {"id": "M2D-040", "modulo": 2, "topico": "2.2.3.4 Transformação da reserva em renda", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Sobre as diferenças entre renda mensal temporária e renda mensal por prazo certo, assinale a afirmação correta:", "alternativas": ["Na renda temporária os beneficiários recebem o saldo restante; na de prazo certo, a renda cessa com o falecimento", "Ambas têm prazo determinado, mas apenas na renda por prazo certo os beneficiários recebem as parcelas restantes em caso de falecimento do participante", "As duas são idênticas, mudando apenas o nome conforme a seguradora", "Ambas são vitalícias, mas a temporária tem valor mensal reajustado por inflação"], "correta": 1, "explicacao": "As duas modalidades duram um prazo predeterminado. A renda temporária depende da sobrevivência do participante e cessa com o falecimento; a renda por prazo certo garante o pagamento até o fim do prazo, revertendo as parcelas restantes aos beneficiários."}, {"id": "M2D-041", "modulo": 2, "topico": "2.2.3.4.7 Pagamento único", "dificuldade": "facil", "tipo": "mc", "enunciado": "Uma participante chegou à data de início do benefício e quer usar todo o valor acumulado para quitar um imóvel. A forma de recebimento compatível com esse objetivo é:", "alternativas": ["Renda mensal temporária", "Renda mensal por prazo certo", "Renda mensal vitalícia", "Pagamento único"], "correta": 3, "explicacao": "No pagamento único, a reserva acumulada é paga de uma só vez ao participante, com a tributação correspondente ao regime escolhido. As demais modalidades transformam a reserva em fluxo mensal, o que não atenderia a necessidade de quitar o imóvel de uma vez."}, {"id": "M2D-042", "modulo": 2, "topico": "2.2.1.2 VGBL (definição, público-alvo, principais características e utilizações)", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Um cliente tem VGBL no regime regressivo com saldo de R$ 200.000,00, resultado de um único aporte de R$ 150.000,00 feito há 7 anos (os outros R$ 50.000,00 são rendimentos). Ele resgata R$ 40.000,00. O IR devido nesse resgate é de:", "alternativas": ["R$ 2.000,00", "R$ 8.000,00", "R$ 10.000,00", "R$ 1.500,00"], "correta": 0, "explicacao": "No VGBL, o IR incide apenas sobre a parcela de rendimentos contida no valor resgatado, que é proporcional: 50.000 / 200.000 = 25%; 25% × 40.000 = R$ 10.000,00 de rendimento. Com 7 anos, o aporte está na faixa de 6 a 8 anos, e a alíquota é de 20%: 20% × 10.000 = R$ 2.000,00. Tributar os R$ 40.000,00 inteiros (R$ 8.000,00) seria o tratamento do PGBL."}, {"id": "M2D-043", "modulo": 2, "topico": "2.3.1.1 Rating de crédito, score Serasa, comprovação de renda", "dificuldade": "facil", "tipo": "mc", "enunciado": "Um cliente pergunta ao gerente o que é o score de crédito que aparece na consulta a birôs como a Serasa. A explicação correta é:", "alternativas": ["Uma nota atribuída pela CVM aos tomadores de crédito que emitem títulos no mercado", "O limite máximo de crédito que o Banco Central autoriza cada pessoa a contratar no sistema financeiro", "Uma pontuação estatística que estima a probabilidade de a pessoa pagar suas contas em dia, com base em seu histórico financeiro", "O valor total das dívidas em atraso registradas no nome do cliente"], "correta": 2, "explicacao": "O score é uma pontuação calculada por birôs de crédito a partir de informações como histórico de pagamentos, dívidas e dados do Cadastro Positivo. Quanto maior, menor o risco estimado de inadimplência. Ele é um dos insumos da análise de crédito; não é um limite fixado pelo Banco Central nem uma lista de dívidas."}, {"id": "M2D-044", "modulo": 2, "topico": "2.3.1.1 Rating de crédito, score Serasa, comprovação de renda", "dificuldade": "medio", "tipo": "mc", "enunciado": "Dois clientes pedem o mesmo valor de empréstimo pessoal no mesmo banco. O primeiro recebeu classificação de risco (rating interno) melhor que o segundo. Em geral, qual é a consequência dessa diferença?", "alternativas": ["O cliente com melhor rating pagará taxa maior, pois terá acesso a prazos mais longos", "O rating não influencia a operação, pois o banco só pode considerar a renda comprovada", "O cliente com pior rating tende a pagar taxa de juros maior ou ter de oferecer garantias adicionais, pois a operação exige mais provisão e embute mais risco", "Os dois pagarão a mesma taxa, pois o rating serve apenas para estatísticas do Banco Central"], "correta": 2, "explicacao": "O rating de crédito classifica o tomador e a operação conforme o risco de inadimplência. Operações de maior risco exigem maior provisão para perdas e, por isso, costumam ter taxas maiores, limites menores ou exigência de garantias. Renda comprovada é apenas um dos fatores da análise."}, {"id": "M2D-045", "modulo": 2, "topico": "2.3.1.1 Rating de crédito, score Serasa, comprovação de renda", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um profissional autônomo, sem holerite, solicita um financiamento e o banco pede comprovação de renda. Qual é a principal finalidade dessa exigência e uma forma usual de atendê-la?", "alternativas": ["Atender exclusivamente a regras de prevenção à lavagem de dinheiro; a comprovação é dispensada para autônomos", "Avaliar a capacidade de pagamento e evitar parcelas incompatíveis com a renda; ele pode apresentar declaração de IR, extratos bancários ou documentos que comprovem seus rendimentos", "Cumprir exigência fiscal da Receita Federal; ele só pode comprovar renda com contracheque emitido por empregador", "Definir o valor do IOF da operação; ele precisa apresentar apenas o comprovante de residência"], "correta": 1, "explicacao": "A comprovação de renda permite verificar se as parcelas cabem no orçamento do cliente, um pilar da concessão responsável de crédito e da prevenção do superendividamento. Autônomos e empresários podem comprovar renda por declaração de IR, extratos de movimentação, pró-labore ou documentos equivalentes."}, {"id": "M2D-046", "modulo": 2, "topico": "2.3.1.1 Rating de crédito, score Serasa, comprovação de renda", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma cliente que sempre pagou suas contas em dia pergunta como o Cadastro Positivo pode influenciar sua obtenção de crédito. A resposta correta é:", "alternativas": ["Somente pessoas que pedem expressamente sua inclusão podem ter dados no Cadastro Positivo", "O Cadastro Positivo obriga os bancos a conceder crédito com taxa reduzida a quem estiver nele", "O Cadastro Positivo registra apenas dívidas em atraso, funcionando como uma lista de inadimplentes", "O histórico de pagamentos em dia é considerado na análise e pode melhorar o score, favorecendo condições de crédito; a inclusão é automática, com direito de pedir a exclusão"], "correta": 3, "explicacao": "O Cadastro Positivo reúne o histórico de pagamentos (inclusive os feitos em dia), o que ajuda a diferenciar bons pagadores e pode melhorar o score. Desde a Lei Complementar 166/2019, a inclusão é automática, e a pessoa pode solicitar o cancelamento. Ele não obriga a concessão de crédito nem define taxas."}, {"id": "M2D-047", "modulo": 2, "topico": "2.3.1.2 Diferenças entre empréstimo, financiamento e leasing", "dificuldade": "facil", "tipo": "mc", "enunciado": "Um cliente precisa de dinheiro para usar livremente, sem destinação definida, enquanto outro quer recursos especificamente para comprar um carro. As operações típicas para cada um são, respectivamente:", "alternativas": ["Empréstimo e financiamento", "Financiamento e consórcio", "Financiamento e empréstimo", "Leasing e empréstimo"], "correta": 0, "explicacao": "No empréstimo, os recursos não têm destinação específica: o cliente usa como quiser. No financiamento, o crédito é vinculado à aquisição de um bem ou serviço determinado, que frequentemente serve de garantia, o que costuma permitir taxas menores e prazos maiores."}, {"id": "M2D-048", "modulo": 2, "topico": "2.3.1.2 Diferenças entre empréstimo, financiamento e leasing", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma empresa quer usar um caminhão novo sem comprá-lo de imediato, pagando contraprestações mensais e com a possibilidade de adquiri-lo ao final do contrato. A operação adequada e sua característica principal são:", "alternativas": ["Leasing (arrendamento mercantil): o bem pertence à arrendadora durante o contrato e, ao final, a empresa pode comprá-lo, devolvê-lo ou renovar o contrato", "Empréstimo: o banco entrega o caminhão e a empresa paga parcelas sem destinação definida", "Consórcio: a empresa recebe o caminhão imediatamente e paga apenas taxa de administração", "Financiamento: o caminhão fica em nome da empresa desde o início, alienado ao banco"], "correta": 0, "explicacao": "No leasing, a arrendadora compra o bem e o cede para uso do arrendatário mediante contraprestações. A propriedade é da arrendadora durante o contrato; ao final, o arrendatário pode exercer a opção de compra (pelo valor residual), devolver o bem ou renovar. No financiamento, o bem já é do comprador, mas fica alienado ao credor."}, {"id": "M2D-049", "modulo": 2, "topico": "2.3.1.2 Diferenças entre empréstimo, financiamento e leasing", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Sobre o leasing (arrendamento mercantil) em comparação com o financiamento de um bem, assinale a afirmação correta:", "alternativas": ["No leasing, o arrendatário não pode, em nenhuma hipótese, adquirir o bem ao final do contrato", "No leasing o bem é registrado em nome do arrendatário desde a assinatura do contrato", "No leasing não há incidência de IOF, pois a operação não é tratada como operação de crédito, enquanto o financiamento sofre IOF", "O leasing só pode ser contratado por pessoas físicas, enquanto o financiamento é exclusivo de empresas"], "correta": 2, "explicacao": "O arrendamento mercantil é uma locação com opção de compra, e não uma operação de crédito para fins de IOF, por isso não sofre esse imposto, diferentemente do financiamento. O bem fica em nome da arrendadora durante o contrato, e ao final há opção de compra. Pessoas físicas e jurídicas podem contratá-lo."}, {"id": "M2D-050", "modulo": 2, "topico": "2.3.1.3 Utilização do SCR", "dificuldade": "medio", "tipo": "mc", "enunciado": "Sobre o Sistema de Informações de Créditos (SCR), mantido pelo Banco Central, é correto afirmar que:", "alternativas": ["Registra apenas operações em atraso, sem incluir contratos pagos em dia", "É alimentado pelas instituições financeiras com informações das operações de crédito de seus clientes e pode ser consultado pelas instituições, com autorização do cliente, na análise de crédito", "Só pode ser consultado pelo Banco Central, sendo vedado o acesso pelo próprio cliente", "É um cadastro de inadimplentes mantido por birôs privados, como Serasa e SPC"], "correta": 1, "explicacao": "O SCR é um banco de dados do Banco Central abastecido pelas instituições com as operações de crédito dos clientes, adimplentes ou não. Serve à supervisão bancária e, com autorização do cliente, à análise de crédito das instituições. O próprio cliente pode consultar gratuitamente seus dados pelo Registrato."}, {"id": "M2D-051", "modulo": 2, "topico": "2.3.1.3 Utilização do SCR", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Um cliente consultou seus dados no Registrato e encontrou no SCR uma operação de crédito que já foi quitada, mas que continua aparecendo como em atraso. Qual é a orientação correta?", "alternativas": ["Solicitar diretamente ao Banco Central que exclua o registro, pois é ele quem altera as informações do SCR", "Procurar a Serasa, que é a gestora do SCR e responsável pelas correções", "Aguardar cinco anos, pois as informações do SCR não podem ser corrigidas antes desse prazo", "Solicitar a correção à instituição financeira que enviou a informação, pois ela é a responsável pelos dados remetidos ao SCR"], "correta": 3, "explicacao": "As informações do SCR são de responsabilidade das instituições que as enviam. Em caso de erro, o cliente deve pedir a correção à instituição (e, se não resolvido, recorrer à Ouvidoria e registrar reclamação no Banco Central). O Banco Central não altera diretamente os dados, e a Serasa não administra o SCR."}, {"id": "M2D-052", "modulo": 2, "topico": "2.3.1.3 Utilização do SCR", "dificuldade": "facil", "tipo": "mc", "enunciado": "Um cliente quer saber, de forma gratuita, quais operações de crédito estão registradas em seu nome no sistema financeiro. A ferramenta adequada para isso é:", "alternativas": ["O portal da CVM para consulta de investidores", "O Registrato, do Banco Central, que permite consultar os dados do SCR", "O sistema da B3 para consulta de posições em custódia", "O Cadastro de Emitentes de Cheques sem Fundos da Febraban"], "correta": 1, "explicacao": "O Registrato é o sistema do Banco Central em que o cidadão consulta gratuitamente relatórios como o de empréstimos e financiamentos (dados do SCR), além de outros relatórios sobre seu relacionamento com o sistema financeiro."}, {"id": "M2D-053", "modulo": 2, "topico": "2.3.2.1 Cartão de crédito: limites, juros, pagamento parcial e refinanciamento", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma cliente recebeu a fatura do cartão e não consegue pagar o total. Sobre o crédito rotativo, é correto afirmar que:", "alternativas": ["Não há cobrança de juros no rotativo, apenas de IOF sobre o saldo não pago", "Ao pagar qualquer valor abaixo do total, o cartão é cancelado automaticamente pela instituição", "O saldo não pago pode permanecer no rotativo indefinidamente, desde que se pague o mínimo todo mês", "O saldo não pago pode ficar no rotativo apenas até o vencimento da fatura seguinte; depois disso, a instituição deve oferecer parcelamento ou outra forma de pagamento"], "correta": 3, "explicacao": "Pela regulamentação, o crédito rotativo só pode ser usado até o vencimento da fatura seguinte. Após esse período, o saldo deve ser pago ou financiado por meio de parcelamento, em geral com condições mais vantajosas que as do rotativo. Sobre o rotativo incidem juros e IOF."}, {"id": "M2D-054", "modulo": 2, "topico": "2.3.2.2 Cálculos da taxa de refinanciamento de faturas", "dificuldade": "medio", "tipo": "mc", "enunciado": "A fatura do cartão de um cliente é de R$ 4.000,00 e ele paga R$ 1.000,00 no vencimento. Se a taxa do rotativo for de 12% ao mês, qual será o valor aproximado dos juros cobrados na fatura seguinte sobre o saldo financiado, desconsiderando IOF e outros encargos?", "alternativas": ["R$ 360,00", "R$ 480,00", "R$ 120,00", "R$ 3.360,00"], "correta": 0, "explicacao": "O saldo que vai para o rotativo é 4.000 − 1.000 = R$ 3.000,00. Juros de um mês: 12% × 3.000 = R$ 360,00. Aplicar 12% sobre a fatura inteira (R$ 480,00) é erro comum, pois a parte paga não é financiada. O valor de R$ 3.360,00 é o saldo com juros, não os juros."}, {"id": "M2D-055", "modulo": 2, "topico": "2.3.2.2 Cálculos da taxa de refinanciamento de faturas", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Um cliente decide parcelar um saldo de fatura de R$ 2.000,00 em 2 parcelas mensais iguais, com juros compostos de 10% ao mês e a primeira parcela vencendo em um mês (sistema Price). Desconsiderando IOF, o valor aproximado de cada parcela é:", "alternativas": ["R$ 1.200,00", "R$ 1.100,00", "R$ 1.152,38", "R$ 1.210,00"], "correta": 2, "explicacao": "Parcela = PV × i / [1 − (1 + i)^−n] = 2.000 × 0,10 / [1 − 1,10^−2] = 200 / (1 − 0,826446) = 200 / 0,173554 ≈ R$ 1.152,38. Conferindo: após 1 mês, saldo = 2.200 − 1.152,38 = 1.047,62; após mais 1 mês, 1.047,62 × 1,10 ≈ 1.152,38, quitando a dívida. Os demais valores resultam de juros simples ou de cálculos sobre o saldo inteiro."}, {"id": "M2D-056", "modulo": 2, "topico": "2.3.2.2 Cálculos da taxa de refinanciamento de faturas", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um saldo de R$ 1.000,00 ficou financiado no cartão por dois meses a juros compostos de 14% ao mês, sem nenhum pagamento no período. Desconsiderando IOF e encargos, a dívida ao final dos dois meses será de aproximadamente:", "alternativas": ["R$ 1.280,00", "R$ 1.320,00", "R$ 1.140,00", "R$ 1.299,60"], "correta": 3, "explicacao": "Com juros compostos, os juros do segundo mês incidem sobre o saldo já corrigido: 1.000 × 1,14 × 1,14 = 1.000 × 1,2996 = R$ 1.299,60. O valor de R$ 1.280,00 seria obtido com juros simples (14% × 2 sobre o principal), que não é a forma como o rotativo é capitalizado."}, {"id": "M2D-057", "modulo": 2, "topico": "2.3.2.1 Cartão de crédito: limites, juros, pagamento parcial e refinanciamento", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Uma cliente tinha uma dívida original de R$ 1.500,00 no rotativo do cartão, que foi depois parcelada. Considerando a regra que limita os juros e encargos financeiros do rotativo e do parcelamento da fatura, qual é o valor máximo total que ela poderá pagar por essa dívida?", "alternativas": ["R$ 3.000,00, pois juros e encargos não podem ultrapassar 100% do valor original da dívida", "R$ 2.250,00, pois os encargos são limitados a 50% do valor original da dívida", "Não há limite, pois a taxa do cartão é livremente pactuada entre as partes", "R$ 1.620,00, pois os juros do cartão são limitados a 8% ao mês"], "correta": 0, "explicacao": "A Lei 14.690/2023 estabeleceu que os juros e encargos financeiros cobrados no rotativo e no parcelamento da fatura não podem superar 100% do valor original da dívida. Assim, a dívida de R$ 1.500,00 pode chegar, no máximo, a R$ 3.000,00. O teto de 8% ao mês é do cheque especial, não do cartão."}, {"id": "M2D-058", "modulo": 2, "topico": "2.3.2.1 Cartão de crédito: limites, juros, pagamento parcial e refinanciamento", "dificuldade": "facil", "tipo": "mc", "enunciado": "Um cliente quer reduzir o limite do seu cartão de crédito para controlar melhor os gastos. Sobre o limite do cartão, é correto afirmar que:", "alternativas": ["É fixado pelo Banco Central para todos os clientes, conforme a faixa de renda", "É sempre igual ao salário mensal comprovado pelo cliente", "É definido pela instituição com base na análise de crédito, e o cliente pode pedir sua redução a qualquer momento", "Só pode ser alterado na renovação anual do cartão"], "correta": 2, "explicacao": "O limite é estabelecido pela emissora a partir da análise de crédito (renda, histórico, relacionamento). O cliente pode solicitar a redução a qualquer momento; aumentos dependem de nova análise e, quando oferecidos pela instituição, de concordância do cliente."}, {"id": "M2D-059", "modulo": 2, "topico": "2.3.3.1 Cheque especial: vencimento, cálculo de juros e IOF", "dificuldade": "facil", "tipo": "mc", "enunciado": "Uma cliente quer entender como funciona o cheque especial de sua conta. A explicação correta é:", "alternativas": ["É uma aplicação automática do saldo da conta em CDB de liquidez diária", "É um limite de crédito pré-aprovado vinculado à conta; os juros incidem somente sobre o valor utilizado e pelos dias de utilização", "É um limite sem juros, pois o banco cobra apenas uma tarifa mensal fixa", "É um empréstimo com parcelas fixas, debitadas mensalmente, independentemente do uso"], "correta": 1, "explicacao": "O cheque especial é um crédito rotativo pré-aprovado: quando o saldo fica negativo, a pessoa usa o limite e paga juros apenas sobre o valor efetivamente utilizado, pelo período de uso, além de IOF. É uma linha cara, indicada só para emergências de curtíssimo prazo."}, {"id": "M2D-060", "modulo": 2, "topico": "2.3.3.1 Cheque especial: vencimento, cálculo de juros e IOF", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente ficou com saldo devedor de R$ 3.000,00 no cheque especial durante 15 dias. Considerando taxa de 6% ao mês, calculada de forma proporcional aos dias (mês de 30 dias), os juros desse período, sem IOF, serão de:", "alternativas": ["R$ 90,00", "R$ 45,00", "R$ 270,00", "R$ 180,00"], "correta": 0, "explicacao": "Os juros do cheque especial incidem sobre o saldo devedor pelos dias de uso. Taxa proporcional: 6% / 30 = 0,2% ao dia; 0,2% × 15 dias = 3%; 3% × 3.000 = R$ 90,00. O valor de R$ 180,00 corresponderia a um mês inteiro de uso."}, {"id": "M2D-061", "modulo": 2, "topico": "2.3.3.1 Cheque especial: vencimento, cálculo de juros e IOF", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Uma cliente utilizou R$ 2.000,00 do cheque especial e manteve esse saldo devedor por 10 dias. Considere, de forma hipotética, IOF de 0,0082% ao dia sobre o saldo devedor mais alíquota adicional de 0,38% sobre o valor utilizado. O IOF total da operação será de aproximadamente:", "alternativas": ["R$ 1,64", "R$ 16,40", "R$ 7,60", "R$ 9,24"], "correta": 3, "explicacao": "IOF diário: 0,0082% × 2.000 × 10 dias = R$ 1,64. IOF adicional: 0,38% × 2.000 = R$ 7,60. Total: 1,64 + 7,60 = R$ 9,24. O IOF é cobrado além dos juros e costuma ser lançado na conta junto com os encargos do período."}, {"id": "M2D-062", "modulo": 2, "topico": "2.3.3.1 Cheque especial: vencimento, cálculo de juros e IOF", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um banco quer cobrar taxa de juros de 9% ao mês no cheque especial de pessoas físicas. Considerando a regulamentação vigente, essa cobrança:", "alternativas": ["É regular, desde que o limite seja superior a R$ 500,00", "É irregular, pois os juros do cheque especial são limitados a 8% ao mês", "É irregular, pois os juros do cheque especial são limitados a 100% do valor original da dívida", "É regular, pois as taxas do cheque especial são livremente pactuadas"], "correta": 1, "explicacao": "A regulamentação do Conselho Monetário Nacional limita os juros do cheque especial a 8% ao mês para pessoas físicas e microempreendedores individuais. O limite de 100% do valor original da dívida refere-se aos encargos do cartão de crédito (rotativo e parcelamento da fatura)."}, {"id": "M2D-063", "modulo": 2, "topico": "2.3.3.1 Cheque especial: vencimento, cálculo de juros e IOF", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente usa o cheque especial há vários meses seguidos para cobrir despesas do dia a dia. Qual é a conduta mais adequada da pessoa profissional que o atende?", "alternativas": ["Recomendar que ele mantenha o saldo devedor, pois os juros só são cobrados no vencimento do contrato", "Aumentar o limite do cheque especial, para que ele tenha mais folga no orçamento", "Explicar o alto custo do cheque especial e apresentar alternativas mais baratas, como um empréstimo pessoal ou consignado para quitar o saldo, conforme a capacidade de pagamento", "Sugerir a contratação de um título de capitalização para compensar os juros pagos"], "correta": 2, "explicacao": "O cheque especial tem custo elevado e deve ser usado apenas por poucos dias. Para uso prolongado, a conduta adequada é orientar o cliente e oferecer a troca da dívida por linha mais barata e com parcelas compatíveis com a renda. Ampliar o limite agravaria o endividamento."}, {"id": "M2D-064", "modulo": 2, "topico": "2.3.3.1 Cheque especial: vencimento, cálculo de juros e IOF", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma cliente pergunta quando os juros do cheque especial são cobrados. A explicação correta é:", "alternativas": ["Os juros são cobrados antecipadamente sobre todo o limite disponível no início de cada mês", "Os juros são calculados diariamente sobre o saldo devedor utilizado e debitados na conta periodicamente, em geral uma vez por mês, na data prevista no contrato", "Os juros só são cobrados se o saldo devedor permanecer negativo por mais de 30 dias", "Os juros são cobrados apenas no vencimento do contrato do limite, de uma só vez"], "correta": 1, "explicacao": "No cheque especial, os encargos são apurados dia a dia sobre o saldo devedor efetivamente utilizado e lançados na conta na periodicidade contratada, normalmente mensal. Não há cobrança sobre o limite não usado. O contrato do limite também tem prazo de vigência, podendo ser renovado."}, {"id": "M2D-065", "modulo": 2, "topico": "2.3.4.1 Crédito consignado: margem de financiamento e desconto", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um servidor tem remuneração, para fins de cálculo da margem, de R$ 6.000,00 e já paga uma parcela de consignado de R$ 800,00. Considerando, de forma hipotética, margem consignável de 35% para empréstimos, qual é o valor máximo de uma nova parcela que ele pode contratar?", "alternativas": ["R$ 2.900,00", "R$ 2.100,00", "R$ 1.100,00", "R$ 1.300,00"], "correta": 3, "explicacao": "Margem total: 35% × 6.000 = R$ 2.100,00. Como já há R$ 800,00 comprometidos, a margem disponível é 2.100 − 800 = R$ 1.300,00. A margem limita a soma de todas as parcelas descontadas em folha, e não cada contrato isoladamente."}, {"id": "M2D-066", "modulo": 2, "topico": "2.3.4.2 Crédito consignado: principais vantagens (juros e prazo)", "dificuldade": "facil", "tipo": "mc", "enunciado": "Por que o crédito consignado costuma ter taxas de juros menores que as do empréstimo pessoal sem garantia?", "alternativas": ["Porque o consignado é isento de qualquer tributo, inclusive IOF", "Porque o governo subsidia integralmente os juros de todos os contratos consignados", "Porque as parcelas são descontadas diretamente da folha de pagamento ou do benefício, o que reduz o risco de inadimplência", "Porque o consignado é garantido pelo FGC em caso de falência do banco"], "correta": 2, "explicacao": "No consignado, a parcela é descontada antes de o salário ou benefício chegar ao cliente, o que reduz muito o risco de crédito. Por isso, as taxas são menores e os prazos mais longos que os do crédito pessoal comum. Não há subsídio geral nem garantia do FGC para o tomador."}, {"id": "M2D-067", "modulo": 2, "topico": "2.3.4.1 Crédito consignado: margem de financiamento e desconto", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Sobre o crédito consignado para trabalhadores com carteira assinada, assinale a afirmação correta:", "alternativas": ["Se o trabalhador for desligado da empresa, a dívida continua existindo e deverá ser paga nas condições previstas em contrato, ainda que não haja mais desconto em folha", "A margem consignável é calculada sobre a remuneração bruta, antes de quaisquer descontos obrigatórios", "O desconto em folha pode comprometer qualquer percentual da renda, desde que o trabalhador autorize", "Com o desligamento da empresa, a dívida é automaticamente perdoada, pois o desconto em folha deixa de existir"], "correta": 0, "explicacao": "O desligamento não extingue a dívida: o contrato prevê como as parcelas serão pagas (por exemplo, com parte de verbas rescisórias, garantias previstas em lei ou boleto/débito). A margem consignável é limitada por lei e calculada sobre a remuneração disponível após descontos obrigatórios; não pode ser ampliada por simples autorização do trabalhador."}, {"id": "M2D-068", "modulo": 2, "topico": "2.3.5.1 CDC: utilização de bens como garantia", "dificuldade": "facil", "tipo": "mc", "enunciado": "Um cliente vai financiar a compra de um carro por meio de CDC (Crédito Direto ao Consumidor). Como o veículo costuma ser utilizado nessa operação?", "alternativas": ["Não tem relação com a operação, pois o CDC não admite garantias", "Como entrada obrigatória, sendo vendido pelo banco no ato da contratação", "Como garantia, por meio de alienação fiduciária ao banco até a quitação do financiamento", "Como bem arrendado, permanecendo em nome do banco sem opção de compra"], "correta": 2, "explicacao": "No CDC para aquisição de bens, o próprio bem financiado costuma ser dado em garantia por alienação fiduciária: o cliente tem a posse e o uso, mas a propriedade fiduciária fica com o credor até a quitação. Isso reduz o risco e permite condições melhores que as de crédito sem garantia."}, {"id": "M2D-069", "modulo": 2, "topico": "2.3.5.1 CDC: utilização de bens como garantia", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma cliente financiou um veículo por CDC com alienação fiduciária e, no meio do contrato, quer vendê-lo a um terceiro. Qual é a situação correta?", "alternativas": ["Ela precisa quitar o financiamento (ou obter anuência do credor para transferir a dívida), pois o veículo está alienado fiduciariamente ao banco", "Ela só pode vender o veículo após cinco anos da contratação, independentemente da quitação", "Ela pode vender livremente, pois o veículo está em seu nome, sem qualquer restrição", "O banco é obrigado a aceitar a venda e transferir automaticamente a dívida ao comprador"], "correta": 0, "explicacao": "Com a alienação fiduciária, o bem fica gravado em favor do credor até a quitação, e essa restrição consta do registro do veículo. Para vendê-lo, a cliente deve quitar o saldo devedor ou negociar com o banco a transferência da dívida, o que depende de análise do novo devedor."}, {"id": "M2D-070", "modulo": 2, "topico": "2.3.5.2 CDC: prazos maiores e destinação dos recursos", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente quer comprar um eletrodoméstico de R$ 6.000,00 e compara um crédito pessoal sem destinação específica com um CDC vinculado à compra do bem. Em geral, qual é a vantagem esperada do CDC?", "alternativas": ["Isenção de IOF, por ser uma operação de consumo", "Ausência de juros, já que o pagamento é feito diretamente à loja", "Liberdade para usar o dinheiro em qualquer finalidade, inclusive quitar outras dívidas", "Taxas menores e prazos maiores, pois os recursos têm destinação definida e o bem pode servir de garantia"], "correta": 3, "explicacao": "O CDC é um financiamento com destinação específica (aquisição do bem ou serviço), e os recursos costumam ser pagos diretamente ao vendedor. A vinculação e a possibilidade de garantia reduzem o risco, o que tende a gerar taxas menores e prazos maiores. Há juros e incide IOF."}, {"id": "M2D-071", "modulo": 2, "topico": "2.3.6 Crédito imobiliário", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma cliente vai financiar R$ 240.000,00 em 240 meses pelo Sistema de Amortização Constante (SAC), com juros de 1% ao mês. Desconsiderando seguros, taxas e correção monetária, o valor da primeira prestação será de:", "alternativas": ["R$ 2.400,00", "R$ 3.400,00", "R$ 3.390,00", "R$ 1.000,00"], "correta": 1, "explicacao": "No SAC, a amortização é constante: 240.000 / 240 = R$ 1.000,00 por mês. Os juros do primeiro mês incidem sobre o saldo total: 1% × 240.000 = R$ 2.400,00. Primeira prestação = 1.000 + 2.400 = R$ 3.400,00. A segunda seria 1.000 + 1% × 239.000 = R$ 3.390,00, e as prestações decrescem ao longo do tempo."}, {"id": "M2D-072", "modulo": 2, "topico": "2.3.6 Crédito imobiliário", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um casal está em dúvida entre a tabela Price e o SAC no financiamento imobiliário. Assinale a comparação correta:", "alternativas": ["No SAC o total de juros pagos é maior, pois a amortização inicial é menor que na Price", "Nos dois sistemas a amortização é constante; muda apenas a taxa de juros", "Na Price as prestações começam mais altas e diminuem, enquanto no SAC são constantes", "No SAC as prestações começam mais altas e diminuem com o tempo, e o total de juros pagos tende a ser menor que na Price, cujas prestações são constantes"], "correta": 3, "explicacao": "No SAC, a amortização é constante e os juros caem com o saldo devedor, por isso as prestações são decrescentes e o saldo cai mais rápido, gerando menos juros no total. Na Price, as prestações são constantes, com amortização menor no início, o que mantém o saldo mais alto por mais tempo."}, {"id": "M2D-073", "modulo": 2, "topico": "2.3.6 Crédito imobiliário", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente que vai financiar um imóvel pelo Sistema Financeiro da Habitação pergunta quais seguros fazem parte da operação. A resposta correta é:", "alternativas": ["Seguro de Morte e Invalidez Permanente (MIP) e seguro de Danos Físicos ao Imóvel (DFI)", "Seguro garantia judicial e seguro de responsabilidade civil profissional", "Seguro de automóvel e seguro residencial com cobertura de roubo", "Seguro prestamista para desemprego e seguro de vida resgatável"], "correta": 0, "explicacao": "Nos financiamentos habitacionais, são exigidos o seguro MIP, que quita o saldo devedor (na proporção da renda de cada mutuário) em caso de morte ou invalidez permanente, e o DFI, que cobre danos físicos ao imóvel. Eles compõem o custo efetivo total (CET) da operação."}, {"id": "M2D-074", "modulo": 2, "topico": "2.3.6 Crédito imobiliário", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Uma cliente tem financiamento imobiliário com saldo devedor de R$ 300.000,00 e 180 meses restantes, e encontrou outro banco com taxa menor. Sobre a portabilidade de crédito, é correto afirmar que:", "alternativas": ["A portabilidade permite que a cliente obtenha um valor adicional de crédito no mesmo contrato", "O banco original pode recusar a portabilidade caso não tenha interesse em perder a cliente", "A nova operação deve ter valor e prazo não superiores ao saldo devedor e ao prazo remanescente da operação original", "A cliente precisa quitar a dívida com recursos próprios antes de contratar com o novo banco"], "correta": 2, "explicacao": "Na portabilidade de crédito, a nova instituição quita a dívida na instituição original, e o novo contrato não pode ter valor nem prazo superiores ao saldo devedor e ao prazo remanescente. A instituição original não pode impedir a portabilidade, embora possa fazer contraproposta. Crédito adicional seria outra operação, não portabilidade."}, {"id": "M2D-075", "modulo": 2, "topico": "2.3.6 Crédito imobiliário", "dificuldade": "facil", "tipo": "mc", "enunciado": "Um trabalhador com carteira assinada quer comprar seu primeiro imóvel residencial por meio de financiamento habitacional. Sobre o uso do FGTS nessa operação, é correto afirmar que:", "alternativas": ["O FGTS não pode ser usado em financiamentos bancários, apenas em consórcios", "Respeitadas as condições do sistema habitacional, o saldo do FGTS pode ser usado para a entrada, para amortizar ou para quitar o saldo devedor", "O FGTS pode ser usado livremente para qualquer imóvel, inclusive comercial", "O FGTS só pode ser usado após a quitação total do financiamento"], "correta": 1, "explicacao": "O FGTS pode ser utilizado na aquisição de imóvel residencial, desde que atendidas as condições do Sistema Financeiro da Habitação e do próprio FGTS, para compor a entrada, amortizar ou liquidar o saldo devedor. Imóveis comerciais não se enquadram."}, {"id": "M2D-076", "modulo": 2, "topico": "2.3.7 Capital de giro", "dificuldade": "facil", "tipo": "mc", "enunciado": "Uma pequena empresa precisa pagar fornecedores e a folha de salários antes de receber das vendas feitas a prazo aos seus clientes. A linha de crédito mais adequada para essa necessidade é:", "alternativas": ["Capital de giro", "Crédito consignado", "Leasing de equipamentos", "Financiamento imobiliário"], "correta": 0, "explicacao": "O capital de giro financia as necessidades do dia a dia da empresa, como estoques, fornecedores e folha, cobrindo o descasamento entre pagamentos e recebimentos. Financiamento imobiliário e leasing são voltados a ativos específicos, e o consignado é destinado a pessoas físicas."}, {"id": "M2D-077", "modulo": 2, "topico": "2.3.7 Capital de giro", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma empresa que vende muito a prazo, com recebíveis de cartão e duplicatas, solicita capital de giro. Qual característica é usual nessa operação?", "alternativas": ["O prazo é obrigatoriamente superior a 10 anos", "Os recebíveis da empresa, como duplicatas e vendas com cartão, podem ser oferecidos como garantia, o que tende a reduzir a taxa", "A operação é isenta de IOF, por se destinar a pessoa jurídica", "Os recursos devem ser usados exclusivamente na compra de máquinas e equipamentos"], "correta": 1, "explicacao": "Capital de giro é crédito de curto e médio prazo para a operação da empresa. É comum usar recebíveis (duplicatas, cartões, cheques) e aval dos sócios como garantia, o que reduz o risco e a taxa. A operação sofre IOF, e a compra de máquinas é atendida por linhas de investimento."}, {"id": "M2D-078", "modulo": 2, "topico": "2.3.8 Consórcio", "dificuldade": "facil", "tipo": "mc", "enunciado": "Uma cliente quer comprar um carro, não tem pressa e prefere evitar o pagamento de juros. Ela pergunta como funciona o consórcio. A explicação correta é:", "alternativas": ["A cliente aplica um valor mensal em renda fixa e resgata com rendimento após o prazo do plano", "O banco empresta o valor do carro imediatamente, cobrando juros menores que os do financiamento", "Um grupo de pessoas contribui mensalmente para um fundo comum; a cada mês, participantes são contemplados por sorteio ou lance, e paga-se taxa de administração em vez de juros", "A cliente recebe o carro no primeiro mês e paga parcelas fixas sem qualquer custo adicional"], "correta": 2, "explicacao": "O consórcio é uma modalidade de compra em grupo (autofinanciamento): os participantes pagam parcelas a um fundo comum, e a contemplação ocorre por sorteio ou lance. Não há juros, mas há taxa de administração e, em geral, fundo de reserva. Não há garantia de contemplação imediata."}, {"id": "M2D-079", "modulo": 2, "topico": "2.3.8 Consórcio", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma carta de crédito de consórcio de R$ 80.000,00 tem prazo de 60 meses, taxa de administração total de 16% e fundo de reserva de 2%. Desconsiderando reajustes e seguros, o valor aproximado da parcela mensal é:", "alternativas": ["R$ 1.600,00", "R$ 1.546,67", "R$ 1.333,33", "R$ 1.573,33"], "correta": 3, "explicacao": "Custo total: 80.000 × (1 + 0,16 + 0,02) = 80.000 × 1,18 = R$ 94.400,00. Dividindo por 60 meses: 94.400 / 60 ≈ R$ 1.573,33. Sem as taxas, a parcela seria R$ 1.333,33; considerando só a taxa de administração, R$ 1.546,67."}, {"id": "M2D-080", "modulo": 2, "topico": "2.3.8 Consórcio", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um participante de consórcio desistiu do grupo após pagar algumas parcelas. Pelas regras gerais do sistema de consórcios, quando ele recebe os valores pagos?", "alternativas": ["Quando sua cota excluída for contemplada em sorteio ou, no máximo, ao final do grupo, com os descontos previstos em contrato", "Somente se outro participante comprar sua cota, sem prazo definido", "Imediatamente, com todos os valores pagos corrigidos e sem descontos", "Nunca, pois a desistência implica a perda integral dos valores pagos"], "correta": 0, "explicacao": "A Lei 11.795/2008 prevê que o consorciado excluído recebe a restituição quando sua cota for contemplada em sorteio, ou ao término do grupo, com dedução de encargos previstos no contrato (como taxa de administração e eventuais penalidades). Não há devolução imediata nem perda total."}, {"id": "M2D-081", "modulo": 2, "topico": "2.3.8 Consórcio", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Dois clientes querem adquirir um veículo: Carla precisa do carro agora para trabalhar; Diego pode esperar alguns anos e quer pagar o menor custo total possível. Considerando as características de financiamento e consórcio, a orientação mais adequada é:", "alternativas": ["Consórcio para Carla, pois ela pode ofertar lance e ter garantia de contemplação no primeiro mês", "Consórcio para ambos, pois a contemplação ocorre sempre no primeiro mês do grupo", "Financiamento para ambos, pois o consórcio cobra juros maiores e não é regulado", "Financiamento para Carla, pela posse imediata do bem, e consórcio para Diego, que paga taxa de administração em vez de juros, mas sem data certa de contemplação"], "correta": 3, "explicacao": "O financiamento permite a aquisição imediata do bem, com pagamento de juros. O consórcio não tem juros (há taxa de administração e fundo de reserva), mas a contemplação depende de sorteio ou lance, sem data garantida. Os consórcios são regulados e fiscalizados pelo Banco Central."}, {"id": "M2D-082", "modulo": 2, "topico": "2.4.1.1 Conta corrente: recebimento de salários (conta-salário)", "dificuldade": "facil", "tipo": "mc", "enunciado": "Uma empresa contratou um banco para pagar os salários de seus funcionários por meio de conta-salário. Um funcionário pergunta o que caracteriza esse tipo de conta. A explicação correta é:", "alternativas": ["É uma conta de poupança vinculada ao empregador, com rendimento mensal garantido", "É uma conta corrente comum, que aceita depósitos de qualquer origem e oferece talão de cheques", "É uma conta aberta por iniciativa do empregador apenas para crédito de salários, sem cobrança de tarifas pelos serviços básicos, e que não admite outros tipos de depósito", "É uma conta que só pode ser movimentada pelo empregador, mediante autorização do funcionário"], "correta": 2, "explicacao": "A conta-salário é aberta pela instituição contratada pelo empregador, destina-se exclusivamente ao recebimento de salários e similares, não aceita depósitos de outras fontes nem emite cheques, e não pode ter cobrança de tarifas pelos serviços básicos previstos na regulamentação, como saques e transferência do salário."}, {"id": "M2D-083", "modulo": 2, "topico": "2.4.1.2.1 Garantias para depósitos à vista", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente mantém R$ 180.000,00 em conta corrente e R$ 150.000,00 em CDB no mesmo banco. Em caso de intervenção ou liquidação desse banco, qual valor fica descoberto pelo FGC, considerando o limite por CPF e por instituição?", "alternativas": ["R$ 150.000,00", "R$ 80.000,00", "R$ 0,00", "R$ 30.000,00"], "correta": 1, "explicacao": "O FGC garante até R$ 250 mil por CPF por instituição (ou conglomerado), somando todos os produtos cobertos, inclusive depósitos à vista e CDB. Total: 180.000 + 150.000 = R$ 330.000,00; descoberto: 330.000 − 250.000 = R$ 80.000,00. O limite não é aplicado separadamente por produto."}, {"id": "M2D-084", "modulo": 2, "topico": "2.4.1.2.2 Depósito compulsório", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente leu que o Banco Central elevou a alíquota do recolhimento compulsório sobre depósitos à vista. Qual é o efeito esperado dessa medida?", "alternativas": ["Ampliação da cobertura do FGC para os depósitos em conta corrente", "Aumento dos recursos disponíveis para empréstimos, estimulando o crédito", "Aumento automático da remuneração paga aos clientes em conta corrente", "Redução dos recursos que os bancos têm disponíveis para emprestar, contraindo a oferta de crédito e a liquidez da economia"], "correta": 3, "explicacao": "O compulsório é a parcela dos depósitos que os bancos devem manter recolhida no Banco Central. Ao elevar a alíquota, sobra menos dinheiro para emprestar, o que reduz o multiplicador bancário, o crédito e a liquidez. É um instrumento de política monetária e de estabilidade financeira."}, {"id": "M2D-085", "modulo": 2, "topico": "2.4.1.3 Boleto bancário", "dificuldade": "facil", "tipo": "mc", "enunciado": "Um cliente esqueceu de pagar um boleto e o vencimento passou há três dias. Ele pergunta se precisa ir até o banco emissor para pagar. A resposta correta é:", "alternativas": ["Não; após o vencimento o boleto é cancelado e o cliente deve pagar por Pix ao banco", "Não; o boleto registrado pode ser pago após o vencimento em qualquer instituição ou canal, com os encargos de atraso previstos, salvo se o emissor tiver estabelecido data-limite para pagamento", "Sim; boletos vencidos só podem ser pagos na agência do banco emissor", "Sim; e o pagamento só é aceito sem juros e multa, pois o atraso é inferior a cinco dias"], "correta": 1, "explicacao": "Com a Nova Plataforma de Cobrança, todos os boletos são registrados, o que permite o pagamento após o vencimento em qualquer instituição, com cálculo automático de juros e multa. O emissor pode, porém, fixar uma data-limite para pagamento após o vencimento."}, {"id": "M2D-086", "modulo": 2, "topico": "2.4.1.5.2 Pix: funcionamento (liquidação)", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Sobre a infraestrutura de funcionamento do Pix, assinale a afirmação correta:", "alternativas": ["As transações são liquidadas em tempo real, uma a uma, no Sistema de Pagamentos Instantâneos (SPI), operado pelo Banco Central, e as chaves ficam registradas no DICT", "A liquidação ocorre no dia útil seguinte, mas o valor é exibido imediatamente ao recebedor", "As chaves Pix são armazenadas apenas na instituição do usuário, sem base centralizada", "As transações são acumuladas e compensadas em lotes ao final de cada dia útil pela câmara de compensação de cheques"], "correta": 0, "explicacao": "O Pix é liquidado no SPI, sistema de liquidação bruta em tempo real operado pelo Banco Central, que movimenta contas específicas das instituições participantes. O DICT (Diretório de Identificadores de Contas Transacionais) é a base que associa cada chave à conta correspondente. Não há compensação em lotes."}, {"id": "M2D-087", "modulo": 2, "topico": "2.4.1.5.4 Pix na pessoa jurídica (pagamentos e recebimentos)", "dificuldade": "medio", "tipo": "mc", "enunciado": "O dono de uma loja quer usar Pix para receber de clientes e pagar fornecedores pela conta da empresa. Sobre as tarifas, a informação correta é:", "alternativas": ["A pessoa jurídica só pode ser tarifada no envio, nunca no recebimento", "A tarifa é paga pelo cliente da loja, que é quem inicia o pagamento", "A instituição pode cobrar tarifa da pessoa jurídica tanto no envio quanto no recebimento de Pix, conforme a tabela divulgada", "Pix é sempre gratuito, tanto para pessoas físicas quanto para jurídicas"], "correta": 2, "explicacao": "Diferentemente das pessoas físicas, as pessoas jurídicas podem ser tarifadas pelas instituições ao enviar e ao receber Pix, conforme as condições contratadas e a tabela de tarifas divulgada. O pagador pessoa física da compra não arca com essa tarifa."}, {"id": "M2D-088", "modulo": 2, "topico": "2.4.1.6.1 Tarifas: critérios de cobrança e direitos a gratuidade", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma cliente pessoa física tem conta corrente sem pacote de serviços e quer saber quais serviços são gratuitos por serem essenciais. Qual dos itens abaixo está entre os serviços essenciais gratuitos?", "alternativas": ["Fornecimento de cartão de débito e até quatro saques por mês, em guichê ou terminal de autoatendimento", "Envio de TED para contas de outras instituições sem limite de quantidade", "Saques ilimitados em qualquer canal e em qualquer banco", "Emissão de qualquer quantidade de folhas de cheque por mês"], "correta": 0, "explicacao": "Para conta de depósitos à vista de pessoa física, a regulamentação prevê serviços essenciais sem tarifa, como fornecimento de cartão de débito, até 4 saques por mês, até 2 transferências entre contas da própria instituição, até 2 extratos mensais, até 10 folhas de cheque (atendidos os requisitos) e consultas pela internet. Acima disso, a cobrança é permitida."}, {"id": "M2D-089", "modulo": 2, "topico": "2.4.1.7.1 Atendimento bancário: horários, filas e dias sem atendimento", "dificuldade": "medio", "tipo": "mc", "enunciado": "Sobre o horário de atendimento ao público nas agências bancárias, é correto afirmar que:", "alternativas": ["Cada agência pode abrir em qualquer horário, desde que funcione ao menos duas horas por dia", "As agências são obrigadas a funcionar das 8h às 18h, inclusive aos sábados", "O horário de atendimento é definido pelo cliente no momento da abertura da conta", "As agências devem manter atendimento ao público de, no mínimo, cinco horas diárias ininterruptas"], "correta": 3, "explicacao": "A regulamentação exige expediente mínimo de cinco horas diárias ininterruptas de atendimento ao público nas agências. Dentro desse limite, as instituições definem o horário, que deve ser divulgado. Sábados, domingos e feriados não são dias de atendimento ao público."}, {"id": "M2D-090", "modulo": 2, "topico": "2.4.2.2 Conta internacional: cobrança de IOF com diferentes alíquotas", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Um cliente percebeu que pagou alíquotas de IOF diferentes em operações de câmbio distintas (compra com cartão no exterior, compra de moeda em espécie e remessa para investimento) e que as alíquotas mudaram de um ano para outro. A explicação correta é:", "alternativas": ["O IOF-câmbio é definido livremente por cada banco, conforme o perfil do cliente", "O IOF-câmbio tem alíquotas definidas por tipo de operação e, por ser um imposto de caráter regulatório, pode ter suas alíquotas alteradas por decreto do Poder Executivo, com efeito imediato", "As alíquotas de IOF só podem ser alteradas por lei aprovada no Congresso, valendo apenas no ano seguinte", "O IOF-câmbio tem alíquota única, e as diferenças decorrem apenas do spread cobrado pelas instituições"], "correta": 1, "explicacao": "O IOF incide sobre operações de câmbio com alíquotas que variam conforme a natureza da operação. Por ter função extrafiscal (regulatória), suas alíquotas podem ser alteradas por decreto do Executivo, dentro dos limites legais, sem necessidade de aguardar o exercício seguinte. Por isso, é preciso consultar a alíquota vigente para cada tipo de operação."}, {"id": "M2D-091", "modulo": 2, "topico": "2.4.2.3 Investimento internacional: implicações no imposto de renda no Brasil", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Um residente no Brasil, pessoa física, mantém aplicações financeiras diretamente no exterior por meio de uma corretora estrangeira e obteve ganhos no ano. Pelas regras introduzidas pela Lei 14.754/2023, como esses rendimentos são tributados?", "alternativas": ["São isentos, pois os recursos estão fora do país", "Pela tabela regressiva da renda fixa, com retenção na fonte pela corretora estrangeira", "Pela alíquota de 15%, apurada anualmente na declaração de ajuste, sendo possível compensar perdas com ganhos de aplicações financeiras no exterior", "Pelo carnê-leão mensal, com alíquotas de até 27,5%, sem possibilidade de compensar perdas"], "correta": 2, "explicacao": "Desde 2024, os rendimentos de aplicações financeiras no exterior de pessoas físicas residentes são tributados a 15%, apurados anualmente e informados na declaração de ajuste anual, com possibilidade de compensação de perdas dentro das regras da lei. Não há retenção pela instituição estrangeira em favor da Receita Federal nem isenção pelo fato de os recursos estarem fora do país."}, {"id": "M2D-092", "modulo": 2, "topico": "2.4.3.1 Compra e venda de moeda: regras para correspondente bancário", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma agência de turismo atua como correspondente de um banco e vende moeda estrangeira a viajantes. Sobre essa atuação, é correto afirmar que:", "alternativas": ["O correspondente atua em nome e sob responsabilidade da instituição contratante, autorizada a operar câmbio, que responde pelas operações e deve garantir a identificação do cliente", "O correspondente pode fixar livremente as regras de identificação dos clientes, dispensando documentos", "A instituição contratante não responde por falhas do correspondente nas operações de câmbio", "O correspondente opera câmbio em nome próprio, sem vínculo com instituição autorizada"], "correta": 0, "explicacao": "Correspondentes são empresas contratadas por instituições autorizadas para prestar serviços em nome delas. No câmbio, o correspondente atua dentro dos limites da regulamentação e a instituição contratante permanece responsável pelas operações, pelo cumprimento das regras cambiais e de prevenção à lavagem de dinheiro e pela identificação do cliente."}, {"id": "M2D-093", "modulo": 2, "topico": "2.4.3.3 Definição e regras para recompra de moeda estrangeira", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma viajante voltou ao Brasil com US$ 500,00 em espécie e quer vendê-los a um banco. A cotação da instituição é de R$ 5,20 para compra e R$ 5,50 para venda. Desconsiderando tributos e tarifas, quanto ela receberá?", "alternativas": ["R$ 2.750,00", "R$ 2.600,00", "R$ 2.500,00", "R$ 2.675,00"], "correta": 1, "explicacao": "Na recompra, a instituição compra a moeda do cliente e aplica a sua taxa de compra: 500 × 5,20 = R$ 2.600,00. A taxa de venda (R$ 5,50) é a usada quando a instituição vende moeda ao cliente. A diferença entre as duas é o spread."}, {"id": "M2D-094", "modulo": 2, "topico": "2.5.1.1 Seguro de vida inteira", "dificuldade": "medio", "tipo": "mc", "enunciado": "Para uma mesma pessoa e o mesmo capital segurado, por que o prêmio do seguro de vida inteira tende a ser maior que o do seguro de vida temporário?", "alternativas": ["Porque o seguro de vida inteira só cobre morte acidental", "Porque o seguro temporário não admite indicação de beneficiários", "Porque, no vida inteira, o pagamento da indenização é certo (só não se sabe quando), enquanto no temporário só ocorre se o falecimento acontecer dentro do prazo", "Porque o seguro de vida inteira paga IR sobre a indenização e o temporário não"], "correta": 2, "explicacao": "No seguro de vida inteira, a seguradora sabe que pagará a indenização, pois a cobertura dura a vida toda; a incerteza é apenas sobre o momento. No temporário, se o segurado sobreviver ao prazo, nada é pago. Por isso o custo do vida inteira é maior."}, {"id": "M2D-095", "modulo": 2, "topico": "2.5.1.3 Seguro de vida tradicional", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente quer saber como funciona o seguro de vida tradicional em relação à herança e ao Imposto de Renda. Assinale a afirmação correta:", "alternativas": ["A indenização entra no inventário e é dividida entre os herdeiros conforme a lei", "O seguro tradicional permite resgatar os prêmios pagos a qualquer momento, com correção", "A indenização sofre IR de 15% retido na fonte, como em um investimento", "O capital segurado é pago diretamente aos beneficiários, não é considerado herança, não responde por dívidas do segurado e a indenização não sofre IR"], "correta": 3, "explicacao": "Pelo Código Civil, no seguro de vida o capital estipulado não está sujeito às dívidas do segurado nem é considerado herança, sendo pago diretamente aos beneficiários. A indenização por morte não é tributada pelo IR. O seguro tradicional, de natureza de proteção, em regra não prevê resgate dos prêmios."}, {"id": "M2D-096", "modulo": 2, "topico": "2.5.2.1 Seguro de automóveis", "dificuldade": "facil", "tipo": "mc", "enunciado": "Uma cliente bateu o carro e o conserto custou R$ 4.000,00. A apólice prevê franquia de R$ 2.500,00. Quanto a seguradora pagará pelo reparo?", "alternativas": ["R$ 4.000,00", "R$ 6.500,00", "R$ 1.500,00", "R$ 2.500,00"], "correta": 2, "explicacao": "A franquia é a participação obrigatória do segurado nos prejuízos de sinistros parciais. A seguradora paga o valor que exceder a franquia: 4.000 − 2.500 = R$ 1.500,00. Se o prejuízo fosse menor que a franquia, não haveria indenização."}, {"id": "M2D-097", "modulo": 2, "topico": "2.5.2.2 Seguro residencial", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Uma casa com conteúdo cujo valor em risco é de R$ 500.000,00 foi segurada por apenas R$ 300.000,00, em apólice com cláusula de rateio proporcional. Um incêndio causou prejuízo de R$ 100.000,00. Desconsiderando franquia, a indenização será de:", "alternativas": ["R$ 100.000,00", "R$ 40.000,00", "R$ 30.000,00", "R$ 60.000,00"], "correta": 3, "explicacao": "Com cláusula de rateio, se o valor segurado for inferior ao valor em risco, a seguradora indeniza na mesma proporção: 300.000 / 500.000 = 60%; 60% × 100.000 = R$ 60.000,00. Em uma apólice a primeiro risco absoluto, sem rateio, o prejuízo seria indenizado até o limite segurado (R$ 100.000,00). Por isso, é importante segurar pelo valor correto."}, {"id": "M2D-098", "modulo": 2, "topico": "2.5.2.3 Seguro prestamista", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um banco informa a um cliente que o empréstimo só será liberado se ele contratar o seguro prestamista da seguradora do próprio conglomerado. Qual é a análise correta dessa conduta?", "alternativas": ["É irregular, pois configura venda casada; o cliente pode recusar o seguro ou, se o seguro for exigido como garantia, escolher livremente a seguradora", "É irregular apenas se o valor do prêmio for superior a 10% do empréstimo", "É regular, desde que o prêmio do seguro seja incluído no valor financiado", "É regular, pois o seguro prestamista é obrigatório em todas as operações de crédito"], "correta": 0, "explicacao": "Condicionar a concessão do crédito à contratação de um produto com seguradora indicada pelo banco é venda casada, vedada pelo Código de Defesa do Consumidor. O seguro pode ser oferecido e até exigido como garantia em certas operações, mas o cliente tem o direito de escolher a seguradora."}, {"id": "M3A-001", "modulo": 3, "topico": "3.1.1 Faixa etária versus exposição ao risco versus produtos orientados ao perfil", "dificuldade": "facil", "tipo": "mc", "enunciado": "Rafael tem 26 anos, é solteiro, não tem dependentes, possui renda estável e já formou sua reserva de emergência. Ele quer começar a investir para a aposentadoria, prevista para daqui a cerca de 35 anos, e diz tolerar bem oscilações de curto prazo. Considerando apenas essas informações, a orientação mais coerente é:", "alternativas": ["Evitar qualquer ativo de renda variável até que ele complete 40 anos, quando terá patrimônio suficiente para suportar perdas", "Admitir uma parcela relevante da carteira em ativos de maior risco e potencial de retorno, como renda variável, já que o horizonte longo permite atravessar oscilações, sempre respeitando o resultado do suitability", "Concentrar os recursos em caderneta de poupança, pois pessoas jovens têm pouco patrimônio e não devem correr riscos", "Classificá-lo automaticamente como agressivo por causa da idade, dispensando a aplicação do questionário de suitability"], "correta": 1, "explicacao": "Quanto mais longo o horizonte e maior a capacidade de suportar perdas, maior tende a ser a exposição adequada a ativos de risco, pois há tempo para recuperar quedas. Ainda assim, a idade é apenas um dos fatores: o perfil deve ser apurado pelo processo de suitability, nunca atribuído automaticamente pela faixa etária."}, {"id": "M3A-002", "modulo": 3, "topico": "3.1.1 Faixa etária versus exposição ao risco versus produtos orientados ao perfil", "dificuldade": "medio", "tipo": "mc", "enunciado": "Dona Marta, 70 anos, é aposentada e recebe aluguéis que cobrem com folga todas as suas despesas. Tem patrimônio financeiro elevado, investe em ações há 30 anos e declara que parte dos recursos será destinada aos netos daqui a 20 anos. Sobre a exposição a risco dessa cliente, é correto afirmar que:", "alternativas": ["A regra prática de ter em renda
