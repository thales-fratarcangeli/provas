 com integridade, lealdade e transparência, colocando o interesse do cliente acima do seu", "Recomendar o produto mais caro, pois a remuneração do profissional também é um interesse legítimo", "Oferecer os dois produtos sem explicar diferenças de custo, deixando a decisão para o cliente"], "correta": 1, "explicacao": "Os princípios éticos do código da ANBIMA envolvem, entre outros, integridade, lealdade aos interesses do cliente, transparência e diligência. Recomendar um produto inadequado por interesse próprio viola esses princípios; omitir diferenças de custo também fere a transparência."}, {"id": "M3A-081", "modulo": 3, "topico": "3.4.1.1 Os princípios éticos", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma gerente comenta, em um almoço com amigos, detalhes dos investimentos e do patrimônio de um cliente famoso da agência. Essa conduta viola principalmente o princípio ético de:", "alternativas": ["Equidade de tratamento entre clientes", "Diligência na execução de ordens", "Confidencialidade (sigilo) das informações dos clientes", "Competência técnica"], "correta": 2, "explicacao": "Informações sobre clientes obtidas no exercício da profissão são confidenciais e só podem ser reveladas nas hipóteses legais. Além de violar o código de ética, a conduta pode configurar quebra de sigilo bancário e infração à LGPD."}, {"id": "M3A-082", "modulo": 3, "topico": "3.4.1.2 Regras gerais de conduta para pessoas candidatas", "dificuldade": "facil", "tipo": "mc", "enunciado": "Durante a prova de certificação da ANBIMA, um candidato fotografa algumas questões para compartilhá-las em um grupo de estudos. Sobre essa conduta, é correto afirmar que:", "alternativas": ["Não é regulada, pois as regras da ANBIMA valem apenas para profissionais já certificados", "É permitida, desde que o compartilhamento ocorra só depois da prova", "Só é proibida se o candidato for aprovado", "Viola as regras de conduta para candidatos, que devem preservar o sigilo do conteúdo das provas, podendo gerar cancelamento do exame e impedimento de realizar novas provas"], "correta": 3, "explicacao": "As regras de conduta também alcançam as pessoas candidatas: é vedado reproduzir ou divulgar o conteúdo das provas, usar meios fraudulentos ou se fazer substituir por outra pessoa. Infrações podem levar a sanções como cancelamento do resultado e impedimento temporário de fazer novas provas."}, {"id": "M3A-083", "modulo": 3, "topico": "3.4.1.3 Regras gerais de conduta para profissionais com certificação", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma profissional teve a certificação CPA vencida por não ter feito a atualização no prazo, mas continua informando a clientes e em seu perfil profissional que é “certificada ANBIMA”. Essa conduta:", "alternativas": ["Viola as regras de conduta, pois o profissional não pode se apresentar como certificado se a certificação não estiver válida, o que induz clientes a erro", "É permitida desde que ela pretenda atualizar a certificação em breve", "Só seria irregular se ela recebesse remuneração variável", "É aceitável, pois ela já foi aprovada no exame alguma vez"], "correta": 0, "explicacao": "Profissionais devem manter a certificação válida e usá-la apenas nos termos permitidos. Apresentar-se como certificado com certificação vencida é informação falsa ao mercado e aos clientes, sujeita a sanções."}, {"id": "M3A-084", "modulo": 3, "topico": "3.4.1.3 Regras gerais de conduta para profissionais com certificação", "dificuldade": "facil", "tipo": "mc", "enunciado": "Entre as condutas abaixo, a que está de acordo com as regras gerais para profissionais certificados é:", "alternativas": ["Usar o nome da ANBIMA para dar credibilidade a produtos que a entidade não avaliou", "Recomendar investimentos com base em boatos, desde que tenham potencial de alta", "Manter-se atualizado sobre produtos e normas, cumprir a regulamentação e as políticas da instituição e tratar os clientes com transparência e respeito", "Garantir rentabilidade futura a clientes para facilitar a captação"], "correta": 2, "explicacao": "Profissionais certificados devem atuar com competência, atualização constante, cumprimento das normas e transparência. Garantir rentabilidade, usar indevidamente o nome da ANBIMA ou se basear em boatos violam as regras de conduta."}, {"id": "M3A-085", "modulo": 3, "topico": "3.4.1.4 Deveres profissionais", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um gerente recebe de um cliente uma ordem de resgate e, por estar ocupado, deixa para executá-la no dia seguinte sem avisar, o que causa prejuízo ao cliente. O dever profissional mais diretamente violado é o de:", "alternativas": ["Lealdade à instituição, que tem prioridade sobre o cliente", "Diligência, que exige cuidado, zelo e tempestividade na execução das atividades e no atendimento aos interesses do cliente", "Independência, pois o gerente tem vínculo com a instituição", "Sigilo, pois a ordem foi recebida por telefone"], "correta": 1, "explicacao": "O dever de diligência exige que o profissional atue com o cuidado que um profissional ativo e probo empregaria na condução dos próprios negócios, inclusive executando ordens com tempestividade. Atrasar a execução sem justificativa e sem comunicar o cliente viola esse dever."}, {"id": "M3A-086", "modulo": 3, "topico": "3.4.2.1 Objetivos do código ANBIMA (distribuição)", "dificuldade": "medio", "tipo": "mc", "enunciado": "O Código ANBIMA de Distribuição de Produtos de Investimento tem como objetivo:", "alternativas": ["Substituir a regulamentação da CVM e do Banco Central sobre distribuição", "Fixar as taxas de juros que podem ser oferecidas pelas instituições", "Estabelecer padrões e procedimentos para a distribuição de produtos de investimento, buscando elevar a qualidade e a transparência, a concorrência leal e a adequação dos produtos às necessidades e ao perfil dos investidores", "Garantir aos investidores o ressarcimento de perdas em produtos de investimento"], "correta": 2, "explicacao": "Os códigos da ANBIMA são autorregulação: complementam a regulamentação oficial com padrões de boas práticas. O de distribuição busca elevar a qualidade da distribuição, a transparência, a concorrência leal e a adequação ao perfil. A ANBIMA não fixa taxas nem garante perdas."}, {"id": "M3A-087", "modulo": 3, "topico": "3.4.2.2 Documentação e registro de informações da clientela", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente decide aplicar em um produto inadequado ao seu perfil e assina a declaração de ciência da inadequação. Sobre a documentação desse processo, é correto afirmar que:", "alternativas": ["A declaração pode ser descartada após a aplicação, pois o cliente já concordou", "Basta um registro verbal do gerente, sem necessidade de guardar documentos", "A documentação só é obrigatória para clientes que perderam dinheiro", "A instituição deve manter registro do perfil, do alerta de inadequação e da declaração do cliente, para comprovar o cumprimento das regras de suitability"], "correta": 3, "explicacao": "As regras de suitability exigem que a instituição mantenha documentação que comprove o processo: informações e perfil do cliente, alertas emitidos e declarações de ciência. Esses registros protegem o cliente, a instituição e o profissional e podem ser verificados pelos reguladores e pela autorregulação."}, {"id": "M3A-088", "modulo": 3, "topico": "3.4.2.3 Ferramentas e metodologias de avaliação de suitability", "dificuldade": "medio", "tipo": "mc", "enunciado": "Sobre as ferramentas e metodologias de avaliação de suitability usadas pelas instituições, é correto afirmar que:", "alternativas": ["A instituição deve adotar metodologia formal e documentada que colete informações sobre objetivos, situação financeira e conhecimento do cliente, defina perfis e classifique os produtos por risco, permitindo comparar cliente e produto", "O questionário pode ser preenchido pelo gerente sem a participação do cliente, para agilizar o atendimento", "A metodologia deve classificar apenas o cliente, sendo desnecessário classificar os produtos", "Cada gerente pode criar seu próprio questionário, desde que o cliente concorde"], "correta": 0, "explicacao": "A avaliação de suitability depende de dois lados: o perfil do cliente, apurado com informações dele próprio, e a classificação de risco dos produtos, segundo metodologia da instituição. Só assim é possível verificar a adequação. Preencher o questionário pelo cliente compromete a fidedignidade do perfil."}, {"id": "M3A-089", "modulo": 3, "topico": "3.4.2.4 Adequação dos produtos ao perfil da clientela", "dificuldade": "facil", "tipo": "mc", "enunciado": "Uma gerente tem meta de captação em um fundo de ações e percebe que boa parte de seus clientes é conservadora. A conduta correta é:", "alternativas": ["Recomendar o fundo a conservadores apenas em valores pequenos, o que dispensa a análise de adequação", "Recomendar o fundo apenas aos clientes cujo perfil seja compatível com o risco do produto", "Recomendar o fundo a todos os clientes, pois a meta é da agência", "Pedir aos clientes que refaçam o questionário marcando respostas mais arrojadas"], "correta": 1, "explicacao": "A recomendação deve respeitar o perfil apurado; metas comerciais não justificam recomendar produtos inadequados. Induzir o cliente a alterar respostas é fraude ao processo de suitability, e o valor da aplicação não dispensa a verificação de adequação."}, {"id": "M3A-090", "modulo": 3, "topico": "3.4.2.4 Adequação dos produtos ao perfil da clientela", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente com perfil desatualizado (o último questionário foi preenchido há mais de dois anos) pede ao gerente uma recomendação de investimento. A conduta adequada é:", "alternativas": ["Recomendar apenas produtos de alto risco, pois a situação do cliente pode ter melhorado", "Atualizar o perfil antes de fazer recomendações; se o cliente quiser aplicar por iniciativa própria sem atualizá-lo, a instituição deve alertá-lo e obter declaração expressa de ciência", "Usar o perfil antigo, pois o cliente não informou mudanças", "Recusar qualquer aplicação até que o cliente apresente comprovante de renda"], "correta": 1, "explicacao": "Com perfil desatualizado, a instituição não deve recomendar produtos. A regulamentação exige atualização periódica do perfil (em intervalos não superiores a 24 meses) e, se o cliente aplicar por conta própria sem perfil ou com perfil desatualizado, ele deve ser alertado e assinar declaração de ciência."}, {"id": "M3A-091", "modulo": 3, "topico": "3.4.2.5 Adequação dos produtos ao objetivo da clientela", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma cliente de perfil arrojado informa que os R$ 100.000,00 que quer aplicar serão usados para dar entrada em um imóvel em quatro meses. O gerente deve:", "alternativas": ["Recomendar um título prefixado de dez anos para aproveitar taxas altas", "Recomendar um fundo de ações, pois o perfil é arrojado", "Recomendar uma aplicação compatível com o objetivo e o prazo, de baixo risco e com liquidez ou vencimento adequados, ainda que o perfil admita mais risco", "Recomendar previdência privada, pela vantagem tributária"], "correta": 2, "explicacao": "A adequação considera o perfil e também o objetivo e o horizonte de cada aplicação. Um perfil arrojado não torna adequado expor a renda variável um recurso que tem destino certo em quatro meses, pois uma queda poderia inviabilizar o objetivo."}, {"id": "M3A-092", "modulo": 3, "topico": "3.4.2.6 Monitoramento contínuo da suitability", "dificuldade": "medio", "tipo": "mc", "enunciado": "O monitoramento contínuo do suitability envolve:", "alternativas": ["Acompanhar a carteira e o perfil do cliente, atualizar o perfil periodicamente e diante de mudanças relevantes, identificar desenquadramentos e tratá-los com o cliente", "Ajustar o perfil do cliente sempre que a carteira ficar desenquadrada, para que volte a ficar adequada", "Revisar o perfil apenas quando o cliente reclamar de perdas", "Aplicar o questionário apenas na abertura da conta, sem revisões posteriores"], "correta": 0, "explicacao": "Suitability não é um evento único: perfil e carteira mudam com o tempo. A instituição deve atualizar periodicamente o perfil, monitorar a adequação da carteira e agir quando houver desenquadramento. Mudar o perfil para acomodar a carteira inverte o processo."}, {"id": "M3A-093", "modulo": 3, "topico": "3.4.2.7 Comunicação clara e transparente com a clientela", "dificuldade": "facil", "tipo": "mc", "enunciado": "Ao apresentar um fundo a um cliente, um gerente afirma: “Este fundo rendeu 18% no ano passado, então é garantido que vai render pelo menos isso de novo”. Essa comunicação é inadequada porque:", "alternativas": ["Não é permitido mencionar rentabilidade de fundos para pessoas físicas", "O gerente deveria ter informado a rentabilidade dos últimos cinco anos, que é sempre maior", "O gerente deveria ter dito que a rentabilidade é garantida pelo FGC", "Rentabilidade passada não é garantia de rentabilidade futura, e o profissional não deve prometer ou garantir rentabilidade em produtos que não a garantem"], "correta": 3, "explicacao": "Comunicação clara e transparente exige não induzir o cliente a erro. Rentabilidade passada não assegura resultados futuros, e fundos não têm rentabilidade garantida nem cobertura do FGC. Promessas desse tipo violam as regras de comunicação e de conduta."}, {"id": "M3A-094", "modulo": 3, "topico": "3.4.2.7 Comunicação clara e transparente com a clientela", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente leigo pergunta o que é “marcação a mercado” do título público que comprou. A resposta mais alinhada à comunicação clara e transparente é:", "alternativas": ["Explicar, em linguagem simples, que o valor do título é atualizado diariamente conforme as taxas de mercado e que, se ele vender antes do vencimento, poderá ter ganho ou perda em relação ao contratado; mantendo até o vencimento, recebe a taxa combinada", "Afirmar que títulos públicos nunca oscilam porque são garantidos pelo governo", "Dizer que isso não afeta o cliente e mudar de assunto", "Usar termos técnicos detalhados, pois o cliente tem obrigação de conhecer o mercado"], "correta": 0, "explicacao": "Comunicação transparente é adaptar a linguagem ao cliente sem omitir riscos relevantes. A marcação a mercado pode gerar perdas se o título for vendido antes do vencimento, mesmo sendo um título de baixo risco de crédito; isso precisa ser explicado de forma acessível."}, {"id": "M3A-095", "modulo": 3, "topico": "3.4.2.8 Gestão de conflitos de interesses (código de distribuição)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma instituição distribuidora recebe remuneração das gestoras pelos fundos de terceiros que distribui. Do ponto de vista da gestão de conflitos de interesse na distribuição, a instituição deve:", "alternativas": ["Recomendar apenas os fundos que pagam mais, pois é sua fonte de receita", "Proibir a distribuição de qualquer fundo de terceiros", "Identificar o conflito, dar transparência ao cliente sobre a remuneração recebida e adotar controles para que a recomendação se baseie na adequação ao cliente e não na remuneração", "Ocultar essa remuneração, por se tratar de segredo comercial"], "correta": 2, "explicacao": "Conflitos de interesse na distribuição devem ser identificados, mitigados e divulgados. A transparência sobre a remuneração do distribuidor permite ao cliente avaliar a recomendação, e controles internos devem assegurar que o critério de recomendação seja o interesse e o perfil do cliente."}, {"id": "M3A-096", "modulo": 3, "topico": "3.4.3.1.1 Escuta ativa", "dificuldade": "facil", "tipo": "mc", "enunciado": "Uma cliente chega à agência dizendo que está insegura com seus investimentos depois de ler notícias sobre a bolsa. A atitude que melhor demonstra escuta ativa é:", "alternativas": ["Afirmar que notícias não importam e que ela não deve se preocupar", "Ouvir com atenção, fazer perguntas abertas para entender as preocupações e confirmar o entendimento antes de propor qualquer solução", "Interromper logo para apresentar o novo fundo da campanha", "Pedir que ela leia os materiais do site e volte depois"], "correta": 1, "explicacao": "Escuta ativa é ouvir com atenção, demonstrar interesse, fazer perguntas abertas e parafrasear para confirmar o entendimento. Só depois de compreender a real preocupação o profissional consegue propor uma solução adequada."}, {"id": "M3A-097", "modulo": 3, "topico": "3.4.3.1.2 Personalização do atendimento", "dificuldade": "facil", "tipo": "mc", "enunciado": "Um gerente atende dois clientes com o mesmo valor disponível para investir: um jovem empreendedor e uma aposentada que precisa de renda mensal. A conduta que reflete a personalização do atendimento é:", "alternativas": ["Atender o cliente mais jovem com prioridade, pois tem mais potencial de negócios", "Enviar a ambos um e-mail padrão com os produtos da semana", "Oferecer exatamente os mesmos produtos, pois o valor investido é igual", "Adaptar a linguagem, as soluções e a frequência de contato às necessidades, objetivos e perfil de cada cliente"], "correta": 3, "explicacao": "Personalizar é considerar as características, objetivos, perfil e preferências de cada cliente, e não o valor disponível isoladamente. Soluções padronizadas ignoram necessidades diferentes, como a necessidade de renda da aposentada."}, {"id": "M3A-098", "modulo": 3, "topico": "3.4.3.1.3 Solução proativa de problemas", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um gerente percebe que um título de um cliente vence na próxima semana e que o cliente costuma esquecer de reaplicar, deixando o dinheiro parado na conta corrente. A conduta que exemplifica a solução proativa de problemas é:", "alternativas": ["Transferir o valor para a poupança sem autorização, pois é uma aplicação segura", "Reaplicar automaticamente o valor em qualquer produto, sem consultar o cliente", "Aguardar o cliente perceber e entrar em contato", "Contatar o cliente antes do vencimento, lembrá-lo do evento e apresentar alternativas adequadas ao perfil e objetivos para decisão dele"], "correta": 3, "explicacao": "Atendimento proativo antecipa problemas e oportunidades, mas sem substituir a decisão do cliente. Aplicar recursos sem autorização é irregular, mesmo que em produto conservador."}, {"id": "M3A-099", "modulo": 3, "topico": "3.4.3.1.4 Educação continuada e conhecimento dos produtos e serviços", "dificuldade": "facil", "tipo": "mc", "enunciado": "Um cliente pergunta a um gerente sobre um produto recém-lançado pela instituição, e o gerente não conhece suas características. A postura mais adequada é:", "alternativas": ["Desencorajar o cliente, dizendo que produtos novos sempre são arriscados", "Dizer que todos os produtos novos são parecidos com a poupança", "Reconhecer que precisa confirmar as informações, buscar o material oficial e retornar ao cliente, e manter-se atualizado sobre produtos e serviços", "Inventar uma resposta aproximada para não perder a venda"], "correta": 2, "explicacao": "O profissional deve conhecer os produtos que oferece e investir em educação continuada. Diante de uma dúvida, a postura correta é buscar a informação correta e retornar, em vez de improvisar respostas que podem induzir o cliente a erro."}, {"id": "M3A-100", "modulo": 3, "topico": "3.4.3.1.5 Gerenciamento de expectativas", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma cliente conservadora quer aplicar em renda fixa e diz esperar “dobrar o dinheiro em um ano, sem nenhum risco”. A conduta adequada de gerenciamento de expectativas é:", "alternativas": ["Concordar com a expectativa para não perder a cliente", "Explicar de forma realista o retorno esperado de aplicações de baixo risco e a relação entre risco e retorno, alinhando a expectativa ao que o produto pode entregar", "Prometer que vai buscar o resultado com produtos de alto risco sem informar o risco", "Dizer que o resultado depende só da sorte"], "correta": 1, "explicacao": "Gerenciar expectativas é alinhar o que o cliente espera ao que o produto realisticamente pode oferecer. Expectativas irreais levam a frustração e, muitas vezes, a decisões inadequadas; a relação risco-retorno deve ser explicada com clareza."}, {"id": "M3A-101", "modulo": 3, "topico": "3.4.3.2 Ética e responsabilidade no atendimento", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente idoso, com sinais de dificuldade de compreensão, pede a um gerente que aplique todo o seu dinheiro em um produto complexo que ouviu falar na televisão. A conduta mais ética e responsável é:", "alternativas": ["Explicar com calma e de forma acessível as características e riscos do produto, verificar a adequação ao perfil e aos objetivos e, se houver inadequação, alertar formalmente, sem se aproveitar da vulnerabilidade do cliente", "Executar a ordem imediatamente, pois o cliente é maior de idade", "Executar a ordem e oferecer outros produtos complexos para aumentar a receita", "Recusar o atendimento e encerrar o relacionamento"], "correta": 0, "explicacao": "Ética no atendimento envolve atenção especial a clientes em situação de vulnerabilidade, explicações acessíveis e respeito ao suitability. O profissional não pode se aproveitar da dificuldade de compreensão para vender produtos inadequados."}, {"id": "M3A-102", "modulo": 3, "topico": "3.4.3.3.1 Conflitos de interesses – relações pessoais e familiares", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um gerente descobre que a empresa da qual seu irmão é sócio está emitindo debêntures distribuídas pela instituição em que trabalha, e pretende recomendá-las a seus clientes. A conduta adequada é:", "alternativas": ["Comprar as debêntures em nome dos clientes, para que eles se beneficiem do conhecimento que ele tem da empresa", "Comunicar a situação à instituição (compliance), seguir as políticas de conflito de interesses e, se for o caso, abster-se de recomendar ou dar transparência ao cliente sobre o vínculo", "Recomendar as debêntures apenas a clientes de perfil arrojado, o que elimina o conflito", "Recomendar as debêntures livremente, pois o parentesco não afeta a qualidade do papel"], "correta": 1, "explicacao": "Relações pessoais e familiares podem comprometer a imparcialidade. A conduta correta é reportar o potencial conflito, seguir as políticas da instituição e, conforme o caso, abster-se ou dar transparência. Restringir a recomendação a determinado perfil não elimina o conflito."}, {"id": "M3A-103", "modulo": 3, "topico": "3.4.3.3.2 Conflitos de interesses – benefícios e incentivos", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um gestor de fundos oferece a um gerente de banco uma viagem de luxo com acompanhante caso ele direcione clientes para os fundos da gestora. Do ponto de vista de conflitos de interesses, o gerente deve:", "alternativas": ["Aceitar e recomendar o fundo apenas a clientes que não perguntarem sobre isso", "Aceitar, pois benefícios oferecidos por terceiros não afetam a recomendação", "Recusar o benefício e reportá-lo conforme as políticas da instituição, pois incentivos desse tipo comprometem a independência da recomendação", "Aceitar, desde que divida o benefício com outros colegas"], "correta": 2, "explicacao": "Presentes e benefícios relevantes vinculados à recomendação de produtos criam conflito de interesses e comprometem a imparcialidade. Políticas internas normalmente limitam o recebimento de presentes e exigem comunicação; o caso descrito deve ser recusado e reportado."}, {"id": "M3A-104", "modulo": 3, "topico": "3.4.3.3.2 Conflitos de interesses – benefícios e incentivos", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Uma instituição paga bônus maiores aos gerentes que vendem produtos próprios com maior margem. Sobre esse incentivo, é correto afirmar que:", "alternativas": ["Gera conflito de interesses, pois pode estimular recomendações baseadas na remuneração e não na adequação; deve ser identificado, mitigado com controles (por exemplo, monitoramento de adequação e metas qualitativas) e divulgado conforme as regras aplicáveis", "Incentivos de remuneração são proibidos em qualquer circunstância", "O conflito desaparece se o gerente não souber qual produto tem maior margem", "Não gera conflito, pois os produtos próprios são sempre os melhores para o cliente"], "correta": 0, "explicacao": "Remuneração variável vinculada a produtos específicos é um conflito clássico. Não é necessariamente proibida, mas deve ser gerida: identificada, mitigada por controles como monitoramento de suitability e critérios qualitativos, e informada ao cliente quando exigido."}, {"id": "M3A-105", "modulo": 3, "topico": "3.4.3.3.3.1 Medidas de gestão de conflitos – políticas e procedimentos claros", "dificuldade": "medio", "tipo": "mc", "enunciado": "Para reduzir conflitos de interesses, uma instituição divulga uma política escrita sobre presentes, investimentos pessoais e relações com fornecedores, aplica treinamento anual obrigatório a todos os funcionários e submete casos duvidosos a um comitê de ética e compliance. Essas iniciativas correspondem a:", "alternativas": ["Práticas proibidas pela autorregulação, por limitarem a liberdade dos funcionários", "Procedimentos de PLDFT exclusivamente", "Mecanismos de suitability para classificação dos clientes", "Medidas de gestão de conflitos de interesses baseadas em políticas e procedimentos claros, treinamento e educação e governança por comitês de ética e compliance"], "correta": 3, "explicacao": "Políticas claras, treinamento e educação contínuos e comitês de ética e compliance estão entre as principais medidas de gestão de conflitos de interesses: definem regras, garantem que todos as conheçam e criam instâncias para analisar casos duvidosos."}, {"id": "M3A-106", "modulo": 3, "topico": "3.4.3.3.3.1.3 Segregação de funções", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma instituição separa física e logicamente as áreas de gestão de recursos de terceiros e de tesouraria (que opera recursos próprios), com controle de acesso a sistemas e informações. Essa medida de gestão de conflitos é chamada de:", "alternativas": ["Segregação de funções (ou de atividades), conhecida também como “chinese wall”", "Divulgação obrigatória", "Educação continuada", "Relatório de transparência"], "correta": 0, "explicacao": "A segregação de funções separa atividades potencialmente conflitantes, impedindo o fluxo indevido de informações entre elas. É exemplo clássico separar a gestão de recursos de terceiros da tesouraria proprietária, evitando que uma use informações da outra em prejuízo de clientes."}, {"id": "M3A-107", "modulo": 3, "topico": "3.4.3.3.3.1.2 Divulgação obrigatória", "dificuldade": "facil", "tipo": "mc", "enunciado": "Uma das medidas de gestão de conflitos de interesses consiste em informar ao cliente, de forma clara, a existência de conflitos que não podem ser eliminados, como a remuneração que o distribuidor recebe pelo produto. Essa medida é a:", "alternativas": ["Revisão e monitoramento contínuos", "Divulgação obrigatória (disclosure)", "Proibição de atividades específicas", "Segregação de funções"], "correta": 1, "explicacao": "A divulgação obrigatória dá transparência ao cliente sobre conflitos existentes, permitindo que ele avalie a recomendação recebida. Ela não elimina o conflito, mas é complementar às outras medidas, como segregação e monitoramento."}, {"id": "M3A-108", "modulo": 3, "topico": "3.4.3.3.3.1.6 Proibição de atividades específicas", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma instituição proíbe que seus operadores negociem, para a própria carteira pessoal, ativos sobre os quais tenham recebido ordens de clientes no mesmo dia, e exige que publiquem periodicamente um relatório com as medidas de conflito adotadas. Essas medidas correspondem, respectivamente, a:", "alternativas": ["Revisão e monitoramento contínuos e escuta ativa", "Segregação de funções e treinamento", "Comitê de ética e divulgação obrigatória", "Proibição de atividades específicas e relatórios de transparência"], "correta": 3, "explicacao": "Proibir determinadas atividades é a forma mais direta de eliminar conflitos de alto risco, como operações pessoais que poderiam se antecipar às ordens dos clientes. Relatórios de transparência comunicam ao público as políticas e os resultados da gestão de conflitos."}, {"id": "M3A-109", "modulo": 3, "topico": "3.4.3.3.3.1.4 Revisão e monitoramento contínuos", "dificuldade": "medio", "tipo": "mc", "enunciado": "A área de compliance de uma corretora analisa mensalmente as operações pessoais dos funcionários e compara as recomendações dos gerentes com o perfil dos clientes, atualizando as políticas quando encontra falhas. Essa prática é exemplo de:", "alternativas": ["Divulgação obrigatória", "Personalização do atendimento", "Revisão e monitoramento contínuos das medidas de gestão de conflitos", "Proibição de atividades específicas"], "correta": 2, "explicacao": "Políticas só são efetivas se forem acompanhadas. A revisão e o monitoramento contínuos verificam o cumprimento das regras, detectam desvios e permitem aperfeiçoar os controles ao longo do tempo."}, {"id": "M3A-110", "modulo": 3, "topico": "3.4.4.1 Riscos operacionais", "dificuldade": "facil", "tipo": "mc", "enunciado": "Um operador digita uma ordem de compra de 10.000 ações quando o cliente havia pedido 1.000, causando prejuízo. Esse evento é exemplo de risco:", "alternativas": ["De mercado", "Operacional", "De imagem", "Regulatório"], "correta": 1, "explicacao": "Risco operacional é a possibilidade de perdas decorrentes de falhas em processos, pessoas, sistemas ou de eventos externos. Erro de digitação de ordem é falha humana em processo, caso típico de risco operacional."}, {"id": "M3A-111", "modulo": 3, "topico": "3.4.4.2 Riscos regulatórios", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma instituição deixa de atualizar seus procedimentos após a entrada em vigor de uma nova norma da CVM e, em uma fiscalização, é multada por descumpri-la. Esse evento caracteriza principalmente o risco:", "alternativas": ["De crédito", "De liquidez", "Operacional, pois toda multa é falha de sistema", "Regulatório, decorrente de mudanças ou do descumprimento de normas e da possibilidade de sanções de reguladores e autorreguladores"], "correta": 3, "explicacao": "O risco regulatório (ou de conformidade) envolve a possibilidade de sanções e perdas pelo descumprimento de normas ou por mudanças regulatórias às quais a instituição não se adapta. A atividade de compliance existe justamente para mitigá-lo."}, {"id": "M3A-112", "modulo": 3, "topico": "3.4.4.3 Riscos legais", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma instituição perde uma ação judicial porque o contrato com um cliente tinha cláusulas mal redigidas e não pôde exigir o cumprimento de uma obrigação. Esse evento é exemplo de risco:", "alternativas": ["Legal, associado a contratos inadequados, inexequíveis ou a ações judiciais", "De imagem", "Operacional de sistemas", "De mercado"], "correta": 0, "explicacao": "O risco legal é a possibilidade de perdas por contratos mal elaborados ou inexequíveis, pela interpretação desfavorável de leis e por processos judiciais. Ele se diferencia do risco regulatório, ligado a normas de reguladores e sanções administrativas."}, {"id": "M3A-113", "modulo": 3, "topico": "3.4.4.4 Riscos de imagem", "dificuldade": "facil", "tipo": "mc", "enunciado": "Após um gerente ser filmado pressionando clientes idosos a comprar produtos inadequados, o vídeo viraliza e muitos clientes encerram suas contas na instituição. Esse efeito ilustra o risco:", "alternativas": ["De crédito", "Sistêmico", "De imagem (reputacional)", "De liquidez"], "correta": 2, "explicacao": "O risco de imagem ou reputacional é a possibilidade de perdas decorrentes de danos à reputação da instituição, como perda de clientes e de negócios. Condutas antiéticas de profissionais estão entre as principais fontes desse risco."}, {"id": "M3A-114", "modulo": 3, "topico": "3.4.4 Riscos associados à atividade profissional", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Um gerente usa planilhas pessoais, fora dos sistemas oficiais, para controlar ordens de clientes. Uma falha na planilha faz ordens deixarem de ser executadas; clientes processam a instituição; a CVM aplica multa por deficiência de controles; e o caso sai na imprensa. Sobre os riscos envolvidos, é correto afirmar que:", "alternativas": ["Trata-se apenas de risco operacional, pois tudo começou com uma planilha", "Trata-se apenas de risco de imagem, pois o caso foi divulgado", "Não há risco para a instituição, pois o erro foi individual do gerente", "Os riscos se combinam: a falha de processo é risco operacional, os processos judiciais são risco legal, a multa da CVM é risco regulatório e a repercussão negativa é risco de imagem"], "correta": 3, "explicacao": "Os riscos da atividade profissional costumam se encadear: uma falha operacional pode gerar demandas judiciais (legal), sanções de reguladores (regulatório) e perda de confiança (imagem). A instituição responde pelos atos de seus profissionais, o que reforça a importância dos controles internos."}, {"id": "M3A-115", "modulo": 3, "topico": "3.4.5.1 Legislação e regulamentação aplicável (crime e infração administrativa)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente deposita em espécie, em vários dias seguidos, valores logo abaixo do limite que dispara controles internos, depois transfere tudo para contas de terceiros e, meses mais tarde, usa os recursos para comprar imóveis em nome de uma empresa recém-aberta. As etapas da lavagem de dinheiro representadas, na ordem, são:", "alternativas": ["Integração, ocultação e colocação", "Colocação, integração e ocultação", "Colocação, ocultação e integração", "Ocultação, colocação e integração"], "correta": 2, "explicacao": "Na colocação o dinheiro ilícito entra no sistema econômico (depósitos fracionados em espécie); na ocultação (ou estratificação) busca-se dificultar o rastreamento com várias transferências; na integração os recursos retornam à economia com aparência lícita, como na compra de imóveis por uma empresa."}, {"id": "M3A-116", "modulo": 3, "topico": "3.4.5.1 Legislação e regulamentação aplicável (crime e infração administrativa)", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Sobre a Lei 9.613/1998, com as alterações da Lei 12.683/2012, é correto afirmar que:", "alternativas": ["As obrigações de cadastro e comunicação aplicam-se somente aos bancos comerciais", "Qualquer infração penal pode ser antecedente da lavagem, que é crime punido com reclusão; além disso, a lei impõe às pessoas sujeitas ao mecanismo de controle deveres administrativos (cadastro, registro e comunicação), cujo descumprimento gera sanções administrativas", "A lei prevê apenas sanções administrativas, sem pena de prisão", "Só há crime de lavagem quando os recursos vêm de tráfico de drogas, terrorismo ou crimes contra o sistema financeiro, que formam um rol fechado"], "correta": 1, "explicacao": "Desde 2012 não há mais rol taxativo de crimes antecedentes: os recursos podem vir de qualquer infração penal. A lei define o crime de lavagem, com pena de reclusão, e também cria deveres administrativos para setores obrigados (instituições financeiras, corretoras, distribuidoras, seguradoras, entre outros), sujeitos a sanções como advertência, multa, inabilitação e cassação."}, {"id": "M3A-117", "modulo": 3, "topico": "3.4.5.2 Responsabilidades administrativa e legal", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma corretora deixa de manter cadastros atualizados e de comunicar operações atípicas ao COAF, embora não tenha participado de nenhum esquema de lavagem. Sobre a responsabilidade da corretora e de seus administradores, é correto afirmar que:", "alternativas": ["Pode haver responsabilidade administrativa pelo descumprimento dos deveres de PLDFT, com sanções como advertência, multa, inabilitação de administradores e cassação da autorização, independentemente de responsabilidade penal", "Não há responsabilidade, pois a corretora não lavou dinheiro", "Apenas os clientes podem ser punidos", "A responsabilidade é exclusivamente do COAF, que deveria ter fiscalizado"], "correta": 0, "explicacao": "As pessoas sujeitas à Lei 9.613/98 respondem administrativamente pelo descumprimento das obrigações de identificação, registro e comunicação, mesmo sem participar do crime. As sanções incluem advertência, multa, inabilitação temporária de administradores e cassação ou suspensão da autorização para funcionar."}, {"id": "M3A-118", "modulo": 3, "topico": "3.4.5.2 Responsabilidades administrativa e legal", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Um gerente, sabendo que um cliente movimenta recursos provenientes de fraude, ajuda-o a fracionar depósitos e a abrir contas em nome de terceiros para dificultar o rastreamento. Sobre a situação, é correto afirmar que:", "alternativas": ["O gerente só responde se tiver recebido comissão pelo esquema", "O gerente pode responder criminalmente por lavagem de dinheiro, pois participou da ocultação dos recursos, além de responder a processos internos e regulatórios", "Não há crime, pois os depósitos foram feitos pelo próprio cliente", "Apenas a instituição responde, pois o gerente agiu como empregado"], "correta": 1, "explicacao": "A responsabilidade penal é pessoal: quem, conscientemente, contribui para ocultar ou dissimular a origem de recursos ilícitos pode ser autor ou partícipe do crime de lavagem. A instituição pode ainda responder administrativamente por falhas de controle, o que não exclui a responsabilidade do profissional."}, {"id": "M3A-119", "modulo": 3, "topico": "3.4.5.3 Modelo de abordagem baseada em risco", "dificuldade": "medio", "tipo": "mc", "enunciado": "Pela abordagem baseada em risco prevista na Resolução CVM 50, as instituições devem:", "alternativas": ["Classificar clientes, produtos, serviços e canais conforme o risco de lavagem e de financiamento do terrorismo, aplicando controles mais rigorosos onde o risco é maior e procedimentos proporcionais onde é menor", "Monitorar apenas clientes com patrimônio acima de R$ 1 milhão", "Aplicar exatamente os mesmos procedimentos de diligência a todos os clientes, sem distinção", "Deixar a avaliação de risco a cargo exclusivo do COAF"], "correta": 0, "explicacao": "A abordagem baseada em risco direciona os recursos de controle para as situações de maior risco. Clientes, produtos, serviços, canais de distribuição e ambientes de negociação são classificados por risco, e o nível de diligência é proporcional a essa classificação."}, {"id": "M3A-120", "modulo": 3, "topico": "3.4.5.3.1 Avaliação interna de risco", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Sobre a avaliação interna de risco de lavagem de dinheiro e financiamento do terrorismo exigida pela Resolução CVM 50, é correto afirmar que:", "alternativas": ["Substitui a necessidade de uma política de PLDFT", "É feita uma única vez, no momento em que a instituição obtém autorização para funcionar", "É responsabilidade de cada gerente, que define sozinho o risco de seus clientes", "Deve identificar e mensurar os riscos aos quais a instituição está exposta, considerando clientes, produtos, serviços, canais e prestadores de serviço, e ser documentada em relatório periódico elaborado sob responsabilidade do diretor estatutário responsável por PLDFT"], "correta": 3, "explicacao": "A avaliação interna de risco é a base da abordagem baseada em risco: identifica e mensura riscos e orienta a política e os controles. A norma exige um diretor estatutário responsável pelo tema e a elaboração periódica de relatório sobre essa avaliação, que deve ser revisado e mantido à disposição da CVM."}, {"id": "M3A-121", "modulo": 3, "topico": "3.4.5.3.2 Política direcionada às características e riscos relevantes da instituição", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma pequena gestora que atende apenas investidores profissionais copia integralmente a política de PLDFT de um grande banco de varejo, sem adaptações. Considerando a Resolução CVM 50, essa prática é:", "alternativas": ["Recomendável, pois políticas de grandes bancos são sempre mais completas", "Obrigatória, pois a CVM exige um modelo único de política para todo o mercado", "Inadequada, pois a política deve ser compatível com a natureza, o porte, a complexidade, o modelo de negócio e os riscos específicos da própria instituição", "Indiferente, pois a política é apenas formal"], "correta": 2, "explicacao": "A política de PLDFT deve refletir as características e os riscos relevantes da instituição, identificados na avaliação interna de risco. Copiar a política de outra instituição com perfil diferente gera controles desproporcionais em alguns pontos e lacunas em outros."}, {"id": "M3A-122", "modulo": 3, "topico": "3.4.5.3.3 Controle de efetividade das políticas e procedimentos", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma corretora tem política de PLDFT bem redigida, mas nunca verificou se os alertas de operações atípicas estão sendo analisados ou se os funcionários seguem os procedimentos. Pela Resolução CVM 50, falta à corretora:", "alternativas": ["Controles de efetividade, que verifiquem periodicamente se políticas, procedimentos e controles internos de PLDFT funcionam na prática, com indicadores e correção de deficiências", "Nada, pois ter a política escrita é suficiente para cumprir a norma", "Apenas um novo questionário de suitability", "Somente a contratação de uma auditoria externa de demonstrações financeiras"], "correta": 0, "explicacao": "Não basta ter política: a instituição deve testar e monitorar sua efetividade, por exemplo verificando o tratamento de alertas, a atualização cadastral e o treinamento, e corrigir as deficiências identificadas."}, {"id": "M3A-123", "modulo": 3, "topico": "3.4.5.4.1 Função do cadastro e implicações de um cadastro desatualizado", "dificuldade": "medio", "tipo": "mc", "enunciado": "O cadastro de um cliente informa renda mensal de R$ 4.000,00 e ocupação de vendedor, mas ele passou a aplicar R$ 300.000,00 por mês. O cadastro não é atualizado há cinco anos. A conduta adequada é:", "alternativas": ["Ignorar a diferença, pois o cliente pode ter recebido herança", "Bloquear definitivamente a conta e encerrar o relacionamento sem qualquer análise", "Buscar a atualização cadastral e informações que justifiquem a origem dos recursos e a capacidade financeira; persistindo a incompatibilidade, submeter o caso à área de PLDFT para análise e eventual comunicação ao COAF", "Comunicar imediatamente ao cliente que ele está sendo investigado"], "correta": 2, "explicacao": "O cadastro atualizado é a base para avaliar se as movimentações são compatíveis com a capacidade financeira do cliente. Movimentação incompatível com a renda declarada exige diligência e, se não for justificada, análise da área de PLDFT. Avisar o cliente sobre a análise ou a comunicação é vedado."}, {"id": "M3A-124", "modulo": 3, "topico": "3.4.5.4.1 Função do cadastro e implicações de um cadastro desatualizado", "dificuldade": "facil", "tipo": "mc", "enunciado": "Sobre a função do cadastro do cliente nas instituições financeiras, é correto afirmar que:", "alternativas": ["É uma formalidade necessária apenas na abertura da conta", "Pode ser preenchido pelo gerente com estimativas, sem informações do cliente", "Serve apenas para fins de marketing e oferta de produtos", "É fundamental para identificar o cliente, conhecer sua capacidade financeira e a origem de seus recursos, verificar se é pessoa exposta politicamente e monitorar a compatibilidade das operações, devendo ser mantido atualizado"], "correta": 3, "explicacao": "O cadastro é a principal ferramenta do “conheça seu cliente”: identifica o cliente e seus beneficiários finais, registra renda, patrimônio e ocupação, indica condições como a de pessoa exposta politicamente e permite avaliar a compatibilidade das operações. Um cadastro desatualizado enfraquece todos os controles de PLDFT."}, {"id": "M3A-125", "modulo": 3, "topico": "3.4.5.4.2 Conheça seu cliente como forma de proteção da instituição e do profissional", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um gerente argumenta que pedir informações sobre a origem dos recursos “incomoda os clientes” e que, por isso, prefere não fazê-lo. A resposta mais adequada da área de compliance é que o “conheça seu cliente”:", "alternativas": ["Deve ser aplicado somente a clientes estrangeiros", "Protege a instituição e o próprio profissional de serem usados em esquemas de lavagem e das responsabilidades e danos de imagem decorrentes, além de ser obrigação normativa", "Serve apenas para cumprir uma formalidade perante o Banco Central", "É opcional para clientes antigos"], "correta": 1, "explicacao": "Conhecer o cliente não é apenas uma exigência regulatória: é uma proteção para a instituição e para o profissional, que podem responder administrativa e até criminalmente, além de sofrer danos reputacionais, se forem usados por criminosos. A diligência pode ser feita com cordialidade, explicando que é procedimento padrão."}, {"id": "M3A-126", "modulo": 3, "topico": "3.4.5.4 Princípio do conheça seu cliente (KYC)", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Um novo cliente informa ser deputado estadual e quer aplicar recursos expressivos. Sobre a conduta da instituição, é correto afirmar que:", "alternativas": ["Ele deve ser tratado como pessoa exposta politicamente, com diligência reforçada: verificação da origem dos recursos, aprovação do relacionamento em nível hierárquico adequado e monitoramento mais rigoroso das operações", "Basta registrar o CPF, sem necessidade de outras informações", "Por ser autoridade pública, está dispensado de comprovar a origem dos recursos", "Por ser pessoa exposta politicamente (PEP), ele deve ser recusado como cliente"], "correta": 0, "explicacao": "Pessoas expostas politicamente não são proibidas de ser clientes, mas apresentam risco maior de envolvimento em corrupção e lavagem. Por isso exigem diligência reforçada, monitoramento contínuo e atenção à origem dos recursos, o que também se estende a familiares e estreitos colaboradores."}, {"id": "M3A-127", "modulo": 3, "topico": "3.4.5 Fraudes eletrônicas", "dificuldade": "facil", "tipo": "mc", "enunciado": "Uma cliente recebe uma ligação de alguém que se apresenta como funcionário da “central de segurança” do banco, informa que há uma compra suspeita e pede que ela digite a senha no teclado do telefone e entregue o cartão a um motoboy. A orientação correta é:", "alternativas": ["Seguir as instruções, pois o banco precisa da senha para cancelar a compra", "Entregar o cartão cortado ao meio, o que impede qualquer uso", "Fornecer apenas a senha, mas não entregar o cartão", "Desligar e não fornecer nenhuma informação: o banco não pede senha por telefone nem recolhe cartões; ela deve entrar em contato pelos canais oficiais, usando outro telefone se possível"], "correta": 3, "explicacao": "Esse é o golpe da falsa central de atendimento, baseado em engenharia social. Instituições financeiras não pedem senhas, códigos de token ou o cartão físico. A cliente deve desligar e contatar o banco por canais oficiais; cartões cortados ainda podem ter o chip usado pelos golpistas."}, {"id": "M3A-128", "modulo": 3, "topico": "3.4.5 Fraudes eletrônicas", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente recebe por SMS uma mensagem com o logotipo do banco dizendo que seu acesso será bloqueado e pedindo que clique em um link para “atualizar os dados”. Essa prática é conhecida como:", "alternativas": ["Churning, giro excessivo da carteira", "Phishing, técnica de enviar mensagens falsas que imitam instituições para induzir a vítima a fornecer dados ou instalar programas maliciosos", "Spoofing de mercado, manipulação de ordens na bolsa", "Front running, uso antecipado de ordens de clientes"], "correta": 1, "explicacao": "Phishing (ou smishing, quando por SMS) usa mensagens falsas que imitam marcas confiáveis para capturar dados e senhas. A orientação é não clicar em links recebidos, acessar a instituição apenas pelos canais oficiais e comunicar o banco."}, {"id": "M3A-129", "modulo": 3, "topico": "3.4.5 Fraudes eletrônicas", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um idoso diz ao gerente que recebeu mensagem do “filho”, com número novo, pedindo um Pix urgente para pagar uma conta. O gerente desconfia de golpe. A conduta mais adequada é:", "alternativas": ["Bloquear definitivamente todas as transações do cliente", "Informar que o Pix pode ser cancelado a qualquer tempo, portanto não há risco", "Orientar o cliente a confirmar a história com o filho por outro meio (ligação para o número antigo, contato pessoal) antes de transferir, explicando como funciona esse tipo de golpe", "Executar o Pix, pois a decisão é do cliente e não cabe ao gerente opinar"], "correta": 2, "explicacao": "O golpe do falso parente usa engenharia social e urgência. O profissional deve alertar e orientar o cliente a confirmar a identidade do solicitante por outro canal. Transferências via Pix são instantâneas; mecanismos de devolução existem para fraude, mas não garantem a recuperação dos valores."}, {"id": "M3A-130", "modulo": 3, "topico": "3.4.6.1 LGPD – Normativas (Lei 13.709/2018)", "dificuldade": "facil", "tipo": "mc", "enunciado": "A Lei Geral de Proteção de Dados Pessoais (Lei 13.709/2018) tem como objetivo principal:", "alternativas": ["Proibir as instituições financeiras de coletar dados de clientes", "Regular o sigilo das operações bancárias, substituindo a Lei Complementar 105/2001", "Proteger os direitos fundamentais de liberdade e de privacidade, regulando o tratamento de dados pessoais, inclusive nos meios digitais, por pessoas físicas e jurídicas, de direito público ou privado", "Regular apenas os dados de empresas (pessoas jurídicas)"], "correta": 2, "explicacao": "A LGPD disciplina o tratamento de dados pessoais de pessoas naturais, em meios físicos ou digitais, para proteger a privacidade e a liberdade. Ela não proíbe o tratamento, mas exige base legal, finalidade e segurança, e não substitui a lei do sigilo bancário, que continua em vigor."}, {"id": "M3A-131", "modulo": 3, "topico": "3.4.6.2 LGPD – Conceito", "dificuldade": "medio", "tipo": "mc", "enunciado": "Na ficha de um cliente constam: nome, CPF, endereço, renda, informação sobre uma doença crônica e religião. Pela LGPD, é correto afirmar que:", "alternativas": ["Todas são dados pessoais; a informação de saúde e a religião são dados pessoais sensíveis, que exigem proteção reforçada e só podem ser tratados nas hipóteses específicas da lei", "Renda é dado sensível, e saúde e religião são dados comuns", "Apenas CPF e nome são dados pessoais", "Nenhuma dessas informações é protegida, pois foram fornecidas voluntariamente pelo cliente"], "correta": 0, "explicacao": "Dado pessoal é qualquer informação relacionada a pessoa natural identificada ou identificável. Dados sensíveis incluem origem racial ou étnica, convicção religiosa, opinião política, filiação sindical, dados de saúde, vida sexual, genéticos e biométricos, e têm regras mais restritivas de tratamento."}, {"id": "M3A-132", "modulo": 3, "topico": "3.4.6.3 LGPD – Aplicabilidade", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente pede ao banco que informe quais dados pessoais seus estão armazenados e para que finalidade são usados, e solicita a correção de seu endereço. Pela LGPD, o banco:", "alternativas": ["Pode negar, pois os dados pertencem à instituição que os coletou", "Deve atender, pois o titular tem direito de confirmação da existência de tratamento, acesso aos dados e correção de dados incompletos, inexatos ou desatualizados", "Deve excluir imediatamente todos os dados do cliente, inclusive os exigidos por lei", "Só deve atender mediante ordem judicial"], "correta": 1, "explicacao": "A LGPD garante ao titular direitos como confirmação e acesso, correção, informação sobre compartilhamento, portabilidade e revogação do consentimento. A eliminação não é absoluta: dados necessários ao cumprimento de obrigações legais ou regulatórias (como cadastro para PLDFT) podem ser mantidos."}, {"id": "M3A-133", "modulo": 3, "topico": "3.4.6.3 LGPD – Aplicabilidade", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Um cliente revoga o consentimento para receber ofertas de marketing e pede a exclusão de todos os seus dados. O banco mantém dados cadastrais e registros de operações dos últimos anos. Sobre essa situação, é correto afirmar que:", "alternativas": ["O banco pode continuar enviando ofertas, desde que não use o nome do cliente", "O banco deve apagar tudo imediatamente, pois o consentimento é a única base legal possível", "O banco não precisa atender a nenhum pedido, pois o cliente ainda tem conta ativa", "O banco deve parar de usar os dados para marketing, mas pode manter os dados necessários ao cumprimento de obrigações legais e regulatórias e à execução do contrato, pois o tratamento nesses casos se apoia em outras bases legais"], "correta": 3, "explicacao": "O consentimento é apenas uma das bases legais da LGPD. Revogado o consentimento, cessa o tratamento que dependia dele (marketing), mas o tratamento baseado em obrigação legal ou regulatória (como registros exigidos pela regulamentação de PLDFT) ou na execução do contrato continua permitido."}, {"id": "M3A-134", "modulo": 3, "topico": "3.4.6.4 Confidencialidade de dados no mundo digital e internet", "dificuldade": "medio", "tipo": "mc", "enunciado": "Para agilizar o atendimento, um gerente envia por aplicativo de mensagens pessoal planilhas com dados e saldos de clientes a um colega, e às vezes trabalha com esses arquivos em computadores públicos. Sobre essa prática, é correto afirmar que:", "alternativas": ["Só seria irregular se os dados fossem vendidos", "É adequada, pois o colega também trabalha na instituição", "É inadequada, pois expõe dados pessoais e protegidos por sigilo a riscos de vazamento; o profissional deve usar apenas canais e ambientes seguros autorizados pela instituição, observando a LGPD e as políticas de segurança da informação", "É adequada, desde que os arquivos sejam apagados depois"], "correta": 2, "explicacao": "A confidencialidade no ambiente digital exige uso de canais e sistemas autorizados, controle de acesso e cuidados com dispositivos e redes. Compartilhar dados de clientes por canais pessoais e usar computadores públicos aumenta o risco de vazamento, o que pode gerar sanções pela LGPD e quebra de sigilo bancário."}, {"id": "M3A-135", "modulo": 3, "topico": "3.4.6.5 Sigilo bancário (LC 105/2001)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um homem liga para a agência dizendo ser marido de uma cliente e pede o saldo das aplicações dela, alegando que “os bens são do casal”. Considerando a Lei Complementar 105/2001, o gerente deve:", "alternativas": ["Recusar a informação, pois as operações e os dados da cliente são protegidos por sigilo e só podem ser revelados nas hipóteses legais, como com o consentimento expresso da própria titular ou por ordem judicial", "Informar o saldo, pois cônjuges têm acesso automático às contas um do outro", "Informar o saldo se o homem disser o CPF da cliente corretamente", "Informar apenas o valor aproximado, o que não configura quebra de sigilo"], "correta": 0, "explicacao": "As instituições financeiras devem manter sigilo de suas operações ativas e passivas e dos serviços prestados. O vínculo conjugal não autoriza o acesso às informações de conta de titularidade individual; a revelação depende de consentimento expresso da titular, ordem judicial ou outras hipóteses previstas em lei."}, {"id": "M3A-136", "modulo": 3, "topico": "3.4.6.5 Sigilo bancário (LC 105/2001)", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Considerando a Lei Complementar 105/2001, NÃO constitui violação do dever de sigilo bancário:", "alternativas": ["Contar a um amigo jornalista os investimentos de um cliente famoso", "Informar o saldo de um cliente a um parente que se diz preocupado com ele", "Repassar a lista de clientes de alta renda a uma empresa parceira de marketing", "Comunicar às autoridades competentes a prática de ilícitos, inclusive operações envolvendo recursos de origem criminosa, e prestar as informações exigidas pela legislação ao COAF e à Receita Federal"], "correta": 3, "explicacao": "A LC 105/2001 lista hipóteses que não configuram quebra de sigilo, como a troca de informações entre instituições para fins cadastrais, a comunicação de ilícitos às autoridades, o fornecimento de informações exigidas por lei e a revelação com consentimento expresso dos interessados. A quebra fora dessas hipóteses é crime."}, {"id": "M3A-137", "modulo": 3, "topico": "3.4.6.6 Registro de operações", "dificuldade": "medio", "tipo": "mc", "enunciado": "Sobre o registro de operações e a guarda de documentos para fins de prevenção à lavagem de dinheiro, é correto afirmar que:", "alternativas": ["Os registros podem ser descartados logo após a liquidação das operações", "As instituições devem manter registro de todas as operações e serviços, em condições de atender às autoridades, e conservar cadastros e registros pelo prazo mínimo de cinco anos, conforme a legislação", "Só operações em espécie precisam ser registradas", "A guarda dos registros é responsabilidade exclusiva do cliente"], "correta": 1, "explicacao": "A Lei 9.613/98 e a regulamentação (como a Resolução CVM 50) exigem registro das operações e conservação de cadastros e registros por, no mínimo, cinco anos. Esses registros permitem reconstituir operações e atender a requisições das autoridades."}, {"id": "M3A-138", "modulo": 3, "topico": "3.4.6.7 Operações suspeitas", "dificuldade": "medio", "tipo": "mc", "enunciado": "Entre as situações abaixo, a que mais caracteriza indício de operação suspeita de lavagem de dinheiro é:", "alternativas": ["Um cliente com renda modesta que passa a receber muitos depósitos fracionados de diversas pessoas, sem fundamentação econômica aparente, e transfere rapidamente os valores para terceiros", "Uma empresa que paga a folha de salários sempre no quinto dia útil", "Um cliente que resgata parte de um fundo para pagar a matrícula da faculdade do filho", "Um aposentado que aplica todo mês o mesmo valor do benefício em CDB"], "correta": 0, "explicacao": "São sinais de alerta: movimentação incompatível com a capacidade financeira, fracionamento de depósitos, uso de contas como passagem (entrada e saída rápida) e ausência de fundamento econômico. As demais situações são compatíveis com o perfil e a finalidade declarada."}, {"id": "M3A-139", "modulo": 3, "topico": "3.4.6.8 Caracterização (de operações suspeitas)", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Sobre a caracterização de uma operação como suspeita e a sua comunicação, é correto afirmar que:", "alternativas": ["O cliente deve ser avisado previamente para apresentar defesa antes da comunicação", "Só deve ser comunicada se o gerente tiver certeza de que houve crime", "Deve ser comunicada somente quando envolver valores acima de R$ 1 milhão", "A comunicação exige indícios, não prova; considera-se a atipicidade em relação ao perfil do cliente, a falta de fundamento econômico ou legal e outros sinais de alerta, e a decisão de comunicar cabe à instituição após análise, sem que o cliente seja informado"], "correta": 3, "explicacao": "Não cabe à instituição investigar ou provar o crime, e sim identificar e comunicar situações atípicas com indícios de lavagem. A análise considera perfil, capacidade financeira, partes envolvidas e fundamento econômico. É vedado dar ciência ao cliente da comunicação feita."}, {"id": "M3A-140", "modulo": 3, "topico": "3.4.6.9 Obrigatoriedade de comunicação e controle", "dificuldade": "medio", "tipo": "mc", "enunciado": "Após análise, a área de PLDFT de uma distribuidora conclui que as operações de um cliente têm sérios indícios de lavagem de dinheiro. O procedimento correto é:", "alternativas": ["Aguardar que o cliente faça novas operações para ter certeza", "Comunicar a operação ao COAF, nos prazos da regulamentação, sem dar ciência ao cliente ou a terceiros", "Denunciar o cliente na imprensa para proteger outros investidores", "Encerrar a conta do cliente e explicar a ele o motivo"], "correta": 1, "explicacao": "Identificados indícios, a instituição deve comunicar ao COAF, a unidade de inteligência financeira do país, dentro dos prazos regulamentares e em sigilo. Avisar o cliente pode frustrar a investigação e é vedado; a comunicação feita de boa-fé não gera responsabilidade civil ou administrativa."}, {"id": "M3A-141", "modulo": 3, "topico": "3.4.6.10 Indisponibilidade de bens em decorrência de resoluções do CSNU", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Uma corretora identifica que um de seus clientes foi incluído em uma lista de sanções do Conselho de Segurança das Nações Unidas (CSNU) que determina a indisponibilidade de ativos. A conduta exigida pela legislação (Lei 13.810/2019) e pela regulamentação é:", "alternativas": ["Liquidar a carteira e entregar os recursos ao cliente em espécie", "Aguardar uma decisão judicial brasileira antes de qualquer providência", "Cumprir imediatamente e sem aviso prévio ao sancionado a indisponibilidade dos ativos, e comunicar o fato às autoridades indicadas na regulamentação (como a CVM, o Ministério da Justiça e o COAF)", "Avisar o cliente com antecedência para que ele possa transferir os recursos"], "correta": 2, "explicacao": "As resoluções sancionatórias do CSNU devem ser cumpridas imediatamente e sem prévio aviso aos atingidos, com indisponibilidade dos bens, direitos e valores. A instituição comunica a medida às autoridades competentes, e o objetivo é impedir o financiamento do terrorismo e da proliferação de armas de destruição em massa."}, {"id": "M3A-142", "modulo": 3, "topico": "3.4.6.11 Princípio do conheça sua parceria", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma distribuidora pretende contratar um escritório de assessoria de investimento e um prestador de serviços de tecnologia que terá acesso a dados de clientes. Pelo princípio do “conheça sua parceria” (conheça seu parceiro), a distribuidora deve:", "alternativas": ["Dispensar verificações caso o parceiro seja indicado por um cliente importante", "Realizar diligência prévia e contínua sobre os parceiros e prestadores de serviço, avaliando reputação, estrutura, controles de PLDFT e de segurança da informação, e classificá-los por risco", "Exigir que os parceiros façam o suitability dos funcionários da distribuidora", "Contratar apenas pelo menor preço, sem outras verificações"], "correta": 1, "explicacao": "O “conheça sua parceria” estende a lógica do KYC a parceiros, fornecedores e prestadores de serviço, que podem expor a instituição a riscos de lavagem, de imagem e de vazamento de dados. Exige diligência na contratação e monitoramento ao longo da relação, proporcional ao risco."}, {"id": "M3A-143", "modulo": 3, "topico": "3.4.7.1.1 Manipulação do mercado (art. 27-C da Lei 6.385/76)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um grupo de investidores combina compras e vendas entre si de uma ação pouco negociada, elevando artificialmente sua cotação e volume para atrair outros investidores, e depois vende suas posições com lucro. Essa conduta pode configurar o crime de:", "alternativas": ["Lavagem de dinheiro, exclusivamente", "Uso indevido de informação privilegiada", "Manipulação do mercado, por meio de operações simuladas ou manobras fraudulentas destinadas a alterar cotação, preço ou volume, com o fim de obter vantagem indevida", "Exercício irregular de profissão"], "correta": 2, "explicacao": "O art. 27-C da Lei 6.385/76 tipifica como manipulação do mercado realizar operações simuladas ou executar manobras fraudulentas destinadas a elevar, manter ou baixar a cotação, o preço ou o volume negociado de valor mobiliário, com o fim de obter vantagem indevida ou lucro, para si ou para outrem, ou causar dano a terceiros. É crime punido com reclusão e multa."}, {"id": "M3A-144", "modulo": 3, "topico": "3.4.7.1.2.1 Insider trading primário", "dificuldade": "medio", "tipo": "mc", "enunciado": "O diretor financeiro de uma companhia aberta sabe, antes da divulgação, que a empresa será adquirida por um preço muito acima da cotação e compra ações da empresa por meio de sua conta pessoal. Essa conduta caracteriza:", "alternativas": ["Insider trading primário: uso de informação relevante ainda não divulgada, obtida diretamente em razão do cargo, para negociar com vantagem indevida", "Insider trading secundário, pois o diretor não participou da negociação da aquisição", "Front running, pois o diretor comprou antes de ordens de clientes", "Prática lícita, pois o diretor investiu com recursos próprios"], "correta": 0, "explicacao": "O insider primário é quem tem acesso direto à informação relevante em razão de sua posição (administradores, controladores, empregados, prestadores de serviço). Negociar com base nessa informação antes da divulgação é crime previsto no art. 27-D da Lei 6.385/76."}, {"id": "M3A-145", "modulo": 3, "topico": "3.4.7.1.2.2 Insider trading secundário", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Um advogado que assessora a operação de fusão de uma companhia comenta o negócio com o cunhado, que não tem relação com a empresa. O cunhado compra ações antes do anúncio e lucra. Sobre a conduta do cunhado, é correto afirmar que:", "alternativas": ["Não há ilícito, pois ele não tinha dever de sigilo nem vínculo com a companhia", "Trata-se de manipulação de mercado, pois ele alterou o preço da ação", "Só o advogado pode ser responsabilizado, pois o cunhado apenas investiu", "Ele pode responder como insider secundário, pois utilizou informação relevante ainda não divulgada, que sabia ter origem privilegiada, para obter vantagem indevida em negociação"], "correta": 3, "explicacao": "Insider secundário é quem recebe a informação privilegiada, direta ou indiretamente, do insider primário e a utiliza para negociar. Desde a Lei 13.506/2017, o tipo penal do art. 27-D não exige dever de sigilo do agente, alcançando qualquer pessoa que use informação relevante não divulgada capaz de propiciar vantagem indevida."}, {"id": "M3A-146", "modulo": 3, "topico": "3.4.7.1.2.3 Repasse de informação privilegiada", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um analista de uma companhia aberta, sem negociar ações, conta a um amigo investidor que a empresa vai anunciar um prejuízo bilionário na semana seguinte. Sobre a conduta do analista, é correto afirmar que:", "alternativas": ["Trata-se apenas de falta disciplinar interna, sem repercussão legal", "O repasse de informação sigilosa relativa a fato relevante, a que teve acesso em razão do cargo, também é conduta tipificada no art. 27-D da Lei 6.385/76, ainda que ele próprio não negocie", "Não há crime, pois o analista não negociou valores mobiliários", "Só haverá crime se o amigo tiver prejuízo"], "correta": 1, "explicacao": "A Lei 6.385/76 pune com a mesma pena quem repassa informação sigilosa relativa a fato relevante a que teve acesso em razão de cargo ou posição, a pessoa que dela não deveria ter conhecimento. O crime não depende de o próprio informante negociar."}, {"id": "M3A-147", "modulo": 3, "topico": "3.4.7.1.3 Exercício irregular de cargo, profissão, atividade ou função (art. 27-E)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma pessoa sem qualquer registro ou autorização na CVM cria um perfil em redes sociais e passa a administrar, mediante procuração, as carteiras de investimentos de seguidores, decidindo as operações em nome deles e cobrando taxa de performance. Essa conduta pode configurar:", "alternativas": ["Crime de exercício irregular de cargo, profissão, atividade ou função, por atuar como administrador de carteira sem a autorização ou o registro exigidos", "Atividade lícita, pois os seguidores assinaram procurações", "Crime de manipulação de mercado, exclusivamente", "Apenas infração ética, sem consequência penal"], "correta": 0, "explicacao": "O art. 27-E da Lei 6.385/76 tipifica atuar, ainda que a título gratuito, no mercado de valores mobiliários como administrador de carteira, consultor, analista, assessor de investimento ou outra atividade regulada, sem estar autorizado ou registrado na autoridade competente quando exigido."}, {"id": "M3A-148", "modulo": 3, "topico": "3.4.7.1.3 Exercício irregular de cargo, profissão, atividade ou função (art. 27-E)", "dificuldade": "facil", "tipo": "mc", "enunciado": "Sobre o crime de exercício irregular de cargo, profissão, atividade ou função no mercado de valores mobiliários, é correto afirmar que:", "alternativas": ["Aplica-se apenas a instituições financeiras, nunca a pessoas físicas", "Só existe se a pessoa cobrar pelos serviços", "Ele se configura ainda que a atividade seja exercida a título gratuito, bastando atuar sem a autorização ou o registro exigidos", "Deixa de existir se o cliente concordar por escrito"], "correta": 2, "explicacao": "A lei é expressa ao afirmar que a atuação “ainda que a título gratuito” sem registro ou autorização exigidos configura o crime. A anuência do cliente não afasta a ilicitude, pois o objetivo é proteger o mercado e os investidores em geral."}, {"id": "M3A-149", "modulo": 3, "topico": "3.4.7.1.4 Omissão imprópria (art. 13, § 2º, do Código Penal)", "dificuldade": "dificil", "tipo": "mc", "enunciado": "O diretor responsável por controles internos de uma corretora toma conhecimento de que operadores estão realizando operações de manipulação de preços com recursos de clientes, mas nada faz, embora tivesse o dever e a possibilidade de impedir. Pela figura da omissão imprópria, é correto afirmar que:", "alternativas": ["Ele só responde se tiver obtido lucro com as operações", "Ele não pode ser responsabilizado, pois não realizou nenhuma operação", "Só os operadores podem ser punidos, pois a omissão nunca é crime", "Ele pode responder pelo resultado criminoso como se o tivesse praticado, pois tinha o dever legal ou contratual de agir para evitá-lo e podia fazê-lo"], "correta": 3, "explicacao": "Pelo art. 13, § 2º, do Código Penal, a omissão é penalmente relevante quando o omitente devia e podia agir para evitar o resultado. O dever de agir cabe a quem tem por lei obrigação de cuidado, proteção ou vigilância, a quem assumiu a responsabilidade de impedir o resultado ou a quem criou o risco. Diretores de controle e compliance podem se enquadrar nessa posição de garantidor."}, {"id": "M3A-150", "modulo": 3, "topico": "3.4.7.2.1 Conceito de tipologia aberta e suas implicações para os profissionais", "dificuldade": "dificil", "tipo": "mc", "enunciado": "A Resolução CVM 62 descreve os ilícitos de mercado por meio de conceitos amplos, em “tipologia aberta”, em vez de listar exaustivamente todas as condutas proibidas. A implicação disso para os profissionais é que:", "alternativas": ["Qualquer conduta que se enquadre nas definições gerais (condições artificiais, manipulação, operação fraudulenta ou prática não equitativa) pode ser punida, mesmo que adote forma nova; o profissional deve avaliar a finalidade e o efeito de suas operações, e não apenas a forma", "Os profissionais ficam livres para usar estratégias novas, ainda não descritas na norma", "A tipologia aberta se aplica apenas aos crimes da Lei 6.385/76, e não aos ilícitos administrativos", "Somente as condutas expressamente listadas com nome próprio (como spoofing) podem ser punidas"], "correta": 0, "explicacao": "Com tipologia aberta, o regulador alcança condutas novas sem precisar alterar a norma a cada inovação. Para os profissionais, isso exige atenção à substância das operações: estratégias que, na prática, criam condições artificiais ou desequilíbrio entre participantes são ilícitas, independentemente do nome que recebam."}, {"id": "M3A-151", "modulo": 3, "topico": "3.4.7.2.2.1.1 Criação de condições artificiais de demanda, oferta ou preço – conceito", "dificuldade": "medio", "tipo": "mc", "enunciado": "Dois investidores, de forma combinada, passam a comprar e vender entre si o mesmo lote de um ativo, repetidas vezes, sem mudar a titularidade econômica final, apenas para fazer o volume negociado parecer alto. Pela Resolução CVM 62, essa conduta caracteriza principalmente:", "alternativas": ["Prática não equitativa por insider trading", "Churning, pois envolve muitas operações", "Criação de condições artificiais de demanda, oferta ou preço, pois altera artificialmente o fluxo de ordens e transmite ao mercado uma falsa percepção de liquidez", "Conduta lícita, pois as operações foram efetivamente liquidadas"], "correta": 2, "explicacao": "Condições artificiais são criadas por negociações em que os participantes, por ação ou omissão dolosa, alteram o fluxo de ordens de compra ou venda. Negócios combinados apenas para inflar o volume não refletem a real oferta e demanda e enganam os demais participantes. Churning, por sua vez, é o giro excessivo da carteira de um cliente."}, {"id": "M3A-152", "modulo": 3, "topico": "3.4.7.2.2.1.2 Money pass", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Um operador executa, de forma deliberada, negócios entre a carteira de um fundo que administra e a conta pessoal de um amigo a preços fora de mercado, de modo que o fundo sempre compra caro e vende barato para esse amigo. Essa prática, que transfere riqueza de uma parte para outra por meio de negócios artificiais, é conhecida como:", "alternativas": ["Layering", "Money pass", "Front running", "Spoofing"], "correta": 1, "explicacao": "Money pass é a transferência de recursos entre partes por meio de operações combinadas a preços artificiais, em que uma ponta ganha e a outra perde de propósito. É modalidade de criação de condições artificiais e, no caso, também prejudica os cotistas do fundo."}, {"id": "M3A-153", "modulo": 3, "topico": "3.4.7.2.2.2.1 Manipulação de preços – conceito", "dificuldade": "medio", "tipo": "mc", "enunciado": "Pela Resolução CVM 62, a manipulação de preços consiste em:", "alternativas": ["Deixar de comunicar ao COAF operações atípicas", "Realizar operações excessivas na conta do cliente para gerar corretagem", "Negociar com base em informação relevante não divulgada", "Utilizar qualquer processo ou artifício destinado, direta ou indiretamente, a elevar, manter ou baixar a cotação de um valor mobiliário, induzindo terceiros à sua compra e venda"], "correta": 3, "explicacao": "A manipulação de preços se caracteriza pelo uso de artifícios para mover a cotação e, com isso, induzir terceiros a negociar. Spoofing, layering e manipulação de benchmark são exemplos de técnicas de manipulação de preços."}, {"id": "M3A-154", "modulo": 3, "topico": "3.4.7.2.2.2.2 Spoofing", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um investidor que quer vender ações registra uma grande ordem de compra, que não pretende executar, um pouco abaixo do melhor preço, dando ao mercado a impressão de forte demanda. Quando o preço sobe, ele vende suas ações e cancela a ordem de compra. Essa prática é chamada de:", "alternativas": ["Churning", "Insider trading", "Money pass", "Spoofing"], "correta": 3, "explicacao": "No spoofing, o agente insere ordens relevantes sem intenção de executá-las, para influenciar o comportamento dos demais participantes e mover o preço; em seguida, opera no lado oposto e cancela as ordens artificiais. É uma forma de manipulação de preços."}, {"id": "M3A-155", "modulo": 3, "topico": "3.4.7.2.2.2.3 Layering", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Um operador insere diversas ordens de venda em vários níveis de preço do livro de ofertas, criando a aparência de forte pressão vendedora. Com a queda da cotação, compra o ativo a preço menor e, em seguida, cancela todas as ordens de venda. Sobre essa conduta, é correto afirmar que:", "alternativas": ["Configura front running, pois as ordens foram inseridas antes da compra", "Configura churning, pois envolve muitas ordens", "Configura layering, variante da manipulação de preços em que múltiplas ordens em diferentes níveis de preço, sem intenção de execução, criam falsa impressão de oferta ou demanda", "É uma estratégia lícita de formação de preço, pois ordens podem ser canceladas a qualquer momento"], "correta": 2, "explicacao": "O layering se distingue do spoofing simples pelo uso de várias ordens em camadas (níveis de preço) de um mesmo lado do livro, sem intenção de execução, para induzir os demais participantes. O cancelamento de ordens é permitido, mas não quando a finalidade é enganar o mercado."}, {"id": "M3A-156", "modulo": 3, "topico": "3.4.7.2.2.2.4 Manipulação de benchmark", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Uma instituição com grande posição em derivativos referenciados no preço de fechamento de um ativo concentra ordens de compra nos minutos finais do pregão, sem fundamento econômico, para elevar o preço de fechamento e valorizar sua posição. Essa conduta é exemplo de:", "alternativas": ["Insider trading secundário", "Manipulação de benchmark (índice ou preço de referência), modalidade de manipulação de preços", "Churning", "Prática lícita de gestão de risco"], "correta": 1, "explicacao": "A manipulação de benchmark busca alterar artificialmente um preço ou índice de referência (como preço de fechamento, taxas e índices) usado para liquidar contratos ou avaliar carteiras, beneficiando posições do manipulador em prejuízo de outros participantes."}, {"id": "M3A-157", "modulo": 3, "topico": "3.4.7.2.2.3.1 Operações fraudulentas – conceito", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um assessor apresenta a clientes relatórios falsos mostrando rentabilidade inexistente para convencê-los a manter e ampliar aplicações em um produto que ele sabe estar em dificuldades. Pela Resolução CVM 62, essa conduta caracteriza:", "alternativas": ["Operação fraudulenta, em que se utiliza ardil ou artifício destinado a induzir ou manter terceiros em erro, com a finalidade de obter vantagem ilícita de natureza patrimonial", "Manipulação de benchmark", "Prática não equitativa por front running", "Criação de condições artificiais, por alterar o fluxo de ordens"], "correta": 0, "explicacao": "Operação fraudulenta é aquela em que se usa ardil ou artifício para induzir ou manter terceiros em erro, buscando vantagem patrimonial ilícita para as partes ou para terceiros. O uso de informações falsas para enganar clientes é exemplo típico."}, {"id": "M3A-158", "modulo": 3, "topico": "3.4.7.2.2.3.2 Churning", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um operador com autorização para operar a conta de um cliente realiza dezenas de compras e vendas por semana, sem relação com os objetivos e o perfil do cliente, gerando altas receitas de corretagem e prejuízos ao investidor. Essa prática é conhecida como:", "alternativas": ["Layering", "Spoofing", "Churning", "Money pass"], "correta": 2, "explicacao": "Churning é o giro excessivo da carteira do cliente, com o objetivo de gerar receitas (corretagem, comissões) para o intermediário ou profissional, sem benefício ao investidor. É tratado como operação fraudulenta e também viola o dever de lealdade e o suitability."}, {"id": "M3A-159", "modulo": 3, "topico": "3.4.7.2.2.4.1 Práticas não equitativas – conceito", "dificuldade": "medio", "tipo": "mc", "enunciado": "Pela Resolução CVM 62, prática não equitativa é aquela que:", "alternativas": ["Resulta, direta ou indiretamente, efetiva ou potencialmente, em tratamento que coloca alguma das partes em posição indevida de desequilíbrio ou desigualdade em relação aos demais participantes da operaç
