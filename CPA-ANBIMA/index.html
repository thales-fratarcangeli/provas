ocar, com alguma defasagem, qual efeito sobre a economia?", "alternativas": ["Valorização imediata e permanente da moeda nacional", "Encarecimento do crédito e redução do consumo das famílias", "Barateamento do crédito, estímulo ao consumo e ao investimento e aumento da atividade econômica", "Aumento obrigatório da rentabilidade de aplicações pós-fixadas"], "correta": 2, "explicacao": "Juros menores reduzem o custo do crédito e o retorno das aplicações conservadoras, estimulando consumo e investimento. Esses efeitos atuam com defasagem e podem aumentar a pressão sobre a inflação. Aplicações pós-fixadas ao CDI tendem a render menos, e não mais."}, {"id": "M1A-078", "modulo": 1, "topico": "1.2.4.5 Copom", "dificuldade": "facil", "tipo": "mc", "enunciado": "Um cliente vê no noticiário que 'a taxa Selic foi mantida'. Ele pergunta quem define a meta da taxa Selic. A resposta correta é:", "alternativas": ["O Comitê de Política Monetária (Copom), do Banco Central", "O Conselho Monetário Nacional (CMN)", "O Ministério da Fazenda", "A B3, com base nos negócios do dia"], "correta": 0, "explicacao": "O Copom, formado pela diretoria do Banco Central, define a meta para a taxa Selic, principal instrumento da política monetária. O CMN fixa a meta de inflação, que o Copom busca alcançar ao calibrar os juros."}, {"id": "M1A-079", "modulo": 1, "topico": "1.2.4.5 Copom", "dificuldade": "medio", "tipo": "mc", "enunciado": "Assinale a afirmação correta sobre o Copom:", "alternativas": ["Suas decisões precisam ser aprovadas pelo CMN antes de entrar em vigor", "É composto pelo presidente e pelos diretores do Banco Central e realiza oito reuniões ordinárias por ano", "É composto pelo Ministro da Fazenda, pelo Ministro do Planejamento e pelo presidente do BC, reunindo-se mensalmente", "Define a meta de inflação e o intervalo de tolerância a cada reunião"], "correta": 1, "explicacao": "O Copom é integrado pelo presidente e pelos diretores do Banco Central e se reúne ordinariamente oito vezes por ano para definir a meta da Selic, divulgando um comunicado ao fim da reunião e, depois, a ata. A meta de inflação é fixada pelo CMN, e as decisões do Copom não dependem de aprovação do Conselho."}, {"id": "M1A-080", "modulo": 1, "topico": "1.2.4.5 Copom", "dificuldade": "medio", "tipo": "mc", "enunciado": "Analistas de mercado leem com atenção o comunicado e a ata do Copom, mesmo quando a Selic é mantida. Por quê?", "alternativas": ["Porque a ata define a meta de inflação para os anos seguintes", "Porque o comunicado autoriza novas emissões de ações na bolsa", "Porque a ata informa a taxa que cada banco pagará nos CDBs", "Porque esses documentos trazem a avaliação do Banco Central sobre inflação, riscos e atividade e sinalizam os próximos passos, influenciando expectativas, a curva de juros e o preço dos ativos"], "correta": 3, "explicacao": "A comunicação do Copom é parte da política monetária: ao explicar a decisão e indicar como pode agir adiante, o BC orienta as expectativas. Os mercados reagem a esses sinais, ajustando juros futuros, câmbio e preços de ações, mesmo sem mudança imediata da Selic."}, {"id": "M1A-081", "modulo": 1, "topico": "1.2.4.6 Regime de metas para a inflação e expectativas inflacionárias", "dificuldade": "facil", "tipo": "mc", "enunciado": "No regime de metas para a inflação adotado no Brasil, a meta é definida com base em qual índice?", "alternativas": ["IPC-Fipe", "IPCA", "IGP-M", "INCC"], "correta": 1, "explicacao": "O índice de referência do regime de metas é o IPCA, calculado pelo IBGE e considerado o índice oficial de inflação do país. O IGP-M, da FGV, é muito usado em contratos (como aluguéis), mas não é a referência da meta."}, {"id": "M1A-082", "modulo": 1, "topico": "1.2.4.6 Regime de metas para a inflação e expectativas inflacionárias", "dificuldade": "medio", "tipo": "mc", "enunciado": "Considere o regime de meta contínua para a inflação, com meta de 3% e intervalo de tolerância de 1,5 ponto percentual. Se o IPCA acumulado em 12 meses estiver em 4,8%, é correto afirmar que a inflação está:", "alternativas": ["Exatamente no centro da meta", "Abaixo do piso do intervalo de tolerância, que é de 1,5%", "Acima do teto do intervalo de tolerância, que é de 4,5%", "Dentro do intervalo de tolerância, que vai até 5%"], "correta": 2, "explicacao": "Com meta de 3% e tolerância de 1,5 ponto percentual, o intervalo vai de 1,5% a 4,5%. Um IPCA de 4,8% em 12 meses está acima do teto. No regime contínuo, a inflação acumulada em 12 meses é acompanhada mês a mês, e não apenas no fechamento do ano-calendário."}, {"id": "M1A-083", "modulo": 1, "topico": "1.2.4.6 Regime de metas para a inflação e expectativas inflacionárias", "dificuldade": "dificil", "tipo": "mc", "enunciado": "No regime de meta contínua para a inflação, em vigor desde 2025, a meta é considerada descumprida quando a inflação acumulada em 12 meses permanece fora do intervalo de tolerância por seis meses consecutivos. Nesse caso, o Banco Central deve:", "alternativas": ["Explicar publicamente as razões do descumprimento, as medidas para trazer a inflação de volta e o prazo esperado, inclusive por carta aberta ao Ministro da Fazenda", "Solicitar ao CMN a elevação automática da meta para o nível da inflação observada", "Suspender as reuniões do Copom até que a inflação retorne ao intervalo", "Transferir ao Ministério da Fazenda a condução da política monetária até a inflação voltar à meta"], "correta": 0, "explicacao": "No sistema de meta contínua, o descumprimento ocorre quando a inflação em 12 meses fica fora do intervalo por seis meses seguidos. O BC deve então prestar contas publicamente, por meio de nota em seu relatório de política monetária e de carta aberta ao Ministro da Fazenda, com as causas, as providências e o prazo esperado de retorno. A meta não muda automaticamente."}, {"id": "M1A-084", "modulo": 1, "topico": "1.2.4.6 Regime de metas para a inflação e expectativas inflacionárias", "dificuldade": "medio", "tipo": "mc", "enunciado": "Por que o Banco Central acompanha de perto as expectativas de inflação de mercado, divulgadas semanalmente no Boletim Focus?", "alternativas": ["Porque o BC é obrigado a fixar a Selic igual à mediana das projeções do Focus", "Porque as expectativas de mercado não afetam a inflação efetiva, servindo apenas como estatística", "Porque o Boletim Focus define oficialmente a meta de inflação do ano", "Porque expectativas de inflação influenciam reajustes de preços, salários e contratos; expectativas desancoradas da meta exigem política monetária mais restritiva"], "correta": 3, "explicacao": "O Focus é uma pesquisa do BC com projeções de instituições de mercado. Se os agentes esperam inflação mais alta, tendem a reajustar preços e salários nessa direção, tornando a inflação mais persistente. Por isso, o BC busca ancorar as expectativas na meta, e expectativas desancoradas tendem a exigir juros mais altos por mais tempo."}, {"id": "M1A-085", "modulo": 1, "topico": "1.2.4.7 Relação entre meta Selic, taxa Selic e taxa do CDI", "dificuldade": "medio", "tipo": "mc", "enunciado": "Qual alternativa define corretamente a taxa Selic (efetiva ou 'over')?", "alternativas": ["É a taxa média ajustada das operações compromissadas de um dia lastreadas em títulos públicos federais, registradas no sistema Selic", "É a taxa média dos empréstimos interbancários de um dia sem lastro em títulos públicos, apurada pela B3", "É a taxa fixada pelo Copom a cada reunião, que vigora sem qualquer variação até a reunião seguinte", "É a taxa média cobrada pelos bancos nos empréstimos às pessoas físicas"], "correta": 0, "explicacao": "O Copom define a meta para a taxa Selic; a taxa Selic efetiva é apurada diariamente como a média ajustada das operações compromissadas de um dia com títulos públicos federais registradas no Selic, e o BC atua no mercado aberto para mantê-la próxima da meta. A média dos empréstimos interbancários de um dia é a taxa DI, calculada pela B3."}, {"id": "M1A-086", "modulo": 1, "topico": "1.2.4.7 Relação entre meta Selic, taxa Selic e taxa do CDI", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Em determinado dia, a meta Selic é de 10,50% a.a., a taxa Selic efetiva é de 10,40% a.a. e a taxa DI é de 10,40% a.a. Qual afirmação explica corretamente a relação entre essas taxas?", "alternativas": ["A taxa DI é sempre igual à meta Selic, por determinação do Copom", "A taxa Selic efetiva é mantida próxima da meta pelas operações de mercado aberto do BC, e a taxa DI, formada nos empréstimos interbancários de um dia, acompanha de perto a Selic efetiva", "A taxa DI é definida pela ANBIMA com base nas taxas de CDB oferecidas aos clientes", "A taxa Selic efetiva deveria ser idêntica à meta; qualquer diferença indica descumprimento da meta de inflação"], "correta": 1, "explicacao": "A meta é a referência definida pelo Copom; a Selic efetiva é a taxa apurada nas compromissadas com títulos públicos e oscila levemente em torno da meta. A taxa DI (base do 'CDI' usado como referência de aplicações), apurada pela B3 nas operações interbancárias de um dia, tende a ficar muito próxima da Selic efetiva, pois ambas refletem o custo do dinheiro de um dia."}, {"id": "M1A-087", "modulo": 1, "topico": "1.2.4.7 Relação entre meta Selic, taxa Selic e taxa do CDI", "dificuldade": "facil", "tipo": "mc", "enunciado": "Uma cliente tem um CDB pós-fixado que paga 100% do CDI. O Copom decide elevar a meta Selic em 0,50 ponto percentual. O que tende a acontecer com a rentabilidade do CDB dela?", "alternativas": ["Passa a ser corrigida pela inflação em vez do CDI", "Permanece igual até o vencimento, pois a taxa foi fixada na aplicação", "Tende a aumentar, pois a taxa DI acompanha a taxa Selic, que se ajusta à nova meta", "Tende a cair, pois a alta de juros desvaloriza títulos pós-fixados"], "correta": 2, "explicacao": "Como a taxa DI acompanha a Selic, uma alta da meta Selic eleva a taxa DI e, portanto, a rentabilidade de aplicações atreladas ao CDI. Por isso pós-fixados se beneficiam em ciclos de alta de juros, ao contrário dos prefixados, que perdem valor na marcação a mercado."}, {"id": "M1A-088", "modulo": 1, "topico": "1.2.5.1 Definição e objetivos da política cambial", "dificuldade": "medio", "tipo": "mc", "enunciado": "Em um dia de forte volatilidade, o Banco Central vende dólares no mercado à vista para reduzir oscilações bruscas da cotação. Essa atuação faz parte da política:", "alternativas": ["De rendas, que controla salários e preços administrados", "Monetária contracionista, por se tratar de alta da Selic", "Fiscal, que trata da arrecadação de tributos sobre importações", "Cambial, que envolve a atuação do governo e do BC sobre a taxa de câmbio e as transações com o exterior"], "correta": 3, "explicacao": "A política cambial reúne as ações que influenciam a taxa de câmbio e os fluxos de moeda estrangeira, executadas pelo Banco Central segundo as diretrizes do CMN. Intervenções com venda ou compra de dólares, leilões de linha e swaps cambiais são instrumentos típicos, usados no regime flutuante sobretudo para suavizar volatilidade."}, {"id": "M1A-089", "modulo": 1, "topico": "1.2.5.2 Regimes de taxas de câmbio, cupom cambial e reservas internacionais", "dificuldade": "medio", "tipo": "mc", "enunciado": "Qual alternativa descreve corretamente o regime cambial adotado no Brasil desde 1999?", "alternativas": ["Câmbio flutuante, em que a taxa é definida pelo mercado, com intervenções eventuais do Banco Central para conter volatilidade excessiva (flutuação 'suja')", "Bandas cambiais rígidas, com teto e piso alterados mensalmente pelo CMN", "Câmbio fixo, com o BC garantindo uma paridade de um real por dólar", "Câmbio fixo atrelado a uma cesta de moedas definida pelo Ministério da Fazenda"], "correta": 0, "explicacao": "Desde 1999 o Brasil adota câmbio flutuante: a cotação resulta da oferta e da demanda de moeda estrangeira. O BC pode intervir com vendas de dólares, leilões ou swaps para evitar movimentos disfuncionais, o que caracteriza uma flutuação administrada ('suja'), sem defender uma taxa específica."}, {"id": "M1A-090", "modulo": 1, "topico": "1.2.5.2 Regimes de taxas de câmbio, cupom cambial e reservas internacionais", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Sobre o regime de câmbio fixo, é correto afirmar que:", "alternativas": ["A taxa de câmbio é determinada livremente pelo mercado, sem qualquer atuação da autoridade monetária", "O banco central se compromete a comprar e vender moeda estrangeira a uma taxa definida, precisando de reservas suficientes e perdendo parte da autonomia para usar os juros com outros objetivos", "O banco central não precisa de reservas internacionais, pois a taxa é fixada por lei", "Permite que os juros internos sejam definidos sem qualquer relação com os juros externos e os fluxos de capital"], "correta": 1, "explicacao": "Para sustentar uma paridade fixa, o banco central deve estar sempre pronto a comprar ou vender moeda estrangeira, o que exige reservas e subordina a política de juros à defesa do câmbio. No câmbio flutuante, a taxa é determinada pelo mercado e a política monetária ganha autonomia."}, {"id": "M1A-091", "modulo": 1, "topico": "1.2.5.2 Regimes de taxas de câmbio, cupom cambial e reservas internacionais", "dificuldade": "medio", "tipo": "mc", "enunciado": "As reservas internacionais brasileiras são frequentemente citadas como um 'colchão de proteção' da economia. Sobre elas, é correto afirmar que:", "alternativas": ["São depósitos compulsórios dos bancos mantidos em reais no Banco Central", "São recursos do FGC aplicados no exterior para garantir depósitos em dólar", "São recursos do Tesouro destinados exclusivamente a pagar a dívida pública interna", "São ativos em moeda estrangeira administrados pelo Banco Central, como títulos de outros países, depósitos e ouro, que reduzem a vulnerabilidade a choques externos e podem ser usados em intervenções cambiais"], "correta": 3, "explicacao": "As reservas internacionais são ativos externos sob gestão do Banco Central, mantidos para honrar compromissos externos e enfrentar crises de liquidez em moeda estrangeira. Um volume elevado de reservas reduz a percepção de risco do país e dá ao BC capacidade de atuar no mercado de câmbio."}, {"id": "M1A-092", "modulo": 1, "topico": "1.2.5.2 Regimes de taxas de câmbio, cupom cambial e reservas internacionais", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Considere uma taxa DI de 12% ao ano e uma expectativa de desvalorização do real de 5% no mesmo período. Pela relação aproximada entre juros internos e variação cambial, o cupom cambial (taxa de juros em dólar no mercado doméstico) é de aproximadamente:", "alternativas": ["17,00% ao ano", "7,00% ao ano", "6,67% ao ano", "5,00% ao ano"], "correta": 2, "explicacao": "O cupom cambial é a taxa de juros em dólar obtida no Brasil, calculada descontando-se da taxa em reais a variação cambial esperada: (1 + 0,12) / (1 + 0,05) − 1 = 1,0667 − 1 ≈ 6,67% ao ano. A simples subtração (12% − 5% = 7%) é apenas uma aproximação e não considera a capitalização."}, {"id": "M1A-093", "modulo": 1, "topico": "1.2.5.3 Relação entre cupom cambial e investimentos", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Os juros internos sobem e o cupom cambial se eleva em relação às taxas de juros pagas em dólar no exterior. Qual efeito tende a ocorrer?", "alternativas": ["Aplicações no Brasil ficam mais atrativas para o capital estrangeiro, aumentando a entrada de dólares e favorecendo a valorização do real", "A alta do cupom cambial reduz automaticamente as reservas internacionais", "O cupom cambial não influencia fluxos de investimento, apenas o comércio exterior", "Os investidores estrangeiros retiram recursos do Brasil, provocando desvalorização do real"], "correta": 0, "explicacao": "O cupom cambial representa o retorno em dólar de aplicações no Brasil. Quando ele supera, com folga, os juros externos ajustados ao risco, o investimento no país fica mais atrativo, atraindo capital e pressionando o câmbio para baixo (valorização do real). Quando o cupom cai, o movimento tende a se inverter."}, {"id": "M1A-094", "modulo": 1, "topico": "1.2.5.4 Swap cambial", "dificuldade": "medio", "tipo": "mc", "enunciado": "Diante de uma forte desvalorização do real e de empresas buscando proteção para dívidas em dólar, o Banco Central oferta swaps cambiais tradicionais. Qual é o efeito dessa medida?", "alternativas": ["Eleva a demanda por dólares no mercado à vista, acelerando a desvalorização do real", "Oferece ao mercado proteção (hedge) contra a alta do dólar, equivalente a uma venda de dólares no mercado futuro, sem uso direto das reservas internacionais", "Corresponde a uma compra de dólares pelo BC no mercado futuro", "Reduz as reservas internacionais na mesma proporção dos contratos ofertados, pois o BC entrega dólares físicos"], "correta": 1, "explicacao": "No swap cambial tradicional, o BC paga ao mercado a variação cambial mais o cupom e recebe a taxa DI, operação liquidada em reais. Isso equivale a vender dólares no mercado futuro, oferecendo hedge e reduzindo a pressão sobre a cotação sem gastar reservas. A compra de dólar futuro corresponde ao swap reverso."}, {"id": "M1A-095", "modulo": 1, "topico": "1.2.5.4 Swap cambial", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Sobre os swaps cambiais operados pelo Banco Central, é correto afirmar que:", "alternativas": ["O swap reverso é usado para conter a alta do dólar, oferecendo hedge ao mercado", "Os swaps cambiais do BC são liquidados mediante entrega física de dólares", "No swap tradicional, o BC recebe a variação cambial e paga a taxa DI", "No swap reverso, o BC recebe a variação cambial e paga a taxa DI, o que equivale a uma compra de dólares no mercado futuro"], "correta": 3, "explicacao": "No swap tradicional o BC fica 'vendido' em dólar (paga variação cambial mais cupom e recebe DI), oferecendo hedge quando o dólar pressiona para cima. No swap reverso a posição se inverte: o BC fica 'comprado' em dólar, o que é útil quando há excesso de oferta de moeda estrangeira ou para reduzir o estoque de swaps tradicionais. Os contratos são liquidados financeiramente em reais."}, {"id": "M1A-096", "modulo": 1, "topico": "1.2.5.5 Taxa de câmbio nominal e real, PTAX, câmbio turismo e comercial", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Ao longo de um ano, a taxa de câmbio nominal permaneceu em R$ 5,00 por dólar. No mesmo período, a inflação no Brasil foi de 6% e nos Estados Unidos, de 2%. Em termos reais, é correto afirmar que:", "alternativas": ["Não houve alteração no câmbio real, já que o câmbio nominal ficou estável", "O real se desvalorizou em termos reais, pois a inflação brasileira foi maior", "O real se valorizou em termos reais, reduzindo a competitividade das exportações brasileiras", "O câmbio real passou a ser de R$ 5,20 por dólar, favorecendo as exportações"], "correta": 2, "explicacao": "O câmbio real ajusta o nominal pela diferença de inflação: 5,00 × (1,02 / 1,06) ≈ R$ 4,81, isto é, o dólar ficou mais 'barato' em termos reais. Como os preços brasileiros subiram mais que os americanos com o câmbio nominal parado, os produtos brasileiros ficaram relativamente mais caros: o real se valorizou em termos reais e as exportações perderam competitividade."}, {"id": "M1A-097", "modulo": 1, "topico": "1.2.5.5 Taxa de câmbio nominal e real, PTAX, câmbio turismo e comercial", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um contrato em dólar prevê liquidação em reais pela taxa PTAX. A pessoa investidora pergunta o que é essa taxa. A resposta correta é:", "alternativas": ["Taxa cobrada nas casas de câmbio para compra de dólar em espécie por turistas", "Taxa de juros em dólar paga nas aplicações cambiais no Brasil", "Taxa de referência calculada e divulgada pelo Banco Central a partir da média de cotações coletadas junto a instituições dealers ao longo do dia", "Taxa fixada pelo CMN mensalmente para todas as operações de comércio exterior"], "correta": 2, "explicacao": "A PTAX é a taxa de câmbio de referência apurada pelo Banco Central com base em consultas às instituições dealers em janelas ao longo do dia. É amplamente usada para liquidar contratos, derivativos e operações indexadas ao dólar. A taxa em casas de câmbio é o câmbio turismo, e a taxa de juros em dólar é o cupom cambial."}, {"id": "M1A-098", "modulo": 1, "topico": "1.2.5.5 Taxa de câmbio nominal e real, PTAX, câmbio turismo e comercial", "dificuldade": "facil", "tipo": "mc", "enunciado": "Antes de viajar, um cliente compara a cotação do dólar em espécie em uma casa de câmbio com a cotação do dólar comercial divulgada no noticiário e nota que a primeira é mais alta. Isso ocorre porque:", "alternativas": ["O câmbio turismo, usado por pessoas físicas em viagens, envolve custos de logística, menores volumes e spreads maiores que o câmbio comercial, usado em comércio exterior e operações financeiras", "O dólar comercial só pode ser comprado por bancos estrangeiros", "A casa de câmbio é obrigada a vender pela PTAX acrescida de 50%", "O câmbio turismo é fixado pelo Banco Central, e o comercial é livre"], "correta": 0, "explicacao": "O câmbio comercial é usado em importações, exportações e transações financeiras, com grandes volumes e spreads menores. O câmbio turismo atende pessoas físicas (espécie, cartões pré-pagos), com custos de transporte, armazenagem e segurança da moeda física e volumes menores, o que encarece a cotação. Ambos são livres no regime flutuante."}, {"id": "M1A-099", "modulo": 1, "topico": "1.2.6.1 Definição de PIB e seus principais componentes", "dificuldade": "facil", "tipo": "mc", "enunciado": "O Produto Interno Bruto (PIB) de um país corresponde a:", "alternativas": ["Total de tributos arrecadados pelo governo em um ano", "Soma do valor de todos os bens e serviços finais produzidos dentro do território do país em um período", "Soma do valor de todos os bens finais e intermediários vendidos no país, incluindo os importados", "Valor de mercado de todas as empresas listadas em bolsa"], "correta": 1, "explicacao": "O PIB mede a produção de bens e serviços finais dentro do território, em determinado período, e é calculado no Brasil pelo IBGE. Bens intermediários não são somados separadamente para evitar dupla contagem, e importações não são produção doméstica."}, {"id": "M1A-100", "modulo": 1, "topico": "1.2.6.1 Definição de PIB e seus principais componentes", "dificuldade": "medio", "tipo": "mc", "enunciado": "Em uma economia hipotética, em um ano: consumo das famílias = 700; investimento = 200; gastos do governo = 250; exportações = 150; importações = 120 (valores em bilhões). Pela ótica da despesa, o PIB é de:", "alternativas": ["1.300 bilhões", "1.420 bilhões", "1.150 bilhões", "1.180 bilhões"], "correta": 3, "explicacao": "Pela ótica da despesa, PIB = C + I + G + (X − M) = 700 + 200 + 250 + (150 − 120) = 1.150 + 30 = 1.180 bilhões. Somar as importações em vez de subtraí-las (o que daria 1.420) é o erro mais comum."}, {"id": "M1A-101", "modulo": 1, "topico": "1.2.6.1 Definição de PIB e seus principais componentes", "dificuldade": "dificil", "tipo": "mc", "enunciado": "O PIB nominal de um país cresceu 8% em um ano, e o deflator do PIB (variação dos preços) foi de 5% no mesmo período. O crescimento real aproximado da economia foi de:", "alternativas": ["8,00%", "13,40%", "3,00%", "2,86%"], "correta": 3, "explicacao": "O PIB real desconta o efeito dos preços: (1,08 / 1,05) − 1 = 1,0286 − 1 ≈ 2,86%. A subtração simples (8% − 5% = 3%) é apenas uma aproximação, e o crescimento nominal (8%) inclui o efeito da inflação, não representando aumento de produção."}, {"id": "M1A-102", "modulo": 1, "topico": "1.2.6.2 Definições e aplicações de IPCA, IGP-M, IPA e IPC-Fipe", "dificuldade": "facil", "tipo": "mc", "enunciado": "Sobre o IPCA, é correto afirmar que:", "alternativas": ["É calculado pelo IBGE, mede a variação de preços ao consumidor para famílias com renda de 1 a 40 salários mínimos e é o índice oficial de inflação do país", "É calculado pela FGV e tem forte peso de preços no atacado", "Mede a variação dos custos da construção civil", "Mede apenas os preços da cidade de São Paulo"], "correta": 0, "explicacao": "O IPCA, do IBGE, abrange famílias com renda de 1 a 40 salários mínimos em diversas regiões do país e é a referência do regime de metas para a inflação. Os índices da FGV (como o IGP-M) têm peso relevante do atacado, e o índice restrito à cidade de São Paulo é o IPC-Fipe."}, {"id": "M1A-103", "modulo": 1, "topico": "1.2.6.2 Definições e aplicações de IPCA, IGP-M, IPA e IPC-Fipe", "dificuldade": "medio", "tipo": "mc", "enunciado": "Em um ano de forte desvalorização do real e alta das commodities, o reajuste de um contrato de aluguel pelo IGP-M foi muito maior do que a variação do IPCA. A principal explicação é:", "alternativas": ["O IPCA exclui alimentos e energia, por isso varia menos", "O IGP-M tem cerca de 60% de peso do IPA (preços ao produtor), muito sensível ao câmbio e às commodities, enquanto o IPCA mede somente preços ao consumidor", "O IGP-M é calculado apenas com preços de aluguéis residenciais", "O IGP-M é calculado pelo IBGE com uma amostra menor de cidades"], "correta": 1, "explicacao": "O IGP-M, calculado pela FGV, é composto por IPA (60%), IPC (30%) e INCC (10%). Como o IPA reflete preços ao produtor, incluindo commodities e bens cotados em dólar, choques cambiais afetam muito mais o IGP-M do que o IPCA. Por isso os dois índices podem divergir bastante em determinados períodos."}, {"id": "M1A-104", "modulo": 1, "topico": "1.2.6.2 Definições e aplicações de IPCA, IGP-M, IPA e IPC-Fipe", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um analista quer acompanhar um indicador de preços no nível do produtor, que costuma antecipar pressões que mais tarde chegam ao consumidor. O índice adequado é o:", "alternativas": ["INPC", "IPC-Fipe", "IPA", "IPCA"], "correta": 2, "explicacao": "O IPA (Índice de Preços ao Produtor Amplo), da FGV, mede variações de preços de produtos agropecuários e industriais nas transações entre produtores. Variações no IPA tendem a ser repassadas, com defasagem, aos preços ao consumidor. IPC-Fipe, IPCA e INPC são índices de preços ao consumidor."}, {"id": "M1A-105", "modulo": 1, "topico": "1.2.6.2 Definições e aplicações de IPCA, IGP-M, IPA e IPC-Fipe", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma empresa paulistana quer usar, em sua política interna de reajustes, um índice de preços ao consumidor específico do município de São Paulo, calculado por uma fundação ligada à USP. Esse índice é o:", "alternativas": ["IPCA", "IPA", "IPC-Fipe", "IGP-M"], "correta": 2, "explicacao": "O IPC-Fipe, calculado pela Fundação Instituto de Pesquisas Econômicas, mede a variação de preços ao consumidor no município de São Paulo. O IPCA tem abrangência nacional, e IGP-M e IPA são índices da FGV com forte peso de preços ao produtor."}, {"id": "M1A-106", "modulo": 1, "topico": "1.2.6.2 Definições e aplicações de IPCA, IGP-M, IPA e IPC-Fipe", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Uma aplicação rendeu 10% em 12 meses, período em que o IPCA foi de 4%. A rentabilidade real aproximada da aplicação foi de:", "alternativas": ["6,00%", "5,77%", "14,40%", "4,00%"], "correta": 1, "explicacao": "A rentabilidade real desconta a inflação pela fórmula de Fisher: (1,10 / 1,04) − 1 = 1,0577 − 1 ≈ 5,77%. A subtração simples (10% − 4% = 6%) superestima o ganho real. Esse cálculo mostra como os índices de preços são usados para avaliar o poder de compra preservado por um investimento."}, {"id": "M1A-107", "modulo": 1, "topico": "1.2.6.3 Taxa de desemprego e seu impacto na economia", "dificuldade": "medio", "tipo": "mc", "enunciado": "Na PNAD Contínua do IBGE, uma pessoa que está sem trabalho e desistiu de procurar emprego porque acredita que não encontrará vaga é classificada como:", "alternativas": ["Ocupada, pois não está procurando trabalho", "Subocupada por insuficiência de horas", "Desocupada, aumentando a taxa de desemprego", "Fora da força de trabalho (desalentada), não entrando no cálculo da taxa de desocupação"], "correta": 3, "explicacao": "A taxa de desocupação considera desocupadas apenas as pessoas sem trabalho que procuraram emprego e estavam disponíveis; ela é a razão entre desocupados e força de trabalho. Quem desistiu de procurar por desalento fica fora da força de trabalho, por isso a taxa de desemprego pode cair mesmo sem criação de vagas."}, {"id": "M1A-108", "modulo": 1, "topico": "1.2.6.3 Taxa de desemprego e seu impacto na economia", "dificuldade": "medio", "tipo": "mc", "enunciado": "A taxa de desemprego cai a níveis historicamente baixos, com economia aquecida e salários subindo acima da produtividade. Qual é a implicação mais provável para a política monetária?", "alternativas": ["Maior pressão inflacionária, especialmente em serviços, o que pode levar o Banco Central a manter ou elevar a taxa Selic", "Necessidade de reduzir o compulsório para ampliar o crédito", "Nenhum efeito, pois desemprego e inflação não se relacionam", "Queda da inflação, permitindo cortes rápidos de juros"], "correta": 0, "explicacao": "Mercado de trabalho apertado aumenta a renda e a demanda e pressiona salários, que se transmitem aos preços, sobretudo de serviços. Esse quadro tende a exigir política monetária mais restritiva. Já o desemprego elevado reduz consumo e pressões inflacionárias."}, {"id": "M1A-109", "modulo": 1, "topico": "1.2.6.4 Taxa básica de juros (Selic), Taxa DI e Taxa Referencial (TR)", "dificuldade": "facil", "tipo": "mc", "enunciado": "Um cliente quer aplicar em um título público pós-fixado que acompanha a taxa básica de juros da economia. O título adequado e seu indexador são:", "alternativas": ["Tesouro IPCA+ (NTN-B), que acompanha a taxa DI", "Tesouro Prefixado (LTN), que acompanha a TR", "Tesouro Selic (LFT), que acompanha a taxa Selic", "Tesouro Selic (LFT), que acompanha o IGP-M"], "correta": 2, "explicacao": "A Selic é a taxa básica de juros da economia, referência para as demais taxas e indexador do Tesouro Selic (LFT). O Tesouro Prefixado tem taxa fixa e o Tesouro IPCA+ paga IPCA mais uma taxa real."}, {"id": "M1A-110", "modulo": 1, "topico": "1.2.6.4 Taxa básica de juros (Selic), Taxa DI e Taxa Referencial (TR)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Com a taxa Selic acima de 8,5% ao ano, um cliente pergunta como sua poupança é remunerada e o que é a TR. A resposta correta é:", "alternativas": ["A poupança rende 0,5% ao mês mais a TR, taxa calculada pelo Banco Central que também corrige o FGTS e alguns financiamentos habitacionais e que pode ser zero", "A poupança rende 0,5% ao mês mais IPCA, e a TR deixou de existir", "A poupança rende 100% do CDI, e a TR é um índice de inflação calculado pelo IBGE", "A poupança rende 70% da Selic mais a TR, e a TR é a própria taxa DI"], "correta": 0, "explicacao": "Com a Selic acima de 8,5% a.a., a poupança paga 0,5% ao mês mais a TR; com Selic igual ou inferior a 8,5%, paga 70% da Selic mais a TR. A TR é calculada pelo Banco Central a partir das taxas de juros de mercado e é usada na poupança, no FGTS e em contratos habitacionais; em cenários de juros mais baixos, ela pode ficar zerada."}, {"id": "M1A-111", "modulo": 1, "topico": "1.2.6.4 Taxa básica de juros (Selic), Taxa DI e Taxa Referencial (TR)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Sobre a taxa DI, é correto afirmar que:", "alternativas": ["É calculada pelo IBGE e mede a inflação ao consumidor", "É apurada pela B3 a partir das operações de empréstimo interbancário de um dia e serve de referência para CDBs, fundos DI e outros produtos pós-fixados", "É a taxa usada exclusivamente para corrigir a poupança", "É definida pelo Copom a cada reunião e vale para todos os títulos públicos"], "correta": 1, "explicacao": "A taxa DI resulta das operações interbancárias de um dia (com lastro em depósitos interfinanceiros, os DI/CDI) e é divulgada pela B3. É a principal referência de rentabilidade de aplicações pós-fixadas, como CDB, LCI, LCA e fundos DI, e se mantém próxima da taxa Selic."}, {"id": "M1A-112", "modulo": 1, "topico": "1.2.7 Risco de liquidez, crédito e mercado", "dificuldade": "facil", "tipo": "mc", "enunciado": "Uma cliente aplicou toda a sua reserva de emergência em um CDB sem liquidez diária com vencimento em três anos. Seis meses depois, precisou do dinheiro e não conseguiu resgatar. A qual risco ela estava exposta?", "alternativas": ["Risco de mercado", "Risco de crédito", "Risco cambial", "Risco de liquidez"], "correta": 3, "explicacao": "Risco de liquidez é a dificuldade de transformar um ativo em dinheiro no momento desejado sem perda significativa de valor. Um CDB sem liquidez antes do vencimento não é adequado para reserva de emergência, independentemente da solidez do banco emissor."}, {"id": "M1A-113", "modulo": 1, "topico": "1.2.7 Risco de liquidez, crédito e mercado", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma pessoa investidora comprou debêntures de uma empresa que, meses depois, entrou em recuperação judicial e suspendeu o pagamento de juros. O risco que se materializou foi o:", "alternativas": ["Risco de crédito", "Risco de mercado", "Risco de liquidez", "Risco operacional da corretora"], "correta": 0, "explicacao": "Risco de crédito é a possibilidade de o emissor ou a contraparte não honrar os pagamentos prometidos (juros ou principal), total ou parcialmente. Debêntures não têm garantia do FGC, de modo que esse risco é assumido diretamente pela pessoa investidora."}, {"id": "M1A-114", "modulo": 1, "topico": "1.2.7 Risco de liquidez, crédito e mercado", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente comprou um título Tesouro Prefixado e precisou vendê-lo antes do vencimento, logo após uma alta forte dos juros de mercado, recebendo menos do que investiu. Essa perda decorre do:", "alternativas": ["Risco de liquidez do Tesouro Direto", "Risco de mercado", "Risco de crédito", "Risco de inadimplência do Tesouro Nacional"], "correta": 1, "explicacao": "Risco de mercado é a possibilidade de perda por oscilações de preços de ativos causadas por variações de juros, câmbio, ações ou commodities. Com a alta dos juros, o preço do prefixado cai na marcação a mercado; quem vende antes do vencimento realiza essa perda. Não houve calote do emissor, nem falta de comprador."}, {"id": "M1A-115", "modulo": 1, "topico": "1.2.7 Risco de liquidez, crédito e mercado", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Assinale a associação correta entre o investimento e o risco que mais o caracteriza:", "alternativas": ["Ações de pequena empresa com poucos negócios diários – liquidez; CDB de R$ 600 mil em um único banco médio – liquidez; Tesouro Prefixado longo – crédito", "Ações de pequena empresa com poucos negócios diários – mercado apenas; CDB de R$ 600 mil em um único banco médio – nenhum risco, por ter FGC; Tesouro Prefixado longo – crédito", "Ações de pequena empresa com poucos negócios diários – crédito; CDB de R$ 600 mil em um único banco médio – mercado; Tesouro Prefixado longo – liquidez", "Ações de pequena empresa com poucos negócios diários – liquidez; CDB de R$ 600 mil em um único banco médio – crédito; Tesouro Prefixado longo – mercado"], "correta": 3, "explicacao": "Ações com baixo volume de negócios podem ser difíceis de vender sem afetar o preço (risco de liquidez). Um CDB que supera o limite de R$ 250 mil do FGC expõe a parcela excedente ao risco de crédito do banco. Um prefixado longo é muito sensível a variações de juros (risco de mercado). Todos os ativos têm algum risco de mercado, mas a associação pedida é a do risco predominante."}, {"id": "M1A-116", "modulo": 1, "topico": "1.2.7 Risco de liquidez, crédito e mercado", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um banco financia empréstimos imobiliários de 20 anos com recursos captados em depósitos que podem ser sacados a qualquer momento. Em um cenário de saques elevados, o banco pode não ter caixa suficiente para honrar os resgates. Esse descasamento expõe o banco principalmente ao:", "alternativas": ["Risco de crédito", "Risco cambial", "Risco de liquidez", "Risco de mercado de ações"], "correta": 2, "explicacao": "O descasamento entre prazos de ativos (empréstimos longos) e passivos (captações de curto prazo) gera risco de liquidez para a instituição: ela pode não conseguir cumprir obrigações no vencimento sem vender ativos com perda ou captar a custo elevado. O risco de crédito, por sua vez, refere-se à inadimplência dos tomadores."}, {"id": "M1B-001", "modulo": 1, "topico": "1.3.1 Taxa de juros nominal e taxa de juros real", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma pessoa investidora aplicou em um CDB prefixado que rendeu 11,3% em um ano. No mesmo período, a inflação medida pelo IPCA foi de 5%. Qual foi, aproximadamente, a taxa de juros real obtida?", "alternativas": ["6,00%", "5,70%", "6,30%", "16,87%"], "correta": 0, "explicacao": "Pela relação de Fisher, (1 + nominal) = (1 + real) × (1 + inflação). Assim, 1,113 / 1,05 = 1,06, ou seja, juros reais de 6,00%. Subtrair simplesmente a inflação da taxa nominal (11,3% − 5% = 6,3%) é apenas uma aproximação, que superestima o ganho real."}, {"id": "M1B-002", "modulo": 1, "topico": "1.3.2 Capitalização simples versus capitalização composta (equivalência)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente compara um empréstimo que cobra 2% ao mês, juros compostos, com outro que informa sua taxa ao ano. Qual é a taxa anual equivalente a 2% ao mês no regime composto?", "alternativas": ["24,00% ao ano", "26,82% ao ano", "25,34% ao ano", "22,00% ao ano"], "correta": 1, "explicacao": "Taxas equivalentes no regime composto produzem o mesmo montante no mesmo prazo: (1 + i anual) = (1,02)^12 = 1,2682, ou 26,82% ao ano. Multiplicar 2% por 12 (24%) dá a taxa proporcional, que só é equivalente no regime de juros simples."}, {"id": "M1B-003", "modulo": 1, "topico": "1.3.3.1 Pagamento de amortização e juros dos ativos de crédito privado", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma debênture tem valor nominal de R$ 1.000,00, juros de 10% ao ano sobre o saldo devedor pagos anualmente e amortização de 25% do valor nominal ao final de cada ano, por 4 anos. Quanto a pessoa investidora receberá, por debênture, ao final do 2º ano?", "alternativas": ["R$ 100,00", "R$ 275,00", "R$ 325,00", "R$ 350,00"], "correta": 2, "explicacao": "Após o 1º ano, o saldo devedor cai para R$ 750,00 (1.000 − 250). No 2º ano, os juros incidem sobre esse saldo: 750 × 10% = R$ 75,00, somados à amortização de R$ 250,00, totalizando R$ 325,00. Calcular os juros sobre o valor nominal original (R$ 100) ignora que parte do principal já foi devolvida."}, {"id": "M1B-004", "modulo": 1, "topico": "1.3.3.2.1 Fluxo de pagamentos: relações e conceitos", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente pode receber R$ 10.000,00 hoje ou R$ 10.500,00 daqui a 6 meses. Ele consegue aplicar seus recursos a 1% ao mês (juros compostos), com risco semelhante. Qual a decisão financeiramente mais vantajosa?", "alternativas": ["Receber R$ 10.500,00 em 6 meses, pois 5% é maior que 1% ao mês", "As alternativas são indiferentes, pois a diferença é de apenas 5%", "Receber R$ 10.500,00 em 6 meses, pois é um valor nominal maior", "Receber R$ 10.000,00 hoje, pois R$ 10.500,00 em 6 meses valem cerca de R$ 9.891 hoje"], "correta": 3, "explicacao": "Valores em datas diferentes só podem ser comparados depois de levados à mesma data. Trazendo R$ 10.500 a valor presente: 10.500 / 1,01^6 ≈ R$ 9.891, menor que R$ 10.000. Outra forma: R$ 10.000 aplicados a 1% ao mês viram cerca de R$ 10.615 em 6 meses, mais que R$ 10.500."}, {"id": "M1B-005", "modulo": 1, "topico": "1.3.3.2.3 Valor Presente, Valor Futuro e Valor Presente Líquido (VPL)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma empresa avalia um projeto que exige investimento de R$ 10.000,00 hoje e gera entradas de R$ 6.000,00 ao final do 1º e do 2º ano. Com taxa mínima de atratividade de 10% ao ano, o VPL do projeto e a decisão coerente são:", "alternativas": ["VPL ≈ −R$ 413,22; rejeitar o projeto, pois o VPL é negativo", "VPL ≈ R$ 413,22; aceitar o projeto, pois o VPL é positivo", "VPL = R$ 0,00; o projeto é indiferente", "VPL = R$ 2.000,00; aceitar o projeto, pois as entradas superam o investimento"], "correta": 1, "explicacao": "VPL = −10.000 + 6.000/1,1 + 6.000/1,1² = −10.000 + 5.454,55 + 4.958,68 ≈ R$ 413,22. VPL positivo significa que o projeto remunera acima da taxa mínima exigida e cria valor. Somar fluxos sem descontá-los (R$ 2.000) ignora o valor do dinheiro no tempo."}, {"id": "M1B-006", "modulo": 1, "topico": "1.3.3.3 Taxa de desconto", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um título prefixado pagará R$ 1.000,00 daqui a um ano. Se a taxa de mercado usada para descontá-lo subir de 10% para 12% ao ano, o preço do título:", "alternativas": ["cai de cerca de R$ 909,09 para cerca de R$ 892,86", "sobe de cerca de R$ 892,86 para cerca de R$ 909,09", "permanece em R$ 1.000,00, pois o valor de resgate não muda", "cai exatamente 2%, acompanhando a variação da taxa"], "correta": 0, "explicacao": "O preço é o valor presente do fluxo: 1.000/1,10 ≈ R$ 909,09 e 1.000/1,12 ≈ R$ 892,86. Taxa de desconto e preço se movem em sentidos opostos: quando a taxa sobe, o valor presente cai. A queda foi de cerca de 1,8%, não exatamente igual à variação da taxa."}, {"id": "M1B-007", "modulo": 1, "topico": "1.3.3.4 Taxa bruta versus taxa líquida de impostos", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Para um prazo de 1 ano (365 dias), uma cliente compara uma LCI isenta de IR que paga 8,25% com um CDB tributado. Qual a rentabilidade bruta mínima que o CDB precisa oferecer para empatar com a LCI?", "alternativas": ["9,71%", "8,25%", "10,00%", "9,49%"], "correta": 2, "explicacao": "O CDB com prazo de 365 dias tem IR de 17,5% sobre o rendimento. Para empatar: bruto × (1 − 0,175) = 8,25%, logo bruto = 8,25% / 0,825 = 10,00%. O valor 9,71% resultaria de usar 15%, alíquota que só vale acima de 720 dias."}, {"id": "M1B-008", "modulo": 1, "topico": "1.3.3.5.1 Prazo médio e vencimento", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma debênture vence em 4 anos e amortiza 50% do principal ao final do 2º ano e 50% ao final do 4º ano. O prazo médio de amortização do principal e o vencimento são, respectivamente:", "alternativas": ["2 anos e 4 anos", "3 anos e 3 anos", "4 anos e 4 anos", "3 anos e 4 anos"], "correta": 3, "explicacao": "Prazo médio = soma dos prazos ponderados pela proporção do principal pago em cada data: 0,5 × 2 + 0,5 × 4 = 3 anos. O vencimento é a data do último pagamento, 4 anos. Em títulos com amortizações intermediárias, o prazo médio é menor que o vencimento."}, {"id": "M1B-009", "modulo": 1, "topico": "1.3.3.5.2 Taxa Interna de Retorno (TIR)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um diretor financeiro compara a TIR de um projeto, de 14% ao ano, com a taxa mínima de atratividade da empresa, de 11% ao ano. Sobre a TIR e essa comparação, é correto afirmar que:", "alternativas": ["a TIR é a taxa que zera o VPL; sendo maior que a taxa mínima, o projeto tende a ser aceito", "a TIR só pode ser calculada para projetos com um único fluxo de entrada", "a TIR é a taxa que maximiza o VPL; deve ser sempre menor que a taxa mínima", "a TIR considera que os fluxos intermediários são reinvestidos à taxa livre de risco"], "correta": 0, "explicacao": "A TIR é a taxa de desconto que torna o VPL igual a zero. Se a TIR supera a taxa mínima de atratividade, o VPL calculado a essa taxa mínima é positivo e o projeto cria valor. O método pressupõe reinvestimento dos fluxos intermediários à própria TIR, não à taxa livre de risco."}, {"id": "M1B-010", "modulo": 1, "topico": "1.3.3.5.3 Conceito de custo de oportunidade", "dificuldade": "facil", "tipo": "mc", "enunciado": "Um cliente mantém R$ 100.000,00 parados em conta corrente sem remuneração durante um ano, embora pudesse aplicá-los em um título de baixo risco que rende 10% ao ano. O custo de oportunidade dessa decisão foi de aproximadamente:", "alternativas": ["o valor da tarifa da conta corrente no período", "zero, pois o cliente não teve nenhuma perda nominal", "R$ 100.000,00, pois todo o valor ficou sem rendimento", "R$ 10.000,00 brutos, valor que deixou de ser ganho na melhor alternativa disponível"], "correta": 3, "explicacao": "Custo de oportunidade é o retorno que se deixa de obter ao escolher uma alternativa em vez da melhor opção disponível de risco semelhante. Aqui: 100.000 × 10% = R$ 10.000 brutos. Não há perda nominal, mas há perda econômica (e, com inflação, também de poder de compra)."}, {"id": "M1B-011", "modulo": 1, "topico": "1.3.3.5.4 Conceito de taxa livre de risco", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um título público federal prefixado paga 11% ao ano; uma debênture de prazo semelhante paga 13% ao ano. Sobre a diferença de 2 pontos percentuais, a interpretação mais adequada é:", "alternativas": ["decorre de a debênture ter garantia do FGC, ao contrário do título público", "é um prêmio exigido pelos riscos adicionais da debênture, como risco de crédito e de liquidez, em relação à taxa livre de risco", "é um ganho sem risco adicional, já que ambas são títulos de renda fixa", "indica que o título público tem risco de crédito maior que a debênture"], "correta": 1, "explicacao": "A taxa do título público funciona como referência livre de risco. O excedente pago pela debênture (spread) remunera riscos que o título público não tem, principalmente o de crédito do emissor privado e o de menor liquidez. Debêntures não têm cobertura do FGC."}, {"id": "M1B-012", "modulo": 1, "topico": "1.3.3.5.5 Conceito de Custo Médio Ponderado de Capital (CMPC)", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Uma empresa financia-se com 60% de capital próprio, cujo custo é de 15% ao ano, e 40% de dívida, com custo de 10% ao ano antes do IR. Considerando alíquota de IR/CSLL de 34% (os juros são dedutíveis), o CMPC da empresa é de:", "alternativas": ["10,36% ao ano", "13,00% ao ano", "11,64% ao ano", "12,50% ao ano"], "correta": 2, "explicacao": "CMPC = %capital próprio × custo próprio + %dívida × custo da dívida × (1 − IR) = 0,6 × 15% + 0,4 × 10% × 0,66 = 9% + 2,64% = 11,64%. Desconsiderar o benefício fiscal dos juros leva a 13%, superestimando o custo de capital."}, {"id": "M1B-013", "modulo": 1, "topico": "1.3.3.5.6 Duration versus prazo", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Um fundo de renda fixa tem carteira prefixada com duration modificada de 4 anos. Se as taxas de juros de mercado subirem 1 ponto percentual de forma paralela, o efeito aproximado sobre o valor da carteira será:", "alternativas": ["queda de cerca de 1%", "alta de cerca de 4%", "nenhum efeito, se os títulos forem levados ao vencimento", "queda de cerca de 4%"], "correta": 3, "explicacao": "Pela aproximação da duration modificada, variação de preço ≈ −Dmod × variação da taxa = −4 × 1% = −4%. Quanto maior a duration, maior a sensibilidade do preço a mudanças nos juros. Mesmo que os títulos sejam carregados ao vencimento, o fundo marca a carteira a mercado e a cota reflete a queda."}, {"id": "M1B-014", "modulo": 1, "topico": "1.3.3.5.6.1 Alavancagem financeira, custos de captações (dívidas e/ou capital)", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Uma empresa tem ativos de R$ 1.000 e lucro operacional de R$ 150 por ano (15%). Hoje, é financiada só com capital próprio. Se passar a financiar metade dos ativos com dívida a 10% ao ano (ignore impostos), o retorno sobre o capital próprio passará de:", "alternativas": ["15% para 30%", "15% para 10%", "15% para 20%", "15% para 15%"], "correta": 2, "explicacao": "Sem dívida: 150 / 1.000 = 15%. Com R$ 500 de dívida a 10%, os juros são R$ 50 e o lucro cai para R$ 100, mas o capital próprio passa a ser R$ 500: 100 / 500 = 20%. A alavancagem é favorável porque o ativo rende (15%) mais que o custo da dívida (10%)."}, {"id": "M1B-015", "modulo": 1, "topico": "1.3.3.6.2 Retorno esperado de uma carteira", "dificuldade": "facil", "tipo": "mc", "enunciado": "Uma carteira tem 60% aplicados no ativo A, com retorno esperado de 12% ao ano, e 40% no ativo B, com retorno esperado de 7% ao ano. O retorno esperado da carteira é de:", "alternativas": ["19,0% ao ano", "10,0% ao ano", "9,5% ao ano", "12,0% ao ano"], "correta": 1, "explicacao": "O retorno esperado de uma carteira é a média dos retornos esperados dos ativos ponderada pela participação de cada um: 0,6 × 12% + 0,4 × 7% = 7,2% + 2,8% = 10,0%. A média simples (9,5%) ignora que A tem peso maior."}, {"id": "M1B-016", "modulo": 1, "topico": "1.3.4.2 Taxas prefixada e pós-fixada", "dificuldade": "facil", "tipo": "mc", "enunciado": "Um cliente acredita que os juros básicos da economia vão subir de forma relevante nos próximos meses e quer que sua aplicação de renda fixa acompanhe esse movimento. A opção mais aderente à expectativa dele é:", "alternativas": ["um título pós-fixado atrelado ao CDI ou à Selic", "manter os recursos em conta corrente até a alta dos juros", "um título prefixado de longo prazo", "um título prefixado sem cupom com vencimento em 10 anos"], "correta": 0, "explicacao": "No título pós-fixado, a remuneração acompanha o indexador (CDI ou Selic); se os juros sobem, o rendimento sobe junto. O prefixado trava a taxa no momento da aplicação, e seu preço de mercado cai quando os juros sobem, especialmente nos prazos longos."}, {"id": "M1B-017", "modulo": 1, "topico": "1.3.5 Taxa de desconto comercial", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma empresa desconta uma duplicata de valor nominal R$ 10.000,00, com vencimento em 60 dias, à taxa de desconto comercial simples de 3% ao mês. Qual o valor líquido recebido (sem outras tarifas)?", "alternativas": ["R$ 9.409,00", "R$ 9.433,96", "R$ 9.400,00", "R$ 9.700,00"], "correta": 2, "explicacao": "No desconto comercial (por fora), o desconto incide sobre o valor nominal: D = 10.000 × 0,03 × 2 = R$ 600,00; valor líquido = R$ 9.400,00. O valor de R$ 9.433,96 resultaria do desconto racional (por dentro), calculado sobre o valor atual."}, {"id": "M1B-018", "modulo": 1, "topico": "1.3.6 Prazo de retorno (payback)", "dificuldade": "facil", "tipo": "mc", "enunciado": "Uma empresa investe R$ 120.000,00 em um equipamento que gera economia de caixa de R$ 30.000,00 por ano. Qual o payback simples do investimento?", "alternativas": ["3 anos", "4 anos", "2,5 anos", "5 anos"], "correta": 1, "explicacao": "O payback simples é o tempo necessário para que os fluxos de caixa acumulados recuperem o investimento: 120.000 / 30.000 = 4 anos. Essa medida não considera o valor do dinheiro no tempo."}, {"id": "M1B-019", "modulo": 1, "topico": "1.3.7 Sistemas de amortização (SAC e Price)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente vai financiar um imóvel e quer prestações iguais durante todo o contrato. O gerente apresenta a Tabela Price e o SAC, com mesma taxa e prazo. É correto informar que:", "alternativas": ["na Price as prestações são constantes, com amortização crescente e juros decrescentes; no SAC a primeira prestação é maior, mas o total de juros pago é menor", "no SAC as prestações são constantes e a amortização é crescente", "na Price a amortização é constante e as prestações são decrescentes", "os dois sistemas resultam no mesmo total de juros pagos"], "correta": 0, "explicacao": "Na Price, a prestação é fixa; no início ela é composta por mais juros e menos amortização, e isso se inverte ao longo do tempo. No SAC, a amortização é constante e as prestações caem. Como o SAC amortiza mais rápido no início, o saldo devedor cai mais depressa e o total de juros é menor."}, {"id": "M1B-020", "modulo": 1, "topico": "1.3.8 Aplicabilidade do desconto bancário na antecipação de recebíveis", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um lojista antecipa R$ 20.000,00 em recebíveis de cartão que venceriam em 30 dias. O banco aplica desconto bancário simples de 2% ao mês sobre o valor nominal, mais taxa administrativa de 0,5% sobre o valor nominal. Quanto o lojista recebe (desconsidere tributos)?", "alternativas": ["R$ 19.900,00", "R$ 19.512,20", "R$ 19.600,00", "R$ 19.500,00"], "correta": 3, "explicacao": "Desconto bancário = desconto comercial + taxa administrativa, ambos sobre o valor nominal: 20.000 × (2% + 0,5%) = R$ 500. Valor líquido = R$ 19.500. Considerar apenas o desconto comercial (R$ 19.600) ignora a taxa administrativa cobrada pelo banco."}, {"id": "M1B-021", "modulo": 1, "topico": "1.4.1 Principais Infraestruturas do Mercado Financeiro (IMFs) e função de gatekeepers", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma registradora recusa o registro de um lote de títulos de crédito porque as informações enviadas pela instituição emissora estão inconsistentes com o lastro informado. Essa atuação ilustra:", "alternativas": ["a função de garantidora de crédito, pela qual a registradora assume o risco do emissor", "uma atuação indevida, pois IMFs apenas armazenam dados, sem verificar sua consistência", "a função de gatekeeper das IMFs, que controlam o acesso de participantes, ativos e operações ao mercado e ajudam a coibir irregularidades", "a função de política monetária, que cabe às IMFs em conjunto com o Copom"], "correta": 2, "explicacao": "Infraestruturas do Mercado Financeiro (sistemas de pagamento e de liquidação, contrapartes centrais, depositários centrais e registradoras) funcionam como gatekeepers (\"porteiros\"): definem regras de acesso, verificam ativos e operações e monitoram participantes, contribuindo para a integridade do mercado. Elas não fazem política monetária nem garantem o crédito do emissor."}, {"id": "M1B-022", "modulo": 1, "topico": "1.4.1.1.1 Sistema de Pagamentos Brasileiro (SPB)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Na reestruturação do Sistema de Pagamentos Brasileiro de 2002, foi implantado o STR (Sistema de Transferência de Reservas), operado pelo Banco Central. A principal característica e o objetivo dessa mudança foram:", "alternativas": ["permitir que as contas Reservas Bancárias ficassem negativas ao longo do dia sem limite", "liquidação bruta em tempo real, operação por operação, reduzindo riscos de liquidação e o risco sistêmico", "transferir à CVM a responsabilidade pela liquidação das transferências interbancárias", "compensação das operações apenas no dia útil seguinte, para reduzir custos"], "correta": 1, "explicacao": "Com o STR, as transferências entre contas Reservas Bancárias passaram a ser liquidadas de forma bruta e em tempo real (LBTR), de modo final e irrevogável, desde que haja saldo. A reforma reduziu os riscos de liquidação e sistêmico, inclusive os assumidos pelo Banco Central, que deixou de admitir saldos negativos nas contas de reservas."}, {"id": "M1B-023", "modulo": 1, "topico": "1.4.1.1.2 Sistema de Pagamentos Instantâneos (SPI)", "dificuldade": "facil", "tipo": "mc", "enunciado": "Uma cliente pergunta como um Pix enviado às 23h de um domingo chega à conta do recebedor em poucos segundos. A explicação correta é que o Pix é liquidado:", "alternativas": ["no SPI, infraestrutura operada pelo Banco Central que liquida as transações de forma bruta, em tempo real, 24 horas por dia, todos os dias", "pela compensação de cheques, no primeiro dia útil seguinte", "pela B3, que atua como contraparte central entre os bancos", "pelos próprios bancos, sem participação do Banco Central, e só se confirma no dia útil seguinte"], "correta": 0, "explicacao": "O Sistema de Pagamentos Instantâneos (SPI) é a infraestrutura centralizada de liquidação do Pix, operada pelo Banco Central. A liquidação ocorre transação a transação, em tempo real e de forma ininterrupta, entre contas mantidas pelos participantes no Banco Central."}, {"id": "M1B-024", "modulo": 1, "topico": "1.4.1.2.1 Sistema Especial de Liquidação e Custódia (Selic) / 1.4.6 B3, Selic e suas responsabilidades", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma instituição mantém em carteira ações, debêntures e títulos públicos federais (LFT e NTN-B). Sobre as infraestruturas em que esses ativos são registrados, custodiados e liquidados, é correto afirmar que:", "alternativas": ["todos os ativos, inclusive títulos públicos federais, são custodiados exclusivamente no Selic", "o Selic é a câmara de ações da B3 e a taxa Selic é definida pela própria B3", "as debêntures são liquidadas no SPI, pois são títulos de dívida privada", "os títulos públicos federais são registrados, custodiados e liquidados no Selic, administrado pelo Banco Central; ações e debêntures ficam na B3"], "correta": 3, "explicacao": "O Selic é o depositário central dos títulos públicos federais e o sistema de liquidação dessas operações, administrado pelo Banco Central, com liquidação entrega contra pagamento. A B3 atua como bolsa, balcão, câmara de compensação, depositária central e registradora para ativos como ações e debêntures. A taxa Selic é a taxa média das operações compromissadas de um dia lastreadas em títulos públicos registradas no sistema Selic."}, {"id": "M1B-025", "modulo": 1, "topico": "1.4.1.2 Sistema de liquidação de títulos: conceitos, atribuições e exemplos", "dificuldade": "medio", "tipo": "mc", "enunciado": "Em uma compra de títulos, o sistema de liquidação adota o mecanismo de entrega contra pagamento (DVP). O principal benefício desse mecanismo é:", "alternativas": ["assegurar a cobertura do FGC caso o emissor do título fique inadimplente", "garantir que o preço do título não oscile até o vencimento", "eliminar o risco de principal, pois o título só é entregue se o pagamento ocorrer, e vice-versa", "dispensar a existência de saldo em reservas para liquidar a operação"], "correta": 2, "explicacao": "No DVP, a transferência do ativo e a do dinheiro ocorrem de forma simultânea e condicionada: nenhuma parte entrega sem receber. Isso elimina o risco de uma das partes cumprir sua obrigação e a outra não. O mecanismo não protege contra oscilação de preço nem contra o risco de crédito do emissor."}, {"id": "M1B-026", "modulo": 1, "topico": "1.4.1.3 Contrapartes centrais / 1.4.5 Impactos do risco da contraparte", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma pessoa investidora compra ações pelo home broker. No dia da liquidação, o vendedor original não entrega os papéis. O que tende a acontecer, considerando a atuação da contraparte central da B3?", "alternativas": ["A investidora recebe as ações normalmente, pois a contraparte central assume a posição de vendedora perante o comprador e usa garantias para cobrir a falha", "O FGC indeniza a investidora até R$ 250 mil", "A operação é cancelada e a investidora precisa processar o vendedor para receber os papéis", "A investidora recebe de volta o dinheiro apenas se o vendedor tiver patrimônio"], "correta": 0, "explicacao": "A contraparte central se interpõe entre as partes, tornando-se compradora de todos os vendedores e vendedora de todos os compradores. Para isso exige garantias e margens e dispõe de mecanismos de salvaguarda, de modo que a falha de um participante não se transmita aos demais. É assim que se mitiga o risco de contraparte, que é alto em operações bilaterais sem garantias."}, {"id": "M1B-027", "modulo": 1, "topico": "1.4.1.4 Depositários centrais: conceitos, atribuições e exemplos", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Um cliente teme perder suas ações caso a corretora em que mantém conta tenha problemas financeiros. A informação correta sobre a guarda desses ativos é:", "alternativas": ["as ações pertencem à corretora até a venda, e o cliente vira credor comum em caso de quebra", "as ações ficam no depositário central da B3, em conta individualizada em nome do investidor, segregadas do patrimônio da corretora", "as ações ficam registradas no Selic, em nome do Banco Central", "as ações são garantidas pelo FGC até R$ 250 mil por CPF"], "correta": 1, "explicacao": "O depositário central mantém a guarda centralizada dos ativos e controla sua titularidade de forma individualizada por investidor final, além de processar eventos como dividendos. A corretora atua como agente de custódia, mas os ativos do cliente não se confundem com o patrimônio dela. Ações não têm cobertura do FGC."}, {"id": "M1B-028", "modulo": 1, "topico": "1.4.1.5 Entidade registradora: conceitos, atribuições e exemplos", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um lojista oferece seus recebíveis de cartão como garantia em um empréstimo. O banco consulta uma entidade registradora antes de liberar o crédito. A função da registradora nesse caso é:", "alternativas": ["custodiar fisicamente o dinheiro do lojista até o vencimento", "definir a taxa de juros máxima da operação de crédito", "atuar como contraparte central, garantindo o pagamento do empréstimo ao banco", "dar publicidade e controle sobre a existência, a titularidade e os ônus dos recebíveis, evitando que sejam cedidos ou dados em garantia mais de uma vez"], "correta": 3, "explicacao": "Registradoras (como B3, CERC e outras autorizadas pelo Banco Central) registram ativos financeiros e operações, dando transparência sobre quem é o titular e se há gravames. Isso reduz fraudes como a dupla cessão e melhora as condições do crédito com garantia. Elas não assumem o risco de crédito da operação."}, {"id": "M1B-029", "modulo": 1, "topico": "1.4.2.1 Comitê de Estabilidade Financeira (Comef), Depósito Compulsório, Linhas Financeiras de Liquidez (LLI e LLT)", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Sobre os instrumentos que o Banco Central utiliza para preservar a estabilidade financeira, é correto afirmar que:", "alternativas": ["o Comef define diretrizes para mitigar riscos sistêmicos; o compulsório pode ser liberado em crises para injetar liquidez; LLI e LLT são linhas de liquidez, intradia e a termo, concedidas mediante garantias", "o compulsório é um tributo cobrado dos bancos e não afeta a liquidez do sistema", "as linhas LLI e LLT são empréstimos sem garantia concedidos a pessoas físicas em dificuldade", "o Comef é o comitê que define a meta da taxa Selic a cada 45 dias"], "correta": 0, "explicacao": "O Comitê de Estabilidade Financeira (Comef), do Banco Central, estabelece diretrizes e estratégias para preservar a estabilidade financeira e mitigar o risco sistêmico. O depósito compulsório, além de instrumento monetário, funciona como colchão que pode ser liberado em momentos de estresse. As linhas financeiras de liquidez permitem às instituições obter recursos do Banco Central, intradia (LLI) ou a termo (LLT), com lastro em ativos. Quem define a meta da Selic é o Copom."}, {"id": "M1B-030", "modulo": 1, "topico": "1.4.3.1 Definição de risco sistêmico", "dificuldade": "facil", "tipo": "mc", "enunciado": "A quebra de um grande banco leva outras instituições, que tinham créditos a receber dele, a enfrentar dificuldades, e a desconfiança se espalha pelo mercado. Esse fenômeno é chamado de:", "alternativas": ["risco de mercado", "risco operacional", "risco de liquidez de mercado de um único ativo", "risco sistêmico"], "correta": 3, "explicacao": "Risco sistêmico é a possibilidade de que a falha de um participante ou de uma infraestrutura se propague (efeito contágio) e comprometa o funcionamento de todo o sistema financeiro e, por consequência, a economia real. Regulação prudencial, IMFs robustas e linhas de liquidez existem para contê-lo."}, {"id": "M1B-031", "modulo": 1, "topico": "1.4.3.2 Índice de Basileia I, II e III e os principais riscos (liquidez e alavancagem)", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Após a crise financeira de 2008, Basileia III reforçou a regulação bancária. Entre suas principais inovações em relação aos acordos anteriores, está:", "alternativas": ["a eliminação da exigência de capital para risco operacional", "a introdução, pela primeira vez, de um capital mínimo de 8% dos ativos ponderados pelo risco de crédito", "a criação de indicadores de liquidez (como o LCR e o NSFR), de colchões adicionais de capital e de um limite de alavancagem não ponderado pelo risco", "a criação dos três pilares: requisitos de capital, supervisão e disciplina de mercado"], "correta": 2, "explicacao": "Basileia I (1988) criou o capital mínimo de 8% sobre ativos ponderados pelo risco de crédito; Basileia II estruturou os três pilares e incluiu o risco operacional. Basileia III melhorou a qualidade do capital, criou colchões (de conservação e contracíclico), a razão de alavancagem e os índices de liquidez de curto (LCR) e de longo prazo (NSFR), para evitar crises de liquidez e alavancagem excessiva que afetem a economia real."}, {"id": "M1B-032", "modulo": 1, "topico": "1.4.3.2 Índice de Basileia I, II e III", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um banco possui patrimônio de referência de R$ 12 bilhões e ativos ponderados pelo risco de R$ 100 bilhões. Sobre o índice de Basileia dessa instituição, é correto afirmar que:", "alternativas": ["é de 12%, o que indica que o banco pode emprestar no máximo 12% de seus depósitos", "é de 12%, ou seja, o banco tem R$ 12 de capital para cada R$ 100 de ativos ponderados pelo risco", "é de 8,33%, pois se divide o ativo pelo capital", "é de 12%, o que significa que 12% dos depósitos estão garantidos pelo FGC"], "correta": 1, "explicacao": "Índice de Basileia = patrimônio de referência / ativos ponderados pelo risco = 12 / 100 = 12%. Ele mede a solvência: quanto capital próprio o banco tem para absorver perdas em relação aos riscos assumidos. Quanto maior o índice, maior a capacidade de absorver perdas."}, {"id": "M1B-033", "modulo": 1, "topico": "1.4.4 Clearings houses e suas principais funções no mercado financeiro", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Em um dia, o Banco A deve R$ 100 milhões ao Banco B, o Banco B deve R$ 80 milhões ao Banco C e o Banco C deve R$ 50 milhões ao Banco A. Com a compensação multilateral feita por uma clearing, as posições líquidas a liquidar são:", "alternativas": ["A paga R$ 100 milhões; B paga R$ 80 milhões; C paga R$ 50 milhões", "A paga R$ 50 milhões; B paga R$ 20 milhões; C recebe R$ 70 milhões", "A paga R$ 50 milhões; B recebe R$ 20 milhões; C recebe R$ 30 milhões", "A recebe R$ 50 milhões; B paga R$ 20 milhões; C paga R$ 30 milhões"], "correta": 2, "explicacao": "Saldo de cada um: A = −100 + 50 = −50; B = +100 − 80 = +20; C = +80 − 50 = +30 (a soma é zero). Em vez de movimentar R$ 230 milhões brutos, liquidam-se só R$ 50 milhões. A compensação (netting) multilateral, junto com a gestão de garantias e a liquidação, é função central das clearings e reduz necessidade de liquidez e riscos."}, {"id": "M1B-034", "modulo": 1, "topico": "1.4.7 Portabilidades de custódia entre instituições", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma cliente quer levar suas ações e debêntures de uma corretora para outra. Ela pensa em vender tudo e recomprar na nova instituição. A orientação mais adequada é:", "alternativas": ["solicitar a transferência de custódia, que mantém a titularidade e o custo de aquisição sem configurar venda, evitando IR sobre ganhos e custos de negociação", "aguardar o vencimento das debêntures, pois a portabilidade só vale para ações", "pedir à nova corretora que compre os mesmos ativos, já que a custódia não pode ser transferida", "vender e recomprar, pois a transferência de custódia é tributada como alienação"], "correta": 0, "explicacao": "A portabilidade (transferência) de custódia move os ativos entre instituições sem mudança de titular, por isso não é alienação e não gera IR; a data e o custo de aquisição são preservados. Vender e recomprar pode gerar imposto, custos de corretagem, exposição a variações de preço e, na renda fixa, reinício da contagem do prazo da tabela regressiva."}, {"id": "M1B-035", "modulo": 1, "topico": "1.4.8 Desintermediação financeira", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma empresa, em vez de tomar um empréstimo bancário, emite debêntures compradas diretamente por investidores, com um banco atuando apenas como coordenador da oferta. Esse movimento caracteriza:", "alternativas": ["uma operação garantida pelo FGC, pois foi coordenada por um banco", "intermediação financeira tradicional, pois há um banco participando da operação", "uma operação de política monetária, pois reduz o compulsório", "desintermediação financeira: o investidor assume diretamente o risco de crédito da empresa, e o banco não carrega a dívida em seu balanço"], "correta": 3, "explicacao": "Na intermediação tradicional, o banco capta (por exemplo, via CDB) e empresta, assumindo o risco de crédito. Na desintermediação, que ocorre no mercado de capitais, os recursos fluem diretamente do investidor para a empresa; o banco presta serviços de estruturação e distribuição. Em geral reduz o custo para o emissor, mas o investidor assume o risco do emissor, sem FGC."}, {"id": "M1B-036", "modulo": 1, "topico": "1.4.9 BSM (supervisão de mercados)", "dificuldade": "medio", "tipo": "mc", "enunciado": "Uma pessoa investidora reclama que sua corretora executou uma ordem de compra de ações em quantidade diferente da solicitada, causando prejuízo. Outra reclama que perdeu dinheiro porque as ações que escolheu caíram. Em relação ao Mecanismo de Ressarcimento de Prejuízos (MRP), administrado pela BSM:", "alternativas": ["apenas o segundo caso é coberto, pois a queda de preço é risco de mercado", "apenas o primeiro caso pode ser objeto de pedido de ressarcimento, pois decorre de ação ou omissão de participante; oscilação de mercado não é coberta", "nenhum dos casos é coberto, pois o MRP atende apenas investidores profissionais", "os dois casos são cobertos, pois o MRP garante o capital investido em bolsa"], "correta": 1, "explicacao": "A BSM Supervisão de Mercados fiscaliza os participantes e as operações dos mercados da B3, apura irregularidades e administra o MRP. O MRP ressarce prejuízos causados por ação ou omissão de participantes (por exemplo, execução infiel de ordens), dentro de limites e regras próprias. Perdas decorrentes do risco de mercado das decisões de investimento não são cobertas."}, {"id": "M1B-037", "modulo": 1, "topico": "1.4.10.1.2 Definição do tipo de pessoa investidora e regras de enquadramento, segundo a Resolução CVM 30", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente pessoa física possui R$ 1,5 milhão em aplicações financeiras e quer acessar um fundo destinado a investidores qualificados. Segundo a Resolução CVM 30, o procedimento correto é:", "alternativas": ["recusar o acesso, pois só pessoas jurídicas podem ser qualificadas", "enquadrá-lo como investidor profissional, pois tem mais de R$ 1 milhão", "enquadrá-lo como investidor qualificado, mediante declaração por escrito em termo próprio atestando essa condição", "enquadrá-lo automaticamente como qualificado, sem necessidade de declaração"], "correta": 2, "explicacao": "Pela Resolução CVM 30, pessoas naturais ou jurídicas com mais de R$ 1 milhão em aplicações financeiras são investidores qualificados, desde que atestem essa condição por escrito em termo próprio. A condição de investidor profissional exige mais de R$ 10 milhões (também com declaração) ou enquadramento em categorias específicas."}, {"id": "M1B-038", "modulo": 1, "topico": "1.4.10.1.1 Definições: pessoas investidoras qualificadas, profissionais e não residentes", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Segundo a Resolução CVM 30, qual das situações abaixo corresponde a um investidor profissional?", "alternativas": ["Qualquer cliente que já tenha investido em ações por mais de cinco anos", "Um investidor não residente, ou uma seguradora, independentemente do valor aplicado", "Uma pessoa física com R$ 2 milhões em aplicações que assinou termo próprio", "Uma pessoa física aprovada em exame de certificação reconhecido pela CVM, em relação a recursos de terceiros"], "correta": 1, "explicacao": "São investidores profissionais, entre outros: instituições financeiras, seguradoras e sociedades de capitalização, entidades fechadas de previdência complementar, fundos de investimento, investidores não residentes e pessoas com mais de R$ 10 milhões em aplicações que atestem essa condição. Quem tem entre R$ 1 milhão e R$ 10 milhões, ou é aprovado em certificações reconhecidas pela CVM (quanto a recursos próprios), é qualificado, não profissional."}, {"id": "M1B-039", "modulo": 1, "topico": "1.4.11 Lei de Liberdade Econômica (Lei 13.874/19)", "dificuldade": "medio", "tipo": "mc", "enunciado": "A Lei de Liberdade Econômica (Lei 13.874/2019) teve impacto direto na indústria de fundos ao incluir dispositivos no Código Civil. Entre eles, é correto citar:", "alternativas": ["a extinção da necessidade de regulamentação dos fundos pela CVM", "a obrigatoriedade de todos os fundos terem liquidez diária", "a garantia do FGC para cotas de fundos de investimento", "a definição do fundo como condomínio de natureza especial e a possibilidade de limitar a responsabilidade do cotista ao valor de suas cotas e de criar classes com patrimônio segregado"], "correta": 3, "explicacao": "A lei, que estabelece garantias de livre mercado (como a presunção de boa-fé do particular e a intervenção subsidiária do Estado), incluiu no Código Civil regras sobre fundos de investimento: condomínio de natureza especial, responsabilidade limitada dos cotistas e classes de cotas com patrimônio segregado. Essas bases foram regulamentadas pela CVM na Resolução 175."}, {"id": "M1B-040", "modulo": 1, "topico": "1.4.12.1.1 Código ANBIMA de Distribuição: objetivo e abrangência", "dificuldade": "facil", "tipo": "mc", "enunciado": "Uma instituição que não é associada à ANBIMA aderiu voluntariamente ao Código de Distribuição de Produtos de Investimento. Em relação a essa instituição, é correto afirmar que:", "alternativas": ["como instituição aderente, passa a ser obrigada a cumprir as regras do Código, assim como as associadas", "a adesão é simbólica e não gera obrigações de cumprimento", "o Código só se aplica a ela na distribuição de fundos de investimento", "por não ser associada, ela fica sujeita apenas às regras de publicidade"], "correta": 0, "explicacao": "O Código busca elevar os padrões éticos e fiduciários, promover transparência, concorrência leal e padronização de procedimentos na distribuição de produtos de investimento. Aplica-se às instituições participantes, associadas ou aderentes; ao aderir, a instituição se compromete a cumprir integralmente suas regras e fica sujeita à supervisão da ANBIMA."}, {"id": "M1B-041", "modulo": 1, "topico": "1.4.12.1.2 Princípios gerais de conduta", "dificuldade": "medio", "tipo": "mc", "enunciado": "No fim do mês, um gerente com meta a cumprir pensa em recomendar a um cliente conservador um produto da própria instituição, de risco elevado, porque a remuneração da área é maior. Considerando os princípios gerais de conduta do Código ANBIMA, a conduta adequada é:", "alternativas": ["recomendar o produto sem mencionar riscos, para não assustar o cliente", "recomendar apenas produtos adequados ao cliente, agindo com boa-fé, lealdade, diligência e transparência, e evitar ou informar conflitos de interesse", "recomendar o produto, desde que o cliente assine a ficha cadastral", "priorizar a meta, pois o Código não trata de conflitos de interesse"], "correta": 1, "explicacao": "O Código exige que as instituições e seus profissionais atuem com boa-fé, transparência, diligência e lealdade com os investidores, evitando práticas que possam ferir a relação fiduciária e identificando e mitigando (ou informando) conflitos de interesse. Metas comerciais não justificam recomendar produto incompatível com o perfil do cliente."}, {"id": "M1B-042", "modulo": 1, "topico": "1.4.12.1.3 Regras gerais de distribuição de produtos de investimento", "dificuldade": "facil", "tipo": "mc", "enunciado": "Segundo as regras gerais do Código ANBIMA de Distribuição, antes de oferecer um produto de investimento à clientela, a instituição deve:", "alternativas": ["garantir ao investidor a rentabilidade divulgada do produto", "dispensar as políticas internas quando o produto for de emissão própria", "permitir que qualquer funcionário, certificado ou não, faça recomendações", "conhecer o produto, ter profissionais devidamente certificados e disponibilizar ao investidor informações claras sobre características, custos e riscos"], "correta": 3, "explicacao": "As regras gerais exigem que as instituições tenham estrutura, políticas e controles para a distribuição, que os profissionais que atuam nela tenham certificação compatível e que o investidor receba informações suficientes e claras (características, riscos, custos, documentos do produto) para decidir. Não se admite promessa de rentabilidade."}, {"id": "M1B-043", "modulo": 1, "topico": "1.4.12.1.3.1 Conheça sua clientela", "dificuldade": "medio", "tipo": "mc", "enunciado": "Um cliente que declarou renda mensal de R$ 6 mil passa a receber depósitos frequentes de R$ 200 mil e pede para aplicar tudo em produtos de alta liquidez. Considerando as regras de conheça sua clientela, a conduta adequada da instituição é:", "alternativas": ["aplicar os recursos imediatamente, pois a renda declarada não precisa ser compatível com o patrimônio", "encerrar a conta sem qualquer análise", "atualizar as informações cadastrais, verificar a origem e a compatibilidade dos recursos e, havendo indícios de atipicidade, adotar os procedimentos de PLD, inclusive comunicação ao Coaf quando cabível", "informar ao cliente que ele está sob suspeita e que será comunicado ao Coaf"], "correta": 2, "explicacao": "O conheça sua clientela exige identificar o investidor, conhecer sua situação financeira e patrimonial e a origem dos recursos, mantendo o cadastro atualizado e monitorando movimentações. Incompatibilidades devem ser analisadas e, se houver indícios, comunicadas às autoridades sem dar ciência ao cliente."}, {"id": "M1B-044", "modulo": 1, "topico": "1.4.12.1.3.2 Suitability", "dificuldade": "medio", "tipo": "mc", "enunciado": "Para definir o perfil de uma nova cliente, a pessoa profissional aplica o questionário de suitability. Quais informações devem ser consideradas?", "alternativas": ["Objetivos de investimento (prazo, preferências de risco e finalidade), situação financeira (renda, patrimônio e necessidade de recursos) e conhecimento sobre produtos e mercado", "A rentabilidade desejada e os produtos que a instituição precisa vender no mês", "Somente a tolerância a risco declarada, sem considerar prazo ou patrimônio", "Apenas a renda mensal e a idade da cliente"], "correta": 0, "explicacao": "A análise de perfil considera três dimensões: os objetivos (período de investimento, preferências quanto a risco e finalidade), a situação financeira (renda, patrimônio, necessidade futura de recursos) e o conhecimento (experiência com produtos, formação e atuação profissional). Avaliar só uma dimensão pode levar a recomendações inadequadas."}, {"id": "M1B-045", "modulo": 1, "topico": "1.4.12.1.3.2 Suitability", "dificuldade": "dificil", "tipo": "mc", "enunciado": "Um cliente com perfil conservador, definido há mais de 24 meses e não atualizado, liga pedindo, por iniciativa própria, para aplicar em um fundo multimercado de alto risco. A conduta correta da instituição é:", "alternativas": ["executar a ordem normalmente, pois a iniciativa foi do cliente", "reclassificar o cliente como arrojado por conta própria, para que o produto fique adequado", "recusar definitivamente a operação, pois clientes conservadores não podem investir em produtos de risco", "alertar que o perfil está desatualizado e que o produto é inadequado e, se o cliente mantiver a decisão, obter sua declaração expressa de ciência antes de executar a ordem; e buscar atualizar o perfil"], "correta":
